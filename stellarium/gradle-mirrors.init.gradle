// CI-only Gradle init script for androiddeployqt's generated Gradle project.
// Maven Central sometimes returns incomplete POM hierarchies in CI.
// Add read-only public mirrors before the generated build.gradle repositories.
def mavenMirrors = [
    'https://maven-central.storage-download.googleapis.com/maven2/',
    'https://maven.aliyun.com/repository/central'
]
gradle.beforeSettings { settings ->
    settings.pluginManagement.repositories {
        mavenMirrors.each { mirror -> maven { url = uri(mirror) } }
    }
}
gradle.beforeProject { project ->
    project.buildscript.repositories {
        mavenMirrors.each { mirror -> maven { url = uri(mirror) } }
    }
    project.repositories {
        mavenMirrors.each { mirror -> maven { url = uri(mirror) } }
    }
}
