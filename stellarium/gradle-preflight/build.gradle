// Resolve the exact Android Gradle Plugin classpath BEFORE the long C++ build.
// Qt 6.8.3 androiddeployqt generates a Gradle build using AGP 8.6.0.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
    }
}
tasks.register('preflightAndroidDependencies') {
    doLast { println 'PASS: Android Gradle Plugin 8.6.0 Maven classpath resolved' }
}
