name: DRNAS R172 utility-budget audit-only recovery existing 150 trials
on:
  push:
    branches: [experiment/drnas-r172-utility-budget-general-20261106]
    paths:
      - '.github/workflows/drnas-r172-utility-budget-audit-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-recovery:
    name: Replay 5 existing R172 shards and compare Gaussian CPU work
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r155-original25-pinned-native-and-independent-smoke
          run-id: 42112755104
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r172
      - uses: actions/download-artifact@v4
        with:
          pattern: r172-first-used-shard-*
          run-id: 42168803325
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          merge-multiple: true
          path: r172
      - name: Strict source-proof audit existing 150 paired R172 attempts
        run: |
          set -euo pipefail
          test "$(find r172 -maxdepth 1 -name 'shard-*.json' | wc -l)" -eq 5
          python3 -u research/r172_utility_budget_benchmark.py audit | tee r172/audit.log
          grep -q '^R172_FINAL ' r172/audit.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("r172/report.json").read_text())
          assert r["status"]=="R172_RESEARCH_PAIRED_AUDIT_PASS_NOT_BLIND"
          assert r["original_formulas"]==25 and r["attempts"]==150
          assert len(r["paired_comparisons"])==100
          assert r["source_certificates_replayed"] and r["original_sha_verified"]
          assert all(p["finite_speedup"] is None for p in r["paired_comparisons"] if p["baseline_status"]=="TIMEOUT" or p["variant_status"]=="TIMEOUT")
          for mode in ("clean","direct_two_way_newonly","direct_two_way_budget"):
              assert r["results"][mode]["trials"]==50
          assert r["results"]["clean"]["two_way_sweeps"]==0
          print("R172_RECOVERY_AUDIT_PASS")
          a=r["results"]["direct_two_way_newonly"]
          b=r["results"]["direct_two_way_budget"]
          def pct(x,y):
              return round((x-y)*100/x,3) if x else None
          print("R172_UTILITY_COMPARISON",json.dumps({
              "newonly":a,"budget":b,
              "sweep_reduction_pct":pct(a["two_way_sweeps"],b["two_way_sweeps"]),
              "GF2_cpu_reduction_pct":pct(a["GF2_processing_ns"],b["GF2_processing_ns"]),
              "GF2_milliseconds_newonly":round(a["GF2_processing_ns"]/1e6,4),
              "GF2_milliseconds_budget":round(b["GF2_processing_ns"]/1e6,4),
              "net_wall_savings_s":round(a["wall_s"]-b["wall_s"],6),
              "PAR2_savings_s":round(a["PAR2_s"]-b["PAR2_s"],6)
          },sort_keys=True))
          PY
          cat r172/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R172-GF2-UTILITY-BUDGET-AUDIT-RECOVERED-150
          path: |
            r172/report.json
            r172/summary.md
            r172/audit.log
          if-no-files-found: warn
          retention-days: 90
