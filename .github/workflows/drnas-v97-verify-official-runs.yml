name: DRNAS V9.7 — Verify Official Submission Run Command and Binary
on:
  push:
    branches: [experiment/drnas-sat-v97-official-competitors-same-hardware-20261031]
    paths: ['.github/workflows/drnas-v97-verify-official-runs.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  inspect-wrapper:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-v97-official-competitor-source-metadata
          run-id: 41239150088
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: archives
      - name: Inspect original official execution scripts exactly
        shell: bash
        run: |
          set -euo pipefail
          for author in zhenwei ding liang biere; do
            mkdir -p "raw-$author"
            tar -xf "archives/$author.tar.xz" -C "raw-$author" --no-same-owner --no-same-permissions
          done
          for target in mergesat-l mergesat; do
            src="raw-zhenwei/zhenwei/$target/src"
            echo "===== $target original-run.sh ====="
            cat "$src/original-run.sh"
            echo "===== $target src/build/build.sh ====="
            sed -n '1,110p' "$src/build/build.sh"
            echo "===== prebuilt ====="
            ls -l "$src/kissat" "$src/build/kissat/build/kissat" 2>/dev/null || true
          done
          for spec in 'ding/kissat-mab-eae2' 'liang/kissat-lr-ds' 'biere/cadical3'; do
            src="raw-$spec/src"
            echo "===== $spec original-run.sh ====="
            cat "$src/original-run.sh" || true
            echo "===== $spec build.sh ====="
            sed -n '1,60p' "$src/build.sh" || true
          done
