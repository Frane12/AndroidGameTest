name: DRNAS V9.7 — Inspect Exact SAT Competition 2026 Solver Sources
on:
  push:
    branches: [experiment/drnas-sat-v97-official-competitors-same-hardware-20261031]
    paths: ['.github/workflows/drnas-v97-competitor-source-inspection.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-official-solver-archives:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download exact official 2026 Main Track author source bundles and inspect layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p competitors
          for author in zhenwei ding liang biere; do
            echo "::group::OFFICIAL_ARCHIVE_$author"
            url="https://satcompetition.github.io/2026/downloads/solvers/$author.tar.xz"
            echo "ARCHIVE_URL=$url"
            curl --fail --location --retry 3 --max-time 90 --silent --show-error "$url" -o "competitors/$author.tar.xz"
            sha256sum "competitors/$author.tar.xz"
            du -h "competitors/$author.tar.xz"
            echo "ARCHIVE_FILE_LIST_BEGIN"
            tar -tf "competitors/$author.tar.xz" | head -85 || true
            echo "ARCHIVE_FILE_LIST_END"
            mkdir -p "competitors/$author"
            tar -xf "competitors/$author.tar.xz" -C "competitors/$author" --no-same-owner --no-same-permissions
            echo "BUILD_HINTS"
            find "competitors/$author" -maxdepth 5 -type f \( -iname "*readme*" -o -name "configure" -o -name "build.sh" -o -name "makefile" -o -name "Makefile" -o -name "*.md" -o -name "solver.sh" -o -name "run.sh" \) | head -65 || true
            echo "ROOT_FILES"
            find "competitors/$author" -maxdepth 3 -type f | head -60 || true
            echo "READMES"
            find "competitors/$author" -maxdepth 3 -type f \( -iname "*readme*" -o -name "build.sh" -o -name "solver.sh" -o -name "run.sh" \) | head -10 | while read -r f; do echo "<<<$f>>>"; head -55 "$f" || true; done
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-v97-official-competitor-source-metadata
          path: competitors/*.tar.xz
          if-no-files-found: warn
