name: DRNAS ONE2 single frozen CNF
run-name: ONE2 single CNF 5 repeats A one2 Kissat 40s oneCPU
on:
  push:
    branches: [experiment/drnas-one2-cached-blocker-20261110]
    paths:
      - research/drnas_native_core_r3c.cpp
      - research/drnas_factor42_native.cpp
      - research/drnas_one2.py
      - .github/workflows/drnas-one2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install compiler and verify source manifest
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_one2.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential
      - name: Restore pinned Kissat binary
        id: cache
        uses: actions/cache@v4
        with:
          path: .reference-solvers/bin/kissat
          key: watch1-ubuntu2404-kissat-8af8e56f174b778aef3aa45af9f739b2a5f492c2-v1
      - name: Build pinned Kissat only on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .reference-solvers/bin
          git clone --quiet https://github.com/arminbiere/kissat.git .reference-solvers/kissat-src
          git -C .reference-solvers/kissat-src checkout --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          (cd .reference-solvers/kissat-src && ./configure && make -j2)
          install -m 755 .reference-solvers/kissat-src/build/kissat .reference-solvers/bin/kissat
      - name: Compile baseline and cached blocker
        run: |
          set -euo pipefail
          mkdir -p mre_one2/bin
          g++ -std=c++17 -O2 research/drnas_factor42_native.cpp -o mre_one2/bin/drnas_baseline
          g++ -std=c++17 -O2 -DDRNAS_ONE2_BLOCKER research/drnas_factor42_native.cpp -o mre_one2/bin/drnas_one2
          # Correctness gates: independent brute-force checks, including
          # SAT/UNSAT and native GF(2), for uninstrumented and diagnostic builds.
          g++ -std=c++17 -O2 research/drnas_native_core_r3c.cpp -o mre_one2/bin/r3c_selftest
          g++ -std=c++17 -O2 -DDRNAS_ONE2_BLOCKER research/drnas_native_core_r3c.cpp -o mre_one2/bin/one2_selftest
          mre_one2/bin/r3c_selftest --selftest
          mre_one2/bin/one2_selftest --selftest
          install -m 755 .reference-solvers/bin/kissat mre_one2/bin/kissat
          ldd mre_one2/bin/kissat | tee mre_one2/kissat.ldd
          ! grep -q 'not found' mre_one2/kissat.ldd
      - name: Run one source-frozen CNF x five repeats x A one2 Kissat
        run: |
          set -euo pipefail
          taskset -c "$(taskset -pc $$ | sed 's/.*: //' | cut -d, -f1 | cut -d- -f1)" \
            python3 -u research/drnas_one2.py | tee mre_one2/benchmark.log
          grep -q '^ONE2_FINAL ' mre_one2/benchmark.log
          grep '^ONE2_FINAL ' mre_one2/benchmark.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-ONE2-ONE-CNF-5REPS-AUDIT
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_one2/audit.json
            mre_one2/sources.json
            mre_one2/*.cnf
            mre_one2/*.log
