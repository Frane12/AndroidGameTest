name: DRNAS SAT V8.7 Guarded Adaptive New Seeds
on:
  push:
    branches:
      - experiment/drnas-sat-v87-guarded-adaptive-20261031
    paths:
      - '.github/workflows/drnas-sat-v87-guarded.yml'
      - 'research/drnas-sat-v7-8/blind_v87_guarded.py'
      - 'research/drnas-sat-v7-8/v87_guarded_probe.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blind-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify frozen legacy solvers and compile separate guarded v8.7 experiment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/blind_v87_guarded.py
          test "$(git hash-object research/drnas-sat-v7-6/v76_single.cpp)" = a254356a45b70f02f33b9506f1122dad33916ca7
          test "$(git hash-object research/drnas-sat-v7-7/v77_single.cpp)" = 1bbb7fa035e62d5179de9243f672aed9bb9cbaca
          test "$(git hash-object research/drnas-sat-v7-8/v80_hybrid_probe.cpp)" = 208c8641c311fcb0940259c4ff2bc1c1e0f23838
          mkdir -p blind-v87-guarded-results
          sha256sum research/drnas-sat-v7-6/v76_single.cpp research/drnas-sat-v7-7/v77_single.cpp research/drnas-sat-v7-8/v87_guarded_probe.cpp > blind-v87-guarded-results/source_hashes.txt
          python3 - <<'PY'
          from pathlib import Path
          src=Path('research/drnas-sat-v7-7/v77_single.cpp').read_text()
          marker='\nint main(int argc,char**argv) {'
          assert src.count(marker)==1
          pre=src.split(marker,1)[0]
          assert 'static V77 solve77(' in pre
          Path('research/drnas-sat-v7-7/v77_embedded_functions.inc').write_text(pre+'\n')
          PY
          git clone --depth 1 --branch rel-3.0.1 https://github.com/arminbiere/cadical.git cadical-src
          test "$(git -C cadical-src rev-parse HEAD)" = c60730422e758ef1cebe7aeddf2dda31c996bf04
          (cd cadical-src && ./configure && make -j2 > /tmp/ca-build.log 2>&1) || { tail -100 /tmp/ca-build.log; exit 1; }
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -I cadical-src/src \
            research/drnas-sat-v7-8/v87_guarded_probe.cpp \
            cadical-src/build/libcadical.a -o v87_guarded_probe -pthread -ldl -lz
          lscpu > blind-v87-guarded-results/cpu.txt
      - name: Run v8.7 guarded on 14 new CNFs, 3 repeats, 3-second cap
        shell: bash
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/blind_v87_guarded.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V87-guarded-newseed-results
          path: blind-v87-guarded-results/
          if-no-files-found: warn
