name: DRNAS V14.0 - Native Exact PHP + Real SAT 2024 Regression
on:
  push:
    branches: [experiment/drnas-v140-native-php-real-20261101]
    paths:
      - '.github/workflows/drnas-sat-v140-native-php-real.yml'
      - 'research/drnas-sat-v7-8/v140_native_hybrid.cpp'
      - 'research/drnas-sat-v7-8/v140_evaluate.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate 8 new PHP generators and exact proof verification
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/v140_evaluate.py
          python3 -u research/drnas-sat-v7-8/v140_evaluate.py selftest
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V139-new-SC2024-12-frozen-verified-CNFs
          run-id: 41261415700
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior2024
      - name: Freeze eight new SHA-distinct PHP and twelve historical true 2024 CNFs
        run: |
          set -euo pipefail
          (cd prior2024 && sha256sum -c v139_manifest.sha256 && sha256sum -c v139_selector.sha256)
          mkdir -p frozen
          python3 -u research/drnas-sat-v7-8/v140_evaluate.py freeze \
            --real prior2024/v139_manifest.json --out frozen/v140_manifest.json
          (cd frozen && sha256sum v140_manifest.json > v140_manifest.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-V140-8-PHP-plus-12-SC2024-frozen-manifest
          path: frozen/
          if-no-files-found: error

  build:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V139-Native-and-three-pinned-solvers
          run-id: 41262018219
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: original
      - name: Compile PHP/GF2 exact native hybrid and pin all old C++ solvers
        run: |
          set -euo pipefail
          (cd original && sha256sum -c binaries.sha256)
          mkdir -p output
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -pedantic \
            research/drnas-sat-v7-8/v140_native_hybrid.cpp -o output/v140_native
          cp original/v139_native output/v139_native
          cp original/v76_solver output/v76_solver
          cp original/legacy_solver output/legacy_solver
          cp original/kissat_solver output/kissat_solver
          chmod +x output/v140_native output/v139_native output/v76_solver \
            output/legacy_solver output/kissat_solver
          (cd output && sha256sum v140_native v139_native v76_solver legacy_solver kissat_solver > binaries.sha256)
      - name: Exact PHP, XOR and negative near-miss safety probes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,"research/drnas-sat-v7-8")
          import v140_evaluate as suite
          import v761_xor_holdout as xor
          import v137_fastpath as verified
          import v134_constructive as source
          native=str(Path("output/v140_native").resolve())
          v76=str(Path("output/v76_solver").resolve())
          def run(raw,probe=False):
              path=Path("/tmp/v140-smoke.cnf");path.write_bytes(raw)
              cmd=[native,str(path),v76,"1402026"]+(["--classify-only"] if probe else [])
              p=subprocess.run(cmd,capture_output=True,text=True,timeout=10)
              assert p.returncode==0,(p.stdout,p.stderr)
              return p.stdout
          for i in range(8):
              meta,raw=suite.php(i)
              text=run(raw)
              xs=[line for line in text.splitlines() if line.startswith("DRNAS_HYBRID_RESULT\t")]
              assert len(xs)==1,(i,text)
              d=json.loads(xs[0].split("\t",1)[1])
              assert d["status"]=="UNSAT" and d["path"]=="pigeonhole_exact"
              n,cs=verified.read_dimacs(raw)
              assert verified.verify(n,cs,d),(i,d)
              # A single missing capacity clause invalidates the complete
              # encoding certificate, regardless of the true SAT label.
              altered=source.dimacs(n,cs[:-1])
              assert "DRNAS_HYBRID_ROUTE\tfallback_v76" in run(altered,True)
              extra=source.dimacs(n,cs+[(1,)])
              assert "DRNAS_HYBRID_ROUTE\tfallback_v76" in run(extra,True)
              duplicate=source.dimacs(n,cs+[cs[-1]])
              assert "DRNAS_HYBRID_ROUTE\tfallback_v76" in run(duplicate,True)
          for i in (0,5,18,47):
              meta,raw=xor.make(i)
              output=run(raw)
              xs=[line for line in output.splitlines() if line.startswith("DRNAS_HYBRID_RESULT\t")]
              assert len(xs)==1
              d=json.loads(xs[0].split("\t",1)[1])
              assert d["path"]=="affine_exact" and d["status"]==meta["official_label"]
              n,cs=verified.read_dimacs(raw)
              assert verified.verify(n,cs,d)
          for family in ("planted3_sat","color3_sat"):
              meta,raw=source.make(family,0)
              assert "DRNAS_HYBRID_ROUTE\tfallback_v76" in run(raw,True)
          print("V140_NATIVE_SAFETY_PASS 8 PHP certificates + 24 negative + 4 XOR + 2 fallback")
          PY
          (cd output && sha256sum -c binaries.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-V140-Native-PHP-and-pinned-baselines
          path: output/
          if-no-files-found: error

  php:
    needs: [freeze,build]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    name: v140-php-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V140-8-PHP-plus-12-SC2024-frozen-manifest
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V140-Native-PHP-and-pinned-baselines
          path: bin
      - name: SHA-check pinned manifest and solver binaries
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v140_manifest.sha256)
          (cd bin && sha256sum -c binaries.sha256)
          chmod +x bin/v140_native bin/v139_native bin/v76_solver bin/legacy_solver bin/kissat_solver
      - name: Four-way 30s paired new PHP measurements with exact certificate
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/v140_evaluate.py php \
            --manifest frozen/v140_manifest.json --shard "$SHARD" \
            --v140 bin/v140_native --v139 bin/v139_native --v76 bin/v76_solver \
            --legacy bin/legacy_solver --kissat bin/kissat_solver --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v140-php-${{ matrix.shard }}
          path: results/
          if-no-files-found: warn

  real:
    needs: [freeze,build]
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5]
    name: v140-real-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V140-8-PHP-plus-12-SC2024-frozen-manifest
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V140-Native-PHP-and-pinned-baselines
          path: bin
      - name: SHA-check pinned manifest and solver binaries
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v140_manifest.sha256)
          (cd bin && sha256sum -c binaries.sha256)
          chmod +x bin/v140_native bin/v139_native bin/v76_solver bin/legacy_solver bin/kissat_solver
      - name: Download SAME twelve verified real SAT Competition 2024 Main CNFs
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/v140_evaluate.py real \
            --manifest frozen/v140_manifest.json --shard "$SHARD" \
            --v140 bin/v140_native --v139 bin/v139_native --v76 bin/v76_solver \
            --legacy bin/legacy_solver --kissat bin/kissat_solver --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v140-real-${{ matrix.shard }}
          path: results/
          if-no-files-found: warn

  audit:
    needs: [freeze,build,php,real]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V140-8-PHP-plus-12-SC2024-frozen-manifest
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: v140-php-*
          path: php
      - uses: actions/download-artifact@v4
        with:
          pattern: v140-real-*
          path: real
      - name: Combine independently SHA-verified PHP and external cohorts
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v140_manifest.sha256)
          mkdir -p combined
          mv php/v140-php-* combined/
          mv real/v140-real-* combined/
          python3 -u research/drnas-sat-v7-8/v140_evaluate.py audit \
            --manifest frozen/v140_manifest.json --combined combined \
            --out v140_report.json --md v140_report.md
          cat v140_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V140-PHP-and-real-2024-strict-final-audit
          path: |
            frozen/
            combined/
            v140_report.json
            v140_report.md
          if-no-files-found: warn
