name: DRNAS REAL2 persist-only replay of verified run 43417272758
on:
  push:
    branches: [experiment/drnas-real2-persist-replay-20261113]
    paths: [.github/workflows/drnas-real2-persist-replay.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: drnas-real2-persist-replay-43417272758
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: experiment/drnas-real-learn2-data-20261113
          path: durable
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          ref: experiment/drnas-real-learn1-data-20261113
          path: original
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: real2-meta
          run-id: 43417272758
          github-token: ${{ github.token }}
          path: meta
      - uses: actions/download-artifact@v4
        with:
          name: real2-frozen-policy
          run-id: 43417272758
          github-token: ${{ github.token }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: real2-final
          run-id: 43417272758
          github-token: ${{ github.token }}
          path: outcome
      - uses: actions/download-artifact@v4
        with:
          pattern: real2-train-*
          run-id: 43417272758
          github-token: ${{ github.token }}
          path: training
      - uses: actions/download-artifact@v4
        with:
          pattern: real2-holdout-*
          run-id: 43417272758
          github-token: ${{ github.token }}
          path: holdout
      - name: Replay exact frozen source identities and persist sealed run; no new solving
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_real_learn2_persist.py
          python3 -u research/drnas_real_learn2_persist.py \
            --root durable/research/memory/real_learn2 \
            --run-id 43417272758 \
            --delta meta/catalog_delta.json \
            --material meta/material_report.json \
            --splits meta/real2_splits.json \
            --policy frozen/fit/real2_policy.json \
            --report outcome/real2_final.json \
            --train-dir training --holdout-dir holdout \
            --old-splits original/research/memory/real_learn1/runs/43400089150/splits.json \
            --engine-source src/drnas_x52.cpp
          git -C durable config user.name 'github-actions[bot]'
          git -C durable config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C durable add research/memory/real_learn2
          git -C durable commit -m 'memory(real2): persist verified train and sealed holdout from frozen run 43417272758'
          git -C durable push origin HEAD:experiment/drnas-real-learn2-data-20261113
          echo REAL2_PERSIST_REPLAY_SUCCESS
