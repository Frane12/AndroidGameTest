name: DRNAS XOR-LIN1 V2 prospective mixed12 original CNFs strict verified PAR2
on:
  push:
    branches: [experiment/drnas-xorlin1-prospective-mixed12b-20261117]
    paths:
      - research/xorlin1_prospective_mixed12/**
      - research/XORLIN1_PROSPECTIVE_MIXED12_PROTOCOL.md
      - .github/workflows/drnas-xorlin1-prospective-mixed12.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-xorlin1-prospective-mixed12b-20261117
  cancel-in-progress: true
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download unchanged original 107-source historical manifests and reference binaries
        uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 44053818490
          name: xorlin1-original10-frozen-sources-binaries-and-protocol
          github-token: ${{ github.token }}
          path: prior
      - name: Restore original 107-source manifests, reference solver binaries and standard proof checkers
        run: |
          set -euo pipefail
          test -s prior/xorlin1-original10-pinned-reference.tgz
          sha256sum prior/xorlin1-original10-pinned-reference.tgz
          tar -xzf prior/xorlin1-original10-pinned-reference.tgz
          test -s unified_realblind100_inputs/manifest.json
          test -s research/graph_unseen25/inputs/manifest.json
          test -s research/graph_family_disjoint25/inputs/manifest.json
          test -s research/xor3_prospective_gbd10/inputs/manifest.json
          test -s research/xor234_prospective_tseitin10/inputs/manifest.json
          test -s unified_evidence_results/protocol.json
          chmod +x build/drnas-sat-native-x59 build/drnas-x59-xor-math5-unified1 \
            build/drnas-unified-core1 build/drnas-pcmax-base \
            build/drnas-pcmax-mg7-ipg1-bdd3 \
            build/kissat build/cadical build/cms build/drat-trim build/frat-rs \
            veripb-tool/bin/veripb
          veripb-tool/bin/veripb --version
      - name: Confirm v2 source lock after v1 resource-only aborted preflight, 12 preregistered GBD hashes, two isohashes each and six-arm protocol
        run: |
          set -euo pipefail
          python3 -m py_compile \
            research/xorlin1_prospective_mixed12/freeze.py \
            research/xorlin1_prospective_mixed12/benchmark.py \
            research/math5/xor3_tseitin_id6.py \
            research/xorlin1/emit_veripb.py \
            research/xorlin1/extract.py \
            research/xorlin1/selftest.py
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path("research/xorlin1_prospective_mixed12/prespec.json")
          pre=json.loads(p.read_text())
          cases=pre["sources"]
          assert pre["selection_type"].startswith("metadata-only")
          assert pre["protocol"]=="DRNAS-XORLIN1-PROSPECTIVE-MIXED12-STRICT-20261117-V2"
          assert pre["no_solver_outcomes_available_before_revision"] is True
          assert pre["prior_resource_only_failed_run"]==44059383179
          assert cases[10]["gbd_hash"]=="ac347c21ca0759079c0be9a758e4e924"
          assert pre["no_source_substitution_after_outcomes"]
          assert len(cases)==12 and {i["id"] for i in cases}==set(range(12))
          assert len({s["gbd_hash"] for s in cases})==12
          assert len({s["isohash"] for s in cases})==12
          assert len({s["isohash2"] for s in cases})==12
          assert set(x["track"] for x in cases)=={"anni_2022","main_2024","handmade_2003"}
          assert len(pre["arms"])==6 and pre["expected_trials"]==144
          print("XORLIN1_MIXED12_PRESPEC_SOURCE_ONLY_SHA256",
                hashlib.sha256(p.read_bytes()).hexdigest(),flush=True)
          PY
      - name: Independent adversarial safety check of unchanged XORLIN1 source GF2 module
        run: |
          set -euo pipefail
          python3 -u research/xorlin1/selftest.py | tee xorlin1_mixed12_safety.log
          grep -q '^XORLIN1_SAFETY_PASS ' xorlin1_mixed12_safety.log
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          reference={
            "research/xorlin1/extract.py":"7deba9716ec2165ff61434c7c326c63d564cecc5c272e9bade679484a7c151a3",
            "research/xorlin1/emit_veripb.py":"f3636b39c9f02a7b0fdfa166b982667c64b6ffb19de64dc2229cdee8a9a4ec07",
            "research/xorlin1/selftest.py":"19147961e174777c970695847d893518d50931377896c6936b606f0d626fd40a",
            "research/math5/check_math5.py":"ebfec304d1823574bbf2530d3e277e468446965362f6a6a6ad7d8371473a381a",
            "research/math5/emit_veripb_xor234_split.py":"f1d7d7e782a9b8db58c711972d034b0b037cd0899f279662fefdc789fcf288d0"
          }
          for name,digest in reference.items():
              assert sha256(Path(name).read_bytes()).hexdigest()==digest,("CERTIFIED_GF2_CODE_CHANGED",name)
          print("XORLIN1_CERTIFIED_ALGORITHM_SHA_FROZEN_PASS",flush=True)
          PY
      - name: Pre-solver SOURCE-ONLY GBD download, SHA256 freeze and 107-old exact/isohash disjointness
        run: |
          set -euo pipefail
          python3 -u research/xorlin1_prospective_mixed12/freeze.py | tee xorlin1_mixed12_freeze.log
          grep -q '^XORLIN1_PROSPECTIVE_SOURCE_FREEZE_COMPLETE ' xorlin1_mixed12_freeze.log
      - name: Freeze full standard checker and reference binary SHA256 protocol BEFORE any new solver trial
        run: |
          set -euo pipefail
          python3 -u research/xorlin1_prospective_mixed12/benchmark.py prepare | tee xorlin1_mixed12_prepare.log
          grep -q '^XORLIN1_MIXED12_PREPARED ' xorlin1_mixed12_prepare.log
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,sys,tarfile,json
          sys.path.insert(0,"research/unified_evidence")
          import benchmark as frozen
          needed=set(frozen.REQUIRED_BIN)
          needed.update({
            "unified_evidence_results/protocol.json",
            "unified_realblind100_inputs/manifest.json",
            "research/graph_unseen25/inputs/manifest.json",
            "research/graph_family_disjoint25/inputs/manifest.json",
            "research/xor3_prospective_gbd10/inputs/manifest.json",
            "research/xor234_prospective_tseitin10/inputs/manifest.json",
            "research/xorlin1_prospective_mixed12/inputs",
            "results/xorlin1_prospective_mixed12/protocol.json"})
          tar=Path("xorlin1-mixed12-frozen-originals.tgz")
          with tarfile.open(tar,"w:gz") as archive:
              for name in sorted(needed):
                  assert Path(name).exists(),("MISSING_FROZEN_REFERENCE",name)
                  archive.add(name,arcname=name,recursive=True)
          with tarfile.open(tar,"r:gz") as archive:
              members=set(archive.getnames())
          absent=sorted(needed-members)
          assert not absent,("INCOMPLETE_ARCHIVE",absent)
          folder=Path("research/xorlin1_prospective_mixed12/inputs")
          assert len(list(folder.glob("[0-9][0-9]-*.cnf")))==12
          print("XORLIN1_MIXED12_FROZEN_ARCHIVE_AUDIT",{
            "old_binary_paths":len(frozen.REQUIRED_BIN),
            "missing":absent,"new_originals":12,
            "archive_sha256":hashlib.sha256(tar.read_bytes()).hexdigest()},flush=True)
          PY
          sha256sum xorlin1-mixed12-frozen-originals.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: xorlin1-mixed12-originals-and-binaries
          retention-days: 60
          if-no-files-found: error
          path: xorlin1-mixed12-frozen-originals.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xorlin1-mixed12-source-freeze-audit
          retention-days: 60
          path: |
            xorlin1_mixed12_safety.log
            xorlin1_mixed12_freeze.log
            xorlin1_mixed12_prepare.log
            research/xorlin1_prospective_mixed12/inputs/manifest.json
            results/xorlin1_prospective_mixed12/protocol.json
  paired:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0,1,2,3]
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: xorlin1-mixed12-originals-and-binaries
      - name: Restore source-exact CNFs, frozen native solvers, and independently pinned VeriPB/DRAT/FRAT
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcryptominisat5-5.11t64 libboost-program-options1.83.0
          tar -xzf xorlin1-mixed12-frozen-originals.tgz
          chmod +x build/drnas-sat-native-x59 build/drnas-x59-xor-math5-unified1 \
            build/drnas-unified-core1 build/drnas-pcmax-base \
            build/drnas-pcmax-mg7-ipg1-bdd3 \
            build/kissat build/cadical build/cms build/drat-trim build/frat-rs \
            veripb-tool/bin/veripb
      - name: Source SHA checked 6-arm serial paired strict 8s E2E solver and external proof audit
        run: |
          set -euo pipefail
          python3 -u research/xorlin1_prospective_mixed12/benchmark.py shard --index ${{ matrix.shard }} \
            | tee xorlin1_mixed12_shard.log
          grep -q '^XORLIN1_MIXED12_SHARD ' xorlin1_mixed12_shard.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xorlin1-mixed12-shard-${{ matrix.shard }}
          retention-days: 60
          if-no-files-found: warn
          path: |
            results/xorlin1_prospective_mixed12/shard-${{ matrix.shard }}/trials.jsonl
            results/xorlin1_prospective_mixed12/verified_proofs/
            xorlin1_mixed12_shard.log
  aggregate:
    needs: [freeze,paired]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: xorlin1-mixed12-originals-and-binaries
      - uses: actions/download-artifact@v4
        with:
          pattern: xorlin1-mixed12-shard-*
          path: collected
      - name: Restore frozen identity audit and copy all four complete paired shard trial logs
        run: |
          set -euo pipefail
          tar -xzf xorlin1-mixed12-frozen-originals.tgz
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          for i in range(4):
              folder=Path("collected")/f"xorlin1-mixed12-shard-{i}"
              trials=list(folder.glob("**/trials.jsonl"))
              assert len(trials)==1,("MISSING_OR_DUPLICATE_SHARD_TRIALS",i,trials)
              dest=Path("results/xorlin1_prospective_mixed12")/f"shard-{i}"
              dest.mkdir(parents=True,exist_ok=False)
              shutil.copy2(trials[0],dest/"trials.jsonl")
          PY
      - name: Complete 144-trial independent proof acceptance, source-SHA, reference and family audit
        run: |
          set -euo pipefail
          python3 -u research/xorlin1_prospective_mixed12/benchmark.py report | tee xorlin1_mixed12_final.log
          grep -q '^XORLIN1_MIXED12_FINAL ' xorlin1_mixed12_final.log
          cat xorlin1_mixed12_final.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xorlin1-mixed12-final-strict-E2E-PAR2
          retention-days: 60
          if-no-files-found: warn
          path: |
            results/xorlin1_prospective_mixed12/final.json
            results/xorlin1_prospective_mixed12/shard-*/trials.jsonl
            xorlin1_mixed12_final.log
