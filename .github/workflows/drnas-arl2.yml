name: DRNAS ARL2 four medium SATLIB originals 30s
run-name: ARL2 four 30s original SHA A E ARL2 Kissat CaDiCaL
on:
  push:
    branches: [experiment/drnas-arl2-adaptive-20261111]
    paths:
      - research/drnas_arl2_bench.py
      - research/drnas_arl1b.cpp
      - research/drnas_arl1e.cpp
      - research/drnas_arl2.cpp

      - research/drnas_native_core_r3c.cpp
      - .github/workflows/drnas-arl2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  micro:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install compiler and reference solver
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_arl2_bench.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cadical
      - name: Build pinned Kissat
        run: |
          set -euo pipefail
          mkdir -p mre_arl2/bin
          git clone --quiet https://github.com/arminbiere/kissat.git mre_arl2/kissat-src
          git -C mre_arl2/kissat-src checkout --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          (cd mre_arl2/kissat-src && ./configure && make -j2)
          install -m 755 mre_arl2/kissat-src/build/kissat mre_arl2/bin/kissat
          install -m 755 "$(command -v cadical)" mre_arl2/bin/cadical
      - name: Build original DRNAS and 500-event tracer
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 research/drnas_arl2.cpp -o mre_arl2/bin/drnas_arl2
          g++ -std=c++17 -O2 research/drnas_arl1e.cpp -o mre_arl2/bin/drnas_e
          
          g++ -std=c++17 -O2 research/drnas_native_core_r3c.cpp -o mre_arl2/bin/selftest
          mre_arl2/bin/selftest --selftest
      - name: Run SHA-locked formula with native trace and references
        env:
          MICRO_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          taskset -c "$(taskset -pc $$ | sed 's/.*: //' | cut -d, -f1 | cut -d- -f1)" python3 -u research/drnas_arl2_bench.py | tee mre_arl2/benchmark.log
          grep '^MICRO_FINAL ' mre_arl2/benchmark.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-ARL2-SHARD-${{ matrix.shard }}-AUDIT
          retention-days: 30
          path: |
            mre_arl2/audit.json
            mre_arl2/source.json
            mre_arl2/*.cnf
            mre_arl2/*.log
            mre_arl2/route_decision.json



