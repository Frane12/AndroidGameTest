name: DRNAS R131 historic R115-R117 four-formula XOR forensic audit
on:
  push:
    branches: [experiment/drnas-r131-xor-breakthrough-forensics-20261105]
    paths:
      - 'research/r131_xor_breakthrough_forensics.py'
      - '.github/workflows/drnas-r131-xor-forensics.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  forensics:
    name: Independent exact parity proof and R28 vs R118 vs R130 route comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile historical R28, R118 and unchanged R130 scanner; test syntax
        run: |
          set -euo pipefail
          mkdir -p r131
          python3 -m py_compile research/r131_xor_breakthrough_forensics.py
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -pedantic experiments/drnas_v16/r28_exact_gf2.cpp -o r131/r28
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -pedantic research/r118_xor_proof_on_demand.cpp -o r131/r118
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -pedantic research/r130_adaptive_selector.cpp -o r131/r130_filter
          sha256sum r131/r28 r131/r118 r131/r130_filter > r131/binary-shas.txt
          lscpu > r131/cpu.txt
      - name: SHA-verify original 4 official CNFs and independently replay XOR equations and UNSAT certificates
        run: |
          set -euo pipefail
          python3 -u research/r131_xor_breakthrough_forensics.py | tee r131/forensic.log
          test -s r131/forensic-report.json
          cat r131/forensic-report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R131-EXACT-XOR-R115-R117-FORENSIC
          path: |
            r131/forensic-report.json
            r131/forensic.log
            r131/binary-shas.txt
            r131/cpu.txt
          if-no-files-found: warn
          retention-days: 90
