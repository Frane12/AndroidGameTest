name: DRNAS SAT v8.7 — Consolidate Existing 600 Measurements
on:
  push:
    branches: [experiment/drnas-sat-v87-aggregate-fix-20261031]
    paths:
      - '.github/workflows/drnas-sat-v87-aggregate-only.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: v87-shard-*
          run-id: 41225605196
          github-token: ${{ github.token }}
          repository: Frane12/AndroidGameTest
          path: combined-v87-temp
      - name: Check original five shards and summarize without rerunning SAT
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p combined-v87
          for shard in 0 1 2 3 4; do
            test -f "combined-v87-temp/v87-shard-$shard/manifest.json"
            mv "combined-v87-temp/v87-shard-$shard" "combined-v87/shard-$shard"
          done
          python3 -m py_compile research/drnas-sat-v7-8/summarize_v87.py
          python3 -u research/drnas-sat-v7-8/summarize_v87.py combined-v87
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-v87-50-blind-complete-fixed-aggregate
          path: combined-v87/
          if-no-files-found: warn
