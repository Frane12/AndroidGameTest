name: DRNAS REX1-B decision ablation
on:
  push:
    branches: [experiment/drnas-rex1-20261112]
    paths: [.github/workflows/drnas-rex1b.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drnas-rex1b-single
  cancel-in-progress: false
jobs:
  ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python prototypes
        run: python3 -m py_compile research/drnas_rex1_probe.py research/drnas_rex1b_ablation.py
      - name: Compare graph baseline and cost-aware UP lookahead
        run: python3 -u research/drnas_rex1b_ablation.py --indices 93,94 --top 8 --budget 12000 | tee rex1b.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rex1b-ablation
          retention-days: 7
          path: |
            rex1b.log
            rex1b-results.jsonl
