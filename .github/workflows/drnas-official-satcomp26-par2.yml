name: DRNAS NP official SAT Competition 2026 CNF subset PAR2
on:
  workflow_dispatch:
  push:
    paths:
      - 'DRNAS_NP_Crypto_Benchmark/nf_satcomp26_*.py'
      - 'DRNAS_NP_Crypto_Benchmark/satcomp26_frozen_v100_policy.txt'
      - '.github/workflows/drnas-official-satcomp26-par2.yml'
permissions:
  contents: read
jobs:
  official-2026-sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native in-process CaDiCaL C++ development files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ libcadical-dev cadical
          cadical --version
      - name: Build FROZEN DRNAS v1.0 native policy vs identical CaDiCaL baseline
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic \
            native_v100/drnas_nf100.cpp -lcadical -lz -pthread \
            -o native_v100/drnas_nf100
          cat satcomp26_frozen_v100_policy.txt
          sha256sum native_v100/drnas_nf100 satcomp26_frozen_v100_policy.txt
      - name: Verify frozen DRNAS and baseline answers against truth tables
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          python - <<'PY'
          import itertools,json,random,subprocess,tempfile
          from pathlib import Path
          rng=random.Random(260026)
          for n in range(1,7):
            for k in range(12):
              clauses=[]
              for j in range(13):
                v=rng.sample(range(1,n+1),rng.randrange(min(n,4)+1))
                clauses.append(tuple(l if rng.getrandbits(1) else -l for l in v))
              expected='SAT' if any(all(any(
                   values[abs(l)-1]==(l>0) for l in cl) for cl in clauses)
                   for values in itertools.product([False,True],repeat=n)) else 'UNSAT'
              with tempfile.TemporaryDirectory() as td:
                f=Path(td)/'small.cnf'
                f.write_text(f'p cnf {n} {len(clauses)}\n'+''.join(' '.join(map(str,c))+' 0\n' for c in clauses))
                for mode in ('base','auto'):
                  cmd=['./native_v100/drnas_nf100','--input',str(f),'--mode',mode]
                  if mode=='auto':cmd+=['--policy','satcomp26_frozen_v100_policy.txt']
                  p=subprocess.run(cmd,capture_output=True,text=True,timeout=5)
                  assert p.returncode==0,(mode,p.stderr)
                  r=json.loads(p.stdout)
                  assert r['status']==expected,(n,k,mode,r,expected)
                  assert r['status']!='SAT' or r['witness_valid']
          print('PASS: 144 exact reference outcomes with frozen official research configuration')
          PY
      - name: Fetch preselected original 2026 Main Track GBD hashes only
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          python -u nf_satcomp26_official_fetch.py
      - name: Run two-arm same-CaDiCaL 12-second research PAR-2
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          python -u nf_satcomp26_par2.py
      - name: Show real retrieval and timing results
        if: always()
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          if test -f satcomp26_official/source_manifest.csv; then cat satcomp26_official/source_manifest.csv; fi
          if test -f satcomp26_research_results/scores.csv; then cat satcomp26_research_results/scores.csv; fi
          if test -f satcomp26_research_results/methodological_note.json; then cat satcomp26_research_results/methodological_note.json; fi
      - name: Archive full official source hash manifest, error report and paired scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-satcomp2026-official-instance-mini-par2
          path: |
            DRNAS_NP_Crypto_Benchmark/satcomp26_official/source_manifest.csv
            DRNAS_NP_Crypto_Benchmark/satcomp26_official/official_2026_uri_index_provenance.json
            DRNAS_NP_Crypto_Benchmark/satcomp26_research_results/
            DRNAS_NP_Crypto_Benchmark/satcomp26_frozen_v100_policy.txt
          if-no-files-found: warn
