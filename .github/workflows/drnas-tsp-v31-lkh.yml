name: DRNAS TSP v3.1 vs LKH-3
on:
  push:
    branches:
      - experiment/drnas-tsp-v31-shared-intelligence
    paths:
      - .github/workflows/drnas-tsp-v31-lkh.yml
      - experiments/tsp_shared_v31/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    name: LKH-3 paired external benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy numba
      - name: Build genuine LKH-3 external solver
        run: |
          git clone --depth 1 https://github.com/cerebis/LKH3.git
          make -C LKH3 -j2
          test -x LKH3/LKH
      - name: Run identical-instance TSP comparison
        run: |
          PYTHONPATH=experiments/tsp_shared_v31 python -u experiments/tsp_shared_v31/compare_lkh.py \
            --cities 2000 5000 --seeds 0 1 2 --seconds 6 --lkh ./LKH3/LKH \
            --out tsp_world_compare.csv
      - name: Publish logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-tsp-v31-lkh-external-comparison
          path: |
            tsp_world_compare.csv
            tsp_reference_inputs/*.lkh.log
            tsp_reference_inputs/*.tour
            tsp_reference_inputs/*.tsp
          if-no-files-found: warn
