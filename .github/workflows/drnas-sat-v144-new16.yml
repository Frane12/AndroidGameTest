name: DRNAS V14.4 - New 16 Official 2024 Mixed XOR Bench (16s)
on:
  push:
    branches: [experiment/drnas-v144-mixedxor-certified-preprocess-20261101]
    paths:
      - '.github/workflows/drnas-sat-v144-new16.yml'
      - 'research/drnas-sat-v7-8/v144_new16_freeze.py'
      - 'research/drnas-sat-v7-8/v144_external_bench.py'
      - 'research/drnas-sat-v7-8/v144_mixedxor_preprocess.cpp'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify experiment scripts compile
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/v144_new16_freeze.py research/drnas-sat-v7-8/v144_external_bench.py
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V131-exact256-132-retrospective-audit
          run-id: 41255417615
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior131
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-UnOfficial-SATComp2026-Mini-216-Matched
          run-id: 41248293940
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-mini
      - uses: actions/download-artifact@v4
        with:
          name: v100-frozen-protocol-and-inputs
          run-id: 41245906965
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v100
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V132-frozen-24-new-inputs
          run-id: 41256313918
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v132
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V138-external2026-18-CNF-final-audit
          run-id: 41260140613
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v138
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V139-new-SC2024-12-frozen-verified-CNFs
          run-id: 41261415700
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v139
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V1313-30-fresh-SC2024-SHA-frozen
          run-id: 41263304031
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v1313
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V1316-blind30-new-SC2024-SHA-locked
          run-id: 41264586616
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v1316
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V143-30-NEW-SC2024-precommitted-SHA-manifest
          run-id: 41265926817
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v143
      - name: Strict SHA-256 exclusion of prior cohorts, then freeze 16 new official CNFs
        run: |
          set -euo pipefail
          (cd prior131/frozen && sha256sum -c v13_manifest.sha256)
          (cd prior-mini/frozen && sha256sum -c official_mini_manifest.sha256)
          (cd prior-v100 && sha256sum -c v100_manifest.sha256)
          (cd prior-v132 && sha256sum -c v132_manifest.sha256)
          (cd prior-v139 && sha256sum -c v139_selector.sha256)
          (cd prior-v1313 && sha256sum -c v1313_30_manifest.sha256)
          (cd prior-v1316 && sha256sum -c v1313_30_manifest.sha256)
          (cd prior-v143 && sha256sum -c v143_manifest.sha256)
          mkdir -p frozen
          python3 -u research/drnas-sat-v7-8/v144_new16_freeze.py \
            --v131 prior131/frozen/v13_manifest.json \
            --mini prior-mini/frozen/official_mini_manifest.json \
            --v100 prior-v100/v100_manifest.json \
            --v132 prior-v132/v132_manifest.json \
            --v138 prior-v138/frozen/v138_manifest.json \
            --v139 prior-v139/v139_selector.json \
            --v1313 prior-v1313/v1313_30_manifest.json \
            --v1316 prior-v1316/v1313_30_manifest.json \
            --v143 prior-v143/v143_new30_source.json \
            --out frozen/v144_new16_source.json
          python3 -u research/drnas-sat-v7-8/v144_external_bench.py freeze \
            --prior frozen/v144_new16_source.json --out frozen/v144_manifest.json
          sha256sum research/drnas-sat-v7-8/v144_mixedxor_preprocess.cpp > frozen/v144_source.sha256
          (cd frozen && sha256sum v144_new16_source.json v144_manifest.json > v144_manifest.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V144-16-new-2024-frozen-source-and-protocol
          path: frozen/
          if-no-files-found: warn
  benchmark:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    name: v144-shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V144-16-new-2024-frozen-source-and-protocol
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V144-native-mixedxor-verified-and-3-baselines
          run-id: 41266896926
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: native
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V143-Native-local-XOR-and-original-pinned-solvers
          run-id: 41265926817
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: old
      - name: Verify source, frozen cases, binary digests, execute 16-second paired trials
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v144_manifest.sha256)
          sha256sum -c frozen/v144_source.sha256
          (cd native && sha256sum -c v144_native.sha256)
          (cd old && sha256sum -c binaries.sha256)
          chmod +x native/v144_native old/v143_native old/kissat_solver old/legacy_solver
          python3 -u research/drnas-sat-v7-8/v144_external_bench.py run \
            --manifest frozen/v144_manifest.json --shard "$SHARD" \
            --v144 native/v144_native --v143 old/v143_native \
            --kissat old/kissat_solver --legacy old/legacy_solver --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v144-shard-${{ matrix.shard }}
          path: results/
          if-no-files-found: warn
  audit:
    needs: [freeze,benchmark]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V144-16-new-2024-frozen-source-and-protocol
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: v144-shard-*
          path: combined
      - name: Audit all 128 outcomes and report PAR2 and certified XOR paths
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v144_manifest.sha256)
          python3 -u research/drnas-sat-v7-8/v144_external_bench.py audit \
            --manifest frozen/v144_manifest.json --combined combined \
            --out v144_report.json --md v144_report.md
          cat v144_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V144-NEW16-official2024-strict-final-audit
          path: |
            frozen/
            combined/
            v144_report.json
            v144_report.md
          if-no-files-found: warn
