name: DRNAS COMBO3 - original UNSAT XLRUP proof size and Gauss controls
run-name: COMBO3 two certified 2024 CNF x 4 pinned CMS17 modes x 2 reps XLRUP CakeML 16 oneCPU
on:
  push:
    branches: [experiment/drnas-combo3-proofsize-gauss-ablation-20261110]
    paths:
      - .github/workflows/drnas-combo3-proofsize-gauss.yml
      - research/drnas_combo3_proofsize_ablation.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-combo3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  freeze:
    name: Pin two COMBO2 source SHA, original proof audit and build CMS17 CakeML tools
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Restore source-original SHA and immutable independent proof audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42793704014 -R Frane12/AndroidGameTest -n combo2-source-sha-frozen-CMS17-Kissat4-Native-and-GF2-exact -D .
          mkdir -p prior_combo2proof_temp prior_combo2proof prior_combo2_temp prior_combo2
          gh run download 42796021996 -R Frane12/AndroidGameTest -n DRNAS-COMBO2-2ORIGINAL-SHA-INDEPENDENT-XLRUP-CAKEML-STRICT-AUDIT -D prior_combo2proof_temp
          gh run download 42793704014 -R Frane12/AndroidGameTest -n DRNAS-COMBO2-168-ONECPU-ORIGINAL-SHA-PAR2-FINAL -D prior_combo2_temp
          PROOF="$(find prior_combo2proof_temp -type f -name report.json | head -n1)"
          BASE="$(find prior_combo2_temp -type f -name report.json | head -n1)"
          test -n "$PROOF" && test -n "$BASE"
          cp "$PROOF" prior_combo2proof/report.json
          cp "$BASE" prior_combo2/report.json
          test -s mre_combo2/manifest.json
          test -s mre_search6/manifest.json
          test -s prior_combo2proof/report.json
          test -s prior_combo2/report.json
      - name: Build pinned proof-capable CryptoMiniSat 5.17 source SHA
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build git pkg-config libgmp-dev zlib1g-dev
          git clone -q https://github.com/msoos/cryptominisat /tmp/drnas-c2proof-cms
          git -C /tmp/drnas-c2proof-cms checkout -q 03954f7f7815ea3984774c95a66e7c224cd25952
          test "$(git -C /tmp/drnas-c2proof-cms rev-parse HEAD)" = 03954f7f7815ea3984774c95a66e7c224cd25952
          cmake -G Ninja -S /tmp/drnas-c2proof-cms -B /tmp/drnas-c2proof-cms/build -DCMAKE_BUILD_TYPE=Release -DNOCADICAL=ON -DENABLE_TESTING=OFF -DNOZLIB=ON
          cmake --build /tmp/drnas-c2proof-cms/build --target cryptominisat5 -j 2
          test -x /tmp/drnas-c2proof-cms/build/cryptominisat5
          /tmp/drnas-c2proof-cms/build/cryptominisat5 --version
          /tmp/drnas-c2proof-cms/build/cryptominisat5 --help > /tmp/combo3-cms-help.log
          for opt in autodisablegauss maxnummatrices maxmatrixrows maxmatrixcols minmatrixrows presimp; do
            grep -q -- "--$opt" /tmp/combo3-cms-help.log
          done
      - name: Build independent CakeML XLRUP verifier source SHA
        run: |
          set -euo pipefail
          git clone -q https://github.com/meelgroup/frat-xor /tmp/drnas-c2proof-frat
          git -C /tmp/drnas-c2proof-frat checkout -q 18cd6bc17af10a9891c10a846ce966166f9fe0dc
          test "$(git -C /tmp/drnas-c2proof-frat rev-parse HEAD)" = 18cd6bc17af10a9891c10a846ce966166f9fe0dc
          make -C /tmp/drnas-c2proof-frat/cake_xlrup
          test -x /tmp/drnas-c2proof-frat/cake_xlrup/cake_xlrup
      - name: Independent proof checker toy selftests and preregister 16 matched trials
        run: |
          set -euo pipefail
          mkdir -p mre_combo3proof/bin
          python3 -m py_compile research/drnas_combo3_proofsize_ablation.py
          python3 -u research/drnas_combo3_proofsize_ablation.py selftest | tee mre_combo3proof/selftest.log
          grep -q '^COMBO3_SELFTEST_PASS ' mre_combo3proof/selftest.log
          python3 -u research/drnas_combo3_proofsize_ablation.py freeze | tee mre_combo3proof/freeze.log
          grep -q '^COMBO3_FROZEN ' mre_combo3proof/freeze.log
          cp /tmp/drnas-c2proof-cms/build/cryptominisat5 mre_combo3proof/bin/cryptominisat5
          cp /tmp/drnas-c2proof-frat/cake_xlrup/cake_xlrup mre_combo3proof/bin/cake_xlrup
          sha256sum mre_combo3proof/bin/* | tee mre_combo3proof/bin-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: combo3-frozen-two-original-SHA-CMS17-CakeML-binaries
          retention-days: 14
          if-no-files-found: error
          path: |
            mre_combo3proof/manifest.json
            mre_combo3proof/selftest.log
            mre_combo3proof/bin/*
            mre_combo3proof/bin-sha256.txt
            mre_combo2/manifest.json
            mre_search6/cases/*.cnf
            prior_combo2proof/report.json
  trial:
    name: Source SHA pinned CMS17 binary XLRUP CakeML four modes one CPU shard ${{ matrix.shard }}
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: combo3-frozen-two-original-SHA-CMS17-CakeML-binaries
          path: .
      - name: Execute 8 single-core verified E2E proof timings; delete every large XLRUP
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/drnas-c2proof-cms/build /tmp/drnas-c2proof-frat/cake_xlrup
          cp mre_combo3proof/bin/cryptominisat5 /tmp/drnas-c2proof-cms/build/cryptominisat5
          cp mre_combo3proof/bin/cake_xlrup /tmp/drnas-c2proof-frat/cake_xlrup/cake_xlrup
          chmod +x /tmp/drnas-c2proof-cms/build/cryptominisat5 /tmp/drnas-c2proof-frat/cake_xlrup/cake_xlrup
          sha256sum -c mre_combo3proof/bin-sha256.txt
          python3 -u research/drnas_combo3_proofsize_ablation.py verify
          python3 -u research/drnas_combo3_proofsize_ablation.py shard --shard "$SHARD" | tee "mre_combo3proof/shard-$SHARD.log"
          grep -q "^COMBO3_SHARD_PASS $SHARD 8$" "mre_combo3proof/shard-$SHARD.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combo3-shard-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            mre_combo3proof/shard-${{ matrix.shard }}.json
            mre_combo3proof/shard-${{ matrix.shard }}.log
  audit:
    name: Independent CakeML certified 16 E2E proof size PAR2 and regression audit
    needs: [freeze,trial]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: combo3-frozen-two-original-SHA-CMS17-CakeML-binaries
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: combo3-shard-*
          merge-multiple: true
          path: mre_combo3proof
      - name: Re-audit all 16 trials only without solver re-execution
        run: |
          set -euo pipefail
          mkdir -p /tmp/drnas-c2proof-cms/build /tmp/drnas-c2proof-frat/cake_xlrup
          cp mre_combo3proof/bin/cryptominisat5 /tmp/drnas-c2proof-cms/build/cryptominisat5
          cp mre_combo3proof/bin/cake_xlrup /tmp/drnas-c2proof-frat/cake_xlrup/cake_xlrup
          chmod +x /tmp/drnas-c2proof-cms/build/cryptominisat5 /tmp/drnas-c2proof-frat/cake_xlrup/cake_xlrup
          sha256sum -c mre_combo3proof/bin-sha256.txt
          test -s mre_combo3proof/shard-0.json && test -s mre_combo3proof/shard-1.json
          python3 -u research/drnas_combo3_proofsize_ablation.py verify
          python3 -u research/drnas_combo3_proofsize_ablation.py audit | tee mre_combo3proof/audit.log
          grep -q '^COMBO3_FINAL ' mre_combo3proof/audit.log
          grep '^COMBO3_FINAL ' mre_combo3proof/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-COMBO3-TWO-SHA-16-ORIGINAL-XLRUP-CAKEML-STRICT-FINAL
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_combo3proof/manifest.json
            mre_combo3proof/report.json
            mre_combo3proof/audit.log
            mre_combo3proof/shard-*.json
