name: DRNAS ATLAS39 audit immutable benchmark results
run-name: ATLAS39 audit-only 43033156777 original 260 matched SHA
on:
  push:
    branches: [experiment/drnas-atlas39-clause-utility-memory-20261111]
    paths:
      - .github/workflows/drnas-atlas39-audit-recovery.yml
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 43033156777
          github-token: ${{ github.token }}
          pattern: ATLAS39-*
          path: audits
      - name: Immutable original SHA audit with code checked out before artifacts
        run: |
          set -euo pipefail
          find audits -maxdepth 8 -type f -print
          python3 -u research/drnas_atlas39_audit.py | tee audit.log
          grep '^ATLAS39_COHORT_AUDIT ' audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS39-FINAL-AUDIT-RECOVERY
          retention-days: 60
          path: audit.log
