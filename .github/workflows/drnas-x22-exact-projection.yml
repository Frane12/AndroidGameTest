name: DRNAS X22 exact projection six known X21 SHA 60 paired E2E
on:
  push:
    branches: [experiment/drnas-x22-exact-projection-20261109]
    paths:
      - 'research/drnas_x22_exact_projection.py'
      - '.github/workflows/drnas-x22-exact-projection.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-x22-exact-projection-20261109
  cancel-in-progress: false
jobs:
  selftest:
    name: Random exhaustive Boolean equivalence and pin six X21 original sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: x21-frozen-sources-binaries
          run-id: 42586193407
          github-token: ${{ github.token }}
          path: .
      - name: Native and exact-projection prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
          export PYTHONPATH="$PWD/research" LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_x21/bin/selective mre_x4/bin/native built/bin/kissat_4_0_4
          python3 -m py_compile research/drnas_x22_exact_projection.py
          python3 -u research/drnas_x22_exact_projection.py selftest
          python3 - <<'PY'
          import drnas_x22_exact_projection as x
          cases=x.cases()
          assert len(cases)==6
          for c in cases:
              print("X22_SOURCE",c["gbd"],c["sha256"],
                    c["vars"],c["clauses"],c["bytes"],c["structure"])
          PY
        env:
          PYTHONPATH: ${{ github.workspace }}/research
      - uses: actions/upload-artifact@v4
        with:
          name: x22-six-known-original-SHA-and-pinned-binaries
          retention-days: 21
          if-no-files-found: error
          path: |
            mre_x21/
            mre_x4/bin/native
            mre5/lib/libcryptominisat5.so.5.11
            built/bin/kissat_4_0_4
  paired:
    name: Exact CNF projection 10 E2E trials shard ${{ matrix.shard }}
    needs: selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: x22-six-known-original-SHA-and-pinned-binaries
          path: .
      - name: Run matched original CNF and exact projection, pinning one logical CPU each
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
          export PYTHONPATH="$PWD/research" LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_x21/bin/selective mre_x4/bin/native built/bin/kissat_4_0_4
          python3 -u research/drnas_x22_exact_projection.py shard --shard ${{ matrix.shard }} | tee mre_x22/shard-${{ matrix.shard }}.log
          grep -q '^X22_SHARD_PASS ${{ matrix.shard }} 10$' mre_x22/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x22-result-${{ matrix.shard }}
          retention-days: 21
          path: |
            mre_x22/shard-${{ matrix.shard }}.json
            mre_x22/shard-${{ matrix.shard }}.log
  audit:
    name: Exact 60 paired E2E SHA witness PAR2 audit with no UNSAT proof inflation
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: x22-six-known-original-SHA-and-pinned-binaries
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: x22-result-*
          path: mre_x22
          merge-multiple: true
      - name: Fail closed on any missing or unverified SAT model
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
          export PYTHONPATH="$PWD/research" LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_x21/bin/selective mre_x4/bin/native built/bin/kissat_4_0_4
          python3 -u research/drnas_x22_exact_projection.py audit | tee mre_x22/audit.log
          grep '^X22_FINAL ' mre_x22/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-X22-EXACT-PROJECTION-60-E2E-FINAL
          retention-days: 30
          path: |
            mre_x22/report.json
            mre_x22/audit.log
            mre_x22/shard-*.json
