name: DRNAS C11b — audit-only 50 frozen original SHA trials, no solver reruns
on:
  push:
    branches: [experiment/drnas-c11-triple-portfolio-20261109]
    paths: ['.github/workflows/drnas-c11b-audit-only.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-only:
    name: Validate all 50 C11b benchmark rows from completed shards, recalculate PAR2 without new solver attempts
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore original SHA freeze manifest and all four old completed shard artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p c11b_out
          gh run download 42535319191 -R Frane12/AndroidGameTest -n c11b-new-official26-source-SHA-and-three-backend-policy-frozen -D .
          for i in 0 1 2 3; do
            gh run download 42535319191 -R Frane12/AndroidGameTest -n c11b-official26-shard-$i -D c11b_out
            test -s "c11b_out/shard-$i.json"
          done
          test -s c11a_reference/report.json
          test -s c11b_official/manifest.json
          (cd c11b_official && sha256sum -c source.sha256)
          python3 -m py_compile research/c11b_official26_freeze.py research/c11b_official26_benchmark.py
      - name: Audit original SHA-disjoint source and 5-arm x 2-rep full SAT results, compute actual PAR2
        run: |
          set -euo pipefail
          python3 -u research/c11b_official26_freeze.py verify
          python3 -u research/c11b_official26_benchmark.py verify
          python3 -u research/c11b_official26_benchmark.py audit | tee c11b_out/audit.log
          grep -q '^C11B_FINAL' c11b_out/audit.log
          grep '^C11B_FINAL' c11b_out/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-C11B-REPAIRED-AUDIT-50-ORIGINAL-SHA-PAR2-NO-RERUNS
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6
          path: |
            c11b_out/report.json
            c11b_out/audit.log
            c11b_out/shard-*.json
            c11b_official/manifest.json
            c11a_reference/report.json
