name: DRNAS PCMAX44 original source structural UNSAT replay
on:
  push:
    branches: [experiment/drnas-pcmax44-proof-replay-20261115]
    paths:
      - .github/workflows/drnas-pcmax44-proof-replay.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: drnas-pcmax44-proof-replay-20261115
  cancel-in-progress: false

jobs:
  replay:
    name: Frozen PCMAX44 one-CPU proof and negative checker controls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile optional specialized proof module
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target drnas-pcmax -j2
      - name: Retrieve previously frozen original SAT2024 CNF artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 43631559465
          name: pcmax20-original-cnfs
          github-token: ${{ github.token }}
          path: pcmax20
      - name: Prepare a single SHA-frozen source from previous original20 manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil
          sha='c55ab8fe2c9e10f0579f806802bc32d04913f12cd6ce28e6662b8d59d114c174'
          root=pathlib.Path('pcmax20')
          entries=json.loads(pathlib.Path('research/pcmax_capacity/sources20.json').read_text())['entries']
          matched=[e for e in entries if e['sha256']==sha]
          assert len(matched)==1, 'SOURCE_MANIFEST_NOT_UNIQUE'
          e=matched[0]
          candidates=list(root.rglob(e['name'])) if root.exists() else []
          if len(candidates)==1:
            original=candidates[0].read_bytes()
            provenance='frozen-run-artifact'
          else:
            import lzma, urllib.request
            request=urllib.request.Request(e['url'],headers={'User-Agent':'DRNAS-PCMAX-capacity-audit/1.0'})
            with urllib.request.urlopen(request,timeout=120) as response:
              raw=response.read(30_000_001)
            assert len(raw)<=30_000_000, 'SOURCE_DOWNLOAD_TOO_LARGE'
            original=lzma.decompress(raw) if raw.startswith(b'\\xfd7zXZ\\x00') else raw
            provenance='pinned-original-url'
          assert original, 'EMPTY_SOURCE'
          assert hashlib.sha256(original).hexdigest()==sha, 'FROZEN_SOURCE_HASH_MISMATCH'
          dst=pathlib.Path('original-cnfs')/e['name']
          dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_bytes(original)
          pathlib.Path('pcmax44_manifest.json').write_text(json.dumps({'source':'SAT2024 immutable PCMAX44','entries':[e]},indent=2)+'\n')
          print('PCMAX44_SOURCE_FROZEN',json.dumps({'name':e['name'],'sha256':sha,'bytes':len(original),'provenance':provenance}))
          PY
      - name: Three serial single-CPU runs with separate source-bound verifier
        run: |
          set -euo pipefail
          python3 -u research/pcmax_capacity/benchmark.py \
            --binary build/drnas-pcmax \
            --manifest pcmax44_manifest.json \
            --inputs original-cnfs \
            --output results/pcmax44 \
            --budget-ms 5000 --repetitions 3 \
            | tee pcmax44-replay.log
      - name: Reject forged source hash and capacity claim; freeze success report
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          prefix='c55ab8fe2c9e'
          base=pathlib.Path('results/pcmax44')
          report=json.loads((base/'summary.json').read_text())
          rows=report['rows']
          assert report['source_count']==1 and len(rows)==3
          assert report['verified_unsat_trials']==3
          assert all(r['sha256']=='c55ab8fe2c9e10f0579f806802bc32d04913f12cd6ce28e6662b8d59d114c174' for r in rows)
          assert all(r['status']=='UNSAT_STRUCTURAL_CERTIFICATE_VERIFIED' and r['required']==16 and r['capacity_sum']==15 for r in rows)
          cnf=pathlib.Path('original-cnfs/pcmax-scheduling-m11-1517-6802-UNSAT.sanitized.cnf')
          checker='research/pcmax_capacity/check_capacity.py'
          cert=base/('rep-00-'+prefix)/'capacity.json'
          assert cert.is_file(), 'POSITIVE_CERT_MISSING'
          good=json.loads(cert.read_text())
          for kind in ('bad_source_sha','bad_capacity_bound'):
            altered=json.loads(json.dumps(good))
            if kind=='bad_source_sha':
              altered['source_sha256']='0'*64
            else:
              altered['capacity_sum']+=1
            wrong=base/(kind+'.json')
            wrong.write_text(json.dumps(altered))
            r=subprocess.run([sys.executable,checker,str(cnf),str(wrong)],capture_output=True,text=True,timeout=15)
            assert r.returncode!=0, ('FORGED_CERT_ACCEPTED',kind,r.stdout,r.stderr)
          info={'original_sha256':rows[0]['sha256'],'repetitions':3,'independently_checked_unsat':3,'required':16,'capacity':15,'certificate_format':'pcmax-capacity-v1','not_drat_lrat':True}
          (base/'PASS.json').write_text(json.dumps(info,indent=2)+'\n')
          print('PCMAX44_SOURCE_PROOF_REPLAY_PASS '+json.dumps(info,sort_keys=True))
          PY
      - name: Preserve original CNF, checker evidence, and certificates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcmax44-source-cnf-structural-certificates-3x
          retention-days: 60
          path: |
            pcmax44_manifest.json
            pcmax44-replay.log
            original-cnfs/pcmax-scheduling-m11-1517-6802-UNSAT.sanitized.cnf
            results/pcmax44/
            research/pcmax_capacity/check_capacity.py
