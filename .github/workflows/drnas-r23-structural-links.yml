name: DRNAS R23 structural implication links risk learning (shadow, R21 frozen holdout)
on:
  push:
    branches: [experiment/drnas-r23-structural-links-shadow-20261103]
    paths:
      - 'experiments/drnas_v16/r23_structural_links_shadow.py'
      - '.github/workflows/drnas-r23-structural-links.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-shadow:
    name: R23 chain/star unit, R21 exact CNF replay, 80 train and 80 blind test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned historical R21 archive
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/r23_structural_links_shadow.py
          test "$(git hash-object experiments/drnas_v16/r21-results/current/formula_features.csv)" = a8fa4b316b0ea8863f623f0e41a9d654c2da4e62
          python3 experiments/drnas_v16/r23_structural_links_shadow.py --self-test
      - name: Train frozen R23 guarded selector on R21 development and evaluate 80 untouched R21 tests
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r23_structural_links_shadow.py --evaluate
          test -s drnas-r23-results/model.json
          test -s drnas-r23-results/report.json
          test -s drnas-r23-results/holdout_decisions.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R23-Structural-Link-Shadow-Guard-R21-Blind-Holdout
          path: drnas-r23-results/
          if-no-files-found: warn
          retention-days: 90
