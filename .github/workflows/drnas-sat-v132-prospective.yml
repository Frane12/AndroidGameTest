name: DRNAS V13.2 - Six-CNF Prospective LBD4 Pilot
on:
  push:
    branches: [experiment/drnas-v132-prospective-lbd4-20261101]
    paths:
      - '.github/workflows/drnas-sat-v132-prospective.yml'
      - 'research/drnas-sat-v7-8/v132_lbd4_prospective.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify fixed predictor and Python syntax
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/v132_lbd4_prospective.py
          python3 research/drnas-sat-v7-8/v132_lbd4_prospective.py selftest
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V131-exact256-132-retrospective-audit
          run-id: 41255417615
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior131
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-UnOfficial-SATComp2026-Mini-216-Matched
          run-id: 41248293940
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-mini
      - uses: actions/download-artifact@v4
        with:
          name: v100-frozen-protocol-and-inputs
          run-id: 41245906965
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v100
      - name: Freeze six size-eligible SHA-distinct 2026 CNFs from prelocked order
        run: |
          set -euo pipefail
          (cd prior131/frozen && sha256sum -c v13_manifest.sha256)
          (cd prior-mini/frozen && sha256sum -c official_mini_manifest.sha256)
          (cd prior-v100 && sha256sum -c v100_manifest.sha256)
          curl -fL --retry 3 --max-time 120 \
            https://raw.githubusercontent.com/satcompetition/2026/3e2dee7cf5aa643c77bf946280a3c1c520756ef9/downloads/scores.csv \
            -o official_scores.csv
          test "$(git hash-object official_scores.csv)" = 9c926b2bd35ac0fb4f3d0cf8f58c97178d43faef
          mkdir -p frozen
          python3 -u research/drnas-sat-v7-8/v132_lbd4_prospective.py freeze \
            --prior131 prior131/frozen/v13_manifest.json \
            --prior_mini prior-mini/frozen/official_mini_manifest.json \
            --prior100 prior-v100/v100_manifest.json \
            --scores official_scores.csv --out frozen/v132_manifest.json
          (cd frozen && sha256sum v132_manifest.json > v132_manifest.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V132-frozen-24-new-inputs
          path: frozen/
          if-no-files-found: warn

  build:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V132-frozen-24-new-inputs
          path: frozen
      - name: Build exact256 prefix, DRNAS Legacy and pinned Kissat
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v132_manifest.sha256)
          test "$(git hash-object research/drnas-sat-v7-6/v76_single.cpp)" = a254356a45b70f02f33b9506f1122dad33916ca7
          test "$(git hash-object research/drnas-sat-v7-7/v77_single.cpp)" = 1bbb7fa035e62d5179de9243f672aed9bb9cbaca
          python3 - <<'PY'
          from pathlib import Path
          s=Path('research/drnas-sat-v7-7/v77_single.cpp').read_text()
          marker='\nint main(int argc,char**argv) {'
          assert s.count(marker)==1
          Path('research/drnas-sat-v7-7/v77_embedded_functions.inc').write_text(s.split(marker,1)[0]+'\n')
          PY
          git clone --depth 1 --branch rel-3.0.1 https://github.com/arminbiere/cadical.git cadical-src
          test "$(git -C cadical-src rev-parse HEAD)" = c60730422e758ef1cebe7aeddf2dda31c996bf04
          python3 research/drnas-sat-v7-8/patch_cadical_v90.py cadical-src
          python3 research/drnas-sat-v7-8/v131_exact_conflict_patch.py cadical-src
          python3 research/drnas-sat-v7-8/v13_probe_patch.py \
            --source research/drnas-sat-v7-8/v101_graded_confidence_probe.cpp \
            --dest research/drnas-sat-v7-8/v13_probe_generated.cpp
          (cd cadical-src && ./configure && make -j2 >/tmp/v132-cadical.log 2>&1) \
            || { tail -100 /tmp/v132-cadical.log; exit 1; }
          g++ -std=c++17 -O3 -DNDEBUG -I cadical-src/src \
            research/drnas-sat-v7-8/v13_probe_generated.cpp \
            cadical-src/build/libcadical.a -o v132_prefix -pthread -ldl -lz
          g++ -std=c++17 -O3 -DNDEBUG -I cadical-src/src \
            research/drnas-sat-v7-8/v101_graded_confidence_probe.cpp \
            cadical-src/build/libcadical.a -o v132_drnas -pthread -ldl -lz
          git clone --depth 1 --branch rel-4.0.4 https://github.com/arminbiere/kissat.git kissat-src
          test "$(git -C kissat-src rev-parse --short=7 HEAD)" = 8af8e56
          (cd kissat-src && ./configure && make -j2 >/tmp/v132-kissat.log 2>&1) \
            || { tail -100 /tmp/v132-kissat.log; exit 1; }
          cp kissat-src/build/kissat v132_kissat
          sha256sum v132_prefix v132_drnas v132_kissat > binaries.sha256
          sha256sum -c binaries.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-V132-three-pinned-binaries
          path: |
            v132_prefix
            v132_drnas
            v132_kissat
            binaries.sha256
          if-no-files-found: error

  benchmark:
    needs: [freeze,build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2]
    name: v132-shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V132-frozen-24-new-inputs
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V132-three-pinned-binaries
          path: bin
      - name: Verify frozen sample, binary digests and execute paired trials
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v132_manifest.sha256)
          (cd bin && sha256sum -c binaries.sha256)
          chmod +x bin/v132_prefix bin/v132_drnas bin/v132_kissat
          python3 -u research/drnas-sat-v7-8/v132_lbd4_prospective.py run \
            --manifest frozen/v132_manifest.json --shard "$SHARD" \
            --probe bin/v132_prefix --drnas bin/v132_drnas \
            --kissat bin/v132_kissat --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v132-shard-${{ matrix.shard }}
          path: results/
          if-no-files-found: warn

  audit:
    needs: [freeze,benchmark]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V132-frozen-24-new-inputs
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: v132-shard-*
          path: combined
      - name: Strict prospective accuracy + matched PAR2 audit
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v132_manifest.sha256)
          python3 -u research/drnas-sat-v7-8/v132_lbd4_prospective.py audit \
            --manifest frozen/v132_manifest.json --combined combined \
            --out v132_report.json --md v132_report.md
          cat v132_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V132-prospective-LBD4-audit
          path: |
            frozen/
            combined/
            v132_report.json
            v132_report.md
          if-no-files-found: warn
