name: Build Zvjezdana Macka APK
on:
  push:
  workflow_dispatch:
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check game source
        run: |
          test -f build.sh || { echo "::error::Missing build.sh at repo root"; exit 1; }
          test -f src/hr/frane/zvjezdana/MainActivity.java || { echo "::error::Missing game source at repo root"; exit 1; }
      - name: Build signed APK
        run: bash build.sh
      - name: Run tests
        run: |
          mkdir -p build/test-classes
          javac -d build/test-classes src/hr/frane/zvjezdana/GameRules.java tests/RulesTest.java
          java -cp build/test-classes RulesTest
      - uses: actions/upload-artifact@v4
        with:
          name: Zvjezdana-Macka-0.5
          path: build/Zvjezdana-Macka-0.5.apk
          if-no-files-found: error
