name: DRNAS SAT V8.9 Structural Discovery — 40 New CNFs
on:
  push:
    branches:
      - experiment/drnas-sat-v89-structural-discovery-20261031
    paths:
      - '.github/workflows/drnas-sat-v89-structural-pilot.yml'
      - 'research/drnas-sat-v7-8/structural_pilot_v89.py'
      - 'research/drnas-sat-v7-8/summarize_structural_v89.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-pilot:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check reproducible sources and compile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/structural_pilot_v89.py research/drnas-sat-v7-8/summarize_structural_v89.py research/drnas-sat-v7-8/blind_v89.py
          test "$(git hash-object research/drnas-sat-v7-6/v76_single.cpp)" = a254356a45b70f02f33b9506f1122dad33916ca7
          test "$(git hash-object research/drnas-sat-v7-7/v77_single.cpp)" = 1bbb7fa035e62d5179de9243f672aed9bb9cbaca
          mkdir -p structural-v89-pilot/shard-${{ matrix.shard }}
          sha256sum research/drnas-sat-v7-6/v76_single.cpp research/drnas-sat-v7-7/v77_single.cpp research/drnas-sat-v7-8/v89_yield_probe.cpp > structural-v89-pilot/shard-${{ matrix.shard }}/source_hashes.txt
          python3 - <<'PY'
          from pathlib import Path
          src=Path('research/drnas-sat-v7-7/v77_single.cpp').read_text()
          marker='\nint main(int argc,char**argv) {'
          assert src.count(marker)==1
          pre=src.split(marker,1)[0]
          assert 'static V77 solve77(' in pre
          Path('research/drnas-sat-v7-7/v77_embedded_functions.inc').write_text(pre+'\n')
          PY
          git clone --depth 1 --branch rel-3.0.1 https://github.com/arminbiere/cadical.git cadical-src
          test "$(git -C cadical-src rev-parse HEAD)" = c60730422e758ef1cebe7aeddf2dda31c996bf04
          (cd cadical-src && ./configure && make -j2 >/tmp/ca-build.log 2>&1) || { tail -100 /tmp/ca-build.log; exit 1; }
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -I cadical-src/src \
            research/drnas-sat-v7-8/v89_yield_probe.cpp \
            cadical-src/build/libcadical.a -o v89_yield_probe -pthread -ldl -lz
          lscpu > structural-v89-pilot/shard-${{ matrix.shard }}/cpu.txt
      - name: Run 8 new CNFs x 3 repetitions x 5 matched modes
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/structural_pilot_v89.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structural-v89-shard-${{ matrix.shard }}
          path: structural-v89-pilot/shard-${{ matrix.shard }}/
          if-no-files-found: warn
  structural-audit:
    if: always()
    needs: structural-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: structural-v89-shard-*
          path: structural-v89-combined-tmp
      - name: Audit every formula, timeout, control and structural feature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p combined-structural-v89
          for shard in 0 1 2 3 4; do
            test -f "structural-v89-combined-tmp/structural-v89-shard-$shard/manifest.json"
            mv "structural-v89-combined-tmp/structural-v89-shard-$shard" "combined-structural-v89/shard-$shard"
          done
          python3 -u research/drnas-sat-v7-8/summarize_structural_v89.py combined-structural-v89 | tee combined-structural-v89/actions-summary.md
          cat combined-structural-v89/actions-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-v89-structural-pilot40-full-audit
          path: combined-structural-v89/
          if-no-files-found: warn
