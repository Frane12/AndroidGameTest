name: DRNAS 2026 SAT Main Track - Unofficial 18-CNF Mini Simulation
on:
  push:
    branches:
      - experiment/drnas-official-2026-mini-sim-20261031
    paths:
      - '.github/workflows/drnas-official-2026-mini-sim.yml'
      - 'research/drnas-sat-v7-8/official_2026_mini_sim.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: v96-frozen-causal-input-manifest
          run-id: 41239481557
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: v96
      - name: Freeze actual 2026 CNFs and public official provenance
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/official_2026_mini_sim.py
          (cd v96 && sha256sum -c v96_manifest.sha256)
          python3 -u research/drnas-sat-v7-8/official_2026_mini_sim.py freeze \
            --v96 v96/v96_manifest.json \
            --out official_mini_manifest.json
          sha256sum official_mini_manifest.json > official_mini_manifest.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-mini-2026-frozen-inputs
          path: |
            official_mini_manifest.json
            official_mini_manifest.sha256
          if-no-files-found: warn
  shard:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5]
    name: mini-shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: official-mini-2026-frozen-inputs
          path: frozen
      - name: Compile pinned CaDiCaL 3.0.1 and independent Kissat 4.0.4
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c official_mini_manifest.sha256)
          test "$(git hash-object research/drnas-sat-v7-6/v76_single.cpp)" = a254356a45b70f02f33b9506f1122dad33916ca7
          test "$(git hash-object research/drnas-sat-v7-7/v77_single.cpp)" = 1bbb7fa035e62d5179de9243f672aed9bb9cbaca
          python3 - <<'PY'
          from pathlib import Path
          s=Path('research/drnas-sat-v7-7/v77_single.cpp').read_text()
          marker='\nint main(int argc,char**argv) {'
          assert s.count(marker)==1
          Path('research/drnas-sat-v7-7/v77_embedded_functions.inc').write_text(s.split(marker,1)[0]+'\n')
          PY
          git clone --depth 1 --branch rel-3.0.1 https://github.com/arminbiere/cadical.git cadical-src
          test "$(git -C cadical-src rev-parse HEAD)" = c60730422e758ef1cebe7aeddf2dda31c996bf04
          python3 research/drnas-sat-v7-8/patch_cadical_v90.py cadical-src
          (cd cadical-src && ./configure && make -j2 >/tmp/mini-cadical-build.log 2>&1) \
            || { tail -120 /tmp/mini-cadical-build.log; exit 1; }
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -I cadical-src/src \
            research/drnas-sat-v7-8/v101_graded_confidence_probe.cpp \
            cadical-src/build/libcadical.a -o mini_drnas -pthread -ldl -lz
          git clone --depth 1 --branch rel-4.0.4 https://github.com/arminbiere/kissat.git kissat-src
          test "$(git -C kissat-src rev-parse --short=7 HEAD)" = 8af8e56
          (cd kissat-src && ./configure && make -j2 >/tmp/mini-kissat-build.log 2>&1) \
            || { tail -120 /tmp/mini-kissat-build.log; exit 1; }
          test -x kissat-src/build/kissat
          {
            echo "Runner:"
            lscpu
            echo "CaDiCaL commit: $(git -C cadical-src rev-parse HEAD)"
            echo "Kissat commit: $(git -C kissat-src rev-parse HEAD)"
            echo "GitHub runner: $RUNNER_NAME"
            echo "DRNAS source SHA256:"
            sha256sum research/drnas-sat-v7-8/v101_graded_confidence_probe.cpp
          } > build_provenance.txt
      - name: Same 30s/3GiB/one core, 3 real 2026 CNFs x 6 solvers x 2 reps
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/official_2026_mini_sim.py run \
            --manifest frozen/official_mini_manifest.json \
            --drnas ./mini_drnas --kissat ./kissat-src/build/kissat \
            --shard "$SHARD" --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-shard-${{ matrix.shard }}
          path: |
            results/
            build_provenance.txt
          if-no-files-found: warn
  audit:
    needs: [freeze,shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: official-mini-2026-frozen-inputs
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: mini-shard-*
          path: combined
      - name: Strict competition-style PAR2 audit, no ranks invented
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c official_mini_manifest.sha256)
          python3 -u research/drnas-sat-v7-8/official_2026_mini_sim.py audit \
            --manifest frozen/official_mini_manifest.json \
            --combined combined \
            --out official_mini_report.json --md official_mini_report.md
          cat official_mini_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-UnOfficial-SATComp2026-Mini-216-Matched
          path: |
            frozen/
            combined/
            official_mini_report.json
            official_mini_report.md
          if-no-files-found: warn
