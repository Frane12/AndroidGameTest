name: DRNAS R66 audit-only recovery from existing 8 frozen shards
on:
  push:
    branches: [experiment/drnas-r66-audit-recovery-20261103]
    paths:
      - '.github/workflows/drnas-r66-audit-only-recovery.yml'
      - 'experiments/drnas_v16/r66_r65_blind_short_holdout.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r66-audit-only-recovery-20261103
  cancel-in-progress: false
jobs:
  audit:
    name: Restore existing 12 new-source trials without any solver rerun
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r66-frozen-new-official-sources
          run-id: 41717235335
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: r66-shard-*
          run-id: 41717235335
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: combined
      - name: Audit frozen original SHA and all eight paired shard artifacts only
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/r66_r65_blind_short_holdout.py
          (cd new && sha256sum -c source.sha256)
          python3 -u experiments/drnas_v16/r66_r65_blind_short_holdout.py audit --sources new --combined combined --json r66-final.json --md r66-final.md
          cat r66-final.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DRNAS-R66-R65-BLIND-SHORT-AUDIT-RECOVERED
          path: |
            r66-final.json
            r66-final.md
            new/manifest.json
          if-no-files-found: error
          retention-days: 90
