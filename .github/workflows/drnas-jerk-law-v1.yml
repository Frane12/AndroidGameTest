name: DRNAS Jerk Law V1 read-only falsification
on:
  push:
    branches: [experiment/drnas-jerk-law-v1-20261101]
    paths: ['research/tseitin-replay/jerk_law_v1.py', '.github/workflows/drnas-jerk-law-v1.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  jerk-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned verified cumulative analytics artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41344728214 --repo "$GITHUB_REPOSITORY" --name DRNAS-V1531-SQLite-Analytics --dir input
          test -s input/telemetry.csv
          test -s input/paired.csv
      - name: Run read-only hypothesis test
        run: |
          python3 research/tseitin-replay/jerk_law_v1.py --telemetry input/telemetry.csv --paired input/paired.csv --out jerk-output
          cat jerk-output/jerk_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-Jerk-Law-V1-Exploratory
          path: jerk-output/
