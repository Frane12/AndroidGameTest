name: DRNAS R164 exact XOR plus event-incremental GF2/CDCL 30s mixed
on:
  push:
    branches: [experiment/drnas-r164-exact-xor-incremental-20261106]
    paths:
      - '.github/workflows/drnas-r164-exact-xor-incremental.yml'
      - 'research/r164_component_feedback.cpp'
      - 'research/r164_component_benchmark.py'
      - 'research/r164_pure_exact_gf2.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r164-exact-incremental-8-original-64-pairs
  cancel-in-progress: false
jobs:
  build:
    name: Compile ONCE pinned CaDiCaL and R164; immutable source and GF2 reasons selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the single common source-locked R164/CaDiCaL native binary
        run: |
          set -euo pipefail
          mkdir -p r164
          python3 -m py_compile research/r164_component_benchmark.py research/r164_pure_exact_gf2.py research/r157_source_certified_xor.py
          git clone -q https://github.com/arminbiere/cadical.git /tmp/r164-cadical
          cd /tmp/r164-cadical
          git checkout -q rel-2.1.0
          git rev-parse HEAD > "$GITHUB_WORKSPACE/r164/cadical-source-commit.txt"
          ./configure
          make -j2
          g++ -std=c++17 -O2 -Wall -Wextra -I./src "$GITHUB_WORKSPACE/research/r164_component_feedback.cpp" ./build/libcadical.a -o "$GITHUB_WORKSPACE/r164/r164-native"
          cd "$GITHUB_WORKSPACE"
          ./r164/r164-native selftest | tee r164/native-selftest.log
          grep -q '^R99_WATCH_SELFTEST_PASS' r164/native-selftest.log
          grep -q '^R133C_GF2_CLOSURE_SELFTEST_PASS' r164/native-selftest.log
          grep -q '^R148_DIRECT_SELFTEST_PASS' r164/native-selftest.log
          grep -q '^R164_COMPONENT_GATE_SELFTEST_PASS' r164/native-selftest.log
          grep -q '^R164_INCREMENTAL_SELFTEST_PASS' r164/native-selftest.log
          python3 - <<'PY'
          import pathlib,hashlib,json,subprocess
          p=pathlib.Path("r164/r164-native")
          obj=dict(binary_sha256=hashlib.sha256(p.read_bytes()).hexdigest(),
            commit=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            cadical_source_commit=pathlib.Path("r164/cadical-source-commit.txt").read_text().strip(),
            compiler=subprocess.check_output(["g++","--version"],text=True).splitlines()[0])
          pathlib.Path("r164/build-pin.json").write_text(json.dumps(obj,sort_keys=True,indent=2))
          print("R164_SINGLE_BINARY_PIN_PASS",json.dumps(obj,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r164-single-frozen-binary-and-source-commit
          path: |
            r164/r164-native
            r164/build-pin.json
            r164/cadical-source-commit.txt
            r164/native-selftest.log
          retention-days: 90
  paired:
    needs: build
    name: Four-mode ORIGINAL CNF 30s mixed and 5s controls same-binary paired shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r164-single-frozen-binary-and-source-commit
          path: r164
      - uses: actions/download-artifact@v4
        with:
          name: r155-original25-pinned-native-and-independent-smoke
          run-id: 42112755104
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r164
      - name: Enforce SAME precompiled native SHA and record paired CPU source
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          chmod +x r164/r164-native
          python3 - <<'PY'
          import pathlib,hashlib,json,os,subprocess
          pin=json.loads(pathlib.Path("r164/build-pin.json").read_text())
          check=hashlib.sha256(pathlib.Path("r164/r164-native").read_bytes()).hexdigest()
          assert check==pin["binary_sha256"],"R164 NATIVE BINARY DRIFT"
          assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==pin["commit"]
          pin["cpu"]=next((v for v in pathlib.Path("/proc/cpuinfo").read_text().splitlines() if v.startswith("model name")),"unknown")
          pin["shard"]=int(os.environ["SHARD"])
          pathlib.Path("r164/pin-"+os.environ["SHARD"]+".json").write_text(json.dumps(pin,sort_keys=True))
          print("R164_COMMON_BINARY_SHA_PASS",check,"shard",os.environ["SHARD"])
          PY
      - name: Independently replay source-certified GF2 rows and 4 modes on original sources
        run: |
          set -euo pipefail
          python3 -u research/r164_component_benchmark.py shard --shard ${{ matrix.shard }} --binary r164/r164-native | tee r164/shard-${{ matrix.shard }}.log
          grep -q '^R164_SHARD_PASS ' r164/shard-${{ matrix.shard }}.log
          test -s r164/shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r164-causal-shard-${{ matrix.shard }}
          path: |
            r164/shard-${{ matrix.shard }}.json
            r164/shard-${{ matrix.shard }}.log
            r164/pin-${{ matrix.shard }}.json
            r164/prep-*.json
            r164/cert-*.json
          if-no-files-found: warn
          retention-days: 90
  pure:
    name: Exact CNF-equivalent XOR SAT and parity contradiction proof replay on pinned real originals
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r155-original25-pinned-native-and-independent-smoke
          run-id: 42112755104
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r164
      - name: Selftest then examine ALL 25 original CNFs (only exact-equivalent formulas may fast-path)
        run: |
          set -euo pipefail
          python3 research/r164_pure_exact_gf2.py --selftest | tee r164/pure-selftest.log
          grep -q '^R164_PURE_SELFTEST_PASS' r164/pure-selftest.log
          python3 - <<'PY'
          import json,pathlib,sys,hashlib
          sys.path.insert(0,str(pathlib.Path("research").resolve()))
          import r164_pure_exact_gf2 as pure
          base=pathlib.Path("r164/frozen")
          manifest=json.loads((base/"manifest.json").read_text())
          assert len(manifest["cases"])==25
          results=[]
          for c in manifest["cases"]:
              p=base/(c["id"]+".cnf")
              assert hashlib.sha256(p.read_bytes()).hexdigest()==c["sha256"],"original input SHA drift"
              v=pure.solve(p)
              assert v["source_sha256"]==c["sha256"]
              results.append(dict(id=c["id"],cohort=c["cohort"],**v))
              print("R164_PURE_REAL",c["id"],v["status"],v["xor_rows"],v["elapsed_s"],flush=True)
          pathlib.Path("r164/pure-results.json").write_text(json.dumps(results,indent=2,sort_keys=True))
          print("R164_PURE_REAL_PASS",len(results),"pure",sum(x["pure_exact"] for x in results),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r164-pure-exact-original25-validation
          path: |
            r164/pure-selftest.log
            r164/pure-results.json
          if-no-files-found: warn
          retention-days: 90
  audit:
    needs: [paired,pure]
    name: Audit 64 SHA-paired native conflict decision GF2 source proof and true SAT models
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r164-single-frozen-binary-and-source-commit
          path: r164
      - uses: actions/download-artifact@v4
        with:
          name: r155-original25-pinned-native-and-independent-smoke
          run-id: 42112755104
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r164
      - uses: actions/download-artifact@v4
        with:
          pattern: r164-causal-shard-*
          merge-multiple: true
          path: r164
      - uses: actions/download-artifact@v4
        with:
          name: r164-pure-exact-original25-validation
          path: r164
      - name: Final source-specific causal and regression correctness audit
        run: |
          set -euo pipefail
          test "$(find r164 -maxdepth 1 -name 'shard-*.json' | wc -l)" -eq 4
          python3 -u research/r164_component_benchmark.py audit | tee r164/audit.log
          grep -q '^R164_FINAL ' r164/audit.log
          test -s r164/pure-results.json
          python3 - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path("r164/report.json").read_text())
          with open(pathlib.Path("r164/report-summary.md"),"w") as f:
           f.write("# DRNAS R164: component-conditioned GF2/CDCL feedback metrics\n\n")
           f.write("8 development SHA CNFs; four modes; two repetitions; 64 trials; mixed cap 30s.\n\n")
           f.write("| Mode | Solved | PAR2 s | Conflicts | Decisions | Learned | GF2 proposals | Full reasons |\n")
           f.write("|---|---:|---:|---:|---:|---:|---:|---:|\n")
           for key,d in x["summary"]["all"].items():
            f.write(f'| {key} | {d["solved"]}/{d["trials"]} | {d["PAR2_s"]:.4f} | {d["conflicts"]} | {d["decisions"]} | {d["learned_clauses"]} | {d["proposed_GF2"]} | {d["completed_reason_clauses"]} |\n')
           f.write("\nRESEARCH ONLY. Same R154 development set; non-blind; no independent UNSAT LRAT.\n")
          PY
          cat r164/report-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R164-EXACT-GF2-INCREMENTAL-30S-8-ORIGINAL-64-PAIRED-AUDIT-FINAL
          path: |
            r164/report.json
            r164/audit.log
            r164/report-summary.md
            r164/pure-results.json
          if-no-files-found: warn
          retention-days: 90
