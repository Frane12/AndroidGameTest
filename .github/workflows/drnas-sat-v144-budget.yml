name: DRNAS V14.4 - XOR budget regression
on:
  push:
    branches: [experiment/drnas-v144-bounded-elimination-20261101]
    paths:
      - '.github/workflows/drnas-sat-v144-budget.yml'
      - 'research/drnas-sat-v7-8/v144_mixedxor_preprocess.cpp'
      - 'research/drnas-sat-v7-8/test_v144_budget.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build solver and verify bounded XOR reasoning
        run: |
          set -euo pipefail
          cd research/drnas-sat-v7-8
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic v144_mixedxor_preprocess.cpp -o /tmp/drnas-v144
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic test_v144_budget.cpp -o /tmp/drnas-v144-test
          /tmp/drnas-v144-test
