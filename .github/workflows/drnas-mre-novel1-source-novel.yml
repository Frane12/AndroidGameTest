name: DRNAS MRE-NOVEL1 - source-novel GF2 CaDiCaL placebo and delivery
run-name: MRE-NOVEL1 6 original SHA x 6 arms x 2 reps 8s 72 oneCPU E2E
on:
  push:
    branches: [experiment/drnas-mre-novel1-source-novel-gf2-20261110]
    paths:
      - research/drnas_mre_novel1.py
      - research/drnas_mre_novel1.cpp
      - .github/workflows/drnas-mre-novel1-source-novel.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-mre-novel1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  freeze:
    name: Compile pinned native CaDiCaL and freeze six source SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore original GF2-S1 frozen sources and binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42776296568 -R Frane12/AndroidGameTest -n gf2-s1-frozen-17SHA-exact-binaries -D .
          test -s mre_gf2_s1/manifest.json
          test -s mre_equiv9/manifest.json
          test -s built/bin/kissat_4_0_4
          chmod +x mre_gf2_s1/bin/gf2_exact mre_x4/bin/native built/bin/kissat_4_0_4 mre_equiv7/bin/cadical_3_0_1
      - name: Pin CaDiCaL 2.1.0 and compile source-novel IPASIR-UP
        run: |
          set -euo pipefail
          git clone -q https://github.com/arminbiere/cadical.git /tmp/novel1-cadical
          cd /tmp/novel1-cadical
          git -c advice.detachedHead=false checkout 31f9aae44947c673dc6190c9beb399acb9ffec6a
          test "$(git rev-parse HEAD)" = "31f9aae44947c673dc6190c9beb399acb9ffec6a"
          ./configure
          make -j2
          mkdir -p "$GITHUB_WORKSPACE/mre_gf2cdcl_live5/bin"
          g++ -O2 -std=c++17 -Wall -Wextra -I./src "$GITHUB_WORKSPACE/research/drnas_mre_novel1.cpp" ./build/libcadical.a -o "$GITHUB_WORKSPACE/mre_gf2cdcl_live5/bin/gf2cdcl"
          chmod +x "$GITHUB_WORKSPACE/mre_gf2cdcl_live5/bin/gf2cdcl"
      - name: Verify toy SAT source original and freeze proof-checked SHA
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          mkdir -p mre_novel1
          python3 -m py_compile research/drnas_mre_novel1.py
          python3 -u research/drnas_mre_novel1.py selftest | tee mre_novel1/selftest.log
          grep -q '^MRE_NOVEL1_SELFTEST_PASS ' mre_novel1/selftest.log
          python3 -u research/drnas_mre_novel1.py freeze | tee mre_novel1/freeze.log
          grep -q '^MRE_NOVEL1_FREEZE_PASS ' mre_novel1/freeze.log
          python3 -u research/drnas_mre_novel1.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mre-novel1-frozen6-source-Kissat-native
          retention-days: 21
          if-no-files-found: warn
          path: |
            mre_novel1/manifest.json
            mre_novel1/selftest.log
            mre_novel1/freeze.log
            mre_gf2cdcl_live5/bin/gf2cdcl
            mre_gf2_s1/manifest.json
            mre_gf2_s1/bin/gf2_exact
            mre_equiv9/manifest.json
            mre_equiv9/cases/*.cnf
            mre_binary_scc2/manifest.json
            mre_binary_scc1/manifest.json
            mre_equiv10m5/manifest.json
            mre_equiv10medium/manifest.json
            mre_equiv7/manifest.json
            mre_x20/manifest.json
            prior_x22/mre_x22/manifest.json
            prior_equiv6/mre_equiv6/manifest.json
            mre_x4/bin/native
            built/bin/kissat_4_0_4
            mre_equiv7/bin/cadical_3_0_1
            mre5/lib/libcryptominisat5.so.5.11
  paired:
    name: MRE-NOVEL1 original SHA placebo and source-novel native shard ${{ matrix.shard }}
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mre-novel1-frozen6-source-Kissat-native
          path: .
      - name: Verify frozen source then run 12 original SHA E2E trials
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_gf2cdcl_live5/bin/gf2cdcl mre_gf2_s1/bin/gf2_exact mre_x4/bin/native built/bin/kissat_4_0_4 mre_equiv7/bin/cadical_3_0_1
          python3 -u research/drnas_mre_novel1.py verify
          python3 -u research/drnas_mre_novel1.py shard --shard ${{ matrix.shard }} | tee mre_novel1/shard-${{ matrix.shard }}.log
          grep -q '^MRE_NOVEL1_SHARD_PASS ' mre_novel1/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mre-novel1-shard-${{ matrix.shard }}
          retention-days: 21
          if-no-files-found: warn
          path: |
            mre_novel1/shard-${{ matrix.shard }}.json
            mre_novel1/shard-${{ matrix.shard }}.log
  audit:
    name: Full proof replay original SAT models matched PAR2 and placebo cost
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mre-novel1-frozen6-source-Kissat-native
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: mre-novel1-shard-*
          path: mre_novel1
          merge-multiple: true
      - name: Strict independent GF2 proof and PAR2 final audit
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_gf2cdcl_live5/bin/gf2cdcl mre_gf2_s1/bin/gf2_exact mre_x4/bin/native built/bin/kissat_4_0_4 mre_equiv7/bin/cadical_3_0_1
          python3 -u research/drnas_mre_novel1.py verify
          python3 -u research/drnas_mre_novel1.py audit | tee mre_novel1/audit.log
          grep -q '^MRE_NOVEL1_FINAL ' mre_novel1/audit.log
          grep '^MRE_NOVEL1_FINAL ' mre_novel1/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-MRE-NOVEL1-72-ONECPU-SOURCE-NOVEL-PAR2-FINAL
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_novel1/report.json
            mre_novel1/audit.log
            mre_novel1/manifest.json
            mre_novel1/shard-*.json
