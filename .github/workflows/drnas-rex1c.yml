name: DRNAS REX1-C wider gated relational benchmark
on:
  push:
    branches: [experiment/drnas-rex1-20261112]
    paths: [.github/workflows/drnas-rex1c.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drnas-rex1c-single
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: python3 -m py_compile research/drnas_rex1_probe.py research/drnas_rex1c_gated.py
      - name: Disjoint calibration and wider 80-formula holdout
        run: python3 -u research/drnas_rex1c_gated.py --train 101,102,103,104 --holdout 91,92,93,94,95,96,97,98 --top 6 --budget 5000 | tee rex1c.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rex1c-wider-gated-benchmark
          retention-days: 7
          path: |
            rex1c.log
            rex1c.jsonl
            rex1c-summary.json
