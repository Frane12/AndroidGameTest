name: DRNAS R27 recover structural interface audit from original artifacts
on:
  push:
    branches: [experiment/drnas-r27-xor-residual-links-20261103]
    paths: ['.github/workflows/drnas-r27-recover-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax check report-only, no new sampling
        run: python3 -m py_compile experiments/drnas_v16/r27_links_report.py
      - uses: actions/download-artifact@v4
        with:
          name: R26-frozen-53-inputs
          run-id: 41606832040
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: input
      - uses: actions/download-artifact@v4
        with:
          pattern: r27-shard-*
          run-id: 41612160837
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: combined
      - uses: actions/download-artifact@v4
        with:
          pattern: r26-shard-*
          run-id: 41606832040
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: historical
      - name: Validate 17 original SHA sources, GF2 certificates, paired R26 timings
        run: |
          set -euo pipefail
          (cd input && sha256sum -c r26_all_53.sha256)
          python3 -u experiments/drnas_v16/r27_links_report.py --input input --combined combined --historical historical --json r27-bridge-report.json --md r27-bridge-report.md
          cat r27-bridge-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R27-REAL-POLYNOMIAL-INTERFACE-RECOVERED-REPORT
          path: |
            r27-bridge-report.json
            r27-bridge-report.md
            combined/
          if-no-files-found: warn
