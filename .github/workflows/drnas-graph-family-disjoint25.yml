name: DRNAS GRAPH 8-family-disjoint original SAT2025 strict verified PAR2
on:
  push:
    branches: [experiment/drnas-graph-family-disjoint25-20261116]
    paths:
      - research/graph_family_disjoint25/**
      - research/GRAPH_FAMILY_DISJOINT25_PROTOCOL.md
      - .github/workflows/drnas-graph-family-disjoint25.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-graph-family-disjoint25-20261116
  cancel-in-progress: true
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 43853390060
          name: grand-union-sha-pinned-binaries-sources
          github-token: ${{ github.token }}
          path: grand67
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 43891106380
          name: graph-unseen25-all-sources-and-frozen-binaries
          github-token: ${{ github.token }}
          path: prior10
      - name: Restore prior immutable history, frozen native references and original-source external verifiers
        run: |
          set -euo pipefail
          test -s grand67/grand_unified_frozen.tgz
          test -s prior10/graph-unseen25-freeze.tgz
          sha256sum grand67/grand_unified_frozen.tgz prior10/graph-unseen25-freeze.tgz
          tar -xzf grand67/grand_unified_frozen.tgz
          tar -xzf prior10/graph-unseen25-freeze.tgz research/graph_unseen25/inputs/manifest.json
          test -s unified_realblind100_inputs/manifest.json
          test -s research/graph_unseen25/inputs/manifest.json
          chmod +x build/drnas-sat-native-x59 build/drnas-x59-xor-math5-unified1 \
            build/drnas-unified-core1 build/drnas-pcmax-base \
            build/drnas-pcmax-mg7-ipg1-bdd3 \
            build/kissat build/cadical build/cms build/drat-trim build/frat-rs \
            veripb-tool/bin/veripb
          veripb-tool/bin/veripb --version
      - name: Preflight exact 12 GBD source-only prespec and source-soundness controls
        run: |
          set -euo pipefail
          python3 -m py_compile \
            research/graph_family_disjoint25/freeze.py \
            research/graph_family_disjoint25/benchmark.py \
            research/clique_color_er/emit_veripb.py \
            research/clique_color_er/source_check.py \
            research/graphclique/real67.py \
            research/math5_standard_real67/benchmark.py \
            research/unified_evidence/benchmark.py
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path("research/graph_family_disjoint25/prespec.json")
          d=json.loads(p.read_text())
          records=d["records"]
          assert d["candidate_locked_before_any_evaluation"]
          assert d["no_replacement_after_freeze_or_outcomes"]
          assert len(records)==d["selected_sources"]==12
          assert len({s["gbd_hash"] for s in records})==12
          assert len({s["isohash"] for s in records})==12
          assert len({s["family"] for s in records})==8
          print("GRAPH_DISJOINT25_PRESPEC_SHA256",hashlib.sha256(p.read_bytes()).hexdigest(),flush=True)
          PY
          python3 -u research/clique_color_er/selftest.py | tee graph_disjoint25_safety.log
          grep -q '^CLIQUE_COLOR_ER_SAFETY_PASS ' graph_disjoint25_safety.log
      - name: SOURCE ONLY — download and SHA-freeze all 12 GBD originals before running ANY solver or classifier on them
        run: |
          set -euo pipefail
          python3 -u research/graph_family_disjoint25/freeze.py | tee graph_disjoint25_freeze.log
          grep -q '^GRAPH_DISJOINT25_SOURCE_FREEZE_COMPLETE ' graph_disjoint25_freeze.log
      - name: Freeze all 7 solver/checker hashes and strict end-to-end paired protocol
        run: |
          set -euo pipefail
          python3 -u research/graph_family_disjoint25/benchmark.py prepare | tee graph_disjoint25_prepare.log
          grep -q '^GRAPH_DISJOINT25_PREPARED ' graph_disjoint25_prepare.log
          python3 - <<'PY'
          from pathlib import Path
          import tarfile,sys,hashlib,json
          sys.path.insert(0,str(Path("research/unified_evidence").resolve()))
          import benchmark as prior
          required=set(prior.REQUIRED_BIN)
          required.update((
            "unified_realblind100_inputs/manifest.json",
            "unified_evidence_results/protocol.json",
            "research/graph_unseen25/inputs/manifest.json",
            "research/graph_family_disjoint25/inputs",
            "results/graph_family_disjoint25/protocol.json"))
          output=Path("graph-disjoint25-all-original-sources-frozen.tgz")
          with tarfile.open(output,"w:gz") as archive:
              for path in sorted(required):
                  assert Path(path).exists(),("SOURCE_OR_FROZEN_BIN_MISSING",path)
                  archive.add(path,arcname=path,recursive=True)
          with tarfile.open(output,"r:gz") as archive:
              members=set(archive.getnames())
          missing=sorted(required-members)
          assert not missing,("INCOMPLETE_FROZEN_ARCHIVE",missing)
          path=Path("research/graph_family_disjoint25/inputs")
          sources=list(path.glob("[0-9][0-9]-*.cnf"))
          assert len(sources)==12
          print("GRAPH_DISJOINT25_ARCHIVE_AUDIT",{
            "frozen_bin_paths":len(prior.REQUIRED_BIN),"missing":missing,
            "original_CNF_count":len(sources),
            "archive_sha256":hashlib.sha256(output.read_bytes()).hexdigest()},flush=True)
          PY
          sha256sum graph-disjoint25-all-original-sources-frozen.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: graph-disjoint25-original-sources-and-reference-binaries
          retention-days: 60
          if-no-files-found: error
          path: graph-disjoint25-all-original-sources-frozen.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-disjoint25-source-only-freeze-audit
          retention-days: 60
          path: |
            graph_disjoint25_safety.log
            graph_disjoint25_freeze.log
            graph_disjoint25_prepare.log
            research/graph_family_disjoint25/inputs/manifest.json
            results/graph_family_disjoint25/protocol.json
  paired:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0,1,2,3,4,5]
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: graph-disjoint25-original-sources-and-reference-binaries
      - name: Restore same 12 original CNFs and reference proof checkers
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcryptominisat5-5.11t64 libboost-program-options1.83.0
          tar -xzf graph-disjoint25-all-original-sources-frozen.tgz
          chmod +x build/drnas-sat-native-x59 build/drnas-x59-xor-math5-unified1 \
            build/drnas-unified-core1 build/drnas-pcmax-base \
            build/drnas-pcmax-mg7-ipg1-bdd3 \
            build/kissat build/cadical build/cms build/drat-trim build/frat-rs \
            veripb-tool/bin/veripb
      - name: One logical CPU per trial — serial source-paired 7-arm 8s strict E2E original-source proof audit
        run: |
          set -euo pipefail
          python3 -u research/graph_family_disjoint25/benchmark.py shard --index ${{ matrix.shard }} \
            | tee graph_disjoint25_shard.log
          grep -q '^GRAPH_DISJOINT25_SHARD ' graph_disjoint25_shard.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-disjoint25-shard-${{ matrix.shard }}
          retention-days: 60
          if-no-files-found: error
          path: |
            results/graph_family_disjoint25/shard-${{ matrix.shard }}/trials.jsonl
            graph_disjoint25_shard.log
  aggregate:
    needs: [freeze,paired]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: graph-disjoint25-original-sources-and-reference-binaries
      - uses: actions/download-artifact@v4
        with:
          pattern: graph-disjoint25-shard-*
          path: collected
      - name: Audit exactly 168 trials, all source SHA and independent accepted proof kinds; reject all critical errors
        run: |
          set -euo pipefail
          tar -xzf graph-disjoint25-all-original-sources-frozen.tgz
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          for i in range(6):
              matches=list((Path("collected")/f"graph-disjoint25-shard-{i}").glob("**/trials.jsonl"))
              assert len(matches)==1,(i,matches)
              folder=Path("results/graph_family_disjoint25")/f"shard-{i}"
              folder.mkdir(parents=True,exist_ok=False)
              shutil.copy2(matches[0],folder/"trials.jsonl")
          PY
          python3 -u research/graph_family_disjoint25/benchmark.py report | tee graph_disjoint25_final.log
          grep -q '^GRAPH_DISJOINT25_FINAL ' graph_disjoint25_final.log
          cat graph_disjoint25_final.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-disjoint25-final-strict-E2E-PAR2
          retention-days: 60
          if-no-files-found: warn
          path: |
            results/graph_family_disjoint25/final.json
            results/graph_family_disjoint25/shard-*/trials.jsonl
            graph_disjoint25_final.log
