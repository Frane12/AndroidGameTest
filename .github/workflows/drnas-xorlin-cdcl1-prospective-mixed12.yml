name: DRNAS XORLIN-CDCL1 prospective 12 mixed original SAT UNSAT strict E2E
on:
  push:
    branches: [experiment/drnas-xorlin-cdcl1-prospective-mixed12-20261117]
    paths:
      - research/xorlin_cdcl1_prospective_mixed12/**
      - research/XORLIN_CDCL1_PROSPECTIVE_MIXED12_PROTOCOL.md
      - .github/workflows/drnas-xorlin-cdcl1-prospective-mixed12.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-xorlin-cdcl1-new-mixed12-20261117
  cancel-in-progress: true
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download EXACT previously certified single-executable binary, prior 119 source manifests and verifiers
        uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 44065020804
          name: xorlin-cdcl1-oneprocess-original12-and-native-executable
          github-token: ${{ github.token }}
          path: prior
      - name: Restore frozen one-PID solver; assert its binary, C++ source and GF2 math hashes are unchanged
        run: |
          set -euo pipefail
          test -s prior/xorlin-cdcl1-frozen12-binaries.tgz
          sha256sum prior/xorlin-cdcl1-frozen12-binaries.tgz
          tar -xzf prior/xorlin-cdcl1-frozen12-binaries.tgz
          chmod +x build/drnas-xorlin-cdcl1 build/drat-trim build/frat-rs \
            build/kissat build/cadical build/cms veripb-tool/bin/veripb
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          sys.path.insert(0,"research/unified_evidence")
          import benchmark as frozen
          original_sha={
            "build/drnas-xorlin-cdcl1":"2046aee7f7cb1eb3dfc44b2e7a7b5a9f69b482230f106a4aaea93ab968f60646",
            "research/xorlin_cdcl1/solver.cpp":"19d55c9e39fd876e70a7617bd6ec12d4b2bdafb1dc23f3c1f45573e817c36a56",
            "src/drnas_x59.cpp":"87985c90d03ce03aba069bb2a0e594f81cdb842bc1b0d49eaad79891c77b49a2"}
          for path,digest in original_sha.items():
              assert frozen.sha(Path(path))==digest,("FROZEN_NATIVE_CODE_CHANGED",path)
          if hasattr(__import__("os"),"sched_setaffinity"):
              import os
              os.sched_setaffinity(0,{min(os.sched_getaffinity(0))})
              assert len(os.sched_getaffinity(0))==1
          p=json.loads(Path("results/xorlin_cdcl1_paired12/protocol.json").read_text())
          assert p["workflow_commit_sha256"]=="3ec2df9ee56e434aba9ee72b957fdbf3c69f2571"
          assert frozen.sha(Path("build/drnas-xorlin-cdcl1"))==p["new_binary_sha256"]
          assert frozen.sha(Path("src/drnas_x59.cpp"))==p["old_cdcl_cpp_sha256"]
          assert frozen.pinned()==p["frozen_reference_binaries_sha256"]
          assert Path("research/xorlin1_prospective_mixed12/inputs/manifest.json").is_file()
          print("XORLIN_CDCL1_PROSPECTIVE_FROZEN_SOLVER_PIN_PASS",flush=True)
          PY
      - name: Metadata-only preregistration and 24 independent VeriPB UNSAT / 48 SAT controls before new source download
        run: |
          set -euo pipefail
          python3 -m py_compile research/xorlin_cdcl1_prospective_mixed12/freeze.py \
            research/xorlin_cdcl1_prospective_mixed12/benchmark.py
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("research/xorlin_cdcl1_prospective_mixed12/prespec.json")
          pre=json.loads(p.read_text())
          assert pre["protocol"]=="DRNAS-XORLIN-CDCL1-PROSPECTIVE-MIXED12-20261117-V1"
          assert pre["prespec_lock"].startswith("metadata only")
          assert pre["previous_source_count"]==119
          assert pre["comparison_binary_source_run_id"]==44065020804
          assert pre["exact_selected_count"]==len(pre["sources"])==12
          assert len({s["gbd_hash"] for s in pre["sources"]})==12
          assert len({s["isohash"] for s in pre["sources"]})==12
          assert len({s["isohash2"] for s in pre["sources"]})==12
          assert len(pre["earlier_source_manifests"])==6
          assert set(s["catalog_result"] for s in pre["sources"])=={"sat","unsat"}
          assert len([s for s in pre["sources"] if s["catalog_result"]=="sat"])==6
          assert len(pre["comparison_arms"])==5 and pre["pairing"]["expected_trials"]==120
          assert pre["guarantees"]["no_source_or_algorithm_changes_after_outcomes"] is True
          print("XORLIN_CDCL1_PROSPECTIVE_PRESPEC_SHA256",
                hashlib.sha256(p.read_bytes()).hexdigest(),flush=True)
          PY
          python3 -u research/xorlin1/selftest.py | tee xorlin_cdcl1_prospective_safety.log
          grep -q '^XORLIN1_SAFETY_PASS ' xorlin_cdcl1_prospective_safety.log
      - name: Pre-solver download, SHA256 source-only freeze; reject any 119-old exact/iso/raw collision, missing or oversized CNF
        run: |
          set -euo pipefail
          python3 -u research/xorlin_cdcl1_prospective_mixed12/freeze.py \
            | tee xorlin_cdcl1_prospective_freeze.log
          grep -q '^XORLIN_CDCL1_PROSPECTIVE_SOURCE_FREEZE_COMPLETE ' \
            xorlin_cdcl1_prospective_freeze.log
      - name: Lock exact source SHA, tested one-process binary and standard checkers before any new paired solver trial
        run: |
          set -euo pipefail
          python3 -u research/xorlin_cdcl1_prospective_mixed12/benchmark.py prepare \
            | tee xorlin_cdcl1_prospective_prepare.log
          grep -q '^XORLIN_CDCL1_PROSPECTIVE_PREPARED ' \
            xorlin_cdcl1_prospective_prepare.log
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,sys,tarfile
          sys.path.insert(0,"research/unified_evidence")
          import benchmark as frozen
          required=set(frozen.REQUIRED_BIN)
          required.update({
            "build/drnas-xorlin-cdcl1",
            "unified_evidence_results/protocol.json",
            "unified_realblind100_inputs/manifest.json",
            "research/graph_unseen25/inputs/manifest.json",
            "research/graph_family_disjoint25/inputs/manifest.json",
            "research/xor3_prospective_gbd10/inputs/manifest.json",
            "research/xor234_prospective_tseitin10/inputs/manifest.json",
            "research/xorlin1_prospective_mixed12/inputs/manifest.json",
            "research/xorlin_cdcl1_prospective_mixed12/inputs",
            "results/xorlin_cdcl1_prospective_mixed12/protocol.json"})
          dest=Path("xorlin-cdcl1-prospective-mixed12-frozen.tgz")
          with tarfile.open(dest,"w:gz") as tar:
              for name in sorted(required):
                  assert Path(name).exists(),("REQUIRED_FROZEN_SOURCE_OR_EXEC_MISSING",name)
                  tar.add(name,arcname=name,recursive=True)
          with tarfile.open(dest,"r:gz") as tar:
              present=set(tar.getnames())
          assert not (required-present),("INCOMPLETE_ARCHIVE",sorted(required-present))
          originals=list(Path("research/xorlin_cdcl1_prospective_mixed12/inputs").glob("[0-9][0-9]-*.cnf"))
          assert len(originals)==12
          print("XORLIN_CDCL1_PROSPECTIVE_ARCHIVE_SHA",{
             "new_originals":12,"old_sources":119,"required_paths":len(required),
             "sha256":hashlib.sha256(dest.read_bytes()).hexdigest()},flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xorlin-cdcl1-prospective-mixed12-originals-and-frozen-binaries
          retention-days: 60
          if-no-files-found: error
          path: xorlin-cdcl1-prospective-mixed12-frozen.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xorlin-cdcl1-prospective-mixed12-source-only-safety-audit
          retention-days: 60
          path: |
            xorlin_cdcl1_prospective_safety.log
            xorlin_cdcl1_prospective_freeze.log
            xorlin_cdcl1_prospective_prepare.log
            research/xorlin_cdcl1_prospective_mixed12/inputs/manifest.json
            results/xorlin_cdcl1_prospective_mixed12/protocol.json
  paired:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0,1,2,3]
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: xorlin-cdcl1-prospective-mixed12-originals-and-frozen-binaries
      - name: Restore SHA-identical original CNFs, original single-process solver, frozen refs and external checkers
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-dev libcryptominisat5-5.11t64 libboost-program-options1.83.0
          tar -xzf xorlin-cdcl1-prospective-mixed12-frozen.tgz
          chmod +x build/drnas-xorlin-cdcl1 build/drat-trim build/frat-rs \
            build/kissat build/cadical build/cms veripb-tool/bin/veripb
      - name: New original source-paired 8s E2E strict 5-arm trials, 1 CPU per solver, no portfolio
        run: |
          set -euo pipefail
          python3 -u research/xorlin_cdcl1_prospective_mixed12/benchmark.py shard \
            --index ${{ matrix.shard }} | tee xorlin_cdcl1_prospective_shard.log
          grep -q '^XORLIN_CDCL1_PROSPECTIVE_SHARD ' \
            xorlin_cdcl1_prospective_shard.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xorlin-cdcl1-prospective-mixed12-shard-${{ matrix.shard }}
          retention-days: 60
          if-no-files-found: warn
          path: |
            results/xorlin_cdcl1_prospective_mixed12/shard-${{ matrix.shard }}/trials.jsonl
            results/xorlin_cdcl1_prospective_mixed12/accepted_external_proofs/
            xorlin_cdcl1_prospective_shard.log
  aggregate:
    needs: [freeze,paired]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: xorlin-cdcl1-prospective-mixed12-originals-and-frozen-binaries
      - uses: actions/download-artifact@v4
        with:
          pattern: xorlin-cdcl1-prospective-mixed12-shard-*
          path: collected
      - name: Restore original source/protocol and copy all four complete frozen trial shards
        run: |
          set -euo pipefail
          tar -xzf xorlin-cdcl1-prospective-mixed12-frozen.tgz
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          for i in range(4):
              folder=Path("collected")/f"xorlin-cdcl1-prospective-mixed12-shard-{i}"
              trials=list(folder.glob("**/trials.jsonl"))
              assert len(trials)==1,("MISSING_OR_DUPLICATED_SHARD",i,trials)
              dest=Path("results/xorlin_cdcl1_prospective_mixed12")/f"shard-{i}"
              dest.mkdir(parents=True,exist_ok=False)
              shutil.copy2(trials[0],dest/"trials.jsonl")
          PY
      - name: Independently audit exact 120 original strict SAT/model VeriPB/DRAT/FRAT, source SHA and PAR2
        run: |
          set -euo pipefail
          python3 -u research/xorlin_cdcl1_prospective_mixed12/benchmark.py aggregate \
            | tee xorlin_cdcl1_prospective_final.log
          grep -q '^XORLIN_CDCL1_PROSPECTIVE_FINAL ' \
            xorlin_cdcl1_prospective_final.log
          cat xorlin_cdcl1_prospective_final.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xorlin-cdcl1-prospective-mixed12-final-strict-E2E-PAR2
          retention-days: 60
          if-no-files-found: warn
          path: |
            results/xorlin_cdcl1_prospective_mixed12/final.json
            results/xorlin_cdcl1_prospective_mixed12/shard-*/trials.jsonl
            xorlin_cdcl1_prospective_final.log
