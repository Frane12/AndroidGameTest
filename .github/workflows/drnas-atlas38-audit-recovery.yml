name: DRNAS ATLAS38 audit-only recovery
run-name: ATLAS38 audit immutable run 43030019163 without rerunning SAT
on:
  push:
    branches: [experiment/drnas-atlas38-single-reduction-causal-20261111]
    paths:
      - .github/workflows/drnas-atlas38-audit-recovery.yml
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 43030019163
          github-token: ${{ github.token }}
          pattern: ATLAS38-[01]
          path: audits
      - name: Inspect artifact layout, audit matched replay and source SHA
        run: |
          set -euo pipefail
          find audits -maxdepth 8 -type f -print
          python3 -u research/drnas_atlas38_audit.py | tee audit.log
          grep '^ATLAS38_AUDIT ' audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS38-AUDIT-RECOVERY
          retention-days: 60
          path: audit.log
