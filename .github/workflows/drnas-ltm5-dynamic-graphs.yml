name: DRNAS LTM5 reversible graph transformations
run-name: LTM5 384 CNF structural movement and reversible proof audit
on:
  push:
    branches: [experiment/drnas-ltm5-dynamic-graphs-20261111]
    paths:
      - "mi_ltm5/**"
      - ".github/workflows/drnas-ltm5-dynamic-graphs.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ltm5-motion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  graph-transform:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test source proofs, reversible transformations, rename invariance
        run: |
          set -euo pipefail
          python3 -m unittest discover -s mi_ltm4 -p 'test_*.py' -v
          python3 -m unittest discover -s mi_ltm5 -p 'test_*.py' -v
      - name: 384 original CNF offline dynamic graph audit
        run: |
          set -euo pipefail
          taskset -c "$(awk '/Cpus_allowed_list:/ {split($2,a,/[,-]/); print a[1]}' /proc/self/status)" python3 -u mi_ltm5/audit.py | tee MI_LTM5_MOTION.log
          grep '^MI_LTM5_FINAL ' MI_LTM5_MOTION.log >> "$GITHUB_STEP_SUMMARY"
      - name: Publish graph-movement event audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LTM5-384-CNF-DYNAMIC-GRAPH-TRANSITIONS
          retention-days: 90
          path: |
            MI_LTM5_MOTION.json
            MI_LTM5_MOTION.log
