name: DRNAS TA7H — hostlocked 12 new SAT2026 originals 144 paired short
on:
  push:
    branches: [experiment/drnas-ta7-hostlocked-short-20261107]
    paths:
      - '.github/workflows/drnas-ta7h-hostlocked-short.yml'
      - 'research/drnas_ta7_short_benchmark.py'
      - 'research/drnas_ta7_hostlocked_router.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-ta7h-hostlocked-short-20261107
  cancel-in-progress: false
jobs:
  prepare:
    name: Restore exclusions, freeze 12 new original CNFs, pin code and solvers
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install frozen reference solver environment and fetch both exclusion sets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y cryptominisat
          cryptominisat5 --version | grep -q 'CryptoMiniSat version 5.11.15'
          gh run download 42409355073 --repo Frane12/AndroidGameTest -n ta6-frozen-official2026-24original-8arms -D .
          test -s ta6-frozen-original24-8arms.tar.gz
          tar xzf ta6-frozen-original24-8arms.tar.gz
          test -s ta6/manifest.json
          test -s r200/manifest.json
          mkdir -p ta7exclusions
          gh run download 42411409945 --repo Frane12/AndroidGameTest -n ta7-frozen-official2026-24original-8arms -D ta7exclusions
          test -s ta7exclusions/ta7-frozen-original24-8arms.tar.gz
          tar -xOf ta7exclusions/ta7-frozen-original24-8arms.tar.gz ta7/manifest.json > ta7exclusions/ta7-manifest.json
          python3 - <<'PY'
          import json, pathlib
          files=['r200/manifest.json','ta6/manifest.json','ta7exclusions/ta7-manifest.json']
          sha_sets=[{c['sha256'] for c in json.loads(pathlib.Path(p).read_text())['cases']} for p in files]
          assert all(len(x)==24 for x in sha_sets)
          assert all(not sha_sets[i].intersection(sha_sets[j]) for i in range(3) for j in range(i+1,3))
          print('TA7H_EXTERNAL_EXCLUSION_SETS_PINNED', [len(x) for x in sha_sets],flush=True)
          PY
          chmod +x r190_cms_mixed/r28 built/bin/kissat_4_0_4 r192/cms_single.sh r192/cms_gauss_forced.sh
      - name: Validate new fixed router and freeze 12 previously unseen original CNFs
        run: |
          set -euo pipefail
          mkdir -p ta7
          python3 -m py_compile research/drnas_ta7_hostlocked_router.py research/drnas_ta7_short_benchmark.py
          python3 -u research/drnas_ta7_hostlocked_router.py | tee ta7/hostlock-selftest.log
          grep -q '^TA7_HOSTLOCK_SELFTEST_PASS ' ta7/hostlock-selftest.log
          python3 -u research/drnas_ta7_short_benchmark.py fetch | tee ta7/fetch.log
          grep -q '^TA7_HOLDOUT_FROZEN ' ta7/fetch.log
      - name: Freeze all relevant code, binaries and original source identities
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          paths=[
            'research/drnas_ta7_hostlocked_router.py',
            'research/drnas_ta7_short_benchmark.py',
            'research/drnas_ta3_adaptive_selector.py',
            'research/drnas_ta2_structural_profile.py',
            'research/r199_unseen_mixed40_crossbackend.py',
            'research/r164_pure_exact_gf2.py',
            'research/r165_component_benchmark.py',
            'research/r193_certified_gauss_cms.py',
            'research/r192_gauss_first_cms_hybrid.py',
            'research/r190_cms_mixed_benchmark.py',
            'research/r189_short_inference.py',
            'research/r188_feedback_benchmark.py',
            'research/r182_mixed_engine.py',
            'research/r183_external_mixed.py',
            'r190_cms_mixed/r28',
            'built/bin/kissat_4_0_4',
            'r192/cms_single.sh',
            'r192/cms_gauss_forced.sh',
            'r192/pins.json',
            'r189/frozen/manifest.json',
            'r199/candidates.json',
            'ta3/candidates.json',
            'ta3_2026/manifest.json',
            'ta3_2026/excluded_hashes.json',
            'ta3_2026/preregistration.json',
            'r200/manifest.json',
            'ta6/manifest.json',
            'ta7exclusions/ta7-manifest.json',
            'ta7/manifest.json',
          ]
          pins={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}
          pathlib.Path('ta7/pins.json').write_text(json.dumps(pins,sort_keys=True,indent=2)+'\n')
          manifest=json.loads(pathlib.Path('ta7/manifest.json').read_text())['cases']
          assert len(manifest)==12 and len({c['sha256'] for c in manifest})==12
          for c in manifest:
            p=pathlib.Path('ta7/sources')/(c['id']+'.cnf')
            assert hashlib.sha256(p.read_bytes()).hexdigest()==c['sha256']
          print('TA7H_FROZEN_SOURCE_BINARY_PINS_PASS',len(pins),flush=True)
          PY
          python3 -u research/drnas_ta7_short_benchmark.py smoke | tee ta7/smoke.log
          grep -q '^TA7_SELFTEST_PASS 6' ta7/smoke.log
          tar czf ta7h-original12-frozen.tar.gz \
            ta3_2026 r189/frozen/manifest.json r199/candidates.json ta3/candidates.json \
            r200/manifest.json ta6/manifest.json ta7exclusions/ta7-manifest.json \
            r190_cms_mixed/r28 built/bin/kissat_4_0_4 \
            r192/pins.json r192/cms_single.sh r192/cms_gauss_forced.sh \
            ta7/manifest.json ta7/pins.json ta7/sources
      - uses: actions/upload-artifact@v4
        with:
          name: ta7h-original12-frozen
          retention-days: 90
          path: ta7h-original12-frozen.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ta7h-prepare-diagnostic
          retention-days: 14
          path: |
            ta7/fetch.log
            ta7/hostlock-selftest.log
            ta7/smoke.log
            ta7/manifest.json
  paired:
    needs: prepare
    name: TA7H 12s source-paired six-arm shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ta7h-original12-frozen
      - name: Restore exact inputs and verify source/binary pins
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y cryptominisat
          cryptominisat5 --version | grep -q 'CryptoMiniSat version 5.11.15'
          tar xzf ta7h-original12-frozen.tar.gz
          chmod +x r190_cms_mixed/r28 built/bin/kissat_4_0_4 r192/cms_single.sh r192/cms_gauss_forced.sh
          python3 - <<'PY'
          import hashlib,json,pathlib
          for p,h in json.loads(pathlib.Path('ta7/pins.json').read_text()).items():
            assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h,p
          print('TA7H_ALL_PINS_VERIFIED',flush=True)
          PY
      - name: Run randomized hostlocked vs unchanged TA3 and two clean baselines
        run: |
          set -euo pipefail
          python3 -u research/drnas_ta7_short_benchmark.py shard --shard ${{ matrix.shard }} | tee ta7/shard-${{ matrix.shard }}.log
          grep -q '^TA7_SHARD_PASS ' ta7/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ta7h-shard-${{ matrix.shard }}
          retention-days: 90
          path: |
            ta7/shard-${{ matrix.shard }}.json
            ta7/shard-${{ matrix.shard }}.log
  audit:
    needs: paired
    name: TA7H fail-closed 144-paired source-cluster audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ta7h-original12-frozen
      - name: Aggregate three complete original-source SHA-paired shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar xzf ta7h-original12-frozen.tar.gz
          gh run download "${{ github.run_id }}" --repo Frane12/AndroidGameTest -p 'ta7h-shard-*' -D ta7/raw-shards
          test "$(find ta7/raw-shards -name 'shard-*.json' -type f | wc -l)" -eq 3
          find ta7/raw-shards -name 'shard-*.json' -exec cp '{}' ta7/ \;
          python3 -u research/drnas_ta7_short_benchmark.py audit | tee ta7/audit.log
          grep -q '^TA7_FINAL ' ta7/audit.log
          cat ta7/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-TA7H-12S-144-PAIRED-FINAL
          retention-days: 90
          path: |
            ta7/report.json
            ta7/report.md
            ta7/all-trials.json
            ta7/manifest.json
            ta7/pins.json
            ta7/audit.log
            ta7/raw-shards/
