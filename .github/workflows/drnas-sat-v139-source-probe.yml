name: DRNAS V13.9 - Probe Pinned 2024 Official Sources
on:
  push:
    branches: [experiment/drnas-v139-external-blind-structure-20261101]
    paths:
      - '.github/workflows/drnas-sat-v139-source-probe.yml'
      - 'research/drnas-sat-v7-8/v139_2024_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect 2024 official metadata, detailed status zip and CNF URL
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/v139_2024_probe.py
          python3 -u research/drnas-sat-v7-8/v139_2024_probe.py | tee 2024-source-diagnostics.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V139-pinned-2024-sources-diagnostic
          path: 2024-source-diagnostics.txt
          if-no-files-found: warn
