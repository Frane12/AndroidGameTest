name: DRNAS R133 GF2 CDCL communication correctness
on:
  push:
    branches:
      - experiment/drnas-r133-gf2-cdcl-bridge-20261105
  workflow_dispatch:
jobs:
  bridge-correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact explanation bridge
        run: g++ -std=c++17 -O2 -Wall -Wextra -Werror research/r133_gf2_cdcl_bridge.cpp -o /tmp/r133_bridge
      - name: Validate unit conflict backtrack and exhaustive CNF explanations
        run: /tmp/r133_bridge | tee r133-bridge.log
      - uses: actions/upload-artifact@v4
        with:
          name: r133-bridge-correctness
          path: r133-bridge.log
