name: DRNAS T0 INTERACTION2 second-order first branch diagnostic
on:
  push:
    branches:
      - experiment/drnas-t0-interaction2-20261114
    paths:
      - .github/workflows/drnas-t0-interaction2.yml
      - research/drnas_t0_interaction2.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: drnas-t0-interaction2-original-satlib
  cancel-in-progress: false

jobs:
  native_matched_t0:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore frozen original-CNF independent proof checker
        uses: actions/download-artifact@v4
        with:
          run-id: 43601959681
          name: deltax-signal1-frozen-sources-and-binary
          github-token: ${{ github.token }}
          path: frozen/signal
      - name: Compile same pinned X5, validate original-CNF DRAT checker
        run: |
          set -euo pipefail
          echo '9768340a8bed3bac3e43f0fb29780c4d5165c50283f90eae141733a7b76106fc  src/drnas_x5.cpp' | sha256sum -c -
          python3 -m py_compile research/drnas_t0_frontier1.py research/drnas_t0_interaction2.py
          mkdir -p build
          tar -xzf frozen/signal/deltax_signal_frozen.tgz
          sha256sum -c build/DELTAX_SIGNAL_FROZEN.sha256
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Werror \
            src/drnas_x5.cpp -o build/drnas-t0-frontier1
          test -x build/drat-trim
          sha256sum src/drnas_x5.cpp build/drnas-t0-frontier1 build/drat-trim \
            | tee t0_interaction2_binary_sha256.txt
      - name: Run fixed T0 discrete second-order metric on source-disjoint CNFs
        run: |
          set -euo pipefail
          CPU="$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')"
          echo "T0_INTERACTION2_SINGLE_CPU=$CPU"
          PYTHONHASHSEED=0 taskset -c "$CPU" \
            python3 -u research/drnas_t0_interaction2.py | tee t0_interaction2.log
          grep -q '^T0_INTERACTION2_FINAL ' t0_interaction2.log
          python3 - <<'PY'
          import json
          r=json.load(open("t0_interaction2/report.json"))
          assert r["status"]=="COMPLETE" and r["sources"]==48
          assert r["verified_both"]==r["same_t0_state_pairs"]==48
          assert r["one_logical_cpu"] and r["no_training"]
          assert not r["main_modified"] and not r["solver_promoted"]
          print("T0_INTERACTION2_COMPLETED",r["correct"],r["wrong"],
            r["predicted_non_ties"],r["predicted_abstain"])
          PY
          echo "Fixed initial-order mixed BCP finite differences; SATLIB retrospective; no main modification or promotion" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drnas-t0-interaction2-data
          retention-days: 45
          if-no-files-found: warn
          path: |
            t0_interaction2/
            t0_interaction2.log
            t0_interaction2_binary_sha256.txt
