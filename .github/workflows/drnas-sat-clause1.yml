name: DRNAS SAT-CLAUSE1 guarded SAT decision pilot
on:
  push:
    branches: [experiment/drnas-sat-clause1-20261115]
    paths:
      - src/drnas_x59.cpp
      - research/sat_clause1/**
      - .github/workflows/drnas-sat-clause1.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drnas-sat-clause1-20261115
  cancel-in-progress: false
jobs:
  verified_sat_pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile frozen-core variant
        run: |
          set -euo pipefail
          mkdir -p build
          g++ -O3 -std=c++20 -DNDEBUG -Wall -Wextra src/drnas_x59.cpp -o build/drnas-sat-clause1
          sha256sum src/drnas_x59.cpp build/drnas-sat-clause1
          python3 -m py_compile research/sat_clause1/benchmark.py
      - name: One-core paired SAT model verification and PAR2
        run: |
          set -euo pipefail
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 \
            python3 -u research/sat_clause1/benchmark.py
      - name: Retain exact provenance, results and telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sat-clause1-pilot
          path: sat_clause1_results/
          if-no-files-found: warn
          retention-days: 30
