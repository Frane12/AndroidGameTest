name: DRNAS C10a — 31 source-SHA structural characterization C8D C9c and portfolio audit
on:
  push:
    branches: [experiment/drnas-c10-structural-portfolio-20261108]
    paths: ['.github/workflows/drnas-c10-structural-analysis.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  retrospective-analysis:
    name: Source-locked 31 originals, clause lengths, density, binary Horn XOR3 proxy vs Kissat CaDiCaL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore original C8D 19-SHA and C9c 12-SHA source artifacts and audits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p c10_old_c8d c10_old_c9c c10_out
          gh run download 42526134599 -R Frane12/AndroidGameTest -n c8d-SHA6-C7-SHA19-source-BVE-certified-CMS-Kissat -D .
          gh run download 42529378612 -R Frane12/AndroidGameTest -n c9c-new-official-2026-10plus-source-only-frozen-before-any-run -D c10_c9c_source_archive
          cp -a c10_c9c_source_archive/c9c_official .
          gh run download 42526134599 -R Frane12/AndroidGameTest -n DRNAS-C8D-380-PAR2-ORIGINAL-SHA19-BVE-EARLY-CDCL -D c10_old_c8d
          gh run download 42529378612 -R Frane12/AndroidGameTest -n DRNAS-C9C-OFFICIAL26-10PLUS-SHA-60S-E2E-PAR2-SELECTOR-AUDIT -D c10_old_c9c
          (cd c8d_s1_source/s1_router && sha256sum -c sources.sha256)
          (cd c9c_official && sha256sum -c source.sha256)
          test -s c10_old_c8d/report.json
          test -s c10_old_c9c/c9c_out/report.json
      - name: Scan original clause structure and report separate 15s/60s cohort outcomes
        run: |
          set -euo pipefail
          python3 -m py_compile research/c10_structural_portfolio_analysis.py
          python3 -u research/c10_structural_portfolio_analysis.py | tee c10_out/audit.log
          grep -q '^C10A_FINAL' c10_out/audit.log
          grep '^C10A_FINAL' c10_out/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-C10A-31-SOURCE-SHA-STRUCTURAL-RETROSPECTIVE-PORTFOLIO
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6
          path: |
            c10_out/report.json
            c10_out/audit.log
