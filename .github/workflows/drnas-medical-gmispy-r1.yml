name: DRNAS Medical gMISpy R1 upstream + SAT audit

on:
  push:
    branches:
      - experiment/drnas-medical-gmispy-r1-20261106
    paths:
      - 'research/drnas_medical/gmispy_r1.py'
      - 'research/drnas_medical/GMISPY_R1.md'
      - '.github/workflows/drnas-medical-gmispy-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drnas-sat-regulatory-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CaDiCaL/Kissat wrappers
        run: python3 -m pip install --disable-pip-version-check python-sat==1.9.dev18
      - name: DRNAS fixed-point intervention oracle vs identical CNFs
        run: |
          python3 research/drnas_medical/gmispy_r1.py sat-benchmark \
            --out medical-results/gmispy-r1 --cap 5 --r108 6
      - name: Preserve CNFs, independent oracle, paired timings and R108 certificates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-gmispy-r1-sat-audit
          path: medical-results/gmispy-r1/
          retention-days: 30
          if-no-files-found: warn

  official-gmispy-regulatory-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original gMISpy source at pinned commit
        run: |
          python3 -m pip install --disable-pip-version-check \
            'git+https://github.com/PlanesLab/cyclic-gMISpy.git@76ce96de9d4e18c8200876f5a73d3b2d60e4a012'
      - name: Run real upstream gMISpy Boolean regulatory functions
        run: |
          python3 research/drnas_medical/gmispy_r1.py upstream-smoke \
            --out medical-results/gmispy-upstream
      - name: Preserve gMISpy original-output smoke data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-gmispy-r1-upstream
          path: medical-results/gmispy-upstream/
          retention-days: 30
          if-no-files-found: warn
