name: DRNAS SAT v8.5 — aggregate saved 40-case benchmark
on:
  push:
    branches:
      - experiment/drnas-sat-v85-aggregate-fix-20261031
    paths:
      - '.github/workflows/drnas-sat-v85-aggregate-only.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  combine-existing-shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve original five saved shards — do not rerun solver
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          run-id: 41224588277
          github-token: ${{ github.token }}
          repository: Frane12/AndroidGameTest
          path: combined-v85
      - name: Validate, combine, and summarize all 480 original measurements
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/summarize_v85.py
          python3 -u research/drnas-sat-v7-8/summarize_v85.py combined-v85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-v85-40-CNF-complete-fixed-aggregate
          path: combined-v85/
          if-no-files-found: warn
