name: DRNAS ATLAS BLOCK5 persistent learning
run-name: ATLAS-BLOCK5 train 42 frozen SATLIB sources Bayesian confidence then prospective holdout 12s oneCPU
on:
  push:
    branches: [experiment/drnas-atlas-block5-learn-20261111, experiment/drnas-atlas-selective-gf2-20261111]
    paths:
      - research/drnas_atlas_block5.py
      - research/drnas_atlas_selective_gf2.py
      - .github/workflows/drnas-atlas-block5.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-block5-memory
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build native solver and selftest
        run: |
          set -euo pipefail
          mkdir -p mre_atlasmap2/bin mre_map2_real47
          python3 -m py_compile research/drnas_atlas_block5.py research/drnas_atlas_selective_gf2.py
          python3 research/drnas_atlas_selective_gf2.py
          python3 research/drnas_atlas1_generate.py --out mre_atlasmap2/atlas1_table.hpp
          g++ -std=c++17 -O2 -I mre_atlasmap2 research/drnas_atlasmap2.cpp -o mre_atlasmap2/bin/drnas_atlasmap2
          mre_atlasmap2/bin/drnas_atlasmap2 --atlasmap2-selftest
      - name: Train, freeze confidence table, evaluate unseen holdout
        run: |
          set -euo pipefail
          taskset -c "$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')" python3 -u research/drnas_atlas_block5.py | tee mre_map2_real47/block5.log
          grep '^ATLAS_BLOCK5_FINAL ' mre_map2_real47/block5.log >> "$GITHUB_STEP_SUMMARY"
      - name: Persist learning table to experimental branch
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/atlas_block5_memory.json
          if ! git diff --cached --quiet; then
            git commit -m "data(atlas-block5): persist trained confidence table [skip ci]"
            git push origin HEAD:experiment/drnas-atlas-selective-gf2-20261111
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-BLOCK5-LEARN-AUDIT
          retention-days: 60
          path: |
            mre_map2_real47/block5_audit.json
            mre_map2_real47/block5_frozen_before_holdout.json
            mre_map2_real47/block5.log
            research/atlas_block5_memory.json
