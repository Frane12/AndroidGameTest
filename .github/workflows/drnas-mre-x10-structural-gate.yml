name: DRNAS X10 — 32 frozen SHA structural gate 384 E2E CMS Kissat CaDiCaL
on:
  push:
    branches: [experiment/drnas-mre-x10-structural-gate-20261109]
    paths: ['.github/workflows/drnas-mre-x10-structural-gate.yml', 'research/mre_x10_structural_gate.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-x10-structural-20261109-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Restore SHA frozen X9 30 and X6 8 sources plus audited X9 training
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore 30 X9 originals 8 X6 originals X9 audited PAR2 and frozen CMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42559879920 -R Frane12/AndroidGameTest -n x9-replay30-frozen-sha-pinned-CMS-Kissat-CaDiCaL -D priorx9
          gh run download 42559879920 -R Frane12/AndroidGameTest -n DRNAS-X9-REPLAY30-300-E2E-15S-PAR2-AUDIT -D priorx9report
          gh run download 42557116984 -R Frane12/AndroidGameTest -n x6fresh-eight-new-source-sha-frozen-CMS-Kissat -D priorx6
          mkdir -p mre_x10 mre_x4/bin built/bin mre5/lib
          cp priorx9/mre_x4/bin/native mre_x4/bin/native
          cp priorx9/built/bin/kissat_4_0_4 built/bin/kissat_4_0_4
          cp priorx9/mre5/lib/libcryptominisat5.so.5.11 mre5/lib/libcryptominisat5.so.5.11
          chmod +x mre_x4/bin/native built/bin/kissat_4_0_4
          test -s priorx9report/mre_x9/report.json
          test -s priorx9/mre_x9/manifest.json
          test -s priorx6/mre_x6fresh/manifest.json
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          ldd mre_x4/bin/native | grep 'libcryptominisat5.so.5.11'
      - name: Verify bounded gate, Python syntax, reference binaries, max signed Kissat seed
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
          python3 -m py_compile research/mre_x10_structural_gate.py
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          python3 -u research/mre_x10_structural_gate.py selftest
          printf 'p cnf 1 1\n1 0\n' > /tmp/x10-smoke.cnf
          rc=0
          built/bin/kissat_4_0_4 --seed=2147483647 /tmp/x10-smoke.cnf > /tmp/x10-kissat-smoke.log || rc=$?
          test "$rc" -eq 10
          grep -q '^s SATISFIABLE' /tmp/x10-kissat-smoke.log
          rc=0
          /usr/bin/cadical /tmp/x10-smoke.cnf > /tmp/x10-cadical-smoke.log || rc=$?
          test "$rc" -eq 10
          grep -q '^s SATISFIABLE' /tmp/x10-cadical-smoke.log
          sha256sum mre_x4/bin/native built/bin/kissat_4_0_4 /usr/bin/cadical mre5/lib/libcryptominisat5.so.5.11 > mre_x10/binary.sha256
          echo X10_MAX_SEED_AND_BINARIES_PASS
      - name: Freeze source-only model and 32 exact original CNF files before new solver timings
        run: |
          set -euo pipefail
          python3 -u research/mre_x10_structural_gate.py freeze | tee mre_x10/freeze.log
          grep -q '^X10_FROZEN 32 ' mre_x10/freeze.log
          python3 -u research/mre_x10_structural_gate.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x10-frozen32-cnf-training-policy-binaries
          retention-days: 21
          if-no-files-found: warn
          path: |
            mre_x10/*.cnf
            mre_x10/manifest.json
            mre_x10/train_model.json
            mre_x10/freeze.log
            mre_x10/binary.sha256
            mre_x4/bin/native
            built/bin/kissat_4_0_4
            mre5/lib/libcryptominisat5.so.5.11
  paired:
    name: X10 48 real E2E 15s source-seed paired 6-arm shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: x10-frozen32-cnf-training-policy-binaries
          path: .
      - name: Validate matching binary and original CNF SHA including reference versions
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
          chmod +x mre_x4/bin/native built/bin/kissat_4_0_4
          sha256sum -c mre_x10/binary.sha256
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          python3 -u research/mre_x10_structural_gate.py verify
      - name: Measure 4 sources 2 seeds 6 arms including gate overhead and SAT witness replay
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          python3 -u research/mre_x10_structural_gate.py shard --shard ${{ matrix.shard }} | tee mre_x10/shard-${{ matrix.shard }}.log
          grep -q '^X10_SHARD_PASS ${{ matrix.shard }} 48$' mre_x10/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x10-results-${{ matrix.shard }}
          retention-days: 21
          path: |
            mre_x10/shard-${{ matrix.shard }}.json
            mre_x10/shard-${{ matrix.shard }}.log
  audit:
    name: X10 strict 384 E2E PAR2 + 3 reference speedups and percentages + 2 reserved holdouts
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: x10-frozen32-cnf-training-policy-binaries
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: x10-results-*
          merge-multiple: true
          path: mre_x10
      - name: Fail-closed audit source SHA seeds native policy accuracy and PAR2
        run: |
          set -euo pipefail
          python3 -u research/mre_x10_structural_gate.py audit | tee mre_x10/audit.log
          grep -q '^X10_FINAL' mre_x10/audit.log
          grep '^X10_FINAL' mre_x10/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-X10-STRUCTURAL-GATE-32SHA-384E2E-FINAL-PAR2
          retention-days: 30
          path: |
            mre_x10/manifest.json
            mre_x10/train_model.json
            mre_x10/report.json
            mre_x10/audit.log
            mre_x10/shard-*.json
