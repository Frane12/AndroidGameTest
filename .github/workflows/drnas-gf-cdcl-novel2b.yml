name: DRNAS GF-CDCL NOVEL2B strict source-only width-reducing GF2 CDCL propagation
run-name: GF-CDCL NOVEL2B 2 reductive-source SHA x 4 arms x 2 reps 6s 16 oneCPU E2E
on:
  push:
    branches: [experiment/drnas-gf-cdcl-novel2b-20261110]
    paths:
      - .github/workflows/drnas-gf-cdcl-novel2b.yml
      - research/drnas_gf_cdcl_novel2b.cpp
      - research/drnas_gf_cdcl_novel2_selftest.inc
      - research/drnas_gf_cdcl_novel2b_reductive.inc
      - research/drnas_gf_cdcl_novel2b_smoke.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-gf-cdcl-novel2b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    name: Compile and test strict cancellation-only GF2 vs clean and shadow
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Restore frozen 40 original SHA and verified XOR native source rows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42814965607 -R Frane12/AndroidGameTest -n xorabc3-frozen40-CaDiCaL210-live-Kissat-CMS -D .
          test -s mre_xorabc3/manifest.json
          test -s mre_xorabc3/cadical-source-commit.txt
          test -s mre_xorabc3/bin/xorabc3_trail
          test -s mre_xorabc3/bin/xorabc3_rows
          test -s mre_xorabc2/manifest.json
          chmod +x mre_xorabc3/bin/xorabc3_trail mre_xorabc3/bin/xorabc3_rows
          chmod +x mre_xorabc2/bin/xorabc2_native
          chmod +x mre_equiv12/bin/cryptominisat5 built/bin/kissat_4_0_4 mre_x4/bin/native
          python3 -m py_compile research/drnas_gf_cdcl_novel2b_smoke.py
      - name: Compile GF-CDCL derived cross-row native trail against pinned CaDiCaL
        run: |
          set -euo pipefail
          mkdir -p mre_gf_cdcl_novel2b/bin
          git clone -q https://github.com/arminbiere/cadical.git /tmp/gfcdcl-cadical
          cd /tmp/gfcdcl-cadical
          git checkout -q "$(cat "$GITHUB_WORKSPACE/mre_xorabc3/cadical-source-commit.txt")"
          ./configure
          make -j2
          g++ -std=c++17 -O2 -Wall -Wextra -I./src "$GITHUB_WORKSPACE/research/drnas_gf_cdcl_novel2b.cpp" ./build/libcadical.a -o "$GITHUB_WORKSPACE/mre_gf_cdcl_novel2b/bin/gf_cdcl_novel2b"
          cd "$GITHUB_WORKSPACE"
          mre_gf_cdcl_novel2b/bin/gf_cdcl_novel2b selftest | tee mre_gf_cdcl_novel2b/native-selftest.log
          grep -q '^GFCDCL_NOVEL2B_SELFTEST_PASS ' mre_gf_cdcl_novel2b/native-selftest.log
          grep -q '^R148_DIRECT_SELFTEST_PASS ' mre_gf_cdcl_novel2b/native-selftest.log
      - name: Two strictly reductive source-selected SHA E2E one CPU novel2b vs direct
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre_equiv12/lib:$PWD/mre5/lib"
          python3 -u research/drnas_gf_cdcl_novel2b_smoke.py | tee mre_gf_cdcl_novel2b/smoke.log
          grep -q '^GFCDCL_NOVEL2B_SMOKE_PASS 16$' mre_gf_cdcl_novel2b/smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-GF-CDCL-NOVEL2B-16-FROZEN-ONECPU-SMOKE
          retention-days: 21
          if-no-files-found: warn
          path: |
            mre_gf_cdcl_novel2b/native-selftest.log
            mre_gf_cdcl_novel2b/smoke.json
            mre_gf_cdcl_novel2b/smoke.log
