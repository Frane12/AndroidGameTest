name: DRNAS MRE6 — autonomous CPU feedback to mathematical principle hypotheses
on:
  push:
    branches: [experiment/drnas-mre6-cpu-feedback-principles-20261108]
    paths:
      - '.github/workflows/drnas-mre6-principle-constructor.yml'
      - 'research/mre6_principle_constructor.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  construct:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve already audited MRE6 and MRE6b CPU feedback; no solver reruns
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p mre6 mre6b inputs_mre6 inputs_mre6b
          gh run download 42491590558 --repo Frane12/AndroidGameTest -n DRNAS-MRE6-CPU-PRINCIPLE-FEEDBACK-FINAL -D inputs_mre6
          gh run download 42492372821 --repo Frane12/AndroidGameTest -n DRNAS-MRE6B-FACTORIAL-AUDITED-FINAL -D inputs_mre6b
          src1="$(find inputs_mre6 -type f -name principles.sqlite -print -quit)"
          src2="$(find inputs_mre6b -type f -name principles.sqlite -print -quit)"
          feedback="$(find inputs_mre6 -type f -name frozen_feedback.json -print -quit)"
          test -s "$src1"
          test -s "$src2"
          test -s "$feedback"
          cp "$src1" mre6/principles.sqlite
          cp "$src2" mre6b/principles.sqlite
          cp "$feedback" mre6/frozen_feedback.json
          python3 - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('mre6/principles.sqlite')
          assert c.execute('SELECT COUNT(*) FROM observation').fetchone()[0]==116
          c.close()
          f=sqlite3.connect('mre6b/principles.sqlite')
          assert f.execute('SELECT COUNT(*) FROM quotient_xor_interaction').fetchone()[0]==8
          f.close()
          policy=json.load(open('mre6/frozen_feedback.json'))
          assert policy['online_policy']=='xor'
          print('MRE6_PRINCIPLE_EVIDENCE_SOURCES_VERIFIED')
          PY
      - name: Generate CPU-ranked proof-aware mathematical hypotheses, safe abstention
        run: |
          set -euo pipefail
          python3 -m py_compile research/mre6_principle_constructor.py
          python3 -u research/mre6_principle_constructor.py selftest
          python3 -u research/mre6_principle_constructor.py generate | tee mre6/principle_constructor.log
          python3 - <<'PY'
          import json,sqlite3
          p=json.load(open('mre6/generated_principles.json'))
          assert p['all_hypotheses_sandbox_only'] and p['frozen_online_policy']=='xor'
          assert len(p['hypotheses'])==5
          assert not any(h['deployable_on_unseen_SAT'] for h in p['hypotheses'])
          c=sqlite3.connect('mre6/principles.sqlite')
          assert c.execute('SELECT COUNT(*) FROM generated_principle_hypothesis').fetchone()[0]==5
          assert c.execute('SELECT COUNT(*) FROM quotient_xor_interaction').fetchone()[0]==8
          print('MRE6_PRINCIPLE_CONSTRUCTOR_AUDIT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-MRE6-CPU-GUIDED-PRINCIPLE-HYPOTHESES
          retention-days: 30
          path: |
            mre6/generated_principles.json
            mre6/principles.sqlite
            mre6/principle_constructor.log
