name: DRNAS R32n native leave-one-XOR-unit-out and phase timing
on:
  push:
    branches: [experiment/drnas-r32n-minimal-implication-20261103]
    paths:
      - '.github/workflows/drnas-r32n-omit-units.yml'
      - 'experiments/drnas_v16/patch_r32m_phase_timing.py'
      - 'experiments/drnas_v16/r32n_omission_timing_benchmark.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r32n-omission-cause-v1
  cancel-in-progress: true
jobs:
  freeze_build:
    name: Freeze 65 source CNFs, compile native phase instrumentation, check phase contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python script syntax before running
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/patch_r32m_phase_timing.py experiments/drnas_v16/r32n_omission_timing_benchmark.py
      - uses: actions/download-artifact@v4
        with:
          name: r32m-65-frozen-originals
          run-id: 41649862030
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-r32m
      - name: Freeze five previously studied plus sixty new SHA-distinct CNFs
        run: |
          set -euo pipefail
          (cd prior-r32m && sha256sum -c cnf.sha256)
          python3 -u experiments/drnas_v16/r32n_omission_timing_benchmark.py freeze \
            --prior prior-r32m --dest frozen
          (cd frozen && sha256sum -c cnf.sha256)
          python3 - <<'PY'
          import json
          m=json.load(open("frozen/manifest.json"))
          assert m["total_trials"]==2100 and len(m["cases"])==65
          assert len({c["sha256"] for c in m["cases"]})==65
          assert sum(c["cohort"]=="prior_development" for c in m["cases"])==5
          print("R32N_FROZEN_SHA_PASS")
          PY
      - name: Compile pinned clean Kissat and phase-instrumented native single solver
        run: |
          set -euo pipefail
          git clone -q https://github.com/arminbiere/kissat.git /tmp/r32n-clean
          git -C /tmp/r32n-clean checkout -q --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          test "$(git -C /tmp/r32n-clean rev-parse HEAD)" = 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          cp -r /tmp/r32n-clean /tmp/r32n-native
          python3 -u experiments/drnas_v16/patch_r32b_native_shadow.py --kissat-root /tmp/r32n-native
          python3 -u experiments/drnas_v16/patch_r32n_leave_one_out.py --kissat-root /tmp/r32n-native
          python3 -u experiments/drnas_v16/patch_r32l_early_trace.py --kissat-root /tmp/r32n-native
          python3 -u experiments/drnas_v16/patch_r32m_phase_timing.py --kissat-root /tmp/r32n-native
          (cd /tmp/r32n-clean && ./configure && make -j2 > /tmp/r32n-clean-build.log)
          (cd /tmp/r32n-native && ./configure && make -j2 > /tmp/r32n-native-build.log)
          mkdir -p compiled
          cp /tmp/r32n-clean/build/kissat compiled/clean
          cp /tmp/r32n-native/build/kissat compiled/native
          chmod +x compiled/*
          (cd compiled && sha256sum clean native > binaries.sha256 && sha256sum -c binaries.sha256)
      - name: Preflight five exact phases and certified root-unit variants
        run: |
          set -euo pipefail
          for family in consistent_visible consistent_hidden consistent_mixed root_unsat xor_decoy; do
            for variant in full omit4 omit24 omit48; do
              set +e
              R32B_MODE=r32k R32K_VARIANT="$variant" R32L_TRACE=1 R32M_PHASES=1 \
                compiled/native "frozen/r32n_base_${family}_501.cnf" > "r32n-${family}-${variant}.log"
              code=$?
              set -e
              test "$code" -eq 10 -o "$code" -eq 20
              for phase in lucky_early preprocess lucky_late classify cdcl; do
                grep -q "^c R32M_PHASE phase=$phase " "r32n-${family}-${variant}.log"
              done
              grep -q "^c R32K_ABLATION variant=$variant " "r32n-${family}-${variant}.log"
              grep -q '^c R32B_FINAL status=' "r32n-${family}-${variant}.log"
            done
          done
          for family in root_unsat xor_decoy; do
            if grep -q '^c R32C_INJECTED_LITS ' "r32n-${family}-full.log"; then
              echo R32N_UNSAFE_ABSTENTION >&2
              exit 1
            fi
          done
          for family in consistent_visible consistent_hidden consistent_mixed; do
            for variant in omit4 omit24 omit48; do
              grep -Eq '^c R32C_INJECTED_LITS count=11 lits=' "r32n-${family}-${variant}.log"
            done
          done
          echo R32N_LEAVE_ONE_PREFLIGHT_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: r32n-65-frozen-originals
          path: frozen/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: r32n-pinned-binaries
          path: compiled/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r32n-preflight-logs
          path: r32n-*.log
          if-no-files-found: warn
  paired:
    needs: freeze_build
    name: r32n-shard-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r32n-65-frozen-originals
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: r32n-pinned-binaries
          path: compiled
      - name: Validate exact SHA source and binary checksums
        run: |
          set -euo pipefail
          chmod +x compiled/clean compiled/native
          (cd frozen && sha256sum -c cnf.sha256)
          (cd compiled && sha256sum -c binaries.sha256)
      - name: Record six serial single-Kissat phase-attributed policies
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r32n_omission_timing_benchmark.py measure \
            --inputs frozen --clean compiled/clean --native compiled/native \
            --shard "$SHARD" --outdir results | tee r32n-live.log
          test -s results/rows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r32n-shard-${{ matrix.shard }}
          path: |
            results/
            r32n-live.log
          if-no-files-found: warn
  audit:
    needs: [freeze_build, paired]
    if: always()
    name: Audit 2100 paired native phase readings and original-CNF correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r32n-65-frozen-originals
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: r32n-shard-*
          path: combined
      - name: Confirm solver phase that actually returned each SAT result
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r32n_omission_timing_benchmark.py aggregate \
            --inputs frozen --combined combined \
            --output r32n-results.json --report r32n-results.md
          cat r32n-results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R32N-OMISSION-CAUSE-FINAL-2100
          path: |
            r32n-results.json
            r32n-results.md
            frozen/manifest.json
          if-no-files-found: warn
