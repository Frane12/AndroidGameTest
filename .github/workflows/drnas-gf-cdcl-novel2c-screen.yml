name: DRNAS GF-CDCL NOVEL2C - source-only XOR crossover screen
run-name: NOVEL2C 40 frozen XORABC3 + 6 reference-easy MIXAB4 original SHA source-only screen
on:
  push:
    branches: [experiment/drnas-gf-cdcl-novel2c-easycrossover-20261110]
    paths:
      - .github/workflows/drnas-gf-cdcl-novel2c-screen.yml
      - research/drnas_gf_cdcl_novel2c_screen.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-gf-cdcl-novel2c-screen-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screen:
    name: Certify 46 original SHA source rows; count strict reductive cross-XOR on easy source
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Restore pinned native extractor and source-locked XORABC3 forty originals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42814965607 -R Frane12/AndroidGameTest -n xorabc3-frozen40-CaDiCaL210-live-Kissat-CMS -D .
          test -s mre_xorabc3/manifest.json
          test -s mre_xorabc3/bin/xorabc3_rows
          chmod +x mre_xorabc3/bin/xorabc3_rows mre_xorabc3/bin/xorabc3_trail mre_xorabc2/bin/xorabc2_native
          chmod +x built/bin/kissat_4_0_4 mre_equiv12/bin/cryptominisat5 mre_x4/bin/native
      - name: Restore reference-easy source-locked MIXAB4 original SHA as separate cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p mixab4_staging
          gh run download 42816574288 -R Frane12/AndroidGameTest -n mixab4-reference-easy6-CMS17-Kissat4-LRAT -D mixab4_staging
          test -s mixab4_staging/mre_mixab4/manifest.json
          test -d mixab4_staging/mre_mixab4/cases
          cp -a mixab4_staging/mre_mixab4 mre_mixab4
      - name: Strict source-only original SHA and native verified GF2 pair screening
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre_equiv12/lib:$PWD/mre5/lib"
          python3 -m py_compile research/drnas_gf_cdcl_novel2c_screen.py
          python3 -u research/drnas_gf_cdcl_novel2c_screen.py | tee mre_gf_cdcl_novel2c/screen.log
          grep -q '^NOVEL2C_SCREEN_PASS 46$' mre_gf_cdcl_novel2c/screen.log
          grep '^NOVEL2C_SCREEN_SUMMARY ' mre_gf_cdcl_novel2c/screen.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-GF-CDCL-NOVEL2C-SOURCE46-EASY6-STRUCTURAL-SCREEN
          retention-days: 21
          if-no-files-found: warn
          path: |
            mre_gf_cdcl_novel2c/screen.json
            mre_gf_cdcl_novel2c/screen.log
