name: DRNAS V13.3 - Retrospective Solver-Discrimination Calibration
on:
  push:
    branches: [experiment/drnas-v132-auditfix-20261101]
    paths:
      - 'research/drnas-sat-v7-8/v133_calibrate_existing.py'
      - '.github/workflows/drnas-sat-v133-calibration.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-UnOfficial-SATComp2026-Mini-216-Matched
          run-id: 41248293940
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: calibration-source
      - name: Verify complete prior audit and report discriminating instances
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/v133_calibrate_existing.py
          test -s calibration-source/official_mini_report.json
          python3 research/drnas-sat-v7-8/v133_calibrate_existing.py \
            --source calibration-source/official_mini_report.json \
            --out v133_calibration.json --md v133_calibration.md
          cat v133_calibration.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V133-existing-18-CNF-calibration
          path: |
            v133_calibration.md
            v133_calibration.json
          if-no-files-found: warn
