name: DRNAS R61 Killer recover audit archived official2026 results
on:
  push:
    branches: [experiment/drnas-r61-killer-transfer-20261103]
    paths:
      - '.github/workflows/drnas-r61-killer-audit-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit_archived:
    name: Audit 192 archived R61 Killer runs without rerunning SAT solvers
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r61-killer-source-disjoint-official2026-frozen
          run-id: 41703349456
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: r61-killer-shard-*
          run-id: 41703349456
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: combined
      - name: Fail closed on missing shards, altered source SHA, wrong modes and benchmark binary drift
        run: |
          set -euo pipefail
          (cd fresh && sha256sum -c source.sha256)
          python3 -u experiments/drnas_v16/r61_killer_transfer.py audit \
            --sources fresh --combined combined \
            --json r61-killer-final.json --md r61-killer-final.md
          cat r61-killer-final.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DRNAS-R61-KILLER-REAL2026-192-ARCHIVED-AUDIT-FINAL
          path: |
            r61-killer-final.json
            r61-killer-final.md
            fresh/manifest.json
          if-no-files-found: error
