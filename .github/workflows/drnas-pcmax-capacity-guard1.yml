name: DRNAS PCMAX CAPACITY GUARD1 structural 16gt15 verified benchmark
on:
  push:
    branches: [experiment/drnas-pcmax-capacity-guard1-20261114]
    paths:
      - .github/workflows/drnas-pcmax-capacity-guard1.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-pcmax-capacity-guard1-paired
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 43625251777
          name: domain-bench1-prepared
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          run-id: 43631559465
          name: pcmax20-original-cnfs
          github-token: ${{ github.token }}
          path: pcmax20/
      - name: Source-pin and restore frozen reference binaries
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf domain_bench_ready.tgz
          chmod +x build/drnas-worker-domain build/kissat build/drat-trim
          python3 -m py_compile research/drnas_pcmax_capacity_guard.py research/drnas_pcmax_capacity_bench.py
          python3 research/drnas_pcmax_capacity_guard.py cf7/selection/cases/044_c55ab8fe2c9e10f0.cnf --sha256 c55ab8fe2c9e10f0579f806802bc32d04913f12cd6ce28e6662b8d59d114c174
      - name: Run source-paired 8s PCMAX44 X5 Kissat guard and original PCMAX SAT controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -u research/drnas_pcmax_capacity_bench.py | tee pcmax_capacity_benchmark.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pcmax-capacity-guard1-benchmark
          retention-days: 60
          path: |
            pcmax-capacity-results/report.json
            pcmax_capacity_benchmark.log
