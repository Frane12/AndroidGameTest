name: DRNAS XX2R causal audit recovery — reuse 48 completed E2E results
on:
  push:
    branches: [experiment/drnas-xx2r-causal-probe-20261109]
    paths:
      - '.github/workflows/drnas-xx2r-causal-audit-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-xx2r-causal-audit-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: Recover original XX2R causal artifacts and audit without rerunning SAT
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download frozen originals and all three completed shard results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42573045526 -R Frane12/AndroidGameTest -n xx2r-causal-frozen-originals-and-binaries -D .
          for shard in 0 1 2; do
            gh run download 42573045526 -R Frane12/AndroidGameTest -n "xx2r-causal-result-$shard" -D .
            test -s "xx2r_causal_probe/shard-$shard.json"
          done
          sha256sum -c mre_x11/binary.sha256 | grep -E 'mre_x4/bin/native|built/bin/kissat_4_0_4'
      - name: Finish strict source-SHA and bounded-only audit
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/research"
          python3 -m py_compile research/xx2r_causal_probe.py
          python3 -u research/xx2r_causal_probe.py verify
          python3 -u research/xx2r_causal_probe.py audit | tee xx2r_causal_probe/audit.log
          grep -q '^XX2R_CAUSAL_FINAL ' xx2r_causal_probe/audit.log
          grep '^XX2R_CAUSAL_FINAL ' xx2r_causal_probe/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-XX2R-CAUSAL-RECOVERED-48E2E-24BOUNDED-AUDIT
          retention-days: 30
          if-no-files-found: warn
          path: |
            xx2r_causal_probe/report.json
            xx2r_causal_probe/audit.log
            xx2r_causal_probe/shard-*.json
