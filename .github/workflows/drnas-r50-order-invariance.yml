name: DRNAS R50 independently certified CNF clause-order sampling audit
on:
  push:
    branches: [experiment/drnas-r50-clause-order-invariance-20261103]
    paths:
      - '.github/workflows/drnas-r50-order-invariance.yml'
      - 'experiments/drnas_v16/r50_certified_sampling_audit.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    name: Certify 24 structural samples from 8 unchanged original SATComp26 CNFs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Syntax compile, no solver changes
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/r50_certified_sampling_audit.py
      - uses: actions/download-artifact@v4
        with:
          name: r47-frozen-source
          run-id: 41669951007
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: r49-frozen-preregistered-design
          run-id: 41676249421
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: design
      - name: Validate original immutable CNFs
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c source.sha256)
          test -s design/r49-frozen-design.json
      - name: Certify candidates on first, last and uniform 60000-clause samples
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r50_certified_sampling_audit.py \
            --frozen frozen --design design/r49-frozen-design.json \
            --output r50-audit.json --csv r50-samples.csv \
            --markdown r50-audit.md | tee r50-live.log
          test -s r50-audit.json
          test -s r50-audit.md
          test -s r50-samples.csv
          cat r50-audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DRNAS-R50-CERTIFIED-SAMPLING-SENSITIVITY
          path: |
            r50-audit.json
            r50-audit.md
            r50-samples.csv
            r50-live.log
          if-no-files-found: error
