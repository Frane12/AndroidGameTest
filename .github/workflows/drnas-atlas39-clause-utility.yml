name: DRNAS ATLAS39 native clause utility memory C7
run-name: ATLAS39 reason-utility shadow vs protect C7 Kissat 260 matched
on:
  push:
    branches: [experiment/drnas-atlas39-clause-utility-memory-20261111]
    paths:
      - research/drnas_atlas39_build.py
      - research/drnas_atlas39_benchmark.py
      - research/drnas_atlas39_audit.py
      - .github/workflows/drnas-atlas39-clause-utility.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cohort: [regression, extension, hard]
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - name: Build and run matched SATLIB
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages -q remotezip
          python3 research/drnas_atlas13_generator.py
          python3 research/drnas_atlas15_warm_patch.py
          python3 research/drnas_atlas15_cdcl_patch.py
          python3 research/drnas_atlas1_generate.py --out mre_atlas15/atlas1_table.hpp
          python3 research/drnas_atlas9_export_table.py research/atlas8_reduction_table.jsonl mre_atlas15/atlas8_rules.hpp
          python3 research/drnas_atlas16_build.py
          python3 research/drnas_atlas17_build.py
          python3 research/drnas_atlas19_build.py
          python3 research/drnas_atlas23_build.py
          python3 research/drnas_atlas36_build.py
          python3 research/drnas_atlas37_build.py
          python3 research/drnas_atlas39_build.py
          mkdir -p mre_atlas23/bin
          g++ -O2 -std=c++17 -I mre_atlas23 -I mre_atlas15 mre_atlas23/native.cpp -o mre_atlas23/bin/drnas_atlas39
          git clone -q https://github.com/arminbiere/kissat.git /tmp/atlas39-kissat
          git -C /tmp/atlas39-kissat checkout --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          (cd /tmp/atlas39-kissat && ./configure && make -j2)
          cp /tmp/atlas39-kissat/build/kissat mre_atlas23/bin/kissat
          taskset -c "$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')" python3 -u research/drnas_atlas39_benchmark.py --cohort ${{ matrix.cohort }} --shard ${{ matrix.shard }} | tee bench.log
          grep '^ATLAS39_FINAL ' bench.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS39-${{ matrix.cohort }}-${{ matrix.shard }}
          retention-days: 60
          path: |
            bench.log
            mre_atlas39/*/result_*.json
  audit:
    needs: benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ATLAS39-*
          path: audits
      - uses: actions/checkout@v4
      - name: SHA-matched proof-first audit and per-cohort PAR2
        run: |
          set -euo pipefail
          python3 -u research/drnas_atlas39_audit.py | tee audit.log
          grep '^ATLAS39_COHORT_AUDIT ' audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS39-AUDIT
          retention-days: 60
          path: audit.log
