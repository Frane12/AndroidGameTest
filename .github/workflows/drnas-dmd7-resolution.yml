name: DRNAS DMD7 - proof-first resolution 24 source screen and one-core E2E
on:
  push:
    branches: [experiment/drnas-dmd7-proof-first-resolution-20261109]
    paths:
      - research/dmd7_resolution_expander.cpp
      - research/dmd7_proof_first_bench.py
      - .github/workflows/drnas-dmd7-resolution.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-dmd7-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screen:
    name: Pinned native C++ proof-first expander and 24 original SHA source-only screening
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Restore frozen original EQUIV7 cases and Kissat pinned binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42618653489 -R Frane12/AndroidGameTest -n equiv7-sourceonly-48SHA-pinned-binaries -D .
          test "$(find mre_equiv7/cases -name '*.cnf' | wc -l)" -eq 48
          test -s built/bin/kissat_4_0_4
          chmod +x built/bin/kissat_4_0_4
      - name: Compile bounded C++ expander and pinned CaDiCaL 2.1.0 clause-only baseline
        run: |
          set -euo pipefail
          mkdir -p mre_dmd7/bin
          g++ -std=c++17 -O2 -Wall -Wextra -Werror research/dmd7_resolution_expander.cpp -o mre_dmd7/bin/dmd7_expand
          g++ -std=c++17 -O2 -Wall -Wextra -Werror research/dmd1_anf.cpp -o mre_dmd7/bin/dmd1_anf
          git clone -q https://github.com/arminbiere/cadical.git /tmp/dmd7-cadical
          cd /tmp/dmd7-cadical
          git checkout -q rel-2.1.0
          ./configure
          make -j2
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I./src \
            "$GITHUB_WORKSPACE/research/dmd5_lemma_ablation_native.cpp" \
            ./build/libcadical.a -o "$GITHUB_WORKSPACE/mre_dmd7/bin/dmd5_live"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/mre_dmd7/cadical-source-commit.txt"
          cd "$GITHUB_WORKSPACE"
      - name: Native and separate Python original-pair exhaustive proof selftests
        run: |
          set -euo pipefail
          python3 -m py_compile research/dmd7_proof_first_bench.py
          mre_dmd7/bin/dmd7_expand selftest | tee mre_dmd7/native-selftest.log
          grep -q '^DMD7_SELFTEST_PASS ' mre_dmd7/native-selftest.log
          mre_dmd7/bin/dmd5_live selftest | tee mre_dmd7/cadical-selftest.log
          grep -q '^DMD5_TRAIL_SELFTEST_PASS ' mre_dmd7/cadical-selftest.log
          python3 -u research/dmd7_proof_first_bench.py selftest | tee mre_dmd7/proof-selftest.log
          grep -q '^DMD7_PROOF_REPLAY_PASS ' mre_dmd7/proof-selftest.log
      - name: Audit 24 unchanged original SHA and freeze candidate-only preselection
        run: |
          set -euo pipefail
          python3 -u research/dmd7_proof_first_bench.py screen | tee mre_dmd7/screen.log
          grep -q '^DMD7_SCREEN_PASS ' mre_dmd7/screen.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmd7-frozen-screened-original-sha-native-proofs
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_dmd7/bin/*
            mre_dmd7/cadical-source-commit.txt
            mre_dmd7/manifest.json
            mre_dmd7/*selftest.log
            mre_dmd7/screen.log
  paired:
    name: DMD7 source matched one-core 8s E2E shard ${{ matrix.shard }}
    needs: screen
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: dmd7-frozen-screened-original-sha-native-proofs
          path: mre_dmd7
      - name: Restore source SHA and binary-pin proofs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42618653489 -R Frane12/AndroidGameTest -n equiv7-sourceonly-48SHA-pinned-binaries -D .
          chmod +x built/bin/kissat_4_0_4 mre_dmd7/bin/*
          python3 - <<'PY'
          import pathlib,json,hashlib
          p=pathlib.Path("mre_dmd7")
          m=json.loads((p/"manifest.json").read_text())
          for s,h in m["binary_hashes"].items():
              assert hashlib.sha256((p/"bin"/s).read_bytes()).hexdigest()==h, "native binary drift"
          print("DMD7_BINARY_PINS_PASS")
          PY
      - name: Compare Kissat CaDiCaL DMD1 and DMD7 placebo/top1/top4/top12 on original CNF
        run: |
          set -euo pipefail
          python3 -u research/dmd7_proof_first_bench.py shard --shard ${{ matrix.shard }} | tee mre_dmd7/shard-${{ matrix.shard }}.log
          grep -q '^DMD7_SHARD_PASS ${{ matrix.shard }} ' mre_dmd7/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmd7-shard-${{ matrix.shard }}
          retention-days: 30
          path: |
            mre_dmd7/shard-${{ matrix.shard }}.json
            mre_dmd7/shard-${{ matrix.shard }}.log
  audit:
    name: DMD7 final independent local proofs SAT original PAR2 and paired regression audit
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: dmd7-frozen-screened-original-sha-native-proofs
          path: mre_dmd7
      - uses: actions/download-artifact@v4
        with:
          pattern: dmd7-shard-*
          path: mre_dmd7
          merge-multiple: true
      - name: Verify all frozen original SHA-paired trials and PAR2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42618653489 -R Frane12/AndroidGameTest -n equiv7-sourceonly-48SHA-pinned-binaries -D .
          python3 -u research/dmd7_proof_first_bench.py audit | tee mre_dmd7/audit.log
          grep '^DMD7_FINAL ' mre_dmd7/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-DMD7-PROOF-FIRST-ONECPU-SCREEN-E2E-FINAL
          retention-days: 30
          path: |
            mre_dmd7/manifest.json
            mre_dmd7/report.json
            mre_dmd7/screen.log
            mre_dmd7/audit.log
            mre_dmd7/shard-*.json
