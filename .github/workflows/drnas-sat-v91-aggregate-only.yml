name: DRNAS SAT v9.1 — Consolidate Existing 540 Causal Measurements
on:
  push:
    branches:
      - experiment/drnas-sat-v91-aggregate-fix-20261031
    paths:
      - '.github/workflows/drnas-sat-v91-aggregate-only.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: v91-shard-*
          run-id: 41229157750
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: raw-v91
      - name: Exact 5-shard aggregate, no solver reruns or retraining
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p combined-v91
          for shard in 0 1 2 3 4; do
            test -f "raw-v91/v91-shard-$shard/manifest.json"
            mv "raw-v91/v91-shard-$shard" "combined-v91/shard-$shard"
          done
          python3 -m py_compile research/drnas-sat-v7-8/summarize_v91.py
          python3 -u research/drnas-sat-v7-8/summarize_v91.py combined-v91
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-v91-30-CNF-540-RESULTS-final-audit
          path: combined-v91/
          if-no-files-found: warn
