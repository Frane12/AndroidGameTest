name: DRNAS V13.5 - Locked Structural Training Only
on:
  push:
    branches: [experiment/drnas-v135-train-only-structural-router-20261101]
    paths:
      - '.github/workflows/drnas-sat-v135-training.yml'
      - 'research/drnas-sat-v7-8/v135_structural_router.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V133-existing-18-CNF-calibration
          run-id: 41257016856
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior
      - name: Lock simple structural router on only nine informative training cases
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/v135_structural_router.py
          test -s prior/v133_calibration.json
          python3 research/drnas-sat-v7-8/v135_structural_router.py \
            --source prior/v133_calibration.json \
            --json v135_model.json --md v135_train_report.md
          cat v135_train_report.md >> "$GITHUB_STEP_SUMMARY"
          sha256sum v135_model.json > v135_model.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V135-structural-router-training-only
          path: |
            v135_model.json
            v135_model.sha256
            v135_train_report.md
          if-no-files-found: warn
