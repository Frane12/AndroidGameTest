name: DRNAS MRE11 — native structural selector official SAT2026 5 arms 4 seed PAR2
on:
  push:
    branches: [experiment/drnas-mre11-cpp-structural-selector-20261108]
    paths: ['.github/workflows/drnas-mre11-cpp-selector.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-mre11-cpp-selector-20261108
  cancel-in-progress: false
jobs:
  prepare:
    name: Frozen official SAT2026 SHA source cohort and C++ certified gate parity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover original immutable pinned MRE10 CMS reference library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42509505558 -R Frane12/AndroidGameTest \
            -n mre10-SHA16-exact-CMS-inprocess-CPP -D .
          sha256sum -c mre10/binaries.sha256
          ls -lh mre5/lib/libcryptominisat5.so.5.11
      - name: Build native linked CMS, standalone emit and deterministic selftest
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ libcryptominisat5-dev libgmp10
          mkdir -p mre11/bin
          g++ -std=c++17 -O3 -Wall -Wextra -Werror -DMRE9_STANDALONE \
            research/mre11_native_selector.cpp -o mre11/bin/standalone
          g++ -std=c++17 -O3 -Wall -Wextra -Werror \
            research/mre11_native_selector.cpp "$PWD/mre5/lib/libcryptominisat5.so.5.11" \
            -Wl,-rpath,'$ORIGIN/../../mre5/lib' -o mre11/bin/native
          chmod +x mre11/bin/native mre11/bin/standalone
          python3 -m py_compile research/mre11_holdout.py
          python3 -u research/mre11_holdout.py selftest \
            --standalone mre11/bin/standalone
          export LD_LIBRARY_PATH="$PWD/mre5/lib:${LD_LIBRARY_PATH:-}"
          ldd mre11/bin/native | tee mre11/ldd.log
          grep 'libcryptominisat5.so.5.11' mre11/ldd.log
          sha256sum mre11/bin/native mre11/bin/standalone > mre11/bin.sha256
          echo MRE11_NATIVE_CPP_POLICY_SELFTEST_PASS
      - name: Freeze 2026 official main track original SHA BEFORE measuring MRE11
        run: |
          set -euo pipefail
          python3 -u research/mre11_holdout.py freeze | tee mre11/freeze.log
          (cd mre11 && sha256sum -c source.sha256)
          python3 -u research/mre11_holdout.py verify
          python3 -u research/mre11_holdout.py parity \
            --standalone mre11/bin/standalone | tee mre11/parity.log
          grep -q '^MRE11_SOURCE_EXACT_ARM_PARITY_PASS' mre11/parity.log
      - uses: actions/upload-artifact@v4
        with:
          name: mre11-2026-prospective-frozen-sources-and-native-CPP
          retention-days: 14
          if-no-files-found: error
          compression-level: 6
          path: |
            mre11/manifest.json
            mre11/source.sha256
            mre11/*.cnf
            mre11/bin/*
            mre11/bin.sha256
            mre11/freeze.log
            mre11/parity.log
            mre5/lib/libcryptominisat5.so.5.11
  factorial:
    name: MRE11 official 2026 5 native arms 4 seed SHA paired shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mre11-2026-prospective-frozen-sources-and-native-CPP
          path: .
      - name: Immutable source and CMS binary reference checks
        run: |
          set -euo pipefail
          (cd mre11 && sha256sum -c source.sha256)
          sha256sum -c mre11/bin.sha256
          chmod +x mre11/bin/native
          export LD_LIBRARY_PATH="$PWD/mre5/lib:${LD_LIBRARY_PATH:-}"
          ldd mre11/bin/native | grep 'libcryptominisat5.so.5.11'
          python3 -u research/mre11_holdout.py verify
      - name: Five native arms with real SAT/UNSAT 8s PAR2 and verified original witnesses
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib:${LD_LIBRARY_PATH:-}"
          python3 -u research/mre11_holdout.py shard \
            --shard ${{ matrix.shard }} --binary mre11/bin/native \
            | tee mre11/shard-${{ matrix.shard }}.log
          grep -q '^MRE11_SHARD_PASS ${{ matrix.shard }} ' mre11/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mre11-factorial-shard-${{ matrix.shard }}
          retention-days: 14
          compression-level: 6
          path: |
            mre11/shard-${{ matrix.shard }}.json
            mre11/shard-${{ matrix.shard }}.log
  audit:
    name: Final prospective per-source PAR2 audit and NO AUTO PROMOTION
    needs: factorial
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mre11-2026-prospective-frozen-sources-and-native-CPP
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: mre11-factorial-shard-*
          merge-multiple: true
          path: mre11
      - name: Complete SHA paired 5-arm 4-seed official 2026 audit
        run: |
          set -euo pipefail
          (cd mre11 && sha256sum -c source.sha256)
          python3 -u research/mre11_holdout.py audit | tee mre11/audit.log
          grep -q '^MRE11_FINAL' mre11/audit.log
          cat mre11/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-MRE11-2026-5ARM-4SEED-PAR2-AUDIT
          retention-days: 30
          if-no-files-found: error
          path: |
            mre11/report.json
            mre11/audit.log
