name: DRNAS SAT V7.2.1 Independent Replication
on:
  push:
    branches:
      - research/drnas-sat-confidence-v7-2-1
    paths:
      - .github/workflows/drnas-sat-confidence-v721-replica.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drnas-sat-v721-replica
  cancel-in-progress: false
jobs:
  v721-replica:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build pinned unchanged CaDiCaL 3.0.1
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch rel-3.0.1 https://github.com/arminbiere/cadical.git cadical-src
          git -C cadical-src rev-parse HEAD | tee cadical-source-commit.txt
          (cd cadical-src && ./configure && make -j2)
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -I cadical-src/src \
            research/drnas-sat-v7-2-1/confidence_bench.cpp cadical-src/build/libcadical.a \
            -o confidence_bench -pthread -ldl -lz
      - name: Independent untouched replication, 204 CNFs
        shell: bash
        run: |
          set -euo pipefail
          python research/drnas-sat-v7-2/generate_v72.py \
            --seed 20261203 --each 17 --outdir "$GITHUB_WORKSPACE/v721_replica"
          ./confidence_bench \
            "$GITHUB_WORKSPACE/v721_replica/manifest.csv" \
            "$GITHUB_WORKSPACE/v721_replica/measurements.csv" 3 20261203
          python research/drnas-sat-v7-2-1/summarize_confidence.py \
            --csv "$GITHUB_WORKSPACE/v721_replica/measurements.csv" \
            --out "$GITHUB_WORKSPACE/v721_replica/summary.json" > v721_replica/summary_stdout.txt
      - name: Publish independent replication without changes to the gate
        if: success()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads(Path('v721_replica/summary.json').read_text())
          lines=['# Independent V7.2.1 replication',
              f"{s['cases']} new seeded CNFs, {s['repetitions']} repeats each, correct {s['verified_sat_unsat']}/{s['cases']}",
              '',
              '| Method | Sum median ms | Speedup | Faster cases |',
              '|---|---:|---:|---:|']
          for m in ['plain','majority','selective','confidence','confidence_random']:
              x=s['methods'][m]
              lines.append(f"| {m} | {x['sum_of_case_medians_ms']:.3f} | {x['speedup_plain_over_method']:.4f}x | {x['faster_cases']} |")
          lines += ['','| Gate | Selected | False positives | Precision >=5% |',
              '|---|---:|---:|---:|']
          for m in ['selective','confidence']:
              x=s['selector'][m]
              lines.append(f"| {m} | {x['selected']} | {x['false_positive']} | {x['precision']:.3f} |")
          lines.append('Same frozen thresholds, different seed. Synthetic formulas; interpretation limited.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(lines)+'\n')
          PY
      - name: Save raw results and CNFs for replication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-sat-v721-confidence-replication
          path: |
            cadical-source-commit.txt
            v721_replica/
          if-no-files-found: warn
