name: DRNAS EQUIV2 - CaDiCaL 1.7.3 versus 3.0.1 384 paired E2E
on:
  push:
    branches: [experiment/drnas-equiv2-cadical301-comparison-20261109]
    paths:
      - '.github/workflows/drnas-equiv2-cadical301.yml'
      - 'research/drnas_equiv2_cadical301.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-equiv2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  freeze:
    name: Restore frozen X20 SHA, compile SCC and proof-replay selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Download immutable X20 original CNFs and historical reference results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42587550843 -R Frane12/AndroidGameTest -n x20-frozen-twentyfour-original-sha-and-unchanged-x18-solver -D .
          mkdir -p prior_x20
          gh run download 42587550843 -R Frane12/AndroidGameTest -n DRNAS-X20-24-NEW-SOURCEONLY-288-E2E-SELECT2-CPU-PAR2-FINAL -D prior_x20
          test -s mre_x20/manifest.json
          find prior_x20 -maxdepth 2 -type f -printf '%p\n' | sort | head -18
          test -s prior_x20/shard-0.json
          test -s mre_x4/bin/native
          test -s built/bin/kissat_4_0_4
          test -s mre5/lib/libcryptominisat5.so.5.11
          test "$(find mre_x20 -maxdepth 1 -name '*.cnf' | wc -l)" -eq 24
      - name: Compile X25 C++ signed SCC; verify CaDiCaL options and lifted original CNF SAT
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical g++
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          mkdir -p mre_equiv2/bin
          g++ -O2 -std=c++17 -Wall -Wextra -pedantic research/drnas_x25_alias_dose.cpp -o mre_equiv2/bin/alias_dose
          git clone --depth 1 --branch rel-3.0.1 https://github.com/arminbiere/cadical.git /tmp/drnas-cadical-301
          (cd /tmp/drnas-cadical-301 && ./configure && make -j2)
          cp /tmp/drnas-cadical-301/build/cadical mre_equiv2/bin/cadical_3_0_1
          test "$(mre_equiv2/bin/cadical_3_0_1 --version)" = 3.0.1
          chmod +x mre_equiv2/bin/cadical_3_0_1 mre_equiv2/bin/alias_dose mre_x4/bin/native built/bin/kissat_4_0_4
          python3 -m py_compile research/drnas_equiv2_cadical301.py
          python3 -u research/drnas_equiv2_cadical301.py freeze | tee mre_equiv2/freeze.log
          python3 -u research/drnas_equiv2_cadical301.py selftest | tee mre_equiv2/selftest.log
          python3 -u research/drnas_equiv2_cadical301.py verify
          grep -q '^EQUIV2_SELFTEST_PASS ' mre_equiv2/selftest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: equiv2-frozen-source-and-tested-SCC
          retention-days: 21
          if-no-files-found: error
          path: |
            mre_x20/manifest.json
            mre_x20/*.cnf
            mre_x4/bin/native
            mre5/lib/libcryptominisat5.so.5.11
            built/bin/kissat_4_0_4
            prior_x20/shard-*.json
            mre_equiv2/bin/alias_dose
            mre_equiv2/bin/cadical_3_0_1
            mre_equiv2/manifest.json
            mre_equiv2/freeze.log
            mre_equiv2/selftest.log
  paired:
    name: EQUIV2 48 E2E trials SCC ablation shard ${{ matrix.shard }}
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: equiv2-frozen-source-and-tested-SCC, path: .}
      - name: "CaDiCaL 1.7.3 versus 3.0.1: ELS SCC rounds, gates, DRNAS native and Kissat"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_equiv2/bin/cadical_3_0_1 mre_equiv2/bin/alias_dose mre_x4/bin/native built/bin/kissat_4_0_4
          python3 -u research/drnas_equiv2_cadical301.py verify
          python3 -u research/drnas_equiv2_cadical301.py shard --shard ${{ matrix.shard }} | tee mre_equiv2/shard-${{ matrix.shard }}.log
          grep -q '^EQUIV2_SHARD_PASS ${{ matrix.shard }} 48$' mre_equiv2/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: equiv2-shard-${{ matrix.shard }}
          retention-days: 21
          path: |
            mre_equiv2/shard-${{ matrix.shard }}.json
            mre_equiv2/shard-${{ matrix.shard }}.log
  audit:
    name: Final 384 matched original-SHA PAR2 and CPU audit
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: equiv2-frozen-source-and-tested-SCC, path: .}
      - uses: actions/download-artifact@v4
        with:
          pattern: equiv2-shard-*
          path: .
          merge-multiple: true
      - name: No unverified SAT, only original-backend-agreement UNSAT; no auto promotion
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_equiv2/bin/cadical_3_0_1 mre_equiv2/bin/alias_dose mre_x4/bin/native built/bin/kissat_4_0_4
          python3 -u research/drnas_equiv2_cadical301.py verify
          python3 -u research/drnas_equiv2_cadical301.py audit | tee mre_equiv2/audit.log
          grep '^EQUIV2_FINAL ' mre_equiv2/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-EQUIV2-CAUSAL-384-E2E-PAR2-FINAL
          retention-days: 30
          path: |
            mre_equiv2/manifest.json
            mre_equiv2/report.json
            mre_equiv2/audit.log
            mre_equiv2/shard-*.json
