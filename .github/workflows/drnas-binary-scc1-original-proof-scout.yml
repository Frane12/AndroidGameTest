name: DRNAS BINARY-SCC1 - native 17 original SHA implication proof scout
run-name: BINARY-SCC1 original CNF 17 SHA x 3 oneCPU scans certified implication SCC
on:
  push:
    branches: [experiment/drnas-binary-scc1-proof-scout-20261110]
    paths:
      - research/drnas_binary_scc1_scout.cpp
      - research/drnas_binary_scc1_source_audit.py
      - .github/workflows/drnas-binary-scc1-original-proof-scout.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: binary-scc1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  freeze:
    name: Build native C++ and freeze 12 EQUIV9 + 5 EQUIV10M5 source-only SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore original SHAs and immutable historical registries, no replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42729709584 -R Frane12/AndroidGameTest -n equiv10m5-exact-five-SHA-frozen-and-pinned-onecore-binaries -D .
          test -s mre_equiv10m5/manifest.json
          test -s mre_equiv10medium/manifest.json
          test -s mre_equiv9/manifest.json
          test -s mre_equiv9/cases/47a1a6f5687ed19c5c0f77c2c81f3f81.cnf
          test -s mre_x4/bin/native
          test -s built/bin/kissat_4_0_4
          test -s mre_equiv7/bin/cadical_3_0_1
          chmod +x mre_x4/bin/native built/bin/kissat_4_0_4 mre_equiv7/bin/cadical_3_0_1
      - name: Compile self-contained C++ graph / source implication witness scout
        run: |
          set -euo pipefail
          mkdir -p mre_binary_scc1/bin
          g++ -O2 -std=c++17 -Wall -Wextra -Werror research/drnas_binary_scc1_scout.cpp -o mre_binary_scc1/bin/scc_scout
          chmod +x mre_binary_scc1/bin/scc_scout
          ldd mre_binary_scc1/bin/scc_scout
          sha256sum mre_binary_scc1/bin/scc_scout
      - name: Independent 150 toy Tarjan two-SAT brute-force checks, then freeze
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          python3 -m py_compile research/drnas_binary_scc1_source_audit.py
          python3 -u research/drnas_binary_scc1_source_audit.py selftest | tee mre_binary_scc1/selftest.log
          grep -q '^BINARY_SCC1_SELFTEST_PASS ' mre_binary_scc1/selftest.log
          python3 -u research/drnas_binary_scc1_source_audit.py freeze | tee mre_binary_scc1/freeze.log
          grep -q '^BINARY_SCC1_FROZEN ' mre_binary_scc1/freeze.log
          python3 -u research/drnas_binary_scc1_source_audit.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binary-scc1-immutable-17SHA-native-scout-and-registries
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_binary_scc1/manifest.json
            mre_binary_scc1/bin/scc_scout
            mre_binary_scc1/selftest.log
            mre_binary_scc1/freeze.log
            mre_equiv10m5/manifest.json
            mre_equiv10medium/manifest.json
            mre_equiv9/manifest.json
            mre_equiv9/cases/*.cnf
            mre_equiv7/manifest.json
            mre_x20/manifest.json
            prior_x22/mre_x22/manifest.json
            prior_equiv6/mre_equiv6/manifest.json
            mre_x4/bin/native
            built/bin/kissat_4_0_4
            mre_equiv7/bin/cadical_3_0_1
            mre5/lib/libcryptominisat5.so.5.11
  scan:
    name: Native SCC + all-alias Tarjan verified original 3x scan shard ${{ matrix.shard }}
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: binary-scc1-immutable-17SHA-native-scout-and-registries
          path: .
      - name: 1 pinned logical CPU source-only SHA scan, independent original proof replay
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_binary_scc1/bin/scc_scout mre_x4/bin/native built/bin/kissat_4_0_4 mre_equiv7/bin/cadical_3_0_1
          python3 -u research/drnas_binary_scc1_source_audit.py verify
          python3 -u research/drnas_binary_scc1_source_audit.py shard --shard ${{ matrix.shard }} | tee mre_binary_scc1/shard-${{ matrix.shard }}.log
          grep -q '^BINARY_SCC1_SHARD_PASS ' mre_binary_scc1/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binary-scc1-shard-${{ matrix.shard }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_binary_scc1/shard-${{ matrix.shard }}.json
            mre_binary_scc1/shard-${{ matrix.shard }}-evidence.json
            mre_binary_scc1/shard-${{ matrix.shard }}.log
  audit:
    name: Audit 51 SHA-verified scans, source alias proof, contradictions and time
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: binary-scc1-immutable-17SHA-native-scout-and-registries
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-scc1-shard-*
          path: mre_binary_scc1
          merge-multiple: true
      - name: Audit native source-only metrics, all alias proofs, no invalid PAR2 claim
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_binary_scc1/bin/scc_scout mre_x4/bin/native built/bin/kissat_4_0_4 mre_equiv7/bin/cadical_3_0_1
          python3 -u research/drnas_binary_scc1_source_audit.py audit | tee mre_binary_scc1/audit.log
          grep -q '^BINARY_SCC1_FINAL ' mre_binary_scc1/audit.log
          grep '^BINARY_SCC1_FINAL ' mre_binary_scc1/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-BINARY-SCC1-17SHA-51-ORIGINAL-PROOF-SCANS-FINAL
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_binary_scc1/report.json
            mre_binary_scc1/audit.log
            mre_binary_scc1/manifest.json
            mre_binary_scc1/shard-*.json
