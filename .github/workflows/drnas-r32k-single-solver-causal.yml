name: DRNAS R32k single-Kissat certified XOR causal ablation
on:
  push:
    branches: [experiment/drnas-r32k-single-solver-causal-20261103]
    paths:
      - '.github/workflows/drnas-r32k-single-solver-causal.yml'
      - 'experiments/drnas_v16/patch_r32k_causal_ablation.py'
      - 'experiments/drnas_v16/r32k_causal_single_solver_benchmark.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r32k-single-solver-causal-v1
  cancel-in-progress: true
jobs:
  freeze_build:
    name: Freeze 62 originals, verify R32k certified source units, compile pinned Kissat
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check source syntax
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/patch_r32b_native_shadow.py experiments/drnas_v16/patch_r32k_causal_ablation.py experiments/drnas_v16/r32k_causal_single_solver_benchmark.py
      - uses: actions/download-artifact@v4
        with:
          name: r32e-70-frozen-originals
          run-id: 41638482746
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-r32e
      - name: Freeze 2 known plus 60 entirely new SHA-distinct formulas
        run: |
          set -euo pipefail
          (cd prior-r32e && sha256sum -c cnf.sha256)
          python3 -u experiments/drnas_v16/r32k_causal_single_solver_benchmark.py freeze \
            --prior prior-r32e --dest frozen
          (cd frozen && sha256sum -c cnf.sha256)
          python3 - <<'PY'
          import json
          m=json.load(open("frozen/manifest.json"))
          assert m["total_trials"]==1920 and len(m["cases"])==62
          assert sum(c["cohort"]=="prior_development" for c in m["cases"])==2
          assert sum(c["cohort"]!="prior_development" for c in m["cases"])==60
          print("R32K_FROZEN_SHA_PASS")
          PY
      - name: Build clean Kissat and R32k native GF2 ablation on SAME pinned upstream
        run: |
          set -euo pipefail
          git clone -q https://github.com/arminbiere/kissat.git /tmp/r32k-clean
          git -C /tmp/r32k-clean checkout -q --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          test "$(git -C /tmp/r32k-clean rev-parse HEAD)" = 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          cp -r /tmp/r32k-clean /tmp/r32k-native
          python3 -u experiments/drnas_v16/patch_r32b_native_shadow.py --kissat-root /tmp/r32k-native
          python3 -u experiments/drnas_v16/patch_r32k_causal_ablation.py --kissat-root /tmp/r32k-native
          (cd /tmp/r32k-clean && ./configure && make -j2 > /tmp/r32k-clean-build.log)
          (cd /tmp/r32k-native && ./configure && make -j2 > /tmp/r32k-native-build.log)
          mkdir -p compiled
          cp /tmp/r32k-clean/build/kissat compiled/clean
          cp /tmp/r32k-native/build/kissat compiled/native
          chmod +x compiled/*
          (cd compiled && sha256sum clean native > binaries.sha256 && sha256sum -c binaries.sha256)
      - name: Preflight source-original unit injection and abstention
        run: |
          set -euo pipefail
          for family in consistent_visible consistent_hidden consistent_mixed root_unsat xor_decoy; do
            for variant in full first4 first8 last4; do
              set +e
              R32B_MODE=r32k R32K_VARIANT="$variant" compiled/native "frozen/r32k_fresh_$family"_240.cnf > "r32k-$family-$variant.log"
              code=$?
              set -e
              test "$code" -eq 10 -o "$code" -eq 20
              grep -q "^c R32K_ABLATION variant=$variant " "r32k-$family-$variant.log"
              grep -q '^c R32B_PROBE mark=9999 ' "r32k-$family-$variant.log"
              grep -q '^c R32B_FINAL status=' "r32k-$family-$variant.log"
            done
          done
          for family in consistent_visible consistent_hidden consistent_mixed; do
            grep -Eq '^c R32C_INJECTED_LITS count=4 lits=' "r32k-$family-first4.log"
            grep -Eq '^c R32C_INJECTED_LITS count=8 lits=' "r32k-$family-first8.log"
            grep -Eq '^c R32C_INJECTED_LITS count=4 lits=' "r32k-$family-last4.log"
          done
          for family in root_unsat xor_decoy; do
            if grep -q '^c R32C_INJECTED_LITS ' "r32k-$family-full.log"; then
              echo "UNSAFE_R32K_ABLATION on $family" >&2
              exit 1
            fi
          done
          echo R32K_ROOT_SUBSET_PREFLIGHT_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: r32k-62-source-originals
          path: frozen/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: r32k-pinned-kissat-binary-pair
          path: compiled/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r32k-preflight-logs
          path: r32k-*.log
          if-no-files-found: warn
  paired:
    needs: freeze_build
    name: r32k-shard-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r32k-62-source-originals
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: r32k-pinned-kissat-binary-pair
          path: compiled
      - name: Verify frozen original CNFs and native fingerprints
        run: |
          set -euo pipefail
          chmod +x compiled/clean compiled/native
          (cd frozen && sha256sum -c cnf.sha256)
          (cd compiled && sha256sum -c binaries.sha256)
      - name: One Kissat per trial; randomized paired source-certified root subset ablations
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r32k_causal_single_solver_benchmark.py measure \
            --inputs frozen --clean compiled/clean --native compiled/native \
            --shard "$SHARD" --outdir results | tee r32k-live.log
          test -s results/rows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r32k-shard-${{ matrix.shard }}
          path: |
            results/
            r32k-live.log
          if-no-files-found: warn
  audit:
    needs: [freeze_build, paired]
    if: always()
    name: Verify 1920 original-source paired trials, conflict ablation and 95pct intervals
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r32k-62-source-originals
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: r32k-shard-*
          path: combined
      - name: Prove certificate invariance, quantify cause and confidence
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r32k_causal_single_solver_benchmark.py aggregate \
            --inputs frozen --combined combined \
            --output r32k-results.json --report r32k-results.md
          cat r32k-results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R32K-SINGLE-KISSAT-XOR-CAUSAL-FINAL-1920
          path: |
            r32k-results.json
            r32k-results.md
            frozen/manifest.json
          if-no-files-found: warn
