name: DRNAS Ultimate R2 — certified R153 GF2 CDCL 200 paired
on:
  push:
    branches: [experiment/drnas-ultimate-r2-certified-cdcl-20261107, experiment/drnas-ultimate-r2-prep-budget-20261107]
    paths: ['research/ultimate_r2_fallback.py','research/ultimate_r2_benchmark.py','.github/workflows/drnas-ultimate-r2-certified-cdcl.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ultimate-r2-certified-cdcl-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove preregistered protocol and independent Gaussian proof tests
        run: |
          set -euo pipefail
          python3 -m py_compile research/ultimate_r2_fallback.py research/ultimate_r2_benchmark.py research/r166x_certified_gauss.py
          python3 -u research/ultimate_r2_benchmark.py selftest
          python3 -u research/r166x_certified_gauss.py --selftest
      - name: Download unchanged SHA-pinned R153 R160 R194 R1A references; freeze 12 new official originals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42344094697 --repo Frane12/AndroidGameTest -n ultimate-r1-45originals-pinned-binaries -D .
          test -s ultimate_r1/frozen/manifest.json
          python3 - <<'PY'
          import json,hashlib,pathlib
          v=json.loads(pathlib.Path("ultimate_r1/pin.json").read_text())
          for n,s in v["binaries"].items():
              assert hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==s,n
          assert hashlib.sha256(pathlib.Path("ultimate_r1/frozen/manifest.json").read_bytes()).hexdigest()==v["manifest_sha"]
          print("ULTIMATE_R2_R1A_FROZEN_PASS",v["source_commit"])
          PY
          chmod +x ultimate_r1/source_r153/r153 ultimate_r1/ultimate-dispatch ultimate_r1/r160-dispatch ultimate_r1/r194-compat built/bin/kissat_4_0_4 built/bin/cadical_3_0_1
          python3 -u research/ultimate_r2_benchmark.py freeze | tee ultimate_r2-freeze.log
          grep -q '^ULTIMATE_R2_FREEZE_PASS ' ultimate_r2-freeze.log
      - name: Compile original R166x certified IPASIR-UP bridge with pinned CaDiCaL 2.1
        run: |
          set -euo pipefail
          git clone -q https://github.com/arminbiere/cadical.git /tmp/ultimate-r2-cadical
          (cd /tmp/ultimate-r2-cadical && git checkout -q 31f9aae44947c673dc6190c9beb399acb9ffec6a && ./configure && make -j2)
          test "$(git -C /tmp/ultimate-r2-cadical rev-parse HEAD)" = 31f9aae44947c673dc6190c9beb399acb9ffec6a
          g++ -std=c++17 -O2 -Wall -Wextra -I/tmp/ultimate-r2-cadical/src research/r166x_component_feedback.cpp /tmp/ultimate-r2-cadical/build/libcadical.a -o ultimate_r2/r166x-native
          chmod +x ultimate_r2/r166x-native research/ultimate_r2_fallback.py
          : > ultimate_r2/empty.tsv
          ultimate_r2/r166x-native selftest | tee ultimate_r2-native-selftest.log
          grep -q '^R166X_DERIVED_UNIT_NATIVE_SELFTEST_PASS' ultimate_r2-native-selftest.log
          grep -q '^R166X_COOLDOWN_REAWAKEN_SELFTEST_PASS' ultimate_r2-native-selftest.log
      - name: Native SAT smoke of R153 -> certified GF2 -> CDCL live and clean paths
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,subprocess,time
          p=pathlib.Path("ultimate_r2")
          cl=[]
          for g in range(4):
              vs=[3*g+1,3*g+2,3*g+3]
              for mask in (1,2,4,7):
                  cl.append(" ".join(str(-v if mask>>i&1 else v) for i,v in enumerate(vs))+" 0")
          for i in range(28):cl.append(f"{1+(i%12)} {1+((i+5)%12)} 13 0")
          s=p/"smoke-certified-mixed.cnf"
          s.write_text(f"p cnf 13 {len(cl)}\n"+"\n".join(cl)+"\n")
          for mode in ("clean","shadow","live"):
              env=os.environ.copy()
              env.update(ULTIMATE_R2_MODE=mode,ULTIMATE_R2_DEADLINE_NS=str(time.monotonic_ns()+10_000_000_000))
              z=subprocess.run(["ultimate_r1/source_r153/r153",str(s),"research/ultimate_r2_fallback.py"],
                  stdout=subprocess.PIPE,stderr=subprocess.PIPE,env=env,timeout=11)
              assert z.returncode==10,(mode,z.returncode,z.stderr[-800:],z.stdout[-1500:])
              assert b"ULTIMATE_R2_GATE" in z.stdout,(mode,z.stdout[-1200:])
              if mode=="live":
                  assert b'"eligible": true' in z.stdout,z.stdout[-1400:]
                  assert b"R166X_RESULT mode=gauss_cooldown status=SAT" in z.stdout,z.stdout[-1400:]
          print("ULTIMATE_R2_CERTIFIED_CDCL_INTEGRATION_SELFTEST_PASS")
          PY
      - name: Freeze all native binary, original source and research commit hashes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          paths=["ultimate_r1/source_r153/r153","ultimate_r1/ultimate-dispatch","ultimate_r1/r160-dispatch",
            "ultimate_r1/r194-compat","built/bin/kissat_4_0_4","built/bin/cadical_3_0_1",
            "ultimate_r2/r166x-native","research/ultimate_r2_fallback.py"]
          h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          v=dict(binaries={p:h(p) for p in paths},manifest_sha=h("ultimate_r2/frozen/manifest.json"),
             source_commit=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
             caDiCaL_commit="31f9aae44947c673dc6190c9beb399acb9ffec6a",expected_trials=200)
          pathlib.Path("ultimate_r2/build-pin.json").write_text(json.dumps(v,sort_keys=True,indent=2))
          print("ULTIMATE_R2_PIN_PASS",v["source_commit"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ultimate-r2-originals-pinned-native-protocol
          retention-days: 90
          path: |
            ultimate_r1/
            ultimate_r2/
            built/bin/kissat_4_0_4
            built/bin/cadical_3_0_1
            ultimate_r2-freeze.log
            ultimate_r2-native-selftest.log
  paired:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    name: Ultimate R2 same-source five-arm paired shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0,1,2,3,4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ultimate-r2-originals-pinned-native-protocol
          path: .
      - name: Verify all original CNF SHA, native binaries and exact commit
        run: |
          set -euo pipefail
          chmod +x ultimate_r1/source_r153/r153 ultimate_r1/ultimate-dispatch ultimate_r1/r160-dispatch ultimate_r1/r194-compat ultimate_r2/r166x-native research/ultimate_r2_fallback.py built/bin/kissat_4_0_4 built/bin/cadical_3_0_1
          python3 -u research/ultimate_r2_benchmark.py verify
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          v=json.loads(pathlib.Path("ultimate_r2/build-pin.json").read_text())
          for n,s in v["binaries"].items():assert hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==s,n
          assert hashlib.sha256(pathlib.Path("ultimate_r2/frozen/manifest.json").read_bytes()).hexdigest()==v["manifest_sha"]
          assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==v["source_commit"]
          assert v["expected_trials"]==200
          print("ULTIMATE_R2_SHA_CHECKPOINT_PASS")
          PY
      - name: R1A vs R153 vs clean vs shadow vs certified live CDCL
        run: |
          set -euo pipefail
          python3 -u research/ultimate_r2_benchmark.py shard --shard ${{ matrix.shard }} | tee ultimate_r2/shard-${{ matrix.shard }}.log
          grep -q '^ULTIMATE_R2_SHARD_PASS' ultimate_r2/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultimate-r2-shard-${{ matrix.shard }}
          retention-days: 90
          path: |
            ultimate_r2/shard-${{ matrix.shard }}.json
            ultimate_r2/shard-${{ matrix.shard }}.log
  audit:
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ultimate-r2-originals-pinned-native-protocol
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: ultimate-r2-shard-*
          merge-multiple: true
          path: ultimate_r2
      - name: Strict source SHA SAT witness GF2 replay and 200 paired PAR2 audit
        run: |
          set -euo pipefail
          test "$(find ultimate_r2 -maxdepth 1 -name 'shard-*.json' | wc -l)" -eq 5
          python3 -u research/ultimate_r2_benchmark.py audit | tee ultimate_r2/audit.log
          grep -q '^ULTIMATE_R2_FINAL' ultimate_r2/audit.log
          cat ultimate_r2/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-ULTIMATE-R2-CERTIFIED-GF2-CDCL-200-FINAL
          retention-days: 90
          path: |
            ultimate_r2/report.json
            ultimate_r2/trials.json
            ultimate_r2/trials.csv
            ultimate_r2/summary.md
            ultimate_r2/audit.log
