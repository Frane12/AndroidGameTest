name: DRNAS MRE12 — exact SCC equivalence quotient with proof replay
on:
  push:
    branches: [experiment/drnas-mre12-exact-scc-quotient-20261109]
    paths:
      - 'research/mre12_exact_quotient.py'
      - '.github/workflows/drnas-mre12-exact-quotient.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-mre12-exact-scc-quotient-20261109
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exhaustive truth-table and tampered proof rejection selftests
        run: |
          set -euo pipefail
          python3 -m py_compile research/mre12_exact_quotient.py
          python3 -u research/mre12_exact_quotient.py selftest | tee mre12-selftest.log
          grep -q '^MRE12_EXHAUSTIVE_PASS ' mre12-selftest.log
      - name: Retrieve 12 original frozen C15D CNFs and pinned CaDiCaL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42541912605 -R Frane12/AndroidGameTest -n c15d-frozen-originals-and-pinned-backends -D .
          sha256sum -c c15d_out/binary.sha256
          chmod +x c8c/bin/plain c8c/bin/instrumented built/bin/kissat_4_0_4
          python3 -u research/mre12_exact_quotient.py verify
      - uses: actions/upload-artifact@v4
        with:
          name: mre12-pinned-frozen-sources
          retention-days: 7
          if-no-files-found: error
          compression-level: 4
          path: |
            c15d_sources/
            c15d_out/binary.sha256
            c8c/bin/instrumented
            mre12-selftest.log
  trials:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mre12-pinned-frozen-sources
          path: .
      - name: Verify binary and source SHA before E2E SAT
        run: |
          set -euo pipefail
          grep 'c8c/bin/instrumented$' c15d_out/binary.sha256 | sha256sum -c
          chmod +x c8c/bin/instrumented
          python3 -u research/mre12_exact_quotient.py verify
      - name: "Four-source-matched arms: original, shadow, exact quotient, selective no-vivify"
        run: |
          set -euo pipefail
          python3 -u research/mre12_exact_quotient.py shard --shard ${{ matrix.shard }} | tee mre12-shard-${{ matrix.shard }}.log
          grep -q '^MRE12_SHARD_PASS ${{ matrix.shard }} 24$' mre12-shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mre12-shard-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            mre12_out/shard-${{ matrix.shard }}.json
            mre12-shard-${{ matrix.shard }}.log
  audit:
    needs: trials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mre12-pinned-frozen-sources
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: mre12-shard-*
          merge-multiple: true
          path: mre12_out
      - name: Fail-closed original-SHA, witness, exact-proof and paired PAR2 audit
        run: |
          set -euo pipefail
          grep 'c8c/bin/instrumented$' c15d_out/binary.sha256 | sha256sum -c
          python3 -u research/mre12_exact_quotient.py audit | tee mre12-audit.log
          grep '^MRE12_FINAL ' mre12-audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: MRE12-PROOF-REPLAYED-12SHA-96-PAIRED-AUDIT
          retention-days: 30
          if-no-files-found: error
          path: |
            mre12_out/report.json
            mre12-audit.log
