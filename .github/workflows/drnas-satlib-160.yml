name: DRNAS independent SATLIB-160 study
on:
  workflow_dispatch:
  push:
    paths:
      - 'DRNAS_NP_Crypto_Benchmark/drnas_np_lab.py'
      - 'DRNAS_NP_Crypto_Benchmark/test_v02.py'
      - 'DRNAS_NP_Crypto_Benchmark/fetch_satlib.py'
      - 'DRNAS_NP_Crypto_Benchmark/diagnose_satlib.py'
      - '.github/workflows/drnas-satlib-160.yml'
permissions:
  contents: read
jobs:
  external-satlib:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real CryptoMiniSat
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cryptominisat
          cryptominisat5 --version
      - name: Confirm solver and test correctness
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          python drnas_np_lab.py test
          python test_v02.py
      - name: Download 160 independent original SATLIB CNFs and source checksums
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          python fetch_satlib.py --dir external_cases
          test "$(($(wc -l < external_cases/manifest.csv)-1))" -eq 160
      - name: Benchmark 160 SATLIB cases on identical host (1.5 s per solver case)
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          python benchmark_cryptominisat.py --cases-dir external_cases --out external_results --crypto cryptominisat5 --timeout 1.5 --repeats 1 --require-crypto
      - name: Regenerate earlier synthetic controls (separate category)
        if: always()
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          python generate_cases.py --dir cases --seeds 2
      - name: Structural analysis and causal ablation (exact same inputs)
        if: always()
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          python diagnose_satlib.py
      - name: Print external summary
        if: always()
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          if test -f external_results/summary.csv; then cat external_results/summary.csv; fi
          if test -f diagnostic_results/diagnosis.json; then cat diagnostic_results/diagnosis.json; fi
      - name: Upload independent raw cases, checksums, outputs and ablations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-independent-satlib-160
          path: |
            DRNAS_NP_Crypto_Benchmark/external_cases/
            DRNAS_NP_Crypto_Benchmark/external_results/
            DRNAS_NP_Crypto_Benchmark/diagnostic_results/
            DRNAS_NP_Crypto_Benchmark/cases/manifest.csv
          if-no-files-found: warn
