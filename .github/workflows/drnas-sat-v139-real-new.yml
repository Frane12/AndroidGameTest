name: DRNAS V13.9 - Explain Real XOR and Frozen New External Holdout
on:
  push:
    branches: [experiment/drnas-v139-external-blind-structure-20261101]
    paths:
      - '.github/workflows/drnas-sat-v139-real-new.yml'
      - 'research/drnas-sat-v7-8/v139_external_freeze.py'
      - 'research/drnas-sat-v7-8/v139_external_bench.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose-known-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V138-external2026-18-CNF-final-audit
          run-id: 41260140613
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v138
      - name: Explain exact XOR structure of known real 2026 success
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/v139_external_freeze.py research/drnas-sat-v7-8/v139_external_bench.py
          test -s prior-v138/frozen/v138_manifest.json
          mkdir -p diagnosis
          python3 -u research/drnas-sat-v7-8/v139_external_freeze.py inspect \
            --v138 prior-v138/frozen/v138_manifest.json \
            --out diagnosis/real_xor_75429ff7.json \
            --md diagnosis/real_xor_75429ff7.md
          cat diagnosis/real_xor_75429ff7.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V139-real-external-XOR-diagnosis
          path: diagnosis/
          if-no-files-found: warn

  freeze-fresh-2026:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V131-exact256-132-retrospective-audit
          run-id: 41255417615
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior131
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-UnOfficial-SATComp2026-Mini-216-Matched
          run-id: 41248293940
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-mini
      - uses: actions/download-artifact@v4
        with:
          name: v100-frozen-protocol-and-inputs
          run-id: 41245906965
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v100
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V132-frozen-24-new-inputs
          run-id: 41256313918
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v132
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V138-external2026-18-CNF-final-audit
          run-id: 41260140613
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v138
      - name: Verify historical identity manifests and fetch signed 2026 score snapshot
        run: |
          set -euo pipefail
          (cd prior131/frozen && sha256sum -c v13_manifest.sha256)
          (cd prior-mini/frozen && sha256sum -c official_mini_manifest.sha256)
          (cd prior-v100 && sha256sum -c v100_manifest.sha256)
          (cd prior-v132 && sha256sum -c v132_manifest.sha256)
          curl -fL --retry 3 --max-time 120 \
            https://raw.githubusercontent.com/satcompetition/2026/3e2dee7cf5aa643c77bf946280a3c1c520756ef9/downloads/scores.csv \
            -o official_scores.csv
          test "$(git hash-object official_scores.csv)" = 9c926b2bd35ac0fb4f3d0cf8f58c97178d43faef
      - name: Deterministically select real external SHA-disjoint CNFs before new solve timings
        run: |
          set -euo pipefail
          mkdir -p frozen
          python3 -u research/drnas-sat-v7-8/v139_external_freeze.py freeze \
            --v131 prior131/frozen/v13_manifest.json \
            --mini prior-mini/frozen/official_mini_manifest.json \
            --v100 prior-v100/v100_manifest.json \
            --v132 prior-v132/v132_manifest.json \
            --v138 prior-v138/frozen/v138_manifest.json \
            --scores official_scores.csv --out frozen/v139_selector.json
          (cd frozen && sha256sum v139_selector.json > v139_selector.sha256)
          python3 research/drnas-sat-v7-8/v139_external_bench.py freeze \
            --prior frozen/v139_selector.json \
            --fastpath research/drnas-sat-v7-8/v137_fastpath.py \
            --out frozen/v139_manifest.json
          (cd frozen && sha256sum v139_manifest.json > v139_manifest.sha256)
          echo "## New external sample" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m=json.load(open("frozen/v139_selector.json"))
          print("SHA-disjoint new 2026 cases: ",len(m["cases"]))
          print("Strata: ",m["strata"])
          print("Previously used source IDs excluded: ",m["excluded_history_count_ids"])
          print("Previously used SHA hashes excluded: ",m["excluded_history_count_sha"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V139-frozen-new-external-2026-12-CNFs
          path: frozen/
          if-no-files-found: warn

  benchmark:
    needs: freeze-fresh-2026
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5]
    name: v139-real-shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V139-frozen-new-external-2026-12-CNFs
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V132-three-pinned-binaries
          run-id: 41256313918
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: bin
      - name: Verify frozen manifest and pinned binaries
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v139_selector.sha256)
          (cd frozen && sha256sum -c v139_manifest.sha256)
          (cd bin && sha256sum -c binaries.sha256)
          chmod +x bin/v132_drnas bin/v132_kissat
      - name: Run unchanged V13.7 on new external SAT Competition 2026 formulas
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/v139_external_bench.py run \
            --manifest frozen/v139_manifest.json --shard "$SHARD" \
            --fastpath research/drnas-sat-v7-8/v137_fastpath.py \
            --drnas bin/v132_drnas --kissat bin/v132_kissat --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v139-real-shard-${{ matrix.shard }}
          path: results/
          if-no-files-found: warn

  audit:
    needs: [freeze-fresh-2026,benchmark]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V139-frozen-new-external-2026-12-CNFs
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: v139-real-shard-*
          path: combined
          merge-multiple: false
      - name: Audit all 72 attempts without changing the selection strategy
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v139_selector.sha256 && sha256sum -c v139_manifest.sha256)
          python3 -u research/drnas-sat-v7-8/v139_external_bench.py audit \
            --manifest frozen/v139_manifest.json --combined combined \
            --out v139_external_audit.json --md v139_external_audit.md
          cat v139_external_audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V139-NEW-external2026-12-CNF-final-audit
          path: |
            v139_external_audit.json
            v139_external_audit.md
          if-no-files-found: warn
