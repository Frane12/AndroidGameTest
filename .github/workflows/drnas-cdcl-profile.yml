name: DRNAS CDCL PROFILE 40 frozen against Kissat
run-name: CDCL PROFILE 40 frozen CNFs A profile Kissat 40s oneCPU
on:
  push:
    branches: [experiment/drnas-cdcl-profile-20261110]
    paths:
      - research/drnas_native_core_r3c.cpp
      - research/drnas_factor42_native.cpp
      - research/drnas_cdcl_profile_40.py
      - .github/workflows/drnas-cdclprofile-40frozen.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install compiler and verify source manifest
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_cdcl_profile_40.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential
      - name: Restore pinned Kissat binary
        id: cache
        uses: actions/cache@v4
        with:
          path: .reference-solvers/bin/kissat
          key: cdclprofile-ubuntu2404-kissat-8af8e56f174b778aef3aa45af9f739b2a5f492c2-v1
      - name: Build pinned Kissat only on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .reference-solvers/bin
          git clone --quiet https://github.com/arminbiere/kissat.git .reference-solvers/kissat-src
          git -C .reference-solvers/kissat-src checkout --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          (cd .reference-solvers/kissat-src && ./configure && make -j2)
          install -m 755 .reference-solvers/kissat-src/build/kissat .reference-solvers/bin/kissat
      - name: Always compile DRNAS CDCL PROFILE
        run: |
          set -euo pipefail
          mkdir -p mre_cdclprofile/bin
          g++ -std=c++17 -O2 research/drnas_factor42_native.cpp -o mre_cdclprofile/bin/drnas_profile_off
          g++ -std=c++17 -O2 -DDRNAS_PROFILE research/drnas_factor42_native.cpp -o mre_cdclprofile/bin/drnas_profile_on
          install -m 755 .reference-solvers/bin/kissat mre_cdclprofile/bin/kissat
          ldd mre_cdclprofile/bin/kissat | tee mre_cdclprofile/kissat.ldd
          ! grep -q 'not found' mre_cdclprofile/kissat.ldd
      - name: Run eight source-frozen CNFs x A D Kissat at 40 CPU seconds
        env:
          CDCLPROFILE_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          taskset -c "$(taskset -pc $$ | sed 's/.*: //' | cut -d, -f1 | cut -d- -f1)" \
            python3 -u research/drnas_cdcl_profile_40.py | tee mre_cdclprofile/benchmark.log
          grep -q '^CDCLPROFILE_FINAL ' mre_cdclprofile/benchmark.log
          grep '^CDCLPROFILE_FINAL ' mre_cdclprofile/benchmark.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-CDCLPROFILE-SHARD-${{ matrix.shard }}-40S-AUDIT
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_cdclprofile/audit.json
            mre_cdclprofile/sources.json
            mre_cdclprofile/*.cnf
            mre_cdclprofile/*.log
