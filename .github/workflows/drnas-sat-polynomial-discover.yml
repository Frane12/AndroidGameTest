name: DRNAS SAT polynomial multiplication family discovery
on:
  push:
    branches:
      - research/drnas-sat-polynomial-family-validation
    paths:
      - research/drnas-sat-family-test/discover.py
      - .github/workflows/drnas-sat-polynomial-discover.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Identify independent original GBD polynomial multiplication benchmarks
        run: python -u research/drnas-sat-family-test/discover.py
      - name: Upload frozen candidate metadata for pre-registration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRNAS-SAT-polynomial-GBD-discovery
          path: polynomial_discovery/
          if-no-files-found: warn
