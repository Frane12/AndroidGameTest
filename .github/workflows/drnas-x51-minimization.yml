name: DRNAS X5.1 bounded adaptive minimization diagnostic and holdout
on:
  push:
    branches: [experiment/drnas-x51-minimization-20261113]
    paths: [.github/workflows/drnas-x51-minimization.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-x51-minimization
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: drnas-x5-frozen-binaries
          run-id: 43368689724
          github-token: ${{ github.token }}
          path: build
      - name: Compile candidate and validate frozen references
        run: |
          set -euo pipefail
          chmod +x build/*
          sha256sum -c build/reference_sha256.txt
          sha256sum -c experiments/drnas_x5/frozen_sha256.txt
          g++ --version
          g++ -std=c++20 -O3 -DNDEBUG src/drnas_x51.cpp -o build/drnas-x51
          python3 -m py_compile research/drnas_x51_bench.py research/drnas_x51_report.py tests/test_x51.py
      - name: Truth tables witnesses proofs and passive search equivalence
        run: |
          set -euo pipefail
          python3 -u tests/test_x51.py | tee build/test_x51.log
          sha256sum build/drnas-x51 src/drnas_x51.cpp experiments/drnas_x51/protocol.json > build/x51_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: drnas-x51-verified-binaries
          retention-days: 30
          path: build/
  diagnostic:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: drnas-x51-verified-binaries
          path: build
      - name: Measure 45 new diagnostic formulas with one logical CPU per solver
        run: |
          set -euo pipefail
          chmod +x build/*
          sha256sum -c build/x51_sha256.txt
          python3 -u research/drnas_x51_bench.py --out diagnostic_${{ matrix.shard }} \
            --split diagnostic --offset 9900000 --per-family 15 --cap 5 --repeats 3 \
            --shards 3 --shard ${{ matrix.shard }} | tee diagnostic_${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drnas-x51-diagnostic-${{ matrix.shard }}
          retention-days: 30
          path: |
            diagnostic_${{ matrix.shard }}/
            diagnostic_${{ matrix.shard }}.log
  holdout:
    needs: [build, diagnostic]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: drnas-x51-verified-binaries
          path: build
      - name: Evaluate 45 locked holdout formulas without policy changes
        run: |
          set -euo pipefail
          chmod +x build/*
          sha256sum -c build/x51_sha256.txt
          python3 -u research/drnas_x51_bench.py --out holdout_${{ matrix.shard }} \
            --split holdout --offset 10000002 --per-family 15 --cap 5 --repeats 3 \
            --shards 3 --shard ${{ matrix.shard }} | tee holdout_${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drnas-x51-holdout-${{ matrix.shard }}
          retention-days: 30
          path: |
            holdout_${{ matrix.shard }}/
            holdout_${{ matrix.shard }}.log
  report:
    needs: [diagnostic, holdout]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: drnas-x51-diagnostic-*
          path: results
      - uses: actions/download-artifact@v4
        with:
          pattern: drnas-x51-holdout-*
          path: results
      - name: Validate all 1620 paired trials and report telemetry and uncertainty
        run: |
          set -euo pipefail
          python3 research/drnas_x51_report.py --root results --out x51_summary.json | tee x51_summary.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drnas-x51-final
          retention-days: 30
          path: |
            x51_summary.json
            x51_summary.log
