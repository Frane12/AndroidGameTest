name: DRNAS V7.6.1 - XOR Cause Repeats and 48 New Formula Holdout
on:
  push:
    branches: [experiment/drnas-v761-xor-causes-20261101]
    paths:
      - '.github/workflows/drnas-sat-v761-xor-causes.yml'
      - 'research/drnas-sat-v7-8/v761_xor_holdout.py'
      - 'research/drnas-sat-v7-8/v761_xor_experiment.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Selftest frozen XOR generators and benchmark
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/v761_xor_holdout.py research/drnas-sat-v7-8/v761_xor_experiment.py
          python3 research/drnas-sat-v7-8/v761_xor_experiment.py selftest
          test "$(git hash-object research/drnas-sat-v7-6/v76_single.cpp)" = a254356a45b70f02f33b9506f1122dad33916ca7
      - name: Retrieve old SHA-verified V13.4 input set
        uses: actions/download-artifact@v4
        with:
          name: DRNAS-V134-30-case-structural-ladder-audit
          run-id: 41257840485
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: previous
      - name: Lock exact prior case and 48 independently salted cases
        run: |
          set -euo pipefail
          (cd previous/frozen && sha256sum -c v134_manifest.sha256)
          mkdir -p frozen
          python3 -u research/drnas-sat-v7-8/v761_xor_experiment.py freeze \
            --original previous/frozen/v134_manifest.json --out frozen/v761_manifest.json
          (cd frozen && sha256sum v761_manifest.json > v761_manifest.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-V761-49-exact-and-new-CNF-manifest
          path: frozen/
          if-no-files-found: error

  repeat:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V761-49-exact-and-new-CNF-manifest
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V76V134-byte-pinned-three-binaries
          run-id: 41258686315
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: bin
      - name: Verify all binary and formula hashes, repeat old XOR 20x
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v761_manifest.sha256)
          (cd bin && sha256sum -c binaries.sha256)
          chmod +x bin/v76_solver bin/legacy_solver bin/kissat_solver
          python3 -u research/drnas-sat-v7-8/v761_xor_experiment.py repeat \
            --manifest frozen/v761_manifest.json \
            --v76 bin/v76_solver --legacy bin/legacy_solver \
            --kissat bin/kissat_solver --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v761-repeat-20
          path: results/
          if-no-files-found: warn

  holdout:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    name: v761-shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V761-49-exact-and-new-CNF-manifest
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V76V134-byte-pinned-three-binaries
          run-id: 41258686315
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: bin
      - name: Check immutable manifest and pinned executables
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v761_manifest.sha256)
          (cd bin && sha256sum -c binaries.sha256)
          chmod +x bin/v76_solver bin/legacy_solver bin/kissat_solver
      - name: Run matched 30s 3GiB four-mode XOR trials
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/v761_xor_experiment.py holdout \
            --manifest frozen/v761_manifest.json --shard "$SHARD" \
            --v76 bin/v76_solver --legacy bin/legacy_solver \
            --kissat bin/kissat_solver --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v761-shard-${{ matrix.shard }}
          path: results/
          if-no-files-found: warn

  audit:
    needs: [freeze,repeat,holdout]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V761-49-exact-and-new-CNF-manifest
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: v761-repeat-20
          path: repeat
      - uses: actions/download-artifact@v4
        with:
          pattern: v761-shard-*
          path: holdouts
      - name: Strict 20-repeat and 48-new-CNF audit
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v761_manifest.sha256)
          python3 -u research/drnas-sat-v7-8/v761_xor_experiment.py audit \
            --manifest frozen/v761_manifest.json --repeat repeat \
            --holdouts holdouts --out v761_report.json --md v761_report.md
          cat v761_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V761-XOR-20repeat-48holdout-final-audit
          path: |
            frozen/
            repeat/
            holdouts/
            v761_report.json
            v761_report.md
          if-no-files-found: warn
