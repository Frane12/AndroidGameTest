name: DRNAS R136 verified structural feedback read-only audit
on:
  push:
    branches:
      - experiment/drnas-r136-feedback-ledger-20261105
    paths:
      - '.github/workflows/drnas-r136-feedback.yml'
      - 'research/r136_reliable_feedback.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  feedback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen SHA-disjoint 56 original CNFs from successful R135
        uses: actions/download-artifact@v4
        with:
          name: r135-frozen-sha-disjoint-real
          run-id: 42061956160
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r135/frozen
      - name: Download eight completed paired R135 raw shards, no solver execution
        uses: actions/download-artifact@v4
        with:
          pattern: r135-shard-*
          merge-multiple: true
          run-id: 42061956160
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r135
      - name: Recheck pinned SHA and witness and calculate reproducible feedback
        run: |
          set -euo pipefail
          test "$(find r135 -maxdepth 1 -name 'shard-*.json' | wc -l)" -eq 8
          mkdir -p r136
          python3 -u research/r136_reliable_feedback.py | tee r136/feedback.log
          grep -q '^R136_FEEDBACK_AUDIT_PASS ' r136/feedback.log
          test -s r136/formula_feedback.csv
          test -s r136/feedback.json
          cat r136/feedback.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R136-VERIFIED-STRUCTURAL-FEEDBACK
          path: r136/
          retention-days: 90
