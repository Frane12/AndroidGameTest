name: DRNAS C8D — recover 144 bounded CDCL diagnostic audit, artifact-only no rerun
on:
  push:
    branches: [experiment/drnas-c8d-bve-early-cdcl-selector-20261108]
    paths: ['.github/workflows/drnas-c8d-early-audit-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    name: Recover six finished C8D diagnostic SHA artifacts and audit 144 recorded probes
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover exact C7 original SHA6 registry and completed C8D diagnostic trials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42523071479 -R Frane12/AndroidGameTest \
            -n c7-certified-sources-CMS-CaDiCaL-Kissat-pins -D .
          mkdir -p c8d_out
          for shard in 0 1 2 3 4 5; do
            gh run download 42526134599 -R Frane12/AndroidGameTest \
              -n "c8d-early-C7-shard-$shard" -D .
            if test -f "diag-$shard.json"; then
              mv "diag-$shard.json" c8d_out/
            fi
            if test -f "c8d_out/c8d_out/diag-$shard.json"; then
              mv "c8d_out/c8d_out/diag-$shard.json" c8d_out/
            fi
            test -s "c8d_out/diag-$shard.json"
          done
          (cd mre11_easy && sha256sum -c source.sha256)
          (cd mre11b_blind && sha256sum -c source.sha256)
          python3 -m py_compile research/c8d_bve_early_cdcl_selector.py
      - name: Audit complete source-paired real CaDiCaL BVE plus bounded CMS early traces
        run: |
          set -euo pipefail
          python3 -u research/c8d_bve_early_cdcl_selector.py audit_diagnostic | tee c8d_out/diagnostic-audit.log
          grep -q '^C8D_DIAGNOSTIC_FINAL' c8d_out/diagnostic-audit.log
          grep '^C8D_DIAGNOSTIC_FINAL' c8d_out/diagnostic-audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-C8D-144-C7-CMS-CADICAL-BVE-CDCL-AUDIT-RECOVERED
          if-no-files-found: error
          retention-days: 30
          path: |
            c8d_out/diagnostic-report.json
            c8d_out/diagnostic-audit.log
            c8d_out/diag-*.json
