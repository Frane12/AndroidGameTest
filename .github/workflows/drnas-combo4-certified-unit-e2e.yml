name: DRNAS COMBO4 - independently certified GF2 implied units vs clean CMS
run-name: COMBO4 24 original SHA x 5 arms x 2 reps 8s 240 oneCPU E2E proof-carrying GF2 unit A/B
on:
  push:
    branches: [experiment/drnas-combo4-certified-unit-prepass-20261110]
    paths:
      - .github/workflows/drnas-combo4-certified-unit-e2e.yml
      - research/drnas_combo4_certified_unit_e2e.py
      - research/drnas_combo4_certified_units.cpp
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-combo4-${{ github.ref }}
  cancel-in-progress: false
jobs:
  freeze:
    name: Restore original 24 SHA and 2 external XLRUP certifications, compile C++ and prove GF2 unit toys
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Download and separate immutable original-CNF cohorts, pinned CMS Kissat and original-XLRUP certified report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42759838384 -R Frane12/AndroidGameTest -n equiv13-12-source-only-original-SHA-frozen-six-solvers -D .
          mkdir -p artifact_search5 artifact_search6 artifact_cert
          gh run download 42787100363 -R Frane12/AndroidGameTest -n SEARCH5-12-NEW-SAT24-25-SHA-SOURCEONLY-FROZEN-BINARIES -D artifact_search5
          gh run download 42789740518 -R Frane12/AndroidGameTest -n SEARCH6-12SHA-4STRATA-SOURCEONLY-NATIVE-FROZEN -D artifact_search6
          gh run download 42796021996 -R Frane12/AndroidGameTest -n DRNAS-COMBO2-2ORIGINAL-SHA-INDEPENDENT-XLRUP-CAKEML-STRICT-AUDIT -D artifact_cert
          test -s artifact_search5/mre_search5/manifest.json
          test -s artifact_search6/mre_search6/manifest.json
          mv artifact_search5/mre_search5 ./mre_search5
          mv artifact_search6/mre_search6 ./mre_search6
          mkdir -p prior_combo2proof
          CERT="$(find artifact_cert -type f -name report.json | head -n1)"
          test -n "$CERT"
          test "$(find artifact_cert -type f -name report.json | wc -l)" -eq 1
          cp "$CERT" prior_combo2proof/report.json
          test -s mre_equiv12/bin/cryptominisat5
          test -s mre_equiv12/lib/libcryptominisat5.so.5.17
          test -s built/bin/kissat_4_0_4
          test -s mre5/lib/libcryptominisat5.so.5.11
          chmod +x mre_equiv12/bin/cryptominisat5 built/bin/kissat_4_0_4
          export LD_LIBRARY_PATH="$PWD/mre_equiv12/lib:$PWD/mre5/lib"
          ldd mre_equiv12/bin/cryptominisat5 | tee combo4-cms-ldd.txt
          ! grep -q 'not found' combo4-cms-ldd.txt
      - name: Compile exact native GF2 RREF proof-carrying unit bridge; independent positive and negative proofs
        run: |
          set -euo pipefail
          mkdir -p mre_combo4/bin
          g++ -std=c++17 -O2 -Wall -Wextra -Werror research/drnas_combo4_certified_units.cpp -o mre_combo4/bin/combo4_units
          chmod +x mre_combo4/bin/combo4_units
          python3 -m py_compile research/drnas_combo4_certified_unit_e2e.py
          export LD_LIBRARY_PATH="$PWD/mre_equiv12/lib:$PWD/mre5/lib"
          python3 -u research/drnas_combo4_certified_unit_e2e.py selftest | tee mre_combo4/selftest.log
          grep -q '^COMBO4_SELFTEST_PASS ' mre_combo4/selftest.log
          python3 -u research/drnas_combo4_certified_unit_e2e.py freeze | tee mre_combo4/freeze.log
          grep -q '^COMBO4_FROZEN ' mre_combo4/freeze.log
          python3 -u research/drnas_combo4_certified_unit_e2e.py verify
      - uses: actions/upload-artifact@v4
        with:
          name: combo4-24-original-SHA-independent-CMS-XLRUP-certified-binaries
          retention-days: 21
          if-no-files-found: error
          path: |
            mre_combo4/manifest.json
            mre_combo4/selftest.log
            mre_combo4/bin/combo4_units
            mre_search5/manifest.json
            mre_search5/cases/*.cnf
            mre_search6/manifest.json
            mre_search6/cases/*.cnf
            prior_combo2proof/report.json
            mre_equiv9/manifest.json
            mre_equiv9/cases/*.cnf
            mre_equiv10medium/manifest.json
            mre_equiv10m5/manifest.json
            mre_equiv12/manifest.json
            mre_equiv12/bin/cryptominisat5
            mre_equiv12/lib/libcryptominisat5.so*
            mre_equiv7/manifest.json
            mre_x20/manifest.json
            prior_x22/mre_x22/manifest.json
            prior_equiv6/mre_equiv6/manifest.json
            built/bin/kissat_4_0_4
            mre5/lib/libcryptominisat5.so.5.11
  shard:
    name: Source SHA matched oneCPU original CMS placebo GF2 verified unit injection shard ${{ matrix.shard }}
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: combo4-24-original-SHA-independent-CMS-XLRUP-certified-binaries
          path: .
      - name: Matched full E2E original-SHA oneCPU solver and proof-carrying GF2 plus placebo
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre_equiv12/lib:$PWD/mre5/lib"
          chmod +x mre_combo4/bin/combo4_units mre_equiv12/bin/cryptominisat5 built/bin/kissat_4_0_4
          ldd mre_equiv12/bin/cryptominisat5 | tee mre_combo4/cms-ldd-$SHARD.log
          ! grep -q 'not found' mre_combo4/cms-ldd-$SHARD.log
          python3 -u research/drnas_combo4_certified_unit_e2e.py verify | tee mre_combo4/verify-$SHARD.log
          grep -q '^COMBO4_VERIFY_PASS' mre_combo4/verify-$SHARD.log
          python3 -u research/drnas_combo4_certified_unit_e2e.py shard --shard "$SHARD" | tee "mre_combo4/shard-$SHARD.log"
          grep -q "^COMBO4_SHARD_PASS $SHARD 40$" "mre_combo4/shard-$SHARD.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combo4-shard-${{ matrix.shard }}
          retention-days: 21
          if-no-files-found: warn
          path: |
            mre_combo4/shard-${{ matrix.shard }}.json
            mre_combo4/shard-${{ matrix.shard }}.log
  audit:
    name: Audit 240 original CNF E2E matched outcomes, separately labelled independent proof and PAR2
    needs: [freeze,shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: combo4-24-original-SHA-independent-CMS-XLRUP-certified-binaries
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: combo4-shard-*
          merge-multiple: true
          path: mre_combo4
      - name: Immutable source 240 paired trials independent GF2 certificate original SHA PAR2 audit
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre_equiv12/lib:$PWD/mre5/lib"
          chmod +x mre_combo4/bin/combo4_units mre_equiv12/bin/cryptominisat5 built/bin/kissat_4_0_4
          python3 -u research/drnas_combo4_certified_unit_e2e.py verify
          for i in 0 1 2 3 4 5; do test -s "mre_combo4/shard-$i.json"; done
          python3 -u research/drnas_combo4_certified_unit_e2e.py audit | tee mre_combo4/audit.log
          grep -q '^COMBO4_FINAL ' mre_combo4/audit.log
          grep '^COMBO4_FINAL ' mre_combo4/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-COMBO4-24SHA-240-ONECPU-GF2-PROOF-CARRYING-UNITS-PAR2-FINAL
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_combo4/manifest.json
            mre_combo4/report.json
            mre_combo4/audit.log
            mre_combo4/shard-*.json
