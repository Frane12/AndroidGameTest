name: Frozen DRNAS XOR4 transfer outside grids vs Kissat and CryptoMiniSat
on:
  push:
    branches: [experiment/drnas-xor4-transfer-cms-20261101]
    paths: ['.github/workflows/drnas-xor4-transfer.yml','research/tseitin-replay/transfer_bench.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V131-exact256-132-retrospective-audit
          run-id: 41255417615
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior131
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-UnOfficial-SATComp2026-Mini-216-Matched
          run-id: 41248293940
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-mini
      - uses: actions/download-artifact@v4
        with:
          name: v100-frozen-protocol-and-inputs
          run-id: 41245906965
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v100
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V132-frozen-24-new-inputs
          run-id: 41256313918
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v132
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V138-external2026-18-CNF-final-audit
          run-id: 41260140613
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v138
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V139-new-SC2024-12-frozen-verified-CNFs
          run-id: 41261415700
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v139
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V1313-30-fresh-SC2024-SHA-frozen
          run-id: 41263304031
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v1313
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V1316-blind30-new-SC2024-SHA-locked
          run-id: 41264586616
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v1316
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V143-30-NEW-SC2024-precommitted-SHA-manifest
          run-id: 41265926817
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v143
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V144-30-NEW-SC2024-precommitted-SHA-manifest
          run-id: 41266904911
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v144
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 41267740944
          github-token: ${{ github.token }}
          name: DRNAS-V145-30-NEW-SC2024-precommitted-SHA-manifest
          path: prior-v145
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 41270241699
          github-token: ${{ github.token }}
          name: DRNAS-V146-30-NEW-SC2024-precommitted-SHA-manifest
          path: prior-v146
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 41270356984
          github-token: ${{ github.token }}
          name: four-official-tseitin-replication
          path: prior-grid
      - run: python3 research/tseitin-replay/transfer_bench.py freeze
      - uses: actions/upload-artifact@v4
        with:
          name: transfer-frozen
          path: frozen/
          retention-days: 14
  measure:
    needs: freeze
    strategy:
      fail-fast: false
      matrix:
        slot: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: transfer-frozen
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 41270937896
          github-token: ${{ github.token }}
          name: DRNAS-v142-xor4-native-grid-results
          path: new
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 41267740944
          github-token: ${{ github.token }}
          name: DRNAS-V145-Native-Propagated-Parity-and-pinned-solvers
          path: bin
      - name: Install single-threaded reference and verify frozen executables
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y cryptominisat
          cp new/bin/v142_xor4 bin/v142_xor4
          (cd bin && sha256sum -c binaries.sha256)
          echo 'fc357c15fdec6f3a7ced8acf84f7d07e625ec88398892cdcea2cfda927e3184b  bin/v142_xor4' | sha256sum -c -
          chmod +x bin/{v142_xor4,v142_fastgate,kissat_solver}
      - run: python3 research/tseitin-replay/transfer_bench.py run ${{ matrix.slot }}
      - uses: actions/upload-artifact@v4
        with:
          name: transfer-case-${{ matrix.slot }}
          path: out/
  audit:
    needs: measure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: transfer-frozen
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: transfer-case-*
          path: all
      - run: python3 research/tseitin-replay/transfer_bench.py aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-XOR4-transfer-final-measurements
          path: |
            transfer-audit.json
            all/**/**certificate.json
