name: DRNAS R27b check XOR residual bridge motif invariants
on:
  push:
    branches: [experiment/drnas-r27-xor-residual-links-20261103]
    paths: ['.github/workflows/drnas-r27b-bridge-motifs.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  check_bridge_law:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: R26-frozen-53-inputs
          run-id: 41606832040
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: input
      - name: Authenticate original GBD and test regularity on ALL ten polynomials
        run: |
          set -euo pipefail
          (cd input && sha256sum -c r26_all_53.sha256)
          python3 -m py_compile experiments/drnas_v16/r27_bridge_motifs.py
          python3 -u experiments/drnas_v16/r27_bridge_motifs.py --inputs input --out r27b-degree-motif.json | tee r27b-motifs.log
          echo "## R27b XOR/residual bridge motif audit" >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 r27b-motifs.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R27b-ORIGINAL-POLYNOMIAL-BRIDGE-DEGREE-LAW
          path: |
            r27b-degree-motif.json
            r27b-motifs.log
          if-no-files-found: warn
