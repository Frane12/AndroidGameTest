name: DRNAS V15.2 gated Hall plus V15.1 prospective official SC2026 and new Hall controls
on:
  push:
    branches: [experiment/drnas-v152-hall-portfolio-holdout-20261101]
    paths:
      - '.github/workflows/drnas-v152-hall-official-holdout.yml'
      - 'research/drnas-sat-v7-8/v151_expanded.cpp'
      - 'research/drnas-sat-v7-8/v152_hall_portfolio.cpp'
      - 'research/tseitin-replay/v152_prospective_benchmark.py'
      - 'research/tseitin-replay/v152_hall_cases.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 41239481557
          github-token: ${{ github.token }}
          name: v96-frozen-causal-input-manifest
          path: prior96
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 41274374244
          github-token: ${{ github.token }}
          name: v148-sc2026-preregistered-6-inputs
          path: prior148
      - name: Check original frozen manifests and lock sixteen NEW official 2026 CNFs by SHA
        run: |
          set -euo pipefail
          python3 -m py_compile research/tseitin-replay/v152_prospective_benchmark.py research/tseitin-replay/v152_hall_cases.py
          (cd prior96 && sha256sum -c v96_manifest.sha256)
          (cd prior148 && sha256sum -c v148-frozen-manifest.sha256)
          python3 -u research/tseitin-replay/v152_prospective_benchmark.py freeze \
            --old96 prior96/v96_manifest.json \
            --old148 prior148/v148-frozen-manifest.json \
            --out v152-frozen.json
          sha256sum v152-frozen.json > v152-frozen.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: v152-2026-preregistered-16-new-inputs
          path: |
            v152-frozen.json
            v152-frozen.sha256
          if-no-files-found: error
  measure:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        slot: [0,1,2,3]
    name: v152-shard-${{ matrix.slot }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: v152-2026-preregistered-16-new-inputs
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 41267740944
          github-token: ${{ github.token }}
          name: DRNAS-V145-Native-Propagated-Parity-and-pinned-solvers
          path: bin
      - name: Build V15.2 and unchanged V15.1 in same compiler mode, pinned Kissat and SHA checks
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v152-frozen.sha256)
          (cd bin && sha256sum -c binaries.sha256)
          echo 'a93d6577d9a8d8f41bde71bd94200ab0cdacd7ac9cd22ab3eb4fd55713c32d7a  bin/kissat_solver' | sha256sum -c -
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -pedantic research/drnas-sat-v7-8/v151_expanded.cpp -o bin/v151_expanded
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -pedantic research/drnas-sat-v7-8/v152_hall_portfolio.cpp -o bin/v152_hall_portfolio
          chmod +x bin/v151_expanded bin/v152_hall_portfolio bin/kissat_solver
          sha256sum bin/v151_expanded bin/v152_hall_portfolio bin/kissat_solver
      - name: Original SC2026 holdout plus fresh Hall SAT/UNSAT controls (3 solvers 2 repeats)
        run: |
          set -euo pipefail
          python3 -u research/tseitin-replay/v152_prospective_benchmark.py measure \
            --slot ${{ matrix.slot }} --manifest frozen/v152-frozen.json --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v152-shard-${{ matrix.slot }}
          path: |
            results/meta.json
            results/rows.json
          if-no-files-found: warn
  audit:
    needs: [freeze,measure]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: v152-2026-preregistered-16-new-inputs
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: v152-shard-*
          path: all
      - name: Strict 144-trial proof and PAR2 comparison audit
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v152-frozen.sha256)
          python3 -u research/tseitin-replay/v152_prospective_benchmark.py audit \
            --manifest frozen/v152-frozen.json --all all --out v152-final.json
          cat v152-final.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V152-Hall-Portfolio-16-Official2026-8-NewHall-Final
          path: |
            v152-final.json
            frozen/
            all/
          if-no-files-found: warn
