name: DRNAS V13.9 - NEW 2024 Official SAT Main CNFs, Locked V13.7
on:
  push:
    branches: [experiment/drnas-v139-external-blind-structure-20261101]
    paths:
      - '.github/workflows/drnas-sat-v139-real2024.yml'
      - 'research/drnas-sat-v7-8/v139_2024_freeze.py'
      - 'research/drnas-sat-v7-8/v139_2024_bench.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V131-exact256-132-retrospective-audit
          run-id: 41255417615
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior131
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-UnOfficial-SATComp2026-Mini-216-Matched
          run-id: 41248293940
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-mini
      - uses: actions/download-artifact@v4
        with:
          name: v100-frozen-protocol-and-inputs
          run-id: 41245906965
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v100
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V132-frozen-24-new-inputs
          run-id: 41256313918
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v132
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V138-external2026-18-CNF-final-audit
          run-id: 41260140613
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v138
      - name: Verify source signatures and code selftests
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/v139_2024_freeze.py research/drnas-sat-v7-8/v139_2024_bench.py
          python3 research/drnas-sat-v7-8/v139_2024_bench.py selftest
          (cd prior131/frozen && sha256sum -c v13_manifest.sha256)
          (cd prior-mini/frozen && sha256sum -c official_mini_manifest.sha256)
          (cd prior-v100 && sha256sum -c v100_manifest.sha256)
          (cd prior-v132 && sha256sum -c v132_manifest.sha256)
      - name: Freeze twelve never-before-used official 2024 CNFs and V13.7 code SHA
        run: |
          set -euo pipefail
          mkdir -p frozen
          python3 -u research/drnas-sat-v7-8/v139_2024_freeze.py \
            --v131 prior131/frozen/v13_manifest.json \
            --mini prior-mini/frozen/official_mini_manifest.json \
            --v100 prior-v100/v100_manifest.json \
            --v132 prior-v132/v132_manifest.json \
            --v138 prior-v138/frozen/v138_manifest.json \
            --out frozen/v139_selector.json
          (cd frozen && sha256sum v139_selector.json > v139_selector.sha256)
          python3 research/drnas-sat-v7-8/v139_2024_bench.py freeze \
            --prior frozen/v139_selector.json \
            --fastpath research/drnas-sat-v7-8/v137_fastpath.py \
            --out frozen/v139_manifest.json
          (cd frozen && sha256sum v139_manifest.json > v139_manifest.sha256)
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m=json.load(open("frozen/v139_selector.json"))
          print("## New real 2024 CNFs")
          print("Cases: 12. Official labels: six SAT, six UNSAT")
          print("Official instance families: ",m["families"])
          print("Prior SHA-256 hashes excluded: ",m["unseen_excluded_shas"])
          print("V13.7 source hash frozen before solver runs")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V139-new-SC2024-12-frozen-verified-CNFs
          path: frozen/
          if-no-files-found: warn
  benchmark:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5]
    name: v139-real-shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V139-new-SC2024-12-frozen-verified-CNFs
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V132-three-pinned-binaries
          run-id: 41256313918
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: bin
      - name: Verify exact source and binary hashes
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v139_selector.sha256 && sha256sum -c v139_manifest.sha256)
          (cd bin && sha256sum -c binaries.sha256)
          chmod +x bin/v132_drnas bin/v132_kissat
      - name: Run real SHA-verified 2024 CNFs with frozen V13.7 and two baselines
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/v139_2024_bench.py run \
            --manifest frozen/v139_manifest.json --shard "$SHARD" \
            --fastpath research/drnas-sat-v7-8/v137_fastpath.py \
            --drnas bin/v132_drnas --kissat bin/v132_kissat --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v139-real-shard-${{ matrix.shard }}
          path: results/
          if-no-files-found: warn
  audit:
    needs: [freeze,benchmark]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V139-new-SC2024-12-frozen-verified-CNFs
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: v139-real-shard-*
          path: combined
          merge-multiple: false
      - name: Validate all 72 trials, SHA provenance and official labels
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v139_selector.sha256 && sha256sum -c v139_manifest.sha256)
          python3 -u research/drnas-sat-v7-8/v139_2024_bench.py audit \
            --manifest frozen/v139_manifest.json --combined combined \
            --out v139_real2024_audit.json --md v139_real2024_audit.md
          cat v139_real2024_audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V139-2024-NEW-real-CNF-final-audit
          path: |
            v139_real2024_audit.json
            v139_real2024_audit.md
          if-no-files-found: warn
