name: DRNAS R54 70-20-10 structural research diagnostic
on:
  push:
    branches: [experiment/drnas-r54-structural-70-20-10-20261103]
    paths:
      - '.github/workflows/drnas-r54-702010-research.yml'
      - 'experiments/drnas_v16/r54_702010_research.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    name: Frozen R53 450-trial causal audit and soundness fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Selftest, syntax and proof-preserving R49 fallback
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/r54_702010_research.py
          python3 -u experiments/drnas_v16/r54_702010_research.py selftest
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-R53-50-UNSEEN-TRIPLE-PAR2-FINAL
          run-id: 41687012202
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r53
      - name: Verify R53 valid 50x3 paired measurements and partition gate activation
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r54_702010_research.py analyze \
            --r53 r53/r53-final.json --out r54-diagnostic.json
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-R54-702010-R53-CAUSAL-DIAGNOSTIC
          path: r54-diagnostic.json
          if-no-files-found: error
