name: DRNAS R133b live GF2 CNF differential correctness
on:
  push:
    branches:
      - experiment/drnas-r133b-live-gf2-cdcl-20261105
  workflow_dispatch:
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Differential 500 seeded CNF XOR problems vs brute force and CNF baseline
        run: |
          set -euo pipefail
          python3 -u research/r133b_live_bridge_differential.py | tee r133b-differential.log
          grep -q R133B_DIFFERENTIAL_PASS r133b-differential.log
      - uses: actions/upload-artifact@v4
        with:
          name: r133b-differential-correctness
          path: r133b-differential.log
