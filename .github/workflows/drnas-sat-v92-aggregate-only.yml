name: DRNAS SAT v9.2 — Audit Existing 540 Structural Results
on:
  push:
    branches:
      - experiment/drnas-sat-v92-aggregate-fix-20261031
    paths:
      - '.github/workflows/drnas-sat-v92-aggregate-only.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: v92-shard-*
          run-id: 41230152743
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: saved-v92
      - name: Strictly validate all saved shards and summarize, no solver reruns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p combined-v92
          for shard in 0 1 2 3 4; do
            test -f "saved-v92/v92-shard-$shard/manifest.json"
            test -f "saved-v92/v92-shard-$shard/raw.csv"
            mv "saved-v92/v92-shard-$shard" "combined-v92/shard-$shard"
          done
          python3 -m py_compile research/drnas-sat-v7-8/summarize_v92.py
          python3 -u research/drnas-sat-v7-8/summarize_v92.py combined-v92
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-v92-30-CNF-540-ALL-RESULTS-VALIDATED
          path: combined-v92/
          if-no-files-found: warn
