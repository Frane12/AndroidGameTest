name: DRNAS R35 official CNF XOR boundary audit
on:
  push:
    branches: [experiment/drnas-r35-cnf-xor-boundary-20261103]
    paths:
      - '.github/workflows/drnas-r35-cnf-xor-boundary.yml'
      - 'experiments/drnas_v16/r35_cnf_xor_boundary.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile experiments/drnas_v16/r35_cnf_xor_boundary.py
      - uses: actions/download-artifact@v4
        with:
          name: r32-official-verified14-and-diagnostics
          run-id: 41623227197
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: official
      - name: Verify 14 source SHA and scan CNF beyond XOR blocks
        run: |
          set -euo pipefail
          (cd official && sha256sum -c originals.sha256)
          python3 -u experiments/drnas_v16/r35_cnf_xor_boundary.py --inputs official --out r35-results.json | tee r35-live.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R35-CNF-XOR-BOUNDARY-14-OFFICIAL
          path: |
            r35-results.json
            r35-live.log
          if-no-files-found: warn
          retention-days: 90
