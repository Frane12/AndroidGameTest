name: SCALE21 energy standard proof
on:
  push:
    branches: ['experiment/drnas-scale21-energy-proof-20261124']
    paths: ['.github/workflows/scale21-energy.yml']
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install official checker and competitors
        run: |
          cargo install veripb --version 3.0.2 --locked --root "$RUNNER_TEMP/veripb" --quiet
          python -m pip install --quiet ortools==9.14.6206 python-sat
      - name: Build and test
        run: |
          g++ -O3 -std=c++17 research/scale21/emit21.cpp -o /tmp/emit21
          mkdir -p out
          python research/scale21/ci21.py "$RUNNER_TEMP/veripb/bin/veripb"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scale21-standard-energy
          path: out/
