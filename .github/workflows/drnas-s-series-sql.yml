name: DRNAS S-series reusable SQL ledger
on:
  workflow_call:
    inputs:
      series:
        required: true
        type: string
      source_artifact:
        required: true
        type: string
      source_json_path:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact }}
          path: source-data
      - name: Locate last successful SQL ledger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p previous
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ["GITHUB_REPOSITORY"];current=os.environ["GITHUB_RUN_ID"]
          token=os.environ["GH_TOKEN"]
          def get(path):
           req=urllib.request.Request("https://api.github.com/repos/"+repo+"/"+path,
             headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","User-Agent":"DRNAS-S-ledger"})
           with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          arts=get("actions/artifacts?name=DRNAS-S-SQL-LEDGER&per_page=100")["artifacts"]
          for a in sorted(arts,key=lambda x:x["created_at"],reverse=True):
           rid=str(a["workflow_run"]["id"])
           if rid==current or a["expired"]:continue
           if get("actions/runs/"+rid)["conclusion"]!="success":continue
           open("previous/run_id.txt","w").write(rid)
           print("DRNAS_PRIOR_SQL_RUN",rid,flush=True)
           break
          else:print("DRNAS_PRIOR_SQL_RUN none",flush=True)
          PY
          if test -s previous/run_id.txt; then
            gh run download "$(cat previous/run_id.txt)" --repo "$GITHUB_REPOSITORY" --name DRNAS-S-SQL-LEDGER --dir previous
            test -s previous/DRNAS_S_LEDGER.sqlite
          fi
      - name: Append and verify SQL
        env:
          SERIES: ${{ inputs.series }}
          JSON_PATH: ${{ inputs.source_json_path }}
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_s_series_sql.py
          test -s "source-data/$JSON_PATH"
          if test -s previous/DRNAS_S_LEDGER.sqlite; then
            python3 research/drnas_s_series_sql.py --series "$SERIES" --run-id "$GITHUB_RUN_ID" --input "source-data/$JSON_PATH" --output DRNAS_S_LEDGER.sqlite --prior previous/DRNAS_S_LEDGER.sqlite --prior-run-id "$(cat previous/run_id.txt)" | tee ledger.log
          else
            python3 research/drnas_s_series_sql.py --series "$SERIES" --run-id "$GITHUB_RUN_ID" --input "source-data/$JSON_PATH" --output DRNAS_S_LEDGER.sqlite | tee ledger.log
          fi
          grep '^DRNAS_SQL_LEDGER ' ledger.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-S-SQL-LEDGER
          retention-days: 90
          path: |
            DRNAS_S_LEDGER.sqlite
            ledger.log
