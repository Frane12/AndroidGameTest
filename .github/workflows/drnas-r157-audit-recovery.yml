name: DRNAS R157 qualified audit-only recovery after native binary SHA heterogeneity
on:
  push:
    branches: [experiment/drnas-r157-per-shard-audit-recovery-20261106]
    paths: ['.github/workflows/drnas-r157-audit-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-only:
    name: Source-certified 40 paired trials and explicit four-runner native-SHA pin disclosure
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r155-original25-pinned-native-and-independent-smoke
          run-id: 42112755104
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r157
      - uses: actions/download-artifact@v4
        with:
          pattern: r157-live-gf2-shard-*
          merge-multiple: true
          run-id: 42120573934
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r157
      - name: Independently reconstruct source CNF, complete parity rows, unit substitutions and all 40 pairs
        run: |
          set -euo pipefail
          test "$(find r157 -maxdepth 1 -name 'shard-*.json' | wc -l)" -eq 4
          python3 -u research/r157_qualified_audit_recovery.py | tee r157/qualified-audit.log
          grep -q '^R157_QUALIFIED_AUDIT_PASS ' r157/qualified-audit.log
          cat r157/qualified-report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R157-QUALIFIED-REPLAYED-ORIGINAL-SOURCE-PER-SHARD-REPORT
          path: |
            r157/qualified-report.json
            r157/qualified-audit.log
          if-no-files-found: warn
          retention-days: 90
