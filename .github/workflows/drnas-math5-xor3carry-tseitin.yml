name: DRNAS MATH5 XOR3-carry VeriPB certified original SAT2025 Tseitin
on:
  push:
    branches: [experiment/drnas-xor3carry-veripb-tseitin-20261117]
    paths:
      - research/math5/emit_veripb_xor3_carry.py
      - research/math5/xor3_carry_selftest.py
      - research/math5/xor3_tseitin_id6.py
      - research/MATH5_XOR3_CARRY_VERIPB_RESULTS.md
      - .github/workflows/drnas-math5-xor3carry-tseitin.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-math5-xor3carry-tseitin-20261117
  cancel-in-progress: true
jobs:
  standard_proof_original:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 43913499707
          name: graph-disjoint25-original-sources-and-reference-binaries
          github-token: ${{ github.token }}
          path: prior
      - name: Restore frozen source, old X59/CMS/CaDiCaL/Kissat and VeriPB 3.0.2
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcryptominisat5-5.11t64 libboost-program-options1.83.0
          test -s prior/graph-disjoint25-all-original-sources-frozen.tgz
          sha256sum prior/graph-disjoint25-all-original-sources-frozen.tgz
          tar -xzf prior/graph-disjoint25-all-original-sources-frozen.tgz
          chmod +x build/drnas-sat-native-x59 build/drnas-x59-xor-math5-unified1 \
            build/drnas-unified-core1 build/drnas-pcmax-base \
            build/drnas-pcmax-mg7-ipg1-bdd3 \
            build/kissat build/cadical build/cms build/drat-trim build/frat-rs \
            veripb-tool/bin/veripb
          veripb-tool/bin/veripb --version
          python3 - <<'PY'
          import json,hashlib,pathlib,sys
          sys.path.insert(0,"research/unified_evidence")
          import benchmark as frozen
          frozen.pinned()
          p=pathlib.Path("research/graph_family_disjoint25/inputs/manifest.json")
          m=json.loads(p.read_text())
          assert m["status"]=="FROZEN_SOURCE_ONLY_NO_SOLVER_RUN"
          assert len(m["sources"])==10
          src=next(s for s in m["sources"] if s["id"]==6)
          assert src["family"]=="tseitin-formulas"
          assert src["sha256"]=="9e4c57b9739f39a924d03267f05542831dc87fec9e9e2238f5e4ba11886378f4"
          assert frozen.sha(pathlib.Path(src["path"]))==src["sha256"]
          print("MATH5_XOR3_CARRY_FROZEN_SHA_SOURCE_PASS",flush=True)
          PY
      - name: Syntax and adversarial negative controls (24 UNSAT + 72 SAT/SHA rejections)
        run: |
          set -euo pipefail
          python3 -m py_compile \
            research/math5/emit_veripb_xor3_carry.py \
            research/math5/xor3_carry_selftest.py \
            research/math5/xor3_tseitin_id6.py
          python3 -u research/math5/xor3_carry_selftest.py | tee xor3_carry_safety.log
          grep -q '^MATH5_XOR3_VERIPB_SAFETY_PASS ' xor3_carry_safety.log
      - name: Two repetitions original frozen SAT2025 Tseitin, five serial 8s proof-inclusive solver arms
        run: |
          set -euo pipefail
          python3 -u research/math5/xor3_tseitin_id6.py | tee xor3_carry_original6.log
          grep -q '^MATH5_XOR3_TSEITIN_FINAL ' xor3_carry_original6.log
      - name: Report strict proof-verified E2E PAR2 and preserve critical evidence
        if: always()
        run: |
          if test -s results/tseitin_xor3carry_standard/final.json; then
            python3 - <<'PY'
          import json,os,pathlib
          data=json.loads(pathlib.Path("results/tseitin_xor3carry_standard/final.json").read_text())
          lines=["# DRNAS original SAT2025 Tseitin XOR3-carry external VeriPB"]
          lines.append(f"Status: {data['status']} (critical={data['critical_count']})")
          lines.append(f"Source SHA: {data['source_sha256']}")
          lines.append("Arm | accepted | strict PAR2 (s)")
          lines.append("--- | ---: | ---:")
          for arm,metrics in sorted(data["totals"].items()):
              lines.append(f"{arm} | {metrics['strict_verified']}/2 | {metrics['strict_PAR2_s']}")
          lines.append("Retrospective source, not a new blind holdout. No promotion to main.")
          msg="\n\n".join(lines)+"\n"
          print(msg)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write(msg)
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: math5-xor3carry-original-tseitin6-veripb-strict-e2e
          retention-days: 60
          path: |
            xor3_carry_safety.log
            xor3_carry_original6.log
            results/tseitin_xor3carry_standard/
