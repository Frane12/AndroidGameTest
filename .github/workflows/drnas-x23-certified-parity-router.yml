name: DRNAS X23 proof-first certified parity vs Kissat shadow native 48 paired E2E
on:
  push:
    branches: [experiment/drnas-x23-certified-parity-router-20261109]
    paths:
      - 'research/drnas_x23_certified_parity_router.py'
      - '.github/workflows/drnas-x23-certified-parity-router.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-x23-certified-parity-router-20261109
  cancel-in-progress: false
jobs:
  freeze:
    name: Two independent GF2 parity proof selftests and restore six original SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: x21-frozen-sources-binaries
          run-id: 42586193407
          github-token: ${{ github.token }}
          path: .
      - name: Verify exact source SHA and certificate algebra
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
          export PYTHONPATH="$PWD/research" LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_x21/bin/selective mre_x4/bin/native built/bin/kissat_4_0_4
          python3 -m py_compile research/drnas_x23_certified_parity_router.py
          python3 -u research/drnas_x23_certified_parity_router.py selftest
          python3 - <<'PY'
          import drnas_x23_certified_parity_router as x
          for c in x.cases():
              p=x.x22.x21.ROOT/c["filename"]
              assert x.x22.sha(p)==c["sha256"]
              print("X23_FROZEN_ORIGINAL",c["gbd"],c["sha256"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: x23-known-six-SHA-and-frozen-solvers
          retention-days: 21
          if-no-files-found: error
          path: |
            mre_x21/
            mre_x4/bin/native
            mre5/lib/libcryptominisat5.so.5.11
            built/bin/kissat_4_0_4
  paired:
    name: X23 eight SHA paired 18s one-vCPU E2E attempts shard ${{ matrix.shard }}
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: x23-known-six-SHA-and-frozen-solvers
          path: .
      - name: Original SAT models, source GF2 proof replay, placebo CPU PAR2
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
          export PYTHONPATH="$PWD/research" LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_x21/bin/selective mre_x4/bin/native built/bin/kissat_4_0_4
          mkdir -p mre_x23
          python3 -u research/drnas_x23_certified_parity_router.py shard --shard ${{ matrix.shard }} | tee mre_x23/shard-${{ matrix.shard }}.log
          grep -q '^X23_SHARD_PASS ${{ matrix.shard }} 8$' mre_x23/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x23-result-${{ matrix.shard }}
          retention-days: 21
          path: |
            mre_x23/shard-${{ matrix.shard }}.json
            mre_x23/shard-${{ matrix.shard }}.log
  audit:
    name: Final original SHA source GF2 contradiction witness wall and CPU PAR2
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: x23-known-six-SHA-and-frozen-solvers
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: x23-result-*
          path: mre_x23
          merge-multiple: true
      - name: Verify every model and replay source GF2 UNSAT proof independently
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
          export PYTHONPATH="$PWD/research" LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_x21/bin/selective mre_x4/bin/native built/bin/kissat_4_0_4
          mkdir -p mre_x23
          python3 -u research/drnas_x23_certified_parity_router.py audit | tee mre_x23/audit.log
          grep -q '^X23_FINAL ' mre_x23/audit.log
          grep '^X23_FINAL ' mre_x23/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-X23-SOURCE-CERTIFIED-48-E2E-FINAL
          retention-days: 30
          path: |
            mre_x23/report.json
            mre_x23/audit.log
            mre_x23/shard-*.json
