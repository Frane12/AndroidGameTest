name: DRNAS CRR1-B — certified active CNF GF2 bridge 24 originals 216 paired 20s
on:
  push:
    branches: [experiment/drnas-crr1b-active-20261108]
    paths: ['.github/workflows/drnas-crr1b-active.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-crr1b-active-20261108
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore 24 source-SHA-frozen original SAT2026 CNFs and run exact proof self-tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42429372803 -R Frane12/AndroidGameTest -n w4-input -D .
          test -s worldsim-w1-frozen.tar.gz
          test -s history/w4sources/manifest.json
          tar xzf worldsim-w1-frozen.tar.gz
          chmod +x built/bin/kissat_4_0_4 checker/drat-trim
          python3 -m py_compile research/drnas_crr1a_shadow.py research/drnas_crr1b_active.py
          python3 -u research/drnas_crr1b_active.py selftest
          mkdir -p crr1b
          python3 -u research/drnas_crr1b_active.py prepare | tee crr1b/prepare.log
          grep -q '^CRR1B_PREPARE_PASS' crr1b/prepare.log
      - uses: actions/upload-artifact@v4
        with:
          name: crr1b-frozen-input
          retention-days: 45
          if-no-files-found: error
          path: |
            worldsim-w1-frozen.tar.gz
            history/w4sources/
            checker/drat-trim
            built/bin/kissat_4_0_4
            crr1b/manifest.json
            crr1b/pins.json
            crr1b/prepare.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crr1b-prepare-diagnostics
          retention-days: 14
          if-no-files-found: warn
          path: crr1b/
  paired:
    needs: prepare
    name: CRR1B plain shadow active proof-gated shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: crr1b-frozen-input
      - name: 3-arm paired one-CPU 20s with certified clause addition and original witness replay
        run: |
          set -euo pipefail
          tar xzf worldsim-w1-frozen.tar.gz
          chmod +x built/bin/kissat_4_0_4 checker/drat-trim
          python3 -u research/drnas_crr1b_active.py shard --shard ${{ matrix.shard }} | tee crr1b/shard-${{ matrix.shard }}.log
          grep -q '^CRR1B_SHARD_PASS' crr1b/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crr1b-shard-${{ matrix.shard }}
          retention-days: 45
          if-no-files-found: warn
          path: |
            crr1b/shard-${{ matrix.shard }}.json
            crr1b/shard-${{ matrix.shard }}.log
            crr1b/raw/**/proof_validation.log
  audit:
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: crr1b-frozen-input
      - name: Gather exact eight source-SHA shard records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar xzf worldsim-w1-frozen.tar.gz
          chmod +x built/bin/kissat_4_0_4 checker/drat-trim
          mkdir -p crr1b/collected
          gh run download "${{ github.run_id }}" -R Frane12/AndroidGameTest -p 'crr1b-shard-*' -D crr1b/collected
          test "$(find crr1b/collected -type f -name 'shard-*.json' | wc -l)" -eq 8
          find crr1b/collected -type f -name 'shard-*.json' -exec cp '{}' crr1b/ \;
          test "$(find crr1b -maxdepth 1 -type f -name 'shard-*.json' | wc -l)" -eq 8
      - name: Check 216 trials, source SHA, PAR2, SAT witnesses and native UNSAT proofs
        run: |
          set -euo pipefail
          python3 -u research/drnas_crr1b_active.py audit | tee crr1b/audit.log
          grep -q '^CRR1B_FINAL' crr1b/audit.log
          cat crr1b/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-CRR1B-24SHA-216-PAIRED-CERTIFIED-FINAL
          retention-days: 60
          if-no-files-found: warn
          path: |
            crr1b/report.json
            crr1b/all-trials.json
            crr1b/audit.log
            crr1b/manifest.json
            crr1b/pins.json
