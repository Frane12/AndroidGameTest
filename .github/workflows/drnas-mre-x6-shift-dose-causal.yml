name: DRNAS MRE X6 — exact duplicate placement offset mechanism 128 E2E 768 bounded
on:
  push:
    branches: [experiment/drnas-mre-x6-shift-dose-causal-20261109]
    paths: ['.github/workflows/drnas-mre-x6-shift-dose-causal.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-mre-x6-shift-dose-20261109
  cancel-in-progress: false
jobs:
  prepare:
    name: Reuse frozen X4 originals and byte-identical CMS native binary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover X4 frozen source SHA and native binary without recompiling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42525965205 -R Frane12/AndroidGameTest \
            -n mre-x4-four-original-sha-five-orders-checkpoint-cms -D .
          (cd mre_x && sha256sum -c source.sha256)
          sha256sum -c mre_x4/bin.sha256
          chmod +x mre_x4/bin/native
          mkdir -p mre_x6/bin
          cp mre_x4/bin/native mre_x6/bin/native
          cmp mre_x4/bin/native mre_x6/bin/native
          sha256sum mre_x6/bin/native > mre_x6/bin.sha256
          export LD_LIBRARY_PATH="$PWD/mre5/lib:${LD_LIBRARY_PATH:-}"
          ldd mre_x6/bin/native | grep 'libcryptominisat5.so.5.11'
          python3 -m py_compile research/mre_x_benchmark.py research/mre_x2_clause_order_causal.py research/mre_x3_spread_mechanism.py research/mre_x4_early_divergence.py research/mre_x6_shift_dose_causal.py
          python3 -u research/mre_x3_spread_mechanism.py verify
          python3 -u research/mre_x4_early_divergence.py verify
          python3 -u research/mre_x6_shift_dose_causal.py selftest
          python3 -u research/mre_x6_shift_dose_causal.py freeze
          python3 -u research/mre_x6_shift_dose_causal.py verify
      - uses: actions/upload-artifact@v4
        with:
          name: mre-x6-source-locked-originals-and-frozen-binary
          retention-days: 21
          compression-level: 6
          path: |
            mre_x/*.cnf
            mre_x/manifest.json
            mre_x/source.sha256
            mre_x3/*.cnf
            mre_x3/manifest.json
            mre_x4/*.cnf
            mre_x4/manifest.json
            mre_x4/bin/native
            mre_x4/bin.sha256
            mre_x6/*.cnf
            mre_x6/manifest.json
            mre_x6/bin/native
            mre_x6/bin.sha256
            mre5/lib/libcryptominisat5.so.5.11
  paired:
    name: X6 32 E2E 192 bounded exact-SHA shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mre-x6-source-locked-originals-and-frozen-binary
          path: .
      - name: Verify original and variant SHA with same CMS binary
        run: |
          set -euo pipefail
          (cd mre_x && sha256sum -c source.sha256)
          sha256sum -c mre_x6/bin.sha256
          cmp mre_x4/bin/native mre_x6/bin/native
          chmod +x mre_x6/bin/native
          export LD_LIBRARY_PATH="$PWD/mre5/lib:${LD_LIBRARY_PATH:-}"
          python3 -u research/mre_x6_shift_dose_causal.py verify
          python3 -u research/mre_x6_shift_dose_causal.py shard --shard ${{ matrix.shard }} --native mre_x6/bin/native \
            | tee mre_x6/shard-${{ matrix.shard }}.log
          grep -q '^MRE_X6_SHARD_PASS ${{ matrix.shard }}' mre_x6/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mre-x6-shard-${{ matrix.shard }}
          retention-days: 21
          path: |
            mre_x6/real-${{ matrix.shard }}.json
            mre_x6/bounded-${{ matrix.shard }}.json
            mre_x6/repeat-${{ matrix.shard }}.json
            mre_x6/shard-${{ matrix.shard }}.log
  audit:
    name: Audit 128 E2E and 768 bounded; compare early divergence by shift dose
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mre-x6-source-locked-originals-and-frozen-binary
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: mre-x6-shard-*
          merge-multiple: true
          path: mre_x6
      - name: Strict audit independent of bounded CDCL
        run: |
          set -euo pipefail
          (cd mre_x && sha256sum -c source.sha256)
          sha256sum -c mre_x6/bin.sha256
          python3 -u research/mre_x6_shift_dose_causal.py audit | tee mre_x6/audit.log
          grep -q '^MRE_X6_FINAL' mre_x6/audit.log
          grep '^MRE_X6_FINAL' mre_x6/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-MRE-X6-128-E2E-768-BOUNDED-CAUSAL-AUDIT
          retention-days: 30
          path: |
            mre_x6/report.json
            mre_x6/audit.log
            mre_x6/manifest.json
            mre_x6/real-*.json
            mre_x6/bounded-*.json
            mre_x6/repeat-*.json
