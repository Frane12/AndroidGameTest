name: DRNAS STRUCTURAL DRAT BRIDGE8 externally verified
on:
  push:
    branches: [experiment/drnas-structural-drat-bridge1-20261115]
    paths:
      - "research/structural_drat_bridge/**"
      - ".github/workflows/drnas-structural-drat-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source_sha_frozen_bridge8:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 43717935841
          name: unified-core1-frozen
          github-token: ${{ github.token }}
          path: frozen
      - name: Use pinned DRNAS and independently compiled standard DRAT verifier
        run: |
          set -euo pipefail
          tar -xzf frozen/unified-core1-frozen.tgz
          chmod +x build/drnas-unified-core1 build/drat-trim
          sha256sum build/drnas-unified-core1 build/drat-trim
      - name: Validate four Hall/PHP and four XOR/Tseitin source-preserving DRAT proofs
        run: |
          set -euo pipefail
          python3 -u research/structural_drat_bridge/test.py | tee bridge8.log
      - name: Save original source SHA, generated proof, independent DRAT checker traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-structural-drat-bridge8-evidence
          path: |
            bridge8_results
            bridge8.log
          retention-days: 60
