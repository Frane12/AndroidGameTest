name: DRNAS V13.7 - Exact GF2 and PHP Fast Paths on 40 New CNFs
on:
  push:
    branches: [experiment/drnas-v137-exact-affine-fastpath-20261101]
    paths:
      - '.github/workflows/drnas-sat-v137-exact.yml'
      - 'research/drnas-sat-v7-8/v137_fastpath.py'
      - 'research/drnas-sat-v7-8/v137_holdout.py'
      - 'research/drnas-sat-v7-8/v137_evaluate.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify standalone XOR, pigeonhole certificates and seeded permutation tests
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/v137_fastpath.py research/drnas-sat-v7-8/v137_holdout.py research/drnas-sat-v7-8/v137_evaluate.py
          python3 research/drnas-sat-v7-8/v137_evaluate.py selftest
      - name: Freeze 40 CNFs with pinned symbolic code hashes
        run: |
          set -euo pipefail
          mkdir -p frozen
          python3 research/drnas-sat-v7-8/v137_evaluate.py freeze \
            --source research/drnas-sat-v7-8/v137_fastpath.py \
            --generator research/drnas-sat-v7-8/v137_holdout.py \
            --out frozen/v137_manifest.json
          (cd frozen && sha256sum v137_manifest.json > v137_manifest.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V137-frozen-40-structural-inputs
          path: frozen/
          if-no-files-found: warn
  benchmark:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 34
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    name: v137-shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V137-frozen-40-structural-inputs
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V132-three-pinned-binaries
          run-id: 41256313918
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: bin
      - name: Verify pinned manifest and binary integrity
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v137_manifest.sha256)
          (cd bin && sha256sum -c binaries.sha256)
          chmod +x bin/v132_drnas bin/v132_kissat
      - name: Four-policy matched trials with exact proof verification
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/v137_evaluate.py run \
            --manifest frozen/v137_manifest.json --shard "$SHARD" \
            --source research/drnas-sat-v7-8/v137_fastpath.py \
            --generator research/drnas-sat-v7-8/v137_holdout.py \
            --fastpath research/drnas-sat-v7-8/v137_fastpath.py \
            --drnas bin/v132_drnas --kissat bin/v132_kissat --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v137-shard-${{ matrix.shard }}
          path: results/
          if-no-files-found: warn
  audit:
    needs: [freeze,benchmark]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V137-frozen-40-structural-inputs
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: v137-shard-*
          path: combined
          merge-multiple: false
      - name: Strict 320-trial audited PAR2 comparison
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v137_manifest.sha256)
          python3 -u research/drnas-sat-v7-8/v137_evaluate.py audit \
            --manifest frozen/v137_manifest.json --combined combined \
            --out v137_report.json --md v137_report.md
          cat v137_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V137-40-case-exact-affine-audit
          path: |
            v137_report.json
            v137_report.md
          if-no-files-found: warn
