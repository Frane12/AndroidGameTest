name: DRNAS XX2R causal — recover completed 48-trial audit only
on:
  push:
    branches: [experiment/drnas-xx2r-causal-probe-20261109]
    paths: ['.github/workflows/drnas-xx2r-causal-audit-recover.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-xx2r-causal-audit-recover
  cancel-in-progress: false
jobs:
  audit:
    name: Reuse successful 3 shards, validate 48 E2E and 24 bounded diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download original frozen and finished trial artifacts without rerunning solvers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42573045526 -R Frane12/AndroidGameTest -n xx2r-causal-frozen-originals-and-binaries -D .
          mkdir -p xx2r_causal_probe
          for i in 0 1 2; do
            gh run download 42573045526 -R Frane12/AndroidGameTest -n "xx2r-causal-result-$i" -D .
            test -s "xx2r_causal_probe/shard-$i.json"
          done
          python3 -m py_compile research/xx2r_causal_probe.py
          export PYTHONPATH="$PWD/research"
          python3 -u research/xx2r_causal_probe.py verify
      - name: Strict audit of original CNF SHA/seed paired trials
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/research"
          python3 -u research/xx2r_causal_probe.py audit | tee xx2r_causal_probe/audit.log
          grep -q '^XX2R_CAUSAL_FINAL ' xx2r_causal_probe/audit.log
          grep '^XX2R_CAUSAL_FINAL ' xx2r_causal_probe/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-XX2R-CAUSAL-RECOVERED-48E2E-24BOUNDED-FINAL
          retention-days: 30
          if-no-files-found: error
          path: |
            xx2r_causal_probe/report.json
            xx2r_causal_probe/audit.log
            xx2r_causal_probe/shard-*.json
