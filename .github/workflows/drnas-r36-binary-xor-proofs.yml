name: DRNAS R36 XOR boundary binary implication proofs
on:
  push:
    branches: [experiment/drnas-r36-binary-xor-proofs-20261103]
    paths:
      - '.github/workflows/drnas-r36-binary-xor-proofs.yml'
      - 'experiments/drnas_v16/r36_binary_xor_proofs.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile experiments/drnas_v16/r36_binary_xor_proofs.py
      - uses: actions/download-artifact@v4
        with:
          name: r32-official-verified14-and-diagnostics
          run-id: 41623227197
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: official
      - name: Verify pinned CNFs and find checked binary path proofs
        run: |
          set -euo pipefail
          (cd official && sha256sum -c originals.sha256)
          python3 -u experiments/drnas_v16/r36_binary_xor_proofs.py --inputs official --out r36-proofs.json | tee r36-live.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R36-BINARY-XOR-PROOFS-14-OFFICIAL
          path: |
            r36-proofs.json
            r36-live.log
          if-no-files-found: warn
          retention-days: 90
