name: DRNAS R154 SHA-disjoint 15s prospective certified-unit GF2 regression
on:
  push:
    branches: [experiment/drnas-r154-unseen-validation]
    paths:
      - '.github/workflows/drnas-r154-blind-unit-regression.yml'
      - 'research/r154_blind_freeze.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r154-prospective-15s-20261105
  cancel-in-progress: false
jobs:
  freeze:
    name: Source-only official GBD family freeze with historical ID/SHA exclusion
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify research script before external acquisition
        run: |
          set -euo pipefail
          python3 -m py_compile research/r115_world_top_rematch.py research/r154_blind_freeze.py
          mkdir -p r154
      - uses: actions/download-artifact@v4
        with:
          name: r115-world-frozen
          run-id: 42039762548
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior/r115
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-400-PROSPECTIVE-CNF-VERIFIED-COMPLETE
          run-id: 42060553799
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior/400
      - uses: actions/download-artifact@v4
        with:
          name: r132-frozen-prospective-sha-excluded
          run-id: 42050320220
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior/r132
      - uses: actions/download-artifact@v4
        with:
          name: r135-frozen-sha-disjoint-real
          run-id: 42061956160
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior/r135
      - uses: actions/download-artifact@v4
        with:
          name: r148blind-fixed-previously-unmeasured-real-cnfs
          run-id: 42087820632
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior/r148
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-R150-NEW-EXTERNAL-PROSPECTIVE-FINAL
          run-id: 42088721067
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior/r150
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-R151-INDEPENDENT-SHA-PAR2-REGRESSIONS-FINAL
          run-id: 42094754907
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior/r151
      - uses: actions/download-artifact@v4
        with:
          name: r152-new-lightsout-frozen-originals-and-provenance
          run-id: 42102227483
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior/r152
      - name: Freeze SHA-disjoint sources and purely syntactic XOR coverage BEFORE timing
        run: |
          set -euo pipefail
          python3 -u research/r154_blind_freeze.py freeze | tee r154/freeze.log
          test -s r154/frozen/manifest.json
          grep -q '^R152_FREEZE_PASS ' r154/freeze.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r154-prospective-frozen-sha-locked
          path: |
            r154/frozen/
            r154/freeze.log
          if-no-files-found: warn
          retention-days: 90
  benchmark:
    name: 15s source-disjoint R153 R28 Kissat CaDiCaL shard ${{ matrix.shard }}
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r154-prospective-frozen-sha-locked
          path: r154
      - uses: actions/download-artifact@v4
        with:
          name: r52-three-pinned-solvers
          run-id: 41684183452
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: built/bin
      - name: Pin exact baseline and experimental binaries
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          (cd built/bin && sha256sum -c binaries.sha256)
          chmod +x built/bin/kissat_4_0_4 built/bin/cadical_3_0_1
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -Werror experiments/drnas_v16/r28_exact_gf2.cpp -o r154/r28
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -Werror research/r153_exact_units_gf2.cpp -o r154/r153
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          fs=["r154/r28","r154/r153","built/bin/kissat_4_0_4","built/bin/cadical_3_0_1"]
          x={"commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
             "binaries":{f:hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest() for f in fs},
             "cpu":next((z for z in pathlib.Path("/proc/cpuinfo").read_text().splitlines() if z.startswith("model name")),"unknown")}
          pathlib.Path("r154/pin-"+os.environ["SHARD"]+".json").write_text(json.dumps(x,sort_keys=True))
          PY
      - name: Paired 15s SHA-pinned tests with independent GF2 proof checks
        run: |
          set -euo pipefail
          python3 -u research/r154_blind_benchmark.py shard --shard ${{ matrix.shard }} | tee r154/shard-${{ matrix.shard }}.log
          grep -q '^R153_SHARD_PASS ' r154/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r154-blind-shard-${{ matrix.shard }}
          path: |
            r154/shard-${{ matrix.shard }}.json
            r154/shard-${{ matrix.shard }}.log
            r154/pin-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 90
  audit:
    name: Final strict source-disjoint SHA paired PAR2 and correctness audit
    needs: benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r154-prospective-frozen-sha-locked
          path: r154
      - uses: actions/download-artifact@v4
        with:
          pattern: r154-blind-shard-*
          merge-multiple: true
          path: r154
      - name: Validate all new SHA formula pairs and no solver status contradictions
        run: |
          set -euo pipefail
          test "$(find r154 -maxdepth 1 -name 'shard-*.json' | wc -l)" -eq 4
          python3 -u research/r154_blind_benchmark.py audit | tee r154/audit.log
          grep -q '^R153_FINAL ' r154/audit.log
          cat r154/report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R154-SHA-DISJOINT-15S-FOUR-SOLVERS-FINAL
          path: |
            r154/report.json
            r154/paired.csv
            r154/audit.log
            r154/frozen/manifest.json
          if-no-files-found: warn
          retention-days: 90
