name: DRNAS LTM10 adaptive frozen-policy 600 paired E2E
on:
  workflow_dispatch:
  push:
    branches: [experiment/drnas-ltm10-adaptive-20261112]
    paths:
      - research/drnas_ltm10_adaptive.py
      - .github/workflows/drnas-ltm10-adaptive.yml
permissions:
  contents: read
concurrency:
  group: drnas-ltm10-adaptive
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and run LTM9 baseline selftests
        run: |
          set -euo pipefail
          python3 research/drnas_ltm9_compile.py
          python3 research/drnas_ltm9_selftest.py
          python3 -m py_compile research/drnas_ltm10_adaptive.py
      - name: LTM10 source-disjoint training and 600 paired E2E trials
        run: |
          set -euo pipefail
          python3 -u research/drnas_ltm10_adaptive.py | tee ltm10-run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ltm10-adaptive-audit
          retention-days: 14
          path: |
            ltm10-run.log
            ltm10_results/frozen_memory.json
            ltm10_results/training.jsonl
            ltm10_results/results.jsonl
            ltm10_results/summary.json
