name: DRNAS ATLAS3 structural cost gate / 8 controlled regressions
run-name: ATLAS3 controlled structured A ATLAS2 gate12 gate32 Kissat CaDiCaL
on:
  push:
    branches: [experiment/drnas-atlas3-cost-gate-20261111]
    paths:
      - research/drnas_atlas3.cpp
      - research/drnas_atlas3_smoke.py
      - research/drnas_atlas3_regression_bench.py
      - research/drnas_atlas2.cpp
      - research/drnas_atlas2_generate_structured.py
      - research/drnas_atlas1_generate.py
      - research/drnas_native_core_r3c.cpp
      - .github/workflows/drnas-atlas3.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  micro:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install compiler and reference solver
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_atlas3_regression_bench.py research/drnas_atlas1_generate.py research/drnas_atlas2_generate_structured.py research/drnas_atlas3_smoke.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cadical
      - name: Build pinned Kissat
        run: |
          set -euo pipefail
          mkdir -p mre_atlas3/bin
          git clone --quiet https://github.com/arminbiere/kissat.git mre_atlas3/kissat-src
          git -C mre_atlas3/kissat-src checkout --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          (cd mre_atlas3/kissat-src && ./configure && make -j2)
          install -m 755 mre_atlas3/kissat-src/build/kissat mre_atlas3/bin/kissat
          install -m 755 "$(command -v cadical)" mre_atlas3/bin/cadical
      - name: Generate frozen 2 to 4-input NPN catalog and recipes
        run: |
          set -euo pipefail
          python3 research/drnas_atlas1_generate.py --out mre_atlas3/atlas1_table.hpp
      - name: Compile ATLAS3 and pristine ATLAS2; exact selftests and gate controls
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -I mre_atlas3 research/drnas_atlas3.cpp -o mre_atlas3/bin/drnas_atlas3
          g++ -std=c++17 -O2 -I mre_atlas3 research/drnas_atlas2.cpp -o mre_atlas3/bin/drnas_atlas2
          mre_atlas3/bin/drnas_atlas3 --atlas-selftest
          python3 research/drnas_atlas3_smoke.py
      - name: Baseline ATLAS2 versus ATLAS3 cost-gates on previously studied structured controls
        env:
          MICRO_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          taskset -c "$(taskset -pc $$ | sed 's/.*: //' | cut -d, -f1 | cut -d- -f1)" python3 -u research/drnas_atlas3_regression_bench.py | tee mre_atlas3/benchmark.log
          grep '^ATLAS3_FINAL ' mre_atlas3/benchmark.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-ATLAS3-PILOT-SHARD-${{ matrix.shard }}-AUDIT
          retention-days: 30
          path: |
            mre_atlas3/audit.json
            mre_atlas3/source.json
            mre_atlas3/*.cnf
            mre_atlas3/*.log
            mre_atlas3/route_atlas3.json
            mre_atlas3/route_strict.json



