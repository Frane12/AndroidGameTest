name: DRNAS R115 repeat historical 14k XOR diagnostic
on:
  push:
    branches: [experiment/drnas-r115-repeat-14k-20261104]
    paths:
      - 'research/r115_repeat_14k.py'
      - '.github/workflows/drnas-r115-repeat-14k.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  repeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r52-three-pinned-solvers
          run-id: 41684183452
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: built/bin
      - name: Build and audit identical-host controls
        run: |
          set -euo pipefail
          (cd built/bin && sha256sum -c binaries.sha256)
          chmod +x built/bin/kissat_4_0_4 built/bin/cadical_3_0_1
          mkdir -p r115
          g++ -std=c++17 -O3 -DNDEBUG experiments/drnas_v16/r28_exact_gf2.cpp -o r115/r28
          python3 -m py_compile research/r115_repeat_14k.py
          sha256sum r115/r28 experiments/drnas_v16/r28_exact_gf2.cpp > r115/provenance.sha256
          lscpu > r115/cpu.txt
      - name: Five paired real-source repetitions, 60s limit
        run: |
          set -euo pipefail
          python3 -u research/r115_repeat_14k.py | tee r115/live.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R115-historical-14k-repeat-raw
          path: r115/
          retention-days: 60
