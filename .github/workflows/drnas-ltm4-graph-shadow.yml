name: DRNAS LTM4 graph and safe shadow diagnostic
run-name: LTM4 384 source CNF graph memory negative positive shadow audit
on:
  push:
    branches: [experiment/drnas-ltm4-graph-shadow-20261111]
    paths:
      - "mi_ltm4/**"
      - ".github/workflows/drnas-ltm4-graph-shadow.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drnas-ltm4-shadow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  graph-shadow-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test source XOR graph trail context and memory isolation
        run: |
          set -euo pipefail
          python3 -m unittest discover -s mi_ltm4 -p 'test_*.py' -v
      - name: Audit 384 original CNF structures offline shadow
        run: |
          set -euo pipefail
          taskset -c "$(awk '/Cpus_allowed_list:/ {split($2,a,/[,-]/); print a[1]}' /proc/self/status)" python3 -u mi_ltm4/audit.py | tee MI_LTM4_GRAPH.log
          grep '^MI_LTM4_GRAPH_FINAL ' MI_LTM4_GRAPH.log >> "$GITHUB_STEP_SUMMARY"
      - name: Archive diagnostic without unverified PAR2 claims
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRNAS-LTM4-GRAPH-OFFLINE-SHADOW-384
          retention-days: 90
          path: |
            MI_LTM4_GRAPH_SHADOW.json
            MI_LTM4_GRAPH.log
