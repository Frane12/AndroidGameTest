name: DRNAS R2x cumulative SQL history audit
on:
  push:
    branches: [experiment/drnas-ultimate-r2x-20261107]
    paths:
      - research/drnas_sat_benchmark_history_20261107.sql
      - scripts/drnas_sat_sql_20261107_audit.py
      - .github/workflows/drnas-ultimate-r2x-sql-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sqlite-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate old records, new cohorts, trusted metrics and idempotence
        run: |
          set -euo pipefail
          python3 -u scripts/drnas_sat_sql_20261107_audit.py | tee drnas-sql-audit.log
          grep -q 'DRNAS_SQL_AUDIT_PASS' drnas-sql-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R2X-20261107-SQL-AUDIT
          retention-days: 90
          path: |
            research/drnas_sat_sql_audit_20261107.json
            drnas-sql-audit.log
