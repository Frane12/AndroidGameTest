name: DRNAS R28 NATIVE DIRECT easy originals and controls
on:
  push:
    branches: [experiment/drnas-r28-native-easy-20261112]
    paths:
      - '.github/workflows/drnas-r28-native-easy.yml'
      - 'research/drnas_r28_native_easy*'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r28-native-easy
  cancel-in-progress: false
jobs:
  easy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r28-medium-inputs
          run-id: 43182527980
          github-token: ${{ github.token }}
          path: .
      - name: Verify frozen native and reference binaries
        run: |
          set -euo pipefail
          chmod +x mre_r28_native/drnas_r28_native mre_r28_native/r153_reference built/bin/kissat_4_0_4 built/bin/cadical_3_0_1
          sha256sum -c r28_native_medium/binaries.sha256
          python3 research/drnas_r28_native_selftest.py
          python3 research/drnas_r28_native_easy.py selftest
          sudo apt-get update -qq
          sudo apt-get install -y -qq cryptominisat
          lscpu > r28_native_easy/cpu.txt
          dpkg-query -W cryptominisat > r28_native_easy/cms-version.txt
          sha256sum /usr/bin/cryptominisat5 > r28_native_easy/cms.sha256
          cp r28_native_medium/binaries.sha256 r28_native_easy/binaries.sha256
      - name: Prepare four historically fast original CNFs and twelve easy controls
        run: |
          set -euo pipefail
          python3 -m venv .easyvenv
          .easyvenv/bin/pip install remotezip
          .easyvenv/bin/python research/drnas_r28_native_easy.py prepare
      - name: One CPU five serial arms three repeats, 8s originals and 2s controls
        run: |
          set -euo pipefail
          python3 -u research/drnas_r28_native_easy.py run | tee r28_native_easy/live.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r28-native-easy-results
          path: r28_native_easy/
          retention-days: 60
