name: DRNAS XOR + MATH5 unified1 native proof and SAT preflight
on:
  push:
    branches:
      - experiment/drnas-xor-math5-unified1-20261115
    paths:
      - research/xor_math5_unified1/**
      - .github/workflows/drnas-xor-math5-unified1.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drnas-xor-math5-unified1
  cancel-in-progress: false
jobs:
  native_preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pinned compiler toolchain and checks
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev
          python3 -m py_compile research/xor_math5_unified1/*.py
          g++ --version | head -1
      - name: Build native single-process X59 plus MATH5 source algebra
        run: |
          set -euo pipefail
          python3 -u research/xor_math5_unified1/build.py | tee xor_math5_build.log
          test -x build/drnas-x59-xor-math5-unified1
          grep -q MATH5_UNIFIED_BUILD_OK xor_math5_build.log
      - name: Independent source and certificate adversarial checks
        run: |
          set -euo pipefail
          python3 -u research/xor_math5_unified1/test.py | tee xor_math5_test.log
          grep -q '^UNIFIED_MATH5_PREFLIGHT_PASS' xor_math5_test.log
      - name: Retain native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xor-math5-unified1-preflight
          retention-days: 60
          if-no-files-found: warn
          path: |
            xor_math5_build.log
            xor_math5_test.log
