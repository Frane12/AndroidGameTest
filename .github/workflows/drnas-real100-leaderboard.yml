name: DRNAS REAL100 read-only verified leaderboard and interesting formulas
on:
  push:
    branches: [experiment/drnas-real100-leaderboard-20261114]
    paths:
      - .github/workflows/drnas-real100-leaderboard.yml
      - research/drnas_real100_leaderboard.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-real100-leaderboard-readonly
  cancel-in-progress: false
jobs:
  leaderboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 43613581688
          name: cf7-source-manifest
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          run-id: 43613581688
          pattern: cf7-shard-*
          github-token: ${{ github.token }}
          path: downloaded
      - name: Verify all 500 original-source trials and rank formulas
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_real100_leaderboard.py
          python3 -u research/drnas_real100_leaderboard.py | tee leaderboard.log
          grep -q '^LEADERBOARD_FINAL ' leaderboard.log
          cat leaderboard/README.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drnas-real100-verifiable-leaderboard
          retention-days: 45
          path: |
            leaderboard/
            leaderboard.log
