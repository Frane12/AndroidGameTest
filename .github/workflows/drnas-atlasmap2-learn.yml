name: DRNAS MAP2 persistent causal learning frozen holdout
run-name: MAP2-L 6 train SHA 6 disjoint holdout SHA 3 reps A shadow live PAR2
on:
  push:
    branches: [experiment/drnas-atlasmap2-persistent-learning-20261111]
    paths:
      - research/drnas_atlasmap2_learn.py
      - research/drnas_atlasmap2_learning_bench.py
      - research/drnas_atlasmap2.cpp
      - research/drnas_native_core_r3c.cpp
      - .github/workflows/drnas-atlasmap2-learn.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  learn_and_holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile exact native R3C + MAP2
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_atlasmap2_learn.py research/drnas_atlasmap2_learning_bench.py
          mkdir -p mre_atlasmap2/bin
          python3 research/drnas_atlas1_generate.py --out mre_atlasmap2/atlas1_table.hpp
          g++ -std=c++17 -O2 -Wall -Wextra -I mre_atlasmap2 research/drnas_atlasmap2.cpp -o mre_atlasmap2/bin/drnas_atlasmap2
          mre_atlasmap2/bin/drnas_atlasmap2 --atlasmap2-selftest | tee mre_atlasmap2/selftest.log
          python3 -u research/drnas_atlasmap2_smoke.py | tee mre_atlasmap2/smoke.log
      - name: Run paired training and never-seen frozen evaluation
        run: |
          set -euo pipefail
          mkdir -p mre_atlasmap2_learning
          taskset -c "$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')" python3 -u research/drnas_atlasmap2_learning_bench.py | tee mre_atlasmap2_learning/benchmark.log
          grep '^ATLASMAP2_LEARN_FINAL ' mre_atlasmap2_learning/benchmark.log >> "$GITHUB_STEP_SUMMARY"
      - name: Restore rolling MAP2 training journal from prior successful run
        id: rolling-cache
        uses: actions/cache/restore@v4
        with:
          path: mre_atlasmap2_learning/rolling_memory.json
          key: map2-rolling-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            map2-rolling-${{ github.ref_name }}-
      - name: Train one new source SHA and record explanation across workflow runs
        run: |
          set -euo pipefail
          python3 -c 'import sys; sys.path.insert(0,"research"); import drnas_atlasmap2_learning_bench as b; p,sha=b.formula(1000+int(sys.argv[1])); print("ATLASMAP2_ROLLING_SOURCE",sha,p)' "${{ github.run_number }}"
          python3 -u research/drnas_atlasmap2_learn.py "mre_atlasmap2_learning/mixed_$((1000+${{ github.run_number }})).cnf" --binary mre_atlasmap2/bin/drnas_atlasmap2 --memory mre_atlasmap2_learning/rolling_memory.json --phase train --cap 2 --report mre_atlasmap2_learning/rolling_report.json | tee mre_atlasmap2_learning/rolling.log
          python3 -c 'import json; p="mre_atlasmap2_learning/rolling_memory.json"; d=json.load(open(p)); print("ATLASMAP2_ROLLING_SAMPLES",len(d["samples"]))' >> "$GITHUB_STEP_SUMMARY"
      - name: Persist rolling MAP2 training journal for next workflow run
        uses: actions/cache/save@v4
        with:
          path: mre_atlasmap2_learning/rolling_memory.json
          key: map2-rolling-${{ github.ref_name }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MAP2-PERSISTENT-TRAIN-HOLDOUT-PAR2-AUDIT
          retention-days: 45
          path: |
            mre_atlasmap2/selftest.log
            mre_atlasmap2/smoke.log
            mre_atlasmap2_learning/*.cnf
            mre_atlasmap2_learning/*.json
            mre_atlasmap2_learning/*.log
