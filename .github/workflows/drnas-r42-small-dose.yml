name: DRNAS R42 small official UNSAT hint-dose control
on:
  push:
    branches: [experiment/drnas-r42-small-hint-dose-20261103]
    paths:
      - '.github/workflows/drnas-r42-small-dose.yml'
      - 'experiments/drnas_v16/r42_cap_patch.py'
      - 'experiments/drnas_v16/r42_small_benchmark.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  dose_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify experiment scripts and frozen ancestor source
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/r40_patch_early_rescue.py experiments/drnas_v16/r41_trace_patch.py experiments/drnas_v16/r42_cap_patch.py experiments/drnas_v16/r42_small_benchmark.py
          test "$(git hash-object research/drnas-sat-v7-6/v76_single.cpp)" = a254356a45b70f02f33b9506f1122dad33916ca7
          test "$(git hash-object research/drnas-sat-v7-7/v77_single.cpp)" = 1bbb7fa035e62d5179de9243f672aed9bb9cbaca
      - name: Reuse exact R37 original 12-case official manifest
        uses: actions/download-artifact@v4
        with:
          name: v94-frozen-new12-official-manifest
          run-id: 41632056202
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: official_manifest
      - name: Build one native control and capped-dose binary
        run: |
          set -euo pipefail
          (cd official_manifest && sha256sum -c manifest.sha256)
          git clone --depth 1 --branch rel-3.0.1 https://github.com/arminbiere/cadical.git cadical-src
          test "$(git -C cadical-src rev-parse HEAD)" = c60730422e758ef1cebe7aeddf2dda31c996bf04
          python3 -u research/drnas-sat-v7-8/patch_cadical_v90.py cadical-src
          python3 -u experiments/drnas_v16/r40_patch_early_rescue.py --source research/drnas-sat-v7-8/v94_cautious_probe.cpp --dest research/drnas-sat-v7-8/r42_r40.cpp
          python3 -u experiments/drnas_v16/r41_trace_patch.py --source research/drnas-sat-v7-8/r42_r40.cpp --dest research/drnas-sat-v7-8/r42_r41.cpp
          python3 -u experiments/drnas_v16/r42_cap_patch.py --source research/drnas-sat-v7-8/r42_r41.cpp --out research/drnas-sat-v7-8/r42_native.cpp
          python3 - <<'PY'
          from pathlib import Path
          source=Path('research/drnas-sat-v7-7/v77_single.cpp').read_text()
          marker='\nint main(int argc,char**argv) {'
          assert source.count(marker)==1
          Path('research/drnas-sat-v7-7/v77_embedded_functions.inc').write_text(source.split(marker,1)[0]+'\n')
          PY
          (cd cadical-src && ./configure && make -j2 >/tmp/r42-cadical-build.log 2>&1) || { tail -100 /tmp/r42-cadical-build.log; exit 1; }
          mkdir -p compiled
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -I cadical-src/src research/drnas-sat-v7-8/r42_native.cpp cadical-src/build/libcadical.a -o compiled/r42_native -pthread -ldl -lz
          chmod +x compiled/r42_native
          sha256sum compiled/r42_native research/drnas-sat-v7-8/r42_native.cpp > r42-binary-source.sha256
      - name: Mandatory tiny SAT native smoke test (excluded from statistics)
        run: |
          set -euo pipefail
          printf 'p cnf 2 2\n1 0\n-1 2 0\n' >/tmp/r42-smoke.cnf
          for mode in v91_quality_gate v91_cap32 v91_cap128 v91_cap512 v91_rescue; do
            compiled/r42_native "$mode" /tmp/r42-smoke.cnf 42 >"/tmp/r42-$mode.txt" 2>"/tmp/r42-$mode.err"
            grep -q "DRNAS_CAUSAL.*mode=$mode.*answer=SAT" "/tmp/r42-$mode.txt"
            echo "R42_SMOKE_PASS $mode"
          done
      - name: Exactly 10 SAT executions on ONE original verified official formula
        run: |
          set -euo pipefail
          lscpu > cpu.txt
          python3 -u experiments/drnas_v16/r42_small_benchmark.py --manifest official_manifest/official_v94_manifest.json --native compiled/r42_native --out r42-results | tee r42-live.log
          test -s r42-results/r42-results.json
          cat r42-live.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R42-ONE-OFFICIAL-HINT-DOSE-10-TRIALS
          path: |
            r42-results/
            r42-live.log
            cpu.txt
            r42-binary-source.sha256
          if-no-files-found: warn
          retention-days: 90
