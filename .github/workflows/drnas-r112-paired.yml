name: DRNAS R112 paired SAT comparison
on:
  push:
    branches: [experiment/drnas-r112-safe-gate-paired-20261104]
    paths:
      - 'research/r112_safe_gate_paired.py'
      - '.github/workflows/drnas-r112-paired.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install MiniSat and compile R107C
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y minisat
          g++ -std=c++17 -O2 research/r107c_native_xor_finder.cpp -o /tmp/r112_native
          python3 -m py_compile research/r112_safe_gate_paired.py research/r111_sensitive_safe_gate.py
          sha256sum research/r112_safe_gate_paired.py research/r111_sensitive_safe_gate.py research/r107c_native_xor_finder.cpp > provenance.sha256
          lscpu > runner-cpu.txt
      - name: Paired 24 formula 96 run SAT benchmark
        run: |
          set -euo pipefail
          python3 -u research/r112_safe_gate_paired.py results /tmp/r112_native /usr/bin/minisat | tee benchmark.log
          test -s results/paired.csv
          test -s results/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R112-paired-SAT-raw-and-audit
          path: |
            results/
            provenance.sha256
            runner-cpu.txt
            benchmark.log
          if-no-files-found: warn
          retention-days: 60
