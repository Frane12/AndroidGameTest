name: DRNAS Medical R7 GPR-certified flux witness versus original gMCSpy

on:
  push:
    branches:
      - experiment/drnas-medical-r7-flux-witness-20261106
    paths:
      - 'research/drnas_medical/gmispy_r7_witness.py'
      - 'research/drnas_medical/gmispy_r7_audit.py'
      - '.github/workflows/drnas-medical-r7-flux-witness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired:
    name: Real e_coli_core exact GPR cohort ${{ matrix.cohort }} genes
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        cohort: [48, 64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install R6-pinned biological LP, SAT and original gMCSpy
        run: |
          python3 -m pip install --disable-pip-version-check \
            cobra==0.30.0 python-sat==1.9.dev21 gurobipy==12.0.3 \
            beartype joblib bidict scipy tqdm
          python3 -m pip install --disable-pip-version-check --no-deps \
            'git+https://github.com/PlanesLab/gMCSpy.git@4567a6d14bd2e5517e7a86b17aebefb0f285544c'
      - name: Prove Tseitin AND/OR GPR truth-table equivalence
        run: python3 research/drnas_medical/gmispy_r7_audit.py --unit-only
      - name: Exact three-arm paired benchmark, three repeats
        run: |
          python3 research/drnas_medical/gmispy_r7_witness.py \
            --cohort ${{ matrix.cohort }} --out medical-results/r7-${{ matrix.cohort }} \
            --repeats 3 --cap 120
      - name: Store real gene sets and raw per-run timing trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-medical-r7-cohort-${{ matrix.cohort }}
          path: medical-results/r7-${{ matrix.cohort }}/
          retention-days: 30
          if-no-files-found: warn

  independent-audit:
    name: Independent GPR/GLPK exact solution certificate
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: drnas-medical-r7-cohort-48
          path: audit/48
      - uses: actions/download-artifact@v4
        with:
          name: drnas-medical-r7-cohort-64
          path: audit/64
      - name: Audit 62,216 original biological KOs and three matched arms
        run: |
          python3 research/drnas_medical/gmispy_r7_audit.py \
            --cohort48 audit/48/summary.json \
            --cohort64 audit/64/summary.json \
            --out audit/certified.json
      - name: Save independent biological benchmark certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-medical-r7-independent-certificate
          path: audit/certified.json
          retention-days: 30
