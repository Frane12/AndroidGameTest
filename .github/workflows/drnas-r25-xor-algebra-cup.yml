name: DRNAS R25 XOR + Algebra Competition-Style Cup
on:
  push:
    branches: [experiment/drnas-r25-xor-algebra-cup-20261103]
    paths:
      - '.github/workflows/drnas-r25-xor-algebra-cup.yml'
      - 'experiments/drnas_v16/r25_xor_algebra_*.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r25-xor-algebra-cup
  cancel-in-progress: false
jobs:
  build_freeze:
    name: Freeze 32 SHA inputs + build 4 pinned solvers
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify experimental Python protocol syntax
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/r25_xor_algebra_selector.py experiments/drnas_v16/r25_xor_algebra_cup.py
          mkdir -p pinned bin input
      - name: Retrieve original historical GBD manifest and verified downloader by pinned commit
        run: |
          set -euo pipefail
          PIN=3cd6525817f5019516b0addb94b4db5f57c7e9b1
          ORIGIN=https://raw.githubusercontent.com/Frane12/AndroidGameTest/${PIN}
          for file in frozen_verified_gbd_family.json preflight.py; do
            curl --fail --location --retry 3 --silent --show-error "${ORIGIN}/research/drnas-sat-family-test/${file}" -o "pinned/${file}"
          done
          curl --fail --location --retry 3 --silent --show-error "${ORIGIN}/research/drnas-sat-v7-8/frozen_competition_v78.json" -o pinned/frozen_competition_v78.json
          curl --fail --location --retry 3 --silent --show-error "${ORIGIN}/research/drnas-sat-v7-8/v78_single.cpp" -o research/drnas-sat-v7-8/v78_single.cpp
          curl --fail --location --retry 3 --silent --show-error "${ORIGIN}/research/drnas-sat-v7-7/v77_single.cpp" -o research/drnas-sat-v7-7/v77_single.cpp
          curl --fail --location --retry 3 --silent --show-error "${ORIGIN}/research/drnas-sat-v7-6/v76_single.cpp" -o research/drnas-sat-v7-6/v76_single.cpp
          curl --fail --location --retry 3 --silent --show-error "${ORIGIN}/research/drnas-sat-v7-2-1/confidence_bench.cpp" -o research/drnas-sat-v7-2-1/confidence_bench.cpp
          sha256sum pinned/* > pinned_sources.sha256
          echo "R25_FIXED_SOURCE_COMMIT=${PIN}"
      - name: Build exact Kissat 4.0.4 + CaDiCaL 3.0.1 and native R25 arms
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/arminbiere/kissat.git /tmp/r25kissat
          git -C /tmp/r25kissat fetch -q --depth 1 origin 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          git -C /tmp/r25kissat checkout -q --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          test "$(git -C /tmp/r25kissat rev-parse HEAD)" = 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          (cd /tmp/r25kissat && ./configure && make -j2 >/tmp/r25-kissat-build.log)
          cp /tmp/r25kissat/build/kissat bin/kissat_solver
          git clone -q --depth 1 --branch rel-3.0.1 https://github.com/arminbiere/cadical.git /tmp/r25cadical
          git -C /tmp/r25cadical rev-parse HEAD > pinned/cadical-commit.txt
          (cd /tmp/r25cadical && ./configure && make -j2 >/tmp/r25-cadical-build.log)
          cp /tmp/r25cadical/build/cadical bin/cadical_solver
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -I /tmp/r25cadical/src research/drnas-sat-v7-8/v78_single.cpp /tmp/r25cadical/build/libcadical.a -o bin/v78_single -pthread -ldl -lz
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra research/drnas-sat-v7-8/v1531_nohang.cpp -o bin/v1531_nohang
          chmod +x bin/*
          (cd bin && sha256sum * > binaries.sha256 && sha256sum -c binaries.sha256)
          bin/kissat_solver --version
          bin/cadical_solver --version
      - name: Freeze all 24 new XOR, 6 original polynomials and 2 official controls
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r25_xor_algebra_cup.py prepare --pinned pinned --outdir input
          test "$(python3 -c 'import json;print(len(json.load(open("input/manifest.json"))["cases"]))')" = 32
          (cd input && sha256sum *.cnf > original_cnf_sha256.txt && sha256sum -c original_cnf_sha256.txt)
          sha256sum input/manifest.json >> pinned_sources.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: r25-build-verified-binaries
          path: bin/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: r25-frozen-32-cnf-inputs
          path: input/
          if-no-files-found: error
  smoke:
    needs: build_freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r25-build-verified-binaries
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: r25-frozen-32-cnf-inputs
          path: input
      - name: Fast baseline probe on fixed shard 0, 5s cutoff and one repetition
        run: |
          set -euo pipefail
          chmod +x bin/kissat_solver bin/cadical_solver bin/v78_single bin/v1531_nohang
          (cd bin && sha256sum -c binaries.sha256)
          python3 -u experiments/drnas_v16/r25_xor_algebra_cup.py run --inputs input --bin bin --shard 0 --timeout 5 --repeats 1 --outdir smoke
          echo "## R25 early probe; 8 cases, five modes, ONE repeat, 5s cap" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          for row in json.load(open("smoke/rows.json")):
              print("###",row["case"]["id"])
              print("| Solver | Outcome | Seconds |")
              print("|---|---|---:|")
              for x in row["trials"]:
                  print(f'| {x["mode"]} | {x["status"]} | {x["seconds"]:.4f} |')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r25-smoke-early-results
          path: smoke/
          if-no-files-found: warn
  measure:
    needs: build_freeze
    name: r25-shard-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r25-build-verified-binaries
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: r25-frozen-32-cnf-inputs
          path: input
      - name: Verify original source and four exact binary fingerprints
        run: |
          set -euo pipefail
          (cd input && sha256sum -c original_cnf_sha256.txt)
          (cd bin && sha256sum -c binaries.sha256)
          chmod +x bin/kissat_solver bin/cadical_solver bin/v78_single bin/v1531_nohang
      - name: Frozen paired Cup 15 s cap, 2 repetitions, 5 strategies
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r25_xor_algebra_cup.py run --inputs input --bin bin --shard "$SHARD" --timeout 15 --repeats 2 --outdir results
          test -s results/rows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r25-shard-${{ matrix.shard }}
          path: results/
          if-no-files-found: warn
  final_audit:
    needs: measure
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r25-frozen-32-cnf-inputs
          path: input
      - uses: actions/download-artifact@v4
        with:
          pattern: r25-shard-*
          path: combined
      - name: Aggregate 320 paired experiments, detect missing shards or incorrect answers
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r25_xor_algebra_cup.py aggregate --inputs input --combined combined --out r25-results.json --md r25-results.md
          cat r25-results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R25-XOR-ALGEBRA-CUP-FINAL
          path: |
            input/manifest.json
            r25-results.json
            r25-results.md
          if-no-files-found: warn
