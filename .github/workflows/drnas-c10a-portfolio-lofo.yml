name: DRNAS C10A — structural Kissat CaDiCaL 31SHA LOFO portfolio research
on:
  push:
    branches: [experiment/drnas-c10-structural-kissat-cadical-20261108]
    paths: ['.github/workflows/drnas-c10a-portfolio-lofo.yml', 'research/c10a_structural_portfolio.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-c10a-31sha-source-only-development-audit
  cancel-in-progress: false
jobs:
  LOFO:
    name: Recover prior C8D/C9c audited original SHA and test source-only structural rule LOFO
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore original 19 C8D 15s and 12 C9c 60s paired PAR2 and 12 C9c original CNFs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p c10a_prior_c8d c10a_prior_c9c_final c10a_prior_c9c_sources c10a_out
          gh run download 42526134599 -R Frane12/AndroidGameTest \
            -n DRNAS-C8D-380-PAR2-ORIGINAL-SHA19-BVE-EARLY-CDCL -D c10a_prior_c8d
          gh run download 42529378612 -R Frane12/AndroidGameTest \
            -n DRNAS-C9C-OFFICIAL26-10PLUS-SHA-60S-E2E-PAR2-SELECTOR-AUDIT -D c10a_prior_c9c_final
          gh run download 42529378612 -R Frane12/AndroidGameTest \
            -n c9c-new-official-2026-10plus-source-only-frozen-before-any-run -D c10a_prior_c9c_sources
          test -s c10a_prior_c8d/report.json
          test -s c10a_prior_c9c_final/c9c_out/report.json
          (cd c10a_prior_c9c_sources/c9c_official && sha256sum -c source.sha256)
          python3 -m py_compile research/c10a_structural_portfolio.py
      - name: Normalize cross-cap original SHA paired results and freeze risk-limited 31SHA rule
        run: |
          set -euo pipefail
          python3 -u research/c10a_structural_portfolio.py | tee c10a_out/audit.log
          grep -q '^C10A_FINAL' c10a_out/audit.log
          grep '^C10A_FINAL' c10a_out/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-C10A-31SHA-STRUCTURAL-PORTFOLIO-LOFO-AUDIT
          retention-days: 30
          if-no-files-found: warn
          path: |
            c10a_out/report.json
            c10a_out/audit.log
