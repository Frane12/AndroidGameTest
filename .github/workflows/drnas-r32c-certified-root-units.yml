name: DRNAS R32c native GF2 certified active root units
on:
  push:
    branches: [experiment/drnas-r32c-certified-root-units-20261103]
    paths:
      - '.github/workflows/drnas-r32c-certified-root-units.yml'
      - 'experiments/drnas_v16/patch_r32c_active_root.py'
      - 'experiments/drnas_v16/r32c_active_unit_benchmark.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r32c-certified-root-v1
  cancel-in-progress: true
jobs:
  freeze_build:
    name: Freeze 93 originals, compile pinned Kissat, prove safe native unit activation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check frozen benchmark scripts
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/patch_r32b_native_shadow.py experiments/drnas_v16/patch_r32c_active_root.py experiments/drnas_v16/r32c_active_unit_benchmark.py
      - uses: actions/download-artifact@v4
        with:
          name: r32b-51-sha-original-cnfs
          run-id: 41632475401
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-r32b
      - name: Verify prior SHA and generate 42 new source SHA identities
        run: |
          set -euo pipefail
          (cd prior-r32b && sha256sum -c cnf.sha256)
          python3 -u experiments/drnas_v16/r32c_active_unit_benchmark.py freeze --prior prior-r32b --dest frozen
          (cd frozen && sha256sum -c cnf.sha256)
          python3 - <<'PY'
          import json
          m=json.load(open("frozen/manifest.json"))
          assert len(m["cases"])==93
          assert sum(x["cohort"]=="fresh_synthetic_holdout" for x in m["cases"])==42
          print("R32C_HOLDOUT_SHA_LOCKED",len(m["cases"]))
          PY
      - name: Compile identical clean and experimental native Kissat
        run: |
          set -euo pipefail
          git clone -q https://github.com/arminbiere/kissat.git /tmp/r32c-clean
          git -C /tmp/r32c-clean checkout -q --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          test "$(git -C /tmp/r32c-clean rev-parse HEAD)" = 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          cp -r /tmp/r32c-clean /tmp/r32c-native
          python3 -u experiments/drnas_v16/patch_r32b_native_shadow.py --kissat-root /tmp/r32c-native
          python3 -u experiments/drnas_v16/patch_r32c_active_root.py --kissat-root /tmp/r32c-native
          (cd /tmp/r32c-clean && ./configure && make -j2 > /tmp/r32c-clean-build.log)
          (cd /tmp/r32c-native && ./configure && make -j2 > /tmp/r32c-native-build.log)
          mkdir -p compiled
          cp /tmp/r32c-clean/build/kissat compiled/clean
          cp /tmp/r32c-native/build/kissat compiled/native
          chmod +x compiled/*
          (cd compiled && sha256sum clean native > binaries.sha256 && sha256sum -c binaries.sha256)
      - name: Prove correct root intervention and strict abstention on controls
        run: |
          set -euo pipefail
          for family in consistent_visible consistent_hidden consistent_mixed root_unsat xor_decoy; do
            set +e
            R32B_MODE=active compiled/native "frozen/$family"_00.cnf > "$family.active.log"
            status=$?
            set -e
            test "$status" -eq 10 -o "$status" -eq 20
            grep -q '^c R32C_ACTIVE signal=' "$family.active.log"
            grep -q '^c R32B_PROBE mark=9999 ' "$family.active.log"
            grep -q '^c R32B_FINAL status=' "$family.active.log"
            grep '^c R32C_ACTIVE' "$family.active.log"
          done
          for family in consistent_visible consistent_hidden consistent_mixed; do
            grep -Eq '^c R32C_ACTIVE signal=APPLIED injected=[1-9][0-9]* certified=[1-9][0-9]*$' "$family.active.log"
            grep -Eq '^c R32C_INJECTED_LITS count=[1-9][0-9]* lits=' "$family.active.log"
          done
          for family in root_unsat xor_decoy; do
            grep -q '^c R32C_ACTIVE signal=' "$family.active.log"
            if grep -q '^c R32C_INJECTED_LITS' "$family.active.log"; then
              echo "UNSAFE R32C injection on $family" >&2
              exit 1
            fi
          done
          echo R32C_PREPARSER_NATIVE_CERTIFIED_ACTIVATION_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: r32c-93-frozen-sources
          path: frozen/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: r32c-pinned-clean-native
          path: compiled/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r32c-preflight
          path: '*.active.log'
          if-no-files-found: warn
  paired:
    needs: freeze_build
    name: r32c-shard-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r32c-93-frozen-sources
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: r32c-pinned-clean-native
          path: compiled
      - name: Check frozen originals and binary identities
        run: |
          set -euo pipefail
          chmod +x compiled/clean compiled/native
          (cd frozen && sha256sum -c cnf.sha256)
          (cd compiled && sha256sum -c binaries.sha256)
      - name: Pair clean, native OFF, R32b passive and R32c certified active
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r32c_active_unit_benchmark.py measure \
            --inputs frozen --clean compiled/clean --native compiled/native \
            --shard "$SHARD" --outdir results | tee r32c-live.log
          test -s results/rows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r32c-shard-${{ matrix.shard }}
          path: |
            results/
            r32c-live.log
          if-no-files-found: warn
  audit:
    needs: [freeze_build, paired]
    if: always()
    name: Validate 744 runs, every injected literal and no-op policy invariance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r32c-93-frozen-sources
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: r32c-shard-*
          path: combined
      - name: Calculate verified benchmark results
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r32c_active_unit_benchmark.py aggregate \
            --inputs frozen --combined combined --output r32c-results.json --report r32c-results.md
          cat r32c-results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R32C-CERTIFIED-ROOT-ACTIVE-FINAL-744
          path: |
            r32c-results.json
            r32c-results.md
            frozen/manifest.json
          if-no-files-found: warn
