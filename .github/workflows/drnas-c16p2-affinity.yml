name: DRNAS C16P2A — two-process CPU affinity fast-poll causal 288 paired 30s
# Frozen V15.3.1 untouched; historical C15D originals, not claimed blind.
on:
  push:
    branches: [experiment/drnas-c16p2-affinity-causal-20261109]
    paths:
      - '.github/workflows/drnas-c16p2-affinity.yml'
      - 'research/c16p2_affinity_native.c'
      - 'research/c16p2_affinity_benchmark.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-c16p2a-causal-20261109
  cancel-in-progress: false
jobs:
  prepare:
    name: Compile native C11 portfolio, verify original SHA and pinned solvers, adversarial safety smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore exact C15D original-SHA and pinned reference binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p c16p2a_bin c16p2a_out prior_c13
          gh run download 42541912605 -R Frane12/AndroidGameTest -n c15d-frozen-originals-and-pinned-backends -D .
          gh run download 42535300094 -R Frane12/AndroidGameTest -n c12-pinned-backends-and-frozen-official-SHA -D prior_c12
          gh run download 42537515529 -R Frane12/AndroidGameTest -n c13-pinned-backends-and-frozen-official-SHA -D prior_c13
          sha256sum -c c15d_out/binary.sha256
          chmod +x built/bin/kissat_4_0_4 c8c/bin/plain c8c/bin/instrumented
          python3 -m py_compile research/c16p2_affinity_benchmark.py
          python3 research/c16p2_affinity_benchmark.py prepare
          python3 research/c16p2_affinity_benchmark.py verify
      - name: Strict C11 compilation, 2-core affinity and adversarial SAT UNSAT proofs-only smoke
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic research/c16p2_affinity_native.c -o c16p2a_bin/drnas_c16p2a
          chmod +x c16p2a_bin/drnas_c16p2a
          python3 -u research/c16p2_affinity_benchmark.py smoke
          python3 - <<'PY'
          import subprocess,json,pathlib,tempfile
          with tempfile.TemporaryDirectory() as td:
              p=pathlib.Path(td)
              cnf=p/"true.cnf";cnf.write_text("p cnf 3 3\n1 0\n2 0\n3 0\n")
              kissat=str(pathlib.Path("built/bin/kissat_4_0_4").resolve())
              cadical=str(pathlib.Path("c8c/bin/instrumented").resolve())
              for arm in ("p2","p2pin","p2fast","p2reverse"):
                  r=subprocess.run(["c16p2a_bin/drnas_c16p2a",arm,str(cnf),
                     kissat,cadical,"4","SAT"],text=True,capture_output=True,timeout=7)
                  assert r.returncode==10,(arm,r.stderr,r.stdout)
                  v=json.loads(r.stdout.split("C16P2A_RESULT ")[1])
                  assert v["sat_original_verified"] and v["processes"]==2,v
                  assert (v["poll_us"]==250)==(arm=="p2fast"),v
                  assert v["pinned"]==(arm=="p2pin"),v
                  if arm=="p2pin":
                      ids=[w["pinned_cpu"] for w in v["workers"]]
                      assert len(set(ids))==2 and min(ids)>=0,v
                  if arm=="p2reverse":
                      assert [w["name"] for w in v["workers"]]==["novivify","kissat"],v
              print("C16P2A_PIN_FASTPOLL_REVERSE_SAT_PASSED")
          PY

          python3 - <<'PY'
          import pathlib,tempfile,subprocess,json
          with tempfile.TemporaryDirectory() as td:
              p=pathlib.Path(td)
              f=p/"formula.cnf";f.write_text("p cnf 2 2\n1 0\n2 0\n")
              good=p/"good.sh";good.write_text("#!/bin/sh\nprintf 's SATISFIABLE\\nv 1 2 0\\n'; exit 10\n");good.chmod(0o755)
              bad=p/"bad.sh";bad.write_text("#!/bin/sh\nprintf 's SATISFIABLE\\nv -1 2 0\\n'; exit 10\n");bad.chmod(0o755)
              args=["c16p2a_bin/drnas_c16p2a","p2",str(f),str(good),str(good),"2","SAT"]
              ok=subprocess.run(args,text=True,capture_output=True,timeout=6)
              assert ok.returncode==10 and json.loads(ok.stdout.split("C16P2A_RESULT ")[1])["sat_original_verified"],ok
              args[3]=str(bad);args[4]=str(bad)
              wrong=subprocess.run(args,text=True,capture_output=True,timeout=6)
              assert wrong.returncode==3 and json.loads(wrong.stdout.split("C16P2A_RESULT ")[1])["invalid_result_detected"],wrong
              print("C16P2A_FALSE_SAT_REJECT_AND_PARALLEL_SAT_VERIFY_PASS")
          PY
          sha256sum research/c16p2_affinity_native.c c16p2a_bin/drnas_c16p2a built/bin/kissat_4_0_4 c8c/bin/instrumented > c16p2a_bin/source-and-executables.sha256
          sha256sum -c c16p2a_bin/source-and-executables.sha256
          nproc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c16p2a-pinned-sources-binaries-and-selftest
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn
          path: |
            c16p2a_bin/drnas_c16p2a
            c16p2a_bin/source-and-executables.sha256
            c16p2a_out/smoke*.cnf
            c15d_sources/*.cnf
            c15d_sources/manifest.json
            prior_c12/c12_sources/manifest.json
            prior_c12/c12_sources/*.cnf
            prior_c13/c13_sources/manifest.json
            prior_c13/c13_sources/*.cnf
            c16p2a_sources/manifest.json
            c15d_out/binary.sha256
            built/bin/kissat_4_0_4
            c8c/bin/instrumented
  paired:
    needs: prepare
    name: C16P2A two-core affinity poll and reverse 30s shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: c16p2a-pinned-sources-binaries-and-selftest
          path: .
      - name: Verify all original SHA and native binaries before every shard
        run: |
          set -euo pipefail
          chmod +x c16p2a_bin/drnas_c16p2a built/bin/kissat_4_0_4 c8c/bin/instrumented
          sha256sum -c c16p2a_bin/source-and-executables.sha256
          python3 research/c16p2_affinity_benchmark.py verify
      - name: Run paid native parallel solver race and log wall CPU memory and PAR2
        run: |
          set -euo pipefail
          mkdir -p c16p2a_out
          python3 -u research/c16p2_affinity_benchmark.py shard --shard ${{ matrix.shard }} | tee c16p2a_out/shard-${{ matrix.shard }}.log
          grep -q '^C16P2A_SHARD_PASS ${{ matrix.shard }} 36
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c16p2a-shard-${{ matrix.shard }}
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn
          path: |
            c16p2a_out/shard-${{ matrix.shard }}.log
            c16p2a_out/shard-${{ matrix.shard }}.json
  audit:
    needs: paired
    name: Fail-closed 288 paired real E2E with original SAT models and wall-vs-CPU summary
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: c16p2a-pinned-sources-binaries-and-selftest
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: c16p2a-shard-*
          merge-multiple: true
          path: c16p2a_out
      - name: SHA-locked paired audit with cohort split and extra resource cost
        run: |
          set -euo pipefail
          chmod +x c16p2a_bin/drnas_c16p2a built/bin/kissat_4_0_4 c8c/bin/instrumented
          sha256sum -c c16p2a_bin/source-and-executables.sha256
          python3 research/c16p2_affinity_benchmark.py verify
          python3 -u research/c16p2_affinity_benchmark.py audit | tee c16p2a_out/audit.log
          grep -q '^C16P2A_FINAL' c16p2a_out/audit.log
          grep '^C16P2A_FINAL' c16p2a_out/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-C16P2A-NATIVE-C-288-PAIRED-2PROCESS-30S-PAR2-AUDIT
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn
          path: |
            c16p2a_out/report.json
            c16p2a_out/audit.log
            c16p2a_out/shard-*.json
            c16p2a_out/shard-*.log
            c16p2a_bin/source-and-executables.sha256
            c15d_sources/manifest.json
