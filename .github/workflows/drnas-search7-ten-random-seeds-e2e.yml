name: DRNAS SEARCH7 - ten fixed pseudorandom native CDCL priorities SHA paired stability
run-name: SEARCH7 12 frozen SEARCH6 original SHA x 15 arms x 2 repeats 12s 360 oneCPU native E2E
on:
  push:
    branches: [experiment/drnas-search7-ten-fixed-random-orderings-20261110]
    paths:
      - .github/workflows/drnas-search7-ten-random-seeds-e2e.yml
      - research/drnas_search7_fixed_random_e2e.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-search7-${{ github.ref }}
  cancel-in-progress: false
jobs:
  freeze:
    name: Freeze 12 original SEARCH6 SHA and verify 10 distinct deterministic ranking maps each
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Restore exact frozen original CNF native C++ engine and historic SHA registries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42789740518 -R Frane12/AndroidGameTest -n SEARCH6-12SHA-4STRATA-SOURCEONLY-NATIVE-FROZEN -D .
          test -s mre_search6/manifest.json
          test "$(find mre_search6/cases -maxdepth 1 -name '*.cnf' | wc -l)" -eq 12
          test -s mre_search3/bin/search3_cadical
          test -s mre_search2/bin/search1_relabel
          test -s mre_equiv6/bin/cadical_3_0_1
          test -s built/bin/kissat_4_0_4
          chmod +x mre_search3/bin/search3_cadical mre_search2/bin/search1_relabel mre_equiv6/bin/cadical_3_0_1 built/bin/kissat_4_0_4
      - name: Audit unmodified SEARCH6 original SHA and preregister distinct 10 random ranks per source
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          python3 -m py_compile research/drnas_search7_fixed_random_e2e.py
          python3 -u research/drnas_search6_stratified_e2e.py verify
          python3 -u research/drnas_search7_fixed_random_e2e.py freeze | tee mre_search7/freeze.log
          grep -q '^SEARCH7_FROZEN ' mre_search7/freeze.log
          test "$(grep -c '^SEARCH7_MAP_FREEZE ' mre_search7/freeze.log)" -eq 12
          python3 -u research/drnas_search7_fixed_random_e2e.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SEARCH7-12-SHA-120-UNIQUE-RANDOM-RANK-HASH-AND-NATIVE-BINARIES
          retention-days: 21
          if-no-files-found: error
          path: |
            mre_search7/manifest.json
            mre_search7/freeze.log
            mre_search6/manifest.json
            mre_search6/cases/*.cnf
            mre_search3/bin/search3_cadical
            mre_search2/bin/search1_relabel
            mre_equiv6/bin/cadical_3_0_1
            built/bin/kissat_4_0_4
            mre_equiv6/manifest.json
            prior_search2/mre_equiv13/manifest.json
            prior_hist/search4/mre_search4_fresh/manifest.json
            prior_hist/search5/mre_search5/manifest.json
            mre5/lib/libcryptominisat5.so.5.11
  paired:
    name: SEARCH7 original SHA random 10 seeds + math + baseline 60 paired E2E shard ${{ matrix.shard }}
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: SEARCH7-12-SHA-120-UNIQUE-RANDOM-RANK-HASH-AND-NATIVE-BINARIES
          path: .
      - name: Distinct fixed seed same map in both repeats, original SAT witness, CPU E2E
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_search3/bin/search3_cadical mre_search2/bin/search1_relabel mre_equiv6/bin/cadical_3_0_1 built/bin/kissat_4_0_4
          python3 -u research/drnas_search7_fixed_random_e2e.py verify
          python3 -u research/drnas_search7_fixed_random_e2e.py shard --shard ${{ matrix.shard }} | tee mre_search7/shard-${{ matrix.shard }}.log
          grep -q '^SEARCH7_SHARD_PASS ' mre_search7/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SEARCH7-shard-${{ matrix.shard }}
          retention-days: 21
          if-no-files-found: error
          path: |
            mre_search7/shard-${{ matrix.shard }}.json
            mre_search7/shard-${{ matrix.shard }}.log
  audit:
    name: SEARCH7 360 original SHA paired PAR2 unique fixed-rank reproducibility audit
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: SEARCH7-12-SHA-120-UNIQUE-RANDOM-RANK-HASH-AND-NATIVE-BINARIES
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: SEARCH7-shard-*
          merge-multiple: true
          path: mre_search7
      - name: Map SHA stable both repeats, 360 original SAT/UNSAT PAR2, no LRAT overclaim
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_search3/bin/search3_cadical mre_search2/bin/search1_relabel mre_equiv6/bin/cadical_3_0_1 built/bin/kissat_4_0_4
          for i in 0 1 2 3 4 5; do test -s "mre_search7/shard-$i.json"; done
          python3 -u research/drnas_search7_fixed_random_e2e.py verify
          python3 -u research/drnas_search7_fixed_random_e2e.py audit | tee mre_search7/audit.log
          grep -q '^SEARCH7_FINAL ' mre_search7/audit.log
          grep '^SEARCH7_FINAL ' mre_search7/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-SEARCH7-360-E2E-10-FIXED-RANDOM-RANKS-PAR2-REPRODUCIBILITY-FINAL
          retention-days: 30
          path: |
            mre_search7/manifest.json
            mre_search7/report.json
            mre_search7/audit.log
            mre_search7/shard-*.json
