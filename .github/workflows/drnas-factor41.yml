name: DRNAS FACTOR4.1 budgeted structural gate
run-name: FACTOR4.1 32 frozen structural + flat200 regression 3 native arms 2 reps oneCPU
on:
  push:
    branches: [experiment/drnas-factor41-budgeted-20261110]
    paths:
      - research/drnas_factor41_native.cpp
      - research/drnas_factor41_benchmark.py
      - .github/workflows/drnas-factor41.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  factor41:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build native FACTOR4.1 and check Python
        run: |
          set -euo pipefail
          mkdir -p mre_factor41/bin
          python3 -m py_compile research/drnas_factor41_benchmark.py
          g++ -std=c++17 -O2 -Wall -Wextra research/drnas_factor41_native.cpp -o mre_factor41/bin/drnas_factor41
      - name: 204 paired frozen native A C D trials oneCPU
        run: |
          set -euo pipefail
          taskset -c "$(taskset -pc $$ | sed 's/.*: //' | cut -d, -f1 | cut -d- -f1)" \
            python3 -u research/drnas_factor41_benchmark.py | tee mre_factor41/benchmark.log
          grep -q '^FACTOR41_FINAL ' mre_factor41/benchmark.log
          grep '^FACTOR41_FINAL ' mre_factor41/benchmark.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-FACTOR41-204-FROZEN-ONECPU-AUDIT
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_factor41/audit.json
            mre_factor41/*.cnf
            mre_factor41/*.log
            mre_factor41/bin/drnas_factor41
