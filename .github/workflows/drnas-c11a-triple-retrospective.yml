name: DRNAS C11a — triple backend source-only 39 SHA retrospective model freeze
# v2: C8D per-source rows carry SHA but do not always carry a GBD
on:
  push:
    branches: [experiment/drnas-c11-triple-portfolio-20261109]
    paths: ['.github/workflows/drnas-c11a-triple-retrospective.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    name: Independently recover frozen C8D C9c C10b historical PAR2 and freeze three-way policy
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore 39 source scores from original completed GitHub Actions audits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p c11_dev_c8d c11_dev_c9c c11_dev_c10b c11a_out
          gh run download 42526134599 -R Frane12/AndroidGameTest -n DRNAS-C8D-380-PAR2-ORIGINAL-SHA19-BVE-EARLY-CDCL -D c11_dev_c8d
          gh run download 42529378612 -R Frane12/AndroidGameTest -n DRNAS-C9C-OFFICIAL26-10PLUS-SHA-60S-E2E-PAR2-SELECTOR-AUDIT -D c11_dev_c9c
          gh run download 42532482392 -R Frane12/AndroidGameTest -n DRNAS-C10B-OFFICIAL2026-8PLUS-SHA-CADICAL-KISSAT-C9-C10-PAR2-AUDIT -D c11_dev_c10b
          test -s c11_dev_c8d/report.json
          test -s c11_dev_c9c/c9c_out/report.json
          test -s c11_dev_c10b/c10b_out/report.json
          test -s c11_dev_c10b/c10a_reference/report.json
      - name: 3-strategy original source-only retrospective audit; separate 15s 60s PAR2; freeze future policy
        run: |
          set -euo pipefail
          python3 -m py_compile research/c11a_triple_retrospective.py
          python3 -u research/c11a_triple_retrospective.py | tee c11a_out/audit.log
          grep -q '^C11A_FINAL' c11a_out/audit.log
          grep '^C11A_FINAL' c11a_out/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-C11A-39SHA-TRIPLE-SOLVER-SOURCE-ONLY-FROZEN-DEVELOPMENT
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6
          path: |
            c11a_out/report.json
            c11a_out/audit.log
