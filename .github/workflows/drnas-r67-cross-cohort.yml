name: DRNAS R67 frozen structural attribution R65 vs R66
on:
  push:
    branches: [experiment/drnas-r67-cross-cohort-20261103]
    paths:
      - '.github/workflows/drnas-r67-cross-cohort.yml'
      - 'experiments/drnas_v16/r67_cross_cohort.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r67-cross-cohort-20261103
  cancel-in-progress: false
jobs:
  structural-audit:
    name: Frozen structural attribution with zero solver reruns
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-R65-XOR-CNF-FEEDBACK-FINAL
          run-id: 41714216310
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r65
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-R66-R65-BLIND-SHORT-AUDIT-RECOVERED
          run-id: 41718154722
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r66
      - name: Verify frozen cohorts and attribute XOR benefit over R28
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/r67_cross_cohort.py
          python3 -u experiments/drnas_v16/r67_cross_cohort.py --r65 r65 --r66 r66 --json r67-final.json --md r67-final.md
          cat r67-final.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DRNAS-R67-CROSS-COHORT-ATTRIBUTION-FINAL
          path: |
            r67-final.json
            r67-final.md
          if-no-files-found: error
          retention-days: 90
