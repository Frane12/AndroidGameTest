name: DRNAS Audacity 4 Android ARM64

on:
  push:
    branches:
      - experiment/drnas-native-audacity4-android
    paths:
      - 'audacity/**'
      - '.github/workflows/drnas-audacity4-android-arm64.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Preflight stage; build attempts native Audacity after configure'
        required: true
        default: configure
        type: choice
        options:
          - configure
          - build

permissions:
  contents: read

concurrency:
  group: audacity4-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-configure:
    name: Original Audacity / Qt 6.10 / Android arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Checkout DRNAS workspace
        uses: actions/checkout@v4

      - name: Checkout actual Audacity 4.0.1 source and submodules
        uses: actions/checkout@v4
        with:
          repository: audacity/audacity
          ref: Audacity-4.0.1
          path: audacity-source
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Python for Qt installer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The hosted ubuntu-24.04 runner already has modern Android commandline-tools.
      # setup-android@v3 currently calls "sdkmanager tools" (removed legacy SDK
      # package) and fails before NDK/Qt configuration even starts.
      - name: Use runner Android SDK command-line tools
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          test -d "$SDK_ROOT" || { echo "::error::Android SDK root not present: $SDK_ROOT"; exit 40; }
          if [[ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -mindepth 3 -maxdepth 3 -name sdkmanager -type f | sort -V | tail -1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo "::error::No runnable sdkmanager"; exit 41; }
          echo "DRNAS_SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          mkdir -p audacity-logs
          echo "Using SDK: $SDK_ROOT" | tee audacity-logs/android-sdk.log
          "$SDKMANAGER" --version 2>&1 | tee -a audacity-logs/android-sdk.log

      - name: Install Android SDK API 36 and NDK r27c
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Initial disk space:" | tee -a audacity-logs/android-sdk.log
          df -h . | tee -a audacity-logs/android-sdk.log
          yes | "$DRNAS_SDKMANAGER" --licenses >audacity-logs/android-licenses.log 2>&1 || true
          "$DRNAS_SDKMANAGER" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 2>&1 | tee -a audacity-logs/android-sdk.log
          test -d "$ANDROID_HOME/ndk/27.2.12479018" || { echo "::error::Android NDK r27c install failed"; exit 42; }

      - name: Prepare native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libgl1 libegl1 libxcb-cursor0 libxkbcommon-x11-0
          python -m pip install --upgrade pip aqtinstall

      - name: Install Qt 6.10 desktop HOST tools
        shell: bash
        run: |
          set -o pipefail
          mkdir -p audacity-logs
          echo 'Qt desktop architectures:' | tee audacity-logs/qt-host.log
          python -m aqt list-qt linux desktop --arch 6.10.0 2>&1 | tee -a audacity-logs/qt-host.log
          python -m aqt install-qt linux desktop 6.10.0 linux_gcc_64 -O "$HOME/Qt" \
            --modules qt5compat qtnetworkauth qtshadertools qtstatemachine 2>&1 | tee -a audacity-logs/qt-host.log

      - name: Install Qt 6.10 Android arm64 TARGET libraries
        shell: bash
        run: |
          set -o pipefail
          mkdir -p audacity-logs
          echo 'Qt Android architectures:' | tee audacity-logs/qt-android.log
          python -m aqt list-qt linux android --arch 6.10.0 2>&1 | tee -a audacity-logs/qt-android.log
          python -m aqt install-qt linux android 6.10.0 android_arm64_v8a -O "$HOME/Qt" \
            --modules qt5compat qtnetworkauth qtshadertools qtstatemachine 2>&1 | tee -a audacity-logs/qt-android.log

      - name: Configure genuine Audacity 4 Android target
        id: probe
        shell: bash
        env:
          DRNAS_QT_VERSION: 6.10.0
        run: |
          bash audacity/scripts/android-preflight.sh "${{ inputs.stage || 'configure' }}"

      - name: Failure summary
        if: failure()
        shell: bash
        run: |
          echo '## DRNAS Audacity Android failure' >> "$GITHUB_STEP_SUMMARY"
          echo 'Open the failed step and download diagnostics below. A failed configure is an expected first porting milestone, not a compiled APK.' >> "$GITHUB_STEP_SUMMARY"
          for f in audacity-logs/*.log; do
            if [[ -f "$f" ]]; then
              echo "### $f (last 40 lines)" >> "$GITHUB_STEP_SUMMARY"
              echo '\`\`\`text' >> "$GITHUB_STEP_SUMMARY"
              tail -n 40 "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Preserve diagnostic logs (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-audacity4-android-arm64-diagnostics
          path: |
            audacity-logs/
            audacity-build/CMakeCache.txt
            audacity-build/CMakeFiles/CMakeConfigureLog.yaml
            audacity-build/CMakeFiles/CMakeOutput.log
            audacity-build/CMakeFiles/CMakeError.log
          if-no-files-found: warn
          retention-days: 14
