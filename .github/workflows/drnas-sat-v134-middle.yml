name: DRNAS V13.4 - Predeclared Structural Difficulty Ladders
on:
  push:
    branches: [experiment/drnas-v134-middle-difficulty-20261101]
    paths:
      - '.github/workflows/drnas-sat-v134-middle.yml'
      - 'research/drnas-sat-v7-8/v134_constructive.py'
      - 'research/drnas-sat-v7-8/v134_evaluate.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deterministic generator, fixed predictor and evaluation selftest
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/v134_constructive.py research/drnas-sat-v7-8/v134_evaluate.py
          python3 research/drnas-sat-v7-8/v134_evaluate.py selftest
      - name: Freeze five mathematical families across six fixed sizes
        run: |
          set -euo pipefail
          mkdir -p frozen
          python3 -u research/drnas-sat-v7-8/v134_evaluate.py freeze \
            --out frozen/v134_manifest.json
          (cd frozen && sha256sum v134_manifest.json > v134_manifest.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-V134-frozen-30-structural-ladders
          path: frozen/
          if-no-files-found: error

  benchmark:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5]
    name: v134-shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V134-frozen-30-structural-ladders
          path: frozen
      - name: Reuse three already-pinned V13.2 solver executables
        uses: actions/download-artifact@v4
        with:
          name: DRNAS-V132-three-pinned-binaries
          run-id: 41256313918
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: bin
      - name: Check input and three binary digests before trials
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v134_manifest.sha256)
          (cd bin && sha256sum -c binaries.sha256)
          chmod +x bin/v132_prefix bin/v132_drnas bin/v132_kissat
      - name: Run SAT/UNSAT benchmark with fixed diagnostic predictor
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/v134_evaluate.py run \
            --manifest frozen/v134_manifest.json --shard "$SHARD" \
            --probe bin/v132_prefix --drnas bin/v132_drnas \
            --kissat bin/v132_kissat --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v134-shard-${{ matrix.shard }}
          path: results/
          if-no-files-found: warn

  audit:
    needs: [freeze,benchmark]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V134-frozen-30-structural-ladders
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: v134-shard-*
          path: combined
      - name: Strict SHA and fixed-rule cohort audit
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v134_manifest.sha256)
          python3 research/drnas-sat-v7-8/v134_evaluate.py audit \
            --manifest frozen/v134_manifest.json --combined combined \
            --out v134_report.json --md v134_report.md
          cat v134_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V134-30-case-structural-ladder-audit
          path: |
            frozen/
            combined/
            v134_report.json
            v134_report.md
          if-no-files-found: warn
