name: DRNAS EQUIV12 - CMS 5.17 native crossover five frozen original SHA one-core
run-name: EQUIV12 5 frozen SHA x 6 arms x 2 reps 15s 60 paired E2E
on:
  push:
    branches: [experiment/drnas-equiv12-cms-native-crossover-20261110]
    paths:
      - .github/workflows/drnas-equiv12-cms-native-crossover.yml
      - research/drnas_equiv12_cms_native_crossover.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-equiv12-${{ github.ref }}
  cancel-in-progress: false
jobs:
  freeze:
    name: Lock unchanged original EQUIV10M5 SHA, build pinned CMS 5.17 and SAT selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Restore exact five SHA and reference solver binaries, untouched
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42729709584 -R Frane12/AndroidGameTest -n equiv10m5-exact-five-SHA-frozen-and-pinned-onecore-binaries -D .
          test -s mre_equiv10m5/manifest.json
          test -s mre_equiv10medium/manifest.json
          test -s mre_equiv9/manifest.json
          test -s mre_x4/bin/native
          test -s built/bin/kissat_4_0_4
          test -s mre_equiv7/bin/cadical_3_0_1
          test -s mre5/lib/libcryptominisat5.so.5.11
          chmod +x mre_x4/bin/native built/bin/kissat_4_0_4 mre_equiv7/bin/cadical_3_0_1
      - name: Compile pinned CryptoMiniSat 5.17 on Linux single solver process
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build git pkg-config libgmp-dev zlib1g-dev
          git clone -q https://github.com/msoos/cryptominisat /tmp/drnas-e12-cms
          git -C /tmp/drnas-e12-cms checkout -q 03954f7f7815ea3984774c95a66e7c224cd25952
          test "$(git -C /tmp/drnas-e12-cms rev-parse HEAD)" = 03954f7f7815ea3984774c95a66e7c224cd25952
          cmake -G Ninja -S /tmp/drnas-e12-cms -B /tmp/drnas-e12-cms/build -DCMAKE_BUILD_TYPE=Release -DNOCADICAL=ON -DENABLE_TESTING=OFF -DNOZLIB=ON
          cmake --build /tmp/drnas-e12-cms/build --target cryptominisat5 -j 2
          mkdir -p mre_equiv12/bin
          cp /tmp/drnas-e12-cms/build/cryptominisat5 mre_equiv12/bin/cryptominisat5
          chmod +x mre_equiv12/bin/cryptominisat5
          mre_equiv12/bin/cryptominisat5 --version
      - name: Six arms original model negative control, freeze & checksum
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          python3 -m py_compile research/drnas_equiv12_cms_native_crossover.py
          python3 -u research/drnas_equiv12_cms_native_crossover.py selftest | tee mre_equiv12/selftest.log
          python3 -u research/drnas_equiv12_cms_native_crossover.py freeze | tee mre_equiv12/freeze.log
          python3 -u research/drnas_equiv12_cms_native_crossover.py verify
          grep -q '^EQUIV12_SELFTEST_PASS ' mre_equiv12/selftest.log
          grep -q '^EQUIV12_FROZEN ' mre_equiv12/freeze.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: equiv12-five-SHA-original-binaries-immutable
          retention-days: 21
          if-no-files-found: error
          path: |
            mre_equiv10m5/manifest.json
            mre_equiv10medium/manifest.json
            mre_equiv9/manifest.json
            mre_equiv9/cases/*.cnf
            mre_equiv7/manifest.json
            mre_x20/manifest.json
            prior_x22/mre_x22/manifest.json
            prior_equiv6/mre_equiv6/manifest.json
            mre_x4/bin/native
            built/bin/kissat_4_0_4
            mre_equiv7/bin/cadical_3_0_1
            mre5/lib/libcryptominisat5.so.5.11
            mre_equiv12/bin/cryptominisat5
            mre_equiv12/manifest.json
            mre_equiv12/freeze.log
            mre_equiv12/selftest.log
  paired:
    name: Single original SHA paired 12 E2E (CMS Native CaDiCaL Kissat) shard ${{ matrix.shard }}
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0,1,2,3,4]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: equiv12-five-SHA-original-binaries-immutable
          path: .
      - name: Original SHA-verified matched six-arm 1CPU end-to-end
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_equiv12/bin/cryptominisat5 mre_x4/bin/native built/bin/kissat_4_0_4 mre_equiv7/bin/cadical_3_0_1
          python3 -u research/drnas_equiv12_cms_native_crossover.py verify
          python3 -u research/drnas_equiv12_cms_native_crossover.py shard --shard ${{ matrix.shard }} | tee mre_equiv12/shard-${{ matrix.shard }}.log
          grep -q '^EQUIV12_SHARD_PASS ${{ matrix.shard }} 12$' mre_equiv12/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: equiv12-shard-${{ matrix.shard }}
          retention-days: 21
          path: |
            mre_equiv12/shard-${{ matrix.shard }}.json
            mre_equiv12/shard-${{ matrix.shard }}.log
  audit:
    name: Final 60 SHA paired PAR2 actual CPU/wall source witnesses strict UNSAT
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: equiv12-five-SHA-original-binaries-immutable
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: equiv12-shard-*
          path: mre_equiv12
          merge-multiple: true
      - name: Audit matched samples, prove only originally verified statuses
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_equiv12/bin/cryptominisat5 mre_x4/bin/native built/bin/kissat_4_0_4 mre_equiv7/bin/cadical_3_0_1
          python3 -u research/drnas_equiv12_cms_native_crossover.py audit | tee mre_equiv12/audit.log
          grep -q '^EQUIV12_FINAL ' mre_equiv12/audit.log
          grep '^EQUIV12_FINAL ' mre_equiv12/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-EQUIV12-CMS-NATIVE-60-E2E-FINAL
          retention-days: 30
          path: |
            mre_equiv12/manifest.json
            mre_equiv12/report.json
            mre_equiv12/audit.log
            mre_equiv12/shard-*.json
