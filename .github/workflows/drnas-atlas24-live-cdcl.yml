name: DRNAS ATLAS25 prospective frozen 64 CNFs
run-name: ATLAS25P 64 unseen SHA x 7 arms x 2 reps 10s oneCPU
on:
  push:
    branches: [experiment/drnas-atlas25-prospective-20261111]
    paths:
      - research/drnas_atlas25_prospective.py
      - .github/workflows/drnas-atlas24-live-cdcl.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Compile frozen C++ generators and ATLAS25 live native engine
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_atlas25_build.py research/drnas_atlas25_benchmark.py
          python3 research/drnas_atlas13_generator.py
          python3 research/drnas_atlas15_warm_patch.py
          python3 research/drnas_atlas15_cdcl_patch.py
          python3 research/drnas_atlas1_generate.py --out mre_atlas15/atlas1_table.hpp
          python3 research/drnas_atlas9_export_table.py research/atlas8_reduction_table.jsonl mre_atlas15/atlas8_rules.hpp
          python3 research/drnas_atlas16_build.py
          python3 research/drnas_atlas17_build.py
          python3 research/drnas_atlas19_build.py
          python3 research/drnas_atlas23_build.py
          python3 research/drnas_atlas24_build.py
          python3 research/drnas_atlas25_build.py
          mkdir -p mre_atlas25/bin
          g++ -std=c++17 -O2 -I mre_atlas25 -I mre_atlas15 mre_atlas25/native.cpp -o mre_atlas25/bin/drnas_atlas25
          mre_atlas25/bin/drnas_atlas25 --selftest
          git clone -q https://github.com/arminbiere/kissat.git /tmp/atlas25-kissat
          git -C /tmp/atlas25-kissat checkout --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          (cd /tmp/atlas25-kissat && ./configure && make -j2)
          cp /tmp/atlas25-kissat/build/kissat mre_atlas25/bin/kissat
          sha256sum mre_atlas25/bin/*
      - uses: actions/upload-artifact@v4
        with:
          name: ATLAS25-BIN
          retention-days: 30
          path: mre_atlas25/bin
  prospective:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ATLAS25-BIN
          path: mre_atlas25/bin
      - name: Prospective SHA locked single CPU shard
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y cryptominisat
          python3 -m pip install --break-system-packages -q remotezip
          chmod +x mre_atlas25/bin/*
          taskset -c "$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')" python3 -u research/drnas_atlas25_prospective.py --shard ${{ matrix.shard }} | tee prospective.log
          grep '^ATLAS25P_FINAL ' prospective.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS25P-SHARD-${{ matrix.shard }}
          retention-days: 60
          path: |
            prospective.log
            mre_atlas25/prospective/manifest.json
            mre_atlas25/prospective/results_*.json
  audit:
    needs: prospective
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ATLAS25P-SHARD-*
          path: audits
          merge-multiple: false
      - name: Aggregate prospective paired PAR2 and verify source isolation
        run: |
          python3 - <<'PY'
          import pathlib,json
          root=pathlib.Path('audits')
          rows=[];shas=set()
          for i in range(8):
              p=root/f'ATLAS25P-SHARD-{i}'/'mre_atlas25'/'prospective'/f'results_{i}.json'
              d=json.loads(p.read_text())
              assert d['shard']==i and len(d['rows'])==112
              rows+=d['rows']
              local={r['sha256'] for r in d['rows']}
              assert len(local)==8 and not shas.intersection(local)
              shas.update(local)
          assert len(shas)==64 and len(rows)==896
          arms=sorted({r['arm'] for r in rows})
          summary={}
          for arm in arms:
              rr=[r for r in rows if r['arm']==arm]
              summary[arm]=dict(trials=len(rr),
                  solved=sum(r['status']!='UNKNOWN' for r in rr),
                  sat_verified=sum(r['status']=='SAT_VERIFIED' for r in rr),
                  unsat_unverified=sum(r['status']=='UNSAT_UNVERIFIED' for r in rr),
                  par2_reported_s=round(sum(r['PAR2_reported_s'] for r in rr),6),
                  par2_verified_s=round(sum(r['PAR2_verified_s'] for r in rr),6),
                  initial_c7=sum(r['telemetry'].get('atlas25_initial_c7',0) for r in rr),
                  early_switches=sum(r['telemetry'].get('atlas25_early_switches',0) for r in rr))
          print('ATLAS25P_AUDIT '+json.dumps(dict(sha=64,trials=896,summary=summary),sort_keys=True))
          print('ATLAS25P_AUDIT_PASS independent_UNSAT_LRAT=false policy_frozen=true')
          PY
