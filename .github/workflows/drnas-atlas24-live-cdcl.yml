name: DRNAS ATLAS26 pigeonhole theorem test
run-name: ATLAS26 pigeonhole theorem vs Kissat A with SAT controls 216 trials
on:
  push:
    branches: [experiment/drnas-atlas26-pigeonhole-proof-20261111]
    paths:
      - research/drnas_atlas26_php.py
      - .github/workflows/drnas-atlas24-live-cdcl.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Compile frozen C++ generators and ATLAS25 live native engine
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_atlas25_build.py research/drnas_atlas25_benchmark.py
          python3 research/drnas_atlas13_generator.py
          python3 research/drnas_atlas15_warm_patch.py
          python3 research/drnas_atlas15_cdcl_patch.py
          python3 research/drnas_atlas1_generate.py --out mre_atlas15/atlas1_table.hpp
          python3 research/drnas_atlas9_export_table.py research/atlas8_reduction_table.jsonl mre_atlas15/atlas8_rules.hpp
          python3 research/drnas_atlas16_build.py
          python3 research/drnas_atlas17_build.py
          python3 research/drnas_atlas19_build.py
          python3 research/drnas_atlas23_build.py
          python3 research/drnas_atlas24_build.py
          python3 research/drnas_atlas25_build.py
          mkdir -p mre_atlas25/bin
          g++ -std=c++17 -O2 -I mre_atlas25 -I mre_atlas15 mre_atlas25/native.cpp -o mre_atlas25/bin/drnas_atlas25
          mre_atlas25/bin/drnas_atlas25 --selftest
          git clone -q https://github.com/arminbiere/kissat.git /tmp/atlas25-kissat
          git -C /tmp/atlas25-kissat checkout --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          (cd /tmp/atlas25-kissat && ./configure && make -j2)
          cp /tmp/atlas25-kissat/build/kissat mre_atlas25/bin/kissat
          sha256sum mre_atlas25/bin/*
      - uses: actions/upload-artifact@v4
        with:
          name: ATLAS25-BIN
          retention-days: 30
          path: mre_atlas25/bin
  php:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ATLAS25-BIN
          path: mre_atlas25/bin
      - name: Exact pigeonhole structural theorem and negative controls
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y cryptominisat
          python3 -m pip install --break-system-packages -q remotezip
          chmod +x mre_atlas25/bin/*
          taskset -c "$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')" python3 -u research/drnas_atlas26_php.py --shard ${{ matrix.shard }} | tee php.log
          grep '^ATLAS26_FINAL ' php.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS26-PHP-${{ matrix.shard }}
          retention-days: 60
          path: |
            php.log
            mre_atlas26/php/results_*.json
  audit:
    needs: php
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ATLAS26-PHP-*
          path: audits
      - name: Aggregate SHA and validate controls
        run: |
          python3 - <<'PY'
          import json,pathlib
          rows=[];seen=set()
          for i in range(4):
              p=pathlib.Path('audits')/f'ATLAS26-PHP-{i}'/'mre_atlas26'/'php'/f'results_{i}.json'
              d=json.loads(p.read_text());assert d['shard']==i and len(d['rows'])==54
              ss={r['sha256'] for r in d['rows']}
              assert len(ss)==9 and not seen.intersection(ss)
              seen|=ss;rows+=d['rows']
          assert len(seen)==36 and len(rows)==216
          arms=sorted({r['arm'] for r in rows});summary={}
          for arm in arms:
              rr=[r for r in rows if r['arm']==arm]
              summary[arm]=dict(par2_s=round(sum(r['PAR2_reported_s'] for r in rr),6),
                  trials=len(rr),sat=sum(r['status']=='SAT_VERIFIED' for r in rr),
                  theorem=sum(r['status']=='UNSAT_THEOREM' for r in rr),
                  unknown=sum(r['status']=='UNKNOWN' for r in rr))
          assert summary['PHP_THEOREM']['theorem']==24
          assert all(r['status']!='UNSAT_THEOREM' for r in rows if r['family']!='pigeonhole_unsat')
          print('ATLAS26_AUDIT '+json.dumps(dict(sha=36,trials=216,summary=summary),sort_keys=True))
          print('ATLAS26_AUDIT_PASS theorem_not_LRAT=true negative_controls=true')
          PY
