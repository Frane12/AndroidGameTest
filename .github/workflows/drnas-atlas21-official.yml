name: DRNAS ATLAS21 official hard CNF pilot
run-name: ATLAS21 official 2024 4 original SHA x 6 arms x 2 reps 30s 1CPU
on:
  push:
    branches: [experiment/drnas-atlas21-official-hard-20261111]
    paths:
      - research/drnas_atlas21_official.py
      - .github/workflows/drnas-atlas21-official.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build frozen DRNAS and pinned Kissat
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_atlas21_official.py
          python3 research/drnas_atlas13_generator.py
          python3 research/drnas_atlas15_warm_patch.py
          python3 research/drnas_atlas15_cdcl_patch.py
          python3 research/drnas_atlas1_generate.py --out mre_atlas15/atlas1_table.hpp
          python3 research/drnas_atlas9_export_table.py research/atlas8_reduction_table.jsonl mre_atlas15/atlas8_rules.hpp
          python3 research/drnas_atlas16_build.py
          python3 research/drnas_atlas17_build.py
          python3 research/drnas_atlas19_build.py
          mkdir -p mre_atlas15/bin mre_atlas21/bin
          g++ -std=c++17 -O2 -I mre_atlas19 -I mre_atlas15 mre_atlas19/native.cpp -o mre_atlas21/bin/drnas_atlas21
          mre_atlas21/bin/drnas_atlas21 --selftest
          git clone -q https://github.com/arminbiere/kissat.git /tmp/atlas21-kissat
          git -C /tmp/atlas21-kissat checkout --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          (cd /tmp/atlas21-kissat && ./configure && make -j2)
          cp /tmp/atlas21-kissat/build/kissat mre_atlas21/bin/kissat
      - uses: actions/upload-artifact@v4
        with:
          name: ATLAS21-FROZEN-BIN
          path: mre_atlas21/bin
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ATLAS21-FROZEN-BIN
          path: mre_atlas21/bin
      - name: Smoke first original source
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cryptominisat
          python3 -m pip install --break-system-packages -q remotezip
          chmod +x mre_atlas21/bin/*
          taskset -c "$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')" python3 -u research/drnas_atlas21_official.py --smoke | tee smoke.log
          grep '^ATLAS21_FINAL ' smoke.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS21-SMOKE
          path: |
            smoke.log
            mre_atlas21/manifest.json
            mre_atlas21/smoke.json
  pilot:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ATLAS21-FROZEN-BIN
          path: mre_atlas21/bin
      - name: Four original SHA matched paired benchmark
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cryptominisat
          python3 -m pip install --break-system-packages -q remotezip
          chmod +x mre_atlas21/bin/*
          taskset -c "$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')" python3 -u research/drnas_atlas21_official.py | tee pilot.log
          grep '^ATLAS21_FINAL ' pilot.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS21-PILOT
          retention-days: 60
          path: |
            pilot.log
            mre_atlas21/manifest.json
            mre_atlas21/pilot.json

  sql-ledger:
    needs: pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ATLAS21-PILOT
          path: imported-pilot
      - name: Import prior successful S-series SQL artifact when present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p previous
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ["GITHUB_REPOSITORY"];current=os.environ["GITHUB_RUN_ID"]
          token=os.environ["GH_TOKEN"]
          def get(path):
           req=urllib.request.Request("https://api.github.com/repos/"+repo+"/"+path,
             headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json",
                      "User-Agent":"DRNAS-S-ledger"})
           with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          arts=get("actions/artifacts?name=DRNAS-S-SQL-LEDGER&per_page=100")["artifacts"]
          for a in sorted(arts,key=lambda x:x["created_at"],reverse=True):
           rid=str(a["workflow_run"]["id"])
           if rid==current or a["expired"]:continue
           run=get("actions/runs/"+rid)
           if run["conclusion"]!="success":continue
           with open("previous/run_id.txt","w") as f:f.write(rid)
           print("DRNAS_PRIOR_SQL_RUN",rid,flush=True)
           break
          else:print("DRNAS_PRIOR_SQL_RUN none (new ledger)",flush=True)
          PY
          if test -s previous/run_id.txt; then
            gh run download "$(cat previous/run_id.txt)" --repo "$GITHUB_REPOSITORY" --name DRNAS-S-SQL-LEDGER --dir previous
            test -s previous/DRNAS_S_LEDGER.sqlite
          fi
      - name: Append S21 trials and events without holdout policy feedback
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_s_series_sql.py
          if test -s previous/DRNAS_S_LEDGER.sqlite; then
            python3 research/drnas_s_series_sql.py --series S21 --run-id "$GITHUB_RUN_ID" --input imported-pilot/pilot.json --output DRNAS_S_LEDGER.sqlite --prior previous/DRNAS_S_LEDGER.sqlite --prior-run-id "$(cat previous/run_id.txt)" | tee ledger.log
          else
            python3 research/drnas_s_series_sql.py --series S21 --run-id "$GITHUB_RUN_ID" --input imported-pilot/pilot.json --output DRNAS_S_LEDGER.sqlite | tee ledger.log
          fi
          grep '^DRNAS_SQL_LEDGER ' ledger.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-S-SQL-LEDGER
          retention-days: 90
          path: |
            DRNAS_S_LEDGER.sqlite
            ledger.log
