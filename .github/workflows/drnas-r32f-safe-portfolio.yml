name: DRNAS R32f safe two-core SAT portfolio
on:
  push:
    branches: [experiment/drnas-r32f-safe-portfolio-20261103]
    paths:
      - '.github/workflows/drnas-r32f-safe-portfolio.yml'
      - 'experiments/drnas_v16/r32f_safe_portfolio_benchmark.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r32f-safe-portfolio-v1
  cancel-in-progress: true
jobs:
  frozen:
    name: Freeze 60 SHA-new source CNFs and verify pinned Kissat pair
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python syntax
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/r32f_safe_portfolio_benchmark.py
      - name: Freeze source SHA identities
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r32f_safe_portfolio_benchmark.py freeze --dest frozen
          (cd frozen && sha256sum -c cnf.sha256)
          python3 - <<'PY'
          import json
          d=json.load(open("frozen/manifest.json"))
          assert d["total_trials"]==1128 and len(d["cases"])==60
          assert len({c["sha256"] for c in d["cases"]})==60
          assert len(d["arms"])==4
          print("R32F_FROZEN_SHA_PASS")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: r32e-binary-pair
          run-id: 41638482746
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: compiled
      - name: Check source of binaries and two independent CPU cores
        run: |
          set -euo pipefail
          chmod +x compiled/clean compiled/native
          (cd compiled && sha256sum -c binaries.sha256)
          python3 - <<'PY'
          import os
          cpus=sorted(os.sched_getaffinity(0))
          assert len(cpus)>=2, "Need two physical/logical allocated CPUs to evaluate portfolio"
          print("R32F_ALLOWED_CPU_AFFINITY",cpus)
          PY
          set +e
          R32B_MODE=r32e compiled/native frozen/r32f_base_consistent_hidden_60.cnf > preflight.log
          code=$?
          set -e
          test "$code" -eq 10
          grep -q '^c R32E_SELECT policy=hidden_resolvent_v1 ' preflight.log
          grep -q '^c R32B_PROBE mark=9999 ' preflight.log
          grep -q '^c R32B_FINAL status=10 ' preflight.log
          echo R32F_NATIVE_BENCHMARK_READY
      - uses: actions/upload-artifact@v4
        with:
          name: r32f-60-frozen-originals
          path: frozen/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: r32f-native-binary-pair
          path: compiled/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r32f-preflight
          path: preflight.log
          if-no-files-found: warn
  paired:
    needs: frozen
    name: r32f-shard-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r32f-60-frozen-originals
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: r32f-native-binary-pair
          path: compiled
      - name: Verify source and binary SHA fingerprints
        run: |
          set -euo pipefail
          chmod +x compiled/clean compiled/native
          (cd frozen && sha256sum -c cnf.sha256)
          (cd compiled && sha256sum -c binaries.sha256)
      - name: End-to-end wall and child CPU time for fair two-core racing
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r32f_safe_portfolio_benchmark.py measure \
            --inputs frozen --clean compiled/clean --native compiled/native \
            --shard "$SHARD" --outdir results | tee r32f-live.log
          test -s results/rows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r32f-shard-${{ matrix.shard }}
          path: |
            results/
            r32f-live.log
          if-no-files-found: warn
  audit:
    needs: [frozen, paired]
    if: always()
    name: Validate 1128 matched trials, proof checks and CPU-vs-wall economics
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r32f-60-frozen-originals
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: r32f-shard-*
          path: combined
      - name: Publish audited results and 95% source bootstrap intervals
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r32f_safe_portfolio_benchmark.py aggregate \
            --inputs frozen --combined combined --output r32f-results.json \
            --report r32f-results.md
          cat r32f-results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R32F-SAFE-PORTFOLIO-FINAL-1128
          path: |
            r32f-results.json
            r32f-results.md
            frozen/manifest.json
          if-no-files-found: warn
