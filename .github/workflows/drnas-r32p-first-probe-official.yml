name: DRNAS R32p first-conflict mechanism and external official holdout
on:
  push:
    branches: [experiment/drnas-r32p-first-probe-official-20261103]
    paths:
      - '.github/workflows/drnas-r32p-first-probe-official.yml'
      - 'experiments/drnas_v16/r32p_first_probe_official.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r32p-first-probe-20261103
  cancel-in-progress: true
jobs:
  freeze:
    name: Freeze excluded-R45 original competition inputs and read-only prior probe hypothesis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax and source hash checks
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/r32p_first_probe_official.py
          python3 -m py_compile experiments/drnas_v16/r32o_lucky_probe_benchmark.py
          python3 -m py_compile experiments/drnas_v16/r32n_omission_timing_benchmark.py
      - uses: actions/download-artifact@v4
        with:
          name: official-shortlong-frozen-manifest
          run-id: 41231153158
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior18
      - uses: actions/download-artifact@v4
        with:
          name: v94-frozen-new12-official-manifest
          run-id: 41632056202
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior12
      - uses: actions/download-artifact@v4
        with:
          name: r45-original-official-12-cnf-frozen-manifest
          run-id: 41651711339
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r45
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-R32O-LUCKY-PROBE-RESULTS
          run-id: 41655612275
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-r32o
      - name: Precommit non-R45 external source selection before running
        run: |
          set -euo pipefail
          (cd prior18 && sha256sum -c manifest.sha256)
          (cd prior12 && sha256sum -c manifest.sha256)
          (cd r45 && sha256sum -c manifest.sha256)
          python3 -u experiments/drnas_v16/r32p_first_probe_official.py freeze \
            --prior18 prior18/official_shortlong_manifest.json \
            --prior12 prior12/official_v94_manifest.json \
            --r45 r45/manifest.json --output frozen/manifest.json
          (cd frozen && sha256sum manifest.json > manifest.sha256 && sha256sum -c manifest.sha256)
      - name: Inspect first lucky probes on already studied R32o data without training or selection
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r32p_first_probe_official.py prior \
            --source prior-r32o/r32o-results.json --output prior-r32p-exploratory.json
          test -s prior-r32p-exploratory.json
      - uses: actions/upload-artifact@v4
        with:
          name: r32p-official-sha-frozen
          path: frozen/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: r32p-prior-first-probe-audit
          path: prior-r32p-exploratory.json
          if-no-files-found: error
  paired:
    needs: freeze
    name: r32p-shard-${{ matrix.shard }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r32p-official-sha-frozen
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: r32o-pinned-binaries
          run-id: 41655612275
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: compiled
      - name: Verify original source manifest and pinned clean/native binaries
        run: |
          set -euo pipefail
          chmod +x compiled/clean compiled/native
          (cd frozen && sha256sum -c manifest.sha256)
          (cd compiled && sha256sum -c binaries.sha256)
      - name: Two serial paired repetitions of full GF2, native off, and clean Kissat
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          lscpu > cpu.txt
          python3 -u experiments/drnas_v16/r32p_first_probe_official.py measure \
            --manifest frozen/manifest.json --clean compiled/clean --native compiled/native \
            --shard "$SHARD" --outdir results | tee r32p-live.log
          test -s results/rows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r32p-shard-${{ matrix.shard }}
          path: |
            results/
            cpu.txt
            r32p-live.log
          if-no-files-found: warn
  audit:
    needs: [freeze, paired]
    if: always()
    name: Strict original-DIMACS and first-conflict external comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r32p-official-sha-frozen
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: r32p-prior-first-probe-audit
          path: prior
      - uses: actions/download-artifact@v4
        with:
          pattern: r32p-shard-*
          path: combined
      - name: Certify selected original real competition attempts without promoting exploration to proof
        run: |
          set -euo pipefail
          test "${{ needs.freeze.result }}" = success
          test "${{ needs.paired.result }}" = success
          (cd frozen && sha256sum -c manifest.sha256)
          python3 -u experiments/drnas_v16/r32p_first_probe_official.py aggregate \
            --manifest frozen/manifest.json --combined combined \
            --prior prior/prior-r32p-exploratory.json \
            --output r32p-final.json | tee r32p-audit.log
          test -s r32p-final.json
          cat r32p-audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R32P-EXTERNAL-FIRST-PROBE-FINAL
          path: |
            r32p-final.json
            r32p-audit.log
            frozen/manifest.json
            prior/prior-r32p-exploratory.json
          if-no-files-found: warn
