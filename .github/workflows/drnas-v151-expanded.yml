name: DRNAS V15.1 Expanded XOR10 2SAT PHP and SATLIB
on:
  push:
    branches: [experiment/drnas-v147-xor4-robust-proof-20261101]
    paths:
      - 'research/drnas-sat-v7-8/v151_expanded.cpp'
      - 'research/tseitin-replay/v151_expanded_benchmark.py'
      - 'research/tseitin-replay/v151_proof_checker.py'
      - 'research/tseitin-replay/v151_satlib_holdout_d.py'
      - '.github/workflows/drnas-v151-expanded.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expanded:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile baseline and new native solvers
        run: |
          set -euo pipefail
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra research/drnas-sat-v7-8/v148_xor4.cpp -o /tmp/v148_xor4
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra research/drnas-sat-v7-8/v150_broad.cpp -o /tmp/v150_broad
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra research/drnas-sat-v7-8/v151_expanded.cpp -o /tmp/v151_expanded
          test -x /tmp/v151_expanded
      - name: Build pinned Kissat 4.0.4
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/arminbiere/kissat.git /tmp/kissat-source
          git -C /tmp/kissat-source fetch --depth 1 origin 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          git -C /tmp/kissat-source checkout --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          (cd /tmp/kissat-source && ./configure && make -j2)
          cp /tmp/kissat-source/build/kissat /tmp/kissat_solver
          /tmp/kissat_solver --version
      - name: Regression across 132 wide-structure CNF formulas
        run: |
          python3 research/tseitin-replay/v151_expanded_benchmark.py
      - name: Upload wide-structure regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRNAS-V151-132-Wide-Structures
          path: v151-expanded-regression/
          if-no-files-found: warn
      - name: Checkout pinned original SATLIB CNF repository
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/mitchellh/go-sat.git /tmp/satlib-repo
          git -C /tmp/satlib-repo fetch --depth 1 origin fc0e735aff48989326f256121b5ed6fc585858c3
          git -C /tmp/satlib-repo checkout --detach fc0e735aff48989326f256121b5ed6fc585858c3
          test "$(git -C /tmp/satlib-repo rev-parse HEAD)" = "fc0e735aff48989326f256121b5ed6fc585858c3"
      - name: Benchmark 24 independent SATLIB cases from six families
        run: |
          set -euo pipefail
          python3 research/tseitin-replay/v151_satlib_holdout_d.py
      - name: Upload independent SATLIB public holdout D
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRNAS-V151-SATLIB-24-Independent
          path: v151-satlib-external-holdout-d/
          if-no-files-found: warn
