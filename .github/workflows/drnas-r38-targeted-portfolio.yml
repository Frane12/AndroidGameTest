name: DRNAS R38 targeted official causal policies and four-core portfolio
on:
  push:
    branches: [experiment/drnas-r38-targeted-portfolio-20261103]
    paths:
      - '.github/workflows/drnas-r38-targeted-portfolio.yml'
      - 'research/r38_portfolio_probe.py'
      - 'research/r38_portfolio_audit.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Reuse exact previously compiled and SHA-pinned solver binaries
        uses: actions/download-artifact@v4
        with:
          name: r38-pinned-instrumented-solver-and-kissat
          run-id: 41636292605
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: compiled
      - name: Restore executable mode stripped by GitHub artifact ZIP
        run: |
          set -euo pipefail
          chmod +x compiled/probe compiled/kissat
          (cd compiled && sha256sum -c bin.sha256)
          python3 -m py_compile research/r38_portfolio_probe.py research/r38_portfolio_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: r38-pinned-instrumented-solver-and-kissat
          path: compiled/
          if-no-files-found: error
          retention-days: 90
  scan:
    needs: build
    if: needs.build.result == 'success'
    name: r38-official-diagnostic-${{ matrix.index }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        index: [0,1,2,3,4]
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r38-pinned-instrumented-solver-and-kissat
          path: compiled
      - uses: actions/download-artifact@v4
        with:
          name: v94-frozen-new12-official-manifest
          run-id: 41632056202
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: official_manifest
      - name: 12 single-core policy checks plus 4-core race on ONE selected real formula
        env:
          INDEX: ${{ matrix.index }}
        run: |
          set -euo pipefail
          chmod +x compiled/probe compiled/kissat
          (cd compiled && sha256sum -c bin.sha256)
          (cd official_manifest && sha256sum -c manifest.sha256)
          python3 -m py_compile research/r38_portfolio_probe.py
          lscpu > cpu.txt
          python3 -u research/r38_portfolio_probe.py --manifest official_manifest/official_v94_manifest.json --index "$INDEX" --exe compiled/probe --kissat compiled/kissat --out results | tee r38-live.log
          test -s results/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r38-case-${{ matrix.index }}
          path: |
            results/
            cpu.txt
            r38-live.log
            compiled/bin.sha256
          if-no-files-found: warn
          retention-days: 90
  audit:
    needs: [build,scan]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v94-frozen-new12-official-manifest
          run-id: 41632056202
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: official_manifest
      - uses: actions/download-artifact@v4
        with:
          pattern: r38-case-*
          path: combined
      - name: Fail closed on incomplete native attempts or incorrect SAT statuses
        run: |
          set -euo pipefail
          test "${{ needs.build.result }}" = success
          test "${{ needs.scan.result }}" = success
          (cd official_manifest && sha256sum -c manifest.sha256)
          python3 -u research/r38_portfolio_audit.py --root combined --manifest official_manifest/official_v94_manifest.json --out r38-audit.json | tee r38-audit.log
          test -s r38-audit.json
          cat r38-audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R38-TARGETED-PORTFOLIO-AUDIT
          path: |
            r38-audit.json
            r38-audit.log
          if-no-files-found: warn
          retention-days: 90
