name: DRNAS NeuroFlow v0.6.3 external publisher benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - 'DRNAS_NP_Crypto_Benchmark/nf_v063_*.py'
      - '.github/workflows/drnas-neuroflow-v063.yml'

permissions:
  contents: read

jobs:
  external-zero-shot:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CryptoMiniSat for independent status validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cryptominisat
          cryptominisat5 --version
      - name: Run mathematical correctness regressions
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          python drnas_np_lab.py test
          python test_neuroflow_v03.py
      - name: Fetch untouched authored public benchmark CNFs with exact SHA-256 provenance
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          python -u nf_v063_external_fetch.py
          test "$(($(wc -l < nf063_external/manifest.csv)-1))" -eq 60
      - name: Zero-shot benchmark across independent authors and application categories
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          python -u nf_v063_external_benchmark.py
      - name: Print audited results and limitations
        if: always()
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          if test -f nf063_external/manifest.csv; then head -n 4 nf063_external/manifest.csv; fi
          if test -f nf063_results/summary.csv; then cat nf063_results/summary.csv; fi
      - name: Upload immutable provenance, paired times, and reference statuses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-neuroflow-v063-independent-authors
          path: |
            DRNAS_NP_Crypto_Benchmark/nf063_external/manifest.csv
            DRNAS_NP_Crypto_Benchmark/nf063_external/source_revisions.json
            DRNAS_NP_Crypto_Benchmark/nf063_results/
          if-no-files-found: warn
