name: DRNAS CRR1-B6 — B3L8 vs B5multi8 Kissat fixed conflict profiles 4 SHA 72 paired
on:
  push:
    branches: [experiment/drnas-crr1b6-conflict-profile-20261108]
    paths: ['.github/workflows/drnas-crr1b6-conflict-profile.yml', 'research/drnas_crr1b6_conflict_profile.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-crr1b6-conflict-profile-20261108
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore frozen SAT2026 W4 originals and pinned Kissat 4.0.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42429372803 -R Frane12/AndroidGameTest -n w4-input -D .
          test -s worldsim-w1-frozen.tar.gz
          test -s history/w4sources/manifest.json
          tar xzf worldsim-w1-frozen.tar.gz
          chmod +x checker/drat-trim built/bin/kissat_4_0_4
          python3 -m py_compile research/drnas_crr1a_shadow.py research/drnas_crr1b_active.py research/drnas_crr1b2_telemetry.py research/drnas_crr1b3loose.py research/drnas_crr1b4_value.py research/drnas_crr1b5_discrimination.py research/drnas_crr1b6_conflict_profile.py
          mkdir -p crr1b6
          python3 -u research/drnas_crr1b6_conflict_profile.py prepare | tee crr1b6/prepare.log
          grep -q '^CRR1B6_SELFTEST_PASS' crr1b6/prepare.log
          grep -q '^CRR1B6_PREP_PASS' crr1b6/prepare.log
          test -s crr1b6/smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: crr1b6-frozen-input
          retention-days: 30
          if-no-files-found: error
          path: |
            worldsim-w1-frozen.tar.gz
            history/w4sources/
            checker/drat-trim
            built/bin/kissat_4_0_4
            crr1b6/manifest.json
            crr1b6/pins.json
            crr1b6/smoke.json
            crr1b6/prepare.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crr1b6-prepare-debug
          retention-days: 7
          if-no-files-found: warn
          path: |
            crr1b6/prepare.log
            crr1b6/smoke.json
  paired:
    needs: prepare
    name: CRR1B6 fixed conflicts 500 5000 25000 shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: crr1b6-frozen-input
      - name: Pair baseline, B3L8, B5multi8 on identical original CNFs and conflict caps
        run: |
          set -euo pipefail
          tar xzf worldsim-w1-frozen.tar.gz
          chmod +x checker/drat-trim built/bin/kissat_4_0_4
          python3 -u research/drnas_crr1b6_conflict_profile.py shard --shard ${{ matrix.shard }} | tee crr1b6/shard-${{ matrix.shard }}.log
          grep -q '^CRR1B6_SHARD_PASS' crr1b6/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crr1b6-shard-${{ matrix.shard }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            crr1b6/shard-${{ matrix.shard }}.json
            crr1b6/shard-${{ matrix.shard }}.log
  audit:
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: crr1b6-frozen-input
      - name: Audit exactly 72 SHA-pinned paired results with verification gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar xzf worldsim-w1-frozen.tar.gz
          chmod +x checker/drat-trim built/bin/kissat_4_0_4
          mkdir -p crr1b6/collected
          gh run download "${{ github.run_id }}" -R Frane12/AndroidGameTest -p 'crr1b6-shard-*' -D crr1b6/collected
          test "$(find crr1b6/collected -type f -name 'shard-*.json' | wc -l)" -eq 4
          find crr1b6/collected -type f -name 'shard-*.json' -exec cp '{}' crr1b6/ \;
          python3 -u research/drnas_crr1b6_conflict_profile.py audit | tee crr1b6/audit.log
          grep -q '^CRR1B6_FINAL' crr1b6/audit.log
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open("crr1b6/report.json"))
          print("CRR1-B6 conflict-budget audit PASS")
          print("Paired",r["attempts"],"Posthoc",r["posthoc_development"])
          print("Focus changed among top8",r["focus_clause_changed_8"])
          for p in r["paired"]:
              print(p["conflict_limit"],p["baseline"],"valid pairs",
                    p["valid_pairs"],"geom speedup",p["geomean_wall_speedup_b5"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-CRR1B6-4SHA-72-FIXED-CONFLICT-B3L8-B5MULTI8-FINAL
          retention-days: 60
          if-no-files-found: warn
          path: |
            crr1b6/report.json
            crr1b6/all-trials.json
            crr1b6/audit.log
            crr1b6/manifest.json
            crr1b6/pins.json
