name: DRNAS V15.3.1 medium SATLIB source preflight
on:
  workflow_dispatch:
  push:
    branches: [experiment/drnas-v1531-external-medium40-20261101]
    paths: [.github/workflows/drnas-v1531-medium-preflight.yml]
permissions:
  contents: read
jobs:
  archive_check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        corpus: [uf200-860,uf250-1065,uuf200-860,uuf250-1065]
        include:
          - corpus: uf200-860
            sha1: e27208778d47d2405a9368cad3ab8dfb41206be8
          - corpus: uf250-1065
            sha1: acaf37c9e92694a38974a6a1a9647e0f9bcf80b2
          - corpus: uuf200-860
            sha1: 05aacf179ed739a8311f2821874183daa5a9b134
          - corpus: uuf250-1065
            sha1: 138484766c966e3f18395db92cf6d69d3c442a3e
    steps:
      - name: Fetch original SATLIB archive and verify published SHA1
        run: |
          set -euo pipefail
          name="${{ matrix.corpus }}"
          curl -fLsS --connect-timeout 10 --max-time 60 --retry 2 "https://www.cs.ubc.ca/~hoos/SATLIB/Benchmarks/SAT/RND3SAT/$name.tar.gz" -o input.tar.gz
          echo "${{ matrix.sha1 }}  input.tar.gz" | sha1sum -c -
          tar -tzf input.tar.gz | sed -n '1,12p'
          echo "ARCHIVE_READY $name"
