name: DRNAS Ultimate T SQL cumulative history audit
on:
  push:
    branches: [experiment/drnas-ultimate-t-trail-frontier-20261107]
    paths:
      - research/drnas_sat_benchmark_history_20261107_t.sql
      - scripts/drnas_sat_t_sql_audit.py
      - .github/workflows/drnas-ultimate-t-sql-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sqlite-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate R2x, R194 and T cumulative SQLite provenance and idempotent replay
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/drnas_sat_t_sql_audit.py
          python3 -u scripts/drnas_sat_t_sql_audit.py | tee ultimate-t-sql-audit.log
          grep -q '"status": "DRNAS_T_SQL_AUDIT_PASS"' ultimate-t-sql-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-ULTIMATE-T-SQL-AUDIT
          retention-days: 90
          path: ultimate-t-sql-audit.log
