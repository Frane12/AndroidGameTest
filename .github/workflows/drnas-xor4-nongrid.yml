name: DRNAS frozen XOR4 on non-grid graphs and equivalent weakened CNFs
on:
  push:
    branches: [experiment/drnas-xor4-nongrid-controls-20261101]
    paths: ['.github/workflows/drnas-xor4-nongrid.yml','research/tseitin-replay/non_grid_controls.py']
permissions:
  contents: read
  actions: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        slot: [0,1,2,3]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 41270937896
          github-token: ${{ github.token }}
          name: DRNAS-v142-xor4-native-grid-results
          path: new
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 41267740944
          github-token: ${{ github.token }}
          name: DRNAS-V145-Native-Propagated-Parity-and-pinned-solvers
          path: bin
      - name: Install single-threaded reference and verify frozen executables
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y cryptominisat
          cp new/bin/v142_xor4 bin/v142_xor4
          (cd bin && sha256sum -c binaries.sha256)
          echo 'fc357c15fdec6f3a7ced8acf84f7d07e625ec88398892cdcea2cfda927e3184b  bin/v142_xor4' | sha256sum -c -
          chmod +x bin/{v142_xor4,v142_fastgate,kissat_solver}
      - run: python3 research/tseitin-replay/non_grid_controls.py ${{ matrix.slot }}
      - uses: actions/upload-artifact@v4
        with:
          name: nongrid-case-${{ matrix.slot }}
          path: out/
  collect:
    needs: measure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nongrid-case-*
          path: all
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-XOR4-nongrid-results
          path: all/
