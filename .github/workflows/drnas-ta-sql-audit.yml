name: DRNAS TA cumulative SAT SQL audit
on:
  push:
    branches: [experiment/drnas-ta-structural-holdout-20261107]
    paths:
      - research/drnas_sat_benchmark_history_20261107_ta.sql
      - scripts/drnas_sat_ta_sql_audit.py
      - .github/workflows/drnas-ta-sql-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sqlite-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify T/R2T/R196/R197/R193/Neural/New Horizon historical SAT SQL and double-replay
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/drnas_sat_ta_sql_audit.py
          python3 -u scripts/drnas_sat_ta_sql_audit.py | tee ta-sql-audit.log
          grep -q '^DRNAS_TA_SQL_AUDIT_PASS' ta-sql-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-TA-SQL-HISTORY-AUDIT
          retention-days: 90
          path: ta-sql-audit.log
