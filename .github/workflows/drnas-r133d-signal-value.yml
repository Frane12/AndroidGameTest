name: DRNAS R133d native GF2 signal-value paired benchmark
on:
  push:
    branches:
      - experiment/drnas-r133d-signal-value-20261105
    paths:
      - '.github/workflows/drnas-r133d-signal-value.yml'
      - 'research/r133d_run.sh'
      - 'research/r133d_value_benchmark.py'
      - 'research/r133d_short_signal_selector.py'
      - 'research/r133c_native_gf2_cdcl_bridge.cpp'
      - 'research/r133c_native_gf2_benchmark.py'
      - 'research/r93_export_verified_rows.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-native-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout frozen R133d sources
        uses: actions/checkout@v4
      - name: Execute source-certified R133d parity benchmark
        shell: bash
        run: bash research/r133d_run.sh
      - name: Preserve complete source and paired evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r133d-native-gf2-signal-audit
          path: r133d-results/
          if-no-files-found: warn
          retention-days: 90
