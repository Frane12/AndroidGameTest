name: DRNAS CRR1-B4 — propagation value 8 vs 16 GF2 4 SHA 48 paired 90s
on:
  push:
    branches: [experiment/drnas-crr1b4-propagation-value-20261108]
    paths: ['.github/workflows/drnas-crr1b4-value.yml', 'research/drnas_crr1b4_value.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-crr1b4-gate-20261108
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore pinned SAT2026 W4 source corpus and exact Kissat backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42429372803 -R Frane12/AndroidGameTest -n w4-input -D .
          test -s worldsim-w1-frozen.tar.gz
          test -s history/w4sources/manifest.json
          tar xzf worldsim-w1-frozen.tar.gz
          chmod +x checker/drat-trim built/bin/kissat_4_0_4
          python3 -m py_compile research/drnas_crr1a_shadow.py research/drnas_crr1b_active.py research/drnas_crr1b2_telemetry.py research/drnas_crr1b4_value.py
          python3 -u research/drnas_crr1b4_value.py selftest
          mkdir -p crr1b4
          python3 -u research/drnas_crr1b4_value.py prepare | tee crr1b4/prepare.log
          grep -q '^CRR1B4_PREP_PASS' crr1b4/prepare.log
      - name: Verify pinned Kissat supports --statistics with original-source SAT witness
        run: |
          set -euo pipefail
          printf 'p cnf 2 2\n1 2 0\n-1 2 0\n' > crr1b4/smoke.cnf
          set +e
          built/bin/kissat_4_0_4 --statistics crr1b4/smoke.cnf crr1b4/smoke.drat > crr1b4/smoke.log 2>&1
          code=$?
          set -e
          test "$code" -eq 10
          grep -q '^s SATISFIABLE' crr1b4/smoke.log
          rm -f crr1b4/smoke.cnf crr1b4/smoke.drat
      - uses: actions/upload-artifact@v4
        with:
          name: crr1b4-frozen-input
          retention-days: 45
          if-no-files-found: error
          path: |
            worldsim-w1-frozen.tar.gz
            history/w4sources/
            checker/drat-trim
            built/bin/kissat_4_0_4
            crr1b4/manifest.json
            crr1b4/pins.json
            crr1b4/prepare.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crr1b4-prepare-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: crr1b4/
  paired:
    needs: prepare
    name: CRR1B4 focus 90s original loose8 value8 value16 shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: crr1b4-frozen-input
      - name: Compare baseline, XOR-frequency 8, BCP impact 8/16; account all preprocessing in 90s
        run: |
          set -euo pipefail
          tar xzf worldsim-w1-frozen.tar.gz
          chmod +x checker/drat-trim built/bin/kissat_4_0_4
          python3 -u research/drnas_crr1b4_value.py shard --shard ${{ matrix.shard }} | tee crr1b4/shard-${{ matrix.shard }}.log
          grep -q '^CRR1B4_SHARD_PASS' crr1b4/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crr1b4-shard-${{ matrix.shard }}
          retention-days: 45
          if-no-files-found: warn
          path: |
            crr1b4/shard-${{ matrix.shard }}.json
            crr1b4/shard-${{ matrix.shard }}.log
            crr1b4/raw/**/telemetry.json
            crr1b4/raw/**/proof_validation.log
  audit:
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: crr1b4-frozen-input
      - name: Collect exactly four source-locked shard JSONs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar xzf worldsim-w1-frozen.tar.gz
          chmod +x checker/drat-trim built/bin/kissat_4_0_4
          mkdir -p crr1b4/collected
          gh run download "${{ github.run_id }}" -R Frane12/AndroidGameTest -p 'crr1b4-shard-*' -D crr1b4/collected
          test "$(find crr1b4/collected -type f -name 'shard-*.json' | wc -l)" -eq 4
          find crr1b4/collected -type f -name 'shard-*.json' -exec cp '{}' crr1b4/ \;
          test "$(find crr1b4 -maxdepth 1 -type f -name 'shard-*.json' | wc -l)" -eq 4
      - name: Audit certified original SAT UNSAT, dynamic BCP-proxy value and source-locked PAR2
        run: |
          set -euo pipefail
          python3 -u research/drnas_crr1b4_value.py audit | tee crr1b4/audit.log
          grep -q '^CRR1B4_FINAL' crr1b4/audit.log
          cat crr1b4/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-CRR1B4-4SHA-48-MARGINAL-PROPAGATION-90S-FINAL
          retention-days: 60
          if-no-files-found: warn
          path: |
            crr1b4/report.json
            crr1b4/all-trials.json
            crr1b4/audit.log
            crr1b4/manifest.json
            crr1b4/pins.json
