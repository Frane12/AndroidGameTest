name: DRNAS SAT polynomial originals SHA256 preflight
on:
  push:
    branches:
      - research/drnas-sat-polynomial-family-validation
    paths:
      - research/drnas-sat-family-test/preflight.py
      - .github/workflows/drnas-sat-polynomial-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download published GBD originals without solving
        shell: bash
        run: |
          set -euo pipefail
          python -u research/drnas-sat-family-test/preflight.py \
            --manifest research/drnas-sat-family-test/frozen_gbd_family.json \
            --shard ${{ matrix.shard }} --shards 4 \
            --outdir "$GITHUB_WORKSPACE/verified_sources"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-polynomial-family-preflight-shard${{ matrix.shard }}
          path: verified_sources/preflight.json
          if-no-files-found: warn
