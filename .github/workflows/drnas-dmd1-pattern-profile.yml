name: DRNAS DMD1 PATTERN - count actual linear quadratic ANF signatures in 24 CNFs
on:
  push:
    branches: [experiment/drnas-dmd1-pattern-profile-20261109]
    paths:
      - research/dmd1_pattern_profile.cpp
      - research/dmd1_pattern_audit.py
      - .github/workflows/drnas-dmd1-pattern-profile.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  profile:
    name: Native C++ GF2 basis shape frequency profile with local proof replay
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Restore exact original previously used DMD1 cohort (EQUIV7 SHA)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42618653489 -R Frane12/AndroidGameTest -n equiv7-sourceonly-48SHA-pinned-binaries -D .
          test -s mre_equiv7/manifest.json
          test "$(find mre_equiv7/cases -name '*.cnf' | wc -l)" -eq 48
      - name: Compile independent read-only C++ profiler and replay local implications
        run: |
          set -euo pipefail
          mkdir -p mre_dmd1pattern/bin
          g++ -std=c++17 -O2 -Wall -Wextra -Werror research/dmd1_pattern_profile.cpp -o mre_dmd1pattern/bin/dmd1_pattern_profile
          python3 -m py_compile research/dmd1_pattern_audit.py
          python3 -u research/dmd1_pattern_audit.py | tee mre_dmd1pattern/profile.log
          grep -q '^DMD1_PATTERN_FINAL ' mre_dmd1pattern/profile.log
          grep '^DMD1_PATTERN_FINAL ' mre_dmd1pattern/profile.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-DMD1-24ORIGINAL-ANF-PATTERN-PROFILE
          retention-days: 30
          path: |
            mre_dmd1pattern/profile_report.json
            mre_dmd1pattern/profile.log
