name: DRNAS MATH4 scan 24 original SAT2026 CNFs for exact XOR structure
on:
  push:
    branches: [experiment/drnas-math4-real24-xor-cert-20261114]
    paths:
      - .github/workflows/drnas-math4-real24-audit.yml
      - research/math4/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-math4-real24-algebra-audit
  cancel-in-progress: false
jobs:
  source_algebra_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download immutable previously source-pinned original SAT2026 Main Track CNFs
        uses: actions/download-artifact@v4
        with:
          run-id: 43643413210
          name: hall3-prepared
          github-token: ${{ github.token }}
          path: frozen
      - name: Scan original CNF clauses, count proof-eligible XOR rows and certified input hashes
        run: |
          set -euo pipefail
          tar -xzf frozen/hall3-prepared.tgz
          CPU="$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')"
          echo "MATH4_SINGLE_CPU=$CPU"
          PYTHONHASHSEED=0 taskset -c "$CPU" python3 -u research/math4/inspect_originals.py | tee math4_audit.log
          grep -q '^MATH4_REAL_SUMMARY ' math4_audit.log
      - name: Check whether root-propagated units expose GF2 contradiction candidates
        run: |
          set -euo pipefail
          CPU="$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')"
          PYTHONHASHSEED=0 taskset -c "$CPU" python3 -u research/math4/inspect_xor_units.py | tee math4_units.log
          grep -q '^MATH4_UNIT_FINAL ' math4_units.log
      - name: Build and independently check original-clause GF2 plus root-unit certificates
        run: |
          set -euo pipefail
          CPU="$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')"
          PYTHONHASHSEED=0 taskset -c "$CPU" python3 -u research/math4/prove_xor_units.py \
            --out math4_certificates | tee math4_cert.log
          grep -q '^MATH4_CERT_FINAL ' math4_cert.log
      - name: Preserve analysis, SHA evidence and all negative findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-math4-real24-original-xor-audit
          retention-days: 60
          path: |
            math4_audit/
            math4_audit.log
            math4_unit_audit/
            math4_units.log
            math4_certificates/
            math4_cert.log
            research/math4/inspect_originals.py
            research/hall3/manifest.json
