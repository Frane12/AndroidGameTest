name: DRNAS W1 — timeout proof cleanup smoke (no SAT benchmark)
on:
  push:
    branches: [experiment/drnas-worldsim-proof-cleanup-20261107]
    paths:
      - 'research/drnas_worldsim_w1.py'
      - '.github/workflows/drnas-worldsim-proof-cleanup-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate syntax and no solver reruns
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_worldsim_w1.py
          python3 -u research/drnas_worldsim_w1.py selftest
          python3 - <<'PY'
          from pathlib import Path
          import ast
          mod=ast.parse(Path('research/drnas_worldsim_w1.py').read_text())
          fn=next(n for n in mod.body if isinstance(n,ast.FunctionDef) and n.name=='discard_incomplete_timeout_proofs')
          assert fn is not None
          print('W1_TIMEOUT_PROOF_CLEANUP_SMOKE_PASS')
          PY
