name: DRNAS V13.12 - Sparse GF2 Certified Coverage on Frozen 2024 CNFs
on:
  push:
    branches:
      - experiment/drnas-v1312-bounded-sparse-gf2-20261101
    paths:
      - '.github/workflows/drnas-sat-v1312-sparse-gf2.yml'
      - 'research/drnas-sat-v7-8/v1312_sparse_gf2.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify differential GF2 soundness on synthetic and 4000 equation chain
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/v1312_sparse_gf2.py
          python3 -u research/drnas-sat-v7-8/v1312_sparse_gf2.py selftest

  diagnose:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5]
    name: v1312-sparse-shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V139-new-SC2024-12-frozen-verified-CNFs
          run-id: 41261415700
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: frozen
      - name: Check frozen 2024 manifest
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v139_selector.sha256 && sha256sum -c v139_manifest.sha256)
      - name: Test 2 original CNFs with exact sparse GF2 and audit trail
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/v1312_sparse_gf2.py run \
            --manifest frozen/v139_manifest.json --shard "$SHARD" --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1312-sparse-shard-${{ matrix.shard }}
          path: results/
          if-no-files-found: warn
  audit:
    needs: [preflight, diagnose]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V139-new-SC2024-12-frozen-verified-CNFs
          run-id: 41261415700
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V1311-certified-local-XOR-final-audit
          run-id: 41262480333
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: previous
      - uses: actions/download-artifact@v4
        with:
          pattern: v1312-sparse-shard-*
          path: combined
          merge-multiple: false
      - name: Compare exact matched 12 formula coverage to V13.11
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v139_selector.sha256 && sha256sum -c v139_manifest.sha256)
          python3 -u research/drnas-sat-v7-8/v1312_sparse_gf2.py audit \
            --manifest frozen/v139_manifest.json \
            --prior previous/v1311_certified_audit.json \
            --combined combined \
            --json v1312_sparse_audit.json --md v1312_sparse_audit.md
          cat v1312_sparse_audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V1312-bounded-sparse-GF2-final-audit
          path: |
            v1312_sparse_audit.json
            v1312_sparse_audit.md
          if-no-files-found: warn
