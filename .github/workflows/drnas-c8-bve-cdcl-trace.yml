name: DRNAS C8 — CaDiCaL BVE Vivify 3 original SHA 36 real SAT plus 60 traces
on:
  push:
    branches: [experiment/drnas-cdcl-c8-bve-dynamics-trace-20261108]
    paths: ['.github/workflows/drnas-c8-bve-cdcl-trace.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-c8-bve-cdcl-three-source-trace
  cancel-in-progress: false
jobs:
  prepare:
    name: Restore six frozen C7 originals and test CaDiCaL BVE/vivify factorial options
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore C7 frozen six original CNF source SHAs and certified dedup manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42523071479 -R Frane12/AndroidGameTest -n c7-certified-sources-CMS-CaDiCaL-Kissat-pins -D .
          (cd mre11_easy && sha256sum -c source.sha256)
          (cd mre11b_blind && sha256sum -c source.sha256)
          python3 -m py_compile research/c8_bve_cdcl_trace.py
      - name: Use same CaDiCaL binary/version and verify all original SAT witnesses
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical libgmp10
          mkdir -p c8_out
          cadical --version | tee c8_out/cadical-version.txt
          diff -u c7_out/cadical-version.txt c8_out/cadical-version.txt
          python3 -u research/c8_bve_cdcl_trace.py verify | tee c8_out/verify.log
          python3 -u research/c8_bve_cdcl_trace.py smoke | tee c8_out/smoke.log
          grep -q '^C8_OPTION_FACTORIAL_SAT_MODEL_STATS_SMOKE_PASS' c8_out/smoke.log
          echo C8_THREE_SOURCE_SHA_AND_4_FACTORIAL_SOLVERS_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c8-frozen-C7-SHA6-and-cadical-factorial-pins
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6
          path: |
            mre11_easy/manifest.json
            mre11_easy/source.sha256
            mre11_easy/*.cnf
            mre11b_blind/manifest.json
            mre11b_blind/source.sha256
            mre11b_blind/*.cnf
            c7_source/dedup/manifest.json
            c7_source/dedup/*.cnf
            c7_out/cadical-version.txt
            c8_out/cadical-version.txt
            c8_out/verify.log
            c8_out/smoke.log
  paired:
    name: C8 4-arm E2E and conflict snapshots source SHA shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0,1,2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: c8-frozen-C7-SHA6-and-cadical-factorial-pins
          path: .
      - name: Match CaDiCaL and original SHA binary/source metadata before tests
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical libgmp10
          test "$(cadical --version)" = "$(cat c8_out/cadical-version.txt)"
          (cd mre11_easy && sha256sum -c source.sha256)
          (cd mre11b_blind && sha256sum -c source.sha256)
          python3 -u research/c8_bve_cdcl_trace.py verify
      - name: Run 12 actual full SAT E2E PAR2 plus 20 separate verbose snapshots
        run: |
          set -euo pipefail
          mkdir -p c8_out
          python3 -u research/c8_bve_cdcl_trace.py shard --shard ${{ matrix.shard }} | tee c8_out/shard-${{ matrix.shard }}.log
          grep -q '^C8_FULL_SHARD_PASS ${{ matrix.shard }} 12$' c8_out/shard-${{ matrix.shard }}.log
          grep -q '^C8_TRACE_SHARD_PASS ${{ matrix.shard }} 20$' c8_out/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c8-original-SHA-trace-shard-${{ matrix.shard }}
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6
          path: |
            c8_out/full-${{ matrix.shard }}.json
            c8_out/trace-${{ matrix.shard }}.json
            c8_out/shard-${{ matrix.shard }}.log
  audit:
    name: C8 FINAL 36 true SAT witnesses PAR2 plus 60 separate BVE CDCL traces
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: c8-frozen-C7-SHA6-and-cadical-factorial-pins
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: c8-original-SHA-trace-shard-*
          merge-multiple: true
          path: c8_out
      - name: Fail-closed audit of exact SHA seeds status full and bounded diagnostic matrices
        run: |
          set -euo pipefail
          (cd mre11_easy && sha256sum -c source.sha256)
          (cd mre11b_blind && sha256sum -c source.sha256)
          python3 -u research/c8_bve_cdcl_trace.py audit | tee c8_out/audit.log
          grep -q '^C8_FINAL' c8_out/audit.log
          grep '^C8_FINAL' c8_out/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-C8-3SHA-36-E2E-PAR2-60-BVE-CDCL-SNAPSHOTS
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6
          path: |
            c8_out/report.json
            c8_out/audit.log
            c8_out/full-*.json
            c8_out/trace-*.json
            c8_out/shard-*.log
