name: DRNAS ATLAS8 persistent proven reduction discovery
run-name: ATLAS8 200 training formulas mathematical block discovery and persistent GitHub table
on:
  workflow_dispatch:
  push:
    branches: [experiment/drnas-atlas8-persistent-reduction-20261111]
    paths:
      - research/drnas_atlas8_discover.py
      - research/drnas_atlas7_hardmixed300.py
      - .github/workflows/drnas-atlas8-discovery.yml
permissions:
  contents: write
concurrency:
  group: atlas8-persistent-table
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Discover exact local reductions on 200 training formulas only
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_atlas8_discover.py
          python3 -u research/drnas_atlas8_discover.py --train 200 | tee atlas8_discovery.log
          grep '^ATLAS8_FINAL ' atlas8_discovery.log >> "$GITHUB_STEP_SUMMARY"
      - name: Persist discovered proven reductions to experimental branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/atlas8_reduction_table.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "data(atlas8): persist verified local Boolean reduction patterns"
            git push origin HEAD:experiment/drnas-atlas8-persistent-reduction-20261111
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS8-proven-reduction-catalog-and-discovery-log
          path: |
            research/atlas8_reduction_table.jsonl
            atlas8_discovery.log
