name: DRNAS GLOBAL LEARN X47 fresh paired training and sealed model promotion

on:
  push:
    branches:
      - experiment/drnas-global-memory-learn-20261113
      - main
    paths:
      - research/drnas_global_learning.py
      - tests/test_drnas_global_learning.py
      - .github/workflows/drnas-global-learning.yml
  schedule:
    - cron: '48 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: drnas-global-memory-single-writer
  cancel-in-progress: false

env:
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  locked_cycle:
    name: Fresh train-only pair collection, validation and independent 80-source holdout
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - name: Fetch Global Memory learning code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch pinned historical solver and learning modules (immutable)
        uses: actions/checkout@v4
        with:
          ref: c70e8833de8e5800fafa51b9b51ed4a4fe82f464
          path: pinned_x47
          persist-credentials: false

      - name: Fetch durable shared memory
        uses: actions/checkout@v4
        with:
          ref: experiment/drnas-global-memory-store-20261113
          path: global_store
          persist-credentials: true

      - name: Fetch original X47 learning audit (read-only)
        uses: actions/checkout@v4
        with:
          ref: experiment/drnas-x47-memory-store-20261113
          path: original_memory
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin dependencies, validate native source SHA, run safety tests
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.3.5
          echo '9c78f45aa54a2556fb9f22e490a200b77e70a4360245d998c4dc96bd0b684ab3  pinned_x47/src/drnas_x47.cpp' | sha256sum -c -
          python -m py_compile research/drnas_global_learning.py
          python -m unittest discover -s tests -p test_drnas_global_learning.py -v
          g++ -std=c++20 -O3 -Wall -Wextra -Wpedantic -Werror pinned_x47/src/drnas_x47.cpp -o drnas-native-global-x47

      - name: Collect 48 fresh paired train CNFs and evaluate candidate on new sealed cross-family holdout
        run: |
          set -euo pipefail
          CPU="$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')"
          PYTHONHASHSEED=0 taskset -c "$CPU" python -u research/drnas_global_learning.py \
            --store global_store/research/memory/global/global.sqlite.gz \
            --legacy-source pinned_x47 \
            --legacy-latest original_memory/research/memory/x47/latest.json \
            --binary drnas-native-global-x47 \
            --out global_learn_result \
            --run-id "${{ github.run_id }}" \
            --fresh-train-per-family 6 \
            --fresh-holdout-per-family 16 \
            --cap .35 | tee global_learn.log

      - name: Persist new training experiences, sealed holdout and carefully gated champion
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          from pathlib import Path
          import json
          p=Path('global_learn_result/report.json')
          r=json.loads(p.read_text())
          assert r['fresh_train']['source_count']==48
          assert r['holdout']['sources']==80 and r['holdout']['families']==5
          assert r['holdout']['incorrect_outputs']==0
          assert r['historical_train']>=18000
          assert r['historical_validation']>=6000
          assert r['promoted'] is True or r['reasons']
          print('DRNAS_GLOBAL_LEARN_GATE_CHECKED',
                json.dumps({'promoted':r['promoted'],
                            'holdout_gain':r['holdout']['vs_incumbent'],
                            'reason_if_rejected':r['reasons']}))
          PYCODE
          git -C global_store config user.name 'github-actions[bot]'
          git -C global_store config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C global_store add research/memory/global/global.sqlite.gz \
            research/memory/global/latest_learning.json
          if [[ -f global_store/research/memory/global/champion_x47.json ]]; then
            git -C global_store add research/memory/global/champion_x47.json
          fi
          git -C global_store commit -m "memory(global): learn fresh paired X47 training evidence, seal holdout and gate champion"
          git -C global_store push origin HEAD:experiment/drnas-global-memory-store-20261113
          echo "DRNAS_GLOBAL_LEARNING_PERSISTED run=${{ github.run_id }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drnas-global-learn-cycle-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            global_learn_result/report.json
            global_learn_result/candidate_x47.json
            global_learn_result/candidate_x47.txt
            global_learn.log
