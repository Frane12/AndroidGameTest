name: DRNAS family replication on four original SC2024 Tseitin CNFs
on:
  push:
    branches: [experiment/drnas-tseitin-n162-replay-20261101]
    paths: ['.github/workflows/drnas-tseitin-four-2024.yml', 'research/tseitin-replay/official_family.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V131-exact256-132-retrospective-audit
          run-id: 41255417615
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior131
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-UnOfficial-SATComp2026-Mini-216-Matched
          run-id: 41248293940
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-mini
      - uses: actions/download-artifact@v4
        with:
          name: v100-frozen-protocol-and-inputs
          run-id: 41245906965
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v100
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V132-frozen-24-new-inputs
          run-id: 41256313918
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v132
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V138-external2026-18-CNF-final-audit
          run-id: 41260140613
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v138
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V139-new-SC2024-12-frozen-verified-CNFs
          run-id: 41261415700
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v139
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V1313-30-fresh-SC2024-SHA-frozen
          run-id: 41263304031
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v1313
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V1316-blind30-new-SC2024-SHA-locked
          run-id: 41264586616
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v1316
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V143-30-NEW-SC2024-precommitted-SHA-manifest
          run-id: 41265926817
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v143
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V144-30-NEW-SC2024-precommitted-SHA-manifest
          run-id: 41266904911
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v144
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 41267740944
          github-token: ${{ github.token }}
          name: DRNAS-V145-30-NEW-SC2024-precommitted-SHA-manifest
          path: prior-v145
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 41267740944
          github-token: ${{ github.token }}
          name: DRNAS-V145-Native-Propagated-Parity-and-pinned-solvers
          path: bin
      - name: Freeze remaining original formulas and run the three pinned solvers
        run: |
          set -eu
          (cd bin && sha256sum -c binaries.sha256)
          chmod +x bin/kissat_solver bin/v142_fastgate bin/v145_native
          python3 -u research/tseitin-replay/official_family.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-official-tseitin-replication
          path: |
            external_manifest.json
            external_trials.json
          if-no-files-found: warn
