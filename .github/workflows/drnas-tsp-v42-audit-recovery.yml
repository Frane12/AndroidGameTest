name: DRNAS TSP v4.2 Repair Audit Only - Reuse Original 24 Measurements
on:
  push:
    branches: [experiment/drnas-tsp-v42-selective-stagnation-20261104]
    paths:
      - .github/workflows/drnas-tsp-v42-audit-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-only:
    name: Recover and validate existing v4.2 CSV without re-running solver
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_RUN_ID: '41749464053'
      SOURCE_ARTIFACT: DRNAS-TSP-V42-SELECTIVE-RESTARTS-VS-LKH-FINAL
    steps:
      - uses: actions/checkout@v4
      - name: Wait for original unchanged measurement archive
        run: |
          set -euo pipefail
          found=0
          for i in $(seq 1 110); do
            names="$(gh api "repos/Frane12/AndroidGameTest/actions/runs/${ORIGINAL_RUN_ID}/artifacts" --jq '.artifacts[].name' || true)"
            if printf '%s\n' "$names" | grep -Fqx "$SOURCE_ARTIFACT"; then
              found=1
              break
            fi
            sleep 8
          done
          if [ "$found" -ne 1 ]; then
            echo "R42_AUDIT_RECOVERY_FAIL: original run artifact absent"
            exit 1
          fi
          echo "R42_MEASUREMENT_REUSE_CONFIRMED run=${ORIGINAL_RUN_ID} name=${SOURCE_ARTIFACT}"
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-TSP-V42-SELECTIVE-RESTARTS-VS-LKH-FINAL
          run-id: 41749464053
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: original
      - name: Audit ONLY original measurements with time-invariant distinct-agent bound
        run: |
          set -euo pipefail
          test -s original/drnas_tsp_v42_paired.csv
          sha256sum original/drnas_tsp_v42_paired.csv | tee original_csv_sha256.txt
          python3 experiments/tsp_shared_v31/audit_v42_dynamic_elite.py \
            --csv original/drnas_tsp_v42_paired.csv --out independent_audit
          grep -F 'PASS_UNOFFICIAL' independent_audit/r42_final.json
          cat independent_audit/r42_final.md >> "$GITHUB_STEP_SUMMARY"
          echo "R42_RECOVERED_AUDIT_PASS: replayed zero solver measurements"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DRNAS-TSP-V42-RECOVERED-FINAL-AUDIT-NO-RERUN
          path: |
            independent_audit/
            original_csv_sha256.txt
          if-no-files-found: error
