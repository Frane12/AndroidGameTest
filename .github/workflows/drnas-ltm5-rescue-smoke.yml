name: DRNAS earliest queued LTM5 smoke - pinned 55e0580
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drnas-earliest-queued-ltm5-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact SHA for first queued LTM5 run 43095292436
        uses: actions/checkout@v4
        with:
          ref: '55e0580a6aac70a9bf240068fc8a9bfc713ab4c8'
          persist-credentials: false
      - name: Verify source provenance
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "55e0580a6aac70a9bf240068fc8a9bfc713ab4c8"
          echo "Original queued run: https://github.com/Frane12/AndroidGameTest/actions/runs/43095292436" >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA: 55e0580a6aac70a9bf240068fc8a9bfc713ab4c8" >> "$GITHUB_STEP_SUMMARY"
      - name: First queued LTM5 native smoke (canonical historical job)
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m unittest discover -s mi_ltm5 -p 'test_*.py' -v
          python3 research/drnas_atlas13_generator.py
          python3 research/drnas_atlas15_warm_patch.py
          python3 research/drnas_atlas15_cdcl_patch.py
          python3 research/drnas_atlas1_generate.py --out mre_atlas15/atlas1_table.hpp
          python3 research/drnas_atlas9_export_table.py research/atlas8_reduction_table.jsonl mre_atlas15/atlas8_rules.hpp
          python3 research/drnas_atlas16_build.py
          python3 research/drnas_atlas17_build.py
          python3 research/drnas_atlas19_build.py
          python3 research/drnas_atlas23_build.py
          python3 research/drnas_atlas36_build.py
          mkdir -p mre_atlas23/bin
          g++ -O2 -std=c++17 -I mre_atlas23 -I mre_atlas15 mre_atlas23/native.cpp -o mre_atlas23/bin/drnas_ltm5
          echo 'LTM5_NATIVE_SMOKE_PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-only scope
        if: always()
        run: |
          echo "Runs the exact first queued native LTM5 smoke selftests, generators and compile." >> "$GITHUB_STEP_SUMMARY"
          echo "Does not run paired benchmark, cancel queued jobs, nor alter historical outcomes." >> "$GITHUB_STEP_SUMMARY"
