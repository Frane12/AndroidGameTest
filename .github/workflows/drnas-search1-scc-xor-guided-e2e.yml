name: DRNAS SEARCH1 - original SHA SCC XOR mathematical search guidance renaming
run-name: SEARCH1 4-source 6s smoke then 12 original SHA x 8 arms x 2 reps 15s one CPU 192 E2E
on:
  push:
    branches: [experiment/drnas-search1-scc-xor-guided-variable-renumber-20261110]
    paths:
      - .github/workflows/drnas-search1-scc-xor-guided-e2e.yml
      - research/drnas_search1_guided_relabel.cpp
      - research/drnas_search1_guided_e2e.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-search1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  freeze:
    name: Build guided native C++ relabel, exhaustive small SAT lift, original EQUIV13 SHA freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Restore unchanged previously-seen 12 EQUIV13 original SHA and exact pinned reference binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42759838384 -R Frane12/AndroidGameTest -n equiv13-12-source-only-original-SHA-frozen-six-solvers -D .
          test -s mre_equiv13/manifest.json
          test -s mre_equiv12/manifest.json
          test -s mre_equiv10m5/manifest.json
          test -s mre_equiv9/manifest.json
          test -s mre_equiv7/manifest.json
          test -s built/bin/kissat_4_0_4
          test -s mre_equiv7/bin/cadical_3_0_1
          chmod +x built/bin/kissat_4_0_4 mre_equiv7/bin/cadical_3_0_1 mre_x4/bin/native mre_equiv12/bin/cryptominisat5
      - name: Compile C++ source-SCC and XOR3 based bijective renamer
        run: |
          set -euo pipefail
          mkdir -p mre_search1/bin
          g++ -O2 -std=c++17 -Wall -Wextra -Werror research/drnas_search1_guided_relabel.cpp -o mre_search1/bin/search1_relabel
          chmod +x mre_search1/bin/search1_relabel
          sha256sum mre_search1/bin/search1_relabel
      - name: Exhaustive original SAT proof equivalence, independent map replay and SHA freeze
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre_equiv12/lib:$PWD/mre5/lib"
          python3 -m py_compile research/drnas_search1_guided_e2e.py
          python3 -u research/drnas_search1_guided_e2e.py selftest | tee mre_search1/selftest.log
          grep -q '^SEARCH1_SELFTEST_PASS ' mre_search1/selftest.log
          python3 -u research/drnas_search1_guided_e2e.py freeze | tee mre_search1/freeze.log
          grep -q '^SEARCH1_FROZEN ' mre_search1/freeze.log
          python3 -u research/drnas_search1_guided_e2e.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search1-EQUIV13-12-original-SHA-guidance-binaries-frozen
          retention-days: 21
          if-no-files-found: error
          path: |
            mre_search1/manifest.json
            mre_search1/selftest.log
            mre_search1/freeze.log
            mre_search1/bin/search1_relabel
            mre_equiv13/manifest.json
            mre_equiv12/manifest.json
            mre_equiv12/bin/cryptominisat5
            mre_equiv12/lib/libcryptominisat5.so*
            mre_equiv10m5/manifest.json
            mre_equiv10medium/manifest.json
            mre_equiv9/manifest.json
            mre_equiv9/cases/*.cnf
            mre_equiv7/manifest.json
            mre_x20/manifest.json
            prior_x22/mre_x22/manifest.json
            prior_equiv6/mre_equiv6/manifest.json
            mre_x4/bin/native
            built/bin/kissat_4_0_4
            mre_equiv7/bin/cadical_3_0_1
            mre5/lib/libcryptominisat5.so.5.11
  pilot:
    name: Four source-geometry-selected SHA 32 matched E2E 6s trials
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: search1-EQUIV13-12-original-SHA-guidance-binaries-frozen, path: .}
      - name: One CPU per solver, 4-source precommitted pilot for correctness and timing
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre_equiv12/lib:$PWD/mre5/lib"
          chmod +x mre_search1/bin/search1_relabel built/bin/kissat_4_0_4 mre_equiv7/bin/cadical_3_0_1
          python3 -u research/drnas_search1_guided_e2e.py verify
          python3 -u research/drnas_search1_guided_e2e.py pilot | tee mre_search1/pilot.log
          grep -q '^SEARCH1_PILOT_PASS ' mre_search1/pilot.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search1-four-SHA-32-matched-short-E2E
          retention-days: 21
          path: |
            mre_search1/pilot.json
            mre_search1/pilot.log
  paired:
    name: SEARCH1 32 one-core SHA-paired original guided reverse placebo shard ${{ matrix.shard }}
    needs: pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: search1-EQUIV13-12-original-SHA-guidance-binaries-frozen, path: .}
      - name: Original-CNF SHA and original SAT witness checked exact renaming one CPU 15s
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre_equiv12/lib:$PWD/mre5/lib"
          chmod +x mre_search1/bin/search1_relabel built/bin/kissat_4_0_4 mre_equiv7/bin/cadical_3_0_1
          python3 -u research/drnas_search1_guided_e2e.py verify
          python3 -u research/drnas_search1_guided_e2e.py shard --shard ${{ matrix.shard }} | tee mre_search1/shard-${{ matrix.shard }}.log
          grep -q '^SEARCH1_SHARD_PASS ' mre_search1/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search1-shard-${{ matrix.shard }}
          retention-days: 21
          if-no-files-found: error
          path: |
            mre_search1/shard-${{ matrix.shard }}.json
            mre_search1/shard-${{ matrix.shard }}.log
  audit:
    name: Audit 192 strict original SHA PAR2 wall CPU paired placebo proof verification
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: search1-EQUIV13-12-original-SHA-guidance-binaries-frozen, path: .}
      - uses: actions/download-artifact@v4
        with:
          pattern: search1-shard-*
          path: mre_search1
          merge-multiple: true
      - name: Fail closed original SHA/permutation/witness paired results and source proof status
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre_equiv12/lib:$PWD/mre5/lib"
          chmod +x mre_search1/bin/search1_relabel built/bin/kissat_4_0_4 mre_equiv7/bin/cadical_3_0_1
          python3 -u research/drnas_search1_guided_e2e.py audit | tee mre_search1/audit.log
          grep -q '^SEARCH1_FINAL ' mre_search1/audit.log
          grep '^SEARCH1_FINAL ' mre_search1/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-SEARCH1-SCC-XOR3-GUIDED-192-E2E-STRICT-FINAL
          retention-days: 30
          path: |
            mre_search1/manifest.json
            mre_search1/report.json
            mre_search1/audit.log
            mre_search1/shard-*.json
