name: DRNAS SAT 72-CNF error-aware postmortem
on:
  push:
    branches: [experiment/drnas-sat-prereg72-audit-partial-20261031]
    paths:
      - '.github/workflows/drnas-sat-prereg72-partial-audit.yml'
      - 'research/drnas-sat-v7-8/prereg72_partial_audit.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  partial-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve ORIGINAL 12 shard artifacts including failed jobs
        uses: actions/download-artifact@v4
        with:
          pattern: prereg72-shard-*
          path: gathered
          run-id: 41222491055
          github-token: ${{ github.token }}
      - name: Verify original 72 identities, classify missing cases, report partial outcomes
        run: |
          set -euo pipefail
          python -m py_compile research/drnas-sat-v7-8/prereg72_partial_audit.py
          python -u research/drnas-sat-v7-8/prereg72_partial_audit.py
          cat prereg72_partial_audit/audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain detailed honest post-mortem without changing original failure status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRNAS-72-CNF-Partial-Postmortem-Not-Full
          path: prereg72_partial_audit/
          if-no-files-found: warn
