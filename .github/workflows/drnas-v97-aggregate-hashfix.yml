name: DRNAS V9.7 — Final Corrected 168-Trial Champion Audit (SHA and Table)
on:
  push:
    branches:
      - experiment/drnas-sat-v97-audit-hash-fix-20261031
    paths:
      - '.github/workflows/drnas-v97-aggregate-hashfix.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-saved-results:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: v94-frozen-new12-official-manifest
          run-id: 41232668762
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: manifests/old
      - uses: actions/download-artifact@v4
        with:
          name: official-v96-frozen-new12-source-and-record-timings
          run-id: 41237911915
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: manifests/new
      - uses: actions/download-artifact@v4
        with:
          pattern: v97-shard-*
          run-id: 41239690633
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: v97-results
      - name: Original score provenance, 168-run integrity, per-shard binary SHA, and full corrected audit
        shell: bash
        run: |
          set -euo pipefail
          test -f v97-results/v97-shard-0/results/raw.csv
          test -f v97-results/v97-shard-1/results/raw.csv
          test -f v97-results/v97-shard-2/results/raw.csv
          curl -fsSL --retry 3 --max-time 90 \
            https://raw.githubusercontent.com/satcompetition/2026/3e2dee7cf5aa643c77bf946280a3c1c520756ef9/downloads/scores.csv \
            -o official_scores.csv
          test "$(git hash-object official_scores.csv)" = 9c926b2bd35ac0fb4f3d0cf8f58c97178d43faef
          python3 -m py_compile research/drnas-sat-v7-8/v97_equal_hardware_audit.py
          python3 -u research/drnas-sat-v7-8/v97_equal_hardware_audit.py
          cat v97-results/v97_final_audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-v97-168-official-2026-same-core-CORRECTED-FULL-AUDIT
          path: v97-results/
          if-no-files-found: warn
