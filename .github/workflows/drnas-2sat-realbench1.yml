name: DRNAS 2SAT-EXACT1 authentic external + standard large 2CNF paired
on:
  push:
    branches: [experiment/drnas-2sat-realbench1-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-2cnf:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install independent SAT reference solvers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisat
          sudo apt-get install -y -qq cadical || true
          minisat -h 2>&1 | head -n 3 || true
          command -v cadical || true
      - name: Compile 2SAT C++20
        run: |
          g++ -std=c++20 -O3 -Wall -Wextra -Wpedantic src/drnas_2sat_exact.cpp -o drnas-2sat-exact
      - name: Paired blind-free pilot, full verified models and RUP
        run: |
          CADICAL="$(command -v cadical || true)"
          python3 tests/bench_drnas_2sat_real.py ./drnas-2sat-exact "$(command -v minisat)" "$CADICAL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 2sat-realbench1-results
          path: drnas_2sat_realbench1.json
          if-no-files-found: ignore
          retention-days: 14
