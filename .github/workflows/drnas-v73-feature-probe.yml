name: DRNAS SAT V7.3 Development Feature Probe
on:
  push:
    branches:
      - research/drnas-sat-risk-v7-3
    paths:
      - research/drnas-sat-v7-3/feature_probe.py
      - .github/workflows/drnas-v73-feature-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: SHA-verify 36 original developmental CNFs
        run: |
          python -u research/drnas-sat-real-2025/fetch_benchmarks.py \
            --manifest research/drnas-sat-real-2025/frozen_sources.json \
            --outdir "$GITHUB_WORKSPACE/feature_inputs"
      - name: Measure stability, polarity entropy, repeat connectivity
        run: |
          python -u research/drnas-sat-v7-3/feature_probe.py \
            --inputs "$GITHUB_WORKSPACE/feature_inputs/source-verification.json" \
            --out "$GITHUB_WORKSPACE/development_features.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drnas-v73-dev-features
          path: |
            development_features.json
            development_features.csv
            feature_inputs/source-verification.json
          if-no-files-found: warn
