name: DRNAS NATIVE C++ DRAT BRIDGE8 paired verified PAR2
on:
  push:
    branches: [experiment/drnas-structural-drat-nativecpp1-20261115]
    paths:
      - "src/drnas_structural_drat.cpp"
      - "research/structural_drat_bridge/**"
      - ".github/workflows/drnas-structural-drat-nativecpp.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native_cpp_proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 43717935841
          name: unified-core1-frozen
          github-token: ${{ github.token }}
          path: frozen
      - name: Restore exactly pinned DRNAS, Kissat, CaDiCaL and independent drat-trim
        run: |
          set -euo pipefail
          tar -xzf frozen/unified-core1-frozen.tgz
          chmod +x build/drnas-unified-core1 build/drat-trim build/kissat build/cadical
          sha256sum build/drnas-unified-core1 build/kissat build/cadical build/drat-trim
      - name: Compile source-defined native C++20 proof generator
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ libboost-dev libssl-dev
          g++ -O3 -DNDEBUG -std=c++20 -Wall -Wextra -Wpedantic -pthread \
            src/drnas_structural_drat.cpp -lcrypto -o build/drnas-structural-drat
          sha256sum build/drnas-structural-drat
      - name: Source-frozen 8-case 72-trial C++ E2E proof and negative-controls benchmark
        run: |
          set -euo pipefail
          python3 -u research/structural_drat_bridge/native_test.py 2>&1 | tee native_cpp.log
      - name: Archive exact CNFs, standard DRAT, checker logs and verified-only times
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-native-cpp-drat-bridge8-evidence
          path: |
            native_bridge8_results
            native_cpp.log
          retention-days: 60
