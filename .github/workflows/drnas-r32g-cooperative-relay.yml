name: DRNAS R32g certified inter-solver GF2 root-unit relay
on:
  push:
    branches: [experiment/drnas-r32g-cooperative-relay-20261103]
    paths:
      - '.github/workflows/drnas-r32g-cooperative-relay.yml'
      - 'experiments/drnas_v16/r32g_cooperative_relay_benchmark.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r32g-cooperative-relay-v1
  cancel-in-progress: true
jobs:
  freeze:
    name: Freeze 36 new synthetic original CNFs and preflight certified IPC
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check first
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/r32g_cooperative_relay_benchmark.py
      - name: Freeze new original CNFs without inspecting any results
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r32g_cooperative_relay_benchmark.py freeze --dest frozen
          (cd frozen && sha256sum -c cnf.sha256)
          python3 - <<'PY'
          import json
          m=json.load(open("frozen/manifest.json"))
          assert len(m["cases"])==36 and m["total_trials"]==540
          assert len(set(c["sha256"] for c in m["cases"]))==36
          print("R32G_FROZEN_SHA_PASS")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: r32e-binary-pair
          run-id: 41638482746
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: compiled
      - name: Validate exact pinned binary SHA and two allocated CPU cores
        run: |
          set -euo pipefail
          chmod +x compiled/clean compiled/native
          (cd compiled && sha256sum -c binaries.sha256)
          python3 - <<'PY'
          import os
          cores=sorted(os.sched_getaffinity(0))
          assert len(cores)>=2, "Need two allocated CPU cores"
          print("R32G_CPU_CORES",cores)
          PY
      - name: Test one actual source-to-receiver message and SAT witness audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys,json
          from pathlib import Path
          sys.path.insert(0,"experiments/drnas_v16")
          import r32g_cooperative_relay_benchmark as r
          import r31_consistent_gf2_test as r31
          import os
          case=next(c for c in json.load(open("frozen/manifest.json"))["cases"]
                    if c["family"]=="consistent_hidden" and c["cohort"]=="coupled_stress")
          path=Path("frozen")/case["name"]
          structure,_=r31.structure(path)
          assert structure["signal"]=="CONSISTENT_EXTRA_UNITS"
          proven={int(u["literal"]) for u in structure["units"]}
          assert len(proven)>=8
          binary={"clean":Path("compiled/clean").resolve(),
                  "native":Path("compiled/native").resolve()}
          cores=sorted(os.sched_getaffinity(0))[:2]
          row=r.parallel(case,path,"cooperative_relay",binary,cores,proven)
          assert row["status"]=="SAT",row
          print("R32G_IPC_PREFLIGHT_PASS",row)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r32g-36-frozen-originals
          path: frozen/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: r32g-pinned-binary-pair
          path: compiled/
          if-no-files-found: error
  paired:
    needs: freeze
    name: r32g-shard-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r32g-36-frozen-originals
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: r32g-pinned-binary-pair
          path: compiled
      - name: Verify source SHA and solver binary pair
        run: |
          set -euo pipefail
          chmod +x compiled/clean compiled/native
          (cd frozen && sha256sum -c cnf.sha256)
          (cd compiled && sha256sum -c binaries.sha256)
      - name: Compare clean, OFF, R32e, independent and communicating relay
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r32g_cooperative_relay_benchmark.py measure \
            --inputs frozen --clean compiled/clean --native compiled/native \
            --shard "$SHARD" --outdir results | tee r32g-live.log
          test -s results/rows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r32g-shard-${{ matrix.shard }}
          path: |
            results/
            r32g-live.log
          if-no-files-found: warn
  audit:
    needs: [freeze, paired]
    if: always()
    name: Audit 540 trials with synchronized proof relay, CPU and wall statistics
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r32g-36-frozen-originals
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: r32g-shard-*
          path: combined
      - name: Aggregate all matched cases and statistical reliability
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r32g_cooperative_relay_benchmark.py aggregate \
            --inputs frozen --combined combined --output r32g-results.json \
            --report r32g-results.md
          cat r32g-results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R32G-COOPERATIVE-GF2-RELAY-FINAL-540
          path: |
            r32g-results.json
            r32g-results.md
            frozen/manifest.json
          if-no-files-found: warn
