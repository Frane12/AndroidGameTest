name: DRNAS SAT v9.2 — original 540-result corrected audit (no solver reruns)
on:
  push:
    branches: [experiment/drnas-sat-v92-audit-fix-20261031]
    paths:
      - '.github/workflows/drnas-sat-v92-corrected-audit.yml'
      - 'research/drnas-sat-v7-8/summarize_v92_corrected.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  corrected-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v92-shard-*
          path: combined-v92-temp
          run-id: 41230152743
          github-token: ${{ github.token }}
      - name: Assemble original five immutable shard artifacts
        run: |
          set -euo pipefail
          mkdir -p combined-v92
          for shard in 0 1 2 3 4; do
            test -f "combined-v92-temp/v92-shard-$shard/manifest.json"
            mv "combined-v92-temp/v92-shard-$shard" "combined-v92/shard-$shard"
          done
          python3 -m py_compile research/drnas-sat-v7-8/summarize_v92_corrected.py
          python3 -u research/drnas-sat-v7-8/summarize_v92_corrected.py combined-v92
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-v92-CORRECTED-ORIGINAL-540-AUDIT
          path: combined-v92/
          if-no-files-found: warn
