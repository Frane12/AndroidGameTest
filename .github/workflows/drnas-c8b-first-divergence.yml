name: DRNAS C8b — first BVE vivify CDCL divergence three original SHA
on:
  push:
    branches: [experiment/drnas-cdcl-c8b-first-divergence-20261108]
    paths: ['.github/workflows/drnas-c8b-first-divergence.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-c8b-first-observable-bve-vivify-source3
  cancel-in-progress: false
jobs:
  prepare:
    name: Reuse exact C8 frozen original SHA and verify 5k pre-divergence control
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download C8 original sources (unchanged) and previous verified full PAR2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42524944723 -R Frane12/AndroidGameTest -n c8-frozen-C7-SHA6-and-cadical-factorial-pins -D .
          mkdir -p c8b_c8_previous c8b_out
          gh run download 42524944723 -R Frane12/AndroidGameTest -n DRNAS-C8-3SHA-36-E2E-PAR2-60-BVE-CDCL-SNAPSHOTS -D c8b_c8_previous
          test "$(find c8b_c8_previous -name report.json | wc -l)" -eq 1
          (cd mre11_easy && sha256sum -c source.sha256)
          (cd mre11b_blind && sha256sum -c source.sha256)
      - name: Verify CaDiCaL exact version and 5k equal CDCL counters
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical libgmp10
          test "$(cadical --version)" = "$(cat c8_out/cadical-version.txt)"
          python3 -m py_compile research/c8b_first_observable_divergence.py
          python3 -u research/c8b_first_observable_divergence.py verify | tee c8b_out/verify.log
          python3 -u research/c8b_first_observable_divergence.py smoke | tee c8b_out/smoke.log
          grep -q '^C8B_5K_FROZEN_SEARCH_PARITY_SMOKE_PASS' c8b_out/smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c8b-frozen-three-SHA-C8-full-reference-and-cadical-pin
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
          path: |
            mre11_easy/manifest.json
            mre11_easy/source.sha256
            mre11_easy/*.cnf
            mre11b_blind/manifest.json
            mre11b_blind/source.sha256
            mre11b_blind/*.cnf
            c7_source/dedup/manifest.json
            c7_source/dedup/*.cnf
            c7_out/cadical-version.txt
            c8_out/cadical-version.txt
            c8b_out/verify.log
            c8b_out/smoke.log
            c8b_c8_previous/
  trace:
    name: C8b source SHA ${{ matrix.shard }} first-event 14-window causal diagnostic
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0,1,2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: c8b-frozen-three-SHA-C8-full-reference-and-cadical-pin
          path: .
      - name: Assert same original CNF SHA and CaDiCaL binary before snapshots
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical libgmp10
          test "$(cadical --version)" = "$(cat c8_out/cadical-version.txt)"
          (cd mre11_easy && sha256sum -c source.sha256)
          (cd mre11b_blind && sha256sum -c source.sha256)
          python3 -u research/c8b_first_observable_divergence.py verify
      - name: Run 4x14 fixed snapshots and bracket first observed BVE vivify and CDCL divergence
        run: |
          set -euo pipefail
          mkdir -p c8b_out
          python3 -u research/c8b_first_observable_divergence.py shard --shard ${{ matrix.shard }} | tee c8b_out/shard-${{ matrix.shard }}.log
          grep -q '^C8B_SHARD_PASS ${{ matrix.shard }} 56$' c8b_out/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c8b-shard-${{ matrix.shard }}-first-bve-observable
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6
          path: |
            c8b_out/grid-${{ matrix.shard }}.json
            c8b_out/report-shard-${{ matrix.shard }}.json
            c8b_out/shard-${{ matrix.shard }}.log
  audit:
    name: C8b FINAL 168 source-locked snapshots and verified first-event brackets
    needs: trace
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: c8b-frozen-three-SHA-C8-full-reference-and-cadical-pin
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: c8b-shard-*-first-bve-observable
          merge-multiple: true
          path: c8b_out
      - name: Fail-closed original SHA diagnostic and old end-to-end PAR2 separation
        run: |
          set -euo pipefail
          (cd mre11_easy && sha256sum -c source.sha256)
          (cd mre11b_blind && sha256sum -c source.sha256)
          python3 -u research/c8b_first_observable_divergence.py audit | tee c8b_out/audit.log
          grep -q '^C8B_FINAL' c8b_out/audit.log
          grep '^C8B_FINAL' c8b_out/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-C8B-FIRST-OBSERVABLE-BVE-VIVIFY-CDCL-DIVERGENCE
          retention-days: 30
          if-no-files-found: warn
          path: |
            c8b_out/report.json
            c8b_out/audit.log
            c8b_out/report-shard-*.json
            c8b_out/shard-*.log
