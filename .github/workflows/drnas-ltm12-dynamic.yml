name: DRNAS LTM12 dynamic grouped curriculum and structural reductions
on:
  push:
    branches: [experiment/drnas-ltm12-dynamic-20261112]
    paths:
      - .github/workflows/drnas-ltm12-dynamic.yml
      - research/drnas_ltm12_progressive.py
      - research/test_ltm12_routing_budget.py
      - research/drnas_ltm12_dynamic.py
      - research/drnas_math14*
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drnas-ltm12-dynamic
  cancel-in-progress: false
jobs:
  train_validate_holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned reference solvers (no APK, no Android build)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake git cadical cryptominisat python3-venv
          git init /tmp/drnas-ltm12-kissat
          git -C /tmp/drnas-ltm12-kissat remote add origin https://github.com/arminbiere/kissat.git
          git -C /tmp/drnas-ltm12-kissat fetch --depth 1 origin 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          git -C /tmp/drnas-ltm12-kissat checkout --detach FETCH_HEAD
          (cd /tmp/drnas-ltm12-kissat && ./configure && make -j2)
          sudo install /tmp/drnas-ltm12-kissat/build/kissat /usr/local/bin/kissat
          {
            git rev-parse HEAD
            git -C /tmp/drnas-ltm12-kissat rev-parse HEAD
            kissat --version
            cadical --version
            cryptominisat5 --version
            g++ --version
          } > ltm12_versions.txt
      - name: Build frozen native SAT engines and independently check mathematical certificates
        run: |
          set -euo pipefail
          python3 research/drnas_ltm9_cert_compile.py
          python3 research/drnas_ltm9_selftest.py
          python3 research/drnas_ltm9_independent_cert.py
          g++ -std=c++17 -O2 -I research research/drnas_math14_test.cpp -o /tmp/math14-test
          /tmp/math14-test > math14-selftest.log
          python3 research/drnas_math14_compile.py
      - name: Syntax, policy and original-CNF witness selftests
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_ltm12_progressive.py research/drnas_ltm11_real2.py research/drnas_ltm11_policy.py
          python3 research/drnas_ltm12_fast600.py --selftest
          python3 research/drnas_ltm12_dynamic.py --selftest --seed 71
      - name: SAT smoke on all five actual solvers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, sys, tempfile
          sys.path.insert(0,"research")
          import drnas_ltm12_progressive as L
          L.setup_source()
          with tempfile.TemporaryDirectory() as td:
              p=pathlib.Path(td)/"tiny-original.cnf"
              p.write_text("p cnf 3 3\n1 2 0\n-2 3 0\n-3 0\n")
              s={"path":str(p),"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                 "id":-1,"split":"train"}
              for arm in L.SCREEN_ARMS:
                  row=L.run_checked(arm,s,17,3.0)
                  assert row["status"]=="SAT_VERIFIED",(arm,row)
                  print("LTM12_SMOKE_PASS",arm,row["e2e_s"],flush=True)
          PY
      - name: Deterministic outer-budget regression tests
        run: python3 research/test_ltm12_routing_budget.py
      - name: MATH14 original-CNF witness smoke
        run: |
          python3 - <<'PY'
          import sys, tempfile, pathlib, hashlib, os
          sys.path.insert(0, 'research')
          import drnas_ltm12_math14 as M
          os.sched_setaffinity(0, {min(os.sched_getaffinity(0))})
          M.L.setup_source()
          with tempfile.TemporaryDirectory() as td:
              raw, witness = M.generate('xor_pairs', 44000001)
              p = pathlib.Path(td)/'original.cnf'; p.write_text(raw)
              source = dict(id=-1, split='train', path=str(p), sha256=hashlib.sha256(raw.encode()).hexdigest(), family='xor_pairs')
              row = M.run_checked('MATH14', source, 17, 3.)
              assert row['status']=='SAT_VERIFIED', row
              assert row['math14_telemetry'], row
              print('LTM12_MATH14_SMOKE_PASS', row, flush=True)
          PY
      - name: Serial one CPU frozen-policy paired pilot
        run: |
          set -euo pipefail
          python3 -u research/drnas_ltm12_dynamic.py | tee ltm12_dynamic.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ltm12-dynamic-compact
          retention-days: 30
          path: |
            ltm12_versions.txt
            math14-selftest.log
            ltm12_dynamic.log
            ltm12_dynamic/*.json
            ltm12_dynamic/*.jsonl
