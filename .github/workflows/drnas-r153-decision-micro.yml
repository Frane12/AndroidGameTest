name: DRNAS R153 decision-time-only microbenchmark frozen 13 CNFs
on:
  push:
    branches: [experiment/drnas-r153-certified-units-gf2-20261105]
    paths: ['.github/workflows/drnas-r153-decision-micro.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  decision:
    name: Native exact GF2 classification only no SAT solver attempts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r152-new-lightsout-frozen-originals-and-provenance
          run-id: 42102227483
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r153decision
      - name: Compile frozen R28 and optimized R153 verify original source manifest
        run: |
          set -euo pipefail
          mkdir -p r153decision
          python3 -m py_compile research/r153_decision_microbench.py
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -Werror experiments/drnas_v16/r28_exact_gf2.cpp -o r153decision/r28
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -Werror research/r153_exact_units_gf2.cpp -o r153decision/r153
          test -s r153decision/frozen/manifest.json
      - name: CPU-pinned 12 paired classify-only repetitions and internal decision clock
        run: |
          set -euo pipefail
          python3 -u research/r153_decision_microbench.py | tee r153decision/run.log
          grep -q '^R153_DECISION_FINAL ' r153decision/run.log
          cat r153decision/report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R153-DECISION-COST-NO-SOLVER-156-PAIRS
          path: |
            r153decision/report.json
            r153decision/raw.json
            r153decision/run.log
          if-no-files-found: warn
          retention-days: 90
