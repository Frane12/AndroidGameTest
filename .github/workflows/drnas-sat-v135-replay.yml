name: DRNAS V13.5 - Frozen Router Replay on 30 Structural CNFs
on:
  push:
    branches: [experiment/drnas-v135-train-only-structural-router-20261101]
    paths:
      - '.github/workflows/drnas-sat-v135-replay.yml'
      - 'research/drnas-sat-v7-8/v135_replay_on_v134.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V135-structural-router-training-only
          run-id: 41258109631
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: fixed-model
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V134-30-case-structural-ladder-audit
          run-id: 41257840485
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: v134
      - name: Verify frozen model and run holdout replay
        run: |
          set -euo pipefail
          (cd fixed-model && sha256sum -c v135_model.sha256)
          test -s v134/v134_report.json
          python3 -m py_compile research/drnas-sat-v7-8/v135_replay_on_v134.py
          python3 research/drnas-sat-v7-8/v135_replay_on_v134.py \
            --model fixed-model/v135_model.json \
            --source v134/v134_report.json \
            --json v135_replay.json --md v135_replay.md
          cat v135_replay.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V135-locked-30-CNF-synthetic-replay
          path: |
            v135_replay.json
            v135_replay.md
          if-no-files-found: warn
