name: DRNAS SAT-MATCH1 direct SAT-model construction from clause Hall structure
on:
  push:
    branches: [experiment/drnas-sat-clause1-20261115]
    paths:
      - research/sat_match1/**
      - .github/workflows/drnas-sat-match1.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-sat-match1-20261115
  cancel-in-progress: false
jobs:
  original_model_screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 43613581688
          name: cf7-source-manifest
          github-token: ${{ github.token }}
          path: frozen/cf7
      - name: Restore fixed original 100 SAT2024 CNFs
        run: |
          set -euo pipefail
          tar -xzf frozen/cf7/cf7_inputs.tgz
          sha256sum cf7/manifest.json
          python3 -m py_compile research/sat_match1/model.py research/sat_match1/benchmark.py
      - name: Construct and verify clause-derived SAT models on one CPU
        run: |
          set -euo pipefail
          OMP_NUM_THREADS=1 python3 -u research/sat_match1/benchmark.py
      - name: Retain reproducibility and original CNF witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sat-match1-real100
          path: sat_match1_results/
          if-no-files-found: warn
          retention-days: 30
