name: DRNAS R109 selective C++ hidden XOR proof benchmark
on:
  push:
    branches: [experiment/drnas-r109-selective-hidden-xor-20261104]
    paths:
      - '.github/workflows/drnas-r102-xor-value.yml'
      - 'research/r109_native_selective_xor.cpp'
      - 'research/r109_selective_selftest.py'
      - 'research/r109_selective_benchmark.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selective-hidden-xor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build R109 optimized native XOR and frozen R107C reference
        run: |
          set -euo pipefail
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -Werror research/r107c_native_xor_finder.cpp -o /tmp/r109-r107c
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -Werror research/r109_native_selective_xor.cpp -o /tmp/r109-native
          python3 -m py_compile research/r109_selective_selftest.py research/r109_selective_benchmark.py
      - name: Fail-closed selftests: preserve every old XOR and prove hidden parity
        run: |
          set -euo pipefail
          python3 research/r107c_native_selftest.py /tmp/r109-r107c | tee r109-baseline-test.txt
          python3 research/r109_selective_selftest.py /tmp/r109-native /tmp/r109-r107c | tee r109-selftest.txt
          grep -q '^R109_NATIVE_SELECTIVE_SELFTEST_PASS' r109-selftest.txt
      - name: Build unchanged pinned CaDiCaL rel-2.1.0
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/arminbiere/cadical.git /tmp/r109-cadical
          cd /tmp/r109-cadical
          git checkout rel-2.1.0
          git rev-parse HEAD > "$GITHUB_WORKSPACE/r109-cadical-commit.txt"
          ./configure
          make -j2
      - name: Verify eight original SAT Competition 2025 formula hashes
        run: |
          set -euo pipefail
          python3 research/r106_fetch_real_cnf.py r109-results/source
      - name: Paired R109 vs R107C on real SAT2025 and hidden-XOR controls
        run: |
          set -euo pipefail
          python3 research/r109_selective_benchmark.py r109-results /tmp/r109-r107c /tmp/r109-native /tmp/r109-cadical/build/cadical | tee r109-audit.txt
          grep -q '^R109_COMPLETE_AUDIT' r109-audit.txt
      - name: Upload source SHA manifest proof evidence and timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R109-SELECTIVE-NATIVE-HIDDEN-XOR-CERTIFIED
          path: |
            r109-results/
            r109-baseline-test.txt
            r109-selftest.txt
            r109-audit.txt
            r109-cadical-commit.txt
          if-no-files-found: warn
