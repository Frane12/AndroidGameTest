name: DRNAS R111 live GF2 CDCL IPASIR-UP four parallel regression shards
on:
  push:
    branches: [experiment/drnas-r111-live-gf2-cdcl-20261104]
    paths:
      - '.github/workflows/drnas-r102-xor-value.yml'
      - 'research/r111_live_gf2_cdcl.cpp'
      - 'research/r111_live_benchmark.py'
      - 'research/r111_frozen_eval_manifest.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-regression:
    name: R111 live GF2 CDCL shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Build frozen CaDiCaL rel-2.1.0 plus verified XOR2-6 native root
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/arminbiere/cadical.git /tmp/r111-cadical
          cd /tmp/r111-cadical
          git checkout rel-2.1.0
          git rev-parse HEAD > "$GITHUB_WORKSPACE/r111-cadical-commit.txt"
          ./configure
          make -j2
          cd "$GITHUB_WORKSPACE"
          g++ -std=c++17 -O3 -Wall -Wextra -Werror research/r107c_native_xor_finder.cpp -o /tmp/r111-r107c
          python3 research/r107c_native_selftest.py /tmp/r111-r107c | tee r111-root-selftest.txt
          grep -q '^R107C_NATIVE_CERTIFIED_SELFTEST_PASS' r111-root-selftest.txt
      - name: Compile in-process GF2 IPASIR-UP callbacks and verify reason/backtrack
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I/tmp/r111-cadical/src research/r111_live_gf2_cdcl.cpp /tmp/r111-cadical/build/libcadical.a -o /tmp/r111-live
          /tmp/r111-live selftest | tee r111-live-selftest.txt
          grep -q '^R111_GF2_BIDIRECTIONAL_SELFTEST_PASS' r111-live-selftest.txt
          python3 -m py_compile research/r111_live_benchmark.py
      - name: Download and verify pinned Kissat 4.0.4 and CryptoMiniSat 5.17.0
        run: |
          set -euo pipefail
          mkdir -p /tmp/r111/kissat /tmp/r111/cms
          curl -fsSL --retry 3 --max-time 120 'https://github.com/arminbiere/kissat/releases/download/rel-4.0.4/kissat-4.0.4-linux-amd64.zip' -o /tmp/r111/kissat.zip
          echo '63282e5168ca040a2018edfba0726bf893a7a6bcdb1db87feb67857e2da697a7  /tmp/r111/kissat.zip' | sha256sum --check
          unzip -oq /tmp/r111/kissat.zip -d /tmp/r111/kissat
          find /tmp/r111/kissat -type f -iname '*kissat*' -exec chmod +x '{}' \;
          find /tmp/r111/kissat -type f -iname '*kissat*' -print -quit > /tmp/r111/kissat-path
          test -s /tmp/r111/kissat-path
          curl -fsSL --retry 3 --max-time 120 'https://github.com/msoos/cryptominisat/releases/download/release/v5.17.0/cryptominisat5-v5.17.0-linux-amd64.tar.gz' -o /tmp/r111/cms.tar.gz
          echo '474ff5cfaf77de7438dc063dbe4ccefcbb7dcf1e17de702c34ed88f5e026eda7  /tmp/r111/cms.tar.gz' | sha256sum --check
          tar -xzf /tmp/r111/cms.tar.gz -C /tmp/r111/cms
          find /tmp/r111/cms -type f -iname '*cryptominisat*' -exec chmod +x '{}' \;
          find /tmp/r111/cms -type f -iname '*cryptominisat*' -print -quit > /tmp/r111/cms-path
          test -s /tmp/r111/cms-path
          "$(cat /tmp/r111/kissat-path)" --version
          "$(cat /tmp/r111/cms-path)" --version
      - name: Timed five-way live GF2 CDCL regression and SHA verified originals
        run: |
          set -euo pipefail
          python3 -u research/r111_live_benchmark.py \
            --shard '${{ matrix.shard }}' \
            --out "r111-shard-${{ matrix.shard }}" \
            --cadical /tmp/r111-cadical/build/cadical \
            --kissat "$(cat /tmp/r111/kissat-path)" \
            --cms "$(cat /tmp/r111/cms-path)" \
            --r107c /tmp/r111-r107c \
            --r111 /tmp/r111-live | tee "r111-shard-${{ matrix.shard }}.txt"
          grep -q '^R111_SHARD_COMPLETE_AUDIT' "r111-shard-${{ matrix.shard }}.txt"
      - name: Upload proof replay evidence and paired solver timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R111-LIVE-GF2-CDCL-SHARD-${{ matrix.shard }}
          path: |
            r111-shard-${{ matrix.shard }}/
            r111-shard-${{ matrix.shard }}.txt
            r111-live-selftest.txt
            r111-root-selftest.txt
            r111-cadical-commit.txt
          if-no-files-found: warn
