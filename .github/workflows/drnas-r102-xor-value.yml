name: DRNAS R111 in-process GF2 CDCL IPASIR-UP integration
on:
  push:
    branches: [experiment/drnas-r111-cdcl-gf2-ipasirup-20261104]
    paths:
      - '.github/workflows/drnas-r102-xor-value.yml'
      - 'research/r111_*.cpp'
      - 'research/r111_*.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cdcl-gf2-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned CaDiCaL 2.1.0 static library
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/arminbiere/cadical.git /tmp/r111-cadical
          cd /tmp/r111-cadical
          git checkout rel-2.1.0
          git rev-parse HEAD > "$GITHUB_WORKSPACE/r111-cadical-commit.txt"
          ./configure
          make -j2
          test -f build/libcadical.a
      - name: Build actual R111 CaDiCaL ExternalPropagator
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror -I/tmp/r111-cadical/src             research/r111_cdcl_gf2_bridge.cpp /tmp/r111-cadical/build/libcadical.a             -pthread -o /tmp/r111-bridge
      - name: Differential GF2 assignments and backtracking, known SAT-UNSAT
        run: |
          set -euo pipefail
          python3 -u research/r111_cdcl_gf2_selftest.py /tmp/r111-bridge | tee r111-selftest.txt
          grep -q '^R111_IPASIRUP_GF2_SELFTEST_PASS' r111-selftest.txt
      - name: Upload R111 build and proof test audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R111-IPASIR-UP-GF2-PILOT-SELFTEST
          path: |
            r111-selftest.txt
            r111-cadical-commit.txt
          if-no-files-found: warn
