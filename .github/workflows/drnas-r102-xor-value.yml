name: DRNAS R107A certified XOR finder SAT2025 audit
on:
  push:
    branches: [experiment/drnas-r107a-xor-finder-20261104]
    paths:
      - '.github/workflows/drnas-r102-xor-value.yml'
      - 'research/r107a_xor_finder.py'
      - 'research/r107a_real_audit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  xor-finder-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Full 2-6 XOR pattern and independent certificate selftest
        run: |
          set -euo pipefail
          python3 research/r107a_xor_finder.py selftest | tee r107a-selftest.txt
          grep -q '^R107A_SELFTEST_PASS' r107a-selftest.txt
      - name: Fetch eight immutable original SAT Competition 2025 formulas
        run: |
          set -euo pipefail
          python3 research/r106_fetch_real_cnf.py r107a-results/source
      - name: Compare frozen R105 3-XOR finder against R107A 2-6 certified decoder
        run: |
          set -euo pipefail
          python3 research/r107a_real_audit.py r107a-results | tee r107a-audit.txt
          grep -q '^R107A_COMPLETE_AUDIT' r107a-audit.txt
      - name: Publish SHA manifest, per-formula evidence and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R107A-REAL-SAT2025-XOR-FINDER-CERTIFIED
          path: |
            r107a-results/
            r107a-selftest.txt
            r107a-audit.txt
          if-no-files-found: warn
