name: DRNAS R108 hidden XOR from shortened and resolved CNF
on:
  push:
    branches: [experiment/drnas-r108-hidden-xor-20261104]
    paths:
      - '.github/workflows/drnas-r102-xor-value.yml'
      - 'research/r108_hidden_xor.py'
      - 'research/r108_hidden_xor_benchmark.py'
      - 'research/r106_manifest.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hidden-xor-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check and R108 hidden-XOR proof selftests
        run: |
          set -euo pipefail
          python3 -m py_compile research/r108_hidden_xor.py research/r108_hidden_xor_benchmark.py
          python3 research/r108_hidden_xor.py selftest | tee r108-selftest.txt
          grep -q '^R108_HIDDEN_XOR_SELFTEST_PASS' r108-selftest.txt
      - name: Build pinned CaDiCaL and frozen R107C native control
        run: |
          set -euo pipefail
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -Werror research/r107c_native_xor_finder.cpp -o /tmp/r107c_native_xor
          python3 research/r107c_native_selftest.py /tmp/r107c_native_xor | tee r107c-selftest.txt
          grep -q '^R107C_NATIVE_CERTIFIED_SELFTEST_PASS' r107c-selftest.txt
          git clone --quiet https://github.com/arminbiere/cadical.git /tmp/r108-cadical
          cd /tmp/r108-cadical
          git checkout rel-2.1.0
          git rev-parse HEAD > "$GITHUB_WORKSPACE/cadical-r108-commit.txt"
          ./configure
          make -j2
      - name: SHA verify eight real original 2025 CNF formulas
        run: |
          set -euo pipefail
          python3 research/r106_fetch_real_cnf.py r108-results/source
      - name: Baseline vs compressed XOR vs two-round resolution on real and hidden controls
        run: |
          set -euo pipefail
          python3 research/r108_hidden_xor_benchmark.py r108-results /tmp/r107c_native_xor /tmp/r108-cadical/build/cadical | tee r108-benchmark.txt
          grep -q '^R108_COMPLETE_AUDIT' r108-benchmark.txt
      - name: Upload full inputs evidence and paired times
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R108-CERTIFIED-HIDDEN-XOR-SAT2025-PROOF-AUDIT
          path: |
            r108-results/
            r108-selftest.txt
            r107c-selftest.txt
            r108-benchmark.txt
            cadical-r108-commit.txt
          if-no-files-found: warn
