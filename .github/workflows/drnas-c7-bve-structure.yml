name: DRNAS C7-S — original CNF duplicate BVE occurrence structural causal proxy
on:
  push:
    branches: [experiment/drnas-cdcl-c7-world-standard-bve-20261108]
    paths: ['.github/workflows/drnas-c7-bve-structure.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-structure:
    name: Six original SHA source-only duplicate BVE eligibility geometry audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: c7-certified-sources-CMS-CaDiCaL-Kissat-pins
          run-id: 42523071479
          github-token: ${{ github.token }}
          path: .
      - name: SHA replay and raw versus source-certified duplicate CNF proxy check
        run: |
          set -euo pipefail
          (cd mre11_easy && sha256sum -c source.sha256)
          (cd mre11b_blind && sha256sum -c source.sha256)
          python3 -m py_compile research/c7_source_bve_structure_probe.py
          python3 -u research/c7_source_bve_structure_probe.py | tee c7_bve_proxy.log
          grep -q '^C7_BVE_PROXY_FINAL' c7_bve_proxy.log
          grep '^C7_BVE_PROXY_FINAL' c7_bve_proxy.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-C7-S-ORIGINAL-SHA6-CNF-BVE-STRUCTURAL-PROXY
          retention-days: 30
          if-no-files-found: warn
          path: |
            c7_structure/report.json
            c7_bve_proxy.log
