name: DRNAS XORHARD2 source freeze before any solver
on:
  push:
    branches: [experiment/drnas-sat-xorhard2-20261115]
    paths:
      - research/xor_hard2/freeze.py
      - .github/workflows/drnas-xorhard2-freeze.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drnas-xorhard2-freeze
  cancel-in-progress: false
jobs:
  frozen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Freeze 60 independent large SAT XOR originals before solver attempts
        run: |
          set -euo pipefail
          python3 -m py_compile research/xor_hard2/freeze.py
          python3 -u research/xor_hard2/freeze.py
          tar -czf xorhard2-frozen.tgz xor_hard2_inputs
          sha256sum xor_hard2_inputs/manifest.json xorhard2-frozen.tgz \
            research/xor_hard2/freeze.py
      - uses: actions/upload-artifact@v4
        with:
          name: xorhard2-frozen-60
          path: |
            xorhard2-frozen.tgz
            xor_hard2_inputs/manifest.json
          retention-days: 60
          if-no-files-found: error
