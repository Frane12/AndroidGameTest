name: DRNAS MRE6f — repeat 3 seeded cases and control 72 bounded CDCL probes
on:
  push:
    branches: [experiment/drnas-mre6f-repeat-causal-20261108]
    paths: ['.github/workflows/drnas-mre6f-repeat-causal.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-mre6f-repeat-causal-20261108
  cancel-in-progress: false
jobs:
  prepare:
    name: Reuse immutable MRE6e binary and source artifacts and verify 3 groups
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore upstream run 42499473274 without recompiling or replacing inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42499473274 --repo Frane12/AndroidGameTest -n mre6e-frozen-7-CMS-pinned-bounded -D .
          (cd mre6b_blind && sha256sum -c source.sha256)
          sha256sum -c mre6e/binary.sha256
          python3 -u research/mre6b_blind_freeze.py verify
          python3 -m py_compile research/mre6f_repeat_causal.py research/mre6e_conflict_diagnostic.py
          python3 -u research/mre6f_repeat_causal.py selftest
          python3 - <<'PY'
          import sys
          sys.path.insert(0,"research")
          import mre6f_repeat_causal as r
          cases=r.selected()
          for prefix,c in cases.items():
              print("MRE6F_FROZEN_GROUP",prefix,r.CASE_LABELS[prefix],c["sha256"])
          assert set(cases)=={"2fcd8533","a45aefde","de8c42d5"}
          print("MRE6F_THREE_FROZEN_SOURCE_GROUPS_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mre6f-pinned-input
          retention-days: 10
          compression-level: 6
          path: |
            mre6b_blind/manifest.json
            mre6b_blind/source.sha256
            mre6b_blind/*.cnf
            mre5/lib/libcryptominisat5.so.5.11
            mre6e/native
            mre6e/binary.sha256
  cases:
    name: MRE6f frozen source ${{ matrix.prefix }} 3 seeds x 2 conflict caps x 4 arms
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        prefix: [2fcd8533, a45aefde, de8c42d5]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mre6f-pinned-input
          path: .
      - name: Verify source, native binary, and dynamically resolved exact pinned CMS
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgmp10
          ln -sf libcryptominisat5.so.5.11 mre5/lib/libcryptominisat5.so
          ln -sf libcryptominisat5.so.5.11 mre5/lib/libcryptominisat5.so.5
          (cd mre6b_blind && sha256sum -c source.sha256)
          sha256sum -c mre6e/binary.sha256
          python3 -u research/mre6b_blind_freeze.py verify
          chmod +x mre6e/native
          LD_LIBRARY_PATH="$PWD/mre5/lib" ldd mre6e/native | tee mre6f-ldd.txt
          grep "$PWD/mre5/lib/libcryptominisat5.so" mre6f-ldd.txt
      - name: Execute all 24 predeclared 3-seed positive-or-control trials
        run: |
          set -euo pipefail
          mkdir -p mre6f
          export LD_LIBRARY_PATH="$PWD/mre5/lib:${LD_LIBRARY_PATH:-}"
          python3 -u research/mre6f_repeat_causal.py case --prefix ${{ matrix.prefix }} --binary mre6e/native | tee mre6f/case-${{ matrix.prefix }}.log
          grep -q '^MRE6F_CASE_PASS ${{ matrix.prefix }} 24' mre6f/case-${{ matrix.prefix }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mre6f-case-${{ matrix.prefix }}
          retention-days: 10
          path: |
            mre6f/case-${{ matrix.prefix }}.json
            mre6f/case-${{ matrix.prefix }}.log
  audit:
    name: Audit 72 complete posthoc source-paired CDCL repeats
    needs: cases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mre6f-pinned-input
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: mre6f-case-*
          merge-multiple: true
          path: mre6f
      - name: Validate source and true paired repeat outcomes without promotion
        run: |
          set -euo pipefail
          (cd mre6b_blind && sha256sum -c source.sha256)
          python3 -u research/mre6f_repeat_causal.py audit | tee mre6f/audit.log
          grep -q '^MRE6F_FINAL' mre6f/audit.log
          cat mre6f/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-MRE6F-3SEEDS-3GROUPS-72-CAUSAL-FINAL
          retention-days: 30
          path: |
            mre6f/report.json
            mre6f/audit.log
            mre6b_blind/manifest.json
