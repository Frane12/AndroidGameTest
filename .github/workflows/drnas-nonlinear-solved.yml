name: DRNAS nonlinear previously solved originals
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-nonlinear-solved-only
  cancel-in-progress: false
jobs:
  solved_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 43587320318
          name: delta3-proof-first-preflight
          github-token: ${{ github.token }}
          path: frozen/delta3
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 43593699141
          name: delta4x-proof-first-frozen
          github-token: ${{ github.token }}
          path: frozen/delta4x
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 43587320318
          name: delta3-real36-final
          github-token: ${{ github.token }}
          path: history
      - name: Restore original formulas, frozen references and reproduce source
        run: |
          set -euo pipefail
          tar -xzf frozen/delta3/delta3_bench_frozen.tgz
          tar -xzf frozen/delta4x/delta4x_bench_frozen.tgz
          sha256sum -c build/DELTA3_FROZEN.sha256
          sha256sum -c build/DELTA4X_FROZEN.sha256
          python3 research/drnas_delta4x/build.py
          python3 research/drnas_nl_solved/build.py
      - name: Verify semantics and benchmark only previously solved nonlinear originals
        run: |
          set -euo pipefail
          python3 research/drnas_nl_solved/validate.py
          python3 research/drnas_nl_solved/bench.py --history history/delta3_final/trials.json --reps 20 --out nl_solved_ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nonlinear-solved-only-results
          retention-days: 60
          path: |
            nl_solved_ci/
            nl_solved_validation.json
            build/drnas_nl_solved.cpp
            build/drnas-nl-solved
