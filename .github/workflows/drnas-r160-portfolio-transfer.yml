name: DRNAS R160 frozen R159-trained portfolio on 24 original external CNFs four-way
on:
  push:
    branches: [experiment/drnas-r160-audited-portfolio-transfer-20261106]
    paths:
      - research/r160_portfolio_transfer.py
      - .github/workflows/drnas-r160-portfolio-transfer.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r160-frozen24-portfolio
  cancel-in-progress: false

jobs:
  freeze:
    name: Freeze original SHA 24 cases and R159-only category portfolio before R160 timing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and V15.3.1 freeze guard
        run: |
          set -euo pipefail
          test "$(git hash-object research/drnas-sat-v7-8/v1531_nohang.cpp)" = d280a2ffa28d72aec183323bbea40544d676112d
          python3 -m py_compile research/r160_portfolio_transfer.py
      - uses: actions/download-artifact@v4
        with:
          name: r151-frozen-model-and-independent-real-40
          run-id: 42094754907
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r160-r151-source
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-R159-STRICT-AUDITED-240-REAL-REUSED-R151-R158-SHADOW
          run-id: 42134974748
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r160-r159-audit
      - name: Verify audited 16 history and freeze complementary 24 source SHA
        run: |
          set -euo pipefail
          python3 -u research/r160_portfolio_transfer.py freeze | tee r160-freeze.log
          grep -q '^R160_FROZEN_24_PASS ' r160-freeze.log
          test -s r160/frozen/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: r160-precommitted-original24-and-portfolio-map
          path: |
            r160/frozen/manifest.json
            r160-freeze.log
          retention-days: 90
          if-no-files-found: error

  benchmark:
    name: R160 four actually executed policies 72 paired attempts shard ${{ matrix.shard }}
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r151-frozen-model-and-independent-real-40
          run-id: 42094754907
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r160-r151-source
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-R159-STRICT-AUDITED-240-REAL-REUSED-R151-R158-SHADOW
          run-id: 42134974748
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r160-r159-audit
      - uses: actions/download-artifact@v4
        with:
          name: r160-precommitted-original24-and-portfolio-map
          path: r160-frozen-download
      - name: Restore exact frozen SHA model and original source list
        run: |
          set -euo pipefail
          mkdir -p r160/frozen
          cp r160-frozen-download/r160/frozen/manifest.json r160/frozen/manifest.json
      - uses: actions/download-artifact@v4
        with:
          name: r52-three-pinned-solvers
          run-id: 41684183452
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: built/bin
      - name: Verify pinned binary SHA, pinned CPU and frozen stable native compilation
        run: |
          set -euo pipefail
          (cd built/bin && sha256sum -c binaries.sha256)
          chmod +x built/bin/kissat_4_0_4 built/bin/cadical_3_0_1
          test "$(git hash-object research/drnas-sat-v7-8/v1531_nohang.cpp)" = d280a2ffa28d72aec183323bbea40544d676112d
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra research/drnas-sat-v7-8/v1531_nohang.cpp -o /tmp/drnas-r6-v1531
      - name: Run original unmodified SAT formula 4-way paired wall PAR2
        run: |
          set -euo pipefail
          python3 -u research/r160_portfolio_transfer.py run --shard ${{ matrix.shard }} | tee r160-run-${{ matrix.shard }}.log
          grep -q '^R160_SHARD_PASS ' r160-run-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r160-shard-${{ matrix.shard }}
          path: |
            r160/shard-${{ matrix.shard }}/
            r160-run-${{ matrix.shard }}.log
          retention-days: 90
          if-no-files-found: warn

  audit:
    name: Strict 288 paired attempts 24 original SHA and exact identical reference binary checks
    needs: benchmark
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r151-frozen-model-and-independent-real-40
          run-id: 42094754907
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r160-r151-source
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-R159-STRICT-AUDITED-240-REAL-REUSED-R151-R158-SHADOW
          run-id: 42134974748
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r160-r159-audit
      - uses: actions/download-artifact@v4
        with:
          name: r160-precommitted-original24-and-portfolio-map
          path: r160-frozen-download
      - name: Restore precommitted test manifest exactly
        run: |
          set -euo pipefail
          mkdir -p r160/frozen
          cp r160-frozen-download/r160/frozen/manifest.json r160/frozen/manifest.json
      - uses: actions/download-artifact@v4
        with:
          pattern: r160-shard-*
          path: r160-download
          merge-multiple: false
      - name: Validate SAT witnesses, runner/SHA/seed pairing and shadow graph transfer
        run: |
          set -euo pipefail
          python3 -u research/r160_portfolio_transfer.py audit | tee r160-audit.log
          grep -q '^R160_FINAL ' r160-audit.log
          test -s r160/report/report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("r160/report/report.json").read_text())
          assert x["complete_original_SHA_distinct_formulas"]==24
          assert x["compared_attempts"]==288
          assert x["reference_binary_identical_across_shards"] is True
          assert x["all_SAT_witness_checked"] is True
          assert x["V15_3_1_modified"] is False
          assert x["R158_live_policy"] is False
          assert x["independent_unsat_proof"] is False
          print("R160_STRICT_FINAL_PROVENANCE_SAT_AUDIT_PASS")
          PY
          cat r160/report/report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DRNAS-R160-PORTFOLIO-24-ORIGINAL-288-PAR2-STRICT-FINAL
          path: |
            r160/report/
            r160/frozen/manifest.json
            r160-audit.log
          retention-days: 90
          if-no-files-found: error
