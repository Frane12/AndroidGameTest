name: DRNAS SAT-CONSTRUCT REAL600 verified SATLIB
on:
  push:
    branches: [experiment/drnas-sat-construct-real600-20261115]
    paths:
      - research/sat_construct_600/**
      - .github/workflows/drnas-sat-construct-real600.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-sat-construct-real600-20261115
  cancel-in-progress: false
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 43664639093
          name: math5-blind30-frozen
          github-token: ${{ github.token }}
          path: frozen/math5
      - uses: actions/download-artifact@v4
        with:
          run-id: 43368689724
          name: drnas-x5-frozen-binaries
          github-token: ${{ github.token }}
          path: frozen/cms
      - name: Restore pinned reference binaries and runtime libraries
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libcryptominisat5-5.11t64=5.11.15+dfsg1-1.1build1 libboost-program-options1.83.0
          tar -xzf frozen/math5/math5-blind-frozen.tgz
          cp frozen/cms/cms frozen/cms/frat-rs build/
          mkdir -p build/cms-libs/usr/lib/x86_64-linux-gnu
          cp -L /usr/lib/x86_64-linux-gnu/libcryptominisat5.so.5.11 build/cms-libs/usr/lib/x86_64-linux-gnu/
          chmod +x build/kissat build/cadical build/drat-trim build/cms build/frat-rs
          LD_LIBRARY_PATH=build/cms-libs/usr/lib/x86_64-linux-gnu build/cms --version
      - name: Compile exact native constructor and optional X59 integration, verify controls
        run: |
          set -euo pipefail
          g++ -O3 -std=c++20 -DNDEBUG -Wall -Wextra src/drnas_sat_construct.cpp -o build/drnas-sat-construct
          g++ -O3 -std=c++20 -DNDEBUG -Wall -Wextra src/drnas_x59.cpp -o build/drnas-sat-native-x59
          python3 -m py_compile research/sat_construct_600/benchmark.py
          python3 -u research/sat_construct_600/benchmark.py selftest
          python3 -u research/sat_native1/test_native.py
          sha256sum build/drnas-sat-construct build/drnas-sat-native-x59 build/kissat build/cadical build/cms build/drat-trim build/frat-rs
      - name: Freeze 600 public source CNFs before any solver trial
        run: |
          set -euo pipefail
          PYTHONHASHSEED=0 python3 -u research/sat_construct_600/benchmark.py freeze | tee sat_construct_600_freeze.log
          grep -q '^CONSTRUCT600_FROZEN ' sat_construct_600_freeze.log
          test "$(find sat_construct_600_inputs/cnf -name '*.cnf' | wc -l)" -eq 600
          tar -czf sat-construct-real600-frozen.tgz sat_construct_600_inputs \
            build/drnas-sat-construct build/drnas-sat-native-x59 build/kissat build/cadical \
            build/cms build/drat-trim build/frat-rs \
            build/cms-libs/usr/lib/x86_64-linux-gnu/libcryptominisat5.so.5.11
      - uses: actions/upload-artifact@v4
        with:
          name: sat-construct-real600-frozen
          retention-days: 60
          if-no-files-found: error
          path: sat-construct-real600-frozen.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sat-construct-real600-freeze-audit
          retention-days: 60
          path: |
            sat_construct_600_freeze.log
            sat_construct_600_inputs/manifest.json
            research/sat_construct_600/README.md
          if-no-files-found: warn
  paired:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sat-construct-real600-frozen
      - name: Restore frozen original sources and pinned binaries
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libcryptominisat5-5.11t64=5.11.15+dfsg1-1.1build1 libboost-program-options1.83.0
          tar -xzf sat-construct-real600-frozen.tgz
          chmod +x build/drnas-sat-construct build/drnas-sat-native-x59 build/kissat build/cadical build/cms build/drat-trim build/frat-rs
      - name: Run 150 original SHA-distinct CNFs on one logical CPU
        run: |
          set -euo pipefail
          PYTHONHASHSEED=0 OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 \
            python3 -u research/sat_construct_600/benchmark.py shard --index ${{ matrix.shard }} | tee sat_construct_600_shard.log
          grep -q '^CONSTRUCT600_SHARD_COMPLETE ' sat_construct_600_shard.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sat-construct-real600-shard-${{ matrix.shard }}
          retention-days: 60
          if-no-files-found: warn
          path: |
            sat_construct_600_results/shard-${{ matrix.shard }}/
            sat_construct_600_shard.log
  aggregate:
    needs: paired
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sat-construct-real600-frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: sat-construct-real600-shard-*
          path: downloaded
      - name: Audit all 3600 rows against frozen SHA manifest
        run: |
          set -euo pipefail
          tar -xzf sat-construct-real600-frozen.tgz
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          for i in range(4):
              matches=list(Path('downloaded').glob(f'sat-construct-real600-shard-{i}/**/trials.jsonl'))
              assert len(matches)==1,(i,matches)
              dest=Path('sat_construct_600_results')/f'shard-{i}'
              dest.mkdir(parents=True,exist_ok=False)
              shutil.copy2(matches[0],dest/'trials.jsonl')
          PY
          python3 -u research/sat_construct_600/benchmark.py report | tee sat_construct_600_final.log
          cat sat_construct_600_results/README.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sat-construct-real600-final
          retention-days: 60
          if-no-files-found: warn
          path: |
            sat_construct_600_results/summary.json
            sat_construct_600_results/README.md
            sat_construct_600_inputs/manifest.json
            sat_construct_600_final.log
