name: DRNAS R27c certify 3-input nonlinear gates at XOR interfaces
on:
  push:
    branches: [experiment/drnas-r27-xor-residual-links-20261103]
    paths: ['.github/workflows/drnas-r27c-gate-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  full_gate_truth_table:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: R26-frozen-53-inputs
          run-id: 41606832040
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: input
      - name: Authenticate 10 original GBD polynomials, replay gate truth tables
        run: |
          set -euo pipefail
          (cd input && sha256sum -c r26_all_53.sha256)
          python3 -m py_compile experiments/drnas_v16/r27_gate_circuits.py
          python3 -u experiments/drnas_v16/r27_gate_circuits.py --input input --out r27c-gate-results.json | tee r27c-gate.log
          echo "## R27c independent four-clause gate truth table audit" >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 r27c-gate.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R27C-XOR-NONLINEAR-GATE-TRUTH-TABLE-CERTIFICATES
          path: |
            r27c-gate-results.json
            r27c-gate.log
          if-no-files-found: warn
