name: DRNAS CRR1-B3 — dynamic redundant clause gate 4 SHA 36 paired 60s
on:
  push:
    branches: [experiment/drnas-crr1b3-redundancy-impact-20261108]
    paths: ['.github/workflows/drnas-crr1b3-redundancy.yml', 'research/drnas_crr1b3_redundancy.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-crr1b3-dynamic-gate-20261108
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore pinned SAT2026 W4 source corpus and exact Kissat backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42429372803 -R Frane12/AndroidGameTest -n w4-input -D .
          test -s worldsim-w1-frozen.tar.gz
          test -s history/w4sources/manifest.json
          tar xzf worldsim-w1-frozen.tar.gz
          chmod +x checker/drat-trim built/bin/kissat_4_0_4
          python3 -m py_compile research/drnas_crr1a_shadow.py research/drnas_crr1b_active.py research/drnas_crr1b2_telemetry.py research/drnas_crr1b3_redundancy.py
          python3 -u research/drnas_crr1b3_redundancy.py selftest
          mkdir -p crr1b3
          python3 -u research/drnas_crr1b3_redundancy.py prepare | tee crr1b3/prepare.log
          grep -q '^CRR1B3_PREP_PASS' crr1b3/prepare.log
      - name: Verify pinned Kissat supports --statistics with original-source SAT witness
        run: |
          set -euo pipefail
          printf 'p cnf 2 2\n1 2 0\n-1 2 0\n' > crr1b3/smoke.cnf
          set +e
          built/bin/kissat_4_0_4 --statistics crr1b3/smoke.cnf crr1b3/smoke.drat > crr1b3/smoke.log 2>&1
          code=$?
          set -e
          test "$code" -eq 10
          grep -q '^s SATISFIABLE' crr1b3/smoke.log
          rm -f crr1b3/smoke.cnf crr1b3/smoke.drat
      - uses: actions/upload-artifact@v4
        with:
          name: crr1b3-frozen-input
          retention-days: 45
          if-no-files-found: error
          path: |
            worldsim-w1-frozen.tar.gz
            history/w4sources/
            checker/drat-trim
            built/bin/kissat_4_0_4
            crr1b3/manifest.json
            crr1b3/pins.json
            crr1b3/prepare.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crr1b3-prepare-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: crr1b3/
  paired:
    needs: prepare
    name: CRR1B3 focus 60s original B2 B3 shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: crr1b3-frozen-input
      - name: Charge all CNF GF2 and dynamic filter preprocessing; paired SHA randomized
        run: |
          set -euo pipefail
          tar xzf worldsim-w1-frozen.tar.gz
          chmod +x checker/drat-trim built/bin/kissat_4_0_4
          python3 -u research/drnas_crr1b3_redundancy.py shard --shard ${{ matrix.shard }} | tee crr1b3/shard-${{ matrix.shard }}.log
          grep -q '^CRR1B3_SHARD_PASS' crr1b3/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crr1b3-shard-${{ matrix.shard }}
          retention-days: 45
          if-no-files-found: warn
          path: |
            crr1b3/shard-${{ matrix.shard }}.json
            crr1b3/shard-${{ matrix.shard }}.log
            crr1b3/raw/**/telemetry.json
            crr1b3/raw/**/proof_validation.log
  audit:
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: crr1b3-frozen-input
      - name: Collect exactly four source-locked shard JSONs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar xzf worldsim-w1-frozen.tar.gz
          chmod +x checker/drat-trim built/bin/kissat_4_0_4
          mkdir -p crr1b3/collected
          gh run download "${{ github.run_id }}" -R Frane12/AndroidGameTest -p 'crr1b3-shard-*' -D crr1b3/collected
          test "$(find crr1b3/collected -type f -name 'shard-*.json' | wc -l)" -eq 4
          find crr1b3/collected -type f -name 'shard-*.json' -exec cp '{}' crr1b3/ \;
          test "$(find crr1b3 -maxdepth 1 -type f -name 'shard-*.json' | wc -l)" -eq 4
      - name: Independent SAT UNSAT and dynamic gate paired PAR2 audit
        run: |
          set -euo pipefail
          python3 -u research/drnas_crr1b3_redundancy.py audit | tee crr1b3/audit.log
          grep -q '^CRR1B3_FINAL' crr1b3/audit.log
          cat crr1b3/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-CRR1B3-4SHA-36-DYNAMIC-DEDUPE-60S-FINAL
          retention-days: 60
          if-no-files-found: warn
          path: |
            crr1b3/report.json
            crr1b3/all-trials.json
            crr1b3/audit.log
            crr1b3/manifest.json
            crr1b3/pins.json
