name: DRNAS R158x causal GF2 CDCL conflicts decisions learned six modes original CNF
on:
  push:
    branches: [experiment/drnas-r158x-causal-cdcl-gf2-20261106]
    paths: ['.github/workflows/drnas-r158x-causal-benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r158x-causal-8-original-96-pairs
  cancel-in-progress: false
jobs:
  build:
    name: Compile ONCE pinned CaDiCaL and R158x; immutable source and GF2 reasons selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the single common source-locked R158x/CaDiCaL native binary
        run: |
          set -euo pipefail
          mkdir -p r158x
          python3 -m py_compile research/r158x_causal_benchmark.py research/r157_source_certified_xor.py
          git clone -q https://github.com/arminbiere/cadical.git /tmp/r158x-cadical
          cd /tmp/r158x-cadical
          git checkout -q rel-2.1.0
          git rev-parse HEAD > "$GITHUB_WORKSPACE/r158x/cadical-source-commit.txt"
          ./configure
          make -j2
          g++ -std=c++17 -O2 -Wall -Wextra -I./src "$GITHUB_WORKSPACE/research/r158x_causal_cdcl_bridge.cpp" ./build/libcadical.a -o "$GITHUB_WORKSPACE/r158x/r158x-native"
          cd "$GITHUB_WORKSPACE"
          ./r158x/r158x-native selftest | tee r158x/native-selftest.log
          grep -q '^R99_WATCH_SELFTEST_PASS' r158x/native-selftest.log
          grep -q '^R133C_GF2_CLOSURE_SELFTEST_PASS' r158x/native-selftest.log
          grep -q '^R148_DIRECT_SELFTEST_PASS' r158x/native-selftest.log
          python3 - <<'PY'
          import pathlib,hashlib,json,subprocess
          p=pathlib.Path("r158x/r158x-native")
          obj=dict(binary_sha256=hashlib.sha256(p.read_bytes()).hexdigest(),
            commit=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            cadical_source_commit=pathlib.Path("r158x/cadical-source-commit.txt").read_text().strip(),
            compiler=subprocess.check_output(["g++","--version"],text=True).splitlines()[0])
          pathlib.Path("r158x/build-pin.json").write_text(json.dumps(obj,sort_keys=True,indent=2))
          print("R158X_SINGLE_BINARY_PIN_PASS",json.dumps(obj,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r158x-single-frozen-binary-and-source-commit
          path: |
            r158x/r158x-native
            r158x/build-pin.json
            r158x/cadical-source-commit.txt
            r158x/native-selftest.log
          retention-days: 90
  paired:
    needs: build
    name: Six-mode ORIGINAL CNF 15s hard and 5s controls same-binary paired shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r158x-single-frozen-binary-and-source-commit
          path: r158x
      - uses: actions/download-artifact@v4
        with:
          name: r155-original25-pinned-native-and-independent-smoke
          run-id: 42112755104
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r158x
      - name: Enforce SAME precompiled native SHA and record paired CPU source
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          chmod +x r158x/r158x-native
          python3 - <<'PY'
          import pathlib,hashlib,json,os,subprocess
          pin=json.loads(pathlib.Path("r158x/build-pin.json").read_text())
          check=hashlib.sha256(pathlib.Path("r158x/r158x-native").read_bytes()).hexdigest()
          assert check==pin["binary_sha256"],"R158X NATIVE BINARY DRIFT"
          assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==pin["commit"]
          pin["cpu"]=next((v for v in pathlib.Path("/proc/cpuinfo").read_text().splitlines() if v.startswith("model name")),"unknown")
          pin["shard"]=int(os.environ["SHARD"])
          pathlib.Path("r158x/pin-"+os.environ["SHARD"]+".json").write_text(json.dumps(pin,sort_keys=True))
          print("R158X_COMMON_BINARY_SHA_PASS",check,"shard",os.environ["SHARD"])
          PY
      - name: Independently replay certified GF2 rows and 6 modes on matching original sources
        run: |
          set -euo pipefail
          python3 -u research/r158x_causal_benchmark.py shard --shard ${{ matrix.shard }} --binary r158x/r158x-native | tee r158x/shard-${{ matrix.shard }}.log
          grep -q '^R158X_SHARD_PASS ' r158x/shard-${{ matrix.shard }}.log
          test -s r158x/shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r158x-causal-shard-${{ matrix.shard }}
          path: |
            r158x/shard-${{ matrix.shard }}.json
            r158x/shard-${{ matrix.shard }}.log
            r158x/pin-${{ matrix.shard }}.json
            r158x/prep-*.json
            r158x/cert-*.json
          if-no-files-found: warn
          retention-days: 90
  audit:
    needs: paired
    name: Audit 96 SHA-paired native conflict decision GF2 source proof and true SAT models
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r158x-single-frozen-binary-and-source-commit
          path: r158x
      - uses: actions/download-artifact@v4
        with:
          name: r155-original25-pinned-native-and-independent-smoke
          run-id: 42112755104
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r158x
      - uses: actions/download-artifact@v4
        with:
          pattern: r158x-causal-shard-*
          merge-multiple: true
          path: r158x
      - name: Final source-specific causal and regression correctness audit
        run: |
          set -euo pipefail
          test "$(find r158x -maxdepth 1 -name 'shard-*.json' | wc -l)" -eq 4
          python3 -u research/r158x_causal_benchmark.py audit | tee r158x/audit.log
          grep -q '^R158X_FINAL ' r158x/audit.log
          python3 - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path("r158x/report.json").read_text())
          with open(pathlib.Path("r158x/report-summary.md"),"w") as f:
           f.write("# DRNAS R158x: source-certified CDCL metrics\n\n")
           f.write("8 development original SHA CNFs, 6 same-binary modes, 2 repetitions, 96 trials.\n\n")
           f.write("| Mode | Solved | PAR2 s | Conflicts | Decisions | Learned | GF2 proposals | Full reasons |\n")
           f.write("|---|---:|---:|---:|---:|---:|---:|---:|\n")
           for key,d in x["summary"]["all"].items():
            f.write(f'| {key} | {d["solved"]}/{d["trials"]} | {d["PAR2_s"]:.4f} | {d["conflicts"]} | {d["decisions"]} | {d["learned_clauses"]} | {d["proposed_GF2"]} | {d["completed_reason_clauses"]} |\n')
           f.write("\nRESEARCH ONLY, existing R154 development formulas, no independent UNSAT LRAT.\n")
          PY
          cat r158x/report-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R158X-CAUSAL-CDCL-8-ORIGINAL-96-PAIRED-AUDIT-FINAL
          path: |
            r158x/report.json
            r158x/audit.log
            r158x/report-summary.md
          if-no-files-found: warn
          retention-days: 90
