name: DRNAS R62 audit-only reuse frozen 41704568550
on:
  push:
    branches: [experiment/drnas-r62-xor-scaling-20261103]
    paths:
      - '.github/workflows/drnas-r62-xor-scaling.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r62-xor-scaling-frozen-20261103
  cancel-in-progress: false
jobs:
  audit:
    name: R62 final 192 trial audit size effects speedups control regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r62-frozen-synthetic-scaling-originals
          run-id: 41704568550
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: r62-shard-*
          run-id: 41704568550
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: combined
      - name: Audit 48 sources times SAT witnesses and PAR2 by dimension and control
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c source.sha256)
          python3 -u experiments/drnas_v16/r62_xor_scaling_benchmark.py aggregate \
            --inputs frozen --combined combined --out final
          cat final/r61-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DRNAS-R62-XOR-SCALING-48-FRESH-FORMULAS-FINAL
          path: |
            final/
            frozen/manifest.json
          if-no-files-found: error
