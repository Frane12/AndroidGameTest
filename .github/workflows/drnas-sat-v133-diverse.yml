name: DRNAS V13.3 - Diverse SAT Structure Test, Fixed LBD4 Rule
on:
  push:
    branches: [experiment/drnas-v133-structural-generalization-20261101]
    paths:
      - '.github/workflows/drnas-sat-v133-diverse.yml'
      - 'research/drnas-sat-v7-8/v133_constructive_formulas.py'
      - 'research/drnas-sat-v7-8/v133_evaluate.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deterministic generator, fixed predictor and evaluation selftest
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/v133_constructive_formulas.py research/drnas-sat-v7-8/v133_evaluate.py
          python3 research/drnas-sat-v7-8/v133_evaluate.py selftest
      - name: Retrieve six pre-existing real 2026 cases
        uses: actions/download-artifact@v4
        with:
          name: DRNAS-V132-frozen-24-new-inputs
          run-id: 41256313918
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: previous
      - name: Freeze SHA-verified constructive plus old official inputs
        run: |
          set -euo pipefail
          (cd previous && sha256sum -c v132_manifest.sha256)
          mkdir -p frozen
          python3 -u research/drnas-sat-v7-8/v133_evaluate.py freeze \
            --previous previous/v132_manifest.json --out frozen/v133_manifest.json
          (cd frozen && sha256sum v133_manifest.json > v133_manifest.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-V133-frozen-42-mixed-cases
          path: frozen/
          if-no-files-found: error

  benchmark:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5]
    name: v133-shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V133-frozen-42-mixed-cases
          path: frozen
      - name: Reuse three already-pinned V13.2 solver executables
        uses: actions/download-artifact@v4
        with:
          name: DRNAS-V132-three-pinned-binaries
          run-id: 41256313918
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: bin
      - name: Check input and three binary digests before trials
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v133_manifest.sha256)
          (cd bin && sha256sum -c binaries.sha256)
          chmod +x bin/v132_prefix bin/v132_drnas bin/v132_kissat
      - name: Run SAT/UNSAT benchmark with fixed diagnostic predictor
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/v133_evaluate.py run \
            --manifest frozen/v133_manifest.json --shard "$SHARD" \
            --probe bin/v132_prefix --drnas bin/v132_drnas \
            --kissat bin/v132_kissat --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v133-shard-${{ matrix.shard }}
          path: results/
          if-no-files-found: warn

  audit:
    needs: [freeze,benchmark]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V133-frozen-42-mixed-cases
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: v133-shard-*
          path: combined
      - name: Strict SHA and fixed-rule cohort audit
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v133_manifest.sha256)
          python3 research/drnas-sat-v7-8/v133_evaluate.py audit \
            --manifest frozen/v133_manifest.json --combined combined \
            --out v133_report.json --md v133_report.md
          cat v133_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V133-fixed-LBD4-diverse-benchmark-audit
          path: |
            frozen/
            combined/
            v133_report.json
            v133_report.md
          if-no-files-found: warn
