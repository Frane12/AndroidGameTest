name: DRNAS MIX96 harder diverse synthetic paired 5s
on:
  push:
    branches: [experiment/drnas-x5-mix96-20261113]
    paths: [.github/workflows/drnas-x5-mix96.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-x5-mix96
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: drnas-x5-frozen-binaries
          run-id: 43368689724
          github-token: ${{ github.token }}
          path: build
      - name: Check frozen source and reference binary identity
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y cryptominisat
          chmod +x build/*
          sha256sum -c build/reference_sha256.txt
          sha256sum -c experiments/drnas_x5/frozen_sha256.txt
          python3 -m py_compile research/drnas_x5_mix96.py
      - name: Paired one-logical-CPU measurements with proof checks inside the 5s budget
        run: |
          set -euo pipefail
          python3 -u research/drnas_x5_mix96.py --out mix96_${{ matrix.shard }} \
            --per-family 12 --offset 9600000 --cap 5 --repeats 3 \
            --shards 4 --shard ${{ matrix.shard }} \
            | tee mix96_${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drnas-mix96-shard-${{ matrix.shard }}
          retention-days: 30
          path: |
            mix96_${{ matrix.shard }}/
            mix96_${{ matrix.shard }}.log
  report:
    needs: paired
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: drnas-mix96-shard-*
          path: results
      - name: Validate all 1728 trials and compare X5 variants
        run: |
          set -euo pipefail
          python3 research/drnas_x5_mix96_report.py --root results --out mix96_summary.json | tee mix96_summary.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drnas-mix96-final
          retention-days: 30
          path: |
            mix96_summary.json
            mix96_summary.log
