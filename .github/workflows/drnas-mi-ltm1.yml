name: DRNAS MI-LTM1 proof and memory selftests
on:
  push:
    branches:
      - experiment/drnas-mi-ltm1-20261111
  workflow_dispatch:
jobs:
  mi-ltm1-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen memory, XOR provenance, and original CNF detector
        run: |
          cd mi_ltm1
          python3 -m unittest discover -s . -p 'test_*.py' -v
      - name: Original CNF proof-probe smoke check
        run: |
          printf 'p cnf 2 2\n1 2 0\n-1 -2 0\n' > /tmp/mi-ltm1-probe.cnf
          python3 mi_ltm1/probe.py /tmp/mi-ltm1-probe.cnf > /tmp/mi-ltm1-probe.json
          python3 -c 'import json; x=json.load(open("/tmp/mi-ltm1-probe.json")); assert x["status"] == "diagnostic_only" and len(x["xor_equations"]) == 1'
