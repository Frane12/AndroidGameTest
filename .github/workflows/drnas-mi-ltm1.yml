name: DRNAS MI-LTM2 persistent training and holdout
on:
  push:
    branches: [experiment/drnas-mi-ltm1-20261111]
  workflow_dispatch:
concurrency:
  group: mi-ltm2-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  mi-ltm2-train-and-evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore prior training-only structural memory (best-effort)
        uses: actions/cache/restore@v4
        with:
          path: mi_ltm1/history.sqlite
          key: mi-ltm2-training-only-${{ github.run_id }}
          restore-keys: |
            mi-ltm2-training-only-
      - name: Prove original-source XOR soundness on small CNFs
        run: |
          set -euo pipefail
          cd mi_ltm1
          python3 -m unittest discover -s . -p 'test_*.py' -v
          cd ..
          python3 mi_ltm1/bench_formulas.py
      - name: Build standalone native ATLAS15 solver for paired controls
        run: |
          set -euo pipefail
          mkdir -p mre_atlas15/bin
          python3 research/drnas_atlas13_generator.py
          python3 research/drnas_atlas15_warm_patch.py
          python3 research/drnas_atlas15_cdcl_patch.py
          python3 research/drnas_atlas1_generate.py --out mre_atlas15/atlas1_table.hpp
          python3 research/drnas_atlas9_export_table.py research/atlas8_reduction_table.jsonl mre_atlas15/atlas8_rules.hpp
          g++ -std=c++17 -O2 -I mre_atlas15 research/drnas_atlas15_native.cpp -o mre_atlas15/bin/drnas_atlas15
          mre_atlas15/bin/drnas_atlas15 --selftest
      - name: Run 320 CNFs train (192) and SHA-disjoint holdout (128)
        run: |
          set -euo pipefail
          taskset -c "$(awk '/Cpus_allowed_list:/ {split($2,a,/[,-]/); print a[1]}' /proc/self/status)" python3 -u mi_ltm1/memory_experiment.py | tee MI_LTM2.log
          grep '^MI_LTM2_LEARNING ' MI_LTM2.log >> "$GITHUB_STEP_SUMMARY"
          grep '^MI_LTM2_FINAL ' MI_LTM2.log >> "$GITHUB_STEP_SUMMARY"
      - name: Save training-only memory for future runs
        if: success()
        uses: actions/cache/save@v4
        with:
          path: mi_ltm1/history.sqlite
          key: mi-ltm2-training-only-${{ github.run_id }}
      - name: Publish frozen memory and complete training/diagnostic audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MI-LTM2-320CNF-TRAIN192-HOLDOUT128
          retention-days: 90
          if-no-files-found: warn
          path: |
            MI_LTM2_TRAIN_HOLDOUT.json
            MI_LTM2.log
            mi_ltm1/policy_frozen.json
            mi_ltm1/history.sqlite
            mi_ltm1_benchmark.json
