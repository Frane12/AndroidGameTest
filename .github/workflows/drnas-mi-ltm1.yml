name: DRNAS MI-LTM1 CNF formula benchmark
on:
  push:
    branches:
      - experiment/drnas-mi-ltm1-20261111
  workflow_dispatch:
jobs:
  mi-ltm1-formulas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests and original-CNF soundness checks
        run: |
          cd mi_ltm1
          python3 -m unittest discover -s . -p 'test_*.py' -v
      - name: Run 32 original CNFs x 3 probe repeats with exhaustive oracle
        run: |
          python3 mi_ltm1/bench_formulas.py
      - name: Publish results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mi-ltm1-formula-benchmark
          path: mi_ltm1_benchmark.json
          if-no-files-found: warn
