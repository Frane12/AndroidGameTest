name: Stop superseded five-repeat polynomial benchmark
on:
  push:
    branches:
      - research/drnas-sat-polynomial-family-validation
    paths:
      - .github/workflows/stop-superseded-polynomial-5repeat.yml
permissions:
  contents: read
# Match the 5-repeat workflow's exact concurrency group.  A newer
# run with cancel-in-progress:true cancels the superseded running run.
# Does not use the different group of the 3-repeat single-formula branch.
concurrency:
  group: drnas-sat-original-gbd-polynomial-family-benchmark
  cancel-in-progress: true
jobs:
  mark-old-as-superseded:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record requested replacement
        run: |
          echo "Superseding the 5-repeat run 41214923457."
          echo "Replacement is the separate 3-repeat run 41216799619."
          echo "The replacement workflow and branch are unchanged."
