name: DRNAS R134 non-XOR binary-implication Horn mutex read-only shadow audit
on:
  push:
    branches: [experiment/drnas-r134-nonxor-big-shadow-20261105]
    paths:
      - '.github/workflows/drnas-r134-nonxor-shadow.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  nonxor_shadow:
    name: Analyze existing 125 original CNFs and 1250 R132 paired measurements - NO solver
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download frozen R132 125 CNFs and SHA manifest without re-freezing
        uses: actions/download-artifact@v4
        with:
          name: r132-frozen-prospective-sha-excluded
          run-id: 42050320220
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r132/frozen
      - name: Download all eight previously measured paired R132 shard data files
        uses: actions/download-artifact@v4
        with:
          pattern: r132-shard-*
          run-id: 42050320220
          merge-multiple: true
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r132
      - name: Check immutable SHA and measure NON-XOR shadow structure only
        run: |
          set -euo pipefail
          test "$(find r132 -maxdepth 1 -name 'shard-*.json' | wc -l)" -eq 8
          python3 -u research/r134_nonxor_shadow.py analyze | tee r134/shadow.log
          test -s r134/report.json
          test -s r134/features_and_old_timings.csv
          cat r134/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve structural signals, full SHA audit and original paired comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRNAS-R134-NONXOR-BIG-HORN-MUTEX-SHADOW-REPORT
          path: |
            r134/report.json
            r134/report.md
            r134/features_and_old_timings.csv
            r134/shadow.log
          if-no-files-found: warn
          retention-days: 90
