name: DRNAS GF-CDCL NOVEL2D medium crossover original CNF
run-name: NOVEL2D 2 frozen MIXAB3 reductive SHA x 5 arms x 2 reps 15s 20 oneCPU E2E
on:
  push:
    branches: [experiment/drnas-gf-cdcl-novel2d-cross-medium-20261110]
    paths:
      - .github/workflows/drnas-gf-cdcl-novel2d-medium.yml
      - research/drnas_gf_cdcl_novel2d_medium.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-gf-cdcl-novel2d-${{ github.ref }}
  cancel-in-progress: true
jobs:
  setup:
    name: Pin native CaDiCaL, certify source selection, freeze 2 SHA, exhaustive XOR selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Restore pinned previous 40 source SHA and binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42814965607 -R Frane12/AndroidGameTest -n xorabc3-frozen40-CaDiCaL210-live-Kissat-CMS -D .
          test -s mre_xorabc3/manifest.json
          test -s mre_xorabc3/bin/xorabc3_rows
          chmod +x mre_xorabc3/bin/xorabc3_rows mre_xorabc3/bin/xorabc3_trail mre_xorabc2/bin/xorabc2_native
          chmod +x built/bin/kissat_4_0_4 mre_equiv12/bin/cryptominisat5 mre_x4/bin/native
      - name: Restore previously frozen MIXAB3 original SHA without reselection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/novel2d-mix3
          gh run download 42811023064 -R Frane12/AndroidGameTest -n mixab3-fresh12-CMS17-Kissat4-GF2 -D /tmp/novel2d-mix3
          test -s /tmp/novel2d-mix3/mre_mixab3/manifest.json
          cp -a /tmp/novel2d-mix3/mre_mixab3 mre_mixab3
          test -d mre_mixab3/cases
      - name: Restore independently preregistered 63 SHA source-screen evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/novel2d-screen mre_gf_cdcl_novel2d/bin
          gh run download 42826195310 -R Frane12/AndroidGameTest -n DRNAS-GF-CDCL-NOVEL2C-SOURCE63-FOUR-COHORTS-STRUCTURAL-SCREEN -D /tmp/novel2d-screen
          cp /tmp/novel2d-screen/mre_gf_cdcl_novel2c/screen.json mre_gf_cdcl_novel2d/screen.json
          test -s mre_gf_cdcl_novel2d/screen.json
      - name: Compile exact pinned CaDiCaL 2.1.0 and NOVEL2B native C++ GF2 core
        run: |
          set -euo pipefail
          git clone -q https://github.com/arminbiere/cadical.git /tmp/novel2d-cadical
          cd /tmp/novel2d-cadical
          git checkout -q "$(cat "$GITHUB_WORKSPACE/mre_xorabc3/cadical-source-commit.txt")"
          ./configure
          make -j2
          g++ -std=c++17 -O2 -Wall -Wextra -I./src "$GITHUB_WORKSPACE/research/drnas_gf_cdcl_novel2b.cpp" ./build/libcadical.a -o "$GITHUB_WORKSPACE/mre_gf_cdcl_novel2d/bin/gf_cdcl_novel2d"
          cd "$GITHUB_WORKSPACE"
          mre_gf_cdcl_novel2d/bin/gf_cdcl_novel2d selftest | tee mre_gf_cdcl_novel2d/native-selftest.log
          grep -q '^GFCDCL_NOVEL2_SELFTEST_PASS ' mre_gf_cdcl_novel2d/native-selftest.log
          grep -q '^GFCDCL_NOVEL2B_REDUCTIVE_SELFTEST_PASS ' mre_gf_cdcl_novel2d/native-selftest.log
      - name: Fail-closed freeze source-only 2 x MIXAB3 exact SHA and binaries
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre_equiv12/lib:$PWD/mre5/lib"
          python3 -m py_compile research/drnas_gf_cdcl_novel2d_medium.py
          python3 -u research/drnas_gf_cdcl_novel2d_medium.py freeze | tee mre_gf_cdcl_novel2d/freeze.log
          grep -q '^NOVEL2D_FROZEN ' mre_gf_cdcl_novel2d/freeze.log
      - uses: actions/upload-artifact@v4
        with:
          name: novel2d-frozen-two-SHA-CaDiCaL210-CMS17-sourceonly
          retention-days: 21
          if-no-files-found: error
          path: |
            mre_gf_cdcl_novel2d/manifest.json
            mre_gf_cdcl_novel2d/screen.json
            mre_gf_cdcl_novel2d/bin/gf_cdcl_novel2d
            mre_gf_cdcl_novel2d/native-selftest.log
            mre_gf_cdcl_novel2d/freeze.log
  shard:
    name: Original SHA singleCPU matched 5 arms x 2 repeats shard ${{ matrix.shard }}
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0,1]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Restore immutable original CNF sources and reference binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42814965607 -R Frane12/AndroidGameTest -n xorabc3-frozen40-CaDiCaL210-live-Kissat-CMS -D .
          mkdir -p /tmp/novel2d-mix3
          gh run download 42811023064 -R Frane12/AndroidGameTest -n mixab3-fresh12-CMS17-Kissat4-GF2 -D /tmp/novel2d-mix3
          cp -a /tmp/novel2d-mix3/mre_mixab3 mre_mixab3
          chmod +x mre_xorabc3/bin/xorabc3_rows mre_xorabc3/bin/xorabc3_trail mre_xorabc2/bin/xorabc2_native
          chmod +x built/bin/kissat_4_0_4 mre_equiv12/bin/cryptominisat5 mre_x4/bin/native
      - uses: actions/download-artifact@v4
        with:
          name: novel2d-frozen-two-SHA-CaDiCaL210-CMS17-sourceonly
          path: mre_gf_cdcl_novel2d
      - name: SHA lock and original E2E source-proven GF2 native one logical CPU
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre_equiv12/lib:$PWD/mre5/lib"
          # Download artifact retains its root directories; normalize once.
          if test -d mre_gf_cdcl_novel2d/mre_gf_cdcl_novel2d; then
            cp -a mre_gf_cdcl_novel2d/mre_gf_cdcl_novel2d/. mre_gf_cdcl_novel2d/
          fi
          chmod +x mre_gf_cdcl_novel2d/bin/gf_cdcl_novel2d
          python3 -u research/drnas_gf_cdcl_novel2d_medium.py verify
          python3 -u research/drnas_gf_cdcl_novel2d_medium.py shard --shard "$SHARD" | tee "mre_gf_cdcl_novel2d/shard-$SHARD.log"
          grep -q "^NOVEL2D_SHARD_PASS $SHARD 10$" "mre_gf_cdcl_novel2d/shard-$SHARD.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novel2d-shard-${{ matrix.shard }}
          retention-days: 21
          if-no-files-found: warn
          path: |
            mre_gf_cdcl_novel2d/shard-${{ matrix.shard }}.json
            mre_gf_cdcl_novel2d/shard-${{ matrix.shard }}.log
  audit:
    name: Strict original SHA and SAT-only certified PAR2 cross-cohort audit
    needs: [setup,shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Restore original source, pinned solvers, frozen manifests and both shard JSONs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42814965607 -R Frane12/AndroidGameTest -n xorabc3-frozen40-CaDiCaL210-live-Kissat-CMS -D .
          mkdir -p /tmp/novel2d-mix3
          gh run download 42811023064 -R Frane12/AndroidGameTest -n mixab3-fresh12-CMS17-Kissat4-GF2 -D /tmp/novel2d-mix3
          cp -a /tmp/novel2d-mix3/mre_mixab3 mre_mixab3
          chmod +x mre_xorabc3/bin/xorabc3_rows mre_xorabc3/bin/xorabc3_trail mre_xorabc2/bin/xorabc2_native
          chmod +x built/bin/kissat_4_0_4 mre_equiv12/bin/cryptominisat5 mre_x4/bin/native
      - uses: actions/download-artifact@v4
        with:
          name: novel2d-frozen-two-SHA-CaDiCaL210-CMS17-sourceonly
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: novel2d-shard-*
          merge-multiple: true
          path: mre_gf_cdcl_novel2d
      - name: Audit strict 20/20 SHA and CPU matched original CNF end-to-end
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre_equiv12/lib:$PWD/mre5/lib"
          chmod +x mre_gf_cdcl_novel2d/bin/gf_cdcl_novel2d
          python3 -u research/drnas_gf_cdcl_novel2d_medium.py verify
          for i in 0 1; do test -s "mre_gf_cdcl_novel2d/shard-$i.json"; done
          python3 -u research/drnas_gf_cdcl_novel2d_medium.py audit | tee mre_gf_cdcl_novel2d/audit.log
          grep -q '^NOVEL2D_FINAL ' mre_gf_cdcl_novel2d/audit.log
          grep '^NOVEL2D_FINAL ' mre_gf_cdcl_novel2d/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-GF-CDCL-NOVEL2D-TWOSHA-20-ONECPU-STRICT-PAR2-FINAL
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_gf_cdcl_novel2d/manifest.json
            mre_gf_cdcl_novel2d/report.json
            mre_gf_cdcl_novel2d/audit.log
            mre_gf_cdcl_novel2d/shard-*.json
