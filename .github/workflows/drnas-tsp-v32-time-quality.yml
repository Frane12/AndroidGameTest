name: DRNAS TSP v3.2 time-to-quality vs LKH-3
on:
  push:
    branches:
      - experiment/drnas-tsp-v31-shared-intelligence
    paths:
      - .github/workflows/drnas-tsp-v32-time-quality.yml
      - experiments/tsp_shared_v31/time_quality_v32.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint-benchmark:
    name: LKH vs DRNAS 2-4-6-8-10s checkpoints
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: python -m pip install --disable-pip-version-check numpy scipy numba
      - name: Build actual LKH-3 solver
        run: |
          git clone --depth 1 https://github.com/cerebis/LKH3.git
          make -C LKH3 -j2
          test -x LKH3/LKH
      - name: Compare best route at fixed elapsed checkpoints
        run: |
          PYTHONPATH=experiments/tsp_shared_v31 python -u experiments/tsp_shared_v31/time_quality_v32.py \
            --cities 2000 5000 --seeds 0 1 2 --seconds 10 --lkh ./LKH3/LKH \
            --out tsp_time_quality_v32.csv --work tsp_time_quality_artifacts
      - name: Upload full trace and per-checkpoint CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-tsp-time-to-quality-2-4-6-8-10s
          path: |
            tsp_time_quality_v32.csv
            tsp_time_quality_artifacts/*.log
            tsp_time_quality_artifacts/*.tsp
            tsp_time_quality_artifacts/*.tour
          if-no-files-found: warn
