name: DRNAS MIXAB6 - Best two arms fresh originals with parallel reference controls
run-name: MIXAB6 8 fresh official SHA x 5 arms x 3 reps 12s 120 oneCPU E2E
on:
  push:
    branches: [experiment/drnas-mixab6-best5-new8-20261110]
    paths:
      - research/drnas_mixab6_best5_new8.py
      - .github/workflows/drnas-mixab6-best5-new8.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-mixab6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  freeze:
    name: Reference-only freeze eight new official CNF and independent original DRAT LRAT proof
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore exact source, binaries and certifiers; no reselection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Reuse already frozen eight new SHA from successful source selection in run #2.
          # SHA and independent proof certificates remain byte-for-byte unchanged.
          gh run download 42831230669 -R Frane12/AndroidGameTest -n mixab6-new8-cms-kissat-gf2-original-drat-lrat -D .
          test -s mre_mixab6/manifest.json
          test "$(find mre_mixab6/cases -maxdepth 1 -name '*.cnf' | wc -l)" -eq 8
          test -s mre_mixab4/manifest.json
          test -s mre_mixab3/manifest.json
          test -s mre_mixab4/bin/drat-trim
          test -s mre_mixab4/bin/lrat-check
          test -s mre_equiv12/bin/cryptominisat5
          test -s mre_gf2_s1/bin/gf2_exact
          test -s built/bin/kissat_4_0_4
          chmod +x mre_mixab4/bin/drat-trim mre_mixab4/bin/lrat-check
          chmod +x mre_equiv12/bin/cryptominisat5 mre_gf2_s1/bin/gf2_exact built/bin/kissat_4_0_4 mre_x4/bin/native
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
          export LD_LIBRARY_PATH="$PWD/mre_equiv12/lib:$PWD/mre5/lib"
          ldd mre_equiv12/bin/cryptominisat5 | tee mixab6-cms-ldd.log
          ! grep -q 'not found' mixab6-cms-ldd.log
          python3 -m py_compile research/drnas_mixab6_best5_new8.py
          # No expensive repeat source search; verify exact frozen manifest below.
          echo 'MIXAB6_SOURCE_REUSED_FROM_RUN_42831230669 8 original SHA' | tee mixab6-freeze.log
          python3 -u research/drnas_mixab6_best5_new8.py verify
      - uses: actions/upload-artifact@v4
        with:
          name: mixab6-new8-cms-kissat-gf2-original-drat-lrat
          retention-days: 21
          if-no-files-found: error
          path: |
            mre_mixab6/manifest.json
            mre_mixab6/selection-progress.json
            mre_mixab6/cases/*.cnf
            mre_mixab6/proofs/*.drat
            mre_mixab6/proofs/*.lrat
            mre_mixab4/manifest.json
            mre_mixab4/cases/*.cnf
            mre_mixab4/proofs/*.lrat
            mre_mixab4/proofs/*.drat
            mre_mixab4/bin/*
            mre_mixab3/manifest.json
            mre_search5/manifest.json
            mre_search6/manifest.json
            mre_equiv9/manifest.json
            mre_equiv7/manifest.json
            mre_equiv10medium/manifest.json
            mre_equiv10m5/manifest.json
            mre_x20/manifest.json
            prior_x22/mre_x22/manifest.json
            prior_equiv6/mre_equiv6/manifest.json
            mre_gf2_s1/bin/gf2_exact
            mre_equiv12/bin/cryptominisat5
            mre_equiv12/lib/libcryptominisat5.so*
            mre_x4/bin/native
            built/bin/kissat_4_0_4
            mre5/lib/libcryptominisat5.so.5.11
  shard:
    name: "MIXAB6 parallel ${{ matrix.arm }} / source shard ${{ matrix.shard }}"
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: [0, 1, 2, 3]
        arm:
          - combo_budget
          - router_clauses
          - cms_plain
          - kissat_plain
          - combo_budget_placebo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mixab6-new8-cms-kissat-gf2-original-drat-lrat
          path: .
      - name: One logical CPU per variant, original CNF, separate runners
        env:
          ARM: ${{ matrix.arm }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
          export LD_LIBRARY_PATH="$PWD/mre_equiv12/lib:$PWD/mre5/lib"
          chmod +x mre_mixab4/bin/* mre_gf2_s1/bin/gf2_exact mre_equiv12/bin/cryptominisat5 built/bin/kissat_4_0_4 mre_x4/bin/native
          python3 -u research/drnas_mixab6_best5_new8.py verify
          python3 -u research/drnas_mixab6_best5_new8.py shard --arm "$ARM" --shard "$SHARD" | tee "mre_mixab6/shard-$SHARD-$ARM.log"
          grep -q "^MIXAB6_SHARD_PASS $SHARD $ARM 6$" "mre_mixab6/shard-$SHARD-$ARM.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixab6-result-${{ matrix.arm }}-s${{ matrix.shard }}
          retention-days: 21
          if-no-files-found: warn
          path: |
            mre_mixab6/shard-${{ matrix.shard }}-${{ matrix.arm }}.json
            mre_mixab6/shard-${{ matrix.shard }}-${{ matrix.arm }}.log
  audit:
    name: Strict full matched 120 E2E PAR2 audit / SHA verified SAT and independent UNSAT
    needs: [freeze, shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mixab6-new8-cms-kissat-gf2-original-drat-lrat
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: mixab6-result-*
          merge-multiple: true
          path: mre_mixab6
      - name: Fail closed for missing or duplicate arms, SHA, proof or single CPU
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
          export LD_LIBRARY_PATH="$PWD/mre_equiv12/lib:$PWD/mre5/lib"
          chmod +x mre_mixab4/bin/* mre_gf2_s1/bin/gf2_exact mre_equiv12/bin/cryptominisat5 built/bin/kissat_4_0_4 mre_x4/bin/native
          python3 -u research/drnas_mixab6_best5_new8.py verify
          test "$(find mre_mixab6 -maxdepth 1 -name 'shard-*.json' | wc -l)" -eq 20
          python3 -u research/drnas_mixab6_best5_new8.py audit | tee mre_mixab6/audit.log
          grep -q '^MIXAB6_FINAL ' mre_mixab6/audit.log
          grep '^MIXAB6_FINAL ' mre_mixab6/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-MIXAB6-120-BEST5-FRESH8-ONECPU-PAR2-STRICT-FINAL
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_mixab6/manifest.json
            mre_mixab6/report.json
            mre_mixab6/audit.log
            mre_mixab6/shard-*.json
