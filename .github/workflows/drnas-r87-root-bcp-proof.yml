name: DRNAS R87F2 independent original BCP-augmented GF2 proof only
on:
  push:
    branches: [experiment/drnas-r87-root-bcp-proof-20261104]
    paths:
      - '.github/workflows/drnas-r87-root-bcp-proof.yml'
      - 'experiments/drnas_v16/r87_root_bcp_proof.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    name: Independently prove original-CNF root BCP units and native source-derived XOR rows
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: R87-FRESH-SHA-ORIGINAL-COHORT-AND-SOURCE-AUDIT
          run-id: 41774943220
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: R87-PINNED-ORIGINAL-CLEAN-AND-FOUR-SCAN-CADENCES
          run-id: 41774392604
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: .
      - name: Exact original and solver hashes plus independent BCP proof audit
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/r87_root_bcp_proof.py
          (cd original && sha256sum -c source.sha256)
          (cd compiled && sha256sum -c r87-binaries.sha256)
          chmod +x compiled/native-r87
          python3 -u experiments/drnas_v16/r87_root_bcp_proof.py \
            --sources original --compiled compiled --out bcp-proof | tee r87f2.log
          grep -q '^R87F2_FINAL_FORENSIC_PASS' r87f2.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R87F2-ROOT-BCP-ORIGINAL-CNF-INDEPENDENT-GF2-PROOF
          path: |
            bcp-proof/
            r87f2.log
          retention-days: 90
