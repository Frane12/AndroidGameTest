name: DRNAS V7.6 vs V13.4 - Identical Frozen 30 CNFs, Four-Matched Methods
on:
  push:
    branches: [experiment/drnas-v76-on-v134-frozen30-20261101]
    paths:
      - '.github/workflows/drnas-sat-v76-v134-matched.yml'
      - 'research/drnas-sat-v7-8/v76_v134_matched.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Strict Python and fixed hypothesis selftest
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/v76_v134_matched.py
          python3 research/drnas-sat-v7-8/v76_v134_matched.py selftest
          test "$(git hash-object research/drnas-sat-v7-6/v76_single.cpp)" = a254356a45b70f02f33b9506f1122dad33916ca7
      - name: Retrieve original successful frozen 30-case benchmark
        uses: actions/download-artifact@v4
        with:
          name: DRNAS-V134-30-case-structural-ladder-audit
          run-id: 41257840485
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior
      - name: Freeze exact original manifest bytes, no changes in formula or seed
        run: |
          set -euo pipefail
          (cd prior/frozen && sha256sum -c v134_manifest.sha256)
          mkdir -p frozen
          python3 -u research/drnas-sat-v7-8/v76_v134_matched.py freeze \
            --original prior/frozen/v134_manifest.json --out frozen/v134_manifest.json
          cp prior/frozen/v134_manifest.sha256 frozen/v134_manifest.sha256
          (cd frozen && sha256sum -c v134_manifest.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-V76V134-original-30-CNF-frozen-manifest
          path: frozen/
          if-no-files-found: error

  build:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V76V134-original-30-CNF-frozen-manifest
          path: frozen
      - name: Fetch previously pinned comparator executables
        uses: actions/download-artifact@v4
        with:
          name: DRNAS-V132-three-pinned-binaries
          run-id: 41256313918
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: comparators
      - name: Compile historical V7.6 with original unmodified CaDiCaL 3.0.1
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v134_manifest.sha256)
          (cd comparators && sha256sum -c binaries.sha256)
          test "$(git hash-object research/drnas-sat-v7-6/v76_single.cpp)" = a254356a45b70f02f33b9506f1122dad33916ca7
          git clone --depth 1 --branch rel-3.0.1 https://github.com/arminbiere/cadical.git cadical-v76
          test "$(git -C cadical-v76 rev-parse HEAD)" = c60730422e758ef1cebe7aeddf2dda31c996bf04
          (cd cadical-v76 && ./configure && make -j2 >/tmp/cadical-v76-build.log 2>&1) \
            || { tail -100 /tmp/cadical-v76-build.log; exit 1; }
          mkdir -p output
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -I cadical-v76/src \
            research/drnas-sat-v7-6/v76_single.cpp \
            cadical-v76/build/libcadical.a -o output/v76_solver -pthread -ldl -lz
          cp comparators/v132_drnas output/legacy_solver
          cp comparators/v132_kissat output/kissat_solver
          chmod +x output/v76_solver output/legacy_solver output/kissat_solver
          (cd output && sha256sum v76_solver legacy_solver kissat_solver > binaries.sha256)
          (cd output && sha256sum -c binaries.sha256)
          printf 'p cnf 2 1\n1 2 0\n' > /tmp/v76-smoke.cnf
          output/v76_solver adaptive_guided /tmp/v76-smoke.cnf 1342026 | grep -q 'DRNAS_RESULT'
          output/v76_solver adaptive_plain /tmp/v76-smoke.cnf 1342026 | grep -q 'DRNAS_RESULT'
          {
            lscpu
            git -C cadical-v76 rev-parse HEAD
            git hash-object research/drnas-sat-v7-6/v76_single.cpp
            cat output/binaries.sha256
          } > output/provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-V76V134-byte-pinned-three-binaries
          path: output/
          if-no-files-found: error

  benchmark:
    needs: [freeze,build]
    runs-on: ubuntu-24.04
    timeout-minutes: 46
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5]
    name: v76v134-shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V76V134-original-30-CNF-frozen-manifest
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V76V134-byte-pinned-three-binaries
          path: bin
      - name: Verify exact original manifest + matched executables
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v134_manifest.sha256)
          (cd bin && sha256sum -c binaries.sha256)
          chmod +x bin/v76_solver bin/legacy_solver bin/kissat_solver
      - name: Trial V7.6 guided / plain against Legacy and Kissat
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/v76_v134_matched.py run \
            --manifest frozen/v134_manifest.json --shard "$SHARD" \
            --v76 bin/v76_solver --legacy bin/legacy_solver \
            --kissat bin/kissat_solver --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v76v134-shard-${{ matrix.shard }}
          path: results/
          if-no-files-found: warn

  audit:
    needs: [freeze,benchmark]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V76V134-original-30-CNF-frozen-manifest
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: v76v134-shard-*
          path: combined
      - name: Previous complete V13.4 audit as provenance reference
        uses: actions/download-artifact@v4
        with:
          name: DRNAS-V134-30-case-structural-ladder-audit
          run-id: 41257840485
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: previous
      - name: Strict matched four-way 30-case SHA and accuracy audit
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v134_manifest.sha256)
          (cd previous/frozen && sha256sum -c v134_manifest.sha256)
          cmp frozen/v134_manifest.json previous/frozen/v134_manifest.json
          python3 -u research/drnas-sat-v7-8/v76_v134_matched.py audit \
            --manifest frozen/v134_manifest.json --combined combined \
            --original_report previous/v134_report.json \
            --out v76_v134_report.json --md v76_v134_report.md
          cat v76_v134_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V76-versus-V134-30-frozen-CNFs-final-audit
          path: |
            frozen/
            combined/
            v76_v134_report.json
            v76_v134_report.md
          if-no-files-found: warn
