name: DRNAS R55 70-20-10 guarded structural XOR telemetry pilot
on:
  push:
    branches: [experiment/drnas-r55-702010-20261103]
    paths:
      - '.github/workflows/drnas-r55-702010-sat.yml'
      - 'experiments/drnas_v16/r55_research_702010.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r55-702010-dev-20261103
  cancel-in-progress: false

jobs:
  freeze:
    name: R55 check R53 sources and certify 12-case development cohort
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Python preflight, resolution and GF2 certificate selftests
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/r55_research_702010.py
          python3 -m py_compile experiments/drnas_v16/r49_pivot_coherence_gate.py
          python3 -m py_compile experiments/drnas_v16/r32t_certified_short_xor.py
          python3 -u experiments/drnas_v16/r49_pivot_coherence_gate.py selftest
          python3 - <<'PY'
          import pathlib, sys, tempfile
          sys.path.insert(0, "experiments/drnas_v16")
          import r32t_certified_short_xor as xor
          with tempfile.TemporaryDirectory() as tmp:
              p = pathlib.Path(tmp)
              original = p/"original.cnf"
              augmented = p/"augmented.cnf"
              certificate = p/"proof.json"
              original.write_text("p cnf 3 4\n1 -2 0\n-1 2 0\n2 -3 0\n-2 3 0\n")
              info = xor.build(original, augmented, certificate)
              xor.audit(original, augmented, certificate)
              assert info["added_clauses"] >= 2, info
          print("R55_XOR_CERTIFIED_TOY_PASS")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: r53-frozen-50-originals
          run-id: 41687012202
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-R53-50-UNSEEN-TRIPLE-PAR2-FINAL
          run-id: 41687012202
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r53-final
      - name: SHA-verify 50 sources and precommit diagnostic subset
        run: |
          set -euo pipefail
          (cd originals && sha256sum -c source.sha256)
          python3 -u experiments/drnas_v16/r55_research_702010.py freeze \
            --sources originals --r53-final r53-final/r53-final.json \
            --out r55-design.json | tee r55-freeze.log
          test "$(python3 -c 'import json;print(len(json.load(open("r55-design.json"))["cases"]))')" = 12
      - uses: actions/upload-artifact@v4
        with:
          name: r55-frozen-development
          path: |
            originals/
            r55-design.json
            r55-freeze.log
          if-no-files-found: error

  paired:
    name: r55-shard-${{ matrix.shard }}
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r55-frozen-development
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: r52-three-pinned-solvers
          run-id: 41684183452
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: bins
      - name: Verify unmodified pinned solver and frozen original SHA
        run: |
          set -euo pipefail
          (cd originals && sha256sum -c source.sha256)
          (cd bins && sha256sum -c binaries.sha256)
          chmod +x bins/kissat_pinned
      - name: Randomized paired 40s runs using one CPU core
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r55_research_702010.py measure \
            --sources originals --design r55-design.json \
            --kissat bins/kissat_pinned --shard "$SHARD" \
            --out results | tee r55-live.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r55-shard-${{ matrix.shard }}
          path: |
            results/
            r55-live.log
          if-no-files-found: warn

  audit:
    name: R55 SHA and PAR2 audit of exactly 120 paired trials
    needs: [freeze, paired]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r55-frozen-development
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: r55-shard-*
          path: combined
      - name: Reject incomplete trials and publish matched timing report
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r55_research_702010.py audit \
            --design r55-design.json --combined combined \
            --json r55-final.json --md r55-final.md
          cat r55-final.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DRNAS-R55-702010-120-PAIRED-R53-DEVELOPMENT-FINAL
          path: |
            r55-final.json
            r55-final.md
            r55-design.json
          if-no-files-found: error
