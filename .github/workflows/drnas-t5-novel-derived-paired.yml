name: DRNAS T5 — certified derived-only novel GF2 trail 320 paired
on:
  push:
    branches: [experiment/drnas-t5-novel-derived-trail-20261108]
    paths:
      - .github/workflows/drnas-t5-novel-derived-paired.yml
      - research/ultimate_t5_build.py
      - research/ultimate_t5_fallback.py
      - research/ultimate_t5_novel.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: t5-novel-derived-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate isolated T5 sources and syntax-check
        run: |
          set -euo pipefail
          python3 -m py_compile research/ultimate_t5_build.py
          python3 -u research/ultimate_t5_build.py
          python3 -m py_compile research/ultimate_t5_fallback.py research/ultimate_t5_benchmark.py research/ultimate_t5_novel.py
          python3 -u research/ultimate_t5_novel.py
          python3 -u research/ultimate_t2_probe.py
          python3 -u research/r166x_certified_gauss.py --selftest
      - name: Require audited original frozen T1 sources and retrieve binary pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Frane12/AndroidGameTest/actions/runs/42351079758 --jq '.conclusion')" = success
          mkdir -p ultimate_t5/t1-audit
          gh run download 42351079758 --repo Frane12/AndroidGameTest -n DRNAS-ULTIMATE-T-PHASE1-240-FINAL -D ultimate_t5/t1-audit
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("ultimate_t5/t1-audit")
          fs=[x for x in [p/"report.json",p/"ultimate_t"/"report.json"] if x.is_file()]
          assert len(fs)==1
          r=json.loads(fs[0].read_text())
          assert r["status"]=="ULTIMATE_T_PHASE1_AUDIT_PASS_NONBLIND"
          assert r["attempts"]==240 and r["original_cnfs_unchanged"] and r["source_XOR_independently_replayed"]
          print("T5_T1_FINAL_PIN_PASS")
          PY
          gh run download 42351079758 --repo Frane12/AndroidGameTest -n ultimate-t-frozen-20originals-native-pins -D .
          chmod +x ultimate_r1/source_r153/r153 built/bin/kissat_4_0_4
          python3 -u research/ultimate_t5_benchmark.py verify
      - name: Build pinned CaDiCaL 2.1 with T5 live proof-gated bridge
        run: |
          set -euo pipefail
          git clone -q https://github.com/arminbiere/cadical.git /tmp/t5-cadical
          (cd /tmp/t5-cadical && git checkout -q 31f9aae44947c673dc6190c9beb399acb9ffec6a && ./configure && make -j2)
          test "$(git -C /tmp/t5-cadical rev-parse HEAD)" = 31f9aae44947c673dc6190c9beb399acb9ffec6a
          mkdir -p ultimate_t5
          : > ultimate_t5/empty.tsv
          g++ -std=c++17 -O2 -Wall -Wextra -I/tmp/t5-cadical/src research/ultimate_t5_native.cpp /tmp/t5-cadical/build/libcadical.a -o ultimate_t5/t-native
          chmod +x ultimate_t5/t-native research/ultimate_t5_fallback.py
          ultimate_t5/t-native selftest | tee ultimate_t5/native-selftest.log
          grep -q '^T5_NOVEL_DERIVED_TRAIL_SELFTEST_PASS' ultimate_t5/native-selftest.log
          python3 -u research/ultimate_t5_benchmark.py selftest
      - name: Smoke proof-replayed novel XOR cancellation on original synthetic CNF
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess,os,time,json
          from research import ultimate_t5_novel as novel
          p=pathlib.Path("ultimate_t5")
          cl=[]
          for vs,rhs in [((1,2,3),0),((1,2,4),1)]:
              for mask in range(8):
                  if (mask.bit_count()%2)==rhs:
                      continue
                  cl.append(" ".join(str(-v if mask>>i&1 else v)
                                     for i,v in enumerate(vs))+" 0")
          cl+=["3 5 0","-4 5 0","3 -5 0","4 5 0"]
          cl+=["3 5 0"]*52
          src=p/"smoke-original.cnf"
          src.write_text(f"p cnf 5 {len(cl)}\n"+"\n".join(cl)+"\n")
          assert src.stat().st_size>=300
          for mode in ("clean","shadow","t2_derived_rows",
                       "t5_novel_shadow","t5_novel_active"):
              env=os.environ.copy()
              env.update(ULTIMATE_T_MODE=mode,
                         ULTIMATE_R2_DEADLINE_NS=str(time.monotonic_ns()+15_000_000_000))
              z=subprocess.run(["python3","research/ultimate_t5_fallback.py",str(src)],
                               env=env,capture_output=True,timeout=16)
              assert z.returncode==10,(mode,z.returncode,z.stderr[-1500:],z.stdout[-2000:])
              assert b"ULTIMATE_T_GATE " in z.stdout and b"R166X_RESULT mode=" in z.stdout,mode
              if mode.startswith("t5_"):
                  assert b"T5_NOVEL_PROOF_PASS " in z.stdout,(mode,z.stdout[-1500:])
                  assert b'"eligible": true' in z.stdout,(mode,z.stdout[-2000:])
          print("T5_ORIGINAL_GF2_CANCELLATION_SMOKE_PASS",flush=True)
          PY
      - name: Freeze SHA256 of 20 original CNFs, T5 code, compiled binary and seeded 320-trial protocol
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          original=json.loads(pathlib.Path("ultimate_r2/build-pin.json").read_text())
          assert original["manifest_sha"]=="2e6169009e985555e43e81d9b534f3bb307cef93963329694ef42459bef3c2e2"
          files=("ultimate_t5/t-native","research/ultimate_t5_native.cpp",
                 "research/ultimate_t5_fallback.py","research/ultimate_t5_benchmark.py",
                 "research/ultimate_t5_build.py","research/ultimate_t5_novel.py", "research/ultimate_t2_probe.py",
                 "ultimate_r1/source_r153/r153","built/bin/kissat_4_0_4")
          record=dict(source_commit=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
                      original_manifest_sha=original["manifest_sha"],
                      original_t1_run=42351079758,prior_td_run=42356438634,
                      protocol="DRNAS-T5-20261108-CERTIFIED-NOVEL-GF2-8ARM-PAIRED-v1",
                      source_count=20,arms=8,repetitions=2,expected_trials=320,
                      development_cap_s=20,new_to_r1_cap_s=30,
                      seed=11,only_derived_GF2_rows=True,derived_width_max=6,derived_max_rows=24,
                      cadical_commit="31f9aae44947c673dc6190c9beb399acb9ffec6a",
                      binaries={p:sha(p) for p in files})
          pathlib.Path("ultimate_t5/build-pin.json").write_text(json.dumps(record,sort_keys=True,indent=2)+"\n")
          print("T5_FROZEN_ORIGINAL_SHA_PASS",record["source_commit"],record["original_manifest_sha"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: t5-frozen-20originals-pins
          retention-days: 90
          path: |
            ultimate_r1/
            ultimate_r2/
            ultimate_t5/
            built/bin/kissat_4_0_4
            research/ultimate_t5_native.cpp
            research/ultimate_t5_fallback.py
            research/ultimate_t5_benchmark.py
            research/ultimate_t5_build.py
            research/ultimate_t5_novel.py
            ultimate_t5/native-selftest.log
  paired:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    name: T5 eight-arm original SHA paired shard ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: t5-frozen-20originals-pins
          path: .
      - name: Verify native source pin and original CNF SHA before solving
        run: |
          set -euo pipefail
          chmod +x ultimate_r1/source_r153/r153 ultimate_t5/t-native research/ultimate_t5_fallback.py built/bin/kissat_4_0_4
          python3 -u research/ultimate_t5_benchmark.py verify
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          pin=json.loads(pathlib.Path("ultimate_t5/build-pin.json").read_text())
          assert pin["source_commit"]==subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          assert pin["expected_trials"]==320
          assert sha("ultimate_r2/frozen/manifest.json")==pin["original_manifest_sha"]
          assert all(sha(p)==x for p,x in pin["binaries"].items())
          print("T5_SHA_VERIFY_PASS")
          PY
      - name: Eight-arm T5 proven novel GF2 vs Clean Source Shadow and Derived baseline
        run: |
          set -euo pipefail
          python3 -u research/ultimate_t5_benchmark.py shard --shard ${{ matrix.shard }} | tee ultimate_t5/shard-${{ matrix.shard }}.log
          grep -q '^ULTIMATE_T2_SHARD_PASS' ultimate_t5/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t5-shard-${{ matrix.shard }}
          retention-days: 90
          path: |
            ultimate_t5/shard-${{ matrix.shard }}.json
            ultimate_t5/shard-${{ matrix.shard }}.log
  audit:
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: t5-frozen-20originals-pins
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: t5-shard-*
          merge-multiple: true
          path: ultimate_t5
      - name: Final 320 source-SHA paired SAT witness and PAR2 audit
        run: |
          set -euo pipefail
          test "$(find ultimate_t5 -maxdepth 1 -name 'shard-*.json' | wc -l)" -eq 5
          python3 -u research/ultimate_t5_benchmark.py audit | tee ultimate_t5/audit.log
          grep -q '^ULTIMATE_T2_FINAL' ultimate_t5/audit.log
          cat ultimate_t5/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-T5-NOVEL-DERIVED-320-PAIRED-FINAL
          retention-days: 90
          path: |
            ultimate_t5/report.json
            ultimate_t5/all-trials.json
            ultimate_t5/all-trials.csv
            ultimate_t5/summary.md
            ultimate_t5/audit.log
