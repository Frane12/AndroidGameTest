name: DRNAS 2SAT-GUARD1 certified small differential
on:
  push:
    branches:
      - experiment/drnas-2sat-guard1-20261115
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-proof-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Native C++20 guard compile
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic src/drnas_2sat_guard.cpp -o drnas-2sat-guard
      - name: Exhaustive small CNF and independent RUP audit
        run: |
          python3 tests/test_drnas_2sat_guard.py ./drnas-2sat-guard
