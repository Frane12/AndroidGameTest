name: DRNAS Ultimate R2T — integrated R2 certified GF2/CDCL 200 paired
on:
  push:
    branches: [experiment/drnas-ultimate-r2t-structural-route-20261107]
    paths: ['research/ultimate_r2t_fallback.py','research/ultimate_r2t_benchmark.py','.github/workflows/drnas-ultimate-r2t.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ultimate-r2t-certified-cdcl-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove preregistered protocol and independent Gaussian proof tests
        run: |
          set -euo pipefail
          python3 -m py_compile research/ultimate_r2t_fallback.py research/ultimate_r2t_benchmark.py research/r166x_certified_gauss.py
          python3 -u research/ultimate_r2t_benchmark.py selftest
          python3 -u research/r166x_certified_gauss.py --selftest
      - name: Reuse exact original R2 frozen 20-source corpus and native binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42346485260 --repo Frane12/AndroidGameTest -n ultimate-r2-originals-pinned-native-protocol -D .
          test -s ultimate_r2/frozen/manifest.json
          test -s ultimate_r2/build-pin.json
          python3 - <<'PY'
          import hashlib,json,pathlib
          h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          p=json.loads(pathlib.Path("ultimate_r2/build-pin.json").read_text())
          assert p["source_commit"]=="5a497c976e7bcc092138d44bb91925996bfc27ba","wrong original R2 provenance"
          assert p["expected_trials"]==200,"changed original R2 protocol"
          assert h("ultimate_r2/frozen/manifest.json")==p["manifest_sha"],"original R2 corpus drift"
          for f,d in p["binaries"].items():
              if f=="research/ultimate_r2_fallback.py":continue
              assert h(f)==d,(f,"native or baseline SHA mismatch")
          print("ULTIMATE_R2T_FROZEN_SOURCE_PASS",p["manifest_sha"])
          PY
          chmod +x ultimate_r1/source_r153/r153 ultimate_r1/ultimate-dispatch ultimate_r1/r160-dispatch ultimate_r1/r194-compat ultimate_r2/r166x-native research/ultimate_r2t_fallback.py built/bin/kissat_4_0_4 built/bin/cadical_3_0_1
          : > ultimate_r2/empty.tsv
          python3 -u research/ultimate_r2t_benchmark.py verify
          ultimate_r2/r166x-native selftest | tee ultimate_r2-native-selftest.log
          grep -q '^R166X_DERIVED_UNIT_NATIVE_SELFTEST_PASS' ultimate_r2-native-selftest.log
          grep -q '^R166X_COOLDOWN_REAWAKEN_SELFTEST_PASS' ultimate_r2-native-selftest.log
      - name: Native SAT smoke of R153 -> certified GF2 -> CDCL live and clean paths
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,subprocess,time
          p=pathlib.Path("ultimate_r2")
          cl=[]
          for g in range(4):
              vs=[3*g+1,3*g+2,3*g+3]
              for mask in (1,2,4,7):
                  cl.append(" ".join(str(-v if mask>>i&1 else v) for i,v in enumerate(vs))+" 0")
          for i in range(28):cl.append(f"{1+(i%12)} {1+((i+5)%12)} 13 0")
          s=p/"smoke-certified-mixed.cnf"
          s.write_text(f"p cnf 13 {len(cl)}\n"+"\n".join(cl)+"\n")
          for mode in ("clean","shadow","live"):
              env=os.environ.copy()
              env.update(ULTIMATE_R2_MODE=mode,ULTIMATE_R2_DEADLINE_NS=str(time.monotonic_ns()+10_000_000_000))
              z=subprocess.run(["ultimate_r1/source_r153/r153",str(s),"research/ultimate_r2t_fallback.py"],
                  stdout=subprocess.PIPE,stderr=subprocess.PIPE,env=env,timeout=11)
              assert z.returncode==10,(mode,z.returncode,z.stderr[-800:],z.stdout[-1500:])
              assert b"ULTIMATE_R2_GATE" in z.stdout,(mode,z.stdout[-1200:])
              if mode=="live":
                  assert b'"eligible": true' in z.stdout,z.stdout[-1400:]
                  assert b"R166X_RESULT mode=gauss_cooldown status=SAT" in z.stdout,z.stdout[-1400:]
          print("ULTIMATE_R2_CERTIFIED_CDCL_INTEGRATION_SELFTEST_PASS")
          PY
      - name: Pin R2x integration against original R2 frozen binaries and source SHA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          f=pathlib.Path("ultimate_r2/build-pin.json")
          v=json.loads(f.read_text())
          h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          assert v["source_commit"]=="5a497c976e7bcc092138d44bb91925996bfc27ba"
          assert h("ultimate_r2/frozen/manifest.json")==v["manifest_sha"]
          for p,d in v["binaries"].items():
              if p!="research/ultimate_r2_fallback.py":assert h(p)==d,p
          v["original_r2_commit"]=v["source_commit"]
          v["original_r2_manifest_sha"]=v["manifest_sha"]
          v["source_commit"]=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          v["protocol"]="DRNAS-ULTIMATE-R2T-STRUCTURAL-200-V1"
          v["binaries"]["research/ultimate_r2_fallback.py"]=h("research/ultimate_r2_fallback.py")
          v["binaries"]["research/ultimate_r2t_fallback.py"]=h("research/ultimate_r2t_fallback.py")
          assert v["expected_trials"]==200
          f.write_text(json.dumps(v,sort_keys=True,indent=2))
          print("ULTIMATE_R2T_PIN_PASS",v["source_commit"],v["manifest_sha"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ultimate-r2t-originals-pinned-native-protocol
          retention-days: 90
          path: |
            ultimate_r1/
            ultimate_r2/
            built/bin/kissat_4_0_4
            built/bin/cadical_3_0_1
            ultimate_r2-native-selftest.log
  paired:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    name: Ultimate R2T same-source five-arm paired shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0,1,2,3,4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ultimate-r2t-originals-pinned-native-protocol
          path: .
      - name: Verify all original CNF SHA, native binaries and exact commit
        run: |
          set -euo pipefail
          chmod +x ultimate_r1/source_r153/r153 ultimate_r1/ultimate-dispatch ultimate_r1/r160-dispatch ultimate_r1/r194-compat ultimate_r2/r166x-native research/ultimate_r2t_fallback.py built/bin/kissat_4_0_4 built/bin/cadical_3_0_1
          python3 -u research/ultimate_r2t_benchmark.py verify
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          v=json.loads(pathlib.Path("ultimate_r2/build-pin.json").read_text())
          for n,s in v["binaries"].items():assert hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==s,n
          assert hashlib.sha256(pathlib.Path("ultimate_r2/frozen/manifest.json").read_bytes()).hexdigest()==v["manifest_sha"]
          assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==v["source_commit"]
          assert v["expected_trials"]==200
          print("ULTIMATE_R2_SHA_CHECKPOINT_PASS")
          PY
      - name: R1A vs R153 vs clean vs live vs bounded structural portfolio
        run: |
          set -euo pipefail
          python3 -u research/ultimate_r2t_benchmark.py shard --shard ${{ matrix.shard }} | tee ultimate_r2/shard-${{ matrix.shard }}.log
          grep -q '^ULTIMATE_R2_SHARD_PASS' ultimate_r2/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultimate-r2t-shard-${{ matrix.shard }}
          retention-days: 90
          path: |
            ultimate_r2/shard-${{ matrix.shard }}.json
            ultimate_r2/shard-${{ matrix.shard }}.log
  audit:
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ultimate-r2t-originals-pinned-native-protocol
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: ultimate-r2t-shard-*
          merge-multiple: true
          path: ultimate_r2
      - name: Strict source SHA SAT witness GF2 replay and 200 paired PAR2 audit
        run: |
          set -euo pipefail
          test "$(find ultimate_r2 -maxdepth 1 -name 'shard-*.json' | wc -l)" -eq 5
          python3 -u research/ultimate_r2t_benchmark.py audit | tee ultimate_r2/audit.log
          grep -q '^ULTIMATE_R2_FINAL' ultimate_r2/audit.log
          echo 'ULTIMATE_R2T_AUDIT_PASS same-original-R2-20-CNF 200 paired' | tee -a ultimate_r2/audit.log
          cat ultimate_r2/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-ULTIMATE-R2X-CERTIFIED-GF2-CDCL-200-FINAL
          retention-days: 90
          path: |
            ultimate_r2/report.json
            ultimate_r2/trials.json
            ultimate_r2/trials.csv
            ultimate_r2/summary.md
            ultimate_r2/audit.log
