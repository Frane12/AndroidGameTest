name: DRNAS TSP v5.3 audit-only CSV archive layout fix
on:
  push:
    branches: [experiment/drnas-tsp-v53-audit-layout-fix-20261104]
    paths: ['.github/workflows/drnas-tsp-v53-audit-layout-fix.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    name: Reuse 6 frozen TSP v5.3 shards and repair missing numpy in audit runner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fix audit-only dependency parity with six successful measure jobs
        run: python -m pip install --disable-pip-version-check numpy scipy numba
      - uses: actions/download-artifact@v4
        with:
          pattern: v53-seed-*
          path: combined
          run-id: 41795867711
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
      - name: Verify all six original shard artifacts exist, without rerunning any solver
        run: |
          set -euo pipefail
          for seed in 18 19 20 21 22 23; do
            test -s "combined/v53-seed-${seed}/results/results.csv" || {
              echo "Frozen seed ${seed} missing: fail closed"; exit 1;
            }
          done
          python - <<'PY'
          import csv
          from pathlib import Path
          for seed in range(18,24):
              path=Path(f'combined/v53-seed-{seed}/results/results.csv')
              with path.open(newline='') as f:
                  rows=list(csv.DictReader(f))
              assert len(rows)==60, (seed,len(rows))
              assert set(map(lambda x:x['seed'], rows))=={str(seed)},seed
              print('V53_CSV_ARCHIVE_VERIFIED',seed,len(rows))
          PY
          python -m py_compile experiments/tsp_shared_v31/compare_v53_causal.py
      - name: Original fail-closed paired 72-attempt causal audit
        env:
          NUMBA_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python -u experiments/tsp_shared_v31/compare_v53_causal.py audit --combined combined --out final | tee v53-audit.log
          grep -q '^V53_CAUSAL_AUDIT_PASS' v53-audit.log
          cat final/v53-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-TSP-V53-AUDIT-ONLY-RECOVERED-41795867711
          path: |
            final/
            v53-audit.log
          retention-days: 90

# Frozen source run 41795867711: fixes archive filename rows.json -> results.csv; no solver reruns.
