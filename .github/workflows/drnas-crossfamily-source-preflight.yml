name: DRNAS cross-family original SATLIB archive preflight
on:
  push:
    branches: [experiment/drnas-v1531-crossfamily-transfer-20261101]
    paths: [.github/workflows/drnas-crossfamily-source-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify original graph colouring corpus SHA1 and archive member counts
        run: |
          set -euo pipefail
          curl -fLsS --connect-timeout 10 --max-time 55 --retry 2 \
          "https://www.cs.ubc.ca/~hoos/SATLIB/Benchmarks/SAT/GraphColouring/flat200-479.tar.gz" \
          -o flat200-479.tar.gz
          echo "001aa0da7a2954dbb8e4dd1cb7aba6e0a4979a2d  flat200-479.tar.gz" | sha1sum -c -
          python3 - <<'PY'
          import tarfile
          p='flat200-479.tar.gz'
          with tarfile.open(p,'r:gz') as t:
             a=[x for x in t if x.isfile() and x.name.endswith('.cnf')]
             print("GRAPH_CORPUS_READY",len(a),"first_member",a[0].name)
             assert len(a)>=40
          PY
