name: DRNAS SAT v16.1 adaptive gate
on:
  push:
    branches: ['experiment/drnas-v16-adaptive-general-20261101']
    paths:
      - 'experiments/drnas_v16/**'
      - '.github/workflows/drnas-sat-v161-gate.yml'
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated classifier and gate tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic experiments/drnas_v16/structure_probe_test.cpp -o /tmp/probe
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic experiments/drnas_v16/adaptive_gate_test.cpp -o /tmp/gate
      - name: Run tests
        run: |
          /tmp/probe
          /tmp/gate
