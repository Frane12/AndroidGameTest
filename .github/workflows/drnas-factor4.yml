name: DRNAS FACTOR4 adaptive structural gate
run-name: FACTOR4 32 frozen CNF x A CDCL B factor C gated x 3 reps 288 oneCPU
on:
  push:
    branches: [experiment/drnas-factor4-adaptive-gate-20261110]
    paths:
      - research/drnas_factor4_native.cpp
      - research/drnas_factor4_benchmark.py
      - .github/workflows/drnas-factor4.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  factor4:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build native FACTOR4
        run: |
          set -euo pipefail
          mkdir -p mre_factor4/bin
          python3 -m py_compile research/drnas_factor4_benchmark.py
          g++ -std=c++17 -O2 research/drnas_factor4_native.cpp -o mre_factor4/bin/drnas_factor4
      - name: Run 288 frozen native A B C trials oneCPU
        run: |
          set -euo pipefail
          taskset -c "$(taskset -pc $$ | sed 's/.*: //' | cut -d, -f1 | cut -d- -f1)" \
            python3 -u research/drnas_factor4_benchmark.py | tee mre_factor4/benchmark.log
          grep -q '^FACTOR4_FINAL ' mre_factor4/benchmark.log
          grep '^FACTOR4_FINAL ' mre_factor4/benchmark.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-FACTOR4-ADAPTIVE-288-ONECPU-AUDIT
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_factor4/audit.json
            mre_factor4/*.cnf
            mre_factor4/*.log
            mre_factor4/bin/drnas_factor4
