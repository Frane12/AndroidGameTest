name: DRNAS SCALE5 specialized CP-SAT AllDifferent Hall baseline
on:
  push:
    branches: [experiment/drnas-pcmax-scale4-vs-ortools-20261124]
    paths:
      - .github/workflows/drnas-pcmax-vs-alldifferent.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alldiff:
    name: AllDifferent / ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        case: [HALL_DENSE_UNSAT_32, HALL_SPARSE_UNSAT_800, HALL_SPARSE_SAT_800, HALL_SPARSE_UNSAT_1600]
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned OR-Tools
        run: |
          python3 -m pip install --quiet --disable-pip-version-check 'ortools==9.14.6206'
          python3 -c 'import ortools; print(ortools.__version__)'
      - name: Native AllDifferent domain comparison, one CPU
        run: |
          mkdir -p results/complex5
          timeout 80s python3 -B research/pcmax_hall/benchmark_complex_ortools.py \
            --case '${{ matrix.case }}' --arm alldiff --out results/complex5 --budget 8 \
            | tee results/complex5/alldiff.log
      - name: Preserve inputs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale5-alldiff-${{ matrix.case }}
          retention-days: 60
          path: results/complex5/
