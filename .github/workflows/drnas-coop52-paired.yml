          grep -q '^CROSS_FINAL' coop52_final.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coop52-deep-repair-real36-final
          retention-days: 60
          if-no-files-found: warn
          path: |
            cross_final/
            coop52_final.log
