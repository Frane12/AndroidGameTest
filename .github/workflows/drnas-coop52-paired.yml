name: DRNAS COOP5.2 24k and fallback vs frozen COOP5 X5.9 Kissat CaDiCaL
on:
  push:
    branches: [experiment/drnas-coop52-deep-repair-20261114]
    paths: [.github/workflows/drnas-coop52-paired.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-coop52-deep-repair-real36-paired
  cancel-in-progress: false

jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 43530828469
          name: coop52-frozen-verified-preflight
          github-token: ${{ github.token }}
          path: .
      - name: Exact frozen binary + 36 original SHA verification on one logical CPU
        run: |
          set -euo pipefail
          tar -xzf coop52_frozen.tgz
          sha256sum -c build/COOP52_BINARIES.sha256
          (cd cross/x59 && grep -v '  build/drnas-x5
          CPU="$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')"
          echo "COOP52_ONE_LOGICAL_CPU=$CPU"
          python3 -m py_compile research/drnas_coop52/paired.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'research')
          import drnas_x55_cpu_real36 as B
          sources,_=B.official_manifest()
          assert len(sources)==36
          print('COOP52_REAL36_36_SHA_PASS')
          PY
      - name: Paired 6-arm original SAT2024 verified PAR2 cap8
        run: |
          set -euo pipefail
          CPU="$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')"
          PYTHONHASHSEED=0 taskset -c "$CPU" python3 -u research/drnas_coop52/paired.py shard \
            --shard ${{ matrix.shard }} --cap 8 --reps 2 | tee coop52_shard.log
          grep -q '^CROSS_SHARD_PASS' coop52_shard.log
          echo 'COOP52_SHARD_PASS shard=${{ matrix.shard }}' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-shard-${{ matrix.shard }}
          retention-days: 60
          if-no-files-found: warn
          path: |
            cross_results/shard_${{ matrix.shard }}/
            coop52_shard.log

  aggregate:
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 43530828469
          name: coop52-frozen-verified-preflight
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: cross-shard-*
          merge-multiple: false
          path: cross_downloads
      - name: Verify 432 paired rows, independent proof, family CIs and probe activation
        run: |
          set -euo pipefail
          tar -xzf coop52_frozen.tgz
          python3 -u research/drnas_coop52/paired.py aggregate | tee coop52_final.log
          grep -q '^CROSS_FINAL' coop52_final.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coop52-deep-repair-real36-final
          retention-days: 60
          if-no-files-found: warn
          path: |
            cross_final/
            coop52_final.log
 build/X59_BINARIES.sha256 | sha256sum -c -)
          CPU="$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')"
          echo "COOP52_ONE_LOGICAL_CPU=$CPU"
          python3 -m py_compile research/drnas_coop52/paired.py
