name: DRNAS SAT V9.3 — Zero-Shot Transfer Across Six Unseen NP SAT Classes
on:
  push:
    branches:
      - experiment/drnas-sat-v93-unseen-np-classes-20261031
    paths:
      - '.github/workflows/drnas-sat-v93-zero-shot.yml'
      - 'research/drnas-sat-v7-8/blind_v93.py'
      - 'research/drnas-sat-v7-8/v93_new_generators.py'
      - 'research/drnas-sat-v7-8/v92_early_structural.cpp'
      - 'research/drnas-sat-v7-8/summarize_v93.py'
      - 'research/drnas-sat-v7-8/patch_cadical_v90.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blind-v93:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify frozen legacy sources and compile separate optimized experiment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/blind_v93.py research/drnas-sat-v7-8/summarize_v93.py research/drnas-sat-v7-8/v93_new_generators.py
          test "$(git hash-object research/drnas-sat-v7-6/v76_single.cpp)" = a254356a45b70f02f33b9506f1122dad33916ca7
          test "$(git hash-object research/drnas-sat-v7-7/v77_single.cpp)" = 1bbb7fa035e62d5179de9243f672aed9bb9cbaca
          test "$(git hash-object research/drnas-sat-v7-8/v80_hybrid_probe.cpp)" = 208c8641c311fcb0940259c4ff2bc1c1e0f23838
          mkdir -p blind-v93-results/shard-${{ matrix.shard }}
          sha256sum research/drnas-sat-v7-6/v76_single.cpp research/drnas-sat-v7-7/v77_single.cpp research/drnas-sat-v7-8/v92_early_structural.cpp > blind-v93-results/shard-${{ matrix.shard }}/source_hashes.txt
          python3 - <<'PY'
          from pathlib import Path
          src=Path('research/drnas-sat-v7-7/v77_single.cpp').read_text()
          marker='\nint main(int argc,char**argv) {'
          assert src.count(marker)==1
          pre=src.split(marker,1)[0]
          assert 'static V77 solve77(' in pre
          Path('research/drnas-sat-v7-7/v77_embedded_functions.inc').write_text(pre+'\n')
          PY
          # Confirm all thirty new formula generators succeed before building.
          python3 - <<'PY'
          import hashlib,random,sys
          sys.path.insert(0,"research/drnas-sat-v7-8")
          from v93_new_generators import GENS
          cases={"queens":[8,10,12,14,16],
                 "planted_clique":[22,26,30,34,38],
                 "latin_square":[5,6,7,8,9],
                 "subset_sum":[10,12,14,16,18],
                 "exact_cover":[8,10,12,14,16],
                 "circuit_miter":[8,10,12,14,16]}
          for name,ns in cases.items():
              for n in ns:
                  rng=random.Random(int(hashlib.sha256((name+str(n)).encode()).hexdigest()[:12],16))
                  nv,rows,truth=GENS[name](n,rng)
                  assert nv>0 and len(rows)>0 and all(row for row in rows)
                  assert all(0<abs(lit)<=nv for row in rows for lit in row)
                  assert truth.startswith(("SAT-","UNSAT-"))
          print("V93_30_GENERATOR_PREFLIGHT_OK")
          PY
          git clone --depth 1 --branch rel-3.0.1 https://github.com/arminbiere/cadical.git cadical-src
          test "$(git -C cadical-src rev-parse HEAD)" = c60730422e758ef1cebe7aeddf2dda31c996bf04
          # Instrument ONLY this temporary local clone, never the pinned source repository.
          python3 -u research/drnas-sat-v7-8/patch_cadical_v90.py cadical-src
          sha256sum cadical-src/src/{cadical.hpp,stats.hpp,analyze.cpp,solver.cpp} > blind-v93-results/shard-${{ matrix.shard }}/instrumented_hashes.txt
          (cd cadical-src && ./configure && make -j2 > /tmp/ca-build.log 2>&1) || { tail -100 /tmp/ca-build.log; exit 1; }
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -I cadical-src/src \
            research/drnas-sat-v7-8/v92_early_structural.cpp \
            cadical-src/build/libcadical.a -o v92_early_structural -pthread -ldl -lz
          lscpu > blind-v93-results/shard-${{ matrix.shard }}/cpu.txt
      - name: Run 6 new CNFs x 3 repeats x 6 modes (3-second cap)
        shell: bash
        run: |
          set -euo pipefail
          SHARD=${{ matrix.shard }} python3 -u research/drnas-sat-v7-8/blind_v93.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v93-shard-${{ matrix.shard }}
          path: blind-v93-results/shard-${{ matrix.shard }}/
          if-no-files-found: warn
  audit-v93:
    needs: blind-v93
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: v93-shard-*
          path: combined-v93-temp
      - name: Validate all 30 cases and summarize all 540 measurements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p combined-v93
          for shard in 0 1 2 3 4; do
            test -f "combined-v93-temp/v93-shard-$shard/manifest.json"
            mv "combined-v93-temp/v93-shard-$shard" "combined-v93/shard-$shard"
          done
          python3 -u research/drnas-sat-v7-8/summarize_v93.py combined-v93
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-v93-30-UNSEEN-CLASSES-full-audit
          path: combined-v93/
          if-no-files-found: warn
