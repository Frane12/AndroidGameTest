name: DRNAS V14.7 XOR4 correctness gate
on:
  push:
    branches: [experiment/drnas-v147-xor4-robust-proof-20261101]
    paths:
      - 'research/drnas-sat-v7-8/v147_xor4.cpp'
      - 'research/tseitin-replay/v147_native_benchmark.py'
      - 'research/tseitin-replay/xor4_robust.py'
      - 'research/tseitin-replay/test_xor4_robust.py'
      - '.github/workflows/drnas-v147-xor4-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run robust parity correctness tests
        run: |
          python3 -m unittest discover -s research/tseitin-replay -p 'test_xor4_robust.py' -v
      - name: Compile native V14.2 baseline
        run: |
          g++ -std=c++17 -O3 -DNDEBUG research/drnas-sat-v7-8/v142_xor4.cpp -o /tmp/v142_xor4
          test -x /tmp/v142_xor4
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra research/drnas-sat-v7-8/v147_xor4.cpp -o /tmp/v147_xor4
          test -x /tmp/v147_xor4
      - name: Build Kissat baseline from upstream source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/arminbiere/kissat.git /tmp/kissat-source
          git -C /tmp/kissat-source rev-parse HEAD | tee /tmp/kissat-commit.txt
          (cd /tmp/kissat-source && ./configure && make -j2)
          cp /tmp/kissat-source/build/kissat /tmp/kissat_solver
          /tmp/kissat_solver --version
      - name: Run native 30-case head-to-head
        run: |
          set -euo pipefail
          python3 research/tseitin-replay/v147_native_benchmark.py
          cp /tmp/kissat-commit.txt v147-native-results/kissat-commit.txt
      - name: Upload native benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRNAS-V147-Native-30-XOR4
          path: v147-native-results/
          if-no-files-found: warn
