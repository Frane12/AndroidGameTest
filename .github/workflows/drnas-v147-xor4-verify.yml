name: DRNAS V14.9 Selective benchmark (native)
on:
  push:
    branches: [experiment/drnas-v147-xor4-robust-proof-20261101]
    paths:
      - 'research/drnas-sat-v7-8/v147_xor4.cpp'
      - 'research/drnas-sat-v7-8/v148_xor4.cpp'
      - 'research/drnas-sat-v7-8/v149_xor4.cpp'
      - 'research/tseitin-replay/v149_regression_benchmark.py'
      - 'research/tseitin-replay/v149_public_holdout.py'
      - 'research/tseitin-replay/v148_native_benchmark.py'
      - 'research/tseitin-replay/v147_native_benchmark.py'
      - 'research/tseitin-replay/xor4_robust.py'
      - 'research/tseitin-replay/test_xor4_robust.py'
      - '.github/workflows/drnas-v147-xor4-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run robust parity correctness tests
        run: |
          python3 -m unittest discover -s research/tseitin-replay -p 'test_xor4_robust.py' -v
      - name: Compile native V14.2 baseline
        run: |
          g++ -std=c++17 -O3 -DNDEBUG research/drnas-sat-v7-8/v142_xor4.cpp -o /tmp/v142_xor4
          test -x /tmp/v142_xor4
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra research/drnas-sat-v7-8/v147_xor4.cpp -o /tmp/v147_xor4
          test -x /tmp/v147_xor4
      - name: Build Kissat baseline from upstream source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/arminbiere/kissat.git /tmp/kissat-source
          git -C /tmp/kissat-source rev-parse HEAD | tee /tmp/kissat-commit.txt
          (cd /tmp/kissat-source && ./configure && make -j2)
          cp /tmp/kissat-source/build/kissat /tmp/kissat_solver
          /tmp/kissat_solver --version
      - name: Run native 30-case head-to-head
        run: |
          set -euo pipefail
          python3 research/tseitin-replay/v147_native_benchmark.py
          cp /tmp/kissat-commit.txt v147-native-results/kissat-commit.txt
      - name: Upload native benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRNAS-V147-Native-30-XOR4
          path: v147-native-results/
          if-no-files-found: warn
      - name: Compile native V14.8
        run: |
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra research/drnas-sat-v7-8/v148_xor4.cpp -o /tmp/v148_xor4
          test -x /tmp/v148_xor4
      - name: Run V14.8 six-family holdout
        run: |
          set -euo pipefail
          python3 research/tseitin-replay/v148_native_benchmark.py
          cp /tmp/kissat-commit.txt v148-native-results/kissat-commit.txt
      - name: Upload V14.8 holdout results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRNAS-V148-Native-72-Holdout
          path: v148-native-results/
          if-no-files-found: warn
      - name: Compile selective native V14.9
        run: |
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra research/drnas-sat-v7-8/v149_xor4.cpp -o /tmp/v149_xor4
          test -x /tmp/v149_xor4
      - name: Regression against V14.8 development cases
        run: |
          set -euo pipefail
          python3 research/tseitin-replay/v149_regression_benchmark.py
          cp /tmp/kissat-commit.txt v149-regression-results/kissat-commit.txt
      - name: Upload V14.9 regression artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRNAS-V149-Reg-72
          path: v149-regression-results/
          if-no-files-found: warn
      - name: Fetch frozen external 12-case public holdout
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Byt-wyze-technology/sat-instances-library.git /tmp/sat-external
          test "$(git -C /tmp/sat-external rev-parse HEAD)" = "0a150d63fb86d0eb344d65c6b2cf94be24bbfd11"
      - name: Execute public holdout V14.2 V14.7 V14.8 V14.9 Kissat
        run: |
          set -euo pipefail
          python3 research/tseitin-replay/v149_public_holdout.py
          cp /tmp/kissat-commit.txt v149-public-holdout-results/kissat-commit.txt
      - name: Upload V14.9 public holdout artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRNAS-V149-External-12
          path: v149-public-holdout-results/
          if-no-files-found: warn
