name: DRNAS SAT V10.3 - Locked Router on New 2026 CNFs
on:
  push:
    branches: [experiment/drnas-sat-v103-frozen-router-20261031]
    paths:
      - '.github/workflows/drnas-sat-v103-frozen-router.yml'
      - 'research/drnas-sat-v7-8/v103_frozen_router.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python syntax and deterministic routing selftest
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/v103_frozen_router.py
          python3 research/drnas-sat-v7-8/v103_frozen_router.py selftest
  freeze:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-UnOfficial-SATComp2026-Mini-216-Matched
          run-id: 41248293940
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: training
      - uses: actions/download-artifact@v4
        with:
          name: v100-frozen-protocol-and-inputs
          run-id: 41245906965
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior-v100
      - name: Verify pinned official 2026 score source
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 120 \
            https://raw.githubusercontent.com/satcompetition/2026/3e2dee7cf5aa643c77bf946280a3c1c520756ef9/downloads/scores.csv \
            -o official_scores.csv
          test "$(git hash-object official_scores.csv)" = 9c926b2bd35ac0fb4f3d0cf8f58c97178d43faef
          test -f training/official_mini_report.json
          test -f training/frozen/official_mini_manifest.json
          (cd training/frozen && sha256sum -c official_mini_manifest.sha256)
          (cd prior-v100 && sha256sum -c v100_manifest.sha256)
      - name: Freeze trained policy and 100-120 new CNF inputs before measurements
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/v103_frozen_router.py freeze \
            --train training/official_mini_report.json \
            --prior training/frozen/official_mini_manifest.json \
            --v100 prior-v100/v100_manifest.json \
            --scores official_scores.csv --out v103_manifest.json
          sha256sum v103_manifest.json > v103_manifest.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V103-locked-router-new-inputs
          path: |
            v103_manifest.json
            v103_manifest.sha256
          if-no-files-found: warn
  benchmark:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5]
    name: v103-shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V103-locked-router-new-inputs
          path: frozen
      - name: Build pinned CaDiCaL 3.0.1 + DRNAS + upstream Kissat 4.0.4
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v103_manifest.sha256)
          test "$(git hash-object research/drnas-sat-v7-6/v76_single.cpp)" = a254356a45b70f02f33b9506f1122dad33916ca7
          test "$(git hash-object research/drnas-sat-v7-7/v77_single.cpp)" = 1bbb7fa035e62d5179de9243f672aed9bb9cbaca
          python3 - <<'PY'
          from pathlib import Path
          s=Path('research/drnas-sat-v7-7/v77_single.cpp').read_text()
          marker='\nint main(int argc,char**argv) {'
          assert s.count(marker)==1
          Path('research/drnas-sat-v7-7/v77_embedded_functions.inc').write_text(s.split(marker,1)[0]+'\n')
          PY
          git clone --depth 1 --branch rel-3.0.1 https://github.com/arminbiere/cadical.git cadical-src
          test "$(git -C cadical-src rev-parse HEAD)" = c60730422e758ef1cebe7aeddf2dda31c996bf04
          python3 research/drnas-sat-v7-8/patch_cadical_v90.py cadical-src
          (cd cadical-src && ./configure && make -j2 >/tmp/v103-ca.log 2>&1) \
            || { tail -120 /tmp/v103-ca.log; exit 1; }
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -I cadical-src/src \
            research/drnas-sat-v7-8/v101_graded_confidence_probe.cpp \
            cadical-src/build/libcadical.a -o v103_drnas -pthread -ldl -lz
          git clone --depth 1 --branch rel-4.0.4 https://github.com/arminbiere/kissat.git kissat-src
          test "$(git -C kissat-src rev-parse --short=7 HEAD)" = 8af8e56
          (cd kissat-src && ./configure && make -j2 >/tmp/v103-k.log 2>&1) \
            || { tail -120 /tmp/v103-k.log; exit 1; }
          test -x kissat-src/build/kissat
          {
            lscpu
            git -C cadical-src rev-parse HEAD
            git -C kissat-src rev-parse HEAD
            sha256sum research/drnas-sat-v7-8/v103_frozen_router.py
          } > build_provenance.txt
      - name: Paired 15s/3GiB trials, four modes x two repeats
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/v103_frozen_router.py run \
            --manifest frozen/v103_manifest.json --shard "$SHARD" \
            --drnas ./v103_drnas --kissat ./kissat-src/build/kissat --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v103-shard-${{ matrix.shard }}
          path: |
            results/
            build_provenance.txt
          if-no-files-found: warn
  audit:
    needs: [freeze, benchmark]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V103-locked-router-new-inputs
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: v103-shard-*
          path: combined
      - name: Strict audit of every matched case and locked prediction
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v103_manifest.sha256)
          python3 -u research/drnas-sat-v7-8/v103_frozen_router.py audit \
            --manifest frozen/v103_manifest.json --combined combined \
            --out v103_report.json --md v103_report.md
          cat v103_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V103-new-CNF-locked-router-audit
          path: |
            frozen/
            combined/
            v103_report.json
            v103_report.md
          if-no-files-found: warn
