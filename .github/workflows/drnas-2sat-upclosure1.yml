name: DRNAS 2SAT UP-CLOSURE1 certified permutation differential
on:
  push:
    branches:
      - experiment/drnas-2sat-upclosure1-20261115
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certified-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile baseline and new native C++20 solvers
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic src/drnas_2sat_guard.cpp -o drnas-2sat-guard
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic src/drnas_2sat_upclosure.cpp -o drnas-2sat-upclosure
      - name: Run differential exhaustive and independent RUP proof audit
        run: |
          python3 tests/test_drnas_2sat_upclosure.py ./drnas-2sat-guard ./drnas-2sat-upclosure
