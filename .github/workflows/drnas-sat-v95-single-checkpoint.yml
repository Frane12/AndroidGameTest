name: DRNAS SAT V9.5 — Causal Single 96 vs Dual 96+96 Checkpoint Ablation
on:
  push:
    branches: [experiment/drnas-sat-v95-single-checkpoint-control-20261031]
    paths: ['.github/workflows/drnas-sat-v95-single-checkpoint.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  bench:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    name: v95-dual-shard-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: v94-frozen-new12-official-manifest
          run-id: 41232668762
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: official_manifest
      - name: Verify unchanged official case hashes, compile separate v9.5 executable
        shell: bash
        run: |
          set -euo pipefail
          (cd official_manifest && sha256sum -c manifest.sha256)
          python3 -m py_compile research/drnas-sat-v7-8/official_v95_ablate_run.py \
            research/drnas-sat-v7-8/official_v95_ablate_audit.py
          test "$(git hash-object research/drnas-sat-v7-6/v76_single.cpp)" = a254356a45b70f02f33b9506f1122dad33916ca7
          test "$(git hash-object research/drnas-sat-v7-7/v77_single.cpp)" = 1bbb7fa035e62d5179de9243f672aed9bb9cbaca
          python3 - <<'PY'
          from pathlib import Path
          src=Path('research/drnas-sat-v7-7/v77_single.cpp').read_text()
          marker='\nint main(int argc,char**argv) {'
          assert src.count(marker)==1
          Path('research/drnas-sat-v7-7/v77_embedded_functions.inc').write_text(src.split(marker,1)[0]+'\n')
          PY
          git clone --depth 1 --branch rel-3.0.1 https://github.com/arminbiere/cadical.git cadical-src
          test "$(git -C cadical-src rev-parse HEAD)" = c60730422e758ef1cebe7aeddf2dda31c996bf04
          python3 -u research/drnas-sat-v7-8/patch_cadical_v90.py cadical-src
          (cd cadical-src && ./configure && make -j2 >/tmp/ca-v95.log 2>&1) \
            || { tail -120 /tmp/ca-v95.log; exit 1; }
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -I cadical-src/src \
            research/drnas-sat-v7-8/v95_dual_vs_single.cpp \
            cadical-src/build/libcadical.a -o v95_dual_probe -pthread -ldl -lz
          lscpu > cpu.txt
      - name: 3 official CNFs x 2 repeats x 4 controls, same pinned 15s wall cap
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/official_v95_ablate_run.py \
            --manifest official_manifest/official_v94_manifest.json \
            --shard "$SHARD" --out results --exe ./v95_dual_probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-v95-ablate-shard-${{ matrix.shard }}
          path: |
            results/
            cpu.txt
          if-no-files-found: warn
  audit:
    needs: bench
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: v94-frozen-new12-official-manifest
          run-id: 41232668762
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: official_manifest
      - uses: actions/download-artifact@v4
        with:
          pattern: official-v95-ablate-shard-*
          path: ablate-v95
      - name: Fail closed if missing 96 comparisons or incorrect SAT/UNSAT
        shell: bash
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/official_v95_ablate_audit.py ablate-v95
          cat ablate-v95/v95_ablation.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-v95-single-vs-dual-checkpoint-96-complete
          path: |
            official_manifest/
            ablate-v95/
          if-no-files-found: warn
