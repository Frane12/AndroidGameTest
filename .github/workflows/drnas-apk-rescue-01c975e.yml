name: DRNAS APK rescue pinned 01c975e
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drnas-apk-rescue-01c975e
  cancel-in-progress: false
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '01c975e94d2ff35d4c16134e0f82725c49d2fa7d'
          persist-credentials: false
      - name: Verify pinned source
        run: |
          test "$(git rev-parse HEAD)" = "01c975e94d2ff35d4c16134e0f82725c49d2fa7d"
          echo "Original queued APK run: https://github.com/Frane12/AndroidGameTest/actions/runs/43095634721" >> "$GITHUB_STEP_SUMMARY"
          echo "Source SHA: 01c975e94d2ff35d4c16134e0f82725c49d2fa7d" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract game source
        run: |
          unzip -q Zvjezdana-Macka-0.5-Izvorni-Kod.zip
          cp -a cat-game/. .
          test -f src/hr/frane/zvjezdana/MainActivity.java
      - name: Build signed APK
        run: bash build.sh
      - name: Run tests
        run: |
          mkdir -p build/test-classes
          javac -d build/test-classes src/hr/frane/zvjezdana/GameRules.java tests/RulesTest.java
          java -cp build/test-classes RulesTest
      - uses: actions/upload-artifact@v4
        with:
          name: Zvjezdana-Macka-0.5
          path: build/Zvjezdana-Macka-0.5.apk
          if-no-files-found: error

