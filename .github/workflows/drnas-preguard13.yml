name: DRNAS PRE-GUARD13 root vs Kissat preprocessing A B
on:
  push:
    branches:
      - experiment/drnas-preguard-shadow13-20261114
    paths:
      - .github/workflows/drnas-preguard13.yml
      - research/drnas_preguard_shadow13.py
      - research/drnas_preguard_shadow_build.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 43613581688
          name: cf7-source-manifest
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          run-id: 43613581688
          name: cf7-compiled-binaries
          github-token: ${{ github.token }}
          path: .
      - name: Build isolated read only PRE-GUARD root telemetry and compare preprocessor effect
        run: |
          set -euo pipefail
          tar -xzf cf7_inputs.tgz
          tar -xzf cf7_binaries.tgz
          python3 research/drnas_clause_cf6_build.py
          python3 research/drnas_preguard_shadow_build.py
          CPU="$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')"
          taskset -c "$CPU" python3 -u research/drnas_preguard_shadow13.py | tee preguard13.log
          grep -q '^PREGUARD_PASS ' preguard13.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preguard13-root-audit
          retention-days: 50
          path: |
            preguard13/
            preguard13.log
