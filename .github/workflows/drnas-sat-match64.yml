name: DRNAS SAT-MATCH1 worker64 original six-arm post-discovery verification
on:
  push:
    branches: [experiment/drnas-sat-clause1-20261115]
    paths:
      - research/sat_match64/**
      - .github/workflows/drnas-sat-match64.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-sat-match64-20261115
  cancel-in-progress: false
jobs:
  focused_paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 43613581688
          name: cf7-source-manifest
          github-token: ${{ github.token }}
          path: frozen/sources
      - uses: actions/download-artifact@v4
        with:
          run-id: 43664639093
          name: math5-blind30-frozen
          github-token: ${{ github.token }}
          path: frozen/math5
      - name: Restore source and exact pinned reference binaries
        run: |
          set -euo pipefail
          tar -xzf frozen/sources/cf7_inputs.tgz
          tar -xzf frozen/math5/math5-blind-frozen.tgz
          test -x build/kissat
          test -x build/cadical
          sha256sum build/kissat build/cadical cf7/manifest.json
      - name: Compile native same-process CDCL
        run: |
          set -euo pipefail
          g++ -O3 -std=c++20 -DNDEBUG src/drnas_x59.cpp -o build/drnas-sat-clause1
          python3 -m py_compile research/sat_match64/solve.py research/sat_match64/benchmark.py
      - name: Five-repeat six-arm original source-verified PAR2
        run: |
          set -euo pipefail
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 \
            python3 -u research/sat_match64/benchmark.py
      - name: Archive exact per-arm E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sat-match64-six-arm
          path: sat_match64_results/
          if-no-files-found: warn
          retention-days: 30
