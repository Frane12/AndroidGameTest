name: DRNAS ARG3 prospective original argumentation source freeze NO SOLVERS
on:
  push:
    branches: [experiment/drnas-arg3-real-argumentation-blind1-20261115]
    paths:
      - research/arg3_realarg/freeze.py
      - .github/workflows/drnas-arg3-realarg-freeze.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-arg3-realarg-freeze-20261115
  cancel-in-progress: false
jobs:
  source_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 43613581688
          repository: Frane12/AndroidGameTest
          name: cf7-source-manifest
          github-token: ${{ github.token }}
          path: frozen/cf7
      - uses: actions/download-artifact@v4
        with:
          run-id: 43710031198
          repository: Frane12/AndroidGameTest
          name: real2025-originals-frozen
          github-token: ${{ github.token }}
          path: frozen/2025
      - name: Recover prior original-source SHA exclusions only
        run: |
          set -euo pipefail
          tar -xzf frozen/cf7/cf7_inputs.tgz
          tar -xzf frozen/2025/real2025-originals-frozen.tgz
          python3 -m py_compile research/arg3_realarg/freeze.py
          sha256sum cf7/manifest.json sat_real2025_inputs/manifest.json research/arg3_realarg/freeze.py
      - name: Freeze all fixed argumentation GBDs before any solver
        run: |
          set -euo pipefail
          python3 -u research/arg3_realarg/freeze.py | tee arg3_source_only.log
          grep -q '^ARG3_SOURCE_FREEZE ' arg3_source_only.log
          tar -czf arg3-realarg-frozen.tgz arg3_realarg_inputs
          sha256sum arg3-realarg-frozen.tgz arg3_realarg_inputs/manifest.json
      - name: Upload complete rejected and retained source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arg3-realarg-freeze-audit
          path: |
            arg3_realarg_inputs/manifest.json
            arg3_realarg_inputs/source.sha256
            arg3_source_only.log
          if-no-files-found: warn
          retention-days: 60
      - name: Publish original frozen CNFs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: arg3-realarg-frozen-originals
          path: arg3-realarg-frozen.tgz
          if-no-files-found: error
          retention-days: 60
