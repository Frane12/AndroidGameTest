name: DRNAS X4.12 two-stage contextual polarity and net benefit
on:
  push:
    branches: [experiment/drnas-x412-context-gain-20261113]
    paths:
      - src/drnas_x412.cpp
      - research/x412_models.py
      - research/drnas_x412.py
      - research/drnas_x412_unsat.py
      - tests/test_x412.py
      - .github/workflows/drnas-x412-context-gain.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drnas-x412-context-gain-${{ github.ref }}
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - name: Validate Python sources
        run: |
          set -euo pipefail
          mkdir -p x412_diagnostics
          python -m compileall -q research/x412_models.py research/drnas_x412.py research/drnas_x412_unsat.py tests/test_x412.py 2>&1 | tee x412_diagnostics/python_syntax.log
      - name: Compile frozen CORE reference
        run: |
          set -euo pipefail
          mkdir -p build x412_diagnostics
          g++ -std=c++20 -O3 -Wall -Wextra -Wpedantic -Werror src/drnas_x49.cpp -o build/drnas-x49 2>&1 | tee x412_diagnostics/native_x49.log
          g++ -std=c++20 -O3 -Wall -Wextra -Wpedantic -Werror src/drnas_x410.cpp -o build/drnas-x410 2>&1 | tee x412_diagnostics/native_x410.log
      - name: Compile isolated new X4.12 engine
        run: |
          set -euo pipefail
          mkdir -p build x412_diagnostics
          g++ -std=c++20 -O3 -Wall -Wextra -Wpedantic -Werror src/drnas_x412.cpp -o build/drnas-x412 2>&1 | tee x412_diagnostics/native_x412.log
      - name: Run independent old CORE SAT UNSAT oracle
        run: |
          set -euo pipefail
          python -u tests/test_x410.py --cases 100 2>&1 | tee x412_diagnostics/x410_oracle.log
      - name: Run two-stage X4.12 parity smoke with full failure trace
        run: |
          set -euo pipefail
          python -u tests/test_x412.py --cases 100 2>&1 | tee x412_diagnostics/x412_smoke.log
      - name: Save correctness evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x412-correctness-evidence
          path: |
            x412_diagnostics/
          if-no-files-found: ignore
          retention-days: 14
  benchmark:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - name: Build frozen native X4.12 for serial single logical CPU run
        run: |
          set -euo pipefail
          mkdir -p build
          g++ -std=c++20 -O3 -Wall -Wextra -Wpedantic -Werror src/drnas_x412.cpp -o build/drnas-x412
      - name: "Train context and net benefit, validate, freeze, open fresh sealed SAT holdout"
        run: |
          set -euo pipefail
          python -u research/drnas_x412.py --binary build/drnas-x412 --out x412_results --per-family 48 --cap 3.0 --repeats 3 | tee x412_benchmark.log
      - name: Constructive UNSAT paired with frozen two-stage model and forced flip
        run: |
          set -euo pipefail
          python -u research/drnas_x412_unsat.py --binary build/drnas-x412 --frozen x412_results/freeze.json --out x412_unsat_results --count 32 --cap 3.0 --repeats 3 | tee x412_unsat.log
      - name: Save full audit manifests frozen weights and independent results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x412-sealed-evidence
          path: |
            x412_results/
            x412_unsat_results/
            x412_benchmark.log
            x412_unsat.log
          if-no-files-found: ignore
          retention-days: 30
