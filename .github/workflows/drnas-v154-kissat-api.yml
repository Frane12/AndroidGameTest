name: DRNAS V15.4 Embedded Kissat API vs CLI on SATLIB G
on:
  push:
    branches: [experiment/drnas-v147-xor4-robust-proof-20261101]
    paths:
      - 'research/drnas-sat-v7-8/kissat_api_bridge.hpp'
      - 'research/drnas-sat-v7-8/kissat_api_control.cpp'
      - 'research/drnas-sat-v7-8/v154_inprocess.cpp'
      - 'research/tseitin-replay/v154_satlib_holdout_g.py'
      - '.github/workflows/drnas-v154-kissat-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Preflight Python
        run: |
          set -euo pipefail
          python3 -m py_compile research/tseitin-replay/v154_satlib_holdout_g.py
      - name: Build pinned Kissat 4.0.4 CLI and static library
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/arminbiere/kissat.git /tmp/kissat-source
          git -C /tmp/kissat-source fetch --depth 1 origin 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          git -C /tmp/kissat-source checkout --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          test "$(git -C /tmp/kissat-source rev-parse HEAD)" = "8af8e56f174b778aef3aa45af9f739b2a5f492c2"
          (cd /tmp/kissat-source && ./configure && make -j2)
          test -s /tmp/kissat-source/build/libkissat.a
          cp /tmp/kissat-source/build/kissat /tmp/kissat_solver
          /tmp/kissat_solver --version
      - name: Compile DRNAS V15.3 and in-process V15.4 with same optimizations
        run: |
          set -euo pipefail
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra research/drnas-sat-v7-8/v153_unified.cpp -o /tmp/v153_unified
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra \
            -I/tmp/kissat-source/src research/drnas-sat-v7-8/kissat_api_control.cpp \
            /tmp/kissat-source/build/libkissat.a -lm -o /tmp/kissat_api_control
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra \
            -I/tmp/kissat-source/src research/drnas-sat-v7-8/v154_inprocess.cpp \
            /tmp/kissat-source/build/libkissat.a -lm -o /tmp/v154_inprocess
          test -x /tmp/v154_inprocess
      - name: Smoke-test SAT and UNSAT native API
        run: |
          set -euo pipefail
          printf 'p cnf 2 2\n1 2 0\n-1 2 0\n' >/tmp/smoke_sat.cnf
          printf 'p cnf 1 2\n1 0\n-1 0\n' >/tmp/smoke_unsat.cnf
          /tmp/kissat_api_control /tmp/smoke_sat.cnf | tee /tmp/api_sat.log
          /tmp/v154_inprocess /tmp/smoke_sat.cnf /tmp/kissat_solver 1 | tee /tmp/drnas_sat.log
          /tmp/kissat_api_control /tmp/smoke_unsat.cnf | tee /tmp/api_unsat.log
          /tmp/v154_inprocess /tmp/smoke_unsat.cnf /tmp/kissat_solver 1 | tee /tmp/drnas_unsat.log
          grep -q 's SATISFIABLE' /tmp/api_sat.log
          grep -q 's SATISFIABLE' /tmp/drnas_sat.log
          grep -q 's UNSATISFIABLE' /tmp/api_unsat.log
          grep -q 'UNSAT' /tmp/drnas_unsat.log
      - name: Checkout pinned, never-used SATLIB subset G
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/mitchellh/go-sat.git /tmp/satlib-repo
          git -C /tmp/satlib-repo fetch --depth 1 origin fc0e735aff48989326f256121b5ed6fc585858c3
          git -C /tmp/satlib-repo checkout --detach fc0e735aff48989326f256121b5ed6fc585858c3
          test "$(git -C /tmp/satlib-repo rev-parse HEAD)" = "fc0e735aff48989326f256121b5ed6fc585858c3"
      - name: Seven-repeat head-to-head on 52 independent SATLIB cases
        run: |
          set -euo pipefail
          python3 research/tseitin-replay/v154_satlib_holdout_g.py
          echo 8af8e56f174b778aef3aa45af9f739b2a5f492c2 > v154-satlib-external-holdout-g/kissat-commit.txt
          echo fc0e735aff48989326f256121b5ed6fc585858c3 > v154-satlib-external-holdout-g/satlib-commit.txt
      - name: Upload benchmark and original-source hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRNAS-V154-API-vs-CLI-SATLIB52
          path: v154-satlib-external-holdout-g/
          if-no-files-found: warn
