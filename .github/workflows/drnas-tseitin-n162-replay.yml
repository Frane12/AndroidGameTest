name: DRNAS replay of SC2024 Tseitin n162 certificate
on:
  push:
    branches: [experiment/drnas-tseitin-n162-replay-20261101]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 41267740944
          github-token: ${{ github.token }}
          name: DRNAS-V145-Native-Propagated-Parity-and-pinned-solvers
          path: bin
      - name: Rebuild and replay the original certificate from the frozen CNF
        run: |
          set -eu
          (cd bin && sha256sum -c binaries.sha256)
          echo '1ef2734fe0bd63b8b0ca817c3e1edf97c042bcbbd4b335440cd18b3cddfbc3ef  bin/v144_native' | sha256sum -c -
          chmod +x bin/v144_native bin/kissat_solver
          python3 research/tseitin-replay/replay_original.py
      - uses: actions/upload-artifact@v4
        with:
          name: n162-independent-replay
          path: |
            replay.json
            certificate.json
          if-no-files-found: error
