name: DRNAS v95 — Check 12 Best Official 2026 Per-Instance Competition Results
on:
  push:
    branches: [experiment/drnas-sat-v96-unseen-official-64-96-128-256-20261031]
    paths: ['.github/workflows/drnas-v95-official-world-context.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-v95-single-vs-dual-checkpoint-96-complete
          run-id: 41236927249
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior95
      - name: Compare pinned 2026 world best official solver per identical formula, mark hardware limits
        shell: bash
        run: |
          set -euo pipefail
          test -f prior95/ablate-v95/v95_ablation.json
          curl -fsSL --retry 3 --max-time 90 \
            https://raw.githubusercontent.com/satcompetition/2026/3e2dee7cf5aa643c77bf946280a3c1c520756ef9/downloads/scores.csv \
            -o official_scores.csv
          test "$(git hash-object official_scores.csv)" = 9c926b2bd35ac0fb4f3d0cf8f58c97178d43faef
          python3 -u research/drnas-sat-v7-8/v95_official_world_context.py
          cat v95_official_fastest_per_case.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-v95-vs-best-published-2026-per-case-NOT-CROSS-HARDWARE-RECORD
          path: |
            v95_official_fastest_per_case.json
            v95_official_fastest_per_case.md
          if-no-files-found: warn
