name: DRNAS V14.4 - Native Mixed XOR Proof Preflight
on:
  push:
    branches: [experiment/drnas-v144-mixedxor-certified-preprocess-20261101]
    paths:
      - '.github/workflows/drnas-sat-v144-preflight.yml'
      - 'research/drnas-sat-v7-8/v144_mixedxor_preprocess.cpp'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V143-Native-local-XOR-and-original-pinned-solvers
          run-id: 41265926817
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: old
      - name: Compile V14.4 and confirm all pinned baseline binary checksums
        run: |
          set -euo pipefail
          (cd old && sha256sum -c binaries.sha256)
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -pedantic \
            research/drnas-sat-v7-8/v144_mixedxor_preprocess.cpp -o v144_native
          chmod +x v144_native old/v143_native old/v142_fastgate old/kissat_solver
          sha256sum v144_native > v144_native.sha256
      - name: Exhaustive truth-table checks, nonXOR fallback and mixed XOR proofs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import itertools,json,subprocess,tempfile,sys
          from pathlib import Path
          sys.path.insert(0,'research/drnas-sat-v7-8')
          import v1311_local_xor as v
          import v134_constructive as enc
          with tempfile.TemporaryDirectory() as d:
              root=Path(d);cnf=root/'case.cnf'
              exe=str(Path('v144_native').resolve())
              kissat=str(Path('old/kissat_solver').resolve())
              def run(raw, classify=False):
                  cnf.write_bytes(raw)
                  args=[exe,str(cnf),kissat,'1442026']
                  if classify:args+=['--classify-only']
                  return subprocess.run(args,capture_output=True,text=True,timeout=14)
              def models(raw):
                  rows=[x[1] for x in v.clauses(cnf) if x[0]=='clause']
                  n=max(abs(z) for row in rows for z in row)
                  return {bits for bits in itertools.product((False,True),repeat=n)
                          if all(any(bits[abs(z)-1]==(z>0) for z in row) for row in rows)}
              equations=[((1,2,3),0),((1,2,4),1),((3,4,5),1)]
              # Derive both XOR(3,4)=1 and forced -5; extra clauses make
              # mixed CNF rather than a pure 3-XOR special case.
              raw=v.synthetic(equations,extras=[(1,-5),(2,4)])
              cnf.write_bytes(raw)
              assert models(raw)
              gate=run(raw,True)
              assert gate.returncode==0 and 'mixed_xor_augmented' in gate.stdout,(gate.stdout,gate.stderr)
              both=run(raw)
              assert both.returncode==10 and 'DRNAS_V144_ROUTE\\tmixed_xor_augmented' in both.stdout,(both.stdout,both.stderr)
              # Add x5 to negate a certified forced literal: UNSAT.
              raw=v.synthetic(equations,extras=[(5,)])
              cnf.write_bytes(raw)
              assert not models(raw)
              output=run(raw)
              assert output.returncode==20 and 'DRNAS_V144_ROUTE\\tmixed_xor_augmented' in output.stdout,(output.stdout,output.stderr)
              # A missing single XOR clause MUST stop the inference.
              raw=v.synthetic(equations,extras=[(1,-5),(2,4)])
              cs=[rec[1] for rec in v.clauses(root/'case.cnf') if rec[0]=='clause']
              raw=enc.dimacs(5,cs[1:])
              gate=run(raw,True)
              assert gate.returncode==0 and 'mixed_xor_augmented' not in gate.stdout,(gate.stdout,gate.stderr)
              # Two obviously non-XOR problems must reach the unchanged
              # Kissat fallback, not an invented algebraic proof.
              for raw,code in ((b'p cnf 2 1\n1 2 0\n',10),
                               (b'p cnf 1 2\n1 0\n-1 0\n',20)):
                  x=run(raw)
                  assert x.returncode==code and 'DRNAS_V142_ROUTE\\tkissat_direct' in x.stdout,(x.stdout,x.stderr)
              # Regression: pure XOR, complete pigeonhole still delegated
              # to V14.3/V14.2 and verified.
              import v761_xor_holdout as xor
              import v140_evaluate as php
              for i in (0,5,18,47):
                  entry,raw=xor.make(i)
                  r=run(raw)
                  assert r.returncode==0 and entry['official_label'] in ('SAT','UNSAT'),(r.stdout,r.stderr)
              for i in (0,4):
                  entry,raw=php.php(i)
                  r=run(raw)
                  assert r.returncode==0 and 'DRNAS_HYBRID_RESULT\\t' in r.stdout,(r.stdout,r.stderr)
          print('V144_NATIVE_MIXED_XOR_PROOFS_SELFTEST_PASS',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-V144-native-mixedxor-verified-and-3-baselines
          path: |
            v144_native
            v144_native.sha256
          if-no-files-found: error
