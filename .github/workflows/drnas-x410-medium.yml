name: DRNAS X4.10 medium passive CDCL learning 2.5s SAT UNSAT
on:
  push:
    branches: [experiment/drnas-x410-network-medium-20261113]
    paths:
      - src/drnas_x410.cpp
      - research/drnas_x410.py
      - research/x410_models.py
      - research/drnas_x410_unsat.py
      - tests/test_x410.py
      - .github/workflows/drnas-x410-medium.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drnas-x410-medium-${{ github.ref }}
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - name: Compile baseline and X4.10; oracle SAT UNSAT and matched-state checks
        run: |
          set -euo pipefail
          python -m compileall -q research/drnas_x410.py research/x410_models.py research/drnas_x410_unsat.py tests/test_x410.py
          mkdir -p build
          g++ -std=c++20 -O3 -Wall -Wextra -Wpedantic -Werror src/drnas_x49.cpp -o build/drnas-x49
          g++ -std=c++20 -O3 -Wall -Wextra -Wpedantic -Werror src/drnas_x410.cpp -o build/drnas-x410
          python -u tests/test_x410.py --cases 100 | tee x410_smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x410-smoke-evidence
          path: x410_smoke.log
          if-no-files-found: ignore
          retention-days: 14
  benchmark:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - name: Build frozen native X4.10
        run: |
          set -euo pipefail
          mkdir -p build
          g++ -std=c++20 -O3 -Wall -Wextra -Wpedantic -Werror src/drnas_x410.cpp -o build/drnas-x410
      - name: Longer 2.5s cap 48 per family: matched training, validation and sealed SAT holdout
        run: |
          set -euo pipefail
          python -u research/drnas_x410.py --binary build/drnas-x410 --out x410_results --per-family 48 --cap 2.5 --repeats 3 | tee x410_benchmark.log
      - name: Larger analytic UNSAT holdout with frozen model, 2.5s cap
        run: |
          set -euo pipefail
          python -u research/drnas_x410_unsat.py --binary build/drnas-x410 --frozen x410_results/freeze.json --out x410_unsat_results --count 32 --cap 2.5 --repeats 3 | tee x410_unsat.log
      - name: Preserve bounded manifest, models, trials and summaries
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x410-medium-evidence
          path: |
            x410_results/
            x410_unsat_results/
            x410_benchmark.log
            x410_unsat.log
          if-no-files-found: ignore
          retention-days: 30
