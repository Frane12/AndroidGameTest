name: DRNAS DECOMP1 - exact incidence articulation source SHA screening
on:
  push:
    branches: [experiment/drnas-decomp1-exact-incidence-screen-20261109]
    paths:
      - .github/workflows/drnas-decomp1-screen.yml
      - research/decomp1_incidence.cpp
      - research/decomp1_screen.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-decomp1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Restore immutable EQUIV2 original SHA registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42607281345 -R Frane12/AndroidGameTest -n equiv2-frozen-source-and-tested-SCC -D .
          test -s mre_x20/manifest.json
      - name: Compile and selftest exact graph separator
        run: |
          set -euo pipefail
          mkdir -p mre_decomp1/bin
          g++ -O2 -std=c++17 -Wall -Wextra -Werror research/decomp1_incidence.cpp -o mre_decomp1/bin/decomp1_incidence
          mre_decomp1/bin/decomp1_incidence selftest | tee mre_decomp1/selftest.log
          grep -q '^DECOMP1_SELFTEST_PASS ' mre_decomp1/selftest.log
          python3 -m py_compile research/decomp1_screen.py
      - name: Analyze all 24 original SHA CNFs without SAT-solving
        run: |
          set -euo pipefail
          python3 -u research/decomp1_screen.py | tee mre_decomp1/screen.log
          grep '^DECOMP1_FINAL ' mre_decomp1/screen.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-DECOMP1-24-SHA-STRUCTURAL-SCREEN
          retention-days: 21
          path: |
            mre_decomp1/audit.json
            mre_decomp1/screen.json
            mre_decomp1/screen.log
            mre_decomp1/selftest.log
