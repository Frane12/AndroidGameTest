name: DRNAS V9.9 prepare official 2026 overall winner
on:
  push:
    branches: [experiment/drnas-sat-v99-official-20261031]
    paths: ['.github/workflows/drnas-v99-official-champion.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Inspect and build official satsuma-iter-kissat
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL https://raw.githubusercontent.com/satcompetition/2026/3e2dee7cf5aa643c77bf946280a3c1c520756ef9/downloads/solvers/anders.tar.xz -o anders.tar.xz
          test "$(git hash-object anders.tar.xz)" = 5ec9be607fbf762329176beb7068d574cd528b5b
          tar -xf anders.tar.xz
          cd anders/satsuma-iter-kissat/src
          echo ====FILES====
          ls -lah
          for f in run.sh original-run.sh build.sh; do
            if test -f "$f"; then echo "====$f===="; cat "$f"; fi
          done
          echo "====BUILD===="
          bash ./build.sh > "$RUNNER_TEMP/champion-build.log" 2>&1 || { tail -80 "$RUNNER_TEMP/champion-build.log"; exit 1; }
          du -sh .
          ls -lah
          tar -czf "$GITHUB_WORKSPACE/satsuma-runtime.tgz" .
      - uses: actions/upload-artifact@v4
        with:
          name: v99-satsuma-iter-kissat
          path: satsuma-runtime.tgz
          if-no-files-found: error
