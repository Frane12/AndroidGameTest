name: DRNAS SAT-UNIFIED2 model construction safety controls
on:
  push:
    branches: [experiment/drnas-sat-unified-xorblind1-20261115]
    paths:
      - src/drnas_sat_construct.hpp
      - src/drnas_x59.cpp
      - research/sat_unified2/**
      - .github/workflows/drnas-sat-unified2-controls.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drnas-sat-unified2-controls
  cancel-in-progress: false
jobs:
  native_integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile both native executables
        run: |
          set -euo pipefail
          mkdir -p build
          g++ -O3 -std=c++20 -DNDEBUG -Wall -Wextra \
            src/drnas_sat_construct.cpp -o build/drnas-sat-construct
          g++ -O3 -std=c++20 -DNDEBUG -Wall -Wextra \
            src/drnas_x59.cpp -o build/drnas-sat-native-x59
          sha256sum src/drnas_sat_construct.hpp build/drnas-sat-construct \
            build/drnas-sat-native-x59
      - name: Test inherited native soundness cases
        run: |
          set -euo pipefail
          python3 -u research/sat_native1/test_native.py
      - name: Test structural categories against independent exhaustive SAT oracle
        run: |
          set -euo pipefail
          python3 -u research/sat_unified2/test_unified.py
