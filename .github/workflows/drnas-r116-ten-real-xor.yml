name: DRNAS R116 ten real structural XOR SATComp26
on:
  push:
    branches: [experiment/drnas-r116-ten-real-xor-20261104]
    paths:
      - 'research/r116_ten_real_xor.py'
      - '.github/workflows/drnas-r116-ten-real-xor.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  structural-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r52-three-pinned-solvers
          run-id: 41684183452
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: built/bin
      - name: Build pinned solvers and DRNAS GF2
        run: |
          set -euo pipefail
          (cd built/bin && sha256sum -c binaries.sha256)
          chmod +x built/bin/kissat_4_0_4 built/bin/cadical_3_0_1
          mkdir -p r116
          g++ -std=c++17 -O3 -DNDEBUG experiments/drnas_v16/r28_exact_gf2.cpp -o r116/r28
          python3 -m py_compile research/r116_ten_real_xor.py
          sha256sum r116/r28 experiments/drnas_v16/r28_exact_gf2.cpp > r116/provenance.sha256
          lscpu > r116/cpu.txt
      - name: Structural selection and paired real SAT tests
        run: |
          set -euo pipefail
          python3 -u research/r116_ten_real_xor.py | tee r116/live.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R116-ten-real-XOR-selection-and-paired-results
          path: r116/
          retention-days: 60
