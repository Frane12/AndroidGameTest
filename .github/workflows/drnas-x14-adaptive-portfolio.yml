name: DRNAS X14 - adaptive cheap gate and CPU-aware two-core 384 paired E2E
on:
  push:
    branches: [experiment/drnas-x14-adaptive-portfolio-20261109]
    paths:
      - '.github/workflows/drnas-x14-adaptive-portfolio.yml'
      - 'research/drnas_x14_adaptive_portfolio.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-x14-32-sha-development-${{ github.ref }}
  cancel-in-progress: false
jobs:
  freeze:
    name: X14 SHA-locked 32 original X11 CNFs and six-arm gate selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore previously SHA-frozen X11 original sources and solver binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p mre_x14 mre_x11 mre_x4/bin built/bin mre5/lib
          gh run download 42563452186 -R Frane12/AndroidGameTest -n x11-32-frozen-original-sha-native-binaries-structural -D .
          test -s mre_x11/manifest.json
          chmod +x mre_x4/bin/native built/bin/kissat_4_0_4
          sha256sum -c mre_x11/binary.sha256
      - name: Check native runtime, static policy, source SHA and freeze feature decisions
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          ldd mre_x4/bin/native | grep libcryptominisat5.so.5.11
          python3 -m py_compile research/drnas_x14_adaptive_portfolio.py
          python3 -u research/drnas_x14_adaptive_portfolio.py selftest | tee mre_x14/selftest.log
          python3 -u research/drnas_x14_adaptive_portfolio.py freeze | tee mre_x14/freeze.log
          python3 -u research/drnas_x14_adaptive_portfolio.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x14-32sha-originals-binaries-gate-frozen
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_x11/*.cnf
            mre_x11/manifest.json
            mre_x11/binary.sha256
            mre_x14/manifest.json
            mre_x14/selftest.log
            mre_x14/freeze.log
            mre_x4/bin/native
            built/bin/kissat_4_0_4
            mre5/lib/libcryptominisat5.so.5.11
  paired:
    needs: freeze
    name: X14 48 original SHA 6-arm 2-seed 15s E2E child CPU shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: x14-32sha-originals-binaries-gate-frozen
          path: .
      - name: Execute randomized paired E2E trials with source and binary SHA audit
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_x4/bin/native built/bin/kissat_4_0_4
          sha256sum -c mre_x11/binary.sha256
          python3 -u research/drnas_x14_adaptive_portfolio.py verify
          python3 -u research/drnas_x14_adaptive_portfolio.py shard --shard ${{ matrix.shard }} | tee mre_x14/shard-${{ matrix.shard }}.log
          grep -q '^X14_SHARD_PASS ${{ matrix.shard }} 48$' mre_x14/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x14-result-${{ matrix.shard }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_x14/shard-${{ matrix.shard }}.json
            mre_x14/shard-${{ matrix.shard }}.log
  audit:
    name: X14 strict 384 E2E original-model UNSAT-crosscheck PAR2 vs CPU audit
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: x14-32sha-originals-binaries-gate-frozen
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: x14-result-*
          path: .
          merge-multiple: true
      - name: Final no-missing-trial and source-seed PAR2 audit
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_x4/bin/native built/bin/kissat_4_0_4
          sha256sum -c mre_x11/binary.sha256
          python3 -u research/drnas_x14_adaptive_portfolio.py verify
          python3 -u research/drnas_x14_adaptive_portfolio.py audit | tee mre_x14/audit.log
          grep -q '^X14_FINAL' mre_x14/audit.log
          grep '^X14_FINAL' mre_x14/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-X14-32SHA-384-E2E-PAR2-CPU-STRICT-AUDIT
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_x14/report.json
            mre_x14/audit.log
            mre_x14/manifest.json
            mre_x14/shard-*.json
