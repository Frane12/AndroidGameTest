name: DRNAS ATLAS25 utility-aware CDCL frozen replay
run-name: ATLAS25 12 frozen SATLIB SHA x 8 arms x 2 reps 12s 1CPU
on:
  push:
    branches: [experiment/drnas-atlas25-c7-selective-20261111]
    paths:
      - research/drnas_atlas25_build.py
      - research/drnas_atlas25_bench.py
      - .github/workflows/drnas-atlas25-selective.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated DRNAS ATLAS25 and pinned Kissat
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_atlas24_build.py research/drnas_atlas25_build.py research/drnas_atlas25_bench.py research/drnas_atlas23_build.py research/drnas_atlas23_recovery.py research/drnas_atlas21_official.py
          python3 research/drnas_atlas13_generator.py
          python3 research/drnas_atlas15_warm_patch.py
          python3 research/drnas_atlas15_cdcl_patch.py
          python3 research/drnas_atlas1_generate.py --out mre_atlas15/atlas1_table.hpp
          python3 research/drnas_atlas9_export_table.py research/atlas8_reduction_table.jsonl mre_atlas15/atlas8_rules.hpp
          python3 research/drnas_atlas16_build.py
          python3 research/drnas_atlas17_build.py
          python3 research/drnas_atlas19_build.py
          python3 research/drnas_atlas23_build.py
          python3 research/drnas_atlas24_build.py
          python3 research/drnas_atlas25_build.py
          mkdir -p mre_atlas21/bin
          g++ -std=c++17 -O2 -I mre_atlas25 -I mre_atlas15 mre_atlas25/native.cpp -o mre_atlas21/bin/drnas_atlas21
          mre_atlas21/bin/drnas_atlas21 --selftest
          git clone -q https://github.com/arminbiere/kissat.git /tmp/atlas25-kissat
          git -C /tmp/atlas25-kissat checkout --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          (cd /tmp/atlas25-kissat && ./configure && make -j2)
          cp /tmp/atlas25-kissat/build/kissat mre_atlas21/bin/kissat
      - uses: actions/upload-artifact@v4
        with:
          name: ATLAS25-BIN
          retention-days: 30
          path: mre_atlas21/bin
  matched:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ATLAS25-BIN
          path: mre_atlas21/bin
      - name: One CPU smoke then paired frozen SHA replay
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cryptominisat
          python3 -m pip install --break-system-packages -q remotezip
          chmod +x mre_atlas21/bin/*
          taskset -c "$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')" python3 -u research/drnas_atlas25_bench.py --smoke | tee smoke.log
          grep '^ATLAS25_FINAL ' smoke.log >> "$GITHUB_STEP_SUMMARY"
          taskset -c "$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')" python3 -u research/drnas_atlas25_bench.py | tee matched.log
          grep '^ATLAS25_FINAL ' matched.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS25-MATCHED-RESULTS
          retention-days: 60
          path: |
            smoke.log
            matched.log
            mre_atlas25/manifest.json
            mre_atlas25/smoke.json
            mre_atlas25/pilot.json
  sql-ledger:
    needs: matched
    uses: ./.github/workflows/drnas-s-series-sql.yml
    with:
      series: S25
      source_artifact: ATLAS25-MATCHED-RESULTS
      source_json_path: mre_atlas25/pilot.json
