name: DRNAS GF2-AB7 - certified 64 short pairs 24 Gauss original SHA E2E
run-name: GF2-AB7 1 source original SHA 7 arms x 3 reps 12s oneCPU E2E PAR2
on:
  push:
    branches: [experiment/drnas-gf2-screen6-cdcl-ab7-20261110]
    paths:
      - research/drnas_gf2_screen6_cdcl_ab7.py
      - .github/workflows/drnas-gf2-screen6-cdcl-ab7.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-gf2-ab7-${{ github.ref }}
  cancel-in-progress: false
jobs:
  freeze:
    name: Build CaDiCaL pinned and independently prove every selected original short GF2 row
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore original frozen SHA repository manifests and reference Kissat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42776296568 -R Frane12/AndroidGameTest -n gf2-s1-frozen-17SHA-exact-binaries -D .
          test -s mre_gf2_s1/manifest.json
          test -s mre_equiv9/manifest.json
          test -s mre_binary_scc2/manifest.json
          test -s mre_equiv10m5/manifest.json
          test -s built/bin/kissat_4_0_4
          chmod +x mre_gf2_s1/bin/gf2_exact mre_x4/bin/native built/bin/kissat_4_0_4 mre_equiv7/bin/cadical_3_0_1
      - name: Pin CaDiCaL 2.1.0 native IPASIR-UP and compile frozen LIVE5 XOR bridge
        run: |
          set -euo pipefail
          git clone -q https://github.com/arminbiere/cadical.git /tmp/gf2-ab7-cadical
          cd /tmp/gf2-ab7-cadical
          git -c advice.detachedHead=false checkout 31f9aae44947c673dc6190c9beb399acb9ffec6a
          test "$(git rev-parse HEAD)" = "31f9aae44947c673dc6190c9beb399acb9ffec6a"
          ./configure
          make -j2
          mkdir -p "$GITHUB_WORKSPACE/mre_gf2cdcl_live5/bin"
          g++ -O2 -std=c++17 -Wall -Wextra -I./src "$GITHUB_WORKSPACE/research/drnas_gf2_cdcl_live5.cpp" ./build/libcadical.a -o "$GITHUB_WORKSPACE/mre_gf2cdcl_live5/bin/gf2cdcl"
          chmod +x "$GITHUB_WORKSPACE/mre_gf2cdcl_live5/bin/gf2cdcl"
      - name: Verify native toy, 635 exact source roots and derived pair/Gauss proofs; freeze protocol
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          mkdir -p mre_gf2_ab7
          python3 -m py_compile research/drnas_gf2_screen6_cdcl_ab7.py
          python3 -u research/drnas_gf2_cdcl_live5.py selftest | tee mre_gf2_ab7/native-selftest.log
          grep -q '^GF2CDCL_LIVE5_SELFTEST_PASS ' mre_gf2_ab7/native-selftest.log
          python3 -u research/drnas_gf2_screen6_cdcl_ab7.py selftest | tee mre_gf2_ab7/selftest.log
          grep -q '^GF2_AB7_SELFTEST_PASS ' mre_gf2_ab7/selftest.log
          python3 -u research/drnas_gf2_screen6_cdcl_ab7.py freeze | tee mre_gf2_ab7/freeze.log
          grep -q '^GF2_AB7_FROZEN ' mre_gf2_ab7/freeze.log
          python3 -u research/drnas_gf2_screen6_cdcl_ab7.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gf2-ab7-frozen-source-358c-pair64-gauss24-native
          if-no-files-found: warn
          retention-days: 21
          path: |
            mre_gf2_ab7/manifest.json
            mre_gf2_ab7/native-selftest.log
            mre_gf2_ab7/selftest.log
            mre_gf2_ab7/freeze.log
            mre_gf2cdcl_live5/bin/gf2cdcl
            mre_gf2_s1/manifest.json
            mre_gf2_s1/bin/gf2_exact
            mre_binary_scc2/manifest.json
            mre_binary_scc1/manifest.json
            mre_equiv10m5/manifest.json
            mre_equiv10medium/manifest.json
            mre_equiv9/manifest.json
            mre_equiv9/cases/*.cnf
            mre_equiv7/manifest.json
            mre_x20/manifest.json
            prior_x22/mre_x22/manifest.json
            prior_equiv6/mre_equiv6/manifest.json
            mre_x4/bin/native
            built/bin/kissat_4_0_4
            mre_equiv7/bin/cadical_3_0_1
            mre5/lib/libcryptominisat5.so.5.11
  paired:
    name: One-CPU original CNF source SHA 358c matched E2E replicate ${{ matrix.shard }}
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0,1,2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: gf2-ab7-frozen-source-358c-pair64-gauss24-native
          path: .
      - name: Verify frozen original and run all seven oneCPU real CaDiCaL/Kissat variants
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_gf2cdcl_live5/bin/gf2cdcl mre_gf2_s1/bin/gf2_exact mre_x4/bin/native built/bin/kissat_4_0_4 mre_equiv7/bin/cadical_3_0_1
          python3 -u research/drnas_gf2_screen6_cdcl_ab7.py verify
          python3 -u research/drnas_gf2_screen6_cdcl_ab7.py shard --shard ${{ matrix.shard }} | tee mre_gf2_ab7/shard-${{ matrix.shard }}.log
          grep -q '^GF2_AB7_SHARD_PASS ' mre_gf2_ab7/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gf2-ab7-shard-${{ matrix.shard }}
          retention-days: 21
          if-no-files-found: warn
          path: |
            mre_gf2_ab7/shard-${{ matrix.shard }}.json
            mre_gf2_ab7/shard-${{ matrix.shard }}.log
  audit:
    name: Audit 21 original SHA exact GF2 proof E2E PAR2, regressions and callback telemetry
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: gf2-ab7-frozen-source-358c-pair64-gauss24-native
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: gf2-ab7-shard-*
          path: mre_gf2_ab7
          merge-multiple: true
      - name: Replay independently every selected original-CNF parity equation and audit paired 21 trials
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_gf2cdcl_live5/bin/gf2cdcl mre_gf2_s1/bin/gf2_exact mre_x4/bin/native built/bin/kissat_4_0_4 mre_equiv7/bin/cadical_3_0_1
          python3 -u research/drnas_gf2_screen6_cdcl_ab7.py verify
          python3 -u research/drnas_gf2_screen6_cdcl_ab7.py audit | tee mre_gf2_ab7/audit.log
          grep -q '^GF2_AB7_FINAL ' mre_gf2_ab7/audit.log
          grep '^GF2_AB7_FINAL ' mre_gf2_ab7/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-GF2-AB7-1SHA-21-ORIGINAL-CNF-ONECPU-E2E-PAR2-FINAL
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_gf2_ab7/report.json
            mre_gf2_ab7/audit.log
            mre_gf2_ab7/manifest.json
            mre_gf2_ab7/shard-*.json
