name: DRNAS C1 — CaDiCaL vs native CDCL causal gap 5 frozen SHA 40 paired
on:
  push:
    branches: [experiment/drnas-cdcl-c1-causal-gap-20261108]
    paths: ['.github/workflows/drnas-c1-cadical-gap.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-c1-cadical-gap-5sha
  cancel-in-progress: false
jobs:
  causal-gap:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore immutable MRE11b frozen sources and native binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42511069503 -R Frane12/AndroidGameTest -n mre11b-SHA8-frozen-2021-23-Mini1m-CMS-Kissat-CaDiCaL -D .
          (cd mre11b_blind && sha256sum -c source.sha256)
          sha256sum -c mre11b_blind/binary.sha256
          chmod +x mre10/bin/native built/bin/kissat_4_0_4
          ln -sf libcryptominisat5.so.5.11 mre5/lib/libcryptominisat5.so
          ln -sf libcryptominisat5.so.5.11 mre5/lib/libcryptominisat5.so.5
      - name: Install same system CaDiCaL and verify C1
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgmp10 cadical
          cadical --version
          python3 -m py_compile research/c1_cadical_gap.py
          export LD_LIBRARY_PATH="$PWD/mre5/lib:${LD_LIBRARY_PATH:-}"
          mkdir -p c1_out
          python3 -u research/c1_cadical_gap.py | tee c1_out/benchmark.log
          grep -q '^C1_FINAL' c1_out/benchmark.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-C1-CADICAL-GAP-5SHA-40PAIRED-35S
          retention-days: 30
          if-no-files-found: warn
          path: |
            c1_out/*.json
            c1_out/benchmark.log
