name: DRNAS V10.1 - Forensic Audit Repair (Original 264 Measurements)
on:
  push:
    branches:
      - experiment/drnas-sat-v101-audit-repair-20261031
    paths:
      - '.github/workflows/drnas-v101-audit-repair.yml'
      - 'research/drnas-sat-v7-8/v101_graded_confidence.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-immutable-v101-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: v101-frozen-protocol-and-inputs
          run-id: 41246747906
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: v101-shard-*
          run-id: 41246747906
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: combined
      - name: Audit unchanged original V10.1 measurement data
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v101_manifest.sha256)
          python3 -m py_compile research/drnas-sat-v7-8/v101_graded_confidence.py
          python3 -u research/drnas-sat-v7-8/v101_graded_confidence.py audit \
            --manifest frozen/v101_manifest.json --combined combined \
            --out v101_report.json --md v101_report.md
          cat v101_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V101-264-Audited-Original-Results
          path: |
            frozen/
            combined/
            v101_report.json
            v101_report.md
          if-no-files-found: warn
