name: DRNAS SAT V7.9 — Prospective Original GBD SHA256 Preflight
on:
  push:
    branches:
      - research/drnas-sat-neuroflow-v7-9-selective
    paths:
      - .github/workflows/drnas-sat-v79-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-sources-before-any-benchmark:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: SHA256, DIMACS and resource-limit check on never-tested GBD originals
        shell: bash
        run: |
          set -euo pipefail
          python -u research/drnas-sat-family-test/preflight.py \
            --manifest research/drnas-sat-v7-9/frozen_gbd_v79_candidates.json \
            --shard ${{ matrix.shard }} --shards 6 \
            --outdir "$GITHUB_WORKSPACE/frozen_preflight"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drnas-v79-GBD-source-preflight-shard${{ matrix.shard }}
          path: frozen_preflight/preflight.json
          if-no-files-found: warn
