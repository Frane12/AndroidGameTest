name: DRNAS fixed AND branching replay 14 solved originals
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-nl-fixed-solved
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 43587320318
          name: delta3-proof-first-preflight
          github-token: ${{ github.token }}
          path: frozen/delta3
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 43593699141
          name: delta4x-proof-first-frozen
          github-token: ${{ github.token }}
          path: frozen/delta4x
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 43396550073
          name: drnas-x52-original100-frozen-source-bytes
          github-token: ${{ github.token }}
          path: frozen/original100
      - name: Restore original bytes and build pinned source
        run: |
          set -euo pipefail
          tar -xzf frozen/delta3/delta3_bench_frozen.tgz
          tar -xzf frozen/delta4x/delta4x_bench_frozen.tgz
          sha256sum -c build/DELTA3_FROZEN.sha256
          sha256sum -c build/DELTA4X_FROZEN.sha256
          mkdir -p medium_sources
          cp frozen/original100/x52_original100/070.cnf medium_sources/070.cnf
          python3 research/drnas_delta4x/build.py
          python3 research/drnas_nl_solved/build.py
          python3 research/drnas_nl_solved/build_fix.py
          g++ --version > nl_fixed_compiler.txt
      - name: Verify the repair and replay original formulas on one CPU
        run: |
          set -euo pipefail
          python3 research/drnas_nl_solved/validate_fix.py
          python3 -u research/drnas_nl_solved/bench_fix.py --reps 10 --out nl_fixed_ci | tee nl_fixed_ci.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nl-fixed-solved-replay-results
          retention-days: 60
          path: |
            nl_fixed_ci/
            nl_fixed_ci.log
            nl_fixed_compiler.txt
            nl_fixed_validation/
            build/NL_FIXED_BUILD.json
