name: DRNAS MATH-GUARD MIXED native 116 and certified original CNFs
on:
  push:
    branches: [experiment/drnas-mathguard-mixed-real1-20261114]
    paths:
      - .github/workflows/drnas-mathguard-mixed-real1.yml
      - src/drnas_x5.cpp
      - src/math_mixed_guard.hpp
      - research/pcmax_capacity/benchmark_native_mixed116.py
      - research/pcmax_capacity/benchmark_mixed_real1.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-mathguard-mixed-real1-20261114
  cancel-in-progress: false
jobs:
  native_certified:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build experimental optional native MATH-MIXED and unchanged CDCL control
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target drnas-pcmax drnas-pcmax-base -j2
      - name: Verify existing source-only Hall regression
        run: |
          python3 research/pcmax_capacity/test_clause_hall.py \
            --binary build/drnas-pcmax --output results/mixed-native-hall-smoke
      - name: Exact frozen-116 native source-paired certificate safety trial
        run: |
          python3 research/pcmax_capacity/benchmark_native_mixed116.py \
            --binary build/drnas-pcmax --out results/mixed-native116
      - name: Preserve every native failure and original-CNF proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-math-mixed-native116
          retention-days: 60
          path: |
            results/mixed-native116/
            results/mixed-native-hall-smoke/
            src/math_mixed_guard.hpp
            src/drnas_x5.cpp
            research/pcmax_capacity/check_mixed_unsat.py
            research/pcmax_capacity/benchmark_native_mixed116.py
            build/drnas-pcmax
            build/drnas-pcmax-base
