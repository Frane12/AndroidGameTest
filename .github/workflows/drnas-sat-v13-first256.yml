name: DRNAS V13 - CaDiCaL first 256 conflict signals versus Kissat outcomes

on:
  push:
    branches: [experiment/drnas-sat-v13-first256-telemetry-20261101]
    paths:
      - '.github/workflows/drnas-sat-v13-first256.yml'
      - 'research/drnas-sat-v7-8/v13_prefix_dynamics.py'
      - 'research/drnas-sat-v7-8/v13_probe_patch.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify research driver self-test
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/v13_prefix_dynamics.py research/drnas-sat-v7-8/v13_probe_patch.py
          python3 research/drnas-sat-v7-8/v13_prefix_dynamics.py selftest
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V103-new-CNF-locked-router-audit
          run-id: 41249978820
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: v103
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V11-Unseen-2026-Holdout-Audit
          run-id: 41250184539
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: v11
      - name: Fail closed on input manifest SHA and 38 known overlaps
        run: |
          set -euo pipefail
          (cd v103/frozen && sha256sum -c v103_manifest.sha256)
          (cd v11/frozen && sha256sum -c v11_manifest.sha256)
          mkdir -p frozen
          python3 -u research/drnas-sat-v7-8/v13_prefix_dynamics.py freeze \
            --v103 v103 --v11 v11 --out frozen/v13_manifest.json
          (cd frozen && sha256sum v13_manifest.json > v13_manifest.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V13-256-frozen-132-cases
          path: frozen/
          if-no-files-found: warn

  build:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V13-256-frozen-132-cases
          path: frozen
      - name: Build strict research-only 256-conflict CaDiCaL probe
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v13_manifest.sha256)
          test "$(git hash-object research/drnas-sat-v7-6/v76_single.cpp)" = a254356a45b70f02f33b9506f1122dad33916ca7
          test "$(git hash-object research/drnas-sat-v7-7/v77_single.cpp)" = 1bbb7fa035e62d5179de9243f672aed9bb9cbaca
          python3 - <<'PY'
          from pathlib import Path
          s=Path('research/drnas-sat-v7-7/v77_single.cpp').read_text()
          marker='\nint main(int argc,char**argv) {'
          assert s.count(marker)==1
          Path('research/drnas-sat-v7-7/v77_embedded_functions.inc').write_text(s.split(marker,1)[0]+'\n')
          PY
          git clone --depth 1 --branch rel-3.0.1 https://github.com/arminbiere/cadical.git cadical-src
          test "$(git -C cadical-src rev-parse HEAD)" = c60730422e758ef1cebe7aeddf2dda31c996bf04
          python3 research/drnas-sat-v7-8/patch_cadical_v90.py cadical-src
          python3 research/drnas-sat-v7-8/v13_probe_patch.py \
            --source research/drnas-sat-v7-8/v101_graded_confidence_probe.cpp \
            --dest research/drnas-sat-v7-8/v13_probe_generated.cpp
          (cd cadical-src && ./configure && make -j2 >/tmp/v13-cadical-build.log 2>&1) \
            || { tail -100 /tmp/v13-cadical-build.log; exit 1; }
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -I cadical-src/src \
            research/drnas-sat-v7-8/v13_probe_generated.cpp \
            cadical-src/build/libcadical.a -o v13_prefix_probe -pthread -ldl -lz
          test -x v13_prefix_probe
          {
            lscpu
            git -C cadical-src rev-parse HEAD
            sha256sum v13_prefix_probe
            sha256sum research/drnas-sat-v7-8/v13_probe_generated.cpp
          } > build_provenance.txt
      - name: Pin exact executable SHA
        run: |
          set -euo pipefail
          sha256sum v13_prefix_probe > v13_prefix_probe.sha256
          sha256sum -c v13_prefix_probe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-V13-one-pinned-probe-binary
          path: |
            v13_prefix_probe
            v13_prefix_probe.sha256
            build_provenance.txt
          if-no-files-found: error

  prefix:
    needs: [freeze,build]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    name: v13-shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V13-256-frozen-132-cases
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V13-one-pinned-probe-binary
          path: probe
      - name: Verify and use byte-identical pinned probe
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v13_manifest.sha256)
          (cd probe && sha256sum -c v13_prefix_probe.sha256)
          chmod +x probe/v13_prefix_probe
          cp probe/build_provenance.txt build_provenance.txt
      - name: One unphased checkpoint per CNF with memory and wall-time guards
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/v13_prefix_dynamics.py run \
            --manifest frozen/v13_manifest.json --shard "$SHARD" \
            --binary ./probe/v13_prefix_probe --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-shard-${{ matrix.shard }}
          path: |
            results/
            build_provenance.txt
          if-no-files-found: warn

  audit:
    needs: [freeze,prefix]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V13-256-frozen-132-cases
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: v13-shard-*
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V103-new-CNF-locked-router-audit
          run-id: 41249978820
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: v103
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V11-Unseen-2026-Holdout-Audit
          run-id: 41250184539
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: v11
      - name: Strict SHA-matched 132-formula telemetry audit and cohort medians
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v13_manifest.sha256)
          python3 -u research/drnas-sat-v7-8/v13_prefix_dynamics.py audit \
            --manifest frozen/v13_manifest.json --v103 v103 --v11 v11 \
            --combined combined --out v13_report.json --md v13_report.md
          cat v13_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V13-CaDiCaL-early256-132-retrospective-audit
          path: |
            frozen/
            combined/
            v13_report.json
            v13_report.md
          if-no-files-found: warn
