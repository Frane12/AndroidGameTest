name: DRNAS SEED3 - 48 new smaller CNFs frozen seed stump 576 one-core E2E
on:
  push:
    branches: [experiment/drnas-seed3-frozen-selector-48fresh-20261109]
    paths:
      - .github/workflows/drnas-seed3-frozen-selector.yml
      - research/drnas_seed3_frozen_selector.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-seed3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  freeze:
    name: Freeze exact SEED2 byte-size model and 48 SHA-disjoint smaller official sources
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Download frozen original binary, prior SEED1 and SEED2 source manifests and X20/X21/EQUIV6/EQUIV7 exclusions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42626639840 -R Frane12/AndroidGameTest -n seed1-original-24SHA-pinned-binaries -D .
          mkdir -p prior_seed1 prior_seed2
          gh run download 42626639840 -R Frane12/AndroidGameTest -n DRNAS-SEED1-24NEW-336-E2E-CPU-PAR2-FINAL -D prior_seed1
          mkdir -p prior_seed1/mre_seed1
          if test -s prior_seed1/manifest.json; then mv prior_seed1/manifest.json prior_seed1/mre_seed1/manifest.json; fi
          test -s prior_seed1/mre_seed1/manifest.json
          gh run download 42631524185 -R Frane12/AndroidGameTest -n seed2-frozen-24SHA-original-native-Kissat-CaDiCaL-model -D prior_seed2
          test -s prior_seed2/mre_seed2/manifest.json
          test -s prior_seed2/mre_seed2/bin/cadical_3_0_1
          mkdir -p mre_seed3/bin mre_seed3/cases
          cp prior_seed2/mre_seed2/bin/cadical_3_0_1 mre_seed3/bin/cadical_3_0_1
          test -s mre_x4/bin/native
          test -s built/bin/kissat_4_0_4
          test -s mre5/lib/libcryptominisat5.so.5.11
          mkdir -p prior_equiv7 mre_equiv7
          gh run download 42618653489 -R Frane12/AndroidGameTest -n equiv7-sourceonly-48SHA-pinned-binaries -D prior_equiv7
          cp prior_equiv7/mre_equiv7/manifest.json mre_equiv7/manifest.json
          mkdir -p prior_equiv5 mre_x20
          gh run download 42612525200 -R Frane12/AndroidGameTest -n equiv5-frozen-originals-binaries-and-source-options -D prior_equiv5
          cp prior_equiv5/mre_x20/manifest.json mre_x20/manifest.json
          mkdir -p prior_x22
          gh run download 42591977333 -R Frane12/AndroidGameTest -n x22-frozen-originals-and-cpp -D prior_x22
          test -s prior_x22/mre_x22/manifest.json
          mkdir -p prior_equiv6
          gh run download 42614287853 -R Frane12/AndroidGameTest -n equiv6-sourceonly-16SHA-pinned-binaries -D prior_equiv6
          test -s prior_equiv6/mre_equiv6/manifest.json
      - name: Selftest frozen SEED2 model unchanged, original SHA policy, pinned binary
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_seed3/bin/cadical_3_0_1 mre_x4/bin/native built/bin/kissat_4_0_4
          python3 -m py_compile research/drnas_seed3_frozen_selector.py
          python3 -u research/drnas_seed3_frozen_selector.py selftest | tee mre_seed3/selftest.log
          grep -q '^SEED3_SELFTEST_PASS ' mre_seed3/selftest.log
      - name: Deterministic new source-only freeze official 2021-23 48 SHA, smaller geometry, no solve
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          python3 -u research/drnas_seed3_frozen_selector.py freeze | tee mre_seed3/freeze.log
          python3 -u research/drnas_seed3_frozen_selector.py verify
          grep -q '^SEED3_FROZEN ' mre_seed3/freeze.log
          test "$(find mre_seed3/cases -maxdepth 1 -name '*.cnf' | wc -l)" -eq 48
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed3-frozen-48SHA-original-model-native-Kissat-CaDiCaL
          retention-days: 21
          if-no-files-found: error
          path: |
            mre_seed3/bin/cadical_3_0_1
            mre_seed3/cases/*.cnf
            mre_seed3/manifest.json
            mre_seed3/selftest.log
            mre_seed3/freeze.log
            mre_seed3/selection-progress.json
            mre_x4/bin/native
            built/bin/kissat_4_0_4
            mre5/lib/libcryptominisat5.so.5.11
  paired:
    name: SEED3 frozen selector vs seed A/B, placebo, Kissat, CaDiCaL 72 E2E shard ${{ matrix.shard }}
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 39
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: seed3-frozen-48SHA-original-model-native-Kissat-CaDiCaL
          path: .
      - name: Exact frozen model, original-CNF SAT witness, single pinned CPU per solver
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_seed3/bin/cadical_3_0_1 mre_x4/bin/native built/bin/kissat_4_0_4
          python3 -u research/drnas_seed3_frozen_selector.py verify
          python3 -u research/drnas_seed3_frozen_selector.py shard --shard ${{ matrix.shard }} | tee mre_seed3/shard-${{ matrix.shard }}.log
          grep -q '^SEED3_SHARD_PASS ${{ matrix.shard }} 72$' mre_seed3/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed3-shard-${{ matrix.shard }}
          retention-days: 21
          path: |
            mre_seed3/shard-${{ matrix.shard }}.json
            mre_seed3/shard-${{ matrix.shard }}.log
  audit:
    name: Strict 576 E2E original SHA, source-paired PAR2, CPU, witnesses, UNSAT consensus
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: seed3-frozen-48SHA-original-model-native-Kissat-CaDiCaL
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: seed3-shard-*
          path: mre_seed3
          merge-multiple: true
      - name: Strict audited PAR2 and independent-references-UNSAT-on-original
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_seed3/bin/cadical_3_0_1 mre_x4/bin/native built/bin/kissat_4_0_4
          python3 -u research/drnas_seed3_frozen_selector.py verify
          python3 -u research/drnas_seed3_frozen_selector.py audit | tee mre_seed3/audit.log
          grep '^SEED3_FINAL ' mre_seed3/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-SEED3-48NEW-576-E2E-PAR2-FINAL
          retention-days: 30
          path: |
            mre_seed3/manifest.json
            mre_seed3/report.json
            mre_seed3/audit.log
            mre_seed3/shard-*.json
