name: DRNAS COMBO1 - certified GF2 first, CMS17 XOR, Kissat4 fallback
run-name: COMBO1 12 source-frozen official SHA x 7 arms x 2 reps 10s 168 single-core E2E
on:
  push:
    branches: [experiment/drnas-combo1-gf2-cms-kissat-20261110]
    paths:
      - .github/workflows/drnas-combo1-proof-first-cms-kissat.yml
      - research/drnas_combo1_proof_first_router.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-combo1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  freeze:
    name: Restore 12 frozen SEARCH5 original CNF SHA, pinned CMS17/Kissat4/Native, certify GF2 toys
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Download immutable originals and pinned baselines (no case reselection)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42759838384 -R Frane12/AndroidGameTest -n equiv13-12-source-only-original-SHA-frozen-six-solvers -D .
          gh run download 42787100363 -R Frane12/AndroidGameTest -n SEARCH5-12-NEW-SAT24-25-SHA-SOURCEONLY-FROZEN-BINARIES -D .
          test -s mre_search5/manifest.json
          test -s mre_equiv9/manifest.json
          test -s mre_equiv12/bin/cryptominisat5
          test -s mre_x4/bin/native
          test -s built/bin/kissat_4_0_4
          test -s mre5/lib/libcryptominisat5.so.5.11
          chmod +x mre_equiv12/bin/cryptominisat5 mre_x4/bin/native built/bin/kissat_4_0_4
      - name: Compile native GF2 2-4 XOR exact solver, check linked CMS and independent algebraic SAT/UNSAT
        run: |
          set -euo pipefail
          mkdir -p mre_gf2_s1/bin mre_combo1
          g++ -std=c++17 -O2 -Wall -Wextra -Werror research/drnas_gf2_proof_first_s1.cpp -o mre_gf2_s1/bin/gf2_exact
          chmod +x mre_gf2_s1/bin/gf2_exact
          export LD_LIBRARY_PATH="$PWD/mre_equiv12/lib:$PWD/mre5/lib"
          ldd mre_equiv12/bin/cryptominisat5 | tee mre_combo1/cms17-ldd.txt
          ! grep -q 'not found' mre_combo1/cms17-ldd.txt
          python3 -m py_compile research/drnas_combo1_proof_first_router.py
          python3 -u research/drnas_combo1_proof_first_router.py selftest | tee mre_combo1/selftest.log
          grep -q '^COMBO1_SELFTEST_PASS ' mre_combo1/selftest.log
          python3 -u research/drnas_combo1_proof_first_router.py freeze | tee mre_combo1/freeze.log
          grep -q '^COMBO1_FROZEN ' mre_combo1/freeze.log
      - uses: actions/upload-artifact@v4
        with:
          name: combo1-source-sha-frozen-CMS17-Kissat4-Native-and-GF2-exact
          retention-days: 21
          if-no-files-found: error
          path: |
            mre_combo1/
            mre_gf2_s1/bin/gf2_exact
            mre_search5/manifest.json
            mre_search5/cases/*.cnf
            mre_equiv9/manifest.json
            mre_equiv9/cases/*.cnf
            mre_equiv10medium/manifest.json
            mre_equiv10m5/manifest.json
            mre_equiv12/manifest.json
            mre_equiv12/bin/cryptominisat5
            mre_equiv12/lib/libcryptominisat5.so*
            mre_equiv7/manifest.json
            mre_x20/manifest.json
            prior_x22/mre_x22/manifest.json
            prior_equiv6/mre_equiv6/manifest.json
            mre_x4/bin/native
            built/bin/kissat_4_0_4
            mre5/lib/libcryptominisat5.so.5.11
  shard:
    name: 12 frozen SHA GF2 certified CMS17 Kissat native placebo E2E shard ${{ matrix.shard }}
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: combo1-source-sha-frozen-CMS17-Kissat4-Native-and-GF2-exact
          path: .
      - name: One logical CPU each; original SHA, SAT witness, algebraic proof only, matched E2E
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre_equiv12/lib:$PWD/mre5/lib"
          chmod +x mre_gf2_s1/bin/gf2_exact mre_x4/bin/native built/bin/kissat_4_0_4 mre_equiv12/bin/cryptominisat5
          python3 -u research/drnas_combo1_proof_first_router.py verify
          python3 -u research/drnas_combo1_proof_first_router.py shard --shard "$SHARD" | tee "mre_combo1/shard-$SHARD.log"
          grep -q "^COMBO1_SHARD_PASS $SHARD 42$" "mre_combo1/shard-$SHARD.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combo1-shard-${{ matrix.shard }}
          retention-days: 21
          if-no-files-found: warn
          path: |
            mre_combo1/shard-${{ matrix.shard }}.json
            mre_combo1/shard-${{ matrix.shard }}.log
  audit:
    name: Strict 168 original SHA paired SAT verified mathematical GF2 proof and PAR2
    needs: [freeze,shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: combo1-source-sha-frozen-CMS17-Kissat4-Native-and-GF2-exact
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: combo1-shard-*
          merge-multiple: true
          path: mre_combo1
      - name: 168 audit no solver reruns; proof and placebo vs unmodified solver
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre_equiv12/lib:$PWD/mre5/lib"
          chmod +x mre_gf2_s1/bin/gf2_exact mre_x4/bin/native built/bin/kissat_4_0_4 mre_equiv12/bin/cryptominisat5
          python3 -u research/drnas_combo1_proof_first_router.py verify
          for i in 0 1 2 3; do test -s "mre_combo1/shard-$i.json"; done
          python3 -u research/drnas_combo1_proof_first_router.py audit | tee mre_combo1/audit.log
          grep -q '^COMBO1_FINAL ' mre_combo1/audit.log
          grep '^COMBO1_FINAL ' mre_combo1/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-COMBO1-168-ONECPU-ORIGINAL-SHA-PAR2-FINAL
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_combo1/manifest.json
            mre_combo1/report.json
            mre_combo1/audit.log
            mre_combo1/shard-*.json
