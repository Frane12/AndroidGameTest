name: DRNAS CF7 gap audit XOR12 MITER13 FRB82 vs Kissat CaDiCaL
on:
  push:
    branches:
      - experiment/drnas-cf7-gap-diagnostic-20261114
    paths:
      - .github/workflows/drnas-cf7-gap.yml
      - research/drnas_cf7_gap_diagnostic.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 43613581688
          name: cf7-source-manifest
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          run-id: 43613581688
          name: cf7-compiled-binaries
          github-token: ${{ github.token }}
          path: .
      - name: Pin one CPU and diagnose original formulas 12 13 82
        run: |
          set -euo pipefail
          tar -xzf cf7_inputs.tgz
          tar -xzf cf7_binaries.tgz
          python3 -m py_compile research/drnas_cf7_gap_diagnostic.py
          CPU="$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')"
          PYTHONHASHSEED=0 taskset -c "$CPU" python3 -u research/drnas_cf7_gap_diagnostic.py | tee cf7_gap.log
          grep -q '^GAP_FINAL ' cf7_gap.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cf7-gap-12-13-82-results
          retention-days: 50
          path: |
            cf7_gap/
            cf7_gap.log
