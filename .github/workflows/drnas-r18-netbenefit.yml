name: DRNAS R18 frozen direct-time benefit with uncertainty 4320 true SAT trials
on:
  push:
    branches: [experiment/drnas-r18-uncertainty-netbenefit-20261102]
    paths:
      - '.github/workflows/drnas-r18-netbenefit.yml'
      - 'experiments/drnas_v16/patch_r18_netbenefit.py'
      - 'experiments/drnas_v16/r18_benchmark.py'
      - 'experiments/drnas_v16/r18_analysis.py'
      - 'experiments/drnas_v16/r18_frozen_protocol.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r18-direct-uncertainty-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    name: Frozen model hash, pinned Kissat, 1024 C/Python mean and uncertainty smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen R15/R17 model sources, R18 coefficients and future seeds
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/{patch_r18_netbenefit,r18_benchmark,r18_analysis,r18_train_direct_gain,patch_r17_risk,r17_risk_benchmark,patch_r16_live_ridge,r16_live_benchmark}.py
          test "$(git hash-object experiments/drnas_v16/r18-frozen-model/netbenefit_model.json)" = d50f608f03c0e2b9c5c86c9a7007480b847169a4
          test "$(git hash-object experiments/drnas_v16/r17-frozen-model/risk_model.json)" = 93ce3a16d28cb90f2ba674e846a2740566414b6e
          test "$(git hash-object experiments/drnas_v16/r15-results/current/frozen_trained_models.json)" = d005747f177008172b49cef5f0b8a6f29c3ffc46
          test "$(git hash-object research/drnas-sat-v7-8/v1531_nohang.cpp)" = d280a2ffa28d72aec183323bbea40544d676112d
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          from tempfile import TemporaryDirectory
          sys.path.insert(0,'experiments/drnas_v16')
          import r18_benchmark as r
          import patch_r18_netbenefit as p
          cfg,m=r.load()
          assert p.models()==m
          assert r.sha(r.MODEL)==cfg['model_sha256']
          prior=r.history()
          assert len(prior)==2414 and len(r.SHARDS)==16 and len(r.MODES)==9
          with TemporaryDirectory() as t:
            cases=r.make_cases('n240_test1',Path(t),prior)
            assert len(cases)==10 and all(x['formula_sha256'] not in prior for x in cases)
          print('R18_MODEL_SOURCES_AND_FRESH_SEEDS_FROZEN_PASS')
          PY
      - name: Compile pinned Kissat with in-process R18 direct uncertainty gating
        run: |
          set -euo pipefail
          git clone -q https://github.com/arminbiere/kissat.git /tmp/kissat-r6-patched
          git -C /tmp/kissat-r6-patched checkout -q --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          test "$(git -C /tmp/kissat-r6-patched rev-parse HEAD)" = 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          python3 experiments/drnas_v16/patch_r18_netbenefit.py --kissat-root /tmp/kissat-r6-patched
          (cd /tmp/kissat-r6-patched && ./configure && make -j2)
          strings /tmp/kissat-r6-patched/build/kissat | grep -Fq R18_DECISION
          strings /tmp/kissat-r6-patched/build/kissat | grep -Fq R16_DECISION
      - name: SAT and UNSAT native correctness in all relevant policies
        run: |
          set -euo pipefail
          printf 'p cnf 2 2\n1 0\n2 0\n' > /tmp/r18-sat.cnf
          printf 'p cnf 1 2\n1 0\n-1 0\n' > /tmp/r18-unsat.cnf
          for mode in r5_monitor r11_2048_50 r16_live50 r17_risk30 r17_risk45 r18_lcb r18_mean; do
            set +e
            DRNAS_R12_DEGREE_CV=.28 DRNAS_R13_N=240 DRNAS_R16_GINI=.16 DRNAS_R16_POLARITY=.22 DRNAS_V177_MODE="$mode" /tmp/kissat-r6-patched/build/kissat -s /tmp/r18-sat.cnf >/tmp/r18-sat.log 2>&1
            sat=$?
            DRNAS_R12_DEGREE_CV=.28 DRNAS_R13_N=240 DRNAS_R16_GINI=.16 DRNAS_R16_POLARITY=.22 DRNAS_V177_MODE="$mode" /tmp/kissat-r6-patched/build/kissat -s /tmp/r18-unsat.cnf >/tmp/r18-unsat.log 2>&1
            unsat=$?
            set -e
            if [ "$sat" -ne 10 ] || [ "$unsat" -ne 20 ]; then
              echo "R18_NATIVE_SAT_UNSAT_ERROR mode=$mode SAT=$sat UNSAT=$unsat"
              cat /tmp/r18-sat.log /tmp/r18-unsat.log
              exit 1
            fi
          done
      - name: C/Python R18 mean and uncertainty native smoke, no replay
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r18_benchmark.py --smoke

  benchmark:
    name: R18 native frozen gain/uncertainty / ${{ matrix.category }}
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        category: [n200_development0, n200_development1, n200_test0, n200_test1,
                   n220_development0, n220_development1, n220_test0, n220_test1,
                   n240_development0, n240_development1, n240_test0, n240_test1,
                   community_n220_development0, community_n220_test0,
                   community_n240_development0, community_n240_test0]
    steps:
      - uses: actions/checkout@v4
      - name: Compile original Kissat at frozen upstream SHA
        run: |
          set -euo pipefail
          git clone -q https://github.com/arminbiere/kissat.git /tmp/kissat-r6-original
          git -C /tmp/kissat-r6-original checkout -q --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          (cd /tmp/kissat-r6-original && ./configure && make -j2)
      - name: Build exact same R18 binary for monitor, forced50, R16/R17/R18
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/drnas_v16/r18-frozen-model/netbenefit_model.json)" = d50f608f03c0e2b9c5c86c9a7007480b847169a4
          git clone -q https://github.com/arminbiere/kissat.git /tmp/kissat-r6-patched
          git -C /tmp/kissat-r6-patched checkout -q --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          python3 experiments/drnas_v16/patch_r18_netbenefit.py --kissat-root /tmp/kissat-r6-patched
          (cd /tmp/kissat-r6-patched && ./configure && make -j2)
      - name: Compile frozen V15.3.1 unchanged source
        run: |
          set -euo pipefail
          test "$(git hash-object research/drnas-sat-v7-8/v1531_nohang.cpp)" = d280a2ffa28d72aec183323bbea40544d676112d
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra research/drnas-sat-v7-8/v1531_nohang.cpp -o /tmp/drnas-r6-v1531
      - name: Execute 270 real SAT attempts and check C/Python scores on each CNF
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r18_benchmark.py --category '${{ matrix.category }}'
          test -s 'drnas-r18-results/${{ matrix.category }}/measurements.csv'
          test -s 'drnas-r18-results/${{ matrix.category }}/traces.jsonl'
          test -s 'drnas-r18-results/${{ matrix.category }}/manifest.json'
      - name: Preserve raw measurement or incomplete failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r18-${{ matrix.category }}
          path: drnas-r18-results/${{ matrix.category }}/
          if-no-files-found: warn
          retention-days: 60

  aggregate:
    name: R18 strict audit 4320 real SAT executions and blind formula-bootstrap
    needs: benchmark
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: r18-*
          path: r18-download
          merge-multiple: false
      - name: Full completeness, paired runner, SHA, correctness and native parity audit
        run: |
          set -euo pipefail
          python3 -m venv .r18venv
          .r18venv/bin/pip -q install matplotlib
          .r18venv/bin/python -u experiments/drnas_v16/r18_analysis.py
          for name in results.json formula_features.csv paired.csv native_decisions.csv netbenefit_model.json; do
            test -s "drnas-r18-results/aggregate/$name"
          done
          test -s drnas-r18-results/aggregate/scatter_gain_random3_test.png
      - name: Preserve verified analysis or failure context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRNAS-R18-Frozen-Direct-Effect-Prospective-Native-Analysis
          path: drnas-r18-results/aggregate/
          if-no-files-found: warn
          retention-days: 90
      - name: Archive results ONLY after successful full audit
        if: success()
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/drnas-r18-uncertainty-netbenefit-20261102"
          mkdir -p experiments/drnas_v16/r18-results/current/
          cp -a drnas-r18-results/aggregate/. experiments/drnas_v16/r18-results/current/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/drnas_v16/r18-results/current/
          if ! git diff --cached --quiet; then
            git commit -m 'data: R18 frozen direct-effect uncertainty real SAT audit [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
