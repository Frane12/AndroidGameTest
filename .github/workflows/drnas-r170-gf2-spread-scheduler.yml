name: DRNAS R170 sustained GF2 Gaussian schedule 1024 vs dense 2048 vs 256 shadow 112 paired
on:
  push:
    branches: [experiment/drnas-r170-gf2-spread-scheduler-20261106]
    paths:
      - 'research/r168_bidirectional_gf2_cdcl.cpp'
      - 'research/r170_spread_benchmark.py'
      - '.github/workflows/drnas-r170-gf2-spread-scheduler.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r170-causal-novel-used-GF2-112
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    name: Compile ONE R170 native GF2/CDCL binary and verify novel-unit used-reason shadow & rollback
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build native CaDiCaL 2.1.0 with certified R170 GF2
        run: |
          set -euo pipefail
          mkdir -p r170
          python3 -m py_compile research/r170_spread_benchmark.py research/r165_component_benchmark.py research/r157_source_certified_xor.py
          git clone -q https://github.com/arminbiere/cadical.git /tmp/r170-cadical
          cd /tmp/r170-cadical
          git checkout -q rel-2.1.0
          git rev-parse HEAD > "$GITHUB_WORKSPACE/r170/cadical-source-commit.txt"
          ./configure
          make -j2
          g++ -std=c++17 -O2 -Wall -Wextra -I./src "$GITHUB_WORKSPACE/research/r168_bidirectional_gf2_cdcl.cpp" ./build/libcadical.a -o "$GITHUB_WORKSPACE/r170/r170-native"
          cd "$GITHUB_WORKSPACE"
          ./r170/r170-native selftest | tee r170/selftest.log
          grep -q '^R99_WATCH_SELFTEST_PASS' r170/selftest.log
          grep -q '^R133C_GF2_CLOSURE_SELFTEST_PASS' r170/selftest.log
          grep -q '^R148_DIRECT_SELFTEST_PASS' r170/selftest.log
          grep -q '^R165_INCREMENTAL_SELFTEST_PASS' r170/selftest.log
          grep -q '^R168_TWO_WAY_SELFTEST_PASS' r170/selftest.log
          grep -q '^R169_CAUSAL_GAUSSIAN_SELFTEST_PASS' r170/selftest.log
          grep -q '^R170_SUSTAINED_GAUSSIAN_SCHEDULE_SELFTEST_PASS' r170/selftest.log
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          b=pathlib.Path("r170/r170-native")
          pin=dict(binary_sha256=hashlib.sha256(b.read_bytes()).hexdigest(),
               source_commit=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
               compiler=subprocess.check_output(["g++","--version"],text=True).splitlines()[0],
               cadical_commit=pathlib.Path("r170/cadical-source-commit.txt").read_text().strip(),
               benchmark_protocol="DRNAS-R170-CAUSAL-GAUSSIAN-UNIT-REASON-ABLAT-20261106-v1")
          pathlib.Path("r170/build-pin.json").write_text(json.dumps(pin,sort_keys=True,indent=2))
          print("R170_BINARY_CAUSAL_SELFTEST_PIN_PASS",json.dumps(pin,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R170-CAUSAL-GF2-NATIVE-BINARY-AND-UNIT-REASON-PROOFS
          path: |
            r170/r170-native
            r170/build-pin.json
            r170/selftest.log
            r170/cadical-source-commit.txt
          if-no-files-found: warn
          retention-days: 90

  benchmark:
    runs-on: ubuntu-24.04
    needs: build
    name: R170 seven-way distributed GF2 sweeps 1024 vs 2048 shadow shard ${{ matrix.shard }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: R170-CAUSAL-GF2-NATIVE-BINARY-AND-UNIT-REASON-PROOFS
          path: r170
      - uses: actions/download-artifact@v4
        with:
          name: r155-original25-pinned-native-and-independent-smoke
          run-id: 42112755104
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r170
      - name: Paired same original SHA, pinned binary, independent GF2 source proof
        run: |
          set -euo pipefail
          chmod +x r170/r170-native
          python3 -u research/r170_spread_benchmark.py shard --shard ${{ matrix.shard }} --binary r170/r170-native | tee r170/shard-${{ matrix.shard }}.log
          grep -q '^R170_SHARD_PASS ' r170/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r170-causal-shard-${{ matrix.shard }}
          path: |
            r170/shard-${{ matrix.shard }}.json
            r170/shard-${{ matrix.shard }}.log
            r170/prep-*.json
            r170/cert-*.json
          if-no-files-found: warn
          retention-days: 90

  audit:
    runs-on: ubuntu-24.04
    needs: benchmark
    timeout-minutes: 15
    name: Audit 112 paired GF2 scheduling and actual CDCL reason clauses vs shadow
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r155-original25-pinned-native-and-independent-smoke
          run-id: 42112755104
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r170
      - uses: actions/download-artifact@v4
        with:
          pattern: r170-causal-shard-*
          merge-multiple: true
          path: r170
      - name: Verify complete source proof, SAT witnesses, paired censored PAR2, zero shadow emission
        run: |
          set -euo pipefail
          test "$(find r170 -maxdepth 1 -name 'shard-*.json' | wc -l)" -eq 4
          python3 -u research/r170_spread_benchmark.py audit | tee r170/audit.log
          grep -q '^R170_FINAL ' r170/audit.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("r170/report.json").read_text())
          assert r["status"]=="RESEARCH_AUDIT_PASS_NOT_BLIND"
          assert r["original_formulas"]==8 and r["attempts"]==112
          assert r["all_SAT_models_rechecked"] and r["source_certificate_replayed"]
          assert r["results"]["all"]["direct_two_way_spread_shadow"]["derived_emitted"]==0
          assert r["results"]["all"]["direct_two_way_shadow"]["actually_consumed_reasons"]==0
          print("R170_STRICT_CAUSAL_SHADOW_PAIRED_AUDIT_PASS")
          PY
          cat r170/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R170-112-CAUSAL-GF2-UNIT-CONSUMED-CDCL-REASONS-PAR2-AUDIT
          path: |
            r170/report.json
            r170/summary.md
            r170/audit.log
          if-no-files-found: warn
          retention-days: 90
