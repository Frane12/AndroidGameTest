name: DRNAS R87 source parity GF2 proof failure forensics - read only
on:
  push:
    branches: [experiment/drnas-r87-proof-forensics-20261104]
    paths:
      - '.github/workflows/drnas-r87-proof-forensics.yml'
      - 'experiments/drnas_v16/r87_proof_forensics.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  forensic:
    name: Inspect all 8 SHA-frozen new original source parity spans vs passive native GF2 rows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: R87-FRESH-SHA-ORIGINAL-COHORT-AND-SOURCE-AUDIT
          run-id: 41774943220
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: R87-PINNED-ORIGINAL-CLEAN-AND-FOUR-SCAN-CADENCES
          run-id: 41774392604
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: .
      - name: Independent original CNF SHA + untouched binary SHA with passive mode
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/r87_proof_forensics.py
          (cd original && sha256sum -c source.sha256)
          (cd compiled && sha256sum -c r87-binaries.sha256)
          chmod +x compiled/native-r87
          python3 -u experiments/drnas_v16/r87_proof_forensics.py \
            --sources original --compiled compiled --out forensic | tee r87-proof.log
          grep -q '^R87_FORENSIC_FINISHED' r87-proof.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R87-UNSEEN-PARITY-SPAN-FORENSIC-ONLY
          path: |
            forensic/
            r87-proof.log
            original/manifest.json
          retention-days: 90
