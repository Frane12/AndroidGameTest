name: DRNAS SAT v16 structure probe
on:
  push:
    branches:
      - 'experiment/drnas-v16-adaptive-general-20261101'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile probe smoke tests
        run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic experiments/drnas_v16/structure_probe_test.cpp -o /tmp/drnas_v16_probe
      - name: Execute probe smoke tests
        run: /tmp/drnas_v16_probe
