name: DRNAS V13.8 - Real SAT Competition 2026 External Benchmarks
on:
  push:
    branches: [experiment/drnas-v138-official2026-real-20261101]
    paths:
      - '.github/workflows/drnas-sat-v138-real2026.yml'
      - 'research/drnas-sat-v7-8/v138_external_2026.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Real-CNF fallback and exact-XOR solver selftest
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/v138_external_2026.py
          python3 research/drnas-sat-v7-8/v138_external_2026.py selftest
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-UnOfficial-SATComp2026-Mini-216-Matched
          run-id: 41248293940
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: original
      - name: Freeze all 18 already-seen genuine 2026 inputs without selecting on outcomes
        run: |
          set -euo pipefail
          test -s original/frozen/official_mini_manifest.json
          mkdir -p frozen
          python3 research/drnas-sat-v7-8/v138_external_2026.py freeze \
            --prior original/frozen/official_mini_manifest.json \
            --fastpath research/drnas-sat-v7-8/v137_fastpath.py \
            --out frozen/v138_manifest.json
          (cd frozen && sha256sum v138_manifest.json > v138_manifest.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V138-frozen-18-real-CNFs
          path: frozen/
          if-no-files-found: warn
  benchmark:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5]
    name: v138-real-shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V138-frozen-18-real-CNFs
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V132-three-pinned-binaries
          run-id: 41256313918
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: bin
      - name: Verify input protocol and pinned binaries
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v138_manifest.sha256)
          (cd bin && sha256sum -c binaries.sha256)
          chmod +x bin/v132_drnas bin/v132_kissat
      - name: Download external 2026 CNFs and run matched three-policy 20-second benchmarks
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/v138_external_2026.py run \
            --manifest frozen/v138_manifest.json \
            --fastpath research/drnas-sat-v7-8/v137_fastpath.py \
            --shard "$SHARD" --drnas bin/v132_drnas \
            --kissat bin/v132_kissat --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v138-real-shard-${{ matrix.shard }}
          path: results/
          if-no-files-found: warn
  audit:
    needs: [freeze,benchmark]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V138-frozen-18-real-CNFs
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: v138-real-shard-*
          path: combined
          merge-multiple: false
      - name: Strict SHA/provenance and PAR2 audit with cohort separation
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v138_manifest.sha256)
          python3 -u research/drnas-sat-v7-8/v138_external_2026.py audit \
            --manifest frozen/v138_manifest.json \
            --combined combined --out v138_report.json --md v138_report.md
          cat v138_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V138-external2026-18-CNF-final-audit
          path: |
            frozen/
            v138_report.json
            v138_report.md
          if-no-files-found: warn
