name: DRNAS GF-CDCL NOVEL2D recovery audit only
run-name: NOVEL2D audit-only recover existing 20 completed original CNF trials (no rerun)
on:
  push:
    branches: [experiment/drnas-gf-cdcl-novel2d-cross-medium-20261110]
    paths:
      - .github/workflows/drnas-gf-cdcl-novel2d-audit-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    name: Check SHA frozen originals and rebuild report strictly from completed two shards
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Restore same immutable pinned 40 and MIXAB3 originals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42814965607 -R Frane12/AndroidGameTest -n xorabc3-frozen40-CaDiCaL210-live-Kissat-CMS -D .
          mkdir -p /tmp/novel2d-mix3
          gh run download 42811023064 -R Frane12/AndroidGameTest -n mixab3-fresh12-CMS17-Kissat4-GF2 -D /tmp/novel2d-mix3
          cp -a /tmp/novel2d-mix3/mre_mixab3 mre_mixab3
          chmod +x mre_xorabc3/bin/xorabc3_rows mre_xorabc3/bin/xorabc3_trail mre_xorabc2/bin/xorabc2_native
          chmod +x built/bin/kissat_4_0_4 mre_equiv12/bin/cryptominisat5 mre_x4/bin/native
      - name: Restore frozen compiled binary plus both SHA paired shard records from prior run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p mre_gf_cdcl_novel2d
          gh run download 42827184856 -R Frane12/AndroidGameTest -n novel2d-frozen-two-SHA-CaDiCaL210-CMS17-sourceonly -D mre_gf_cdcl_novel2d
          gh run download 42827184856 -R Frane12/AndroidGameTest -n novel2d-shard-0 -D mre_gf_cdcl_novel2d
          gh run download 42827184856 -R Frane12/AndroidGameTest -n novel2d-shard-1 -D mre_gf_cdcl_novel2d
          test -s mre_gf_cdcl_novel2d/manifest.json
          test -s mre_gf_cdcl_novel2d/shard-0.json
          test -s mre_gf_cdcl_novel2d/shard-1.json
          test -s mre_gf_cdcl_novel2d/bin/gf_cdcl_novel2d
      - name: Reproduce strict E2E SAT-only PAR2 without re-running 20 timed trials
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre_equiv12/lib:$PWD/mre5/lib"
          chmod +x mre_gf_cdcl_novel2d/bin/gf_cdcl_novel2d
          python3 -u research/drnas_gf_cdcl_novel2d_medium.py verify
          python3 -u research/drnas_gf_cdcl_novel2d_medium.py audit | tee mre_gf_cdcl_novel2d/audit.log
          grep -q '^NOVEL2D_FINAL ' mre_gf_cdcl_novel2d/audit.log
          grep '^NOVEL2D_FINAL ' mre_gf_cdcl_novel2d/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-GF-CDCL-NOVEL2D-20-TRIALS-RECOVERED-STRICT-AUDIT
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_gf_cdcl_novel2d/report.json
            mre_gf_cdcl_novel2d/audit.log
            mre_gf_cdcl_novel2d/shard-*.json
            mre_gf_cdcl_novel2d/manifest.json
