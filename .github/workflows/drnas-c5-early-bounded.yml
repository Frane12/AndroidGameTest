name: DRNAS C5 — early CDCL 100-1000-5000 conflict dynamics 6 SHA 3 arms
on:
  push:
    branches: [experiment/drnas-cdcl-c5-early-bounded-telemetry-20261108]
    paths: ['.github/workflows/drnas-c5-early-bounded.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-c5-early-cdcl-six-original-sha
  cancel-in-progress: false
jobs:
  prepare:
    name: Source and CMS pin, bounded CDCL counters and same-seed prior C4 audit
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore EXACT frozen C4 binaries and source SHA without recompilation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42519684428 -R Frane12/AndroidGameTest -n c4-frozen-four-original-SHA-reference-binaries-source-parity -D .
          (cd mre11_easy && sha256sum -c source.sha256)
          (cd mre11b_blind && sha256sum -c source.sha256)
          chmod +x c2/bin/native c4/bin/native c2/bin/emit c4/bin/emit mre10/bin/native
          sha256sum -c c4_out/binary.sha256
          ln -sf libcryptominisat5.so.5.11 mre5/lib/libcryptominisat5.so
          ln -sf libcryptominisat5.so.5.11 mre5/lib/libcryptominisat5.so.5
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          ldd c4/bin/native | grep -q 'libcryptominisat5.so.5.11'
          ldd c2/bin/native | grep -q 'libcryptominisat5.so.5.11'
      - name: Restore existing C4 full solve SHA/seed/mode outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p c5_prior_c4
          gh run download 42519684428 -R Frane12/AndroidGameTest -n DRNAS-C4-ORIGINAL-4SHA-36-PAIRED-DUPLICATE-ORDER-CAUSAL-AUDIT -D c5_prior_c4
          test "$(find c5_prior_c4 -name 'shard-*.json' | wc -l)" -eq 4
      - name: Validate original SHA and bounded-100 conflict smoke (not a full solve)
        run: |
          set -euo pipefail
          mkdir -p c5_out
          python3 -m py_compile research/c5_early_cdcl_bounded.py
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          python3 -u research/c5_early_cdcl_bounded.py verify | tee c5_out/verify.log
          python3 -u research/c5_early_cdcl_bounded.py smoke | tee c5_out/smoke.log
          grep -q '^C5_BOUNDED_100_CONFLICT_SMOKE_PASS' c5_out/smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c5-exact-C2-C4-binaries-six-original-SHA-plus-prior-C4
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6
          path: |
            mre11_easy/manifest.json
            mre11_easy/source.sha256
            mre11_easy/*.cnf
            mre11b_blind/manifest.json
            mre11b_blind/source.sha256
            mre11b_blind/*.cnf
            mre5/lib/libcryptominisat5.so.5.11
            c2/bin/native
            c4/bin/native
            c2/bin/emit
            c4/bin/emit
            mre10/bin/native
            c4_out/binary.sha256
            c4_out/source-invariants.json
            c5_out/verify.log
            c5_out/smoke.log
            c5_prior_c4/
  bounded:
    name: C5 original SHA shard ${{ matrix.shard }} at 100-1000-5000 conflicts
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: c5-exact-C2-C4-binaries-six-original-SHA-plus-prior-C4
          path: .
      - name: Verify exact frozen sources and binaries
        run: |
          set -euo pipefail
          chmod +x c2/bin/native c4/bin/native c2/bin/emit c4/bin/emit mre10/bin/native
          sha256sum -c c4_out/binary.sha256
          (cd mre11_easy && sha256sum -c source.sha256)
          (cd mre11b_blind && sha256sum -c source.sha256)
          ln -sf libcryptominisat5.so.5.11 mre5/lib/libcryptominisat5.so
          ln -sf libcryptominisat5.so.5.11 mre5/lib/libcryptominisat5.so.5
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          ldd c2/bin/native | grep -q 'libcryptominisat5.so.5.11'
          python3 -m py_compile research/c5_early_cdcl_bounded.py
          python3 -u research/c5_early_cdcl_bounded.py verify
      - name: Run 27 bounded CDCL probes per frozen source
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          mkdir -p c5_out
          python3 -u research/c5_early_cdcl_bounded.py shard --shard ${{ matrix.shard }} | tee c5_out/shard-${{ matrix.shard }}.log
          grep -q '^C5_SHARD_PASS ${{ matrix.shard }} 27$' c5_out/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c5-early-cdcl-source-shard-${{ matrix.shard }}
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6
          path: |
            c5_out/shard-${{ matrix.shard }}.json
            c5_out/shard-${{ matrix.shard }}.log
  audit:
    name: C5 FINAL 162 bounded probes linked to frozen full C4 paired outcomes
    needs: bounded
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: c5-exact-C2-C4-binaries-six-original-SHA-plus-prior-C4
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: c5-early-cdcl-source-shard-*
          merge-multiple: true
          path: c5_out
      - name: Reconstruct 6 SHA x 3 arm x 3 seed x 3 budget and compare C4 outcomes
        run: |
          set -euo pipefail
          (cd mre11_easy && sha256sum -c source.sha256)
          (cd mre11b_blind && sha256sum -c source.sha256)
          python3 -u research/c5_early_cdcl_bounded.py audit | tee c5_out/audit.log
          grep -q '^C5_FINAL' c5_out/audit.log
          grep '^C5_FINAL' c5_out/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-C5-6SHA-162-BOUNDED-CDCL-DYNAMICS-PAIRED-AUDIT
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6
          path: |
            c5_out/report.json
            c5_out/audit.log
            c5_out/shard-*.json
