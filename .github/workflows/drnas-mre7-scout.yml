name: DRNAS MRE7 scout — source-disjoint official 2026 easy candidate count
on:
  push:
    branches: [experiment/drnas-mre7-prospective-easy-gate-20261108]
    paths: ['.github/workflows/drnas-mre7-scout.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover earlier frozen MRE6b IDs before new source selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p mre6b_blind mre7
          gh run download 42495094599 --repo Frane12/AndroidGameTest -n mre6b-blind-original-official-SAT2026 -D mre6b_blind
          python3 -m py_compile research/mre7_easy_cohort.py
          python3 -u research/mre7_easy_cohort.py scout | tee mre7/scout.log
          grep -q '^MRE7_SCOUT_FINAL' mre7/scout.log
          cat mre7/scout.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-MRE7-UNSEEN-EASY-2026-METADATA-SCOUT
          retention-days: 15
          path: |
            mre7/scout.json
            mre7/scout.log
