name: DRNAS R48 certified clause dose-response causal test (two real SATComp26 CNFs)
on:
  push:
    branches: [experiment/drnas-r48-clause-causal-dose-20261103]
    paths:
      - '.github/workflows/drnas-r48-clause-dose.yml'
      - 'experiments/drnas_v16/r48_causal_clause_dose.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r48-dose-response-v1
  cancel-in-progress: true
jobs:
  freeze:
    name: Verify proof extractor, pin two source CNFs and 40 original-derived clauses
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Selftest new DIMACS rewrite with percent terminator
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/r48_causal_clause_dose.py
          python3 -m py_compile experiments/drnas_v16/r47_partial_links.py
          python3 experiments/drnas_v16/r48_causal_clause_dose.py selftest
      - uses: actions/download-artifact@v4
        with:
          name: r47-frozen-source
          run-id: 41669951007
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: r47-pinned-binary
          run-id: 41669951007
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: compiled
      - name: Verify original CNF and pinned clean Kissat SHA and freeze exact derived clauses
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c source.sha256)
          chmod +x compiled/clean compiled/native
          (cd compiled && sha256sum -c binaries.sha256)
          python3 -u experiments/drnas_v16/r48_causal_clause_dose.py freeze \
            --frozen frozen --output r48-precommitted-clauses.json
          test -s r48-precommitted-clauses.json
      - uses: actions/upload-artifact@v4
        with:
          name: r48-original-two-sources
          path: frozen/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: r48-kissat-pinned
          path: compiled/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: r48-precommitted-clauses
          path: r48-precommitted-clauses.json
          if-no-files-found: error
          retention-days: 30
  paired:
    needs: freeze
    name: r48-${{ matrix.target }}-${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: [benefit, regress]
        rep: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r48-original-two-sources
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: r48-kissat-pinned
          path: compiled
      - uses: actions/download-artifact@v4
        with:
          name: r48-precommitted-clauses
          path: design
      - name: Measure all doses on identical SHA-pinned source and clean Kissat
        env:
          TARGET: ${{ matrix.target }}
          REP: ${{ matrix.rep }}
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c source.sha256)
          chmod +x compiled/clean compiled/native
          (cd compiled && sha256sum -c binaries.sha256)
          python3 -u experiments/drnas_v16/r48_causal_clause_dose.py measure \
            --frozen frozen --design design/r48-precommitted-clauses.json \
            --clean compiled/clean --target "$TARGET" --rep "$REP" \
            --out results | tee r48-live.log
          test -s results/rows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r48-${{ matrix.target }}-${{ matrix.rep }}
          path: |
            results/
            r48-live.log
          if-no-files-found: warn
          retention-days: 30
  audit:
    needs: [freeze, paired]
    if: always()
    name: Audit dose response, SAT verdicts and original-source SHA consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r48-precommitted-clauses
          path: design
      - uses: actions/download-artifact@v4
        with:
          pattern: r48-*
          path: all-results
      - name: Aggregate paired results, no retrospective selection
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r48_causal_clause_dose.py aggregate \
            --design design/r48-precommitted-clauses.json \
            --combined all-results \
            --output r48-final.json --report r48-final.md
          cat r48-final.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R48-CAUSAL-DOSE-RESEARCH-FINAL
          path: |
            r48-final.md
            r48-final.json
            design/r48-precommitted-clauses.json
          if-no-files-found: warn
          retention-days: 30
