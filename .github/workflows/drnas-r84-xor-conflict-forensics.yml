name: DRNAS R84 real XOR CDCL 4-formula conflict-reason forensics
on:
  push:
    branches: [experiment/drnas-r84-xor-conflict-forensics-20261104]
    paths:
      - '.github/workflows/drnas-r84-xor-conflict-forensics.yml'
      - 'experiments/drnas_v16/patch_r84_xor_conflict_forensics.py'
      - 'experiments/drnas_v16/r84_xor_cdcl_forensics.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r84-four-real-xor-mechanism-20261104
  cancel-in-progress: true

jobs:
  preflight:
    name: R84 compile pinned upstream native XOR-CDCL probe and soundness audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python preflight original-source XOR proof and telemetry protocol
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/patch_r84_xor_conflict_forensics.py experiments/drnas_v16/r84_xor_cdcl_forensics.py
          python3 -u experiments/drnas_v16/patch_r84_xor_conflict_forensics.py --selftest
          python3 -u experiments/drnas_v16/r84_xor_cdcl_forensics.py selftest
      - uses: actions/download-artifact@v4
        with:
          name: r82-frozen-originals-and-prospective-selection
          run-id: 41756938173
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: .
      - name: Verify all 48 original competition CNF SHA values and restrict four mixed-XOR diagnostics
        run: |
          set -euo pipefail
          (cd world && sha256sum -c source.sha256)
          python3 - <<'PY'
          import sys
          sys.path.insert(0,"experiments/drnas_v16")
          import r84_xor_cdcl_forensics as r84
          m,cases=r84.cohort("world")
          print("R84_FROZEN_FOUR_MIXED_XOR_REAL_SOURCES_PASS",[c["gbd"] for c in cases])
          PY
      - uses: actions/download-artifact@v4
        with:
          name: r32u-same-pinned-clean-native-reasons
          run-id: 41683024261
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: compiled
      - name: Verify exact original pinned upstream Kissat clean SHA
        run: |
          set -euo pipefail
          (cd compiled && sha256sum -c baselines.sha256)
          chmod +x compiled/clean compiled/native
      - name: Build R84 read-only conflict telemetry on original native R32u XOR reasons
        run: |
          set -euo pipefail
          git clone -q https://github.com/arminbiere/kissat.git /tmp/r84-kissat
          git -C /tmp/r84-kissat checkout -q --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          test "$(git -C /tmp/r84-kissat rev-parse HEAD)" = "8af8e56f174b778aef3aa45af9f739b2a5f492c2"
          python3 -u experiments/drnas_v16/patch_r32b_native_shadow.py --kissat-root /tmp/r84-kissat
          python3 -u experiments/drnas_v16/patch_r32n_leave_one_out.py --kissat-root /tmp/r84-kissat
          python3 -u experiments/drnas_v16/patch_r32s_native_cdcl_progress.py --kissat-root /tmp/r84-kissat
          python3 -u experiments/drnas_v16/patch_r32u_live_xor_reasons.py --kissat-root /tmp/r84-kissat
          python3 -u experiments/drnas_v16/patch_r84_xor_conflict_forensics.py --kissat-root /tmp/r84-kissat
          (cd /tmp/r84-kissat && ./configure && make -j2 > /tmp/r84-build.log 2>&1) || { tail -100 /tmp/r84-build.log; exit 1; }
          cp /tmp/r84-kissat/build/kissat compiled/native-r84
          chmod +x compiled/clean compiled/native-r84
          (cd compiled && sha256sum clean native-r84 > r84-binaries.sha256 && sha256sum -c r84-binaries.sha256)
          test "$(compiled/clean --version)" = "$(compiled/native-r84 --version)"
          echo R84_PINNED_NATIVE_REASON_FORENSICS_BUILD_PASS
      - name: Revalidate 60 native SAT and UNSAT source soundness tests with injected telemetry
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r32u_random_original_model_test.py \
            --clean compiled/clean --native compiled/native-r84 --out generated | tee r84-60soundness.log
          grep -q '^R32U_60_GENERATED_MIXED_SAT_UNSAT_VERDICT_PASS' r84-60soundness.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: r84-sha-pinned-native-binary
          path: |
            compiled/clean
            compiled/native-r84
            compiled/r84-binaries.sha256
            r84-60soundness.log
          if-no-files-found: error
          retention-days: 90

  experiments:
    name: r84-shard-${{ matrix.shard }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r82-frozen-originals-and-prospective-selection
          run-id: 41756938173
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: r84-sha-pinned-native-binary
          path: compiled
      - name: Exact SHA original source and binary validation
        run: |
          set -euo pipefail
          (cd world && sha256sum -c source.sha256)
          (cd compiled && sha256sum -c r84-binaries.sha256)
          chmod +x compiled/clean compiled/native-r84
      - name: Four-mode paired CPU-pinned original real XOR-CNF, 45-second cap each
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r84_xor_cdcl_forensics.py measure \
            --sources world --bins compiled --out results --shard "$SHARD" | tee r84-live.log
          grep -q '^R84_SHARD_PASS' r84-live.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r84-shard-${{ matrix.shard }}
          path: |
            results/
            r84-live.log
          if-no-files-found: warn
          retention-days: 90

  audit:
    name: R84 32-trial source-certified causal XOR telemetry final audit
    if: always()
    needs: [preflight,experiments]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r82-frozen-originals-and-prospective-selection
          run-id: 41756938173
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: r84-shard-*
          path: combined
      - name: Verify SHA/pairing/independent original parity proofs and report actual conflict dynamics
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r84_xor_cdcl_forensics.py audit \
            --sources world --combined combined --out final | tee r84-audit.log
          cat final/r84-final.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DRNAS-R84-NATIVE-XOR-CDCL-CONFLICT-FORENSICS-FINAL
          path: |
            final/
            world/manifest.json
            r84-audit.log
          if-no-files-found: error
          retention-days: 90
