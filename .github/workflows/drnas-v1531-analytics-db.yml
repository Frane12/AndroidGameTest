name: DRNAS V15.3.1 SQLite analytics and scatter plots
on:
  push:
    branches:
      - experiment/drnas-v1531-analytics-sqlite-20261101
    paths:
      - 'research/tseitin-replay/v1531_analytics_db.py'
      - 'research/tseitin-replay/v1531_ingest_r5.py'
      - 'research/tseitin-replay/v1531_ingest_new.py'
      - 'research/tseitin-replay/v1531_ingest_r7_crossfamily.py'
      - 'research/tseitin-replay/v1531_ingest_r8_r9.py'
      - 'research/tseitin-replay/v1531_ingest_post_r9.py'
      - 'research/tseitin-replay/v1531_ingest_r12_r15.py'
      - 'research/tseitin-replay/v1531_ingest_r16.py'
      - 'research/tseitin-replay/v1531_ingest_r17.py'
      - 'research/tseitin-replay/README_V1531_ANALYTICS.md'
      - '.github/workflows/drnas-v1531-analytics-db.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install read-only analysis dependencies
        run: |
          set -euo pipefail
          python3 -m venv .analytics-venv
          .analytics-venv/bin/pip install matplotlib
          .analytics-venv/bin/python -m py_compile \
            research/tseitin-replay/v1531_analytics_db.py \
            research/tseitin-replay/v1531_ingest_r5.py \
            research/tseitin-replay/v1531_ingest_new.py \
            research/tseitin-replay/v1531_ingest_r7_crossfamily.py \
            research/tseitin-replay/v1531_ingest_r8_r9.py \
            research/tseitin-replay/v1531_ingest_post_r9.py \
            research/tseitin-replay/v1531_ingest_r12_r15.py \
            research/tseitin-replay/v1531_ingest_r16.py \
            research/tseitin-replay/v1531_ingest_r17.py

      - name: Restore cumulative database without discarding historical sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p sat-analysis
          if test -s research/sat-analytics-data/current/sat_analytics.sqlite; then
            cp research/sat-analytics-data/current/* sat-analysis/
            .analytics-venv/bin/python - <<'PY'
          import sqlite3
          db=sqlite3.connect('sat-analysis/sat_analytics.sqlite')
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert db.execute('SELECT COUNT(*) FROM datasets').fetchone()[0]>=5
          db.close()
          PY
          else
            mkdir -p raw-artifacts
            gh run download 41278912894 --repo "$GITHUB_REPOSITORY" --dir raw-artifacts
            gh run download 41334526696 --repo "$GITHUB_REPOSITORY" --pattern 'r5_shard_*' --dir raw-artifacts
            .analytics-venv/bin/python research/tseitin-replay/v1531_analytics_db.py \
              --input raw-artifacts --out sat-analysis --source-run 41278912894 \
              --source-sha 188600aba8c530a4c20005ee0737fa92735403d3 \
              --runner github-hosted-ubuntu-24.04
            .analytics-venv/bin/python research/tseitin-replay/v1531_ingest_r5.py \
              --input raw-artifacts --out sat-analysis
          fi

      - name: Detect already ingested immutable post-R9 sources
        id: detect
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sqlite3
          db=sqlite3.connect('sat-analysis/sat_analytics.sqlite')
          old=db.execute("SELECT COUNT(*) FROM datasets").fetchone()[0]
          post=db.execute("SELECT COUNT(*) FROM datasets WHERE dataset LIKE 'DRNAS-R10-%' OR dataset LIKE 'DRNAS-Selector-%' OR dataset LIKE 'DRNAS-SC2023-%'").fetchone()[0]
          assert (old==57 and post==0) or (old in (79,135,151,167) and post==22),(old,post)
          print('post_r9_present='+('true' if post==22 else 'false'))
          db.close()
          PY

      - name: Retrieve only pinned completed benchmark and verification artifacts
        if: steps.detect.outputs.post_r9_present != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 41340619884 --repo "$GITHUB_REPOSITORY" \
            --name DRNAS-V1531-External-Short40-Analysis --dir source-short
          gh run download 41341529210 --repo "$GITHUB_REPOSITORY" \
            --name DRNAS-V1531-External-Medium40-Analysis --dir source-medium
          gh run download 41343735998 --repo "$GITHUB_REPOSITORY" \
            --name DRNAS-UUF250-Structural-Validation-Analysis --dir source-uuf
          gh run download 41343506152 --repo "$GITHUB_REPOSITORY" \
            --name DRNAS-R6-Four-Strategy-Analysis --dir source-r6
          gh run download 41344096160 --repo "$GITHUB_REPOSITORY" \
            --name DRNAS-Dubois-Exact-GF2-Certificates --dir source-cert
          test -s source-short/sat-analysis/sat_analytics.sqlite
          test -s source-short/DRNAS-V1531-External-Short40/results.json
          test -s source-medium/sat-analysis/sat_analytics.sqlite
          test -s source-medium/medium40/results.json
          test -s source-uuf/validation-warehouse/sat_analytics.sqlite
          test -s source-uuf/uuf250-structural-validation/results.json
          test -s source-r6/measurements.csv
          test -s source-r6/traces.jsonl
          test -s source-cert/affine_summary.csv

      - name: Append validated new sources and recompute paired analytics
        if: steps.detect.outputs.post_r9_present != 'true'
        run: |
          set -euo pipefail
          .analytics-venv/bin/python research/tseitin-replay/v1531_ingest_new.py \
            --db sat-analysis/sat_analytics.sqlite --out sat-analysis \
            --short-db source-short/sat-analysis/sat_analytics.sqlite \
            --short-json source-short/DRNAS-V1531-External-Short40/results.json \
            --medium-db source-medium/sat-analysis/sat_analytics.sqlite \
            --medium-json source-medium/medium40/results.json \
            --uuf-db source-uuf/validation-warehouse/sat_analytics.sqlite \
            --uuf-json source-uuf/uuf250-structural-validation/results.json \
            --r6-csv source-r6/measurements.csv \
            --r6-json source-r6/results.json \
            --r6-traces source-r6/traces.jsonl \
            --cert-csv source-cert/affine_summary.csv \
            --cert-json source-cert/affine_certificates.json
          test -s sat-analysis/sat_analytics.sqlite
          test -s sat-analysis/ingest_audit.json
          test -s sat-analysis/paired.csv
          test -s sat-analysis/r6_paired.csv
          test -s sat-analysis/scatter_r6_monitor_vs_forced_restart25.png
          test -s sat-analysis/verified_certificates.csv

      - name: Retrieve only completed pinned R7 and preregistered cross-family artifacts
        if: steps.detect.outputs.post_r9_present != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p new-input/{jerk,wide,large,prop,target,crossfamily}
          gh run download 41346987963 --repo "$GITHUB_REPOSITORY" \
            --name DRNAS-Jerk-R7-Real-Standard-Benchmark --dir new-input/jerk
          for cat in random3 graphcolor xor external_satlib; do
            mkdir -p "new-input/jerk/$cat"
            gh run download 41346987963 --repo "$GITHUB_REPOSITORY" \
              --name "jerk-r7-$cat" --dir "new-input/jerk/$cat"
            test -s "new-input/jerk/$cat/measurements.csv"
            test -s "new-input/jerk/$cat/traces.jsonl"
            test -s "new-input/jerk/$cat/manifest.json"
          done
          gh run download 41345671202 --repo "$GITHUB_REPOSITORY" \
            --name DRNAS-R7-Wide-Analysis --dir new-input/wide
          gh run download 41346915939 --repo "$GITHUB_REPOSITORY" \
            --name DRNAS-R7-Large-Analysis --dir new-input/large
          gh run download 41345148256 --repo "$GITHUB_REPOSITORY" \
            --name DRNAS-R7-Propagation-Gate-Analysis --dir new-input/prop
          gh run download 41345312821 --repo "$GITHUB_REPOSITORY" \
            --name DRNAS-R7-Targeted-Analysis --dir new-input/target
          gh run download 41345835957 --repo "$GITHUB_REPOSITORY" \
            --name DRNAS-V1531-Structural-CrossFamily-Validation --dir new-input/crossfamily
          test -s new-input/jerk/jerk_standard_report.json
          for kind in wide large prop target; do
            test -s "new-input/$kind/measurements.csv"
            test -s "new-input/$kind/traces.jsonl"
            test -s "new-input/$kind/results.json"
          done
          test -s new-input/crossfamily/crossfamily-warehouse/sat_analytics.sqlite
          test -s new-input/crossfamily/crossfamily-validation/aggregate.json

      - name: Append only source-verified R7 and cross-family rows, preserve historical SQLite
        if: steps.detect.outputs.post_r9_present != 'true'
        run: |
          set -euo pipefail
          .analytics-venv/bin/python research/tseitin-replay/v1531_ingest_r7_crossfamily.py \
            --db sat-analysis/sat_analytics.sqlite --out sat-analysis --input new-input
          test -s sat-analysis/new_source_audit.json
          test -s sat-analysis/r7_paired.csv
          test -s sat-analysis/r7_paired_summary.csv
          test -s sat-analysis/scatter_r7_large.png
          test -s sat-analysis/scatter_r7_wide.png
          test -s sat-analysis/scatter_r7_jerk.png
          test -s sat-analysis/scatter_r7_prop.png
          test -s sat-analysis/scatter_r7_target.png
          test -s sat-analysis/r7_formula_features.csv
          test -s sat-analysis/r7_target_signal_buckets.csv

      - name: Download only new verified R8 and R9 holdout artifacts
        if: steps.detect.outputs.post_r9_present != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for spec in 'r8 41352136853 DRNAS-Jerk-R8-Hash-New-Holdout' 'r9 41353826120 DRNAS-Jerk-R9-Median-Gate-Holdout'; do
            read -r kind run analysis <<< "$spec"
            mkdir -p "new-input/$kind"
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$analysis" --dir "new-input/$kind"
            for cat in random3 graphcolor xor external_satlib; do
              mkdir -p "new-input/$kind/raw-$cat" "new-input/$kind/$cat"
              gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "jerk-$kind-$cat" --dir "new-input/$kind/raw-$cat"
              test -s "new-input/$kind/raw-$cat/$cat/measurements.csv"
              test -s "new-input/$kind/raw-$cat/$cat/traces.jsonl"
              test -s "new-input/$kind/raw-$cat/$cat/manifest.json"
              test -s "new-input/$kind/raw-$cat/protocol.json"
              cp "new-input/$kind/raw-$cat/$cat/"{measurements.csv,traces.jsonl,manifest.json} "new-input/$kind/$cat/"
              cp "new-input/$kind/raw-$cat/protocol.json" "new-input/$kind/$cat/protocol.json"
            done
          done
          test -s new-input/r8/jerk_holdout_report.json
          test -s new-input/r9/jerk_gate_report.json

      - name: Append only hash-verified R8/R9 measurements and regenerate cumulative analytics
        if: steps.detect.outputs.post_r9_present != 'true'
        run: |
          set -euo pipefail
          .analytics-venv/bin/python research/tseitin-replay/v1531_ingest_r8_r9.py \
            --db sat-analysis/sat_analytics.sqlite --out sat-analysis --input new-input
          test -s sat-analysis/holdout_source_audit.json
          test -s sat-analysis/holdout_paired.csv
          test -s sat-analysis/holdout_paired_summary.csv
          test -s sat-analysis/holdout_formula_features.csv
          test -s sat-analysis/scatter_holdout_r8.png
          test -s sat-analysis/scatter_holdout_r9.png

      - name: Fetch three new finished verified benchmark families (R10, selector, SC2023)
        if: steps.detect.outputs.post_r9_present != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p new-input/r10/{aggregate,shards} new-input/selector/{aggregate,shards} new-input/real/{aggregate,shards,inputs}
          gh run download 41357285023 --repo "$GITHUB_REPOSITORY" \
            --name DRNAS-R10-Structural-Transfer-Results --dir new-input/r10/aggregate
          for n in 200 220 240; do
            for fold in development test; do
              for part in 0 1; do
                shard="n${n}_${fold}${part}"
                mkdir -p "new-input/r10/shards/$shard"
                gh run download 41357285023 --repo "$GITHUB_REPOSITORY" \
                  --name "r10-$shard" --dir "new-input/r10/shards/$shard"
                test -s "new-input/r10/shards/$shard/measurements.csv"
                test -s "new-input/r10/shards/$shard/manifest.json"
                test -s "new-input/r10/shards/$shard/traces.jsonl"
              done
            done
          done
          gh run download 41357661885 --repo "$GITHUB_REPOSITORY" \
            --name DRNAS-Learned-Selector-Holdout --dir new-input/selector/aggregate
          for cat in random3 graphcolor xor external_satlib; do
            mkdir -p "new-input/selector/shards/$cat"
            gh run download 41357661885 --repo "$GITHUB_REPOSITORY" \
              --name "selector-$cat" --dir "new-input/selector/shards/$cat"
            test -s "new-input/selector/shards/$cat/$cat/measurements.csv"
            test -s "new-input/selector/shards/$cat/protocol.json"
          done
          gh run download 41357661925 --repo "$GITHUB_REPOSITORY" \
            --name DRNAS-Selector-Real-Fresh-Results --dir new-input/real/aggregate
          gh run download 41357661925 --repo "$GITHUB_REPOSITORY" \
            --name real-inputs --dir new-input/real/inputs
          for i in 0 1 2 3 4 5; do
            mkdir -p "new-input/real/shards/$i"
            gh run download 41357661925 --repo "$GITHUB_REPOSITORY" \
              --name "real-shard-$i" --dir "new-input/real/shards/$i"
            test -s "new-input/real/shards/$i/measurements.csv"
            test -s "new-input/real/shards/$i/manifest.json"
          done
          test -s new-input/r10/aggregate/results.json
          test -s new-input/selector/aggregate/report.json
          test -s new-input/real/aggregate/report.json
          test -s new-input/real/inputs/frozen_manifest.json

      - name: Verify and append 2844 post-R9 attempts, retain immutable V15.3.1
        if: steps.detect.outputs.post_r9_present != 'true'
        run: |
          set -euo pipefail
          # Restore previous exported tables before regenerating cumulative exports.
          cp -n research/sat-analytics-data/current/* sat-analysis/ || true
          .analytics-venv/bin/python research/tseitin-replay/v1531_ingest_post_r9.py \
            --db sat-analysis/sat_analytics.sqlite --out sat-analysis --input new-input
          test -s sat-analysis/post_r9_source_audit.json
          test -s sat-analysis/post_r9_paired.csv
          test -s sat-analysis/post_r9_formula_features.csv
          test -s sat-analysis/post_r9_formula_novelty.csv
          test -s sat-analysis/scatter_post_r9_r10.png
          test -s sat-analysis/scatter_post_r9_selector.png
          test -s sat-analysis/scatter_post_r9_sc2023.png
          test -s sat-analysis/scatter_post_r9_structure.png

      - name: Detect already verified R12–R15 immutable cumulative snapshot
        id: detect_r12
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sqlite3
          db=sqlite3.connect('sat-analysis/sat_analytics.sqlite')
          n=db.execute('SELECT COUNT(*) FROM datasets').fetchone()[0]
          a=db.execute('SELECT COUNT(*) FROM attempts').fetchone()[0]
          if (n,a)==(79,16250):
           print('new_data=true')
          elif (n,a) in ((135,31730),(151,36530),(167,39890)):
           assert db.execute('SELECT COUNT(*) FROM r12_r15_formula_features').fetchone()[0]==560
           assert db.execute('SELECT COUNT(*) FROM r12_r15_attempt_details').fetchone()[0]==15480
           assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
           print('new_data=false')
          else:
           raise RuntimeError('Unrecognized immutable cumulative source baseline: '+str((n,a)))
          db.close()
          PY

      - name: Download only completed immutable R12–R15 raw shards and aggregate audits
        if: steps.detect_r12.outputs.new_data == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for v in 12 13 14 15; do
            case "$v" in
              12) run=41412313004; aggregate=DRNAS-R12-Frozen-Hybrid-Analysis; expected=12 ;;
              13) run=41415250855; aggregate=DRNAS-R13-Frozen-Rescue-Analysis; expected=12 ;;
              14) run=41417754698; aggregate=DRNAS-R14-Dual-Transfer-Analysis; expected=16 ;;
              15) run=41421780846; aggregate=DRNAS-R15-Trajectory-Learned-Model-Analysis; expected=16 ;;
            esac
            mkdir -p "new-input/r$v/aggregate" "new-input/r$v/shards"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.status+" "+.conclusion' | grep -Fx 'completed success'
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --paginate \
              --jq '.artifacts[] | [.name, (.id|tostring), (.expired|tostring)] | @tsv' \
              > "new-input/r$v/artifact_index.tsv"
            test "$(wc -l < "new-input/r$v/artifact_index.tsv")" -eq "$((expected+1))"
            gh run download "$run" --repo "$GITHUB_REPOSITORY" \
              --name "$aggregate" --dir "new-input/r$v/aggregate"
            test -s "new-input/r$v/aggregate/results.json"
            test -s "new-input/r$v/aggregate/paired.csv"
            test -s "new-input/r$v/aggregate/formula_features.csv"
            for n in 200 220 240; do
              for fold in development test; do
                for part in 0 1; do
                  shard="n${n}_${fold}${part}"
                  mkdir -p "new-input/r$v/shards/$shard"
                  gh run download "$run" --repo "$GITHUB_REPOSITORY" \
                    --name "r$v-$shard" --dir "new-input/r$v/shards/$shard"
                  test -s "new-input/r$v/shards/$shard/measurements.csv"
                  test -s "new-input/r$v/shards/$shard/manifest.json"
                  test -s "new-input/r$v/shards/$shard/traces.jsonl"
                done
              done
            done
            if [ "$v" -ge 14 ]; then
              for n in 220 240; do
                for fold in development test; do
                  shard="community_n${n}_${fold}0"
                  mkdir -p "new-input/r$v/shards/$shard"
                  gh run download "$run" --repo "$GITHUB_REPOSITORY" \
                    --name "r$v-$shard" --dir "new-input/r$v/shards/$shard"
                  test -s "new-input/r$v/shards/$shard/measurements.csv"
                  test -s "new-input/r$v/shards/$shard/manifest.json"
                  test -s "new-input/r$v/shards/$shard/traces.jsonl"
                done
              done
            fi
            echo "R$v source files complete: $expected raw shards + aggregate"
          done

      - name: Strict additive ingest of 15480 verified R12–R15 native attempts
        if: steps.detect_r12.outputs.new_data == 'true'
        run: |
          set -euo pipefail
          .analytics-venv/bin/python research/tseitin-replay/v1531_ingest_r12_r15.py \
            --db sat-analysis/sat_analytics.sqlite --out sat-analysis --input new-input
          test -s sat-analysis/r12_r15_ingest_audit.json
          test -s sat-analysis/r12_r15_paired_attempts.csv
          test -s sat-analysis/r12_r15_formula_features.csv
          test -s sat-analysis/r12_r15_frozen_report_summary.csv
          test -s sat-analysis/scatter_r12_paired_test.png
          test -s sat-analysis/scatter_r13_paired_test.png
          test -s sat-analysis/scatter_r14_paired_test.png
          test -s sat-analysis/scatter_r15_paired_test.png
          .analytics-venv/bin/python - <<'PY'
          import sqlite3,json
          db=sqlite3.connect('sat-analysis/sat_analytics.sqlite')
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert db.execute('SELECT COUNT(*) FROM datasets').fetchone()[0]==135
          assert db.execute('SELECT COUNT(*) FROM formulas').fetchone()[0]==2019
          assert db.execute('SELECT COUNT(*) FROM attempts').fetchone()[0]==31730
          assert db.execute('SELECT COUNT(*) FROM r12_r15_attempt_details').fetchone()[0]==15480
          db.close()
          a=json.load(open('sat-analysis/r12_r15_ingest_audit.json'))
          assert a['new_native_attempts']==15480 and a['new_unique_sha']==560
          print('R12_R15_SUCCESSFULLY_VERIFIED_CUMULATIVE_SNAPSHOT')
          PY

      - name: Detect immutable R16 native additions
        id: detect_r16
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sqlite3
          db=sqlite3.connect('sat-analysis/sat_analytics.sqlite')
          n=db.execute('SELECT COUNT(*) FROM datasets').fetchone()[0]
          a=db.execute('SELECT COUNT(*) FROM attempts').fetchone()[0]
          if (n,a)==(135,31730):
           print('new_data=true')
          elif (n,a) in ((151,36530),(167,39890)):
           assert db.execute('SELECT COUNT(*) FROM r16_formula_features').fetchone()[0]==160
           assert db.execute('SELECT COUNT(*) FROM r16_native_details').fetchone()[0]==4800
           assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
           print('new_data=false')
          else:
           raise RuntimeError('Unknown immutable R16 baseline '+str((n,a)))
          db.close()
          PY

      - name: Download verified R16 16-shard raw evidence and pinned aggregate
        if: steps.detect_r16.outputs.new_data == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=41426664482
          mkdir -p new-input/r16/{aggregate,shards,raw}
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.status+" "+.conclusion' | grep -Fx 'completed success'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --paginate \
            --jq '.artifacts[] | [.name, (.id|tostring), (.expired|tostring)] | @tsv' \
            > new-input/r16/artifact_index.tsv
          test "$(wc -l < new-input/r16/artifact_index.tsv)" -eq 17
          gh run download "$run" --repo "$GITHUB_REPOSITORY" \
            --name DRNAS-R16-Verified-Native-Live-Model-Analysis --dir new-input/r16/aggregate
          gh run download "$run" --repo "$GITHUB_REPOSITORY" \
            --pattern 'r16-*' --dir new-input/r16/raw
          for path in new-input/r16/raw/r16-*; do
            test -d "$path"
            shard="${path##*/}"
            shard="${shard#r16-}"
            mv "$path" "new-input/r16/shards/$shard"
            test -s "new-input/r16/shards/$shard/measurements.csv"
            test -s "new-input/r16/shards/$shard/manifest.json"
            test -s "new-input/r16/shards/$shard/traces.jsonl"
          done
          test "$(find new-input/r16/shards -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 16
          for f in results.json paired.csv formula_features.csv native_decisions.csv; do
            test -s "new-input/r16/aggregate/$f"
          done

      - name: SHA-audited additive R16 real native SQLite ingest
        if: steps.detect_r16.outputs.new_data == 'true'
        run: |
          set -euo pipefail
          .analytics-venv/bin/python research/tseitin-replay/v1531_ingest_r16.py \
            --db sat-analysis/sat_analytics.sqlite --out sat-analysis --input new-input/r16
          for f in r16_ingest_audit.json r16_source_audit.csv r16_paired.csv r16_native_decisions.csv r16_formula_features.csv; do
            test -s "sat-analysis/$f"
          done
          for fold in random3_development random3_test community3_development community3_test; do
            test -s "sat-analysis/scatter_r16_$fold.png"
          done
          .analytics-venv/bin/python - <<'PY'
          import sqlite3,json
          db=sqlite3.connect('sat-analysis/sat_analytics.sqlite')
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert tuple(db.execute('SELECT COUNT(*) FROM '+t).fetchone()[0] for t in ('datasets','formulas','attempts'))==(151,2179,36530)
          assert db.execute('SELECT COUNT(*) FROM r16_native_details').fetchone()[0]==4800
          db.close()
          a=json.load(open('sat-analysis/r16_ingest_audit.json'))
          assert a['new_native_attempts']==4800 and a['unique_new_formula_sha256']==160
          print('R16_VERIFIED_CUMULATIVE_SQLITE_SUCCESS')
          PY

      - name: Preserve verified R16 evidence on subsequent idempotent runs
        if: steps.detect_r16.outputs.new_data != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous-r16
          gh run download 41434703564 --repo "$GITHUB_REPOSITORY" \
            --name DRNAS-V1531-SQLite-Analytics --dir previous-r16
          if [ "$(python3 -c 'import sqlite3;print(sqlite3.connect("sat-analysis/sat_analytics.sqlite").execute("SELECT COUNT(*) FROM attempts").fetchone()[0])')" = 36530 ]; then
            cmp sat-analysis/sat_analytics.sqlite previous-r16/sat_analytics.sqlite
          else
            echo 'R17 cumulative snapshot already present: skip binary equality against R16 baseline'
          fi
          for f in r16_ingest_audit.json r16_source_audit.csv r16_paired.csv \
                   r16_native_decisions.csv r16_formula_features.csv \
                   scatter_r16_random3_development.png scatter_r16_random3_test.png \
                   scatter_r16_community3_development.png scatter_r16_community3_test.png; do
            test -s "previous-r16/$f"
            cp "previous-r16/$f" "sat-analysis/$f"
          done

      - name: Detect strictly new immutable R17 native source
        id: detect_r17
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sqlite3
          db=sqlite3.connect('sat-analysis/sat_analytics.sqlite')
          n=db.execute('SELECT COUNT(*) FROM datasets').fetchone()[0]
          f=db.execute('SELECT COUNT(*) FROM formulas').fetchone()[0]
          a=db.execute('SELECT COUNT(*) FROM attempts').fetchone()[0]
          if (n,f,a)==(151,2179,36530):
           print('new_data=true')
          elif (n,f,a)==(167,2339,39890):
           assert db.execute('SELECT COUNT(*) FROM r17_formula_features').fetchone()[0]==160
           assert db.execute('SELECT COUNT(*) FROM r17_native_details').fetchone()[0]==3360
           assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
           print('new_data=false')
          else:
           raise RuntimeError('Unrecognized cumulative baseline before R17 '+str((n,f,a)))
          db.close()
          PY

      - name: Retrieve only completed pinned R17 16-shard native benchmark
        if: steps.detect_r17.outputs.new_data == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=41446637396
          mkdir -p new-input/r17/{aggregate,shards,raw}
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.status+" "+.conclusion' | grep -Fx 'completed success'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --paginate \
            --jq '.artifacts[] | [.name, (.id|tostring), (.expired|tostring)] | @tsv' \
            > new-input/r17/artifact_index.tsv
          test "$(wc -l < new-input/r17/artifact_index.tsv)" -eq 17
          gh run download "$run" --repo "$GITHUB_REPOSITORY" \
            --name DRNAS-R17-Frozen-Risk-True-Native-Prospective-Analysis --dir new-input/r17/aggregate
          gh run download "$run" --repo "$GITHUB_REPOSITORY" \
            --pattern 'r17-*' --dir new-input/r17/raw
          for path in new-input/r17/raw/r17-*; do
            test -d "$path"
            shard="${path##*/}"
            shard="${shard#r17-}"
            mv "$path" "new-input/r17/shards/$shard"
            test -s "new-input/r17/shards/$shard/measurements.csv"
            test -s "new-input/r17/shards/$shard/manifest.json"
            test -s "new-input/r17/shards/$shard/traces.jsonl"
          done
          test "$(find new-input/r17/shards -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 16
          for f in results.json paired.csv formula_features.csv native_risk_decisions.csv risk_model.json; do
            test -s "new-input/r17/aggregate/$f"
          done

      - name: Append R17 real native SHA-audited attempts without modifying historical solver
        if: steps.detect_r17.outputs.new_data == 'true'
        run: |
          set -euo pipefail
          .analytics-venv/bin/python research/tseitin-replay/v1531_ingest_r17.py \
