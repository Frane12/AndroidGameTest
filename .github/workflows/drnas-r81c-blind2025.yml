name: DRNAS R81C blind SAT2025 original official-source transfer
on:
  push:
    branches: [experiment/drnas-r81c-official2025-blind-20261104]
    paths:
      - '.github/workflows/drnas-r81c-blind2025.yml'
      - 'experiments/drnas_v16/r81c_official2025_blind.py'
      - 'experiments/drnas_v16/r81c_exact_algebra.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r81c-blind2025
  cancel-in-progress: false

jobs:
  freeze:
    name: Source-disjoint freeze of 16 untested SAT Competition 2025 originals
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Syntax, SAT model, UNSAT certificate and unsafe decoy tests
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/r81c_official2025_blind.py experiments/drnas_v16/r81c_exact_algebra.py
          python3 -u experiments/drnas_v16/r81c_exact_algebra.py
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-R63-REAL2026-XOR-PREVALENCE-FALLBACK-FINAL
          run-id: 41707669490
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: old-r63
      - uses: actions/download-artifact@v4
        with:
          name: r66-frozen-new-official-sources
          run-id: 41717235335
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: old-r66
      - uses: actions/download-artifact@v4
        with:
          name: r67-frozen-new-official-sources
          run-id: 41719704574
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: old-r67
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-R67-STRUCTURAL-DIAGNOSTIC-FINAL
          run-id: 41719704574
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: old-r67-report
      - uses: actions/download-artifact@v4
        with:
          name: r73-fresh-selected-sources
          run-id: 41732483582
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: old-r73
      - uses: actions/download-artifact@v4
        with:
          name: r77-source-frozen
          run-id: 41741289273
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: old-r77
      - uses: actions/download-artifact@v4
        with:
          name: r78-source-frozen
          run-id: 41743551028
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: old-r78
      - uses: actions/download-artifact@v4
        with:
          name: r28-identical-binaries
          run-id: 41613064879
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: old-compiled
      - name: Freeze source IDs and SHA before any solver runs; exclude R78 attempts
        run: |
          set -euo pipefail
          (cd old-compiled && sha256sum -c binary.sha256)
          chmod +x old-compiled/kissat
          python3 -u experiments/drnas_v16/r81c_official2025_blind.py freeze \
            --r63 old-r63/r63-final.json \
            --r66 old-r66/new/manifest.json \
            --r67 old-r67/new/manifest.json \
            --r67final old-r67-report/r67-final.json \
            --r73 old-r73 --r77 old-r77 --r78 old-r78 \
            --kissat old-compiled/kissat --out world | tee r81c-blind-freeze.log
          (cd world && sha256sum -c source.sha256)
          test "$(python3 -c 'import json; print(len(json.load(open("world/manifest.json"))["cases"]))')" = 16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r81c-blind-frozen-sources
          path: |
            world/
            r81c-blind-freeze.log
          if-no-files-found: warn
          retention-days: 90

  prepare:
    name: Verify frozen upstream Kissat and R28 GF2 binary SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r28-identical-binaries
          run-id: 41613064879
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: compiled
      - name: SHA-locked executable controls
        run: |
          set -euo pipefail
          (cd compiled && sha256sum -c binary.sha256)
          mkdir -p bin
          cp compiled/kissat compiled/r28_gf2 bin/
          chmod +x bin/kissat bin/r28_gf2
          (cd bin && sha256sum kissat r28_gf2 > binary.sha256)
          (cd bin && sha256sum -c binary.sha256)
          lscpu > bin/cpu.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r81c-blind-binaries
          path: bin/
          retention-days: 90

  benchmark:
    name: r81c-blind-shard-${{ matrix.shard }}
    needs: [freeze,prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r81c-blind-frozen-sources
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: r81c-blind-binaries
          path: bin
      - name: Paired original-CNF 30s wall caps, two repeats, four controls
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          (cd world && sha256sum -c source.sha256)
          (cd bin && sha256sum -c binary.sha256)
          chmod +x bin/kissat bin/r28_gf2
          python3 -u experiments/drnas_v16/r81c_official2025_blind.py measure \
            --sources world --binaries bin --shard "$SHARD" --out results | tee r81c-blind-live.log
          test -s results/r81c-blind-shard.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r81c-blind-shard-${{ matrix.shard }}
          path: |
            results/
            r81c-blind-live.log
          if-no-files-found: warn
          retention-days: 90

  audit:
    name: Final 128-trial SHA witness GF2 proof and formula-bootstrap audit
    needs: [freeze,prepare,benchmark]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r81c-blind-frozen-sources
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: r81c-blind-shard-*
          path: combined
      - name: Fail closed unless all original sha/paired verdicts and proof checks pass
        run: |
          set -euo pipefail
          (cd world && sha256sum -c source.sha256)
          python3 -u experiments/drnas_v16/r81c_official2025_blind.py audit \
            --sources world --combined combined --out final
          test -s final/results.json
          test -s final/paired.csv
          python3 - <<'PY'
          import json
          d=json.load(open("final/results.json"))
          assert d["status"]=="PASS_UNOFFICIAL" and d["trials"]==128
          print("R81C_BLIND_128_TRIAL_FINAL_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DRNAS-R81C-BLIND2025-128TRIAL-VERIFIED-FINAL
          path: |
            final/
            world/manifest.json
          retention-days: 90
