name: DRNAS independent grid certificate replay
on:
  push:
    branches: [experiment/drnas-tseitin-n162-replay-20261101]
    paths: ['research/tseitin-replay/grid_certificates.py','.github/workflows/drnas-tseitin-grid-certificates.yml']
permissions:
  contents: read
jobs:
  certificate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Emit and replay each equation against original clauses
        run: python3 research/tseitin-replay/grid_certificates.py
      - uses: actions/upload-artifact@v4
        with:
          name: original-grid-certificates
          path: grid-proofs/
          if-no-files-found: error
