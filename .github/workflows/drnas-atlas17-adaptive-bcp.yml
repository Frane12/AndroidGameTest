name: DRNAS ATLAS17 BCP pressure adaptive proof-first
run-name: ATLAS17 200 fresh SHA x 8 arms x 2 reps 8s oneCPU BCP pressure
on:
  push:
    branches: [experiment/drnas-atlas17-bcp-adaptive-20261111]
    paths:
      - research/drnas_atlas17_build.py
      - research/drnas_atlas17_benchmark.py
      - research/drnas_atlas17_merge.py
      - research/drnas_atlas17_schema.sql
      - .github/workflows/drnas-atlas17-adaptive-bcp.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-atlas17-bcp-20261111
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build original C5/C6 controls and isolated C7 BCP-adaptive CDCL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_atlas16_build.py research/drnas_atlas17_build.py research/drnas_atlas17_benchmark.py research/drnas_atlas17_merge.py
          python3 research/drnas_atlas13_generator.py
          python3 research/drnas_atlas15_warm_patch.py
          python3 research/drnas_atlas15_cdcl_patch.py
          python3 research/drnas_atlas1_generate.py --out mre_atlas15/atlas1_table.hpp
          python3 research/drnas_atlas9_export_table.py research/atlas8_reduction_table.jsonl mre_atlas15/atlas8_rules.hpp
          python3 research/drnas_atlas16_build.py
          python3 research/drnas_atlas17_build.py
          mkdir -p mre_atlas15/bin mre_atlas17/bin
          g++ -std=c++17 -O2 -I mre_atlas15 research/drnas_atlas15_native.cpp -o mre_atlas15/bin/drnas_atlas15
          g++ -std=c++17 -O2 -I mre_atlas17 -I mre_atlas15 mre_atlas17/native.cpp -o mre_atlas17/bin/drnas_atlas17
          mre_atlas17/bin/drnas_atlas17 --selftest
          python3 research/drnas_atlas15_train.py
      - name: Compile pinned Kissat and install one-thread CryptoMiniSat
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cryptominisat
          cryptominisat5 --version
          git clone -q https://github.com/arminbiere/kissat.git /tmp/atlas17-kissat
          git -C /tmp/atlas17-kissat checkout --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          (cd /tmp/atlas17-kissat && ./configure && make -j2)
          cp /tmp/atlas17-kissat/build/kissat mre_atlas17/bin/kissat
          mre_atlas17/bin/kissat --version
      - uses: actions/upload-artifact@v4
        with:
          name: ATLAS17-FROZEN-BINARIES
          retention-days: 14
          path: |
            mre_atlas17/bin/drnas_atlas17
            mre_atlas17/bin/kissat
      - uses: actions/upload-artifact@v4
        with:
          name: ATLAS17-FROZEN-TRAINING
          retention-days: 14
          path: |
            ATLAS15_TRAINING.json
            ATLAS15_POLICY.txt
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ATLAS17-FROZEN-BINARIES
          path: mre_atlas17/bin
      - uses: actions/download-artifact@v4
        with:
          name: ATLAS17-FROZEN-TRAINING
          path: training
      - name: Smoke all 8 arms C7, C6, reference SAT verification
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cryptominisat
          chmod +x mre_atlas17/bin/drnas_atlas17 mre_atlas17/bin/kissat
          taskset -c "$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')" python3 -u research/drnas_atlas17_benchmark.py --stage 1 --shard 0 --smoke |
            tee mre_atlas17/smoke.log
          grep '^ATLAS17_FINAL ' mre_atlas17/smoke.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS17-SMOKE-LOG
          path: |
            mre_atlas17/smoke.log
            mre_atlas17/audit_s1_h0.json
  bench1:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ATLAS17-FROZEN-BINARIES
          path: mre_atlas17/bin
      - uses: actions/download-artifact@v4
        with:
          name: ATLAS17-FROZEN-TRAINING
          path: training
      - name: Stage 1 prospective 200-CNF oneCPU matched shard ${{ matrix.shard }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cryptominisat
          chmod +x mre_atlas17/bin/drnas_atlas17 mre_atlas17/bin/kissat
          taskset -c "$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')" python3 -u research/drnas_atlas17_benchmark.py --stage 1 --shard ${{ matrix.shard }} |
            tee mre_atlas17/pass1_shard_${{ matrix.shard }}.log
          grep '^ATLAS17_FINAL ' mre_atlas17/pass1_shard_${{ matrix.shard }}.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS17-PASS1-SHARD-${{ matrix.shard }}
          retention-days: 30
          path: |
            mre_atlas17/audit_s1_h${{ matrix.shard }}.json
            mre_atlas17/events_s1_h${{ matrix.shard }}.jsonl
            mre_atlas17/pass1_shard_${{ matrix.shard }}.log
  merge1:
    needs: bench1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ATLAS17-PASS1-SHARD-*
          merge-multiple: true
          path: audits
      - name: Merge prospective 200 SHA, validated PAR2, BCP telemetry and SQL
        run: |
          set -euo pipefail
          mkdir -p mre_atlas17
          python3 -u research/drnas_atlas17_merge.py --stage 1 --audit-dir audits |
            tee mre_atlas17/pass1_merged.log
          grep '^ATLAS17_MERGED ' mre_atlas17/pass1_merged.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ATLAS17-SQL-PASS1
          retention-days: 90
          path: |
            mre_atlas17/ATLAS17_LEARNING.sqlite
            mre_atlas17/policy_next.json
            mre_atlas17/ATLAS17_STAGE1_SUMMARY.json
            mre_atlas17/pass1_merged.log

