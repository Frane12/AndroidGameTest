name: DRNAS GF2CDCL-LIVE5 - audit-only recovery of 120 completed paired E2E trials
run-name: GF2CDCL-LIVE5 audit recovery original frozen 120 no rerun
on:
  push:
    branches: [experiment/drnas-gf2-cdcl-live5-certified-pairxor-20261110]
    paths:
      - .github/workflows/drnas-gf2-cdcl-live5-audit-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-recover:
    name: Independently audit existing 5 successful shards using corrected frozen artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: gf2cdcl-live5-frozen-10SHA-CaDiCaL-pairxor-proof
          run-id: 42798339202
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: gf2cdcl-live5-shard-*
          merge-multiple: true
          run-id: 42798339202
          github-token: ${{ github.token }}
          path: mre_gf2cdcl_live5
      - name: Audit 120 completed one-CPU original-SHA E2E trials and certified pairxor
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_gf2cdcl_live5/bin/gf2cdcl mre_gf2_s1/bin/gf2_exact mre_x4/bin/native built/bin/kissat_4_0_4 mre_equiv7/bin/cadical_3_0_1
          test -s mre_gf2cdcl_live5/manifest.json
          for i in 0 1 2 3 4; do test -s "mre_gf2cdcl_live5/shard-$i.json"; done
          python3 -u research/drnas_gf2_cdcl_live5.py verify
          python3 -u research/drnas_gf2_cdcl_live5.py audit | tee mre_gf2cdcl_live5/audit.log
          grep -q '^GF2CDCL_LIVE5_FINAL ' mre_gf2cdcl_live5/audit.log
          grep '^GF2CDCL_LIVE5_FINAL ' mre_gf2cdcl_live5/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-GF2CDCL-LIVE5-120-E2E-RECOVERED-FINAL
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_gf2cdcl_live5/report.json
            mre_gf2cdcl_live5/audit.log
            mre_gf2cdcl_live5/manifest.json
            mre_gf2cdcl_live5/shard-*.json
