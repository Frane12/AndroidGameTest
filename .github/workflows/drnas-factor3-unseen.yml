name: DRNAS FACTOR3 unseen structural challenge
run-name: FACTOR3 32 frozen 24-48 variable CNFs x 2 native arms x 3 reps 192 oneCPU
on:
  push:
    branches: [experiment/drnas-factor3-unseen-20261110]
    paths:
      - research/drnas_factor3_unseen.py
      - .github/workflows/drnas-factor3-unseen.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  factor3:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile native FACTOR2 source for FACTOR3
        run: |
          set -euo pipefail
          mkdir -p mre_factor3/bin
          python3 -m py_compile research/drnas_factor3_unseen.py
          g++ -std=c++17 -O2 research/drnas_factor2_native.cpp -o mre_factor3/bin/drnas_factor2
      - name: Run 192 oneCPU frozen unseen structural comparisons
        run: |
          set -euo pipefail
          taskset -c "$(taskset -pc $$ | sed 's/.*: //' | cut -d, -f1 | cut -d- -f1)" \
            python3 -u research/drnas_factor3_unseen.py | tee mre_factor3/benchmark.log
          grep -q '^FACTOR3_FINAL ' mre_factor3/benchmark.log
          grep '^FACTOR3_FINAL ' mre_factor3/benchmark.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-FACTOR3-UNSEEN-192-ONECPU-SHA-AUDIT
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_factor3/audit.json
            mre_factor3/*.cnf
            mre_factor3/*.log
            mre_factor3/bin/drnas_factor2
