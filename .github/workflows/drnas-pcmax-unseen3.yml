name: DRNAS PCMAX UNSEEN3 weighted vs Kissat X5 proof-aware
on:
  push:
    branches: [experiment/drnas-pcmax-unseen3-bench-20261114]
    paths: [.github/workflows/drnas-pcmax-unseen3.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-pcmax-unseen3-source-pinned
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 43625251777
          name: domain-bench1-prepared
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          run-id: 43631559465
          name: pcmax20-original-cnfs
          github-token: ${{ github.token }}
          path: pcmax20/
      - name: Restore frozen binaries and syntax-check
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf domain_bench_ready.tgz
          chmod +x build/drnas-worker-domain build/kissat build/drat-trim
          python3 -m py_compile research/drnas_pcmax_capacity_guard.py research/drnas_pcmax_unseen3_bench.py
          test -f pcmax20/report.json
      - name: Source-verify fresh original CNFs and run 24 paired trials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .pcmax-venv
          .pcmax-venv/bin/python -m pip install --quiet --disable-pip-version-check scipy==1.17.0
          .pcmax-venv/bin/python -u research/drnas_pcmax_unseen3_bench.py | tee pcmax-unseen3-benchmark.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pcmax-unseen3-originals-weighted-benchmark
          retention-days: 60
          path: |
            pcmax-unseen3-results/
            pcmax-unseen3-benchmark.log
