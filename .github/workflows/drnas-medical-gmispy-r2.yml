name: DRNAS Medical R2 real e_coli_core SAT LP vs gMISpy MCS

on:
  push:
    branches:
      - experiment/drnas-medical-gmispy-r2-real-fba-20261106
    paths:
      - 'research/drnas_medical/gmispy_r2.py'
      - '.github/workflows/drnas-medical-gmispy-r2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drnas-real-metabolic-audit:
    name: Real E. coli GPR KO exhaustive vs DRNAS SAT LP
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned real metabolic and SAT solvers
        run: |
          python3 -m pip install --disable-pip-version-check cobra==0.30.0 python-sat==1.9.dev21
      - name: Real model and exact 1:1 reaction gene knockout equivalence audit
        run: |
          python3 research/drnas_medical/gmispy_r2.py sat-lp \
            --out medical-results/gmispy-r2-sat-lp --max-genes 18 --growth-ratio 0.01
      - name: Publish SHA-pinned model SBML, reference, paired timings, audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-gmispy-r2-real-metabolic-audit
          path: medical-results/gmispy-r2-sat-lp/
          retention-days: 30
          if-no-files-found: warn

  official-gmispy-metabolic-mcs:
    name: Real upstream gMISpy MILP reaction MCS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original upstream gMISpy pinned source and COBRApy
        run: |
          python3 -m pip install --disable-pip-version-check cobra==0.30.0 \
            'git+https://github.com/PlanesLab/cyclic-gMISpy.git@76ce96de9d4e18c8200876f5a73d3b2d60e4a012'
      - name: Run original gMISpy full metabolic MCS on exactly matched reaction targets
        run: |
          python3 research/drnas_medical/gmispy_r2.py upstream-mcs \
            --out medical-results/gmispy-r2-upstream --max-genes 18 --growth-ratio 0.01
      - name: Preserve reference MCS solutions, model and any failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-gmispy-r2-original-MCS
          path: medical-results/gmispy-r2-upstream/
          retention-days: 30
          if-no-files-found: warn
