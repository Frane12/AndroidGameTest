name: DRNAS PCD1 20-family matched parallel diagnostics
on:
  push:
    branches: [experiment/drnas-pcd1-parallel-conflict-20261111]
    paths:
      - research/drnas_pcd1_benchmark.py
      - .github/workflows/drnas-pcd1-benchmark.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Compile and compare parallel reason-graph shadow
        run: |
          set -euo pipefail
          g++ -O2 -std=c++17 -pthread -Wall -Wextra -Werror research/drnas_pcd1.cpp -o /tmp/drnas-pcd1
          /tmp/drnas-pcd1 --selftest
          python3 -u research/drnas_pcd1_benchmark.py | tee bench.log
          grep '^PCD1_FINAL ' bench.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PCD1-matched-diagnostics
          retention-days: 30
          path: |
            bench.log
            pcd1_results/results.json
