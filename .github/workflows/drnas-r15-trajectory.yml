name: DRNAS SAT R15 3840 real trajectories and frozen learned policy replay
on:
  push:
    branches: [experiment/drnas-r15-trajectory-learning-20261102]
    paths:
      - '.github/workflows/drnas-r15-trajectory.yml'
      - 'experiments/drnas_v16/r15_trajectory_benchmark.py'
      - 'experiments/drnas_v16/r15_trajectory_analysis.py'
      - 'experiments/drnas_v16/r15_historical_sha256.txt'
      - 'experiments/drnas_v16/r15_frozen_protocol.json'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: drnas-r15-trajectory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Frozen R15 source, all solvers and deterministic generator smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify source SHA, protocol, history, generation and Python syntax
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/{r15_trajectory_benchmark,r15_trajectory_analysis,r14_dual_benchmark,patch_r14_dual,r13_rescue_benchmark,patch_r13_rescue,r12_structure_dynamic_benchmark,patch_r12_hybrid,r11_restart_timing,patch_r11_restart_sweep,r7_large,patch_r6_trace,patch_r5_multisignal,patch_r4_restart_gate,predict_conflict_patch_v177}.py
          test "$(git hash-object research/drnas-sat-v7-8/v1531_nohang.cpp)" = d280a2ffa28d72aec183323bbea40544d676112d
          test "$(git hash-object experiments/drnas_v16/r14_dual_benchmark.py)" = f618e1da19d3261d2106326d3b3a37a9083fa4f8
          test "$(git hash-object experiments/drnas_v16/patch_r14_dual.py)" = a0df241053bd93e3f2af11fc95957e5db1a74735
          test "$(git hash-object experiments/drnas_v16/r14-results/current/formula_features.csv)" = 9ad4494aa19d4d7252720f836e994aa9d6e37dc3
          python3 - <<'PY'
          import sys
          from pathlib import Path
          from tempfile import TemporaryDirectory
          sys.path.insert(0,"experiments/drnas_v16")
          import r15_trajectory_benchmark as b
          c=b.load_config()
          assert len(b.SHARDS)==16 and len(b.MODES)==8 and b.REPEATS==3
          assert b.CAP==12 and c["model"]["ridge_lambda"]==30
          assert set(c["feature_sets"])=={"snapshot","trajectory"}
          assert len(c["feature_sets"]["trajectory"])>len(c["feature_sets"]["snapshot"])
          reg={s for s in b.REGISTRY.read_text().split() if len(s)==64}
          assert len(reg)==1934
          with TemporaryDirectory() as path:
            sample=b.make_cases("community_n240_test0",Path(path),reg)
            assert len(sample)==10 and len({x["formula_sha256"] for x in sample})==10
            assert all(x["metadata"]["family"]=="community3" for x in sample)
          print("R15_FROZEN_PROTO_AND_GENERATOR_AUDIT_OK")
          PY
      - name: Build read-only R11 checkpoint and R14 pinned in-process control
        run: |
          set -euo pipefail
          git clone -q https://github.com/arminbiere/kissat.git /tmp/kissat-r6-patched
          git -C /tmp/kissat-r6-patched checkout -q --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          test "$(git -C /tmp/kissat-r6-patched rev-parse HEAD)" = 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          python3 experiments/drnas_v16/patch_r14_dual.py --kissat-root /tmp/kissat-r6-patched
          (cd /tmp/kissat-r6-patched && ./configure && make -j2)
          strings /tmp/kissat-r6-patched/build/kissat | grep -Fq R6_TRACE
          strings /tmp/kissat-r6-patched/build/kissat | grep -Fq DRNAS_V177_SWITCH
      - name: Smoke every in-process measurement arm on known SAT and UNSAT
        run: |
          set -euo pipefail
          printf 'p cnf 2 2\n1 0\n2 0\n' >/tmp/r15-sat.cnf
          printf 'p cnf 1 2\n1 0\n-1 0\n' >/tmp/r15-unsat.cnf
          for mode in r5_monitor r11_2048_25 r11_2048_50 r11_4096_25 r13_rescue50 r14_dual50; do
            set +e
            DRNAS_R12_DEGREE_CV=.29 DRNAS_R13_N=240 DRNAS_V177_MODE="$mode" /tmp/kissat-r6-patched/build/kissat -s /tmp/r15-sat.cnf >/tmp/r15-sat.log 2>&1
            sat=$?
            DRNAS_R12_DEGREE_CV=.29 DRNAS_R13_N=240 DRNAS_V177_MODE="$mode" /tmp/kissat-r6-patched/build/kissat -s /tmp/r15-unsat.cnf >/tmp/r15-unsat.log 2>&1
            unsat=$?
            set -e
            if [ "$sat" -ne 10 ] || [ "$unsat" -ne 20 ]; then
              echo "R15_SMOKE_POLICY_FAILURE mode=$mode sat=$sat unsat=$unsat"
              cat /tmp/r15-sat.log /tmp/r15-unsat.log
              exit 1
            fi
          done
          echo R15_ALL_NATIVE_ARM_SMOKE_PASS

  benchmark:
    name: R15 trajectory ${{ matrix.category }}
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        category: [n200_development0, n200_development1, n200_test0, n200_test1,
                   n220_development0, n220_development1, n220_test0, n220_test1,
                   n240_development0, n240_development1, n240_test0, n240_test1,
                   community_n220_development0, community_n220_test0,
                   community_n240_development0, community_n240_test0]
    steps:
      - uses: actions/checkout@v4
      - name: Compile original pinned Kissat
        run: |
          set -euo pipefail
          git clone -q https://github.com/arminbiere/kissat.git /tmp/kissat-r6-original
          git -C /tmp/kissat-r6-original checkout -q --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          test "$(git -C /tmp/kissat-r6-original rev-parse HEAD)" = 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          (cd /tmp/kissat-r6-original && ./configure && make -j2)
      - name: Compile byte-identical R14 instrumented Kissat for all trajectory arms
        run: |
          set -euo pipefail
          git clone -q https://github.com/arminbiere/kissat.git /tmp/kissat-r6-patched
          git -C /tmp/kissat-r6-patched checkout -q --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          test "$(git -C /tmp/kissat-r6-patched rev-parse HEAD)" = 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          python3 experiments/drnas_v16/patch_r14_dual.py --kissat-root /tmp/kissat-r6-patched
          (cd /tmp/kissat-r6-patched && ./configure && make -j2)
      - name: Build untouched V15.3.1 fixed-source reference
        run: |
          set -euo pipefail
          test "$(git hash-object research/drnas-sat-v7-8/v1531_nohang.cpp)" = d280a2ffa28d72aec183323bbea40544d676112d
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra research/drnas-sat-v7-8/v1531_nohang.cpp -o /tmp/drnas-r6-v1531
      - name: Run 240 real paired SAT solves and preserve complete early trajectories
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r15_trajectory_benchmark.py --category "${{ matrix.category }}"
          test -s "drnas-r15-results/${{ matrix.category }}/measurements.csv"
          test -s "drnas-r15-results/${{ matrix.category }}/traces.jsonl"
          test -s "drnas-r15-results/${{ matrix.category }}/manifest.json"
      - name: Upload raw trace evidence, even after an interrupted or failed shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r15-${{ matrix.category }}
          path: drnas-r15-results/${{ matrix.category }}/
          if-no-files-found: warn
          retention-days: 60

  aggregate:
    name: R15 3840 attempt audit and development-trained trajectory policy replay
    needs: benchmark
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: r15-*
          path: r15-download
          merge-multiple: false
      - name: Fit frozen models only on random3 development and score fresh holdout
        run: |
          set -euo pipefail
          python3 -m venv .r15venv
          .r15venv/bin/pip -q install numpy matplotlib
          .r15venv/bin/python experiments/drnas_v16/r15_trajectory_analysis.py
          test -s drnas-r15-results/aggregate/results.json
          test -s drnas-r15-results/aggregate/paired.csv
          test -s drnas-r15-results/aggregate/formula_features.csv
          test -s drnas-r15-results/aggregate/frozen_trained_models.json
          test -s drnas-r15-results/aggregate/policy_decisions.csv
          for fold in random3_development random3_test community3_development community3_test; do
            test -s "drnas-r15-results/aggregate/r15_trajectory_scatter_$fold.png"
            test -s "drnas-r15-results/aggregate/r15_prediction_scatter_$fold.png"
          done
      - name: Upload complete or partial R15 analysis artifacts for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRNAS-R15-Trajectory-Learned-Model-Analysis
          path: drnas-r15-results/aggregate/
          if-no-files-found: warn
          retention-days: 60
      - name: Archive ONLY complete R15 results, never overwrite R14/V15.3.1
        if: success()
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/drnas-r15-trajectory-learning-20261102"
          mkdir -p experiments/drnas_v16/r15-results/current
          for file in results.json paired.csv formula_features.csv policy_decisions.csv frozen_trained_models.json; do
            test -s "drnas-r15-results/aggregate/$file"
            cp "drnas-r15-results/aggregate/$file" "experiments/drnas_v16/r15-results/current/$file"
          done
          for fold in random3_development random3_test community3_development community3_test; do
            for kind in trajectory prediction; do
              file="r15_${kind}_scatter_${fold}.png"
              test -s "drnas-r15-results/aggregate/$file"
              cp "drnas-r15-results/aggregate/$file" "experiments/drnas_v16/r15-results/current/$file"
            done
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/drnas_v16/r15-results/current/
          if ! git diff --cached --quiet; then
            git commit -m "data: verified R15 real trajectories and off-policy prospective evaluation [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
