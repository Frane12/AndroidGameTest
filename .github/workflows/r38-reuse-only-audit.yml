name: DRNAS R38 artifact-only complete audit NO NATIVE SOLVER
on:
  push:
    branches: [experiment/drnas-r38-reuse-results-audit-20261103]
    paths:
      - '.github/workflows/r38-reuse-only-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Reuse five completed official formula probes
        uses: actions/download-artifact@v4
        with:
          pattern: r38-case-*
          run-id: 41636569865
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: combined
      - name: Reuse exact official frozen manifest
        uses: actions/download-artifact@v4
        with:
          name: v94-frozen-new12-official-manifest
          run-id: 41632056202
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: official_manifest
      - name: Verify all five evidence sets with NO SOLVER EXECUTION
        run: |
          set -euo pipefail
          (cd official_manifest && sha256sum -c manifest.sha256)
          python3 -m py_compile research/r38_portfolio_audit.py
          find combined -maxdepth 3 -type f | sort
          python3 -u research/r38_portfolio_audit.py --root combined --manifest official_manifest/official_v94_manifest.json --out r38-audit.json | tee r38-audit.log
          test -s r38-audit.json
          cat r38-audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R38-FIVE-OFFICIAL-CAUSAL-AND-PORTFOLIO-VERIFIED
          path: |
            r38-audit.json
            r38-audit.log
          if-no-files-found: warn
          retention-days: 90
