name: DRNAS SAT v8.2 Delayed Phase Selection Audit
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/drnas-sat-v82-delayed-phase-20261031
    paths:
      - '.github/workflows/drnas-sat-v82-delayed-phase.yml'
      - 'research/drnas-sat-v7-8/v82_*'
permissions:
  contents: read
  actions: read
jobs:
  paired-cnf:
    name: v82-${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: winner-4ae685
            shard: 4
            case_id: 4ae685a11b5cecca76dc3d463481ce92
            cap: 60
            repeats: 2
          - name: easy-0c9da4
            shard: 0
            case_id: 0c9da400944b002f90fd385d4fdab385
            cap: 60
            repeats: 2
          - name: hard-0e0689
            shard: 0
            case_id: 0e06895600b5cd0b6fadb87e17bf8145
            cap: 300
            repeats: 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preflight source invariants and build experimental CaDiCaL 3.0.1
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/drnas-sat-v7-8/v82_phase_benchmark.py
          test "$(git hash-object research/drnas-sat-v7-6/v76_single.cpp)" = a254356a45b70f02f33b9506f1122dad33916ca7
          test "$(git hash-object research/drnas-sat-v7-7/v77_single.cpp)" = 1bbb7fa035e62d5179de9243f672aed9bb9cbaca
          sha256sum research/drnas-sat-v7-6/v76_single.cpp research/drnas-sat-v7-7/v77_single.cpp | tee frozen_hashes.txt
          python - <<'PY'
          from pathlib import Path
          src=Path('research/drnas-sat-v7-7/v77_single.cpp').read_text()
          marker='\nint main(int argc,char**argv) {'
          assert src.count(marker)==1, "Unexpected change in frozen v7.7 entrypoint"
          prefix=src.split(marker,1)[0]
          assert 'static V77 solve77(' in prefix
          Path('research/drnas-sat-v7-7/v77_embedded_functions.inc').write_text(prefix+'\n')
          PY
          git clone --depth 1 --branch rel-3.0.1 https://github.com/arminbiere/cadical.git cadical-src
          git -C cadical-src rev-parse HEAD | tee cadical_sha.txt
          (cd cadical-src && ./configure && make -j2)
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -I cadical-src/src \
            research/drnas-sat-v7-8/v82_phase_probe.cpp \
            cadical-src/build/libcadical.a -o v82_phase_probe -pthread -ldl -lz
          test -x v82_phase_probe
      - name: Retrieve frozen original SAT 2026 source manifest
        uses: actions/download-artifact@v4
        with:
          name: drnas-satcomp2026-official-instance-mini-par2
          run-id: 41204322891
          github-token: ${{ github.token }}
          path: previous_manifest
      - name: Download exact official CNFs and SHA256-verify
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python -u research/drnas-sat-v7-7/official26_v77_fetch.py \
            --previous previous_manifest/satcomp26_official/source_manifest.csv \
            --outdir original_official_sources --shard "$SHARD" --shards 10
      - name: Paired exact v8.2 delays versus frozen v7.6 and plain CaDiCaL
        env:
          CASE_ID: ${{ matrix.case_id }}
          CAP: ${{ matrix.cap }}
          REPEATS: ${{ matrix.repeats }}
        run: |
          set -euo pipefail
          python -u research/drnas-sat-v7-8/v82_phase_benchmark.py \
            --sources original_official_sources/selected.json \
            --binary "$GITHUB_WORKSPACE/v82_phase_probe" \
            --case-id "$CASE_ID" --cap "$CAP" --repeats "$REPEATS" \
            --outdir results
          cat results/v82_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain complete logs, CPU/RSS telemetry, SHA-pinned inputs and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-v82-${{ matrix.name }}
          path: |
            frozen_hashes.txt
            cadical_sha.txt
            original_official_sources/selected.json
            results/
          if-no-files-found: warn
  consolidate:
    if: always()
    needs: paired-cnf
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: drnas-v82-*
          path: all_cases
      - name: Print all three diagnostic cases separately and detect omissions
        run: |
          set -euo pipefail
          count=0
          for file in all_cases/*/results/v82_report.md; do
            test -f "$file"
            cat "$file" >> "$GITHUB_STEP_SUMMARY"
            count=$((count+1))
          done
          test "$count" -eq 3
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-v82-Delayed-Phase-Full-Diagnostic
          path: all_cases/
          if-no-files-found: error
