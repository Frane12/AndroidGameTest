name: DRNAS CRR1-B2 — timeout-safe GF2 active four focus SAT2026 36 paired 30s
on:
  push:
    branches: [experiment/drnas-crr1b2-timeout-telemetry-20261108]
    paths: ['.github/workflows/drnas-crr1b2-telemetry.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: crr1b2-timeout-metrics-20261108
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore immutable W4 original SHA sources and verify CRR1B2 logical certificates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42429372803 -R Frane12/AndroidGameTest -n w4-input -D .
          test -s worldsim-w1-frozen.tar.gz
          test -s history/w4sources/manifest.json
          tar xzf worldsim-w1-frozen.tar.gz
          chmod +x checker/drat-trim built/bin/kissat_4_0_4
          python3 -m py_compile research/drnas_crr1a_shadow.py research/drnas_crr1b_active.py research/drnas_crr1b2_telemetry.py
          python3 -u research/drnas_crr1b2_telemetry.py selftest
          mkdir -p crr1b2
          python3 -u research/drnas_crr1b2_telemetry.py prepare | tee crr1b2/prepare.log
          grep -q '^CRR1B2_PREP_PASS' crr1b2/prepare.log
      - uses: actions/upload-artifact@v4
        with:
          name: crr1b2-frozen-input
          retention-days: 45
          if-no-files-found: error
          path: |
            worldsim-w1-frozen.tar.gz
            history/w4sources/
            checker/drat-trim
            built/bin/kissat_4_0_4
            crr1b2/manifest.json
            crr1b2/pins.json
            crr1b2/prepare.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crr1b2-prepare-diagnostics
          if-no-files-found: warn
          retention-days: 10
          path: crr1b2/
  paired:
    needs: prepare
    name: CRR1B2 original focus 30s 3arm shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: crr1b2-frozen-input
      - name: Paired randomized single-CPU experiment with atomic telemetry snapshots
        run: |
          set -euo pipefail
          tar xzf worldsim-w1-frozen.tar.gz
          chmod +x checker/drat-trim built/bin/kissat_4_0_4
          python3 -u research/drnas_crr1b2_telemetry.py shard --shard ${{ matrix.shard }} | tee crr1b2/shard-${{ matrix.shard }}.log
          grep -q '^CRR1B2_SHARD_PASS' crr1b2/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crr1b2-shard-${{ matrix.shard }}
          retention-days: 45
          if-no-files-found: warn
          path: |
            crr1b2/shard-${{ matrix.shard }}.json
            crr1b2/shard-${{ matrix.shard }}.log
            crr1b2/raw/**/telemetry.json
            crr1b2/raw/**/proof_validation.log
  audit:
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: crr1b2-frozen-input
      - name: Reassemble all four original-SHA paired shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar xzf worldsim-w1-frozen.tar.gz
          chmod +x checker/drat-trim built/bin/kissat_4_0_4
          mkdir -p crr1b2/collected
          gh run download "${{ github.run_id }}" -R Frane12/AndroidGameTest -p 'crr1b2-shard-*' -D crr1b2/collected
          test "$(find crr1b2/collected -type f -name 'shard-*.json' | wc -l)" -eq 4
          find crr1b2/collected -type f -name 'shard-*.json' -exec cp '{}' crr1b2/ \;
          test "$(find crr1b2 -maxdepth 1 -type f -name 'shard-*.json' | wc -l)" -eq 4
      - name: Final source-paired PAR2, timeout telemetry and certificate audit
        run: |
          set -euo pipefail
          python3 -u research/drnas_crr1b2_telemetry.py audit | tee crr1b2/audit.log
          grep -q '^CRR1B2_FINAL' crr1b2/audit.log
          cat crr1b2/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-CRR1B2-FOCUS4-36-PAIRED-TIMEOUT-TELEMETRY-FINAL
          retention-days: 60
          if-no-files-found: warn
          path: |
            crr1b2/report.json
            crr1b2/all-trials.json
            crr1b2/audit.log
            crr1b2/manifest.json
            crr1b2/pins.json
