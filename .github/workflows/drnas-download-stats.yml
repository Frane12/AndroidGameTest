name: DRNAS Release download statistics
on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * *'
permissions:
  contents: write
concurrency:
  group: drnas-download-stats
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect GitHub Release asset counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/drnas_download_stats.py
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/
          git diff --cached --quiet || (git commit -m "stats: update release downloads" && git push)
