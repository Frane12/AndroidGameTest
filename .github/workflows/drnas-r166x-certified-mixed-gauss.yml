name: DRNAS R166x source-certified sparse Gaussian + mixed-CNF 9-way 144 paired benchmark
on:
  push:
    branches: [experiment/drnas-r166x-certified-mixed-gauss-20261106]
    paths:
      - '.github/workflows/drnas-r166x-certified-mixed-gauss.yml'
      - 'research/r166x_component_feedback.cpp'
      - 'research/r166x_component_benchmark.py'
      - 'research/r166x_exact_router_benchmark.py'
      - 'research/r166x_certified_gauss.py'
      - 'research/r164_pure_exact_gf2.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r166x-source-gaussian-8-original-144-pairs
  cancel-in-progress: false
jobs:
  build:
    name: Compile ONCE pinned CaDiCaL and R166X; immutable source and GF2 reasons selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the single common source-locked R166X/CaDiCaL native binary
        run: |
          set -euo pipefail
          mkdir -p r166x
          python3 -m py_compile research/r166x_component_benchmark.py research/r166x_exact_router_benchmark.py research/r166x_certified_gauss.py research/r164_pure_exact_gf2.py research/r157_source_certified_xor.py
          python3 -u research/r166x_certified_gauss.py --selftest | tee r166x/gauss-selftest.log
          grep -q '^R166X_GAUSS_PROOF_SELFTEST_PASS ' r166x/gauss-selftest.log
          git clone -q https://github.com/arminbiere/cadical.git /tmp/r166x-cadical
          cd /tmp/r166x-cadical
          git checkout -q rel-2.1.0
          git rev-parse HEAD > "$GITHUB_WORKSPACE/r166x/cadical-source-commit.txt"
          ./configure
          make -j2
          g++ -std=c++17 -O2 -Wall -Wextra -I./src "$GITHUB_WORKSPACE/research/r166x_component_feedback.cpp" ./build/libcadical.a -o "$GITHUB_WORKSPACE/r166x/r166x-native"
          cd "$GITHUB_WORKSPACE"
          ./r166x/r166x-native selftest | tee r166x/native-selftest.log
          grep -q '^R99_WATCH_SELFTEST_PASS' r166x/native-selftest.log
          grep -q '^R133C_GF2_CLOSURE_SELFTEST_PASS' r166x/native-selftest.log
          grep -q '^R148_DIRECT_SELFTEST_PASS' r166x/native-selftest.log
          grep -q '^R166X_COMPONENT_GATE_SELFTEST_PASS' r166x/native-selftest.log
          grep -q '^R166X_INCREMENTAL_SELFTEST_PASS' r166x/native-selftest.log
          grep -q '^R166X_LAZY_SOURCE_REASON_SELFTEST_PASS' r166x/native-selftest.log
          grep -q '^R166X_COOLDOWN_REAWAKEN_SELFTEST_PASS' r166x/native-selftest.log
          grep -q '^R166X_DERIVED_UNIT_NATIVE_SELFTEST_PASS' r166x/native-selftest.log
          python3 - <<'PY'
          import pathlib,hashlib,json,subprocess
          p=pathlib.Path("r166x/r166x-native")
          obj=dict(binary_sha256=hashlib.sha256(p.read_bytes()).hexdigest(),
            commit=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            cadical_source_commit=pathlib.Path("r166x/cadical-source-commit.txt").read_text().strip(),
            compiler=subprocess.check_output(["g++","--version"],text=True).splitlines()[0])
          pathlib.Path("r166x/build-pin.json").write_text(json.dumps(obj,sort_keys=True,indent=2))
          print("R166X_SINGLE_BINARY_PIN_PASS",json.dumps(obj,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r166x-single-frozen-binary-and-source-commit
          path: |
            r166x/r166x-native
            r166x/build-pin.json
            r166x/cadical-source-commit.txt
            r166x/native-selftest.log
            r166x/gauss-selftest.log
          retention-days: 90
  paired:
    needs: build
    name: Nine-mode ORIGINAL CNF 30s mixed and 5s controls same-binary paired shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r166x-single-frozen-binary-and-source-commit
          path: r166x
      - uses: actions/download-artifact@v4
        with:
          name: r155-original25-pinned-native-and-independent-smoke
          run-id: 42112755104
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r166x
      - name: Enforce SAME precompiled native SHA and record paired CPU source
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          chmod +x r166x/r166x-native
          python3 - <<'PY'
          import pathlib,hashlib,json,os,subprocess
          pin=json.loads(pathlib.Path("r166x/build-pin.json").read_text())
          check=hashlib.sha256(pathlib.Path("r166x/r166x-native").read_bytes()).hexdigest()
          assert check==pin["binary_sha256"],"R166X NATIVE BINARY DRIFT"
          assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==pin["commit"]
          pin["cpu"]=next((v for v in pathlib.Path("/proc/cpuinfo").read_text().splitlines() if v.startswith("model name")),"unknown")
          pin["shard"]=int(os.environ["SHARD"])
          pathlib.Path("r166x/pin-"+os.environ["SHARD"]+".json").write_text(json.dumps(pin,sort_keys=True))
          print("R166X_COMMON_BINARY_SHA_PASS",check,"shard",os.environ["SHARD"])
          PY
      - name: Independently replay original CNF source GF2, short Gaussian row and unit proofs in 9 native modes
        run: |
          set -euo pipefail
          python3 -u research/r166x_component_benchmark.py shard --shard ${{ matrix.shard }} --binary r166x/r166x-native | tee r166x/shard-${{ matrix.shard }}.log
          grep -q '^R166X_SHARD_PASS ' r166x/shard-${{ matrix.shard }}.log
          test -s r166x/shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r166x-causal-shard-${{ matrix.shard }}
          path: |
            r166x/shard-${{ matrix.shard }}.json
            r166x/shard-${{ matrix.shard }}.log
            r166x/pin-${{ matrix.shard }}.json
            r166x/prep-*.json
            r166x/cert-*.json
            r166x/gauss-*/gauss.tsv
            r166x/gauss-*/gauss-units.tsv
            r166x/gauss-*/gauss-cert.json
          if-no-files-found: warn
          retention-days: 90
  pure:
    needs: build
    name: Paired exact-source XOR routing vs native clean CaDiCaL on original 25 input source SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r166x-single-frozen-binary-and-source-commit
          path: r166x
      - uses: actions/download-artifact@v4
        with:
          name: r155-original25-pinned-native-and-independent-smoke
          run-id: 42112755104
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r166x
      - name: Pure source-XOR router and 26 clean-native paired trials with SAT validation
        run: |
          set -euo pipefail
          chmod +x r166x/r166x-native
          python3 research/r164_pure_exact_gf2.py --selftest | tee r166x/pure-selftest.log
          grep -q '^R164_PURE_SELFTEST_PASS' r166x/pure-selftest.log
          python3 - <<'PY'
          import hashlib,json,pathlib
          pin=json.loads(pathlib.Path('r166x/build-pin.json').read_text())
          assert hashlib.sha256(pathlib.Path('r166x/r166x-native').read_bytes()).hexdigest()==pin['binary_sha256']
          print('R166X_ROUTER_NATIVE_PIN_PASS',pin['binary_sha256'])
          PY
          python3 -u research/r166x_exact_router_benchmark.py r166x/r166x-native | tee r166x/router.log
          grep -q '^R166X_ROUTER_FINAL ' r166x/router.log
          test -s r166x/router-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r166x-source-exact-router-26-native-paired
          path: |
            r166x/pure-selftest.log
            r166x/router.log
            r166x/router-report.json
          if-no-files-found: warn
          retention-days: 90
  audit:
    needs: [paired,pure]
    name: Audit 144 SHA-paired source-Gaussian proof, source-unit and CDCL original SHA trials
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r166x-single-frozen-binary-and-source-commit
          path: r166x
      - uses: actions/download-artifact@v4
        with:
          name: r155-original25-pinned-native-and-independent-smoke
          run-id: 42112755104
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r166x
      - uses: actions/download-artifact@v4
        with:
          pattern: r166x-causal-shard-*
          merge-multiple: true
          path: r166x
      - uses: actions/download-artifact@v4
        with:
          name: r166x-source-exact-router-26-native-paired
          path: r166x
      - name: Final source-specific causal and regression correctness audit
        run: |
          set -euo pipefail
          test "$(find r166x -maxdepth 1 -name 'shard-*.json' | wc -l)" -eq 4
          python3 -u research/r166x_component_benchmark.py audit | tee r166x/audit.log
          grep -q '^R166X_FINAL ' r166x/audit.log
          test -s r166x/router-report.json
          python3 - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path('r166x/router-report.json').read_text())
          assert x['status']=='ROUTER_PAIRED_AUDIT_PASS_RESEARCH_ONLY'
          assert x['input_cases']==25 and x['pure_pairs']==26
          print('R166X_INDEPENDENT_PAIRED_ROUTER_REPORT_PASS')
          PY
          python3 - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path("r166x/report.json").read_text())
          with open(pathlib.Path("r166x/report-summary.md"),"w") as f:
           f.write("# DRNAS R166x: mixed CNF source-proven Gaussian vs R165 frozen controls\n\n")
           f.write("8 development SHA CNFs; nine modes; two repetitions; 144 trials; mixed cap 30s.\n\n")
           f.write("| Mode | Solved | PAR2 s | Conflicts | Decisions | GF2 proposals | Full reasons | Gauss units | Multiway rows | Callback ns |\n")
           f.write("|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|\n")
           for key,d in x["summary"]["all"].items():
            f.write(f'| {key} | {d["solved"]}/{d["trials"]} | {d["PAR2_s"]:.4f} | {d["conflicts"]} | {d["decisions"]} | {d["proposed_GF2"]} | {d["completed_reason_clauses"]} | {d["gauss_units"]} | {d["gauss_multiway_selected"]} | {d["propagate_ns"]} |\n')
           f.write("\nRESEARCH ONLY. Same R154 development set; non-blind; source exact XOR parity proof is not LRAT.\n")
          PY
          cat r166x/report-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R166X-CERTIFIED-MIXED-GAUSS-144-PAIRED-AUDIT-FINAL
          path: |
            r166x/report.json
            r166x/audit.log
            r166x/report-summary.md
            r166x/router-report.json
          if-no-files-found: warn
          retention-days: 90
