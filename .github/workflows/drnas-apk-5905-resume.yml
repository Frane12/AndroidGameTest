name: DRNAS APK 5905 RESUME - pinned source manual

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drnas-apk-5905-resume
  cancel-in-progress: false

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout EXACT original queued APK commit 55e0580
        uses: actions/checkout@v4
        with:
          ref: '55e0580a6aac70a9bf240068fc8a9bfc713ab4c8'
          persist-credentials: false
      - name: Verify original source provenance
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "55e0580a6aac70a9bf240068fc8a9bfc713ab4c8"
          echo "Source of original queued APK #5905: 55e0580a6aac70a9bf240068fc8a9bfc713ab4c8" >> "$GITHUB_STEP_SUMMARY"
          echo "Original queued run 43095292320 remains unchanged." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract game source
        run: |
          set -euo pipefail
          unzip -q Zvjezdana-Macka-0.5-Izvorni-Kod.zip
          cp -a cat-game/. .
          test -f src/hr/frane/zvjezdana/MainActivity.java
      - name: Build signed APK
        run: bash build.sh
      - name: Run tests
        run: |
          set -euo pipefail
          mkdir -p build/test-classes
          javac -d build/test-classes src/hr/frane/zvjezdana/GameRules.java tests/RulesTest.java
          java -cp build/test-classes RulesTest
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Zvjezdana-Macka-5905-resume
          path: build/Zvjezdana-Macka-0.5.apk
          if-no-files-found: error
          retention-days: 14
