name: DRNAS ATLAS25 online adaptive CDCL
run-name: ATLAS25 structural B and early progress C vs references 1CPU
on:
  push:
    branches: [experiment/drnas-atlas25-live-cdcl-20261111]
    paths:
      - research/drnas_atlas25_build.py
      - research/drnas_atlas25_benchmark.py
      - .github/workflows/drnas-atlas25-live-cdcl.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Compile frozen C++ generators and ATLAS25 live native engine
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_atlas25_build.py research/drnas_atlas25_benchmark.py
          python3 research/drnas_atlas13_generator.py
          python3 research/drnas_atlas15_warm_patch.py
          python3 research/drnas_atlas15_cdcl_patch.py
          python3 research/drnas_atlas1_generate.py --out mre_atlas15/atlas1_table.hpp
          python3 research/drnas_atlas9_export_table.py research/atlas8_reduction_table.jsonl mre_atlas15/atlas8_rules.hpp
          python3 research/drnas_atlas16_build.py
          python3 research/drnas_atlas17_build.py
          python3 research/drnas_atlas19_build.py
          python3 research/drnas_atlas23_build.py
          python3 research/drnas_atlas24_build.py
          python3 research/drnas_atlas25_build.py
          mkdir -p mre_atlas25/bin
          g++ -std=c++17 -O2 -I mre_atlas25 -I mre_atlas15 mre_atlas25/native.cpp -o mre_atlas25/bin/drnas_atlas25
          mre_atlas25/bin/drnas_atlas25 --selftest
          git clone -q https://github.com/arminbiere/kissat.git /tmp/atlas25-kissat
          git -C /tmp/atlas25-kissat checkout --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          (cd /tmp/atlas25-kissat && ./configure && make -j2)
          cp /tmp/atlas25-kissat/build/kissat mre_atlas25/bin/kissat
          sha256sum mre_atlas25/bin/*
      - uses: actions/upload-artifact@v4
        with:
          name: ATLAS25-BIN
          retention-days: 30
          path: mre_atlas25/bin
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ATLAS25-BIN
          path: mre_atlas25/bin
      - name: Native mode activation and source SAT witness smoke
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y cryptominisat
          python3 -m pip install --break-system-packages -q remotezip
          chmod +x mre_atlas25/bin/*
          taskset -c "$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')" python3 -u research/drnas_atlas25_benchmark.py --cohort smoke | tee smoke.log
          grep '^ATLAS25_FINAL ' smoke.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS25-SMOKE
          retention-days: 30
          path: |
            smoke.log
            mre_atlas25/smoke/results.json
  regression:
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ATLAS25-BIN
          path: mre_atlas25/bin
      - name: regression matched original CNFs 10s E2E single CPU
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y cryptominisat
          python3 -m pip install --break-system-packages -q remotezip
          chmod +x mre_atlas25/bin/*
          taskset -c "$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')" python3 -u research/drnas_atlas25_benchmark.py --cohort regression | tee regression.log
          grep '^ATLAS25_FINAL ' regression.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS25-REGRESSION
          retention-days: 60
          path: |
            regression.log
            mre_atlas25/regression/results.json
  extension:
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ATLAS25-BIN
          path: mre_atlas25/bin
      - name: extension matched original CNFs 12s E2E single CPU
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y cryptominisat
          python3 -m pip install --break-system-packages -q remotezip
          chmod +x mre_atlas25/bin/*
          taskset -c "$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')" python3 -u research/drnas_atlas25_benchmark.py --cohort extension | tee extension.log
          grep '^ATLAS25_FINAL ' extension.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS25-EXTENSION
          retention-days: 60
          path: |
            extension.log
            mre_atlas25/extension/results.json
  fresh:
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ATLAS25-BIN
          path: mre_atlas25/bin
      - name: fresh matched original CNFs 8s E2E single CPU
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y cryptominisat
          python3 -m pip install --break-system-packages -q remotezip
          chmod +x mre_atlas25/bin/*
          taskset -c "$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')" python3 -u research/drnas_atlas25_benchmark.py --cohort fresh | tee fresh.log
          grep '^ATLAS25_FINAL ' fresh.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS25-FRESH
          retention-days: 60
          path: |
            fresh.log
            mre_atlas25/fresh/results.json
  audit:
    needs: [regression, extension, fresh]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ATLAS25-REGRESSION
          path: audits/regression
      - uses: actions/download-artifact@v4
        with:
          name: ATLAS25-EXTENSION
          path: audits/extension
      - uses: actions/download-artifact@v4
        with:
          name: ATLAS25-FRESH
          path: audits/fresh
      - name: Check disjoint SHA and publish all cohorts separately
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee audit.log
          import json,pathlib
          root=pathlib.Path('audits')
          sets=[]
          for cohort,count,cap in [('regression',10,10),('extension',6,12),('fresh',16,8)]:
              d=json.loads((root/cohort/'mre_atlas25'/cohort/'results.json').read_text())
              assert d['cap_s']==cap and len(d['sources'])==count
              assert len(d['rows'])==count*2*8
              shas={s['sha256'] for s in d['sources']}
              assert len(shas)==count and all(not shas.intersection(z) for z in sets)
              sets.append(shas)
              assert all(not r['independent_UNSAT_proof_verified'] for r in d['rows'])
              assert all(r['status']!='SAT_VERIFIED' or r['original_SAT_witness_verified'] for r in d['rows'])
              summary=d['summary']; base=summary['A']['PAR2_reported_s']
              ratios={a:round(base/max(v['PAR2_reported_s'],.000001),4) for a,v in summary.items()}
              print('ATLAS25_AUDIT '+json.dumps(dict(cohort=cohort,sources=count,trials=len(d['rows']),
                A_over_arm_reported_PAR2=ratios,summary=summary),sort_keys=True),flush=True)
          print('ATLAS25_AUDIT_PASS disjoint_cohorts=true single_process=true UNSAT_independent=false')
          PY
          grep '^ATLAS25_AUDIT ' audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ATLAS25-FINAL-AUDIT
          retention-days: 60
          path: audit.log
