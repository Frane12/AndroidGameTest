name: DRNAS T6A — certified GF2 0.40s budget vs T5 1.20s 240 paired
on:
  push:
    branches: [experiment/drnas-t6a-gf2-costgate-20261108]
    paths:
      - .github/workflows/drnas-t6a-gf2-costgate-paired.yml
      - research/ultimate_t6a_fallback.py
      - research/ultimate_t6a_benchmark.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-t6a-costgate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile-check new scripts and frozen source-certified GF2 tests
        run: |
          set -euo pipefail
          python3 -m py_compile research/ultimate_t6a_fallback.py research/ultimate_t6a_benchmark.py
          python3 -u research/ultimate_t5_novel.py
          python3 -u research/ultimate_t2_probe.py
          python3 -u research/r166x_certified_gauss.py --selftest
      - name: Retrieve ORIGINAL immutable T5 SAT source pins and compiled native CaDiCaL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Frane12/AndroidGameTest/actions/runs/42480784137 --jq .conclusion)" = success
          mkdir -p /tmp/drnas-t6a-t5-pins
          gh run download 42480784137 --repo Frane12/AndroidGameTest \
            -n t5-frozen-20originals-pins -D /tmp/drnas-t6a-t5-pins
          cp -a /tmp/drnas-t6a-t5-pins/ultimate_r1 \
                /tmp/drnas-t6a-t5-pins/ultimate_r2 \
                /tmp/drnas-t6a-t5-pins/ultimate_t5 .
          mkdir -p built/bin ultimate_t6a
          cp /tmp/drnas-t6a-t5-pins/built/bin/kissat_4_0_4 built/bin/
          cp /tmp/drnas-t6a-t5-pins/research/ultimate_t5_native.cpp \
             /tmp/drnas-t6a-t5-pins/research/ultimate_t5_benchmark.py research/
          : > ultimate_t6a/empty.tsv
          chmod +x ultimate_r1/source_r153/r153 ultimate_t5/t-native built/bin/kissat_4_0_4 research/ultimate_t6a_fallback.py
          python3 - <<'PY'
          import hashlib,json,pathlib
          digest=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          p=json.loads(pathlib.Path("ultimate_t5/build-pin.json").read_text())
          assert p["source_commit"]=="9e19b29dbaf203392ed54bd8fce324b21cc5d30d"
          assert p["original_manifest_sha"]=="2e6169009e985555e43e81d9b534f3bb307cef93963329694ef42459bef3c2e2"
          assert digest("ultimate_r2/frozen/manifest.json")==p["original_manifest_sha"]
          assert all(digest(f)==h for f,h in p["binaries"].items()),"T5 pinned code or binary drift"
          print("T6A_ORIGINAL_CNFS_AND_FROZEN_CADICAL_PIN_PASS",flush=True)
          PY
          python3 -u research/ultimate_t6a_benchmark.py verify
          python3 -u research/ultimate_t6a_benchmark.py selftest
          ultimate_t5/t-native selftest | tee ultimate_t6a/native-selftest.log
          grep -q '^T5_NOVEL_DERIVED_TRAIL_SELFTEST_PASS' ultimate_t6a/native-selftest.log
      - name: Synthetic original-CNF certified XOR smoke for unchanged T5 and new 0.40s T6A arms
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,subprocess,time
          p=pathlib.Path("ultimate_t6a/smoke-original.cnf")
          clauses=[]
          for vs,rhs in [((1,2,3),0),((1,2,4),1)]:
              for mask in range(8):
                  if mask.bit_count()%2==rhs:continue
                  clauses.append(" ".join(str(-v if mask>>i&1 else v)
                                          for i,v in enumerate(vs))+" 0")
          clauses+=["3 5 0","-4 5 0","3 -5 0","4 5 0"]+["3 5 0"]*52
          p.write_text("p cnf 5 "+str(len(clauses))+"\n"+"\n".join(clauses)+"\n")
          for m in ("t5_novel_shadow","t5_novel_active",
                    "t6a_cap_shadow","t6a_cap_active"):
              env=os.environ.copy()
              env.update(ULTIMATE_T_MODE=m,
                         ULTIMATE_R2_DEADLINE_NS=str(time.monotonic_ns()+12_000_000_000))
              x=subprocess.run(["python3","research/ultimate_t6a_fallback.py",str(p)],
                                env=env,capture_output=True,timeout=13)
              assert x.returncode==10,(m,x.returncode,x.stderr[-1100:],x.stdout[-1400:])
              assert b"T5_NOVEL_PROOF_PASS " in x.stdout,(m,x.stdout[-1200:])
              assert b'"eligible": true' in x.stdout,(m,x.stdout[-1200:])
              assert b"R166X_RESULT mode=" in x.stdout,(m,x.stdout[-1200:])
          print("T6A_040S_CERTIFIED_IMPLICATION_SMOKE_PASS",flush=True)
          PY
      - name: Pin T6A scripts alongside unchanged T5 binary and frozen SHA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          old=json.loads(pathlib.Path("ultimate_t5/build-pin.json").read_text())
          newpaths=("research/ultimate_t6a_fallback.py","research/ultimate_t6a_benchmark.py")
          p=dict(original_t5_run=42480784137,
                 original_t5_source_commit=old["source_commit"],
                 new_commit=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
                 original_manifest_sha=old["original_manifest_sha"],
                 protocol="DRNAS-T6A-20261108-GF2-CERT-COSTCAP-6ARM-PAIRED-v1",
                 source_count=20,reps=2,methods=6,attempts=240,
                 cap_development_s=20,cap_new_to_r1_s=30,seed=11,
                 benchmark_type="development_same_source_not_blind",
                 original_t5_prepass_cap_s=1.2,new_t6a_prepass_cap_s=0.4,
                 native_cadical_same_sha=old["binaries"]["ultimate_t5/t-native"],
                 t6a_files={f:h(f) for f in newpaths},
                 binaries={**old["binaries"], **{f:h(f) for f in newpaths}})
          pathlib.Path("ultimate_t6a/build-pin.json").write_text(json.dumps(p,sort_keys=True,indent=2)+"\n")
          print("T6A_FROZEN_BUILD_PIN_PASS",p["new_commit"],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: t6a-paired-frozen-originals-and-t5-native
          retention-days: 90
          path: |
            ultimate_r1/
            ultimate_r2/
            ultimate_t5/
            ultimate_t6a/
            built/bin/kissat_4_0_4
            research/ultimate_t6a_fallback.py
            research/ultimate_t6a_benchmark.py
            research/ultimate_t5_native.cpp
            research/ultimate_t5_benchmark.py
  paired:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    name: T6A 6-arm source-paired shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: t6a-paired-frozen-originals-and-t5-native
          path: .
      - name: Fail-closed source and binary SHA check
        run: |
          set -euo pipefail
          chmod +x ultimate_r1/source_r153/r153 ultimate_t5/t-native built/bin/kissat_4_0_4 research/ultimate_t6a_fallback.py
          python3 -u research/ultimate_t6a_benchmark.py verify
          python3 - <<'PY'
          import json,pathlib,hashlib,subprocess
          h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          p=json.loads(pathlib.Path("ultimate_t6a/build-pin.json").read_text())
          assert p["new_commit"]==subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          assert p["attempts"]==240 and p["methods"]==6
          assert h("ultimate_r2/frozen/manifest.json")==p["original_manifest_sha"]
          assert h("ultimate_t5/t-native")==p["native_cadical_same_sha"]
          assert all(h(f)==x for f,x in p["t6a_files"].items())
          print("T6A_SHA_AND_BINARY_IDENTITY_PASS")
          PY
      - name: Six-arm paired unchanged T5 versus budget-limited T6A
        run: |
          set -euo pipefail
          python3 -u research/ultimate_t6a_benchmark.py shard --shard ${{ matrix.shard }} | tee ultimate_t6a/shard-${{ matrix.shard }}.log
          grep -q '^ULTIMATE_T2_SHARD_PASS' ultimate_t6a/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t6a-shard-${{ matrix.shard }}
          retention-days: 90
          path: |
            ultimate_t6a/shard-${{ matrix.shard }}.json
            ultimate_t6a/shard-${{ matrix.shard }}.log
  audit:
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: t6a-paired-frozen-originals-and-t5-native
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: t6a-shard-*
          merge-multiple: true
          path: ultimate_t6a
      - name: FINAL audit all original SHA source-pairs, SAT witness, GF2 replay route, PAR2
        run: |
          set -euo pipefail
          test "$(find ultimate_t6a -maxdepth 1 -name 'shard-*.json' | wc -l)" -eq 5
          python3 -u research/ultimate_t6a_benchmark.py audit | tee ultimate_t6a/audit.log
          grep -q '^ULTIMATE_T2_FINAL' ultimate_t6a/audit.log
          grep -q 'DRNAS_T6A_COSTCAP_FINAL_PASS_NONBLIND' ultimate_t6a/audit.log
          cat ultimate_t6a/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-T6A-COSTGATE-240-PAIRED-FINAL
          retention-days: 90
          path: |
            ultimate_t6a/report.json
            ultimate_t6a/all-trials.json
            ultimate_t6a/all-trials.csv
            ultimate_t6a/summary.md
            ultimate_t6a/audit.log
