name: DRNAS NP Lab NeuroFlow v0.3 exact benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - 'DRNAS_NP_Crypto_Benchmark/neuroflow_v03.py'
      - 'DRNAS_NP_Crypto_Benchmark/test_neuroflow_v03.py'
      - 'DRNAS_NP_Crypto_Benchmark/benchmark_neuroflow_v03.py'
      - '.github/workflows/drnas-np-neuroflow-v03.yml'
permissions:
  contents: read
jobs:
  neuroflow-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CryptoMiniSat and check version
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cryptominisat
          cryptominisat5 --version
      - name: Exact mathematical correctness
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          python drnas_np_lab.py test
          python test_v02.py
          python test_neuroflow_v03.py
      - name: Independent SATLIB inputs with original SHA256 provenance
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          python fetch_satlib.py --dir external_cases
          test "$(($(wc -l < external_cases/manifest.csv)-1))" -eq 160
      - name: Compare 160 public SATLIB CNFs plus 24 constructed controls
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: python -u benchmark_neuroflow_v03.py
      - name: Show summary
        if: always()
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          if test -f neuroflow_results/summary.csv; then cat neuroflow_results/summary.csv; fi
          if test -f neuroflow_results/policy_counters.json; then cat neuroflow_results/policy_counters.json; fi
      - name: Store original source provenance and matched raw measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-neuroflow-v03-ab
          path: |
            DRNAS_NP_Crypto_Benchmark/external_cases/manifest.csv
            DRNAS_NP_Crypto_Benchmark/external_cases/archives.sha256
            DRNAS_NP_Crypto_Benchmark/neuroflow_results/
          if-no-files-found: warn
