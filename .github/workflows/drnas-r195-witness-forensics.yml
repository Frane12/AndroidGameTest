name: DRNAS R195 invalid witness - certified XOR stress forensics
on:
  push:
    branches: [experiment/drnas-r195-sat-witness-forensics-20261108]
    paths:
      - 'research/r195_sat_witness_forensics.py'
      - '.github/workflows/drnas-r195-witness-forensics.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Obtain exact R195 frozen original and compiled CMS binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcryptominisat5-5.11t64
          mkdir -p r195
          gh run download 42478671195 --repo Frane12/AndroidGameTest -n r195-frozen-verified-sources-binary -D r195
          sha256sum -c r195/native-binary.sha256
          sha256sum -c r195/manifest.sha256
          chmod +x r195/r195_native
          python3 -u research/r195_native_cms_benchmark.py verify
      - name: Replay original official SAT SHA with zero to 48 derived source-certified XOR rows
        run: |
          set -euo pipefail
          python3 -u research/r195_sat_witness_forensics.py | tee r195/forensics.log
          grep -q '^R195_FORENSICS_FINISH' r195/forensics.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R195-INVALID-WITNESS-FORENSICS
          retention-days: 30
          path: |
            r195/forensics.log
            r195/forensics-report.json
            r195/forensics-evidence.json
            r195/forensics-source.tsv
            r195/forensics-derived.tsv
