name: DRNAS R33 official implication streaming shadow audit
on:
  push:
    branches: [experiment/drnas-r33-implication-streaming-20261103]
    paths:
      - '.github/workflows/drnas-r33-implication-shadow.yml'
      - 'experiments/drnas_v16/r33_implication_shadow.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile experiments/drnas_v16/r33_implication_shadow.py
      - uses: actions/download-artifact@v4
        with:
          name: r32-official-verified14-and-diagnostics
          run-id: 41623227197
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: official
      - name: Verify original official CNF hashes and execute bounded read-only scan
        run: |
          set -euo pipefail
          (cd official && sha256sum -c originals.sha256)
          python3 -u experiments/drnas_v16/r33_implication_shadow.py --inputs official --out r33-shadow.json | tee r33-live.log
          test -s r33-shadow.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R33-IMPLICATION-SHADOW-14-OFFICIAL
          path: |
            r33-shadow.json
            r33-live.log
            official/manifest.json
          if-no-files-found: warn
          retention-days: 90
