name: DRNAS R153 R160 real60 then hard180
on:
  push:
    branches: [experiment/drnas-r153-real60-hard180-20261112]
    paths:
      - '.github/workflows/drnas-r153-long-context.yml'
      - 'research/drnas_r153_long_context*'
      - 'research/drnas_r153_real_context.py'
      - 'research/drnas_r28_native_main.cpp'
      - 'research/drnas_r28_native_build.py'
      - 'research/drnas_r28_context_memory.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r153-real60-hard180
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: drnas-context-memory-v1
          run-id: 43170837571
          github-token: ${{ github.token }}
          path: drnas_memory
      - uses: actions/download-artifact@v4
        with:
          name: r52-three-pinned-solvers
          run-id: 41684183452
          github-token: ${{ github.token }}
          path: built/bin
      - uses: actions/download-artifact@v4
        with:
          name: math14-real24-compact
          run-id: 43161813420
          github-token: ${{ github.token }}
          path: real24_source
      - name: Build identical algorithms with 300s budget support
        run: |
          set -euo pipefail
          python3 research/drnas_r28_context_restore.py validate
          (cd built/bin && sha256sum -c binaries.sha256)
          python3 research/drnas_r28_native_build.py
          python3 research/drnas_r28_context_build.py
          python3 research/drnas_r28_native_selftest.py
          python3 research/drnas_r28_context_selftest.py
          python3 research/drnas_r153_long_context.py selftest
          PYTHONPATH=research python3 - <<'PY'
          import pathlib,subprocess,tempfile
          from drnas_r28_context_memory import Memory,solve
          with tempfile.TemporaryDirectory() as d:
            p=pathlib.Path(d)/'original.cnf'
            p.write_text('p cnf 3 3\n1 2 0\n-2 3 0\n-3 0\n')
            m=Memory(pathlib.Path(d)/'memory.sqlite')
            for binary in ('mre_r28_native/drnas_r28_native','mre_r28_context/drnas_r28_context'):
              for cap in (60,180,300):
                r,out=solve(m,p,'eval',cap,binary=binary)
                assert r['verified'],(binary,cap,r,out)
              r=subprocess.run([binary,str(p),'--time','301'],capture_output=True,text=True)
              assert r.returncode==2
            m.close()
          print('R153_LONG_BUDGET_SMOKE_PASS 60s_180s_300s_accepted=true 301s_rejected=true')
          PY
      - name: Freeze the same twelve original source hashes
        run: |
          set -euo pipefail
          python3 -m venv .realvenv
          .realvenv/bin/pip install remotezip
          .realvenv/bin/python research/drnas_r153_long_context.py prepare
          sha256sum mre_r28_native/drnas_r28_native mre_r28_context/drnas_r28_context built/bin/kissat_4_0_4 built/bin/cadical_3_0_1 > r153_real_context/binaries.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: r153-long-frozen-inputs
          path: |
            r153_real_context/
            drnas_memory/
            mre_r28_native/drnas_r28_native
            mre_r28_context/drnas_r28_context
            built/bin/kissat_4_0_4
            built/bin/cadical_3_0_1
          retention-days: 30
  paired:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0,1,2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r153-long-frozen-inputs
          path: .
      - name: Verify identical binaries and memory; install one-thread CMS
        run: |
          set -euo pipefail
          chmod +x mre_r28_native/drnas_r28_native mre_r28_context/drnas_r28_context built/bin/kissat_4_0_4 built/bin/cadical_3_0_1
          sha256sum -c r153_real_context/binaries.sha256
          python3 research/drnas_r28_context_restore.py validate
          sudo apt-get update -qq
          sudo apt-get install -y -qq cryptominisat
          mkdir -p r153_long_context/shard-${{ matrix.shard }}
          lscpu > r153_long_context/shard-${{ matrix.shard }}/cpu.txt
          dpkg-query -W cryptominisat > r153_long_context/shard-${{ matrix.shard }}/cms-version.txt
          sha256sum /usr/bin/cryptominisat5 > r153_long_context/shard-${{ matrix.shard }}/cms.sha256
          python3 research/drnas_r153_real_context.py --smoke --db /tmp/long-smoke/memory.sqlite
      - name: Four paired sources at 60s; unresolved-by-all subset at 180s
        run: |
          set -euo pipefail
          python3 -u research/drnas_r153_long_context.py run --shard ${{ matrix.shard }} | tee r153_long_context/shard-${{ matrix.shard }}/live.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r153-long-shard-${{ matrix.shard }}
          path: r153_long_context/
          retention-days: 60
  audit:
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r153-long-frozen-inputs
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: r153-long-shard-*
          merge-multiple: true
          path: r153_long_context
      - name: Audit complete pairs and report 60s and 180s separately
        run: |
          set -euo pipefail
          python3 research/drnas_r153_long_context.py audit
      - uses: actions/upload-artifact@v4
        with:
          name: r153-real60-hard180-final
          path: |
            r153_long_context/final.json
            r153_long_context/aggregate-*/report.json
            r153_real_context/manifest.json
            r153_real_context/binaries.sha256
          retention-days: 60
