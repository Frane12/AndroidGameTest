name: DRNAS MRE11 — cancel only redundant L35 run 42514653311
on:
  push:
    branches: [experiment/drnas-mre11-easy-20261108]
    paths: ['.github/workflows/drnas-mre11-cancel-redundant.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  cancel_only_duplicate:
    name: Stop ONLY redundant L35 run 42514653311, keep 42514613031
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel exact redundant run ID, never the original 35s benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET=42514653311
          KEEP=42514613031
          test "$TARGET" != "$KEEP"
          status=$(gh run view "$TARGET" -R Frane12/AndroidGameTest --json status --jq .status)
          echo "REDUNDANT_L35_CURRENT_STATUS $status"
          if [ "$status" = "completed" ]; then
            echo "REDUNDANT_L35_ALREADY_COMPLETED"
          else
            gh run cancel "$TARGET" -R Frane12/AndroidGameTest
            echo "REDUNDANT_L35_CANCEL_REQUESTED $TARGET"
          fi
          echo "ORIGINAL_L35_PRESERVED $KEEP"
