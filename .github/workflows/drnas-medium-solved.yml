name: DRNAS preparation change on easy-medium solved originals
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-preparation-medium-solved
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 43587320318
          name: delta3-proof-first-preflight
          github-token: ${{ github.token }}
          path: frozen/delta3
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 43593699141
          name: delta4x-proof-first-frozen
          github-token: ${{ github.token }}
          path: frozen/delta4x
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 43396550073
          name: drnas-x52-original100-frozen-source-bytes
          github-token: ${{ github.token }}
          path: frozen/original100
      - name: Restore original bytes and build pinned source
        run: |
          set -euo pipefail
          tar -xzf frozen/delta3/delta3_bench_frozen.tgz
          tar -xzf frozen/delta4x/delta4x_bench_frozen.tgz
          sha256sum -c build/DELTA3_FROZEN.sha256
          sha256sum -c build/DELTA4X_FROZEN.sha256
          mkdir -p medium_sources
          cp frozen/original100/x52_original100/070.cnf medium_sources/070.cnf
          python3 research/drnas_delta4x/build.py
          python3 research/drnas_nl_solved/build.py
          g++ --version > medium_compiler.txt
      - name: Validate and compare on one CPU with native pairs adjacent
        run: |
          set -euo pipefail
          python3 research/drnas_nl_solved/validate.py
          BIN_SHA="$(sha256sum build/drnas-nl-solved | cut -d' ' -f1)"
          python3 -u research/drnas_nl_solved/medium.py --expected-binary-sha "$BIN_SHA" --reps 10 --out medium_ci | tee medium_ci.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medium-solved-preparation-results
          retention-days: 60
          path: |
            medium_ci/
            medium_ci.log
            medium_compiler.txt
            nl_solved_validation.json
