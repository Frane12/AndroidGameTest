name: DRNAS SAT validate analytic provenance metadata correction
on:
  push:
    branches: [experiment/drnas-v1531-relations-audit-20261101]
    paths: [.github/workflows/drnas-v1531-validation-provenance-fix.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Correct only historical dataset metadata; never modify measurements
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sqlite3
          from pathlib import Path
          root=Path("research/sat-analytics-data/relations-validation")
          r=json.loads((root/"results.json").read_text())
          ds=r["dataset_meta"]
          assert len(r["manifest"])==40 and len(r["results"])==40
          assert sum(len(x["runs"]) for x in r["results"])==80
          assert ds["source_run"]=="41343735998"
          assert ds["source_sha"]=="88982f5d1ecd0ab743fba7a5953ebe9e02b0b819"
          db=sqlite3.connect(root/"sat_analytics.sqlite")
          dataset="DRNAS-V1531-Structural-UUF250-Validation"
          assert db.execute("SELECT COUNT(*) FROM attempts").fetchone()[0]==4376
          assert db.execute("SELECT COUNT(*) FROM attempts WHERE dataset=?",(dataset,)).fetchone()[0]==80
          db.execute("UPDATE datasets SET source_run=?, source_sha=?, runner=? WHERE dataset=?",
                     (ds["source_run"],ds["source_sha"],ds["runner"],dataset))
          assert db.execute("SELECT source_run FROM datasets WHERE dataset=?",(dataset,)).fetchone()[0]==ds["source_run"]
          assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          db.commit();db.close()
          path=root/"summary.json"
          summary=json.loads(path.read_text())
          found=[x for x in summary["datasets"] if x["dataset"]==dataset]
          assert len(found)==1
          found[0]["source_run"]=ds["source_run"]
          found[0]["source_sha"]=ds["source_sha"]
          found[0]["runner"]=ds["runner"]
          path.write_text(json.dumps(summary,indent=2)+"\n")
          audit={"correction":"metadata only","source_run":ds["source_run"],
                 "source_sha":ds["source_sha"],"dataset":dataset,
                 "original_raw_artifact_run":"41343735998",
                 "reason":"Original validation JSON left source_run blank; first cumulative importer incorrectly inherited baseline source_run.",
                 "attempts_before_and_after":4376,
                 "validation_attempts_before_and_after":80,
                 "sql_integrity":"ok"}
          (root/"provenance_correction.json").write_text(json.dumps(audit,indent=2)+"\n")
          print("PROVENANCE_FIXED",json.dumps(audit,sort_keys=True))
          PY
      - name: Version provenance correction without rerunning SAT benchmark
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/sat-analytics-data/relations-validation/
          if ! git diff --cached --quiet; then
            git commit -m "data: correct UUF250 validation source-run metadata, no measurement changes [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
