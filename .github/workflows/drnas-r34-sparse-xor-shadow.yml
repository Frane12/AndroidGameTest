name: DRNAS R34 sparse XOR implication shadow official 2026
on:
  push:
    branches: [experiment/drnas-r34-certified-xor-relations-20261103]
    paths:
      - '.github/workflows/drnas-r34-sparse-xor-shadow.yml'
      - 'experiments/drnas_v16/r34_sparse_xor_shadow.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile experiments/drnas_v16/r34_sparse_xor_shadow.py
      - uses: actions/download-artifact@v4
        with:
          name: r32-official-verified14-and-diagnostics
          run-id: 41623227197
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: official
      - name: Verify original CNF SHA and run bounded sparse GF2 shadow
        run: |
          set -euo pipefail
          (cd official && sha256sum -c originals.sha256)
          python3 -u experiments/drnas_v16/r34_sparse_xor_shadow.py --inputs official --out r34-results.json | tee r34-live.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R34-SPARSE-XOR-SHADOW-14-OFFICIAL
          path: |
            r34-results.json
            r34-live.log
          if-no-files-found: warn
          retention-days: 90
