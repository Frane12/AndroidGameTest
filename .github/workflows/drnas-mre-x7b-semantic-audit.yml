name: DRNAS MRE X7B — normalized native watched-clause and LBD causal audit
on:
  push:
    branches: [experiment/drnas-mre-x7-native-watch-learn-trace-20261109]
    paths: ['.github/workflows/drnas-mre-x7b-semantic-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  trace-audit:
    name: Re-audit exact X7 native traces without comparing allocation-only IDs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download immutable X7 final 96 E2E 576 bounded trace records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p mre_x7
          gh run download 42556906957 -R Frane12/AndroidGameTest \
            -n DRNAS-MRE-X7-CMS-NATIVE-WATCH-LBD-96-E2E-576-BOUNDED \
            -D mre_x7
          ls -lh mre_x7/trace-*.json mre_x7/x7-final.json
          python3 -m py_compile research/mre_x7b_semantic_trace_audit.py
          python3 -u research/mre_x7b_semantic_trace_audit.py | tee mre_x7/semantic-audit.log
          grep -q '^MRE_X7B_FINAL' mre_x7/semantic-audit.log
          grep '^MRE_X7B_FINAL' mre_x7/semantic-audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-MRE-X7B-NORMALIZED-FIRST-SEMANTIC-DIVERGENCE
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_x7/semantic-causal-audit.json
            mre_x7/semantic-audit.log
