name: DRNAS ARL1C two frozen SATLIB formulas
run-name: ARL1C uf20 and uf50 trace native Kissat CaDiCaL
on:
  push:
    branches: [experiment/drnas-arl1c-blind-holdout-20261111]
    paths:
      - research/drnas_arl1c_bench.py
      - research/drnas_arl1b.cpp
      - research/drnas_arl1a.cpp

      - research/drnas_native_core_r3c.cpp
      - .github/workflows/drnas-arl1c.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  micro:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install compiler and reference solver
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_arl1c_bench.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cadical
      - name: Build pinned Kissat
        run: |
          set -euo pipefail
          mkdir -p mre_arl1c/bin
          git clone --quiet https://github.com/arminbiere/kissat.git mre_arl1c/kissat-src
          git -C mre_arl1c/kissat-src checkout --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          (cd mre_arl1c/kissat-src && ./configure && make -j2)
          install -m 755 mre_arl1c/kissat-src/build/kissat mre_arl1c/bin/kissat
          install -m 755 "$(command -v cadical)" mre_arl1c/bin/cadical
      - name: Build original DRNAS and 500-event tracer
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 research/drnas_arl1b.cpp -o mre_arl1c/bin/drnas_b
          g++ -std=c++17 -O2 research/drnas_arl1a.cpp -o mre_arl1c/bin/drnas_a
          g++ -std=c++17 -O2 research/drnas_native_core_r3c.cpp -o mre_arl1c/bin/selftest
          mre_arl1c/bin/selftest --selftest
      - name: Run SHA-locked formula with native trace and references
        env:
          MICRO_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          taskset -c "$(taskset -pc $$ | sed 's/.*: //' | cut -d, -f1 | cut -d- -f1)" python3 -u research/drnas_arl1c_bench.py | tee mre_arl1c/benchmark.log
          grep '^MICRO_FINAL ' mre_arl1c/benchmark.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-ARL1C-SHARD-${{ matrix.shard }}-AUDIT
          retention-days: 30
          path: |
            mre_arl1c/audit.json
            mre_arl1c/source.json
            mre_arl1c/*.cnf
            mre_arl1c/*.log
            mre_arl1c/route_decision.json


