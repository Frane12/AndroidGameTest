name: DRNAS R32u audit previously completed five official CDCL XOR trials
on:
  push:
    branches: [experiment/drnas-r32u-audit-existing-5case-20261103]
    paths:
      - '.github/workflows/drnas-r32u-audit-existing-five.yml'
      - 'experiments/drnas_v16/r32u_native_active_xor_benchmark.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    name: Validate original 15 trial artifacts WITHOUT rerunning a SAT benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check report source syntax
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/r32u_native_active_xor_benchmark.py
      - uses: actions/download-artifact@v4
        with:
          name: r32u-exact-five-official-2026-inputs
          run-id: 41683024261
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: r32u-shard-*
          run-id: 41683024261
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: combined
      - name: Audit 15 ORIGINAL trials and five immutable official SAT 2026 SHA formulas
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c original.sha256)
          python3 -u experiments/drnas_v16/r32u_native_active_xor_benchmark.py aggregate \
            --inputs frozen --combined combined \
            --output r32u-final.json --report r32u-final.md
          python3 - <<'PY'
          import json
          a=json.load(open("r32u-final.json"))
          assert a["summary"]["active"]["native_reason_events"]>=17
          assert a["summary"]["active"]["solved"]==1
          assert a["summary"]["passive"]["solved"]==1
          assert len(a["rows"])==15
          print("R32U_75S_FIVE_ORIGINAL_REAL2026_FINAL_AUDIT_PASS",
                a["summary"])
          PY
          cat r32u-final.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-R32U-15-ORIGINAL-SATCOMP2026-FINAL-VERIFIED
          path: |
            r32u-final.json
            r32u-final.md
            frozen/manifest.json
          if-no-files-found: error
