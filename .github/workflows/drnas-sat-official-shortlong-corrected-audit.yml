name: DRNAS SAT Official 2026 — corrected 360-trial audit (NO solver reruns)
on:
  push:
    branches: [experiment/drnas-sat-official-shortlong-audit-fix-20261031]
    paths:
      - '.github/workflows/drnas-sat-official-shortlong-corrected-audit.yml'
      - 'research/drnas-sat-v7-8/official_shortlong_predict_corrected.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Get original frozen 18-input manifest, not new training samples
        uses: actions/download-artifact@v4
        with:
          name: official-shortlong-frozen-manifest
          run-id: 41231153158
          github-token: ${{ github.token }}
          path: original_manifest
      - name: Get all six original finished jobs without recomputation
        uses: actions/download-artifact@v4
        with:
          pattern: official-shortlong-shard-*
          run-id: 41231153158
          github-token: ${{ github.token }}
          path: combined-official
      - name: Validate 360 actual trials and train-only predictor then untouched holdout
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/official_shortlong_predict_corrected.py
          python3 -u research/drnas-sat-v7-8/official_shortlong_predict_corrected.py combined-official
          cat official_shortlong_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-Official2026-18CNF-360Runs-Predictor-FINAL-Corrected
          path: |
            official_shortlong_report.md
            official_shortlong_prediction.json
          if-no-files-found: warn
