name: DRNAS MRE4 — pinned CMS live two-clause watch-ID telemetry
on:
  push:
    branches: [experiment/drnas-mre4-cms-watch-id-trace-20261108]
    paths:
      - '.github/workflows/drnas-mre4-cms-watch-trace.yml'
      - 'research/mre4_patch_cms.py'
      - 'research/mre4_trace_pilot.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-mre4-cms-watch-id-20261108
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify SHA-locked original, proof replay and experiment design
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m py_compile research/mre4_trace_pilot.py research/mre4_patch_cms.py
          python3 -u research/mre1_cross_representation.py selftest
          python3 -u research/mre2_impact_gate.py selftest
          python3 -u research/mre4_trace_pilot.py selftest
          mkdir -p mre4
          gh run download 42486847349 --repo Frane12/AndroidGameTest -n mre3-inputs -D .
          sha256sum -c mre3_p1/manifest.sha256
          python3 -u research/r195_native_cms_benchmark.py verify
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'research')
          import mre4_trace_pilot as p
          p.setup()
          PY
          sha256sum r195/frozen/manifest.json > mre4/manifest.sha256
      - name: Clone and pin exact CMS 5.11.15 source and apply strict watch-ID patch
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++ libgmp-dev libcryptominisat5-dev
          git clone --quiet --depth 1 --branch 5.11.15 --single-branch https://github.com/msoos/cryptominisat.git cms-pinned
          ACTUAL_SHA="$(git -C cms-pinned rev-parse HEAD)"
          echo "CMS_UPSTREAM_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "3b709118fd08eb1d15f25e0e239dbc596f967b60"
          python3 -u research/mre4_patch_cms.py cms-pinned research/mre4_native_bridge.cpp
          cmake -S cms-pinned -B cms-build -GNinja -DCMAKE_BUILD_TYPE=Release -DONLY_SIMPLE=ON -DBUILD_SHARED_LIBS=ON -DNOZLIB=ON -DENABLE_TESTING=OFF
          cmake --build cms-build --target cryptominisat5 --parallel 4
          mkdir -p mre4/lib
          LIB_FILE="$(find cms-build -type f -name 'libcryptominisat5.so*' | head -n 1)"
          test -n "$LIB_FILE"
          # Preserve the pinned library's actual DT_SONAME, not just the linker name.
          cp "$LIB_FILE" mre4/lib/libcryptominisat5.so.5.11
          cp "$LIB_FILE" mre4/lib/libcryptominisat5.so
          g++ -std=c++17 -O2 -Wall -Wextra -Werror research/mre4_native_bridge.cpp -L"$PWD/mre4/lib" -lcryptominisat5 -Wl,-rpath,'$ORIGIN/lib' -o mre4/native
          nm -D mre4/lib/libcryptominisat5.so | grep 'drnas_trace_'
          ldd mre4/native | grep "$PWD/mre4/lib/libcryptominisat5.so"
          sha256sum mre4/native mre4/lib/libcryptominisat5.so.5.11 > mre4/binaries.sha256
      - name: Watch-ID smoke — genuine marked binary clause gives live unit
        run: |
          set -euo pipefail
          cat > mre4/smoke.cnf <<'EOF'
          p cnf 3 2
          2 3 0
          1 2 0
          EOF
          : > mre4/empty.tsv
          DRNAS_ORIG_COUNT=2 DRNAS_TAG_0="1,2" DRNAS_TAG_1="3,-2" mre4/native mre4/smoke.cnf mre4/empty.tsv mre4/empty.tsv cms_native 11 | tee mre4/smoke.log
          grep -q '^DRNAS_TRACE_INPUT marked0=1 marked1=0 ' mre4/smoke.log
          grep -q '^DRNAS_TRACE tag=0 attached=1 ' mre4/smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: mre4-inputs
          retention-days: 3
          compression-level: 6
          path: |
            r195/frozen/
            mre4/native
            mre4/lib/libcryptominisat5.so.5.11
            mre4/binaries.sha256
            mre4/manifest.sha256
  paired:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [0,1]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mre4-inputs
          path: .
      - name: Verify native binary, instrumented CMS and original CNF SHA
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgmp10
          sha256sum -c mre4/binaries.sha256
          sha256sum -c mre4/manifest.sha256
          chmod +x mre4/native
          ldd mre4/native | grep "$PWD/mre4/lib/libcryptominisat5.so"
          python3 -u research/r195_native_cms_benchmark.py verify
      - name: Compare 2 real tagged binary CRR clauses with native CDCL watch events
        run: |
          set -euo pipefail
          python3 -u research/mre4_trace_pilot.py shard --seed ${{ matrix.seed }} --binary mre4/native | tee mre4/seed-${{ matrix.seed }}.log
          grep -q '^MRE4_SHARD_PASS ${{ matrix.seed }} 12$' mre4/seed-${{ matrix.seed }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mre4-seed-${{ matrix.seed }}
          retention-days: 7
          path: |
            mre4/seed-${{ matrix.seed }}.json
            mre4/seed-${{ matrix.seed }}.log
  audit:
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mre4-inputs
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: mre4-seed-*
          merge-multiple: true
          path: mre4
      - name: Audit tagged events, source and paired wall times
        run: |
          set -euo pipefail
          sha256sum -c mre4/manifest.sha256
          python3 -u research/mre4_trace_pilot.py audit | tee mre4/audit.log
          cat mre4/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-MRE4-TAGGED-CDCL-FINAL
          retention-days: 30
          path: |
            mre4/report.json
            mre4/audit.log
