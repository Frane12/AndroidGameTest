name: DRNAS XORBLIND1 SOURCE FREEZE (no solver)
on:
  push:
    branches: [experiment/drnas-sat-unified-xorblind1-20261115]
    paths:
      - research/xor_blind1/freeze.py
      - .github/workflows/drnas-xorblind1-freeze.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drnas-xorblind1-freeze-20261115
  cancel-in-progress: false
jobs:
  freeze_sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Freeze unseen SHA-distinct sources before running ANY solver
        run: |
          set -euo pipefail
          python3 -m py_compile research/xor_blind1/freeze.py
          python3 -u research/xor_blind1/freeze.py
          tar -czf xor-blind1-source-freeze.tgz xor_blind1_inputs/
          sha256sum xor-blind1-source-freeze.tgz xor_blind1_inputs/manifest.json \
            research/xor_blind1/freeze.py
          find xor_blind1_inputs/cnf -maxdepth 1 -name '*.cnf' | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: xorblind1-frozen-source-100
          path: |
            xor-blind1-source-freeze.tgz
            xor_blind1_inputs/manifest.json
          if-no-files-found: error
          retention-days: 60
