name: DRNAS SAT SQLite append X22 X23 certified 108 paired original SHA E2E
on:
  push:
    branches: [experiment/drnas-analytics-x22-x23-certified-20261109]
    paths:
      - 'research/sat-analytics-data/ingest_x22_x23_certified_20261109.py'
      - '.github/workflows/drnas-analytics-x22-x23-certified.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: drnas-analytics-x22-x23-certified-20261109
  cancel-in-progress: false
jobs:
  append:
    name: Source-verified GF2 proofs and 108 X22 X23 E2E append to immutable historical SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true, fetch-depth: 1}
      - name: Verify X19 X21 persisted exact SQLite parent and code syntax
        run: |
          set -euo pipefail
          echo 'aef24c8a5bce652d6286f2af75478c5005e58ffa26621ba2d8285c1cd8be0429  research/sat-analytics-data/current/sat_analytics.sqlite' | sha256sum -c -
          python3 -m py_compile research/sat-analytics-data/ingest_x22_x23_certified_20261109.py
      - name: Restore completed X22 X23 final audited reports only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source-audits/x22 source-audits/x23
          gh run download 42593932547 -R Frane12/AndroidGameTest -n DRNAS-X22-EXACT-PROJECTION-60-E2E-FINAL -D source-audits/x22
          gh run download 42594952189 -R Frane12/AndroidGameTest -n DRNAS-X23-SOURCE-CERTIFIED-48-E2E-FINAL -D source-audits/x23
      - name: Append exactly 108 E2E with source SHA proof metadata and immutable previous tables
        run: |
          set -euo pipefail
          python3 -u research/sat-analytics-data/ingest_x22_x23_certified_20261109.py | tee /tmp/x22-x23-sql.log
          grep -q '^X22_X23_SQL_FINAL ' /tmp/x22-x23-sql.log
          DB=research/sat-analytics-data/current/sat_analytics.sqlite
          sha256sum "$DB" | cut -d ' ' -f1 > "$DB.sha256"
          gzip -n -c "$DB" > "$DB.gz"
      - name: Persist new verified SQLite only on analytics experiment branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/sat-analytics-data/current/sat_analytics.sqlite
          git add -f research/sat-analytics-data/current/sat_analytics.sqlite.gz
          git add research/sat-analytics-data/current/sat_analytics.sqlite.sha256
          git add research/sat-analytics-data/current/refresh_x22_x23_20261109_audit.json
          git commit -m "data(analytics): append 108 audited X22 X23 exact-projection and proof-first E2E"
          git push origin HEAD:experiment/drnas-analytics-x22-x23-certified-20261109
          echo X22_X23_SQL_CERTIFIED_PERSISTED
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-SQL-X22-X23-108-AUDITED-FINAL
          retention-days: 30
          path: |
            research/sat-analytics-data/current/refresh_x22_x23_20261109_audit.json
            research/sat-analytics-data/current/sat_analytics.sqlite.sha256
            /tmp/x22-x23-sql.log
