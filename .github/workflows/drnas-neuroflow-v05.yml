name: DRNAS NeuroFlow v0.5 — held-out structural policy
on:
  push:
    paths:
      - 'DRNAS_NP_Crypto_Benchmark/nf_v05_*.py'
      - '.github/workflows/drnas-neuroflow-v05.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neuroflow-v05:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference CryptoMiniSat
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cryptominisat
          cryptominisat5 --version
      - name: Regression of existing exact solvers
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          python drnas_np_lab.py test
          python test_neuroflow_v03.py
      - name: Tiny exhaustive check for all v0.5 routes
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          python - <<'PY'
          from itertools import product
          import random
          from drnas_np_lab import normalize,check
          from nf_v05_structural import solve_strategy,fit
          rng=random.Random(271828)
          for n in range(2,9):
              for t in range(55):
                  cs=normalize(n,[tuple(v if rng.getrandbits(1) else -v for v in rng.sample(range(1,n+1),rng.randrange(0,min(n,3)+1))) for _ in range(15)])
                  expected='SAT' if any(check(cs,bits) for bits in product((False,True),repeat=n)) else 'UNSAT'
                  for variant in ('base','always','learned'):
                      res=solve_strategy(n,cs,variant,threshold=.30,budget=1.0)
                      assert res.status==expected,(n,t,variant,expected,res)
                      if res.status=='SAT': assert check(cs,res.model)
          print('PASS 385 exhaustive small formulas x 3 strategies')
          PY
      - name: Download original SATLIB and enforce source-disjoint holdout
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          python nf_v05_fetch.py
          test "$(($(wc -l < nf05_train_satlib/manifest.csv)-1))" -eq 160
          test "$(($(wc -l < nf05_holdout_satlib/manifest.csv)-1))" -eq 160
      - name: Train once, freeze policy, evaluate on unseen cases
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          python -u nf_v05_benchmark.py
      - name: Show actual measured summary
        if: always()
        working-directory: DRNAS_NP_Crypto_Benchmark
        run: |
          if test -f nf05_results/summary.csv; then cat nf05_results/summary.csv; fi
          if test -f nf05_results/frozen_policy.json; then python -c 'import json;print({k:v["threshold"] for k,v in json.load(open("nf05_results/frozen_policy.json"))["table"].items()})'; fi
      - name: Upload raw timings, policy, source SHA256 and CNFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-neuroflow-v05-heldout
          path: |
            DRNAS_NP_Crypto_Benchmark/nf05_results/
            DRNAS_NP_Crypto_Benchmark/nf05_train_satlib/manifest.csv
            DRNAS_NP_Crypto_Benchmark/nf05_holdout_satlib/manifest.csv
          if-no-files-found: warn
