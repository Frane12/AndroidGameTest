name: DRNAS ATLAS BLOCK4 Kissat comparison
run-name: ATLAS-BLOCK4 vs Kissat 12 SATLIB SHA x 2 reps x 4 arms 20s oneCPU
on:
  push:
    branches: [experiment/drnas-atlas-block4-kissat-20261111]
    paths:
      - research/drnas_atlas_block4_kissat.py
      - .github/workflows/drnas-atlas-block4-kissat.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2]
    steps:
      - uses: actions/checkout@v4
      - name: Build native DRNAS and Kissat
        run: |
          set -euo pipefail
          mkdir -p mre_atlasmap2/bin mre_map2_real47/bin
          python3 -m py_compile research/drnas_atlas_block4_kissat.py
          python3 research/drnas_atlas1_generate.py --out mre_atlasmap2/atlas1_table.hpp
          g++ -std=c++17 -O2 -I mre_atlasmap2 research/drnas_atlasmap2.cpp -o mre_atlasmap2/bin/drnas_atlasmap2
          mre_atlasmap2/bin/drnas_atlasmap2 --atlasmap2-selftest
          git clone --depth 1 https://github.com/arminbiere/kissat.git /tmp/atlas-kissat
          (cd /tmp/atlas-kissat && ./configure)
          make -C /tmp/atlas-kissat/build -j2
          test -x /tmp/atlas-kissat/build/kissat
          cp /tmp/atlas-kissat/build/kissat mre_map2_real47/bin/kissat
      - name: One logical CPU matched original and alias formulas
        env:
          BLOCK4_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          taskset -c "$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')" python3 -u research/drnas_atlas_block4_kissat.py | tee mre_map2_real47/block4_kissat.log
          grep '^ATLAS_BLOCK4_KISSAT_FINAL ' mre_map2_real47/block4_kissat.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS-BLOCK4-KISSAT-SHARD-${{ matrix.shard }}
          retention-days: 30
          path: |
            mre_map2_real47/block4_kissat_audit_*.json
            mre_map2_real47/block4_kissat.log
