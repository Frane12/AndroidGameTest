name: DRNAS R39 offline precursor signal audit NO SOLVER
on:
  push:
    branches: [experiment/drnas-r39-offline-precursor-20261103]
    paths:
      - '.github/workflows/drnas-r39-offline-signal.yml'
      - 'research/r39_precursor_signal_offline.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-artifacts-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reuse frozen real SAT Competition 2026 R37 cases and 120 completed trials
        uses: actions/download-artifact@v4
        with:
          name: DRNAS-v94-2026-official-12-new-CNFs-full-results
          run-id: 41632056202
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: reused-r37
      - name: Reuse five R38 native policy diagnostic reports
        uses: actions/download-artifact@v4
        with:
          pattern: r38-case-*
          run-id: 41636569865
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: reused-r38
      - name: Independent retrospective audit, rank correlations and temporal leakage
        run: |
          set -euo pipefail
          python3 -m py_compile research/r39_precursor_signal_offline.py
          (cd reused-r37/official_manifest && sha256sum -c manifest.sha256)
          python3 -u research/r39_precursor_signal_offline.py \
            --manifest reused-r37/official_manifest/official_v94_manifest.json \
            --r37-raw reused-r37/combined-v94/all_raw.csv \
            --r38-root reused-r38 --outdir r39-results | tee r39-live.log
          test -s r39-results/r39_report.json
          test -s r39-results/r39_r37_pairs.csv
          cat r39-results/r39_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive auditable findings, NO SOLVER EXECUTION
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R39-OFFICIAL-RETROSPECTIVE-PRECURSOR-NO-SAT-RERUN
          path: |
            r39-results/
            r39-live.log
          if-no-files-found: warn
          retention-days: 90
