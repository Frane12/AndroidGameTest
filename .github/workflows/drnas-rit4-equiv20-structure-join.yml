name: DRNAS RIT4 - X20 exact SHA EQUIV2 structural join no CDCL
on:
  push:
    branches: [experiment/drnas-rit4-equiv20-structure-join-20261109]
    paths:
      - 'research/drnas_rit4_equiv20_join.py'
      - 'research/DRNAS_RIT4_EQUIV20_STRUCTURAL_JOIN_PROTOCOL.md'
      - '.github/workflows/drnas-rit4-equiv20-structure-join.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-rit4-x20-structure-${{ github.ref }}
  cancel-in-progress: false
jobs:
  selftest:
    name: Validate SHA-locked XOR4 SCC join analyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Syntax and source-certified mixed-relation test
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_crr1_gf2_scc_rup.py research/drnas_rit3_original_sha_screen.py research/drnas_rit4_equiv20_join.py
          python3 -u research/drnas_rit4_equiv20_join.py selftest
          grep -q 'RIT4' research/DRNAS_RIT4_EQUIV20_STRUCTURAL_JOIN_PROTOCOL.md
  scan:
    name: RIT4 source-SHA-only X20 scan shard ${{ matrix.shard }}
    needs: selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0,1]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Download frozen original X20 SHA only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42607281345 -R Frane12/AndroidGameTest -n equiv2-frozen-source-and-tested-SCC -D .
          test -s mre_x20/manifest.json
          test "$(find mre_x20 -maxdepth 1 -name '*.cnf' | wc -l)" -eq 24
      - name: Bounded 12-case original-X20 structural screening with zero CDCL
        run: |
          set -euo pipefail
          python3 -u research/drnas_rit4_equiv20_join.py scan \
            --manifest mre_x20/manifest.json --cases mre_x20 \
            --shard ${{ matrix.shard }} --out rit4/shard-${{ matrix.shard }}.json \
            | tee rit4-shard-${{ matrix.shard }}.log
          grep -q '^RIT4_SHARD_PASS ${{ matrix.shard }} 12$' rit4-shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rit4-scan-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: error
          path: rit4/shard-${{ matrix.shard }}.json
  join:
    name: Strict 24-source SHA, 384 accepted E2E PAR2 and structural join audit
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Download frozen manifest and already audited EQUIV2 384 E2E JSON
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Source and recovery artifacts both contain mre_equiv2/manifest.json.
          # gh run download refuses to overwrite existing paths: unpack separately.
          gh run download 42607281345 -R Frane12/AndroidGameTest -n equiv2-frozen-source-and-tested-SCC -D .
          mkdir -p recovered_equiv2
          gh run download 42608986438 -R Frane12/AndroidGameTest -n DRNAS-EQUIV2-384-AUDITED-RECOVERED -D recovered_equiv2
          test -s mre_x20/manifest.json
          test -s mre_equiv2/manifest.json
          test -s recovered_equiv2/manifest.json
          cmp mre_equiv2/manifest.json recovered_equiv2/manifest.json
          test -s recovered_equiv2/report.json
          cp recovered_equiv2/report.json mre_equiv2/report.json
          for i in 0 1 2 3 4 5 6 7; do
            test -s "recovered_equiv2/shard-$i.json"
            cp "recovered_equiv2/shard-$i.json" "mre_equiv2/shard-$i.json"
          done
          echo "RIT4_RECOVERY_MANIFEST_IDENTICAL 1"
      - uses: actions/download-artifact@v4
        with:
          pattern: rit4-scan-*
          path: rit4
          merge-multiple: true
      - name: Match source SHA and verify every reconstructed PAR2
        run: |
          set -euo pipefail
          python3 -u research/drnas_rit4_equiv20_join.py join \
            --manifest mre_x20/manifest.json --results rit4 \
            --equiv2 mre_equiv2 | tee rit4/audit.log
          grep -q '^RIT4_FINAL ' rit4/audit.log
          grep '^RIT4_FINAL ' rit4/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-RIT4-X20-EQUIV2-SHA-JOIN-FINAL
          retention-days: 21
          if-no-files-found: error
          path: |
            rit4/joined.csv
            rit4/joined.json
            rit4/summary.json
            rit4/audit.log
