name: DRNAS X1 MEMORY2 future-potential verified experiment
on:
  push:
    branches: [experiment/drnas-x1-memory2-future-20261113]
    paths:
      - research/drnas_x1/**
      - .github/workflows/drnas-x1-memory2.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drnas-x1-memory2-future
  cancel-in-progress: false
jobs:
  native_future:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Compile pure-native X1 with strict warnings
        run: |
          set -euo pipefail
          mkdir -p build
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Werror research/drnas_x1/x1.cpp -o build/drnas-x1
          sha256sum build/drnas-x1 research/drnas_x1/x1_memory2.hpp research/drnas_x1/x1.cpp
      - name: Exhaustive independent original-CNF correctness regression
        run: |
          set -euo pipefail
          python3 -S research/drnas_x1/test.py build/drnas-x1 --cases 500 --report x1_memory2-regression.json
      - name: Paired future learning train and SHA-disjoint holdout (CORE, M1, M2)
        run: |
          set -euo pipefail
          python3 -S research/drnas_x1/memory2_bench.py --binary build/drnas-x1 --out x1_memory2_results --train 42 --holdout 30 --repeats 3 --cap 2.0 | tee x1_memory2_benchmark.log
      - name: Reject incompatible learned models
        run: |
          set -euo pipefail
          printf 'p cnf 1 1\n1 0\n' > x1_memory2_results/negative.cnf
          printf 'WRONG 64 2 3\n' > x1_memory2_results/corrupt-model.txt
          set +e
          build/drnas-x1 --mode core --memory2-load x1_memory2_results/corrupt-model.txt x1_memory2_results/negative.cnf > x1_memory2_results/invalid-model.log 2>&1
          status="$?"
          set -e
          test "$status" -eq 1
          grep -q 'MEMORY2 incompatible model' x1_memory2_results/invalid-model.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drnas-x1-memory2-compact
          retention-days: 14
          if-no-files-found: warn
          path: |
            x1_memory2-regression.json
            x1_memory2_results/report.json
            x1_memory2_results/manifest.json
            x1_memory2_results/trials.jsonl
            x1_memory2_results/trained-memory1.txt
            x1_memory2_results/trained-memory2.txt
            x1_memory2_results/*.jsonl
            x1_memory2_benchmark.log
