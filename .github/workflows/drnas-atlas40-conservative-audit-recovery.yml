name: DRNAS ATLAS40 conservative immutable recovery audit
run-name: ATLAS40 conservative audit original 43036590461 results only
on:
  push:
    branches: [experiment/drnas-atlas40-conservative-tree-20261111]
    paths: [.github/workflows/drnas-atlas40-conservative-audit-recovery.yml]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 43036590461
          github-token: ${{ github.token }}
          pattern: ATLAS40-*
          path: audits
      - name: Independently audit immutable results and native tree mode
        run: |
          set -euo pipefail
          python3 -u research/drnas_atlas40_audit_recovery.py | tee recovery.log
          grep '^ATLAS40_AUDIT ' recovery.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLAS40-conservative-RECOVERED-AUDIT
          retention-days: 60
          path: recovery.log
