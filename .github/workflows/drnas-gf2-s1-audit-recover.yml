name: DRNAS GF2-S1 - strict artifact-only audit recovery
run-name: GF2-S1 audit-only 204 completed E2E frozen SHA, no solver reruns
on:
  push:
    branches: [experiment/drnas-gf2-proof-first-s1-20261110]
    paths:
      - .github/workflows/drnas-gf2-s1-audit-recover.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recover:
    name: Replay all completed GF2-S1 shard evidence, original SHA and strict PAR2
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover immutable 204 E2E shard artifacts without executing solvers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42776296568 -R Frane12/AndroidGameTest -n gf2-s1-frozen-17SHA-exact-binaries -D .
          mkdir -p recovery
          for i in 0 1 2 3 4 5; do
            mkdir -p "recovery/$i"
            gh run download 42776296568 -R Frane12/AndroidGameTest -n "gf2-s1-shard-$i" -D "recovery/$i"
            test -s "recovery/$i/shard-$i.json"
            cp "recovery/$i/shard-$i.json" "mre_gf2_s1/shard-$i.json"
          done
          ls -lh mre_gf2_s1/shard-*.json
      - name: Strict SHA-locked 204 paired source model GF2 original certificate audit
        run: |
          set -euo pipefail
          chmod +x mre_gf2_s1/bin/gf2_exact mre_x4/bin/native built/bin/kissat_4_0_4 mre_equiv7/bin/cadical_3_0_1
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          python3 -u research/drnas_gf2_proof_first_s1.py verify
          python3 -u research/drnas_gf2_proof_first_s1.py audit | tee mre_gf2_s1/audit.log
          grep -q '^GF2_S1_FINAL ' mre_gf2_s1/audit.log
          grep '^GF2_S1_FINAL ' mre_gf2_s1/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-GF2-S1-204-E2E-RECOVERED-FINAL-PAR2
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_gf2_s1/report.json
            mre_gf2_s1/audit.log
