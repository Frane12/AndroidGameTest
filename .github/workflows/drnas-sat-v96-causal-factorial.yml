name: DRNAS SAT V9.6 — Causal 64-128-256 Factorial and Fresh Official CNFs
on:
  push:
    branches: [experiment/drnas-sat-v96-causal-checkpoints-20261031]
    paths:
      - '.github/workflows/drnas-sat-v96-causal-factorial.yml'
      - 'research/drnas-sat-v7-8/v96_causal_telemetry.cpp'
      - 'research/drnas-sat-v7-8/v96_causal_experiment.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: official-shortlong-frozen-manifest
          run-id: 41231153158
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: original18
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-v94-2026-official-12-new-CNFs-full-results
          run-id: 41232668762
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior12
      - uses: actions/download-artifact@v4
        with:
          name: v95-frozen-24-new-official-manifest
          run-id: 41233977981
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior24
      - name: Verify pinned official SAT Competition 2026 input table
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/v96_causal_experiment.py
          curl -fL --retry 3 --max-time 90 \
            https://raw.githubusercontent.com/satcompetition/2026/3e2dee7cf5aa643c77bf946280a3c1c520756ef9/downloads/scores.csv \
            -o official_scores.csv
          test "$(git hash-object official_scores.csv)" = 9c926b2bd35ac0fb4f3d0cf8f58c97178d43faef
      - name: Freeze 6 preselected diagnostic and 12 never-tested CNFs
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/v96_causal_experiment.py freeze \
            --old18 original18/official_shortlong_manifest.json \
            --old12 prior12/official_manifest/official_v94_manifest.json \
            --old24 prior24/official_v95_manifest.json \
            --scores official_scores.csv --out v96_manifest.json
          sha256sum v96_manifest.json | tee v96_manifest.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v96-frozen-causal-input-manifest
          path: |
            v96_manifest.json
            v96_manifest.sha256
          if-no-files-found: warn

  test:
    needs: freeze
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    name: causal-shard-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: v96-frozen-causal-input-manifest
          path: frozen
      - name: Rebuild pinned CaDiCaL and six identical telemetry arms
        shell: bash
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v96_manifest.sha256)
          test "$(git hash-object research/drnas-sat-v7-6/v76_single.cpp)" = a254356a45b70f02f33b9506f1122dad33916ca7
          test "$(git hash-object research/drnas-sat-v7-7/v77_single.cpp)" = 1bbb7fa035e62d5179de9243f672aed9bb9cbaca
          python3 - <<'PY'
          from pathlib import Path
          s=Path('research/drnas-sat-v7-7/v77_single.cpp').read_text()
          marker='\nint main(int argc,char**argv) {'
          assert s.count(marker)==1
          Path('research/drnas-sat-v7-7/v77_embedded_functions.inc').write_text(s.split(marker,1)[0]+'\n')
          PY
          git clone --depth 1 --branch rel-3.0.1 https://github.com/arminbiere/cadical.git cadical-src
          test "$(git -C cadical-src rev-parse HEAD)" = c60730422e758ef1cebe7aeddf2dda31c996bf04
          python3 research/drnas-sat-v7-8/patch_cadical_v90.py cadical-src
          (cd cadical-src && ./configure && make -j2 >/tmp/build-v96.log 2>&1) \
            || { tail -90 /tmp/build-v96.log; exit 1; }
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -I cadical-src/src \
            research/drnas-sat-v7-8/v96_causal_telemetry.cpp \
            cadical-src/build/libcadical.a -o v96_causal_probe -pthread -ldl -lz
          lscpu > cpu.txt
      - name: Six causal arms, two frozen controls, identical randomized seeds
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/v96_causal_experiment.py run \
            --manifest frozen/v96_manifest.json --shard "$SHARD" \
            --exe ./v96_causal_probe --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v96-shard-${{ matrix.shard }}
          path: |
            results/
            cpu.txt
          if-no-files-found: warn

  audit:
    needs: [freeze, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: v96-frozen-causal-input-manifest
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: v96-shard-*
          path: combined
      - name: Fail-closed audit of all 336 expected trials
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/v96_causal_experiment.py audit \
            --manifest frozen/v96_manifest.json \
            --combined combined --out v96_report.json --md v96_report.md
          cat v96_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-v96-336-causal-factorial-results
          path: |
            frozen/
            combined/
            v96_report.json
            v96_report.md
          if-no-files-found: warn
