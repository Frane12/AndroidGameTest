name: SCALE23 standard AC energy trace
on:
  push:
    branches: ['experiment/drnas-scale23-trace-proof-20261124']
    paths: ['.github/workflows/scale23-trace.yml']
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install official checker
        run: cargo install veripb --version 3.0.2 --locked --root "$RUNNER_TEMP/veripb" --quiet
      - name: Replay frozen trace
        run: |
          g++ -O3 -std=c++17 research/scale23/emit23.cpp -o /tmp/emit23
          mkdir -p out
          python research/scale23/ci23.py "$RUNNER_TEMP/veripb/bin/veripb"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scale23-standard-trace
          path: out/
