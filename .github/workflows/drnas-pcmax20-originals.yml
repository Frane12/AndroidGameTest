name: DRNAS PCMAX20 original 2024 source collection
on:
  push:
    branches: [experiment/drnas-pcmax20-independent-20261114]
    paths: [.github/workflows/drnas-pcmax20-originals.yml]
permissions:
  contents: read
jobs:
  fetch_pcmax20:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch public GBD original PCMAX 2024 CNFs, no solver edits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pcmax-download
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,re,hashlib,lzma,os,time
          from html import unescape
          root='https://benchmark-database.de/'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'DRNAS-PCMAX-research-check/1.0 (public benchmark audit)'})
              with urllib.request.urlopen(req,timeout=120) as f:return f.read()
          data=None
          for site in ('https://benchmark-database.de/?track=main_2024', 'https://www.benchmark-database.de/?track=main_2024'):
              try:
                  data=get(site).decode('utf-8')
                  print('PAGE_OK',site,len(data),flush=True)
                  break
              except Exception as e:print('PAGE_FAILED',site,repr(e),flush=True)
          if data is None:
              open('pcmax-download/report.json','w').write(json.dumps({'error':'no_gbd_page'}))
              raise SystemExit(1)
          rows=re.findall(r'(?is)<tr\b[^>]*>.*?</tr>',data)
          print('ROWS',len(rows),flush=True)
          entries=[]
          for row in rows:
              m=re.search(r'pcmax-scheduling-m\d+-\d+-\d+-(?:UNSAT|SAT)\.sanitized\.cnf\.xz',row)
              if not m:continue
              links=re.findall(r"""(?i)href\s*=\s*["']([^"']+)["']""",row)
              paths=[unescape(h) for h in links if '/file/' in h]
              if not paths:continue
              name=m.group(0)
              entries.append((name,urllib.parse.urljoin(root,paths[0])))
          entries=list(dict(entries).items())
          print('FOUND_PCMAX',len(entries),flush=True)
          report={'source':'Global Benchmark Database main_2024','found':len(entries),'results':[]}
          for name,url in entries:
              rec={'name':name,'url':url}
              try:
                  before=time.monotonic();blob=get(url)
                  if len(blob)>30000000:raise ValueError('compressed_file_over_30MB')
                  raw=lzma.decompress(blob)
                  if not raw.startswith(b'p cnf '):
                      header=next((line for line in raw.splitlines()[:500] if line.startswith(b'p cnf ')),None)
                      if header is None:raise ValueError('missing_dimacs_header')
                  else:header=raw.splitlines()[0]
                  target='pcmax-download/'+name.replace('.xz','')
                  with open(target,'wb') as f:f.write(raw)
                  rec.update(status='OK',path=target,sha256=hashlib.sha256(raw).hexdigest(),bytes=len(raw),header=header.decode('ascii'),elapsed_s=round(time.monotonic()-before,2))
                  print('FETCH_OK',name,len(raw),rec['header'],flush=True)
              except Exception as e:
                  rec.update(status='FAIL',error=repr(e))
                  print('FETCH_FAIL',name,repr(e),flush=True)
              report['results'].append(rec)
          with open('pcmax-download/report.json','w') as f:json.dump(report,f,indent=2)
          print('PCMAX_COLLECT_DONE',sum(x['status']=='OK' for x in report['results']),len(report['results']),flush=True)
          PY
      - name: Save untouched public formulas and provenance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pcmax20-original-cnfs
          retention-days: 45
          path: pcmax-download/
