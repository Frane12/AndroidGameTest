name: DRNAS V12 - Retrospective LOCO Structural Guard Audit
on:
  push:
    branches:
      - experiment/drnas-v12-loco-structural-audit-20261101
    paths:
      - .github/workflows/drnas-sat-v12-loco-audit.yml
      - research/drnas-sat-v7-8/v12_structural_audit.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  v12-loco-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check V12 code and self-tests
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/v12_structural_audit.py
          python3 research/drnas-sat-v7-8/v12_structural_audit.py selftest
      - name: Download immutable V10.3 audited observations
        uses: actions/download-artifact@v4
        with:
          name: DRNAS-V103-new-CNF-locked-router-audit
          run-id: 41249978820
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: baseline
      - name: Leave one cohort out - diagnostics, not a new benchmark
        run: |
          set -euo pipefail
          python3 research/drnas-sat-v7-8/v12_structural_audit.py audit \
            --root baseline --out v12-results
          cat v12-results/v12_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V12-LOCO-structural-audit
          path: v12-results/
          if-no-files-found: warn
