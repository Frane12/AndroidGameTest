name: DRNAS R153 confirmation II new original XOR mixed five solvers 3 repeats 20s
on:
  push:
    branches: [experiment/drnas-r153-confirmation2-sha-fresh-20261106]
    paths:
      - '.github/workflows/drnas-r153-confirm2-fresh-20261106.yml'
      - 'research/r153_v2_freeze.py'
      - 'research/r153_v2_benchmark.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r153-confirmation2-source-frozen-20261106
  cancel-in-progress: false
jobs:
  freeze:
    name: Freeze new original SAT2026 family CNFs with prior ID SHA exclusions before all timings
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and validate freeze and audit scripts before external sources
        run: |
          set -euo pipefail
          mkdir -p r153v2
          python3 -m py_compile research/r115_world_top_rematch.py research/r152_lightsout_unseen.py research/r153_v2_freeze.py research/r153_v2_benchmark.py
      - uses: actions/download-artifact@v4
        with:
          name: r115-world-frozen
          run-id: 42039762548
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior/r115
      - uses: actions/download-artifact@v4
        with:
          name: r152-new-lightsout-frozen-originals-and-provenance
          run-id: 42102227483
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior/r152
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-400-PROSPECTIVE-CNF-VERIFIED-COMPLETE
          run-id: 42060553799
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior/400
      - uses: actions/download-artifact@v4
        with:
          name: r132-frozen-prospective-sha-excluded
          run-id: 42050320220
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior/r132
      - uses: actions/download-artifact@v4
        with:
          name: r135-frozen-sha-disjoint-real
          run-id: 42061956160
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior/r135
      - uses: actions/download-artifact@v4
        with:
          name: r148blind-fixed-previously-unmeasured-real-cnfs
          run-id: 42087820632
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior/r148
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-R150-NEW-EXTERNAL-PROSPECTIVE-FINAL
          run-id: 42088721067
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior/r150
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-R151-INDEPENDENT-SHA-PAR2-REGRESSIONS-FINAL
          run-id: 42094754907
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior/r151
      - uses: actions/download-artifact@v4
        with:
          name: r154-unseen-frozen-original-SAT2026-source
          run-id: 42107642696
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior/r154
      - uses: actions/download-artifact@v4
        with:
          name: r154-mix-short-new-source-frozen
          run-id: 42112341909
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior/r154mix
      - uses: actions/download-artifact@v4
        with:
          name: r153field-original-13-genuine-competition-binary-and-full-official-table
          run-id: 42107076063
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior/r153world
      - uses: actions/download-artifact@v4
        with:
          name: r28full-2025-2026-multifamily-frozen-originals
          run-id: 42105963889
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior/r28full
      - name: Freeze prospective original SHA source-only with zero solver attempts
        run: |
          set -euo pipefail
          python3 -u research/r153_v2_freeze.py freeze | tee r153v2/freeze.log
          test -s r153v2/frozen/manifest.json
          grep -q '^R153V2_FREEZE_PASS ' r153v2/freeze.log
          python3 - <<'PY'
          import json,pathlib
          m=json.loads(pathlib.Path('r153v2/frozen/manifest.json').read_text())
          assert m['protocol']=='DRNAS-R153-V2-INDEPENDENT-SHA-FRESH-PARITY-20261106-v1'
          assert len(m['cases'])>=8
          assert any('prior/r152/' in f for f in m['historical_exclusions']['files'])
          print('R153V2_SOURCE_SHA_FROZEN',len(m['cases']),m['cohort_counts'],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r153v2-unseen-frozen-original-SAT2026-source
          path: |
            r153v2/frozen/
            r153v2/freeze.log
          if-no-files-found: warn
          retention-days: 90
  benchmark:
    name: R153V2 original R153 R28 Kissat CaDiCaL CryptoMiniSat 3x20s shard ${{ matrix.shard }}
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r153v2-unseen-frozen-original-SAT2026-source
          path: r153v2
      - uses: actions/download-artifact@v4
        with:
          name: r52-three-pinned-solvers
          run-id: 41684183452
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: built/bin
      - name: Build original frozen R28 and unchanged R153 and pin CPU and reference binary hashes
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          (cd built/bin && sha256sum -c binaries.sha256)
          chmod +x built/bin/kissat_4_0_4 built/bin/cadical_3_0_1
          sudo apt-get update -qq
          sudo apt-get install -y -qq cryptominisat
          command -v cryptominisat5
          dpkg-query -W cryptominisat | tee r153v2/cryptominisat-package.txt
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -Werror experiments/drnas_v16/r28_exact_gf2.cpp -o r153v2/r28
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -Werror research/r153_exact_units_gf2.cpp -o r153v2/r153
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          fs=['r153v2/r28','r153v2/r153','built/bin/kissat_4_0_4','built/bin/cadical_3_0_1','/usr/bin/cryptominisat5']
          obj=dict(commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            binaries={f:hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest() for f in fs},
            cpu=next((x for x in pathlib.Path('/proc/cpuinfo').read_text().splitlines() if x.startswith('model name')),'unknown'))
          pathlib.Path('r153v2/pin-'+os.environ['SHARD']+'.json').write_text(json.dumps(obj,sort_keys=True))
          PY
      - name: Native selftests and randomized 5-real-solver 3 repeat 20s original CNF attempts
        run: |
          set -euo pipefail
          python3 -u research/r153_v2_benchmark.py shard --shard ${{ matrix.shard }} | tee r153v2/shard-${{ matrix.shard }}.log
          grep -q '^R153V2_SHARD_PASS ' r153v2/shard-${{ matrix.shard }}.log
          test -s r153v2/shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r153v2-unseen-shard-${{ matrix.shard }}
          path: |
            r153v2/shard-${{ matrix.shard }}.json
            r153v2/pin-${{ matrix.shard }}.json
            r153v2/shard-${{ matrix.shard }}.log
          if-no-files-found: warn
          retention-days: 90
  audit:
    needs: benchmark
    name: R153 confirmation II strict source SHA, 3-repeat 5-solver PAR2, certified SAT and XOR-UNSAT
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r153v2-unseen-frozen-original-SAT2026-source
          path: r153v2
      - uses: actions/download-artifact@v4
        with:
          pattern: r153v2-unseen-shard-*
          merge-multiple: true
          path: r153v2
      - name: Full paired freeze provenance original source SAT witness XOR and source implied unit UNSAT verification
        run: |
          set -euo pipefail
          test "$(find r153v2 -maxdepth 1 -name 'shard-*.json' | wc -l)" -eq 8
          python3 -u research/r153_v2_benchmark.py audit | tee r153v2/audit.log
          grep -q '^R153V2_FINAL ' r153v2/audit.log
          cat r153v2/report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R153-CONFIRMATION2-SHA-FRESH-5SOLVERS-3X20S-PAR2-FINAL
          path: |
            r153v2/report.json
            r153v2/paired.csv
            r153v2/audit.log
            r153v2/frozen/manifest.json
          if-no-files-found: warn
          retention-days: 90
