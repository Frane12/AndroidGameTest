name: DRNAS v9.4 — Explain Screenshot 360 Official SAT Runs (no solver reruns)
on:
  push:
    branches: [experiment/drnas-sat-v94-official-frozenholdout-fix-20261031]
    paths: ['.github/workflows/drnas-v94-historical360-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: official-shortlong-frozen-manifest
          run-id: 41231153158
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: old_manifest
      - uses: actions/download-artifact@v4
        with:
          pattern: official-shortlong-shard-*
          run-id: 41231153158
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: old18
      - name: Recompute every original 360 solver attempts, no retesting
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/v94_historical_360_diagnose.py
          cat v94_historical_360_diagnosis.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-v94-retrospective-original-360-trial-mechanism-audit
          path: |
            v94_historical_360_diagnosis.json
            v94_historical_360_diagnosis.md
          if-no-files-found: warn
