name: DRNAS SEARCH6 original SHA strict PAR2 audit-only recovery
run-name: SEARCH6 repair artifact extraction audit 216 completed native E2E trials no reruns
on:
  push:
    branches: [experiment/drnas-search6-structural-strata-native-cdcl-20261110]
    paths:
      - .github/workflows/drnas-search6-audit-only-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-search6-audit-repair-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    name: Recover six completed SHA-paired shards, strict original proof & PAR2
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Exact recover 42789740518 source and 6 unmodified completed SHA-paired shard artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO=Frane12/AndroidGameTest
          RUN=42789740518
          gh run download "$RUN" -R "$REPO" -n SEARCH6-12SHA-4STRATA-SOURCEONLY-NATIVE-FROZEN -D .
          for i in 0 1 2 3 4 5; do
            gh run download "$RUN" -R "$REPO" -n "SEARCH6-shard-$i" -D mre_search6
          done
          for i in 0 1 2 3 4 5; do
            test -s "mre_search6/shard-$i.json"
            echo "RECOVERED_SEARCH6_SHARD=$i"
          done
          test -s mre_search6/manifest.json
          chmod +x mre_search3/bin/search3_cadical mre_search2/bin/search1_relabel mre_equiv6/bin/cadical_3_0_1 built/bin/kissat_4_0_4
      - name: Read exact pinned original source hash and original native C++ binaries
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          python3 -u research/drnas_search6_stratified_e2e.py verify
          echo SEARCH6_AUDIT_REPAIR_SOURCE_SHA_OK
      - name: Reaudit only, no solver invocations, and report PAR2 by structural class
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          python3 -u research/drnas_search6_stratified_e2e.py audit | tee mre_search6/audit.log
          grep -q '^SEARCH6_FINAL ' mre_search6/audit.log
          grep '^SEARCH6_FINAL ' mre_search6/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-SEARCH6-216-E2E-4STRATA-ORIGINAL-SHA-RECOVERED-FINAL-PAR2
          retention-days: 30
          path: |
            mre_search6/manifest.json
            mre_search6/report.json
            mre_search6/audit.log
            mre_search6/shard-*.json
