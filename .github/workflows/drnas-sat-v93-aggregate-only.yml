name: DRNAS SAT v9.3 — Aggregate Existing 540 Unseen-Class Measurements
on:
  push:
    branches:
      - experiment/drnas-sat-v93-zero-shot-aggregate-20261031
    paths:
      - '.github/workflows/drnas-sat-v93-aggregate-only.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: v93-shard-*
          run-id: 41230824168
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: saved-v93
      - name: Final strict audit of the already completed 540 solver processes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p combined-v93
          for shard in 0 1 2 3 4; do
            test -f "saved-v93/v93-shard-$shard/manifest.json"
            test -f "saved-v93/v93-shard-$shard/raw.csv"
            mv "saved-v93/v93-shard-$shard" "combined-v93/shard-$shard"
          done
          python3 -m py_compile research/drnas-sat-v7-8/summarize_v93.py
          python3 -u research/drnas-sat-v7-8/summarize_v93.py combined-v93
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-v93-30-unseen-classes-540-full-audit
          path: combined-v93/
          if-no-files-found: warn
