name: DRNAS XX — structural duplicate gate, 12 fresh official and 12 X11 replay, 336 E2E
on:
  push:
    branches: [experiment/drnas-xx-structural-gate-20261109]
    paths:
      - '.github/workflows/drnas-mre-xx-structural-gate.yml'
      - 'research/mre_xx_structural_gate.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-xx-20261109-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    name: XX freeze 12 official fresh CNF and 12 X11 structural controls
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore X11 originals and unchanged solver backends
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42563452186 -R Frane12/AndroidGameTest -n x11-32-frozen-original-sha-native-binaries-structural -D .
          test -s mre_x11/manifest.json
          test -s mre_x11/structure.json
          test -x mre_x4/bin/native
          test -x built/bin/kissat_4_0_4
          test -s mre5/lib/libcryptominisat5.so.5.11
      - name: Validate binary SHA Python imports and gate selftest
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
          chmod +x mre_x4/bin/native built/bin/kissat_4_0_4
          sha256sum -c mre_x11/binary.sha256
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          python3 -m py_compile research/mre_xx_structural_gate.py
          python3 -u research/mre_xx_structural_gate.py selftest
          python3 -u research/mre_x11_placebo_causal.py selftest
      - name: Freeze 12 fresh SHA official 2021 to 2023 CNF without runtime selection
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          mkdir -p mre_xx
          python3 -u research/mre_xx_structural_gate.py freeze | tee mre_xx/freeze.log
          grep -q '^XX_FROZEN 24 FRESH 12' mre_xx/freeze.log
          python3 -u research/mre_xx_structural_gate.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xx-frozen-24-original-sha-and-identical-binaries
          retention-days: 21
          if-no-files-found: warn
          path: |
            mre_xx/*.cnf
            mre_xx/manifest.json
            mre_xx/structure.json
            mre_xx/freeze.log
            mre_x4/bin/native
            built/bin/kissat_4_0_4
            mre5/lib/libcryptominisat5.so.5.11
            mre_x11/binary.sha256
  paired:
    name: XX 42 paired 10s original SHA E2E trials shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: xx-frozen-24-original-sha-and-identical-binaries
          path: .
      - name: Verify original SHA and unchanged binary SHA
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
          chmod +x mre_x4/bin/native built/bin/kissat_4_0_4
          sha256sum -c mre_x11/binary.sha256
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          python3 -u research/mre_xx_structural_gate.py verify
      - name: Original vs scan placebo vs identity rewrite vs front100 vs gate vs references
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          python3 -u research/mre_xx_structural_gate.py shard --shard ${{ matrix.shard }} | tee mre_xx/shard-${{ matrix.shard }}.log
          grep -q '^XX_SHARD_PASS ${{ matrix.shard }} 42$' mre_xx/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xx-result-${{ matrix.shard }}
          retention-days: 21
          path: |
            mre_xx/shard-${{ matrix.shard }}.json
            mre_xx/shard-${{ matrix.shard }}.log
  audit:
    name: XX strict 336 E2E PAR2 with witness and source audit
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: xx-frozen-24-original-sha-and-identical-binaries
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: xx-result-*
          merge-multiple: true
          path: mre_xx
      - name: Audit all 336 paired trials and separate the fresh and replay cohorts
        run: |
          set -euo pipefail
          python3 -u research/mre_xx_structural_gate.py audit | tee mre_xx/audit.log
          grep -q '^XX_FINAL' mre_xx/audit.log
          grep '^XX_FINAL' mre_xx/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-XX-24SHA-336E2E-10S-PAR2-FINAL
          retention-days: 30
          path: |
            mre_xx/manifest.json
            mre_xx/structure.json
            mre_xx/report.json
            mre_xx/audit.log
            mre_xx/shard-*.json
