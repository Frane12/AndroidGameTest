name: DRNAS R73 audit-only recovery from eight completed shards
on:
  push:
    branches: [experiment/drnas-r73-quick-unused-2025-20261103]
    paths:
      - '.github/workflows/drnas-r73-audit-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit_only:
    name: Recompute final paired report from 8 existing R73 shards (no tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate recovery script syntax
        run: python3 -m py_compile experiments/drnas_v16/r73_recover_audit_only.py
      - uses: actions/download-artifact@v4
        with:
          name: r73-fresh-selected-sources
          run-id: 41732483582
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: r73-shard-*
          run-id: 41732483582
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: combined
      - name: SHA-check unchanged source and audit exactly 48 existing paired trials
        run: |
          set -euo pipefail
          (cd new && sha256sum -c source.sha256)
          python3 -u experiments/drnas_v16/r73_recover_audit_only.py \
            --sources new --combined combined \
            --json r73-final-recovered.json --md r73-final-recovered.md
          cat r73-final-recovered.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DRNAS-R73-FRESH-8FORMULA-AUDIT-RECOVERED
          path: |
            r73-final-recovered.json
            r73-final-recovered.md
          if-no-files-found: error
          retention-days: 90
