name: DRNAS REX1 relational decision probe
on:
  push:
    branches: [experiment/drnas-rex1-20261112]
    paths: [.github/workflows/drnas-rex1.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drnas-rex1-single
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate probe syntax
        run: python3 -m py_compile research/drnas_rex1_probe.py
      - name: Run bounded structural decision probes on 20 held-out synthetic formulas
        run: python3 -u research/drnas_rex1_probe.py --indices 90,91 --top 8 --budget 12000 | tee rex1.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rex1-relational-probe
          retention-days: 7
          path: |
            rex1.log
            rex1-results.jsonl
