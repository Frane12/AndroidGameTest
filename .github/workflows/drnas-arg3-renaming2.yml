name: DRNAS ARG3-V2 original SAT permutation invariant native C++ proof checks
on:
  push:
    branches: [experiment/drnas-arg3-renaming2-20261115]
    paths:
      - src/drnas_sat_arg3.hpp
      - src/drnas_x59.cpp
      - research/cdcl299/test_arg3_renaming.py
      - .github/workflows/drnas-arg3-renaming2.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-arg3-renaming2-20261115
  cancel-in-progress: false
jobs:
  exact_source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 43710031198
          repository: Frane12/AndroidGameTest
          name: real2025-originals-frozen
          github-token: ${{ github.token }}
          path: frozen/sources
      - name: Restore original SAT2025 pinned source with strict SHA
        run: |
          set -euo pipefail
          tar -xzf frozen/sources/real2025-originals-frozen.tgz
          python3 -m py_compile research/cdcl299/*.py
          sha256sum src/drnas_sat_arg3.hpp sat_real2025_inputs/manifest.json
      - name: Compile permutation-invariant source constructor with X59
        run: |
          set -euo pipefail
          mkdir -p build
          g++ -O3 -std=c++20 -DNDEBUG -Wall -Wextra src/drnas_x59.cpp \
            -o build/drnas-sat-native-x59
          sha256sum build/drnas-sat-native-x59
      - name: Strict original and synthetic SAT source controls
        run: |
          set -euo pipefail
          OMP_NUM_THREADS=1 python3 -u research/cdcl299/test_arg3.py |
            tee arg3_original_controls.log
          grep -q '^ARG3_SOURCE_CONTROLS ' arg3_original_controls.log
      - name: SAT original re-encoded with five arbitrary variable permutations
        run: |
          set -euo pipefail
          OMP_NUM_THREADS=1 python3 -u research/cdcl299/test_arg3_renaming.py |
            tee arg3_renaming.log
          grep -q '^ARG3_RENAMING_VERIFIED ' arg3_renaming.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drnas-arg3-renaming2-proof-audit
          path: |
            arg3_original_controls.log
            arg3_renaming.log
          retention-days: 45
          if-no-files-found: warn
