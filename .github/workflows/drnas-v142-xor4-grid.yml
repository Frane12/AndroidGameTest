name: DRNAS v14.2 XOR4 vs original v14.2 and Kissat on both SC2024 grids
on:
  push:
    branches: [experiment/drnas-v142-xor4-grids-20261101]
    paths:
      - '.github/workflows/drnas-v142-xor4-grid.yml'
      - 'research/drnas-sat-v7-8/v14*.cpp'
      - 'research/tseitin-replay/xor4_benchmark.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 41267740944
          github-token: ${{ github.token }}
          name: DRNAS-V145-Native-Propagated-Parity-and-pinned-solvers
          path: bin
      - name: Build native XOR4 and check the original reference binaries
        run: |
          set -eu
          (cd bin && sha256sum -c binaries.sha256)
          echo 'ce981216e879c9fce381f7e73429f614a55e118b2ae21700533d3a8a21b8078d  bin/v142_fastgate' | sha256sum -c -
          echo 'a93d6577d9a8d8f41bde71bd94200ab0cdacd7ac9cd22ab3eb4fd55713c32d7a  bin/kissat_solver' | sha256sum -c -
          chmod +x bin/v142_fastgate bin/kissat_solver
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -pedantic research/drnas-sat-v7-8/v142_xor4.cpp -o bin/v142_xor4
      - name: Run paired measurements and replay the native certificates
        run: python3 -u research/tseitin-replay/xor4_benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-v142-xor4-native-grid-results
          path: |
            xor4-results/results.json
            xor4-results/*-certificate.json
            bin/v142_xor4
          if-no-files-found: error
