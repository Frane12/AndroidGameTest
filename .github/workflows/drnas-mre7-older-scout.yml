name: DRNAS MRE7 older official source pool scout (SAT2021–2023)
on:
  push:
    branches: [experiment/drnas-mre7-older-source-scout-20261108]
    paths: ['.github/workflows/drnas-mre7-older-scout.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Query SAT2021–2023 GBD source index and independent Minisat1m label
        run: |
          set -euo pipefail
          mkdir -p mre7_older
          python3 -m py_compile research/mre7_older_scout.py
          python3 -u research/mre7_older_scout.py | tee mre7_older/scout.log
          grep -q '^MRE7_OLDER_FINAL' mre7_older/scout.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-MRE7-OLDER-OFFICIAL-POOL-SCOUT
          retention-days: 10
          path: |
            mre7_older/scout.json
            mre7_older/scout.log
