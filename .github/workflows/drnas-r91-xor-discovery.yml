name: DRNAS R91 external XOR discovery audit
on:
  push:
    branches: [experiment/drnas-r91-two-way-pilot-20261104]
    paths: ['research/r91_external_xor_discovery.py', '.github/workflows/drnas-r91-xor-discovery.yml']
  workflow_dispatch:
  workflow_call:
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/drnas-r91-two-way-pilot-20261104
      - name: Fetch external circuit benchmark collection
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Tractables/cnfs.git /tmp/external-cnfs
          cd /tmp/external-cnfs
          git sparse-checkout set LGSynth89 iscas85b iscas89
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/external_source_commit.txt"
      - name: Fetch and checksum real external SATLIB PARITY corpus
        run: |
          mkdir -p /tmp/external-cnfs/satlib_parity
          curl --fail --location --retry 3 --max-time 90 'https://www.cs.ubc.ca/~hoos/SATLIB/Benchmarks/SAT/DIMACS/PARITY/parity.tar.gz' -o /tmp/parity.tar.gz
          echo 'd18ef13699ec3aafe0e70861fc1b9316205a6264c818cf2f69ebf3478534ba4f  /tmp/parity.tar.gz' | sha256sum --check
          tar -xzf /tmp/parity.tar.gz -C /tmp/external-cnfs/satlib_parity
          find /tmp/external-cnfs/satlib_parity -type f -name '*.cnf' | wc -l | tee satlib_parity_formula_count.txt
      - name: Identify external XOR candidates (no timing-based selection)
        run: |
          python3 research/r91_external_xor_discovery.py /tmp/external-cnfs --limit 80 --out results/r91_xor_candidates.json
          python3 - <<'PY'
          import json,os
          p=json.load(open('results/r91_xor_candidates.json'))
          print(f"R91 XOR discovery: selected={p['selected']}, status={p['status']}")
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write(f"### R91 external XOR discovery\\nSelected: {p['selected']} / 80; eligible: {p['status']}\\n\\nNot a two-way SAT performance benchmark.\\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r91-external-xor-discovery
          path: |
            results/r91_xor_candidates.json
            external_source_commit.txt
            satlib_parity_formula_count.txt
