name: DRNAS R91 external XOR discovery audit
on:
  push:
    branches: [experiment/drnas-r91-two-way-pilot-20261104]
    paths: ['research/r91_external_xor_discovery.py', '.github/workflows/drnas-r91-xor-discovery.yml']
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch external circuit benchmark collection
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Tractables/cnfs.git /tmp/external-cnfs
          cd /tmp/external-cnfs
          git sparse-checkout set LGSynth89 iscas85b iscas89
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/external_source_commit.txt"
      - name: Identify exact XOR parity encodings (no timing-based selection)
        run: |
          python3 research/r91_external_xor_discovery.py /tmp/external-cnfs --limit 80 --out results/r91_xor_candidates.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r91-external-xor-discovery
          path: |
            results/r91_xor_candidates.json
            external_source_commit.txt
