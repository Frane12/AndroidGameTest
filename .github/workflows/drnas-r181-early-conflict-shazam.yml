name: DRNAS R181 SAT Shazam true 64 128 256 early CDCL probe
on:
  push:
    branches: [experiment/drnas-r181-early-conflict-shazam-20261106]
    paths:
      - 'research/r181_early_conflict_probe.cpp'
      - 'research/r181_early_conflict_shazam.py'
      - '.github/workflows/drnas-r181-early-conflict-shazam.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r181-early-conflict-shazam
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: R181 unit tests and source-only R180 compatibility
        run: |
          set -euo pipefail
          python3 -m py_compile research/r181_early_conflict_shazam.py research/r180_sat_shazam.py
          python3 -u research/r181_early_conflict_shazam.py selftest
          python3 -u research/r180_sat_shazam.py selftest
      - name: Download strictly pinned completed R179 100 CNFs / 1000 paired trials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p r179 r181
          echo 'R181_R179_FROZEN_RUN_ID 42192153446'
          gh run download 42192153446 --repo Frane12/AndroidGameTest -n r179-source-native-pin -D r179
          for i in $(seq 0 9); do
            gh run download 42192153446 --repo Frane12/AndroidGameTest -n "r179-shard-$i" -D r179
          done
          test -f r179/frozen/manifest.json
          test "$(find r179 -maxdepth 1 -name 'shard-*.json' | wc -l)" -eq 10
      - name: Compile unmodified CaDiCaL rel-2.1.0 with conflict-cap instrumentation
        run: |
          set -euo pipefail
          git clone -q https://github.com/arminbiere/cadical.git /tmp/r181-cadical
          (
            cd /tmp/r181-cadical
            git checkout -q rel-2.1.0
            ./configure
            make -j2
          )
          git -C /tmp/r181-cadical rev-parse HEAD | tee r181/cadical-commit.txt
          g++ -std=c++17 -O2 -Wall -Wextra -I/tmp/r181-cadical/src research/r181_early_conflict_probe.cpp /tmp/r181-cadical/build/libcadical.a -o r181/r181-probe
          echo "p cnf 3 2" > r181/smoke.cnf
          echo "1 2 0" >> r181/smoke.cnf
          echo "-1 3 0" >> r181/smoke.cnf
          r181/r181-probe r181/smoke.cnf 64 | tee r181/smoke.log
          grep -q 'R181_STATS_END' r181/smoke.log
      - name: Collect real CDCL early signals on frozen instances and evaluate SHA holdout
        run: |
          set -euo pipefail
          python3 -u research/r181_early_conflict_shazam.py evaluate --source r179 --probe r181/r181-probe --timeout 20 | tee r181/run.log
          grep -q '^R181_EARLY_FINAL ' r181/run.log
          cat r181/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R181-EARLY-CONFLICT-SHAZAM
          retention-days: 90
          path: |
            r181/report.json
            r181/holdout-64.json
            r181/holdout-128.json
            r181/holdout-256.json
            r181/summary.md
            r181/run.log
            r181/smoke.log
            r181/cadical-commit.txt
            r181/probe-checkpoint.json
