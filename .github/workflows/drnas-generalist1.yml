name: DRNAS GENERALIST1 category-router selftests
on:
  push:
    branches:
      - experiment/drnas-generalist1-category-router-20261111
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate family classification, SHA isolation, PAR2 and safe fallback
        run: python -m unittest discover -s generalist/tests -v
      - name: Report research scope
        run: |
          echo 'GENERALIST1 is an offline category-selector smoke test.'
          echo 'No claimed E2E native speedup until original SHA-matched trials are connected.'
