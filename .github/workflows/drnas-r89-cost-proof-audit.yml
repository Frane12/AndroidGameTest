name: DRNAS R89 bounded cooperative RUP and XOR fail-closed audit
on:
  push:
    branches: [experiment/drnas-r89-cost-proof-gates-20261104]
    paths:
      - 'experiments/drnas_v16/r89_cost_proof_gate.py'
      - '.github/workflows/drnas-r89-cost-proof-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile and regression checks
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/r88_cooperative.py experiments/drnas_v16/r89_cost_proof_gate.py
          python3 experiments/drnas_v16/r89_cost_proof_gate.py selftest | tee r89-audit.log
          grep -q '^R89_SELFTEST_PASS' r89-audit.log
      - name: Frozen source SHA and RUP inspection
        run: |
          set -euo pipefail
          mkdir -p r89-results
          cat > r89-results/fixture.cnf <<'EOF'
          p cnf 3 4
          1 2 0
          -1 2 0
          1 -2 0
          -2 3 0
          EOF
          sha256sum r89-results/fixture.cnf > r89-results/source.sha256
          python3 experiments/drnas_v16/r89_cost_proof_gate.py inspect --cnf r89-results/fixture.cnf --out r89-results/diagnostic.json --budget 0.05
          grep -q '"xor_injection_enabled": false' r89-results/diagnostic.json
          echo R89_PROOF_GATE_AUDIT_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-R89-COST-XOR-PROOF-GATE-AUDIT
          path: |
            r89-results/
            r89-audit.log
          retention-days: 90
