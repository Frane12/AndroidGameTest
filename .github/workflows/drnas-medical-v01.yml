name: DRNAS Medical v0.1 Boolean-network SAT pilot

on:
  push:
    branches:
      - experiment/drnas-medical-v01-20261104
    paths:
      - 'research/drnas_medical/**'
      - '.github/workflows/drnas-medical-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  medical-sat-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout DRNAS medical branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen baseline solver package
        run: |
          python3 -m pip install --disable-pip-version-check python-sat==1.9.dev18
          python3 -m pip show python-sat
      - name: Exhaustive independent CNF-encoding audit
        run: python3 research/drnas_medical/boolean_models.py selftest
      - name: Generate SHA-pinned synthetic biology-inspired cases
        run: |
          python3 research/drnas_medical/boolean_models.py generate \
            --out medical-results/cnfs \
            --families memory,toggle,inhibition,xor,mixed \
            --sizes 6,10,20 --periods 1,2 --seed 20261104
      - name: Paired CaDiCaL / Kissat / MiniSat / R108 benchmark
        run: |
          python3 research/drnas_medical/benchmark.py \
            --dir medical-results/cnfs --cap 8 --repeats 2 --r108-limit 6
      - name: Preserve source CNFs, proofs and paired timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-medical-v01-synthetic-cnf
          path: medical-results/
          if-no-files-found: warn
          retention-days: 30
