name: DRNAS T5 certified novel XOR source proof selftest
on:
  push:
    branches:
      - experiment/drnas-t5-novel-derived-trail-20261108
    paths:
      - research/ultimate_t5_novel.py
      - .github/workflows/drnas-t5-novel-proof.yml
  workflow_dispatch:
jobs:
  proof-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic two-source GF2 cancellation and original SHA preservation
        run: |
          set -euo pipefail
          python3 -u research/ultimate_t5_novel.py
          python3 -m py_compile research/ultimate_t5_novel.py
