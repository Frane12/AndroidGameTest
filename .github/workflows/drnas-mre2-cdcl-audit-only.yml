name: DRNAS MRE2-CDCL P1 — final audit of completed two-source run
on:
  push:
    branches: [experiment/drnas-mre2-cdcl-twoformula-pilot-20261108]
    paths:
      - '.github/workflows/drnas-mre2-cdcl-audit-only.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch exact completed source and both 20-trial artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42485082475 --repo Frane12/AndroidGameTest -n mre2-cdcl-inputs -D .
          gh run download 42485082475 --repo Frane12/AndroidGameTest -n mre2-cdcl-case-0 -D .
          gh run download 42485082475 --repo Frane12/AndroidGameTest -n mre2-cdcl-case-1 -D .
          sha256sum -c mre2_cdcl_p1/manifest.sha256
          python3 -u research/r195_native_cms_benchmark.py verify
          # GitHub upload-artifact strips the shared parent directory.
          # Locate each case JSON and restore the directory expected by audit.
          mkdir -p mre2_cdcl_p1
          for i in 0 1; do
            src="$(find . -type f -name "case-$i.json" ! -path "./mre2_cdcl_p1/*" -print -quit)"
            if [ -n "$src" ]; then cp "$src" "mre2_cdcl_p1/case-$i.json"; fi
            test -s "mre2_cdcl_p1/case-$i.json"
          done
      - name: Independent paired SAT witness and counters completeness audit
        run: |
          set -euo pipefail
          python3 -u research/mre2_cdcl_pilot.py audit | tee mre2_cdcl_p1/audit.log
          cat mre2_cdcl_p1/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-MRE2-CDCL-P1-AUDITED-FINAL
          retention-days: 30
          path: |
            mre2_cdcl_p1/report.json
            mre2_cdcl_p1/audit.log
