name: DRNAS V11 - Independent Near-Binary Core SAT Diagnostic
on:
  push:
    branches: [experiment/drnas-v11-binary-core-diagnostic-20261101]
    paths:
      - '.github/workflows/drnas-v11-binary-core-diagnostic.yml'
      - 'research/drnas-sat-v7-8/v11_binary_core_diagnostic.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  binary-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preflight Python syntax and exact 2-SAT selftests
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/v11_binary_core_diagnostic.py
          python3 research/drnas-sat-v7-8/v11_binary_core_diagnostic.py selftest
      - uses: actions/download-artifact@v4
        with:
          name: v11-frozen-unseen-2026-inputs
          run-id: 41250184539
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: frozen
      - name: Verify frozen V11 manifest and diagnose six near-binary formulas
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v11_manifest.sha256)
          python3 -u research/drnas-sat-v7-8/v11_binary_core_diagnostic.py diagnose \
            --manifest frozen/v11_manifest.json \
            --out v11_binary_core_report.json \
            --md v11_binary_core_report.md
          cat v11_binary_core_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V11-near-2SAT-binary-core-diagnostic
          path: |
            v11_binary_core_report.json
            v11_binary_core_report.md
          if-no-files-found: warn
