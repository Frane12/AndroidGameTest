name: DRNAS V14.2 FastGate - Pinned General SAT vs V14.1 and Kissat
on:
  push:
    branches: [experiment/drnas-v142-fastgate-general-20261101]
    paths:
      - '.github/workflows/drnas-sat-v142-fastgate.yml'
      - 'research/drnas-sat-v7-8/v142_fastgate.cpp'
      - 'research/drnas-sat-v7-8/v142_fastgate_eval.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V141-36-SHA-pinned-new-and-real-CNFs
          run-id: 41263326366
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: old
      - name: Freeze exactly the same 36 inputs and verify old input hashes
        run: |
          set -euo pipefail
          (cd old && sha256sum -c v141_manifest.sha256)
          python3 -m py_compile research/drnas-sat-v7-8/v142_fastgate_eval.py
          mkdir -p frozen
          python3 -u research/drnas-sat-v7-8/v142_fastgate_eval.py freeze \
            --prior old/v141_manifest.json --out frozen/v142_manifest.json
          (cd frozen && sha256sum v142_manifest.json > v142_manifest.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-V142-same-36-original-SHA-frozen-manifest
          path: frozen/
          if-no-files-found: error

  build:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V141-General-Adaptive-and-pinned-baselines
          run-id: 41263326366
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: old
      - name: Compile native in-process FastGate with pinned original solvers
        run: |
          set -euo pipefail
          (cd old && sha256sum -c binaries.sha256)
          mkdir -p output
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -pedantic \
            research/drnas-sat-v7-8/v142_fastgate.cpp -o output/v142_fastgate
          cp old/v141_general output/v141_general
          cp old/v140_native output/v140_native
          cp old/v76_solver output/v76_solver
          cp old/legacy_solver output/legacy_solver
          cp old/kissat_solver output/kissat_solver
          chmod +x output/v142_fastgate output/v141_general output/v140_native \
            output/v76_solver output/legacy_solver output/kissat_solver
          (cd output && sha256sum v142_fastgate v141_general v140_native v76_solver legacy_solver kissat_solver > binaries.sha256)
      - name: XOR and PHP proof verification plus generic SAT/UNSAT smoke
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,"research/drnas-sat-v7-8")
          import v761_xor_holdout as xor
          import v140_evaluate as php
          import v141_general_eval as generic
          import v137_fastpath as verify
          bin=Path("output").resolve()
          def call(raw):
              input=Path("/tmp/v142_smoke.cnf");input.write_bytes(raw)
              r=subprocess.run([str(bin/"v142_fastgate"),str(input),
                                str(bin/"kissat_solver"),"1422026"],
                                capture_output=True,text=True,timeout=12)
              return r
          for i in (0,5,18,47):
              meta,raw=xor.make(i);r=call(raw)
              assert r.returncode==0,(r.stdout,r.stderr)
              value=json.loads(next(x.split("\t",1)[1] for x in r.stdout.splitlines() if x.startswith("DRNAS_HYBRID_RESULT\t")))
              assert value["status"]==meta["official_label"] and value["path"]=="affine_exact"
              n,cs=verify.read_dimacs(raw);assert verify.verify(n,cs,value)
          for i in (0,3,5,7):
              meta,raw=php.php(i);r=call(raw)
              assert r.returncode==0,(r.stdout,r.stderr)
              value=json.loads(next(x.split("\t",1)[1] for x in r.stdout.splitlines() if x.startswith("DRNAS_HYBRID_RESULT\t")))
              assert value["status"]=="UNSAT" and value["path"]=="pigeonhole_exact"
              n,cs=verify.read_dimacs(raw);assert verify.verify(n,cs,value)
          for family in generic.FAMILIES:
              meta,raw=generic.synthetic(family,0)
              r=call(raw)
              assert "DRNAS_V142_ROUTE\tkissat_direct" in r.stdout,(family,r.stdout,r.stderr)
              expected=10 if meta["official_label"]=="SAT" else 20
              assert r.returncode==expected,(family,r.returncode,r.stderr)
          meta,raw=php.php(0);n,cs=verify.read_dimacs(raw)
          import v134_constructive as orig
          r=call(orig.dimacs(n,cs[:-1]))
          assert "DRNAS_V142_ROUTE\tkissat_direct" in r.stdout,(r.stdout,r.stderr)
          print("V142_SMOKE_PASS 4 XOR + 4 PHP proven + 3 general + PHP near miss")
          PY
          (cd output && sha256sum -c binaries.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-V142-FastGate-and-pinned-3-baselines
          path: output/
          if-no-files-found: error

  benchmark:
    needs: [freeze,build]
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        cohort: [synthetic,real]
        shard: [0,1,2,3,4,5]
    name: v142-${{ matrix.cohort }}-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V142-same-36-original-SHA-frozen-manifest
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V142-FastGate-and-pinned-3-baselines
          path: bin
      - name: Byte pin both inputs and solver executable hashes, then measure paired cases
        env:
          SHARD: ${{ matrix.shard }}
          COHORT: ${{ matrix.cohort }}
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v142_manifest.sha256)
          (cd bin && sha256sum -c binaries.sha256)
          chmod +x bin/v142_fastgate bin/v141_general bin/v140_native \
            bin/v76_solver bin/legacy_solver bin/kissat_solver
          python3 -u research/drnas-sat-v7-8/v142_fastgate_eval.py "$COHORT" \
            --manifest frozen/v142_manifest.json --shard "$SHARD" \
            --v142 bin/v142_fastgate --v141 bin/v141_general --v140 bin/v140_native \
            --v76 bin/v76_solver --legacy bin/legacy_solver \
            --kissat bin/kissat_solver --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v142-${{ matrix.cohort }}-${{ matrix.shard }}
          path: results/
          if-no-files-found: warn

  audit:
    needs: [freeze,build,benchmark]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V142-same-36-original-SHA-frozen-manifest
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: v142-*
          path: combined
      - name: Audit all 288 matched trials with unchanged source SHA and truth
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v142_manifest.sha256)
          python3 -u research/drnas-sat-v7-8/v142_fastgate_eval.py audit \
            --manifest frozen/v142_manifest.json --combined combined \
            --out v142_report.json --md v142_report.md
          cat v142_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V142-General-FastGate-36-matched-final-audit
          path: |
            frozen/
            combined/
            v142_report.json
            v142_report.md
          if-no-files-found: warn
