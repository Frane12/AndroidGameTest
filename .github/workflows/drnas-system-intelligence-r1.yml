name: DRNAS System Intelligence R1 — black-box response benchmark
on:
  push:
    branches:
      - experiment/drnas-system-intelligence-r1-20261106
    paths:
      - research/drnas_system_intelligence_r1/**
      - .github/workflows/drnas-system-intelligence-r1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  response-identification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile research/drnas_system_intelligence_r1/drnas_system_r1.py
      - name: Reproducible holdout benchmark
        run: python research/drnas_system_intelligence_r1/drnas_system_r1.py --systems 24 --targets 48 --out system_r1_artifacts
      - name: Upload summary and all trials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drnas-system-intelligence-r1-results
          path: system_r1_artifacts/
          if-no-files-found: warn
