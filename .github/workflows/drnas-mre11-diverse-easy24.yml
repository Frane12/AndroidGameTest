name: DRNAS MRE11 — Easy Diverse24 10 families 5 native C++ arms 4 seeds 5s PAR2
on:
  push:
    branches: [experiment/drnas-mre11-diverse-easy24-20261108]
    paths: ['.github/workflows/drnas-mre11-diverse-easy24.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-mre11-diverse-easy24-20261108
  cancel-in-progress: false
jobs:
  prepare:
    name: Freeze 4 screened official + 20 NEW deterministic diverse synthetic SHA, CaDiCaL truth check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve existing frozen easy12 sources and PINNED MRE11 C++ binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42515830079 -R Frane12/AndroidGameTest \
            -n mre11-easy12-reference-screened-sha12-immutable-cpp -D .
          (cd mre11_easy && sha256sum -c source.sha256)
          sha256sum -c mre11/bin.sha256
          chmod +x mre11/bin/native mre11/bin/standalone
          test -f mre5/lib/libcryptominisat5.so.5.11
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          ldd mre11/bin/native | grep -q 'libcryptominisat5.so.5.11'
          python3 -m py_compile research/mre11_diverse_easy24.py
          echo MRE11_DIVERSE_PINNED_CPP_OK
      - name: Install independent CaDiCaL for SAT/UNSAT reference checking only
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
      - name: Freeze exactly 24 source-only formulas and independent status, NEVER scan external indices
        run: |
          set -euo pipefail
          python3 -u research/mre11_diverse_easy24.py freeze --cadical /usr/bin/cadical \
            | tee mre11-diverse-freeze.log
          (cd mre11_diverse24 && sha256sum -c source.sha256)
          python3 -u research/mre11_diverse_easy24.py verify
          python3 -u research/mre11_diverse_easy24.py diagnostic \
            --standalone mre11/bin/standalone | tee mre11-diverse-gates.log
          grep -q '^MRE11_DIVERSE_PARITY_PASS' mre11-diverse-gates.log
      - uses: actions/upload-artifact@v4
        with:
          name: mre11-diverse24-fixed-24SHA-pinned-exact-Cpp
          retention-days: 14
          if-no-files-found: error
          compression-level: 6
          path: |
            mre11_diverse24/*.cnf
            mre11_diverse24/manifest.json
            mre11_diverse24/source.sha256
            mre11_diverse24/gate_diagnostics.json
            mre11/bin/native
            mre11/bin/standalone
            mre11/bin.sha256
            mre5/lib/libcryptominisat5.so.5.11
            mre11-diverse-*.log
  factorial:
    name: Easy diverse 24 original end-to-end SAT/UNSAT pinned C++ shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mre11-diverse24-fixed-24SHA-pinned-exact-Cpp
          path: .
      - name: Original SHA, exact binary and frozen cohort verification
        run: |
          set -euo pipefail
          (cd mre11_diverse24 && sha256sum -c source.sha256)
          sha256sum -c mre11/bin.sha256
          chmod +x mre11/bin/native
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          ldd mre11/bin/native | grep -q libcryptominisat5
          python3 -u research/mre11_diverse_easy24.py verify
      - name: Five C++ arms four SHA-paired seeds 5s cap including preprocessing
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          python3 -u research/mre11_diverse_easy24.py shard \
            --shard ${{ matrix.shard }} --native mre11/bin/native \
            | tee mre11_diverse24/shard-${{ matrix.shard }}.log
          grep -q '^MRE11_DIVERSE_SHARD_PASS ${{ matrix.shard }} 120$' mre11_diverse24/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mre11-diverse24-shard-${{ matrix.shard }}
          retention-days: 14
          compression-level: 6
          path: |
            mre11_diverse24/shard-${{ matrix.shard }}.json
            mre11_diverse24/shard-${{ matrix.shard }}.log
  audit:
    name: Final 480 paired trial PAR2 by family, original SAT witness and UNSAT check
    needs: factorial
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mre11-diverse24-fixed-24SHA-pinned-exact-Cpp
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: mre11-diverse24-shard-*
          merge-multiple: true
          path: mre11_diverse24
      - name: Fail closed on incomplete source SHA seed mode pairing, SAT witness or PAR2
        run: |
          set -euo pipefail
          (cd mre11_diverse24 && sha256sum -c source.sha256)
          sha256sum -c mre11/bin.sha256
          python3 -u research/mre11_diverse_easy24.py audit | tee mre11_diverse24/audit.log
          grep -q '^MRE11_DIVERSE_FINAL' mre11_diverse24/audit.log
          grep '^MRE11_DIVERSE_FINAL' mre11_diverse24/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-MRE11-DIVERSE-EASY24-5ARM-4SEED-5S-PAR2-AUDIT
          retention-days: 30
          if-no-files-found: error
          path: |
            mre11_diverse24/report.json
            mre11_diverse24/audit.log
            mre11_diverse24/manifest.json
            mre11_diverse24/source.sha256
            mre11_diverse24/gate_diagnostics.json
