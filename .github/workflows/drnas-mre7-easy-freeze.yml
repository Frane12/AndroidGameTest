name: DRNAS MRE7 reference-only source freeze SAT2024 SAT2025 easy CNFs
on:
  push:
    branches: [experiment/drnas-mre7-prospective-easy-gate-20261108]
    paths: ['.github/workflows/drnas-mre7-easy-freeze.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover prior SHAs and fixed original 5.11.15 reference CMS binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p mre5/lib mre6b_blind mre7_easy
          gh run download 42495094599 --repo Frane12/AndroidGameTest -n mre6b-blind-original-official-SAT2026 -D mre6b_blind
          gh run download 42495094599 --repo Frane12/AndroidGameTest -n mre6b-blind-pinned-CMS -D mre5
          sha256sum -c mre5/binaries.sha256
          (cd mre6b_blind && sha256sum -c source.sha256)
          python3 -u research/mre6b_blind_freeze.py verify
          python3 -m py_compile research/mre7_reference_easy_freeze.py
      - name: Screen official untouched SAT2024 SAT2025 via CMS ONLY, without MRE gate
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgmp10 cadical
          chmod +x mre5/native
          ln -sf libcryptominisat5.so.5.11 mre5/lib/libcryptominisat5.so
          ln -sf libcryptominisat5.so.5.11 mre5/lib/libcryptominisat5.so.5
          LD_LIBRARY_PATH="$PWD/mre5/lib" ldd mre5/native | grep "$PWD/mre5/lib/libcryptominisat5.so"
          export LD_LIBRARY_PATH="$PWD/mre5/lib:${LD_LIBRARY_PATH:-}"
          python3 -u research/mre7_reference_easy_freeze.py freeze \
            --binary mre5/native --cadical /usr/bin/cadical | tee mre7_easy/freeze.log
          grep -q '^MRE7_FREEZE_FINAL' mre7_easy/freeze.log
          python3 -u research/mre7_reference_easy_freeze.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-MRE7-ORIGINALS-REFERENCE-ONLY-COHORT
          retention-days: 15
          compression-level: 6
          path: |
            mre7_easy/manifest.json
            mre7_easy/source.sha256
            mre7_easy/*.cnf
            mre7_easy/freeze.log
