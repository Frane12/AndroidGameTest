name: DRNAS SEARCH6 - structural source-only strata native VMTF EVSIDS proof-audited
run-name: SEARCH6 12 new SAT24/25 SHA 4 structural strata x 9 arms x 2 reps 12s 216 E2E
on:
  push:
    branches: [experiment/drnas-search6-structural-strata-native-cdcl-20261110]
    paths:
      - .github/workflows/drnas-search6-structural-strata-e2e.yml
      - research/drnas_search6_stratified_e2e.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-search6-${{ github.ref }}
  cancel-in-progress: false
jobs:
  freeze:
    name: Strict 4-structure source-only original SHA freeze, 120 toy exact solver proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Restore immutable native CDCL binary and historical SEARCH5/4 registries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42787100363 -R Frane12/AndroidGameTest -n SEARCH5-12-NEW-SAT24-25-SHA-SOURCEONLY-FROZEN-BINARIES -D .
          mkdir -p prior_hist/search5/mre_search5 prior_hist/search4
          cp mre_search5/manifest.json prior_hist/search5/mre_search5/manifest.json
          gh run download 42784853520 -R Frane12/AndroidGameTest -n SEARCH4-S3HOLDOUT-official-SAT24-25-16SHA-sourceonly-frozen -D prior_hist/search4
          test -s prior_hist/search4/mre_search4_fresh/manifest.json
          test -s prior_hist/search5/mre_search5/manifest.json
          test -s mre_search3/bin/search3_cadical
          test -s mre_search2/bin/search1_relabel
          test -s mre_equiv6/manifest.json
          test -s prior_search2/mre_equiv13/manifest.json
          chmod +x mre_search3/bin/search3_cadical mre_search2/bin/search1_relabel mre_equiv6/bin/cadical_3_0_1 built/bin/kissat_4_0_4
      - name: Native original-CNF CDCL toy exhaustive checks from existing SEARCH3
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          python3 -m py_compile research/drnas_search6_stratified_e2e.py
          mkdir -p mre_search6
          python3 -u research/drnas_search3_selective_e2e.py selftest | tee mre_search6/native_selftest.log
          grep -q '^SEARCH3_SELFTEST_PASS ' mre_search6/native_selftest.log
      - name: Freeze diverse SHA without using any SAT CDCL outcome or measured time
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          python3 -u research/drnas_search6_stratified_e2e.py freeze | tee mre_search6/source_freeze.log
          grep -q '^SEARCH6_FROZEN ' mre_search6/source_freeze.log
          python3 -u research/drnas_search6_stratified_e2e.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SEARCH6-12SHA-4STRATA-SOURCEONLY-NATIVE-FROZEN
          retention-days: 21
          if-no-files-found: error
          path: |
            mre_search6/manifest.json
            mre_search6/source_progress.json
            mre_search6/source_freeze.log
            mre_search6/native_selftest.log
            mre_search6/cases/*.cnf
            mre_search3/bin/search3_cadical
            mre_search2/bin/search1_relabel
            mre_equiv6/bin/cadical_3_0_1
            built/bin/kissat_4_0_4
            mre_equiv6/manifest.json
            prior_search2/mre_equiv13/manifest.json
            prior_hist/search4/mre_search4_fresh/manifest.json
            prior_hist/search5/mre_search5/manifest.json
            mre5/lib/libcryptominisat5.so.5.11
  paired:
    name: SEARCH6 36 native source-original SHA E2E trials, oneCPU, shard ${{ matrix.shard }}
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: SEARCH6-12SHA-4STRATA-SOURCEONLY-NATIVE-FROZEN
          path: .
      - name: Paired native VMTF EVSIDS both reverse placebo original SHA true CDCL counters
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_search3/bin/search3_cadical mre_search2/bin/search1_relabel mre_equiv6/bin/cadical_3_0_1 built/bin/kissat_4_0_4
          python3 -u research/drnas_search6_stratified_e2e.py verify
          python3 -u research/drnas_search6_stratified_e2e.py shard --shard ${{ matrix.shard }} | tee mre_search6/shard-${{ matrix.shard }}.log
          grep -q '^SEARCH6_SHARD_PASS ' mre_search6/shard-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SEARCH6-shard-${{ matrix.shard }}
          retention-days: 21
          if-no-files-found: error
          path: |
            mre_search6/shard-${{ matrix.shard }}.json
            mre_search6/shard-${{ matrix.shard }}.log
  audit:
    name: SEARCH6 216 true original-SHA paired E2E PAR2 SCC XOR by stratum audit
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: SEARCH6-12SHA-4STRATA-SOURCEONLY-NATIVE-FROZEN
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: SEARCH6-shard-*
          merge-multiple: true
          path: .
      - name: Fail-closed original SHA SAT model and reference UNSAT consensus per stratum
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_search3/bin/search3_cadical mre_search2/bin/search1_relabel mre_equiv6/bin/cadical_3_0_1 built/bin/kissat_4_0_4
          for i in 0 1 2 3 4 5; do test -s "mre_search6/shard-$i.json"; done
          python3 -u research/drnas_search6_stratified_e2e.py verify
          python3 -u research/drnas_search6_stratified_e2e.py audit | tee mre_search6/audit.log
          grep -q '^SEARCH6_FINAL ' mre_search6/audit.log
          grep '^SEARCH6_FINAL ' mre_search6/audit.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-SEARCH6-12SHA-4STRATA-216-E2E-SCC-XOR-PAR2-FINAL
          retention-days: 30
          path: |
            mre_search6/manifest.json
            mre_search6/report.json
            mre_search6/audit.log
            mre_search6/shard-*.json
