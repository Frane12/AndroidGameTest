name: DRNAS V13.11 - Certified Local XOR on Frozen Real CNFs
on:
  push:
    branches:
      - experiment/drnas-v1311-certified-local-xor-20261101
    paths:
      - '.github/workflows/drnas-sat-v1311-certified-xor.yml'
      - 'research/drnas-sat-v7-8/v1311_local_xor.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax + 60 deterministic brute-force soundness tests
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas-sat-v7-8/v1311_local_xor.py
          python3 -u research/drnas-sat-v7-8/v1311_local_xor.py selftest
          echo "No solver routing, binaries or SAT/UNSAT labels modified." >> "$GITHUB_STEP_SUMMARY"

  extract:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    name: v1311-xor-shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V139-new-SC2024-12-frozen-verified-CNFs
          run-id: 41261415700
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: frozen
      - name: Check SHA-frozen V13.9 identities
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v139_selector.sha256 && sha256sum -c v139_manifest.sha256)
      - name: Parse CNF, identify exact local parity blocks, verify GF2 proofs
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -u research/drnas-sat-v7-8/v1311_local_xor.py run \
            --manifest frozen/v139_manifest.json --shard "$SHARD" --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1311-xor-shard-${{ matrix.shard }}
          path: results/
          if-no-files-found: warn

  audit:
    needs: [preflight, extract]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-V139-new-SC2024-12-frozen-verified-CNFs
          run-id: 41261415700
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: v1311-xor-shard-*
          path: combined
          merge-multiple: false
      - name: Verify 12-case report and no unsupported SAT claims
        run: |
          set -euo pipefail
          (cd frozen && sha256sum -c v139_selector.sha256 && sha256sum -c v139_manifest.sha256)
          python3 -u research/drnas-sat-v7-8/v1311_local_xor.py audit \
            --manifest frozen/v139_manifest.json --combined combined \
            --json v1311_certified_audit.json --md v1311_certified_audit.md
          cat v1311_certified_audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-V1311-certified-local-XOR-final-audit
          path: |
            v1311_certified_audit.json
            v1311_certified_audit.md
          if-no-files-found: warn
