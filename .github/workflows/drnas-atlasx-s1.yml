name: DRNAS ATLASX-S1 structured SATLIB and planted circuits
run-name: ATLASX-S1 4 external structured plus 4 planted 5 arms 3 reps 8s oneCPU
on:
  push:
    branches: [experiment/drnas-atlasx-structured-s1-20261111]
    paths:
      - research/drnas_atlasx_s1_bench.py
      - research/drnas_atlasx.cpp
      - research/drnas_atlas1.cpp
      - research/drnas_atlas1_generate.py
      - research/drnas_native_core_r3c.cpp
      - .github/workflows/drnas-atlasx-s1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source scripts, compile native engine, exhaustive local controls
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_atlasx_s1_bench.py research/drnas_atlasx_smoke.py research/drnas_atlas1_generate.py
          python3 research/drnas_atlas1_generate.py --out mre_atlasx/atlas1_table.hpp
          mkdir -p mre_atlasx/bin
          g++ -std=c++17 -O2 -I mre_atlasx research/drnas_atlasx.cpp -o mre_atlasx/bin/drnas_atlasx
          mre_atlasx/bin/drnas_atlasx --atlasx-selftest
          python3 research/drnas_atlasx_smoke.py
  holdout:
    needs: correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build reference solvers
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cadical
          mkdir -p mre_atlasx_s1/bin
          git clone --quiet https://github.com/arminbiere/kissat.git mre_atlasx_s1/kissat-src
          git -C mre_atlasx_s1/kissat-src checkout --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          (cd mre_atlasx_s1/kissat-src && ./configure && make -j2)
          install -m 755 mre_atlasx_s1/kissat-src/build/kissat mre_atlasx_s1/bin/kissat
          install -m 755 "$(command -v cadical)" mre_atlasx_s1/bin/cadical
      - name: Build standalone native DRNAS ATLAS-X
        run: |
          set -euo pipefail
          python3 research/drnas_atlas1_generate.py --out mre_atlasx_s1/atlas1_table.hpp
          g++ -std=c++17 -O2 -I mre_atlasx_s1 research/drnas_atlasx.cpp -o mre_atlasx_s1/bin/drnas_atlasx
      - name: SHA-pinned original structured and planted-control five-arm PAR2
        env:
          ATLASX_S1_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          taskset -c "$(taskset -pc $$ | sed 's/.*: //' | cut -d, -f1 | cut -d- -f1)" python3 -u research/drnas_atlasx_s1_bench.py | tee mre_atlasx_s1/benchmark.log
          grep '^ATLASX_S1_FINAL ' mre_atlasx_s1/benchmark.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATLASX-S1-SHARD-${{ matrix.shard }}-AUDIT
          retention-days: 30
          path: |
            mre_atlasx_s1/audit.json
            mre_atlasx_s1/source.json
            mre_atlasx_s1/source_*.cnf
            mre_atlasx_s1/*.log
            mre_atlasx_s1/planted_witness.sha256
