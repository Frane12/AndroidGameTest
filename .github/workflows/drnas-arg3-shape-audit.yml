name: DRNAS ARG3 original CNF shape and size gate audit (NO SOLVERS)
on:
  push:
    branches: [experiment/drnas-arg3-realarg-large2-20261115]
    paths:
      - research/arg3_realarg/shape_audit.py
      - .github/workflows/drnas-arg3-shape-audit.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drnas-arg3-realarg-shape-audit-20261115
  cancel-in-progress: false
jobs:
  source_shape_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 43714913984
          repository: Frane12/AndroidGameTest
          name: arg3-realarg-frozen-originals
          github-token: ${{ github.token }}
          path: frozen/originals
      - name: Restore unmodified real 2025 source SHA manifest
        run: |
          set -euo pipefail
          tar -xzf frozen/originals/arg3-realarg-frozen.tgz
          python3 -m py_compile research/arg3_realarg/shape_audit.py
          sha256sum arg3_realarg_inputs/manifest.json
      - name: Classify source structure and eligibility without any SAT solver
        run: |
          set -euo pipefail
          python3 -u research/arg3_realarg/shape_audit.py | tee arg3_shape_live.log
          grep -q '^ARG3_SOURCE_SHAPE_AUDIT ' arg3_shape_live.log
      - uses: actions/upload-artifact@v4
        with:
          name: arg3-realarg-source-shape
          path: |
            arg3_shape_results/
            arg3_shape_live.log
          if-no-files-found: error
          retention-days: 60
