name: DRNAS X22 source-certified XOR fingerprint and GF2 contradiction audit
on:
  push:
    branches: [experiment/drnas-x22-exact-projection-20261109]
    paths:
      - 'research/drnas_x22_xor_forensics.py'
      - '.github/workflows/drnas-x22-xor-forensics.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-x22-xor-forensics-20261109
  cancel-in-progress: false
jobs:
  exact_source_audit:
    name: Six X21 SHA source-only parity clause block coverage and GF2 rank audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: x21-frozen-sources-binaries
          run-id: 42586193407
          github-token: ${{ github.token }}
          path: .
      - name: Verify original SHA and exact clause-support completeness
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cadical
          export PYTHONPATH="$PWD/research" LD_LIBRARY_PATH="$PWD/mre5/lib"
          chmod +x mre_x21/bin/selective mre_x4/bin/native built/bin/kissat_4_0_4
          python3 -m py_compile research/drnas_x22_xor_forensics.py
          mkdir -p mre_x22
          python3 -u research/drnas_x22_xor_forensics.py | tee mre_x22/xor-forensics.log
          grep -q '^X22_XOR_FORENSICS_FINAL ' mre_x22/xor-forensics.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-X22-SOURCE-EXACT-XOR-GF2-FORENSICS
          retention-days: 30
          path: |
            mre_x22/xor-forensics.log
            mre_x22/xor-forensics.json
