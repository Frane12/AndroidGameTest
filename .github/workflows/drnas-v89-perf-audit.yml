name: DRNAS SAT v8.9 — audit saved Linux hardware counter access
on:
  push:
    branches:
      - experiment/drnas-sat-v89-perf-audit-20261031
    paths:
      - '.github/workflows/drnas-v89-perf-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect-saved-perf-counters:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: v89-shard-*
          run-id: 41227731300
          github-token: ${{ github.token }}
          repository: Frane12/AndroidGameTest
          path: saved-v89
      - name: Show actual permissions and counts, or explicit denial, no new SAT solving
        shell: bash
        run: |
          set -euo pipefail
          for shard in 0 1 2 3 4; do
            dir="saved-v89/v89-shard-$shard"
            echo "===== SHARD $shard ====="
            if test -f "$dir/perf_access.txt"; then
              cat "$dir/perf_access.txt"
            else
              echo "NO_PERF_ACCESS_FILE"
            fi
            for mode in ca_plain v89_rate_no_hints v89_rate_late_hints; do
              f="$dir/perf_$mode.stderr"
              if test -f "$f"; then
                echo "mode=$mode"
                grep -E 'cycles|instructions|cache-misses|branches|branch-misses|not supported|not counted|No permission|Operation not permitted|Error|perf_event_paranoid' "$f" | tail -12 || true
              fi
            done
          done
