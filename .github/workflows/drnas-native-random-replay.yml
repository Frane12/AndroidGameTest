name: DRNAS native random legacy replay
on:
  push:
    branches: [experiment/drnas-native-random-replay-20261125]
    paths: ['.github/workflows/drnas-native-random-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Replay exact legacy CNF in native C++17 with independent verification
        run: |
          python3 - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location("general4", "research/native-general4/run.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          mod.CASES=[["ekmett/ersatz","7e08b9e4bbec5ea93804e6cab36b9a7424cc2844","data/dimacs/bf/bf0432-007.cnf","fecb5f45ce38e17f88da2db6b5e2b216ae1fd83e"]]
          mod.main(0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-random-replay
          path: |
            native4-out/result.json
            native4-out/*.drat
            native4-out/*.model
            native4-out/native.cpp
            native4-out/general4.hpp
          if-no-files-found: warn
