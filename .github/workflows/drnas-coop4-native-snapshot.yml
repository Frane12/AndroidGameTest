name: DRNAS COOP4 native source snapshot and API smoke
on:
  push:
    branches:
      - experiment/drnas-coop4-native-lemma-bus-20261117
jobs:
  native_api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check genuine native module APIs
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/coop4_api.cpp <<'CPP'
          #include <vector>
          #include <string>
          #include "src/pcmax_capacity.hpp"
          #include "src/pcmax_clause_hall.hpp"
          #include "src/hall3_guard.hpp"
          #include "src/math4_xor_unit.hpp"
          int main() {
            std::vector<std::vector<int>> clauses={{1},{-1}};
            pcmax::Options o; o.seconds=0.005;
            const std::string sha(64,'0');
            auto h=pcmax::analyze_clause_hall(clauses,1,sha,o);
            auto p=pcmax::analyze(clauses,1,sha,o);
            auto x=pcmax::math4::xor_unit(clauses,1,sha,o.seconds);
            return h.verified||p.verified||x.verified ? 1 : 0;
          }
          CPP
          g++ -O2 -std=c++20 -Wall -Wextra -pedantic -I. /tmp/coop4_api.cpp -o /tmp/coop4_api
          /tmp/coop4_api
          echo COOP4_NATIVE_PRODUCTION_API_PASS
      - name: Export exact native source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/coop4/native_modules
          cp src/pcmax_capacity.hpp src/pcmax_clause_hall.hpp src/hall3_guard.hpp src/math4_xor_unit.hpp /tmp/coop4/native_modules/
          cp research/math5/check_math5.py research/math5/emit_veripb_eo_multiplicity.py /tmp/coop4/
          tar -C /tmp/coop4 -czf coop4-native-source.tgz .
          sha256sum coop4-native-source.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: coop4-native-source-pinned
          path: coop4-native-source.tgz
          if-no-files-found: error
          retention-days: 7
