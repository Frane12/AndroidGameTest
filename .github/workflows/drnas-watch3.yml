name: DRNAS WATCH3 BCP compiler optimization pilot
run-name: WATCH3 one frozen CNF 5 reps O2 O3 O3native O2frame Kissat oneCPU
on:
  push:
    branches: [experiment/drnas-watch3-compiler-pilot-20261111]
    paths:
      - research/drnas_native_core_r3c.cpp
      - research/drnas_factor42_native.cpp
      - research/drnas_watch3.py
      - .github/workflows/drnas-watch3.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install compiler and verify source manifest
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_watch3.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential
      - name: Restore pinned Kissat binary
        id: cache
        uses: actions/cache@v4
        with:
          path: .reference-solvers/bin/kissat
          key: watch1-ubuntu2404-kissat-8af8e56f174b778aef3aa45af9f739b2a5f492c2-v1
      - name: Build pinned Kissat only on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .reference-solvers/bin
          git clone --quiet https://github.com/arminbiere/kissat.git .reference-solvers/kissat-src
          git -C .reference-solvers/kissat-src checkout --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          (cd .reference-solvers/kissat-src && ./configure && make -j2)
          install -m 755 .reference-solvers/kissat-src/build/kissat .reference-solvers/bin/kissat
      - name: Compile identical source with compiler-only optimization variants
        run: |
          set -euo pipefail
          mkdir -p mre_watch3/bin
          g++ -std=c++17 -O2 research/drnas_factor42_native.cpp -o mre_watch3/bin/drnas_baseline
          g++ -std=c++17 -O3 research/drnas_factor42_native.cpp -o mre_watch3/bin/drnas_o3
          g++ -std=c++17 -O3 -march=x86-64-v3 research/drnas_factor42_native.cpp -o mre_watch3/bin/drnas_o3native
          g++ -std=c++17 -O2 -fomit-frame-pointer research/drnas_factor42_native.cpp -o mre_watch3/bin/drnas_o2frame
          g++ -std=c++17 -O2 research/drnas_native_core_r3c.cpp -o mre_watch3/bin/r3c_selftest
          mre_watch3/bin/r3c_selftest --selftest
          install -m 755 .reference-solvers/bin/kissat mre_watch3/bin/kissat
          ldd mre_watch3/bin/kissat | tee mre_watch3/kissat.ldd
          ! grep -q 'not found' mre_watch3/kissat.ldd
      - name: Run one frozen SHA x five repeats x four compiler variants and Kissat
        run: |
          set -euo pipefail
          taskset -c "$(taskset -pc $$ | sed 's/.*: //' | cut -d, -f1 | cut -d- -f1)" \
            python3 -u research/drnas_watch3.py | tee mre_watch3/benchmark.log
          grep -q '^WATCH3_FINAL ' mre_watch3/benchmark.log
          grep '^WATCH3_FINAL ' mre_watch3/benchmark.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-WATCH3-COMPILER-ONE-CNF-5REPS
          retention-days: 30
          if-no-files-found: warn
          path: |
            mre_watch3/audit.json
            mre_watch3/sources.json
            mre_watch3/*.cnf
            mre_watch3/*.log
