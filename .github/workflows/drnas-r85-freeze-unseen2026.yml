name: DRNAS R85 freeze new 2025 plus verified 2026 original CNFs
on:
  push:
    branches: [experiment/drnas-r85-abcd-parallel-20261104]
    paths:
      - '.github/workflows/drnas-r85-freeze-unseen2026.yml'
      - 'experiments/drnas_v16/r85_freeze_unseen2025_2026.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r85-2026-new-source-freeze-20261104
  cancel-in-progress: true
jobs:
  frozen:
    name: Strict historical disjointness and SHA selection, true original competition CNFs
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python and check source scanner independently
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/r85_freeze_unseen2025_2026.py
          python3 -u experiments/drnas_v16/r63_real2026_xor_prevalence_fallback.py selftest
      - uses: actions/download-artifact@v4
        with:
          name: r63-frozen-real2026-originals-and-xor-prevalence
          run-id: 41707669490
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior63
      - uses: actions/download-artifact@v4
        with:
          name: r66-frozen-new-official-sources
          run-id: 41717235335
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior66
      - uses: actions/download-artifact@v4
        with:
          name: r67-frozen-new-official-sources
          run-id: 41719704574
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior67
      - uses: actions/download-artifact@v4
        with:
          name: r81-fresh-originals-structural-holdout
          run-id: 41752571755
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior81
      - uses: actions/download-artifact@v4
        with:
          name: r82-frozen-originals-and-prospective-selection
          run-id: 41756938173
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: prior82
      - name: Freeze 4 new SAT2025 and 4 new verified SAT2026 original CNFs before comparison
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r85_freeze_unseen2025_2026.py \
            --r63 prior63/fresh/manifest.json \
            --r66 prior66/new/manifest.json \
            --r67 prior67/new/manifest.json \
            --r81 prior81/world/manifest.json \
            --r82 prior82/world/manifest.json --out world | tee r85-freeze.log
          (cd world && sha256sum -c source.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R85-NEW-2025-2026-ORIGINALS-FROZEN
          path: |
            world/
            r85-freeze.log
          if-no-files-found: warn
          retention-days: 90
