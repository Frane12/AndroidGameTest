name: DRNAS SAT LOCAL-HYBRID1 mixed structure soundness
on:
  push:
    branches: [experiment/drnas-sat-local-hybrid1-20261115]
    paths:
      - src/drnas_sat_local.hpp
      - src/drnas_sat_construct.hpp
      - src/drnas_x59.cpp
      - research/sat_local1/**
      - .github/workflows/drnas-sat-local-hybrid1.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-sat-local-hybrid1-20261115
  cancel-in-progress: false
jobs:
  soundness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile one-core native constructor and integrated CDCL
        run: |
          set -euo pipefail
          mkdir -p build
          g++ -O3 -std=c++20 -DNDEBUG -Wall -Wextra \
            src/drnas_sat_construct.cpp -o build/drnas-sat-construct
          g++ -O3 -std=c++20 -DNDEBUG -Wall -Wextra \
            src/drnas_x59.cpp -o build/drnas-sat-local-x59
          sha256sum src/drnas_sat_local.hpp src/drnas_x59.cpp build/drnas-sat-local-x59
      - name: Bounded mixed-structure SAT witness and UNSAT negative controls
        run: |
          set -euo pipefail
          python3 -m py_compile research/sat_local1/*.py
          PYTHONHASHSEED=0 OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 \
            python3 -u research/sat_local1/selftest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drnas-local1-soundness-audit
          path: |
            src/drnas_sat_local.hpp
            research/sat_local1/selftest.py
          retention-days: 45
