name: DRNAS SAT R17 live harm-risk gate frozen prospective 3360 trials
on:
  push:
    branches: [experiment/drnas-r17-risk-aware-frozen-20261102]
    paths:
      - '.github/workflows/drnas-r17-risk.yml'
      - 'experiments/drnas_v16/patch_r17_risk.py'
      - 'experiments/drnas_v16/r17_risk_benchmark.py'
      - 'experiments/drnas_v16/r17_risk_analysis.py'
      - 'experiments/drnas_v16/r17_frozen_protocol.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: drnas-r17-risk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    name: Audit pinned model, native C compile, SAT/UNSAT and score parity
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Frozen risk training source and model hash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/{r17_train_risk,patch_r17_risk,r17_risk_benchmark,r17_risk_analysis,patch_r16_live_ridge,r16_live_benchmark}.py
          test "$(git hash-object experiments/drnas_v16/r17-frozen-model/risk_model.json)" = 93ce3a16d28cb90f2ba674e846a2740566414b6e
          test "$(git hash-object experiments/drnas_v16/r15-results/current/frozen_trained_models.json)" = d005747f177008172b49cef5f0b8a6f29c3ffc46
          test "$(git hash-object research/drnas-sat-v7-8/v1531_nohang.cpp)" = d280a2ffa28d72aec183323bbea40544d676112d
          python3 - <<'PY'
          import sys
          from pathlib import Path
          from tempfile import TemporaryDirectory
          sys.path.insert(0,'experiments/drnas_v16')
          import r17_risk_benchmark as b
          import patch_r17_risk as p
          cfg,m=b.load()
          assert p.load()==m
          assert b.sha(b.RISK)==cfg["risk_model_sha256"]=="d56f5e193dd1face88a21f1684d7893a4ad4918ef0da67efb6184007cbf9452f"
          hist=b.historic_registry()
          assert len(hist)==2254
          with TemporaryDirectory() as t:
            cases=b.make_cases("n240_test0",Path(t),hist)
            assert len(cases)==10 and all(c["formula_sha256"] not in hist for c in cases)
          print("R17_FROZEN_RISK_AND_BLIND_HISTORY_PASS")
          PY
      - name: Build pinned Kissat with frozen R17 risk veto, no change to reference
        run: |
          set -euo pipefail
          git clone -q https://github.com/arminbiere/kissat.git /tmp/kissat-r6-patched
          git -C /tmp/kissat-r6-patched checkout -q --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          test "$(git -C /tmp/kissat-r6-patched rev-parse HEAD)" = 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          python3 experiments/drnas_v16/patch_r17_risk.py --kissat-root /tmp/kissat-r6-patched
          (cd /tmp/kissat-r6-patched && ./configure && make -j2)
          strings /tmp/kissat-r6-patched/build/kissat | grep -Fq R17_RISK
          strings /tmp/kissat-r6-patched/build/kissat | grep -Fq R16_DECISION
      - name: Basic native SAT/UNSAT correctness for risk30 risk45 R16 and monitor
        run: |
          set -euo pipefail
          printf 'p cnf 2 2\n1 0\n2 0\n' > /tmp/r17-sat.cnf
          printf 'p cnf 1 2\n1 0\n-1 0\n' > /tmp/r17-unsat.cnf
          for mode in r5_monitor r11_2048_50 r16_live50 r17_risk30 r17_risk45; do
            set +e
            DRNAS_R12_DEGREE_CV=.28 DRNAS_R13_N=240 DRNAS_R16_GINI=.16 DRNAS_R16_POLARITY=.22 DRNAS_V177_MODE="$mode" /tmp/kissat-r6-patched/build/kissat -s /tmp/r17-sat.cnf > /tmp/r17-sat.log 2>&1
            sat=$?
            DRNAS_R12_DEGREE_CV=.28 DRNAS_R13_N=240 DRNAS_R16_GINI=.16 DRNAS_R16_POLARITY=.22 DRNAS_V177_MODE="$mode" /tmp/kissat-r6-patched/build/kissat -s /tmp/r17-unsat.cnf > /tmp/r17-unsat.log 2>&1
            unsat=$?
            set -e
            if [ "$sat" -ne 10 ] || [ "$unsat" -ne 20 ]; then
              echo "R17_NATIVE_SAT_UNSAT_FAIL mode=$mode SAT=$sat UNSAT=$unsat"
              cat /tmp/r17-sat.log /tmp/r17-unsat.log
              exit 1
            fi
          done
      - name: Real native R17 C/Python risk and benefit parity smoke
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r17_risk_benchmark.py --smoke

  benchmark:
    name: R17 true native risk model / ${{ matrix.category }}
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        category: [n200_development0, n200_development1, n200_test0, n200_test1,
                   n220_development0, n220_development1, n220_test0, n220_test1,
                   n240_development0, n240_development1, n240_test0, n240_test1,
                   community_n220_development0, community_n220_test0,
                   community_n240_development0, community_n240_test0]
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact original Kissat reference
        run: |
          set -euo pipefail
          git clone -q https://github.com/arminbiere/kissat.git /tmp/kissat-r6-original
          git -C /tmp/kissat-r6-original checkout -q --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          (cd /tmp/kissat-r6-original && ./configure && make -j2)
      - name: Compile exact pinned R17 risk-aware Kissat binary
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/drnas_v16/r17-frozen-model/risk_model.json)" = 93ce3a16d28cb90f2ba674e846a2740566414b6e
          git clone -q https://github.com/arminbiere/kissat.git /tmp/kissat-r6-patched
          git -C /tmp/kissat-r6-patched checkout -q --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          python3 experiments/drnas_v16/patch_r17_risk.py --kissat-root /tmp/kissat-r6-patched
          (cd /tmp/kissat-r6-patched && ./configure && make -j2)
      - name: Compile frozen unchanged V15.3.1 reference
        run: |
          set -euo pipefail
          test "$(git hash-object research/drnas-sat-v7-8/v1531_nohang.cpp)" = d280a2ffa28d72aec183323bbea40544d676112d
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra research/drnas-sat-v7-8/v1531_nohang.cpp -o /tmp/drnas-r6-v1531
      - name: Perform 210 SAT executions on genuinely new fixed seed formulas
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r17_risk_benchmark.py --category '${{ matrix.category }}'
          test -s 'drnas-r17-results/${{ matrix.category }}/measurements.csv'
          test -s 'drnas-r17-results/${{ matrix.category }}/traces.jsonl'
      - name: Upload raw and partial proof of execution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r17-${{ matrix.category }}
          path: drnas-r17-results/${{ matrix.category }}/
          if-no-files-found: warn
          retention-days: 60

  aggregate:
    name: R17 pair audit 3360 SAT attempts plus risk regression and formula bootstrap
    needs: benchmark
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: r17-*
          path: r17-download
          merge-multiple: false
      - name: Verify 16 shards, C/Python parity, prefix before action, independent holdout
        run: |
          set -euo pipefail
          python3 -m venv .r17venv
          .r17venv/bin/pip -q install matplotlib
          .r17venv/bin/python -u experiments/drnas_v16/r17_risk_analysis.py
          test -s drnas-r17-results/aggregate/results.json
          test -s drnas-r17-results/aggregate/paired.csv
          test -s drnas-r17-results/aggregate/native_risk_decisions.csv
          test -s drnas-r17-results/aggregate/risk_scatter_random3_test.png
      - name: Always upload final or incomplete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRNAS-R17-Frozen-Risk-True-Native-Prospective-Analysis
          path: drnas-r17-results/aggregate/
          if-no-files-found: warn
          retention-days: 90
      - name: Archive only a fully verified analysis in separate R17 branch
        if: success()
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/drnas-r17-risk-aware-frozen-20261102"
          mkdir -p experiments/drnas_v16/r17-results/current
          cp -a drnas-r17-results/aggregate/. experiments/drnas_v16/r17-results/current/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/drnas_v16/r17-results/current/
          if ! git diff --cached --quiet; then
            git commit -m "data: R17 prospective risk gate on new SHA-exclusive CNFs [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
