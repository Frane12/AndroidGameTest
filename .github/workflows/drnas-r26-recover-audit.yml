name: DRNAS R26 recover final audit from immutable 53-case artifacts
on:
  push:
    branches: [experiment/drnas-r26-native-algebra-cup-20261103]
    paths: ['.github/workflows/drnas-r26-recover-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audited_53:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate fixed analysis Python, don't rerun any benchmark
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/r26_algebra_cup.py
      - uses: actions/download-artifact@v4
        with:
          name: R26-frozen-53-inputs
          repository: Frane12/AndroidGameTest
          run-id: 41606832040
          github-token: ${{ github.token }}
          path: input
      - uses: actions/download-artifact@v4
        with:
          repository: Frane12/AndroidGameTest
          run-id: 41606832040
          github-token: ${{ github.token }}
          pattern: r26-shard-*
          path: combined
      - name: Audit all 636 attempts from same completed source artefacts
        run: |
          set -euo pipefail
          (cd input && sha256sum -c r26_all_53.sha256)
          python3 -u experiments/drnas_v16/r26_algebra_cup.py aggregate --inputs input --combined combined --out r26-final.json --md r26-final.md
          cat r26-final.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: DRNAS-R26-53-REPAIRED-AGGREGATE-ORIGINAL-45PCT-SELECTOR
          path: |
            input/manifest.json
            r26-final.json
            r26-final.md
          if-no-files-found: error
