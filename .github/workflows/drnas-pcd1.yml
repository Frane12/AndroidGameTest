name: DRNAS PCD1 parallel conflict discovery smoke
on:
  push:
    branches: [experiment/drnas-pcd1-parallel-conflict-20261111]
    paths:
      - research/drnas_pcd1.cpp
      - .github/workflows/drnas-pcd1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile PCD1 with thread sanitization checks
        run: |
          set -euo pipefail
          g++ -O2 -std=c++17 -pthread -Wall -Wextra -Werror research/drnas_pcd1.cpp -o /tmp/drnas-pcd1
          /tmp/drnas-pcd1 --selftest
          printf 'p cnf 4 4\n1 2 0\n1 -2 0\n-1 3 0\n-3 4 0\n' > /tmp/pcd1.cnf
          /tmp/drnas-pcd1 /tmp/pcd1.cnf 1 4 10000 | tee serial.log
          /tmp/drnas-pcd1 /tmp/pcd1.cnf 2 4 10000 | tee parallel.log
          grep 'original_CNF_unchanged=1 mode=shadow' parallel.log
          echo 'PCD1_SMOKE_PASS' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PCD1-smoke-logs
          path: |
            serial.log
            parallel.log
