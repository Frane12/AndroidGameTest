name: DRNAS REAL600 original CNF source-only freeze
on:
  push:
    branches: [experiment/drnas-core2-real600-20261115]
    paths: ['.github/workflows/drnas-real600-freeze.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 43724251555
          name: unified-core2-frozen
          github-token: ${{ github.token }}
          path: frozen/core2
      - uses: actions/download-artifact@v4
        with:
          run-id: 43613581688
          name: cf7-source-manifest
          github-token: ${{ github.token }}
          path: frozen/cf7
      - name: Restore development sources and freeze original CNFs
        run: |
          set -euo pipefail
          tar -xzf frozen/core2/unified-core2-frozen.tgz
          tar -xzf frozen/cf7/cf7_inputs.tgz
          python3 -u real600/freeze.py 2>&1 | tee real600-freeze.log
          tar -czf real600-sources.tgz real600_inputs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real600-source-audit
          path: |
            real600_inputs/manifest.json
            real600-freeze.log
          retention-days: 60
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: real600-frozen-sources
          path: real600-sources.tgz
          retention-days: 60
          if-no-files-found: error
