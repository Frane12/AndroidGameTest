name: DRNAS ATLAS1 exhaustive Boolean recipe library and SATLIB E2E
run-name: ATLAS1 four new rank14 A ATLAS1 Kissat CaDiCaL oneCPU
on:
  push:
    branches: [experiment/drnas-atlas1-boolean-library-20261111]
    paths:
      - research/drnas_atlas1_generate.py
      - research/drnas_atlas1.cpp
      - research/drnas_atlas1_bench.py
      - research/drnas_atlas1_smoke.py
      - research/drnas_native_core_r3c.cpp
      - .github/workflows/drnas-atlas1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  micro:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install compiler and reference solver
        run: |
          set -euo pipefail
          python3 -m py_compile research/drnas_atlas1_bench.py research/drnas_atlas1_generate.py research/drnas_atlas1_smoke.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cadical
      - name: Build pinned Kissat
        run: |
          set -euo pipefail
          mkdir -p mre_atlas1/bin
          git clone --quiet https://github.com/arminbiere/kissat.git mre_atlas1/kissat-src
          git -C mre_atlas1/kissat-src checkout --detach 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          (cd mre_atlas1/kissat-src && ./configure && make -j2)
          install -m 755 mre_atlas1/kissat-src/build/kissat mre_atlas1/bin/kissat
          install -m 755 "$(command -v cadical)" mre_atlas1/bin/cadical
      - name: Generate 2 3 4 variable NPN and equivalent CNF atlas offline
        run: |
          set -euo pipefail
          python3 research/drnas_atlas1_generate.py --out mre_atlas1/atlas1_table.hpp
      - name: Build independent native DRNAS and exhaustive atlas selftest
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -I mre_atlas1 research/drnas_atlas1.cpp -o mre_atlas1/bin/drnas_atlas
          mre_atlas1/bin/drnas_atlas --atlas-selftest
          g++ -std=c++17 -O2 research/drnas_native_core_r3c.cpp -o mre_atlas1/bin/selftest
          mre_atlas1/bin/selftest --selftest
          python3 research/drnas_atlas1_smoke.py
      - name: Prospective original SHA and single CPU SATLIB E2E PAR2
        env:
          MICRO_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          taskset -c "$(taskset -pc $$ | sed 's/.*: //' | cut -d, -f1 | cut -d- -f1)" python3 -u research/drnas_atlas1_bench.py | tee mre_atlas1/benchmark.log
          grep '^MICRO_FINAL ' mre_atlas1/benchmark.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-ATLAS1-SHARD-${{ matrix.shard }}-AUDIT
          retention-days: 30
          path: |
            mre_atlas1/audit.json
            mre_atlas1/source.json
            mre_atlas1/*.cnf
            mre_atlas1/*.log
            mre_atlas1/route_decision.json



