name: DRNAS R56 source-only structural signal forensic 22 SATComp2026
on:
  push:
    branches: [experiment/drnas-r56-structural-signal-audit-20261103]
    paths:
      - '.github/workflows/drnas-r56-structural-signal-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: drnas-r56-structural-features-20261103
  cancel-in-progress: false
jobs:
  forensic:
    name: R56 audit pre-solver structure against R52 and R55b actual outcomes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate source-only analyzer and mathematical proof code
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/drnas_v16/r56_structural_signal_audit.py
          python3 -u experiments/drnas_v16/r49_pivot_coherence_gate.py selftest
      - uses: actions/download-artifact@v4
        with:
          name: r52-frozen-official-originals
          run-id: 41684183452
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r52-src
      - uses: actions/download-artifact@v4
        with:
          name: r55b-prospectively-frozen-real2026
          run-id: 41691243486
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r55b-src
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-R52-FRESH-SATCOMP2026-MATCHED-REFERENCE-FINAL
          run-id: 41684183452
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r52-report
      - uses: actions/download-artifact@v4
        with:
          name: DRNAS-R55B-FRESH-2026-HEAD24-HOLDOUT-FINAL
          run-id: 41691243486
          repository: Frane12/AndroidGameTest
          github-token: ${{ github.token }}
          path: r55b-report
      - name: Verify all archived official CNF file SHA
        run: |
          set -euo pipefail
          (cd r52-src/originals && sha256sum -c source.sha256)
          (cd r55b-src/fresh && sha256sum -c source.sha256)
          test -s r52-report/r52-final.json
          test -s r55b-report/r55b-final.json
      - name: Extract raw implication structure and evaluate tiny sample leave-one-case-out (no new timing)
        run: |
          set -euo pipefail
          python3 -u experiments/drnas_v16/r56_structural_signal_audit.py \
            --r52-sources r52-src/originals --r55b-sources r55b-src/fresh \
            --r52-report r52-report/r52-final.json \
            --r55b-report r55b-report/r55b-final.json \
            --json r56-results.json --md r56-results.md | tee r56-live.log
          cat r56-results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRNAS-R56-22-OFFICIAL-CNF-STRUCTURAL-FEATURES-AUDIT
          path: |
            r56-results.json
            r56-results.md
            r56-live.log
          if-no-files-found: warn
